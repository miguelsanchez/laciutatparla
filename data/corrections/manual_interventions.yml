  tipus_entitat: av
  idioma_original: valenciano
  text_original: 'Hola, bon dia.

    Senyor alcalde, regidores, regidors i persones presents.

    Aprofite per enviar una salutació a la primera tinenta d’alcalde Sandra Gómez esperant prompta recuperació.


    Soc Gemma Piqué, membre de l’Associació d’Hostaleria Albarca, amb més de vint anys d’història i portaveu
    del col·lectiu Ciutat Vella i Viva que engloba diverses associacions: comerç tradicional i modern,
    associacions culturals i col·lectius veïnals. Gent que estima, viu i treballa cada dia al nostre centre
    històric.


    Sabut és el paper regenerador que l’hostaleria ha tingut al barri del Carme, contribuint de manera
    efectiva a canviar la imatge de degradació i marginalitat que teníem als anys 80/90 per l’actual,
    en què amb treball i esforç hem passat a ser el referent turístic de la ciutat.


    Des de la posada en marxa de la ZAS a l’any 2010 hem reclamat el compliment de les mesures cautelars,
    que tant l’anterior govern com l’actual no han arribat a dur a terme. Mesures com la persecució del
    botellot i els llauners; mediadors socials formats per a pal·liar qualsevol problema de soroll, en
    contacte amb la Policia; Policia en el carrer controlant les males pràctiques, si es dóna el cas,
    de la ciutadania; campanyes reals de conscienciació ciutadana en tots els locals, així com al carrer
    i per la ciutat; polítiques educatives per tal de conscienciar al nostre jovent del respecte que es
    deu tindre a les persones que viuen als habitatges, per cert, cada vegada més cars i més plens de
    vivendes turístiques no sempre legals.


    Tot això es diu voluntat política i inversió real per a pal·liar el soroll, que per altra banda, tot
    i haver de conviure amb nous fenòmens com el turisme creixent i els pisos turístics, i gràcies al
    treball dels xicotets locals d’hostaleria, la reducció del trànsit i la limitació horària de certes
    activitats, s’han aconseguit reduir de manera significativa els registres de tots els sonòmetres.


    I de sobte, es trobem amb una tramitació de les mesures definitives de la ZAS que es du a terme a
    esquenes dels sectors implicats, sense un diàleg i una coherència mínimes, passant per alt les més
    de 100 al·legacions presentades per veïnes, veïns, comerços i locals del barri que encara estan per
    notificar en la seua majoria.


    A falta d’imaginació, la mesura estrela es el càstig als xicotets hostalers amb la retallada de mitja
    hora de terrassa, fonamental per a la viabilitat dels nostres negocis, privant a les nostres pime
    i treballadors i treballadores de més de 8.000 hores de treball anuals, 300 persones al carrer i 150
    llocs de treball fora.


    No és cert que una ZAS tinga que implicar retalls horaris. El que diu la llei és que s’apliquen mesures
    per a pal·liar el soroll que cada vegada és menor i no és precisament produït per les terrasses, que
    s’inverteixen en fer-les possibles i que es revisen tantes vegades com calga aquestes mesures, i faça
    els canvis que considere consensuats amb totes les parts afectades. I vostés això no han fet.


    I per si no hi haguera prou, la senyora Pilar Soriano es dedica a experimentar traent-se de la mànega
    un nou punt que dóna més horari a les botigues de conveniència i locals de menjar per a emportar-se’l
    pel carrer, generant soroll, brutícia i fonamentant el botellot. És este el públic que volem al nostre
    centre històric? Nosaltres no. No volem turisme de borratxera, no volem hoolingans. Volem un turisme
    de qualitat, educat. I volem que els nostres veïns i veïnes se senten a les nostres terrasses.


    Este col·lectiu per tant li demana que faça valdré el seu poder, reconega els seus errors i paralitze
    aquesta barbaritat que està a punt d’aprovar, si no vol passar a la història com la regidora que va
    imposar de manera tossuda unes mesures definitives que empitjoraran els resultats de les provisionals.
    Si no es així, senyora Pilar Soriano, dimitisca, abandone el seu lloc i deixe a persones disposades
    a treballar seriosament per una Ciutat Vella, sí, però viva a la vegada.


    Moltes gràcies.'
  reason: 'Acta: 4t. Intervé la Sra. Gemma Piqué Codina, en representació de l’Associació Albarca; missed
    by extraction.'
  date: '2026-10-20'
  finding: E1b-41c701988b
  text_cas: 'Hola, buenos días.

    Señor alcalde, concejalas, concejales y personas presentes.

    Aproveche para enviar un saludo a la primera teniente de alcalde Sandra Gómez esperando pronta recuperación.


    Soy Gemma Piqué, miembro de la Asociación de Hostelería Albarca, con más de veinte años de historia
    y portavoz del colectivo Ciutat Vella i Viva que engloba diversas asociaciones: comercio tradicional
    y moderno, asociaciones culturales y colectivos vecinales. Gente que ama, vive y trabaja cada día
    en nuestro centro histórico.


    Es sabido el **papel regenerador que ha tenido la hostelería** en el barrio del Carme, contribuyendo
    de manera efectiva a cambiar la imagen de degradación y marginalidad que teníamos en los años 80/90
    por la actual, en que con trabajo y esfuerzo hemos pasado a ser el **referente turístico de la ciudad**.


    Desde la puesta en marcha de la ZAS en el año 2010 hemos reclamado el **cumplimiento de las medidas
    cautelares**, que tanto el anterior gobierno como el actual no han llegado a llevar a cabo. Medidas
    como la **persecución del botellón y los vendedores ambulantes**; **mediadores sociales** formados
    para paliar cualquier problema de ruido, en contacto con la Policía; **Policía en la calle** controlando
    las malas prácticas, si se da el caso, de la ciudadanía; **campañas reales de concienciación** ciudadana
    en todos los locales, así como en la calle y por la ciudad; **políticas educativas** para concienciar
    a nuestra juventud del respeto que se debe tener a las personas que viven en las viviendas, por cierto,
    cada vez más caras y más llenas de **viviendas turísticas no siempre legales**.


    Todo esto se llama **voluntad política e inversión real** para paliar el ruido, que por otra parte,
    a pesar de tener que convivir con nuevos fenómenos como el turismo creciente y los pisos turísticos,
    y gracias al trabajo de los pequeños locales de hostelería, la **reducción del tránsito** y la **limitación
    horaria de ciertas actividades**, se han conseguido reducir de manera significativa los registros
    de todos los sonómetros.


    Y de repente, nos encontramos con una **tramitación de las medidas definitivas de la ZAS** que se
    lleva a cabo a espaldas de los sectores implicados, sin un diálogo y una coherencia mínimos, pasando
    por alto las **más de 100 alegaciones presentadas** por vecinas, vecinos, comercios y locales del
    barrio que aún están por notificar en su mayoría.


    A falta de imaginación, la medida estrella es el **castigo a los pequeños hosteleros** con la **reducción
    de media hora de terraza**, fundamental para la viabilidad de nuestros negocios, privando a nuestras
    pymes y trabajadores y trabajadoras de más de 8.000 horas de trabajo anuales, 300 personas en la calle
    y 150 puestos de trabajo fuera.


    No es cierto que una ZAS tenga que implicar recortes horarios. Lo que dice la ley es que se aplican
    medidas para paliar el ruido que cada vez es menor y no es precisamente producido por las terrazas,
    que se invierten en hacerlas posibles y que se revisan tantas veces como sea necesario estas medidas,
    y haga los cambios que considere **consensuados con todas las partes afectadas**. Y ustedes eso no
    han hecho.


    Y por si fuera poco, la señora Pilar Soriano se dedica a experimentar sacándose de la manga un nuevo
    punto que da más horario a las tiendas de conveniencia y locales de comida para llevar por la calle,
    generando ruido, suciedad y fomentando el botellón. ¿Es este el público que queremos en nuestro centro
    histórico? Nosotros no. **No queremos turismo de borrachera, no queremos ultras. Queremos un turismo
    de calidad, educado.** Y queremos que nuestros vecinas y vecinos se sientan en nuestras terrazas.


    Este colectivo por tanto le pide que haga valer su poder, reconozca sus errores y **paralice esta
    barbaridad** que está a punto de aprobar, si no quiere pasar a la historia como la concejala que impuso
    de manera obstinada unas medidas definitivas que empeoraran los resultados de las provisionales. Si
    no es así, señora Pilar Soriano, **dimita, abandone su puesto** y deje a personas dispuestas a trabajar
    seriamente por una **Ciutat Vella viva a la vez**.


    Muchas gracias.'
  resum_cas: La Asociación ALBARCA reclama el cumplimiento de las medidas cautelares de la ZAS del Carme
    y se opone a los recortes horarios de terrazas propuestos en las medidas definitivas, argumentando
