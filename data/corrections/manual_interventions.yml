  idioma_original: castellano
  text_original: 'Sra. Alcaldesa, Dª Rita Barberá, Sres. Concejales.

    El pasado 31 de octubre conocimos la decisión del Consejo de Ministros solicitando al presidente del
    Gobierno el desistimiento de los recursos de inconstitucionalidad interpuestos contra el Decreto Ley
    1/2010, de 7 de enero, del Consell de la Generalitat Valenciana, de Medidas de Protección y Revitalización
    del Conjunto Histórico de la Ciudad de Valencia, y contra la Ley 2/2010, de 31 de marzo, de la Generalitat,
    de Medidas de Protección y Revitalización del Conjunto Histórico de la Ciudad de Valencia, y el anuncio
    de la Generalitat Valenciana de elevar a la Comisión Bilateral de Cooperación con el Estado su compromiso
    de presentar en el parlamento autonómico, en el plazo de tres meses, un proyecto de ley de derogación
    de la Ley de la Generalitat Valenciana de Medidas de Protección y Revitalización del Conjunto Histórico
    de la Ciudad de Valencia, comprometiéndose ambas partes, Gobierno de España y Generalitat Valenciana,
    a estudiar, junto con el Ayuntamiento de Valencia, las fórmulas que permitan promover una adaptación
    del Plan Especial de Protección y Reforma Interior (PEPRI) que garantice la protección de los valores
    histórico-artísticos que motivaron la protección del Cabanyal en los términos previstos en la Orden
    del Ministerio de Cultura del 29 de diciembre de 2009, al tiempo que hasta que se concluya la adaptación
    del citado PEPRI la Generalitat Valenciana también se compromete a adoptar las medidas necesarias
    para garantizar el mantenimiento de la suspensión de la ejecución del Plan Especial de Protección
    y de Reforma Interior del Conjunto Histórico del Cabanyal por el Ayuntamiento de Valencia, en los
    términos previstos en la mencionada Orden ministerial del 29 de diciembre por la que se resuelve el
    procedimiento por expoliación del conjunto histórico del Cabanyal.

    Dª Rita, para mí esto es muy importante, no sé para usted. Yo he venido para que me escuche, por favor.
    Continuo, necesito su atención. Soy una ciudadana que he venido aquí con bastante nerviosismo y espero
    que usted atienda mis reivindicaciones.

    Muy bien, de acuerdo. Gracias.

    Como resultado de esta decisión, el presidente del Consell destacó ''el camino de consenso y diálogo
    iniciado en el Cabanyal'', sin duda referido a las desavenencias entre las tres administraciones involucradas.
    No sabemos muy bien si en ese camino desde alguna de las tres administraciones hay previsto abrir
    el diálogo para propiciar el consenso con los que venimos padeciendo las consecuencias de la mala
    gestión política, que ahora parece reconocer el presidente del Consell, el Sr. Alberto Fabra. Al fin
    y al cabo están hablando de nuestro barrio, en el que vivimos y algunos trabajamos, y por supuesto
    es mucho lo que podemos y tenemos que opinar al respecto.

    Lógicamente el diálogo para buscar el consenso hay que propiciarlo con aquellos que difieren de nuestros
    puntos de vista, pero que están abiertos a él.

    Sin embargo de las palabras de la Sra. Alcaldesa no se desprende esta actitud: ''Yo voy a seguir trabajando,
    pasito a pasito, con tranquilidad, evidentemente con la mayoría de los vecinos que viven allí, los
    que quieren el proyecto''. Debería tener en cuenta la Sra. Alcaldesa que en las pasadas elecciones
    municipales,

    Si no me deja continuar no podré.'
