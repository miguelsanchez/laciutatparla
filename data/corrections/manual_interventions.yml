    sense poder fugir? Es han parat a mirar les seues expressions quan són immobilitzats? Els han vist
    lluitant per a escapar? Han observat com respiren mentre avança la festa? Coneixen la pèrdua de pes
    per l''estrés que patixen en el transport? Han intentat per un moment posar-se en el seu lloc?


    Fa uns mesos lliurem als responsables de Benestar Animal d''este Ajuntament **els nostres informes
    sobre el patiment físic i emocional** al qual són sotmesos estos animals. No vaig a insistir en el
    que argumentem, però no els càpiga dubte que tota la informació que aporten és rigorosament certa
    i **justifica sense cap dubte la decisió d''este govern municipal que com a veterinaris aplaudim**.


    No som els únics professionals de la sanitat i del benestar animal que a Europa ens manifestem contra
