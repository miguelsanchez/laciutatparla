  tipus_entitat: educacio
  idioma_original: valenciano
  text_original: 'Bon dia.


    Sóc [***], presidenta de l’AMPA del Col·legi Lluís de Santàngel, del Saler. Agraisc en nom de tots
    que ens deixen intervindre en este ple.


    Precisament fa un any vam estar ací en la sessió ordinària del 28 de setembre de 2012 exposant el
    mateix problema que exposarem. Abans de reiterar-ho, volem recordar-los que el portaveu del Grup Popular,
    Sr. Grau, va dir, i llig textualment: ‘He escuchado con atención la intervención de los representantes
    del AMPA y vuelvo a decir que me parecen muy razonables sus quejas y estoy convencido que tanto el
    concejal responsable de Educación como el de Pedanías están por resolver el tema. Y no les quepa la
    menor duda que estarán a su lado para reclamar y buscar una solución a los temas que ustedes han planteado’.
    També va afegir: ‘Todo nuestro interés en buscarle solución a ese problema que han expuesto y que
    me parece grave y preocupante, lo digo; y nos vamos a volcar en buscarle solución’.


    Doncs bé, senyors, senyores, senyora alcaldessa, després d’un any seguim igual. Açò és un suspens
    en el col·legi doncs no han fet els deures tal com ens van prometre.


    Venim a reclamar el següent: vivim en una zona (pedanies del Sud) on hi ha un sol col·legi públic,
    ubicat en la pedania del Saler. Engloba a xiquets del Perellonet, el Palmar i la devesa del Saler.
    Per tant, els nostres fills estan obligats a desplaçar-se fins més de 12 km. Que els nostres fills
    vagen a este col·legi no és un capritx, en el 2002 van tancar el col·legi del Palmar i en el 2010
    el del Perellonet. I els responsables d’Educació ens van assegurar que els nostres xiquets tindrien
    transport sense condicionar-ho a cap altre requisit, com la renda, etc.


    L’Administració va decidir que per a economitzar se subvencionava el menjador per a no haver de posar
    línies d’autobusos al migdia. No obstant això, l’any passat i este, sense justificació, per mitjà
    de les ordes i resolucions corresponents, es va decidir llevar el servici d’autobusos per als xiquets
    d’infantil i batxillerat i condicionar l’accés gratuït al servici de menjador per a l’ensenyança obligatòria,
    és a dir, primària i ESO. Cert és que enguany, i de manera provisional, tant els xiquets d’infantil
    com els de batxillerat estan pujant a l’autobús; però els d’infantil només els que tinguen germans
    en primària, discriminant als qui no en tenen..


    Concretament, al Palmar no pugen 8 xiquets; al Perellonet, 17; a la Devesa, 8; total, uns 28 xiquets
    sense poder pujar a l’autobús, sabent a més que hi ha places lliures en els autobusos i no s’entén
    com no es puguen fer ús. A més, creant un altre greuge comparatiu amb les pedanies del Nord on sí
    pugen a l’autobús tots els xiquets d’infantil independentment tinguen germans o no. La nostra situació
    es veu agreujada per la deficiència en els servicis públics de transport ja que esta línia regular
    passa cada hora i concretament al Palmar només cinc autobusos al dia, un altre problema que no s’ha
    tingut en compte.


    Paguem els nostres impostos com tots els ciutadans de València, doncs les pedanies del Sud som part
    d’este municipi; però això sí, amb servicis de tercera. No estem demanant luxes ni capritxos estem
    reivindicant que els nostres fills puguen accedir a una escola pública en igualtat de condicions que
    la resta de ciutadans, tenint en compte les peculiaritats de la nostra zona on vivim actualment més
    de 4.000 habitants censats.


    Esperem que el nostre Ajuntament pose una solució i no haver d’esperar un altre any.


    Moltes gràcies per la seua atenció.'
  reason: 'Acta: ''En segundo lugar, interviene Dª. ******, en representación de la AMPA del CEIP Lluís
