  text_cas: 'Presidente, alcalde, concejales, vecinos y aficionados al mundo del toro, y vecinos de Valencia.
    Estoy aquí hoy en representación de todas las peñas de Valencia, sobre todo de las pedanías. Con una
    preocupación muy grande y una preocupación que queremos trasladar a todos ustedes. ¿Por qué? Porque
    representamos a diferentes sentimientos sociales, a diferentes formas de pensar políticamente.


    Como representamos a diversas formas de pensar y de voto, no vamos a meternos en contra de ningún
    partido, por supuesto. Pero sí que vamos a transmitir nuestra preocupación porque este Gobierno en
    su día permitió una **Valencia plural, abierta, democrática**, con libertad de expresión y sobre todo
    que defendiera la cultura, que defendiera el deporte, que defendiera todas las formas sociales de
    entender nuestra **cultura valenciana** sea de un lado que sea. Y nos ilusionamos, nos ilusionamos
    por ese nuevo gobierno.


    Pero resulta que no fue así, que al final todo es como hace tres años en el mismo lugar que estamos
    ahora donde hace tres años nos **prohibió el toro embolado**. Dentro de nuestra línea de extender
    las manos a todas las entidades políticas lo que hicimos es meternos a trabajar porque entendamos
    que hay un encanto diferente en este Gobierno, en este Pleno respecto a los animales. Nos metimos
    a trabajar a ver si hacemos algo mal, a ver si realmente hay ese maltrato. Comenzamos a tener reuniones
    con la Generalitat Valenciana que de hecho es la misma administración que todos ustedes, Compromís
    y PSOE. Nos metimos a trabajar de la mano de la Policía Autonómica que está regida también por todos
    ustedes.


    Nos metimos a trabajar de la mano de **veterinarios**, tan necesarios en esta fiesta. Pero **veterinarios
    de la Administración**, no privados. Porque yo puedo buscar a un veterinario privado y que diga lo
    que yo quiera. No, veterinarios de la Administración que han dicho realmente qué es el maltrato. En
    eso nos basamos para decir que **no hay maltrato**, no como todos ustedes. A mí me gustaría que la
    Sra. Gloria Tello me dijera realmente en qué se ha basado usted para decir que hay maltrato, en qué
    actividad científica. No porque es su opinión porque opiniones todos tenemos las nuestras y muchas
    veces tenemos educación y nos las guardamos.


    Hemos llegado más lejos y de hecho hemos hecho dos viajes. Uno lo hicimos a tierras de Navarra donde
    recientemente se había puesto en entredicho también la fiesta popular y estuvimos hablando con gente
    de Bildu, con concejales de Bildu. ¿Y saben qué nos dijeron? Que **sí al toro**. No se han negado
    en ningún momento, ni dicen que hay maltrato. No se les ocurrió tocar el toro. Sí, dejen hablar Sr.
    Grezzi que yo no digo nada cuando usted está hablando.


    Hemos ido también a Cataluña, una tierra tan cerca de todos ustedes, donde nos hemos reunido con alcaldes
    de ERC en las Tierras del Ebre. ¿Y saben qué nos dicen? Que **prohibido tocar el toro embolado**.
    Sí, es su entorno, ¿vale? Prohibido tocar el toro embolado. En consecuencia, cada vez entendemos menos
    esto.


    Sra. Tello, usted posiblemente tenga un mérito y sea el de haber conseguido en su Concejalía de Bienestar
    Animal enfrentar a dos partes tan contrarias como es el PACMA, que el otro día salió la presidenta
    diciendo la **nefasta gestión de su concejalía** y de usted misma, eso está en el periódico, no me
    lo invento yo, y la de la gente del toro. O sea, dos partes tan contrarias va usted a conseguir meterlas
    de acuerdo con su nefasta gestión.


    Por tanto, lo que pedimos aquí a todos ustedes, concejales, personas que tienen la palabra, usted
    Consol estaba el otro día en pedanías y escuchó a **más de 200 personas** lo que clamaban. **Clamaban
    toro embolado**. Puede gustar más, puede gustar menos, estamos de acuerdo. Si a ustedes no les gusta
    el toro no participan. Pero usted va a ver el pueblo y aquí al final el alcalde, el Sr. Ribó, los
    concejales dicen y se jactan de decir que son **la voz del pueblo**. El pueblo también es taurino,
    hay una parte del pueblo que es taurina y no una parte pequeña. Por tanto, si no quieren estar en
    contra de esa parte del pueblo que ustedes dicen que representan. Si quieren estar con sus alcaldes,
    como el alcalde de Borbotó y todos los alcaldes de Compromís de todos los pueblos: de Foios, de Albalat,
    de Meliana, de Rafelbunyol, de todos los pueblos que ustedes quieran que están ustedes gobernando
    han de **darnos apoyo**. Si no es así, de momento ya digamos que **no creemos en la clase política**,
    que **no creemos en la democracia**. Por tanto, la votación de hoy ha de ser **a favor del toro embolado**.'
