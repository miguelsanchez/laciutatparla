  text_original: 'Buenos días.

    Como representante de Fapa-Valencia tomo la palabra en nombre de todas nuestras AMPA federadas y sobre
    todo en nombre de las 127 AMPA federadas para hacer algunas aportaciones a la moción que hoy el PSPV-PSOE
    presenta en este Ayuntamiento.

    La Conselleria ha hecho oídos sordos a la actividad reivindicativa y a las alegaciones presentadas
    contra la planificación educativa para el curso 2014-2015 por la cual se modifican para el próximo
    curso las plantillas de los colegios de primaria y la eliminación de unidades de infantil y primaria.
    Por eso, FAPA-Valencia ha dado un paso más para decir no al arreglo escolar y de esta manera ha presentado
    un recurso de reposición con todas aquellas AMPA que han querido adherirse a presentar conjuntamente
    el documento legal.

    De entre las AMPA de centros públicos que se han unido a presentar conjuntamente el recurso de reposición
    de Valencia ciudad encontramos al CEIP la Amistad, Santo Ángel de la Guarda, Miguel Hernández, Profesor
    Ramiro Jover, Horno de Alcedo, Castellar-Oliveral, Federico García Lorca, Sara Fernández, el 103,
    el Sector Aéreo y el Tomás de Villaroya. Al recurso de reposición se acompañan de nuevo las alegaciones
    presentadas por cada AMPA que lo interpone y que corresponden a cada una de las problemáticas particulares
    generadas en los centros públicos como consecuencia de la aplicación del arreglo escolar.

    FAPA-Valencia alerta al recurso de los perjuicios que ocasionará la supresión de unidades en estos
    centros, como por ejemplo la eliminación de la posibilidad de estudiar en valenciano, la supresión
    de lugares de trabajo docente que nunca se recuperarán, la implantación a los centros de unidades
    mixtas donde se cursan niveles distintos lo que hará aumentar el fracaso escolar, la obligatoriedad
    de elegir un centro que no esté en la zona de influencia del alumnado e incluso la desaparición de
    centros educativos públicos. Detrás del arreglo escolar hay una clara intención ideológica de favorecer
    la escuela privada-concertada y de desmantelar la escuela pública.

    Así mismo queremos denunciar el malestar de las pedanías que pertenecen a Valencia ciudad, como por
    ejemplo Horno de Alcedo y Castellar-Oliveral, para manifestarle el malestar de toda la comunidad educativa
    de estos núcleos porque la Conselleria de Educación no quiere garantizar el uso del transporte escolar
    y eso margina a las pedanías. Con la aplicación de la zona única en Valencia ciudad aquellos que pidan
    un centro lejos de su domicilio tendrán que pagar íntegramente el servicio de transporte escolar y,
    por supuesto, la Conselleria dejará de invertir en aquellos centros que sean menos demandados, abandonándolos
    y convirtiéndolos en asistenciales.

    Por todo ello, solicitamos que antes de tomar estas decisiones se debía crear una comisión conjunta
    del Ayuntamiento y la comunidad educativa antes de tomar estas drásticas decisiones.'
  date: '2026-10-19'
