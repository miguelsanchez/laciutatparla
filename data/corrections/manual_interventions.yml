  intervinient: '[***]'
  entitat: Asociación de Veíns Plaça de Múrcia / Asociación Vecinal Fuensanta
  tipus_entitat: av
  idioma_original: castellano
  text_original: 'Hola, soy vecina del barrio de La Fuensanta, 42 años. Toda mi vida ahí, nacida aquí.
    Expongo los asuntos a solucionar. Primero, siendo la infancia y la juventud una prioridad, lamentablemente
    hemos tenido que recurrir al concurso del decidimVLC para pedir renovación completa y ampliación de
    dos parques infantiles en situación lamentable. Exigimos la limpieza constante e intensa. Que se realice
    una poda adecuada ya de una vez para suprimir las ramas cercanas a las fachadas que están utilizando
    las ratas para colonizar nuestras casas. El mobiliario urbano es inexistente en parte del barrio y
    tanto las personas mayores como los jóvenes estudiantes de Misericordia o colegios cercanos no pueden
    descansar o dejar los restos de almuerzo en una papelera. Sustitución de farolas existentes, modelos
    autopistas, por deficientes y obsoletas que generan una inseguridad real tanto en lo diferentes tropiezos
    al andar como la existencia de múltiples espacios oscuros en muchos puntos de mi barrio. Exigimos
    que no se cierre el centro de salud. Estamos intranquilos al respecto ya que se cerró el centro de
    asuntos sociales, cosa que en mi barrio se necesita mucho. En materia de empleo solicitamos la presencia
    del autobús Labora una vez al mes en la barriada para fomentarlo, para darle vitalidad a la juventud.
    En materia de vivienda hay que parar los desahucios si no les ofrecen una alternativa habitacional.


    Para concluir, quisiera destacar y dar las gracias a [***], aquí mi compañera presente y vecina, que
    está realizando una importante recogida de firmas al respecto.'
