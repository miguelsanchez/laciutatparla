  entitat: Hermandad Nacional Monárquica
  tipus_entitat: altres
  idioma_original: castellano
  text_original: 'Buenas tardes, bona vesprada a tots i totes. Gràcies, señora vicealcaldesa.


    Mi nombre es [***]. Soy vecino de la ciudad de València y miembro de la Hermandad Nacional Monárquica,
    su delegación de València. Quiero agradecer el espacio que nos ha cedido la sociedad Lo Rat Penat
    para poder participar en este pleno.


    Antes de leerles el comunicado en relación al asunto que toca en el presente punto, me gustaría explicarles
    que la Hermandad Nacional Monárquica es una asociación que recoge personas de diferentes sensibilidad
    sin adscripción política y que nos une los valores constitucionales y la defensa de la monarquía parlamentaria,
    que es el sistema que nos ha permitido pasar una etapa fantástica en este país de estabilidad y de
    desarrollo.


    Desde la Delegación de València de la Hermandad Nacional Monárquica de España queremos trasladar nuestra
    desaprobación ante la actitud mostrada por el actual equipo de gobierno del Ayuntamiento de València,
    liderado por su alcalde, don Joan Ribó Canut, ante lo que consideramos una constante afrenta ante
    una de las instituciones más representativas de nuestro Estado de Derecho y de la Constitución, como
    es la figura de Su Majestad el Rey de España. Más allá de las diferentes manifestaciones verbales,
    de gestos y ausencias por parte de este ejecutivo local ante todo aquello que tenga que ver con la
    más alta representación del Estado, se quiere someter a la aprobación en el Pleno una iniciativa planteada
    por el Grupo Municipal Compromís, con el apoyo del Grupo Socialista, en torno a la modificación del
    Reglamento de Honores y Distinciones, vigente desde el año 1984, en el que se pide la retirada de
    la figura del jefe del Estado como posible merecedor de los mencionados honores y distinciones.


    Consideramos que una iniciativa como esta, carece de total justificación o oportunidad y lealtad a
    la realidad mayoritaria de la ciudadanía, utilizando las propias instituciones del sistema para cargar
    contra el propio sistema que entre todos nos hemos dado. Vemos este hecho como una desafortunada ocurrencia
    cargada de intención partidaria y política unilateral, haciendo uso de su actual mayoría en el pleno
    para sembrar un hecho a todas luces innecesario, cargado de una incomprensible resentimiento hacia
    una institución del Estado refrendada en la Constitución de 1978, que es la que permite que los representantes
    locales puedan ejercer su función como tales. Una ironía.


    Por tanto, exigimos a los miembros del equipo del actual gobierno de la tercera capital de España
    a reconsiderar este despropósito y hacer honor a la historia, la tradición y el honor demostrado a
    través de los siglos de esta gran ciudad, nuestra ciudad, que en su heráldica cuenta con la doble
    L por haber sido dos veces leal a la corona.


    A esta sociedad valenciana nos gustaría dirigirnos, que refleja una mayoría silenciosa y discreta,
    trabajadora, como dice nuestro alcalde, que valora y reconoce el papel del actual jefe del Estado
    y la monarquía parlamentaria como sistema de gobierno, les animamos desde aquí a levantar la voz,
    a mostrar con orgullo su sentimiento monárquico ampliamente mayoritario, a dejar de mostrar pasividad
    ante los ataques hacia una manera de sentir y concebir la representación institucional, y hacer llegar
    a aquellos que ostentan el poder, ustedes, que es obligación y responsabilidad es la de gobernar para
    todos y no la de desperdiciar el tiempo, el dinero, la confianza de todos aquellos a los que deben
    representar. Y si me permiten, con la que está cayendo.


    ¡Visca València! ¡Viva España! ¡Viva el Rey!'
  reason: 'Acta: Lo Rat Penat cedes its turn to the Hermandad Nacional Monárquica; speech not extracted
    (E1: 4 blocks, 3 extracted).'
