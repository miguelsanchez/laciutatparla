- id: 2026-04-30-101
  pleno_id: '2026-04-30'
  ordre: 6
  intervinient: Gregorio M. Fidel Sarmiento
  entitat: AVV Campanar
  tipus_entitat: av
  idioma_original: valenciano
  text_original: 'Moltes gràcies. Bon dia.


    Per desgràcia, sóc l''únic representant del moviment veïnal que segurament ha pogut improvisar una
    intervenció en aquest Ple i en aquesta proposta de modificació del Pla general que tant ens va afectar
    a molts i molts barris de la ciutat, no solament a Campanar. Campanar, per a qui no ho sàpiga, va
    patir una terrible agressió en el seu patrimoni en la dècada dels 90-2000 per la creació del barri
    de Nou Campanar, que va arrasar una partida fonamental en la història de l''horta de València, el
    Pouet, on es varen arrasar 60.000 metres quadrats d’horta productiva. I jo tinc el record d''alguns
    dels últims habitants de l''horta de Campanar, dels que podria donar noms i cognoms, de com es va
    emprar d''una manera arterosa i criminal l''emplaçament del mercat de les Canyes, de l’anomenat mercat
    de les Canyes, el punt més calent del tràfic de drogues de la ciutat durant anys i anys, per acabar
    d’avorrir els llauradors i als últims habitants de l''horta de Campanar i que vengueren a qualsevol
    preu als promotors que volien construir en el Nou Campanar. Podria parlar amb noms i cognoms de personatges
    implicats en aquella operació que han acabat sent ministres, consellers i dels que no oblidaré mai
    el seu treball en Campanar.


    Després, per si no n''hi haguera poc, uns anys després, este Ajuntament va concedir a Rainforest una
    concessió per a un parc -segons declaracions de la mateixa alcaldessa- modèlic, únic en el planeta,
    amb un projecte sostenible i redó d''ampliació que ha deixat en l''abandó peces fonamentals del patrimoni
    arquitectònic de l''horta. L''alqueria del Rei ha estat caient-se fins fa quatre dies, un edifici
    tardogòtic del segle XV, així com les cases de Figuerols, que són l''única resta de barraques amb
    parets d''adob que queden en tota l''horta de València.


    I tot eixe patrimoni ara està amenaçat quan estem dins del PATH, estem qualificats de zona d''horta
    de màxima protecció per un projecte faraònic, no es pot fer d''una altra manera, que preveu la construcció
    de pagodes xineses, de piràmides egípcies, d''un parc aquàtic a totes llums insostenible. Que de pas
    voldria recordar ací que la sostenibilitat d''eixes instal·lacions està en bona part mantinguda per
    les subvencions que reben d''esta corporació. Ens agradaria saber des de l''associació de veïns quines
    subvencions han rebut últimament i quin perdó d''impostos se li han fet a Rainforest perquè mantinga
    la seua pretesa viabilitat.


    Front tot eixe desgavell d''atacs facilitats des d''esta corporació al llarg de diferents legislatures
    al patrimoni de Campanar, el veïnat, en col·laboració amb l''entitat que acaba de parlar, de Per l''Horta
    i d’altres entitats de la ciutat, presentàrem un projecte molt ambiciós que voldríem tornar a posar
    damunt de la taula anomenat ''La façana de l''horta'', en la que plantejàvem una frontera entre la
    ciutat, una frontera definitiva entre la ciutat i l''horta que ens queda en Campanar per a donar-li
    un ús que la pandèmia ens va mostrar clarament que calia. Els ciutadans, no solament de Campanar,
    davant de les noves condicions de vida de la pandèmia, començàrem a invadir tot tipus de conreus,
    de camins d''horta, a passejar els gossos. I això, com moltes de les intervencions que segurament
    facilitarà esta modificació del Pla General, no fa sinó arruïnar les expectatives i les possibilitats
    de que els últims joves que queden en Campanar apostant per la terra i pel futur de la viabilitat
    de la terra, una de les coses que millor hem sabut fer els valencians al llarg dels segles, haja de
    ser reforçada en un plantejament urbanístic molt allunyat del que representa el projecte de Rainforest.


    Nosaltres vàrem presentar un projecte de reutilització de les alqueries històriques del nostre patrimoni
    per a interpretació de la natura, per a ampliació del parc de Capçalera i de tots els camins fluvials
    adjacents. I tot això, de moment, dorm el somni dels justos. Això va estar redactat pel mateix equip
    d''arquitectes que va guanyar el concurs de l''ampliació del Botànic. No sé com vaig de temps.


    Val, acabe ràpidament.


    Estem terriblement d''acord, per desgràcia, amb el plantejament que ha fet general el company de Per
    l''Horta. No voldríem que l''alqueria dels Frares, que el molí del Sol, el molí Nou, que l''alqueria
    de Lleonard acaben en el mateix futur que se li ha planificat des de Rainforest i li ha donat viabilitat
    l''Ajuntament de València. L''horta de València es mereix un tractament molt diferenciat del que planteja
    esta modificació del Pla General.


    Gràcies.'
  reason: Introduced as 'Gregorio M. Fidel Sarmiento (AVV Campanar)' in the first citizen section; speech
    not extracted.
  date: '2026-10-17'
  finding: E1b-2ea4034614
  text_cas: 'Muchas gracias. Buenos días.


    Por desgracia, soy el único representante del movimiento vecinal que seguramente ha podido improvisar
    una intervención en este Pleno y en esta **propuesta de modificación del Plan general** que tanto
    nos afectó a muchos y muchos barrios de la ciudad, no solamente a Campanar. Campanar, para quien no
    lo sepa, sufrió **una terrible agresión en su patrimonio** en la década de los 90-2000 por la creación
    del barrio de Nou Campanar, que arrasó una parcela fundamental en la historia de la huerta de Valencia,
    el Pouet, donde se arrasaron **60.000 metros cuadrados de huerta productiva**. Y yo tengo el recuerdo
    de algunos de los últimos habitantes de la huerta de Campanar, de los que podría dar nombres y apellidos,
    de cómo se empleó de una manera **astuta y criminal el emplazamiento del mercado de las Cañas**, del
    llamado mercado de las Cañas, el **punto más caliente del tráfico de drogas** de la ciudad durante
    años y años, para acabar de aburrir a los labradores y a los últimos habitantes de la huerta de Campanar
    y que vendieron a cualquier precio a los promotores que querían construir en el Nou Campanar. Podría
    hablar con nombres y apellidos de personajes implicados en aquella operación que han acabado siendo
    ministros, consejeros y de los que nunca olvidaré su trabajo en Campanar.


    Después, por si no hubiera poco, unos años después, este Ayuntamiento concedió a Rainforest **una
    concesión para un parque** -según declaraciones de la misma alcaldesa- modélico, único en el planeta,
    con un proyecto sostenible y redondo de ampliación que ha dejado en el abandono **piezas fundamentales
    del patrimonio arquitectónico** de la huerta. **La alquería del Rey** ha estado cayéndose hasta hace
    cuatro días, un edificio tardogótico del siglo XV, así como **las casas de Figuerols**, que son el
    único resto de barracas con paredes de adobe que quedan en toda la huerta de Valencia.


    Y todo ese patrimonio ahora está amenazado cuando estamos dentro del PATH, estamos calificados de
    **zona de huerta de máxima protección** por un **proyecto faraónico**, no se puede hacer de otra manera,
    que prevé **la construcción de pagodas chinas, de pirámides egipcias, de un parque acuático** a todas
    luces insostenible. Que de paso querría recordar aquí que **la sostenibilidad de esas instalaciones**
    está en buena parte mantenida por las **subvenciones que reciben de esta corporación**. Nos gustaría
    saber desde la asociación de vecinos qué subvenciones han recibido últimamente y qué **perdón de impuestos**
    se le han hecho a Rainforest para que mantenga su pretendida viabilidad.


    Frente a todo ese **desbarajuste de ataques facilitados desde esta corporación** a lo largo de diferentes
    legislaturas al patrimonio de Campanar, el vecindario, en colaboración con la entidad que acaba de
    hablar, de **Per l''Horta** y otras entidades de la ciudad, presentamos un **proyecto muy ambicioso**
    que querríamos volver a poner sobre la mesa llamado **''La fachada de la huerta''**, en la que planteábamos
    una **frontera entre la ciudad y la huerta** que nos queda en Campanar para darle un uso que la pandemia
    nos mostró claramente que hacía falta. Los ciudadanos, no solamente de Campanar, ante las nuevas condiciones
    de vida de la pandemia, comenzamos a invadir todo tipo de cultivos, de caminos de huerta, a pasear
    los perros. Y esto, como muchas de las intervenciones que seguramente facilitará esta modificación
    del Plan General, no hace sino **arruinar las expectativas** y las posibilidades de que los últimos
    jóvenes que quedan en Campanar apostando por la tierra y por el **futuro de la viabilidad de la tierra**,
    una de las cosas que mejor hemos sabido hacer los valencianos a lo largo de los siglos, haya de ser
    reforzada en un planteamiento urbanístico muy alejado de lo que representa el proyecto de Rainforest.


    Nosotros presentamos un **proyecto de reutilización de las alquerías históricas** de nuestro patrimonio
    para interpretación de la naturaleza, para **ampliación del parque de Cabecera** y de todos los caminos
    fluviales adyacentes. Y todo esto, de momento, duerme el sueño de los justos. Esto fue redactado por
    el mismo equipo de arquitectos que ganó el concurso de la ampliación del Botánico. No sé cómo voy
    de tiempo.


    Vale, termino rápidamente.


    Estamos terriblemente de acuerdo, por desgracia, con el planteamiento que ha hecho general el compañero
    de Per l''Horta. No querríamos que **la alquería de los Frailes**, que el **molino del Sol**, el **molino
    Nuevo**, que **la alquería de Leonard** acaben en el mismo futuro que se le ha planeado desde Rainforest
    y le ha dado viabilidad el Ayuntamiento de Valencia. **La huerta de Valencia se merece un trato muy
    diferenciado** del que plantea esta modificación del Plan General.


    Gracias.'
  resum_cas: Gregorio Sarmiento, en representación de la AVV Campanar, critica la modificación del Plan
    General y sus efectos sobre el patrimonio histórico de la huerta de Campanar, amenazada por el proyecto
    de Rainforest, propugnando alternativas de preservación y reutilización de las alquerías históricas.
