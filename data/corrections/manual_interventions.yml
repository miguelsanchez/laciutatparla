  intervinient: José Antonio Barba Guillem
  entitat: AV Nazaret Unido
  tipus_entitat: av
  idioma_original: castellano
  text_original: 'Hola, buenos días o buenas tardes ya. Muchas gracias, señora alcaldesa. Señores concejales
    y concejalas.


    Me llamo José Antonio Barba, soy vecino de Natzaret y hablo en nombre de cientos de familias que llevan
    más de 30 años esperando que alguien desde su despacho en Madrid se acuerde de que existimos Natzaret
    y La Punta, que también está perjudicada con lo de Serrería.


    Vengo aquí sin protocolo ni tecnicismo. Vengo a contarles que lo que mis vecinos en la calle, en las
    terrazas, en el mercado, lo que se dice en Natzaret. Cuando hay alguien que pregunta por las vías,
    dicen: ‘Nos han vuelto a engañar’. Y la única de forma gratuita es decir la rabia. Lo digo porque
    tenemos motivos, muchos motivos y fechas. Y las fechas no mienten. Julio del 2024. El ministro Óscar
    Puente y la alcaldesa de València se reunieron. Hay acuerdo, hay compromiso, hay la alternativa técnica
    concentrada, hay fotos, hay declaraciones. Y en Natzaret los vecinos que llevamos años en esto nos
    miramos y pensamos: ‘Quizá esta vez sí’. Ya ha pasado casi dos años desde entonces y no sabemos nada.
    Sabemos lo que es para un barrio. Se lleva más de 30 años reivindicando lo mismo. Es agotador. Es
    humillante. Y lo que es peor, ya no nos sorprende nadie.


    Porque Natzaret tiene memoria larga. Nuestros vecinos pagaron en su día cargas urbanísticas vinculadas
    al proyecto de soterramiento de varios millones de euros. Diez millones a cambio de una promesa, que
    la vía desapareciera bajo tierra y Natzaret respire, crezca y conectándose con el resto de la ciudad.
    Esto fue hace muchos años. Pero esas vías siguen así, en superficie, partiendo en dos. Y ese dinero
    nunca devuelto, muy explicado. ¿De qué no sirve pagar si la obra no llega? ¿Por qué no sirve confiar
    con el compromiso no se cumple? [ sic]


    Soterrar las vías no es solo una obra de ingeniería. Va la mano de algo que este barrio lleva décadas
    soñando, el parque de Desembocadura. Nos alegra saber que está un poquito más cerca. Pero la alegría
    no será completa mientras sigamos sufriendo una cicatriz en unas vías que parten el barrio en dos.
    No en dos, Natzaret está incomunicada por los cuatro puntos cardinales. Nos vamos al norte, tenemos
    el cauce del río, el parque. Si nos vamos al sur, tenemos el nuevo cauce del río que gracias a él
    con la dana nos libramos de mucha maldad. Por el oeste tenemos las vías del tren. Y por el este tenemos
    el mar. Estamos incomunicados totalmente.


    Soterrar esas vías nos dará una vida enorme a Natzaret. Si no se aprueba, soterramos a Natzaret por
    años. Yo sé que con la caridad de vivir en un barrio como el nuestro, que cuando alguien no quiere
    hacer algo siempre encuentra una excusa. Y cuando quiere hacerlo, siempre encuentra una solución.
    A otras ciudades parece que sí que hay solución y con València siempre hay una excusa nueva. Natzaret
    es un barrio con un porcentaje de paro por encima de la media. Un barrio que vive pegado al puerto
    de València, de 9 millones de contenedores y de negocio. Y que, sin embargo, se siente invisible para
    quienes toman las decisiones grandes. Tenemos el Jardín del Turia a un paso y una barrera de hierro
    y hormigón que lo hace inalcanzable para nuestros vecinos y vecinas.


    Es urgente poner fin a esta situación. Natzaret no admite más retrasos ni más excusas. No venimos
    a pedir favores, venimos a recordar que lo que se promete, se cumple. Y 30 años de espera ya son demasiados.
    Natzaret no pide más estudios, no pide reuniones. no pide más fotos con el ministro. Pide obras, pide
    cumplimiento, pide respeto y pide no ser menos que el resto.


    Muchas gracias.'
