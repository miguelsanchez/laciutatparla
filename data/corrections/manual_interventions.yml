  text_cas: 'Sra. El Hadri: Muchas gracias a todos y a todas, buenas tardes. Vinimos aquí en representación de Casa Marruecos
    y Jovesólides, organizaciones que trabajan por la justicia social, la inclusión y los derechos humanos en nuestra ciudad.
    Vinimos aquí, una vez más, con respeto, pero con una verdad que no se puede seguir ignorando. Ya hemos estado aquí varias
    veces. Vinimos cuando denunciamos el genocidio en Gaza, volvimos tras los ataques racistas que sufrieron las personas
    migradas durante la dana. Y cada vez salimos con la misma sensación, decepción.

    Pero lo que está ocurriendo no se puede seguir escondiendo. Lo que estamos viviendo muchas personas migradas, especialmente
    personas marroquíes y musulmanas magrebíes, es grave, muy grave. Y está creciendo y se llama racismo, morofobia, islamofobia.

