    passen, no són desitjables però ocorren. El brau es va desnucar igual que es va desnucar Faruk. **La
    veritat és que l''estadística diu que els accidents ocorren en els bous al carrer en un 0,29 % de
    les ocasions.** Lesions de tot tipus, lesions en la cama, un xicotet tall al cap. Un 0,29 % no és
    una gran estadística.


    Hem de tindre en compte que estos animals el 5 % d''ells mor a causa de les cornades que altres animals
