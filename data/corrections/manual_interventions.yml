- id: 2020-11-19-101
  pleno_id: '2020-11-19'
  ordre: 3
  intervinient: Salvador Ramos Sancho
  entitat: Associació de Veïns La Unió, de la Punta
  tipus_entitat: av
  idioma_original: castellano
  text_original: 'Sr. Ribó, coneix vosté la situació del pont de la V-15 situat en la rotonda de l''Església,
    que passa pel camí del Valladar? Habitualment per allí solen passar vehicles d’alt pes i després per
