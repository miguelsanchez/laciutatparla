- id: 2016-09-20-107
  pleno_id: '2016-09-20'
  ordre: 7
  intervinient: '[***]'
  entitat: COCEMFE
  tipus_entitat: altres
  idioma_original: castellano
  reason: Introduced in the acta as 'COCEMFE. Intervé' but not extracted.
  text_original: Buenos días. Sr. alcalde, concejales, concejalas, caballeros, señoras y señores. Yo quería
    hablar sobre la accesibilidad en la ciudad de Valencia. En la ciudad de Valencia la accesibilidad
    ha ido mejorando poco a poco desde hace tiempo, pero todavía queda camino por recorrer hasta alcanzar
    la accesibilidad plena y el objetivo final de conseguir que Valencia sea realmente una ciudad para
    todos, que todas las personas puedan recorrerla y disfrutarla de una forma autónoma. Valoramos positivamente
    la constitución y el trabajo de la Mesa de Mobilitat en la que participamos. Pero la accesibilidad
    debe contemplarse desde una forma transversal en las diversas áreas y concejalías ya que, además de
    los medios de transporte, también están implicados Urbanismo, Planeamiento, Parques y Jardines, Mantenimiento
    de Infraestructuras en la vía pública y otros competentes en plazas de aparcamiento, edificios y locales
    de pública concurrencia. También valoramos positivamente las numerosas intervenciones realizadas recientemente
    en vados peatonales con uso adecuado del pavimento señalizador, si bien, en algunos casos, se ha afectado
    el itinerario peatonal que discurre por las aceras. Así como la dotación de mobiliario y juegos inclusivos
    en nuevos parques como el de Nou Moles. Esperamos que se siga introduciendo no solo en los nuevos
    parques en construcción, sino en los que se remodelen y, poco a poco, en todos los de la ciudad para
    que los niños con discapacidad puedan jugar con los demás y no ser meros espectadores. No obstante,
    siguen habiendo problemas de accesibilidad. Como muestra quedan pasos peatonales sin vado peatonal,
    elaboramos un informe exhaustivo en El Cabanyal. Hay vados peatonales inadecuadamente ejecutados,
    es frecuente que éstos invadan los itinerarios peatonales que discurren en la acera. Hay muchos vados
    para vehículos mal ejecutados que alteran la pendiente en los itinerarios peatonales. Hay aceras estrechas
    y con obstáculos que no son itinerarios peatonales accesibles. Hay muchos establecimientos públicos
    con problemas de accesibilidad, incluso se siguen abriendo establecimientos sin un acceso adecuado.
    Hay paradas de la EMT no accesibles; algunas son jaulas para las personas que bajan en ellas con sillas
    de ruedas. Bueno, y un largo etcétera. Por ello, hay que seguir avanzando. Es importante que se tenga
    en cuenta la accesibilidad en todas las intervenciones que se hagan en los espacios y medios de transporte
    públicos, así como en los locales, edificios y establecimientos tanto públicos como privados de uso
    público, como los comercios. Hay que reformar el Reglamento de la EMT que permita que accedan por
    la rampa las personas con muletas o andador, entre otras cosas. Adecuar las paradas no accesibles
    y asegurar que funcionen las rampas de todos los autobuses. Finalmente, solicitamos la creación de
    un Servicio u Oficina Municipal de Accesibilidad que, además de asegurar la coordinación de todos
    los departamentos en este tema y la adecuación de los proyectos, asesore a técnicos propios y privados
    y tome la iniciativa en revisar toda la accesibilidad existente, planificando actuaciones para mejorar
    e instar a su ejecución. Muchas gracias.
  date: '2026-10-20'
  finding: E1b-1554e44367
  text_val: 'Bon dia. Sr. alcalde, regidors, regidores, cavallers, senyores i senyors. Jo volia parlar
    sobre **la accessibilitat a la ciutat de València**. A la ciutat de València l''accessibilitat ha
    anat millorant poc a poc des de fa temps, però encara queda camí per recórrer fins a aconseguir **l''accessibilitat
    plena** i l''objectiu final d''aconseguir que **València siga realment una ciutat per a tots**, que
    totes les persones puguen recórrer-la i gaudir-la de manera autònoma. Valorem positivament **la constitució
    i el treball de la Mesa de Mobilitat** en la qual participem. Però **l''accessibilitat ha de contemplar-se
    d''una manera transversal** en les diverses àrees i regidories ja que, a més dels mitjans de transport,
    també hi estan implicats Urbanisme, Planejament, Parcs i Jardins, Manteniment d''Infraestructures
    en la via pública i altres competents en places d''aparcament, edificis i locals de pública concurrència.


    També valorem positivament **les nombroses intervencions realitzades recentment en voladors per a
    vianants** amb ús adequat del paviment senyalitzador, si bé, en alguns casos, s''ha afectat l''itinerari
    per a vianants que discorre per les voreres. Així com **la dotació de mobiliari i jocs inclusius**
    en nous parcs com el de Nou Moles. Esperem que **es continue introduint en els nous parcs**, en els
    que es remodelen i, poc a poc, en tots els de la ciutat perquè **els xiquets amb discapacitat puguen
    jugar** amb els altres i no ser simples espectadors.


    No obstant això, **continuen havent-hi problemes d''accessibilitat**. Com a mostra queden **passos
    de vianants sense vorell de vianants**; elaborem un informe exhaustiu a El Cabanyal. Hi ha **voladors
    per a vianants inadequadament executats**; és freqüent que aquests invadeixen els itineraris per a
    vianants que discorren per la vorera. Hi ha molts **voladors per a vehicles mal executats** que alteren
    el pendent en els itineraris per a vianants. Hi ha **voreres estretes i amb obstacles** que no són
    itineraris per a vianants accessibles. Hi ha **molts establiments públics amb problemes d''accessibilitat**,
    fins i tot se segueixen obrint establiments sense un accés adequat. Hi ha **parades de l''EMT no accessibles**;
    algunes són gàbies per a les persones que baixen en elles amb cadires de rodes. Bé, i un llarg etcètera.


    Per això, **cal seguir avançant**. És important que es tinga en compte l''accessibilitat en totes
    les intervencions que es facen en els espais i mitjans de transport públics, així com en els locals,
    edificis i establiments tant públics com privats d''ús públic, com els comerços. **Cal reformar el
    Reglament de l''EMT** que permeta que accedisquen per la rampa les persones amb crosses o andador,
    entre altres coses. **Adequar les parades no accessibles** i assegurar que funcionen les rampes de
    tots els autobusos.


    Finalment, sol·licitem **la creació d''un Servei o Oficina Municipal d''Accessibilitat** que, a més
    d''assegurar la coordinació de tots els departaments en aquest tema i l''adequació dels projectes,
    assessore els tècnics propis i privats i prenga la iniciativa de revisar tota l''accessibilitat existent,
    planificant actuacions per a millorar i instar a la seua execució. Moltes gràcies.'
  resum_cas: COCEMFE demanda mejoras en la accesibilidad integral de Valencia, incluyendo transporte público,
    espacios urbanos y establecimientos, y solicita la creación de una Oficina Municipal de Accesibilidad
    que coordine las actuaciones transversales.
  resum_val: COCEMFE reclama millorar l'accessibilitat integral de València, inclosa la mobilitat pública,
    els espais urbans i els establiments, i sol·licita la creació d'una Oficina Municipal d'Accessibilitat
    que coordine les actuacions transversals.
