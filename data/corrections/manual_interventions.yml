- id: 2014-07-25-102
  pleno_id: '2014-07-25'
  ordre: 3
  intervinient: '[***]'
  entitat: Plataforma Salvem el Cabanyal
  tipus_entitat: plataforma
  idioma_original: valenciano
  reason: 'Acta: ''Por último, interviene Dª ******, en representación de la Plataforma Salvem el Cabanyal''
    - speech missed by script 05.'
  text_original: 'Bon dia, senyores i senyors.


    Estic ací en representació de la Plataforma Salvem el Cabanyal-el Canyamelar-Cap de França.


    Vaig nàixer al 1997, tinc 17 anys, el projecte de prolongació de l’av. de Blasco Ibáñez en té 16.


    A l’any 2001, pense que tots els regidors del PP ja estaven ací, va prendre la paraula [***]. Era
    la meua iaia i jo tenia 4 anys. I estic ací perquè ella es va morir al 2010, a sa casa, amb 94 anys
    i vull arreplegar el testimoni de la seua lluita i de la seua determinació.


    Mai millor dit, la de la Plataforma ha sigut tota la meua vida. 16 anys la Plataforma, 17 anys la
    meua vida. Jo encara no m’he incorporat activament a la lluita, però els joves que van per davant
    de mi, i ja n’hi ha molts, estan agafant el testimoni dels més majors. El relleu està preparat i això
    vol dir que estem preparats per tornar a començar, millor preparats i més forts.


    Al 24 de gener de 2001 dèiem: ‘Les nostres cases no les tiraren ni les bombes ni la riuada, vostés
    tampoc les van a tirar. No podran perquè davant de les cases estarem les persones. Tenim un compromís
    tan fort amb la nostra història, amb el nostre passat que ningú mai serà capaç de trencar-lo’. Fi
    de la cita.


    Jo i tots els qui tinc l’honor de representar ara i ací assegurem el futur.


    Sempre ens preguntem, quina és la seua valenciania de la qual tant volen lluir? Si l’únic interés
    que tenen respecte del patrimoni històric valencià és utilitzar-lo per a produir plusvàlues i fins
    i tot en això han fracassat.


    Ja no enganyen a ningú, açò s’ha convertit en un projecte tan personalista que ha perdut la possibilitat
    de ser explicat amb cap argument racional.


    No han aprés res vostés en aquestos 16 anys? A mi m’han ensenyat que qualsevol projecte públic fet
    sense consens ciutadà sempre té alts costos econòmics i socials, està abocat al fracàs.


    Quina conclusió podem traure? Que és un projecte producte d’una gran irracionalitat i obstinació.


    Per acabar, vull llegir el que diu Europa Nostra, vostés ja saben de qui els parle:


    ‘Durant 16 anys, la comunitat local -és a dir, nosaltres- ha defensat excepcionalment la conservació
    i revitalització del barri i els seus valors històrics i socials excepcionals a través d’una sèrie
    d’accions i campanyes’, per acabar destacant: ‘el caràcter de referent que ha adquirit a Europa el
    barri valencià del Cabanyal de València’.


    La Plataforma Salvem el Cabanyal ve avui amb una proposta concreta dirigida a totes les regidores
    i tots els regidors que integren aquest Ple municipal:


    ‘Convoquen la ciutadania, les institucions que treballen en l’àmbit de la defensa del patrimoni, els
    partits polítics, etc., amb la finalitat d’iniciar una planificació participativa al Cabanyal per
    a aconseguir mitjançant el consens social la rehabilitació integral del barri’.


    Plataforma Salvem el Cabanyal-Canyamelar-Cap de França.'
  date: '2026-10-20'
  finding: E1b-d22fdc6b3e
  text_cas: 'Buenos días, señoras y señores.


    Estoy aquí en representación de la Plataforma Salvem el Cabanyal-el Canyamelar-Cap de França.


    Nací en 1997, tengo **17 años**, el proyecto de prolongación de la avenida de Blasco Ibáñez tiene
    **16**. En el año 2001, creo que todos los concejales del PP ya estaban aquí, tomó la palabra [***].
    Era mi abuela y yo tenía 4 años. Y estoy aquí porque ella murió en 2010, en su casa, con 94 años y
    quiero recoger el **testimonio de su lucha** y de su determinación.


    Mejor dicho, la de la Plataforma ha sido toda mi vida. **16 años la Plataforma, 17 años mi vida**.
    Aún no me he incorporado activamente a la lucha, pero los jóvenes que van por delante de mí, y ya
    hay muchos, están recogiendo el testimonio de los mayores. **El relevo está preparado** y eso quiere
    decir que estamos preparados para volver a empezar, mejor preparados y más fuertes.


    El 24 de enero de 2001 decíamos: ''Nuestras casas no las derribaron ni las bombas ni la riada, ustedes
    tampoco las van a derribar. **No podrán porque delante de las casas estaremos las personas**. Tenemos
    un compromiso tan fuerte con nuestra historia, con nuestro pasado que **nadie nunca será capaz de
    romperlo**''. Fin de la cita.


    Yo y todos los que tengo el honor de representar ahora y aquí **aseguramos el futuro**.


    Siempre nos preguntamos, **cuál es su valenciania** de la cual tanto quieren lucir? Si el único interés
    que tienen respecto del patrimonio histórico valenciano es **utilizarlo para producir plusvalías**
    e incluso en eso han fracasado.


    Ya no engañan a nadie, **esto se ha convertido en un proyecto tan personalista** que ha perdido la
    posibilidad de ser explicado con ningún argumento racional.


    ¿No han aprendido nada ustedes en estos 16 años? A mí me han enseñado que **cualquier proyecto público
    hecho sin consenso ciudadano** siempre tiene altos costos económicos y sociales, está abocado al fracaso.


    ¿Qué conclusión podemos sacar? **Que es un proyecto producto de una gran irracionalidad y obstinación**.


    Para terminar, quiero leer lo que dice Europa Nostra, ustedes ya saben de quién les hablo:


    ''Durante 16 años, la **comunidad local** -es decir, nosotros- ha defendido excepcionalmente la **conservación
    y revitalización del barrio** y sus valores históricos y sociales excepcionales a través de una serie
    de acciones y campañas'', para terminar destacando: ''**el carácter de referente que ha adquirido
    en Europa el barrio valenciano del Cabanyal** de Valencia''.


    La Plataforma Salvem el Cabanyal viene hoy con una propuesta concreta dirigida a todas las concejalas
    y todos los concejales que integran este Pleno municipal:


    ''**Convocan a la ciudadanía, las instituciones que trabajan en el ámbito de la defensa del patrimonio**,
    los partidos políticos, etc., con la finalidad de iniciar una **planificación participativa en el
    Cabanyal** para conseguir mediante el **consenso social la rehabilitación integral del barrio**''.


    Plataforma Salvem el Cabanyal-Canyamelar-Cap de França.'
  resum_cas: La Plataforma Salvem el Cabanyal rechaza el proyecto de prolongación de la avenida de Blasco
    Ibáñez por considerar que carece de consenso ciudadano y vulnera el patrimonio histórico, proponiendo
    una planificación participativa para la rehabilitación integral del barrio.
  resum_val: La Plataforma Salvem el Cabanyal rebutja el projecte de prolongació de l'avinguda de Blasco
    Ibáñez per considerar que manca de consens ciutadà i vulnera el patrimoni històric, proposant una
    planificació participativa per a la rehabilitació integral del barri.
