  text_original: 'Sra. Alcaldesa, Sras. y Sres. Concejales.


    Desde la Asociación de Vecinos de Patraix queremos defender en este pleno la necesidad de reconocer
    las costumbres y tradiciones de nuestro barrio, que antiguamente era un municipio separado de Valencia
    pero que desde 1870 pertenece a esta ciudad.


    Este es un lugar de encuentro participativo para los ciudadanos de este barrio puedan encontrarse
    en la calle. Son unas fechas señaladas en el calendario festivo de esta ciudad como ya señala el libro
    de Valencia, fiestas de la ciudad, en su página 301, editado por este Ayuntamiento.


    Nos constan datos recogidos de las primeras fiestas en Patraix allá por el siglo XVI reflejados en
    Dietarista del Pere Joan Porcar, llegándonos con vitalidad hasta la Guerra Civil.


    Hay que recordar que estas celebraciones tienen distintos caracteres; como el religioso, podemos hablar
    de les albaes, procesiones, la celebración del patrón del barrio, San Nicolás de Bari, que tuvieron
    bastante más seguimiento que las Fallas hasta después de la Guerra Civil, como hemos comentado.


    En Patraix hubieron fiestas basadas en el rito del Paso que indican, celebran y organizan la transición
    desde unos estados a otros, de unas situaciones y posiciones sociales a otras, como el noviazgo, la
    pubertad, la muerte… Aquellas celebradas antiguamente como la Mare de Déu d’Agost, la Puríssima, clavariesas
    casadas, las solteras, els fadrins o los quintos.


    Con esta breve introducción queríamos poner en valor los orígenes de las fiestas populares aplicadas
    a nuestro barrio, que un grupo de vecinos intentamos relanzar a partir de 1994 al crear la Asociación
    de Vecinos. Nuestros objetivos son muy concretos. Buscamos que la gente pueda reencontrarse en la
    calle, que pueda hablar con la familia, que podamos recuperar la calle unos días para la ciudadanía,
    romper el individualismo de la gran ciudad, recuperar nuestras tradiciones, nuestra historia basada
    en la participación, la convivencia, la solidaridad…


    La recuperación de nuestros orígenes como la base para las fiestas populares en Patraix parece ser
    que no ha sido suficiente. Hoy, después de 20 años de esfuerzo, con mucho trabajo responsable a las
    espaldas directas de muchos de nosotros, voluntarios, ciudadanos y entidades que hemos intentado hacer
    que estas fiestas sigan hacia delante, nos damos cuenta de que peligran por la falta de apoyo y sensibilidad
    de esa corporación. Puesto que, a pesar de ser multitudinarias, no sólo por la falta de apoyo económico
    y el material, ni siquiera tenemos el moral a diferencia de otras ciudades españolas, sino que por
    la aplicación de normas que nos exigen de una forma bastante marcial están intentando asfixiar la
    realización de actividades de una trayectoria histórica y tradicional que hemos querido comentar aquí.


    Por lo tanto, pedimos que se apruebe la moción presentada por Compromís y que estas fiestas populares
    sean consideradas como unas fiestas de la ciudad ya que al igual que nuestros compañeros de San Marcelino
    son unas fiestas que abrimos a toda la ciudadanía, a todas las personas que vienen no sólo de la ciudad
    sino también de fuera para celebrar con nosotros un lugar de encuentro, un lugar en el que podemos
    decir que estamos todos juntos y sentirnos miembros de esta ciudad.


    Muchas gracias.'
  date: '2026-10-20'
  finding: E1b-6212d1427e
  text_val: 'Sra. Alcaldessa, Sres. i Sra. Regidors.


    Des de l''Associació de Veïns de Patraix volem defendre en este ple la necessitat de **reconéixer
    els costums i tradicions del nostre barri**, que antigament era un municipi separat de València però
    que des de 1870 pertany a esta ciutat.


    Este és un **lloc de trobada participatiu** perquè els ciutadans d''este barri puguen trobar-se al
    carrer. Són unes dates assenyalades en el calendari festiu d''esta ciutat com ja assenyala el llibre
    València, festes de la ciutat, en la seua pàgina 301, editat per este Ajuntament.


    Ens consten dades recollides de les **primeres festes a Patraix ja al segle XVI** reflectides en el
    Dietari de Pere Joan Porcar, arribant amb vitalitat fins a la Guerra Civil.


    Cal recordar que estes celebracions tenen diferents caràcters; com el religiós, podem parlar de les
    albaes, processons, la celebració del patró del barri, Sant Nicolau de Bari, que van tindre bastant
    més seguiment que les Falles fins després de la Guerra Civil, com hem comentat.


    A Patraix hi hagué festes basades en el ritu del Pas que indiquen, celebren i organitzen la transició
    des d''uns estats a uns altres, d''unes situacions i posicions socials a unes altres, com el festeig,
    la pubertat, la mort… Aquelles celebrades antigament com la Mare de Déu d''Agost, la Puríssima, clavariesses
    casades, les solteres, els fadrins o els quintos.


    Amb esta breu introducció volíem posar en valor els orígens de les festes populars aplicades al nostre
    barri, que **un grup de veïns intentem reactivar a partir de 1994** en crear l''Associació de Veïns.
    Els nostres objectius són molt concrets. Busquem que **la gent puga retrobar-se al carrer**, que puga
    parlar amb la família, que puguem **recuperar el carrer uns dies per a la ciutadania**, trencar l''individualisme
    de la gran ciutat, **recuperar les nostres tradicions, la nostra història** basada en la participació,
    la convivència, la solidaritat…


    La recuperació dels nostres orígens com la base per a les festes populars a Patraix sembla que no
    ha sigut suficient. Hui, després de **20 anys d''esforç**, amb molt de treball responsable a les espatlles
    directes de molts de nosaltres, voluntaris, ciutadans i entitats que hem intentat fer que estes festes
    continuen endavant, ens adonem que **perilllen per la falta de suport** i sensibilitat d''esta corporació.
    Ja que, malgrat ser multitudinàries, no sols per la falta de suport econòmic i material, ni tan sols
    tenim el moral a diferència d''altres ciutats espanyoles, sinó que per l''aplicació de normes que
    ens exigeixen d''una manera bastant marcial estan intentant **asfixiar la realització d''activitats**
    d''una trajectòria històrica i tradicional que hem volgut comentar ací.


    Per tant, demanem que **s''aprove la moció presentada per Compromís** i que **estes festes populars
    siguen considerades com unes festes de la ciutat** ja que, igual que els nostres companys de Sant
    Marcel·lí, són unes festes que obrim a tota la ciutadania, a totes les persones que vénen no sols
    de la ciutat sinó també de fora per celebrar amb nosaltres un lloc de trobada, un lloc en el qual
    podem dir que estem tots junts i sentir-nos membres d''esta ciutat.


    Moltes gràcies.'
