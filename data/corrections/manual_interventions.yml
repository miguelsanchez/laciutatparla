- id: 2016-09-20-104
  pleno_id: '2016-09-20'
  ordre: 4
  intervinient: '[***]'
  entitat: Associació de Veïns de Nou Moles
  tipus_entitat: av
  idioma_original: castellano
  reason: Introduced in the acta as 'Associació de Veïns de Nou Moles. Intervé' but not extracted.
  text_original: Buenos días. Sr. alcalde, concejales, concejalas y público en general. Aprovechamos este
    Pleno del Estado de la Ciudad para exponer la situación de nuestro barrio, Nou Moles. No entendemos
    que al día de hoy el polideportivo de Nou Moles, que estaba en su programa electoral, siga sin acabarse
    y con la problemática de tres calles inutilizadas por las vallas, dos semáforos y dos pasos de peatones
    anulados, teniendo enfrente de la obra el centro de mayores, con el peligro que ello conlleva. No
    nos vale que nos indiquen que es responsabilidad de la Generalitat, cuando todos los polideportivos
    de la ciudad son municipales. El responsable de la alcaldía tendría que hacer cumplir lo prometido,
    tanto en este punto como en los abajo indicados. También se prometió en el mismo programa la recuperación
    de la línea de autobús nº. 7 para nuestro barrio y, no solo no se ha cumplido, sino que nos han quitado
    la línea 29 y 81, a pesar de las 2.800 firmas que se presentaron en la Concejalía de Movilidad y en
    la misma Alcaldía. Los vecinos siguen viniendo a nuestra Asociación a firmar por el descontento general
    tan grande y las molestias que les ocasionan no disponer de los citados servicios. Otra promesa incumplida
    es la reapertura del Parque Oeste de Bomberos ¿Cómo se pueden tener tantos barrios sin medidas de
    seguridad? Nos costó mucho esfuerzo en su día que nos asignaran seis policías de barrio y actualmente
    solamente tenemos dos, aunque en el papel les conste que son cuatro, para un barrio tan grande y poblado
    como este. Después de tantos años esperando dejar en condiciones el solar municipal de Hermanos Rivas
    para que aparquen los vecinos, ya que al ser un barrio antiguo carece de plazas de aparcamiento, este
    verano se han acometido las obras, las cuales al día de hoy no deben de haber finalizado porque han
    dejado el mismo con tierra y los vecinos de alrededor se quejan con muchísima razón de la polvareda
    que se levanta. Aparte también se ha reclamado a la Concejalía de Movilidad el acondicionamiento de
    un solar municipal que hay en la calle Brasil para aparcamiento de los vecinos mientras el Ayuntamiento
    le asigne otra utilidad. Solicitamos la poda de los árboles secos, así como el arreglo del jardín
    de la plaza de Nou Moles que está en muy mal estado. Esperamos que sean aceptadas nuestras reclamaciones
    para el bien de nuestro barrio y recordarles que ustedes, concejales y Sr. alcalde, administran nuestros
    impuestos. Gracias.
  date: '2026-10-20'
  finding: E1b-24f40b5c29
  text_val: Bon dia. Sr. alcalde, regidors, regidores i públic en general. Aprofitem este Ple de l'Estat
    de la Ciutat per a exposar la situació del nostre barri, Nou Moles. No entenem que hui en dia el **poliesportiu
    de Nou Moles**, que estava en el seu programa electoral, continue sense acabar-se i amb la problemàtica
    de **tres carrers inutilitzats** per les tanques, **dos semàfors i dos passos de vianants anul·lats**,
    tenint enfront de l'obra el centre de majors, amb el perill que això comporta. No ens val que ens
    indiquen que és responsabilitat de la Generalitat, quan **tots els poliesportius de la ciutat són
    municipals**. El responsable de l'alcaldia hauria de **complir el que s'ha promès**, tant en este
    punt com en els indicats baix. També es va prometre en el mateix programa la **recuperació de la línia
    d'autobús nº. 7** per al nostre barri i, no sols no s'ha complit, sinó que **ens han llevat la línia
    29 i 81**, malgrat les **2.800 firmes** que es van presentar en la Regidoria de Mobilitat i en la
    mateixa Alcaldia. Els veïns continuen venint a la nostra Associació a signar pel **descontent general
    tan gran** i les molèsties que els ocasionen no disposar dels citats serveis. Una altra promesa incomplida
    és la **reobertura del Parc Oest de Bombers**. Com es poden tindre tants barris sense mesures de seguretat?
    Ens va costar molt esforç en el seu dia que ens assignaren sis policies de barri i actualment només
    tenim dos, encara que en el paper els conste que són quatre, per a un barri tan gran i poblat com
    este. Després de tants anys esperant deixar en condicions el **solar municipal de Germans Rivas**
    perquè aparquen els veïns, ja que en ser un barri antic **no té places d'aparcament**, este estiu
    s'han escomés les obres, les quals hui en dia no deuen d'haver finalitzat perquè han deixat el mateix
    amb terra i els veïns de voltant es queixen amb molta raó de la **polseguera que s'alça**. A més,
    també s'ha reclamat a la Regidoria de Mobilitat l'**acondicionament d'un solar municipal** que hi
    ha al carrer Brasil per a aparcament dels veïns mentre l'Ajuntament li assigne una altra utilitat.
    Sol·licitem la **poda dels arbres secs**, així com l'**arreglament del jardí de la plaça de Nou Moles**
    que està en molt mal estat. Esperem que siguen acceptades les nostres reclamacions per al bé del nostre
    barri i recordar-los que vostés, regidors i Sr. alcalde, administren els nostres impostos. Gràcies.
  resum_cas: 'La Associació de Veïns de Nou Moles denuncia incompliment de promeses electorals: polideportivo
    sense acabar, eliminació de línies de bus (29 i 81), falta de seguretat (centre de bombers tancat,
    reducció de policia) i problemes de mobilitat i parking.'
  resum_val: 'L''Associació de Veïns de Nou Moles protesta pel incompliment de promeses electorals: poliesportiu
    inacabat, eliminació de línies d''autobús (29 i 81), manca de seguretat (parc de bombers tancat, reducció
    de policia) i problemes de mobilitat i aparcament.'
