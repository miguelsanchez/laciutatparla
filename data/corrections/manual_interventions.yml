- id: 2015-01-30-101
  pleno_id: '2015-01-30'
  ordre: 2
  intervinient: '[***]'
  entitat: Associació d'Aturats i Aturades d'Orriols-Torrefiel
  tipus_entitat: plataforma
  idioma_original: castellano
  text_original: 'Buenos días, gracias.

    Mi nombre es [***] y tengo el honor de representar a personas de diferentes colectivos sociales: Asamblea
    de Parados y Precarios de Valencia, Red de Solidaridad Popular, Plataforma de Afectados por las Hipotecas,
    Iaioflautas, Asamblea de Parados de Orriols y Asamblea del 15M de Algiròs.


    Nosotros nos reunimos frente a la puerta principal de la casa del pueblo de esta ciudad todos los
    lunes, de once a una, desde el mes de septiembre, sin importar el tiempo que haga, con el nombre de
    Sillas contra el hambre para demandar un puesto de trabajo digno para todos que debería estar garantizado
    según la Constitución.


    La falta de trabajo es la causa principal de todos los problemas, como imaginamos ya saben. Con trabajo
    no habría uno de cada tres niños pasando hambre. ¿Ustedes saben qué es pasar hambre? ¿Ustedes saben
    qué es que tus hijos pasen hambre? ¿Por qué lo consienten? Con trabajo no habría tantísimos desahucios.
    ¿Ustedes saben qué es vivir en la calle? ¿Ustedes saben lo que un padre o una madre tienen que decirle
    a un hijo cuando se lo llevan a vivir bajo un puente? ¿Por qué dejan que pase?


    Con trabajo las casas no serían neveras, con trabajo se puede pagar a la compañía del agua para que
    no te corte esa necesidad vital. ¿Por qué no lo evitan? Ustedes pueden tomar medidas para que nadie
    se quede sin agua y sin energía, medidas para eximir de tasas e impuestos a las personas y a las familias
    que no puedan pagarlos. Ustedes pueden elaborar un plan de ocupación pública que gestione directamente
    los servicios públicos. Ustedes deben ocuparse de que a todas las personas con minusvalías les llegue
    su ayuda sin más retrasos.


    Como somos conscientes de que si no se reparte el trabajo nunca habrá trabajo para todos y de que
    a este sistema le interesa tener trabajadores parados para utilizarlos como arma arrojadiza contra
    los trabajadores ocupados, pedimos una renta para todas las personas desempleadas que sea como mínimo
    el salario mínimo interprofesional. Una renta con la que poder hacer frente a las necesidades básicas
    que cualquier persona debe tener acceso.


    Señoras, señores. Hemos venido hasta aquí porque creemos que aún les queda algo de corazón. Porque
    nos negamos a aceptar lo que la realidad nos dice de ustedes y es que les da igual lo que le pasa
    a tantos niños, a tantas familias y a tantas personas paradas que viven condenadas a la miseria y
    al miedo. Demuestren a su pueblo que se equivoca quien piensa que ustedes sólo se preocupan de sus
    traseros.


    Muchas gracias.'
  reason: Second representative of the association, introduced with 'A continuación, el Sr.****** expone'
