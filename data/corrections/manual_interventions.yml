- id: 2016-03-31-101
  pleno_id: '2016-03-31'
  ordre: 2
  intervinient: '[***]'
  entitat: Associació de Víctimes del Terrorisme de la Comunitat Valenciana (AVTCV)
  tipus_entitat: altres
  idioma_original: castellano
  text_original: 'Bon día. Sr. alcalde, secretari, regidors, públic.

    Desde la Asociación Víctimas del Terrorismo apoyaremos toda iniciativa que sirva para recordar el
    nombre de todos los que les quitaron su vida por España y fueron asesinados por unos terroristas sin
    escrúpulos.

    Poner nombre de víctimas en nuestra querida ciudad de Valencia servirá para recordar la verdadera
    historia de lo ocurrido en este país. Para no olvidarlo y evitar que vuelva a ocurrir. Para tener
    presente aquí que no hubo un conflicto, que hubo terroristas que pusieron las pistolas y víctimas
    que sufrieron su intolerancia.

    Por las víctimas de quienes en esta nuestra ciudad, Valencia, padecieron esta lacra y tuvieron que
    enfrentarse al duro trance que supone convertirse en víctimas del terrorismo: 54 asesinados de la
    Comunidad, cientos de heridos.

    Para rendir un merecido homenaje a tantas víctimas anónimas, de cualquier tipo de terrorismo, cuyos
    nombres sin este tipo de iniciativa quedarían en un inmerecido olvido. Para recordar a tantos y tantos
    que, como yo, sufrimos el zarpazo del terrorismo.

    Desde la AVT agradecemos que partidos políticos, sean del signo que sean, muestren su compromiso con
    las víctimas del terrorismo con esta iniciativa. Más aún en un momento como el actual en el que parece
    que las víctimas molestamos, en el que se nos intenta silenciar, adquieren todavía más importancia
    para nosotros este tipo de gestos.

    Y es la historia de casi mil víctimas que fueron asesinadas con el único objetivo de atemorizar y
    aterrorizar a toda la sociedad española. Porque aunque a día de hoy ETA no pega el tiro en la nuca,
    sí que existe desde nuestras instituciones y obtiene concesiones de nuestro Gobierno. Esto es un rotundo
    fracaso de nuestra democracia.

    Porque aunque algunos pretenden hacerlo olvidar, hubo un tiempo no tan lejano en que unos mataban
    y otros morían. Ahora, nos enfrentamos a una amenaza sin precedentes, la yihadista, que ya ha costado
    la vida a más de 200 personas en nuestro país y que hoy está más latente que nunca como demuestran
    los recientes atentados en Bélgica.

    Por todo eso y mucho más, adquieren tanta relevancia iniciativas como ésta. Porque puede que los delitos
    prescriban, pero el dolor de una víctima no prescribe nunca.

    Muchísimas gracias.'
  reason: 'Acta: two AVT representatives spoke under art. 12 of the Reglament; the second speech was not
    extracted.'
  date: '2026-10-20'
  finding: E1b-4cc1177947
  text_val: 'Bon dia. Sr. alcalde, secretari, regidors, públic.


    Des de l''Associació Víctimes del Terrorisme recolzarem **tota iniciativa que servisca per recordar**
    el nom de tots els que els van llevar la vida per Espanya i van ser assassinats per uns **terroristes
    sense escrúpols**.


    Posar nom de víctimes en la nostra estimada ciutat de València servirà per **recordar la veritable
    història** del succeït en aquest país. Per **no oblidar-ho** i evitar que torni a ocórrer. Per tindre
    present ací que **no hi va haver un conflicte**, que hi va haver **terroristes que van posar les pistoles**
    i **víctimes que van patir** la seua intolerància.


    Per les víctimes de qui en aquesta nostra ciutat, València, van patir aquesta plaga i van haver d''enfrontar-se
    al dur tràngol que suposa convertir-se en víctima del terrorisme: **54 assassinats de la Comunitat**,
    centenars de ferits.


    Per rendre un **mereixcut homenatge** a tantes víctimes anònimes, de qualsevol tipus de terrorisme,
    els noms dels quals sense este tipus d''iniciativa quedarien en un inmereixcut oblit. Per recordar
    a tants i tants que, com jo, vam sofrir **l''arrapada del terrorisme**.


    Des de l''AVT agraïm que **partits polítics** mostren el seu compromís amb les víctimes del terrorisme
    amb esta iniciativa. Més encara en un moment com l''actual en que pareix que **les víctimes molestam**,
    en que se''ns intenta silenciar, adquirixen todavía més importància per a nosaltres este tipus de
    gests.


    I és la història de **quasi mil víctimes** que van ser assassinades amb l''únic objectiu d''atemorizar
    i aterradorizar a tota la societat espanyola. Perquè aunque a dia de hui **ETA no pegue el tir en
    la nuca**, sí que existeix des de les nostres institucions i obté concessions del nostre Govern. **Açò
    és un rotund fracàs** de la nostra democràcia.


    Perquè aunque alguns pretenen fer-ho oblidar, **hi va haver un temps no tant llunyà** en que uns mataven
    i altres morien. Ara, ens enfrontam a **una amenaça sense precedents, la yihadista**, que ja ha costat
    la vida a més de 200 persones en nostre país i que hui està més latent que mai com demostren **els
    recents atentats a Bèlgica**.


    Per tot açò i molt més, adquirixen tanta rellevància iniciatives com esta. Perquè **pot ser que els
    delictes prescriban**, però **el dolor d''una víctima no prescriu mai**.


    Moltíssimes gràcies.'
  resum_cas: La Asociación de Víctimas del Terrorismo apoya iniciativas para honrar la memoria de víctimas
    del terrorismo en Valencia, recordando que hubo terroristas y víctimas pero no conflicto, y denunciando
    que las víctimas están siendo silenciadas mientras ETA recibe concesiones del Gobierno.
  resum_val: L'Associació de Víctimes del Terrorisme recolza iniciatives per honrar la memòria de víctimes
