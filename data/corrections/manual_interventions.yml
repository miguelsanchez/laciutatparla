  entitat: AMPA CEIP Carles Salvador
  tipus_entitat: educacio
  idioma_original: valenciano
  text_original: 'Molt bon dia a totes i a tots.

    Com a president de FAPA-València pren la paraula, en nom de totes les nostres AMPA federades, per
    a fer algunes aportacions a la moció que hui el PSPV-PSOE presenta en este ajuntament.

    Amb l’aprovació del districte únic d’escolarització únic, una vegada més, l’administració pública
    ataca a l’ensenyament públic i li fa un favor als col-legis concertats per facilitar la selecció de
    l’alumnat, sobretot a la ciutat de València on l’oferta de places públiques és tan insuficient que
    hi ha famílies que opten per un centre concertat perqué al voltant del seu barri és el més proper
    al seu domicili, encara que no puguen compartir l’ideari d’eixe centre, les taxes que hagen de pagar
    per ser socis de l’AMPA, etc.

    No ens cansem de denunciar que la llibertat d’elecció de centre és un engany, es propicia més llibertat
    per sol.licitar centres, però no per triar, ja que les places escolars no augmenten.

    El districte únic arruïna la planificació educativa i trenca amb el criteri de proximitat i d’inserció
    en l’entorn que caracteritza a l’ensenyament públic i generarà amb el temps centres de diferents categories.
    Però un primer efecte que ja veurem el curs que ve serà el tancament d’unitats i línies escolars,
    la qual cosa repercutirà encara més en la massificació de les aules en els altres centres.

    Des de Fapa-València sempre hem apostat per la proximitat del domicili a l’escola com a criteri fonamental
    per a l’escolarització. El motiu principal és la ralació del xiquet/a amb el seu entorn; qüestió que
    considerem molt important per a la seua educació. Això respon a un concepte de l’educació pel qual
    la inserció de la persona en l’entorn (el barri, el carrer i el veïnat) és bàsica per al seu desenvolupament
    integral com a persona arrelada al seu espai més proper.

    FAPA-València ha estat exigint mesures per corregir els desequilibris en l’escolarització que han
    provocat conseqüències com la segregació de l’alumnat en determinats centres, la massificació d’uns
    centres educatius i la falta d’alumnat en uns altres, la distribució desequilibrada de l’alumnat amb
    NEE o els nouvinguts.

    Junt a la problemàtica del districte únic, la federació de pares i mares ha denunciat una vegada més
    que els ajuntaments cedisquen sòl públic, que ha de ser destinat a serveis públics de tots els ciutadans,
    a entitats privades para construir centres concertats o privats.

    Donem el nostre suport a les AMPA de Patraix i Torrent i, com deia un cantant valencià, decimos no
    a la cessió del sòl públic per a centres privats quan la gran majoria de pares i mares volen escolaritzar
    als seus fills i filles en l’escola pública.

    Els representats de FAPA-València a les meses de pares i al Consell Escolar Municipal, este últim
    òrgan d’este ajuntament, hem presentat les al-legacions pertinents a les noves normatives i procediments
    als quals acabem de fer referència i cap, cap s’han acceptat com a proposta de modificació. Instem
    a esta administració pública i a la Conselleria d’Educació a democratitzar els seus órgans de participació,
    que deixen espais on la comunitat eductiva tinga alguna cosa que dir que és, en definitiva, la què
    coneix realment la realitat i treballa diàriament a l’escola pública.

    I logicamente ens solidaritzem amb la companya que ha parlat, del col·legi Torrefiel, perquè escoles
    as hi ha moltes al voltant de la ciutat de València.

    Moltes Gràcies.'
  reason: 'Acta: ''interviene ******, en representación de la AMPA CEIP Carles Salvador, quien se expresa
    en los siguientes términos''; speech missing from extraction.'
  date: '2026-10-19'
  finding: E1b-5e97464d0b
  text_cas: 'Buenos días a todos y a todas.


    Como presidente de FAPA-València tomo la palabra, en nombre de todas nuestras AMPA federadas, para
    hacer algunas aportaciones a la moción que hoy el PSPV-PSOE presenta en este ayuntamiento.


    Con la aprobación del **distrito único de escolarización**, una vez más, la administración pública
    **ataca a la enseñanza pública** y le hace un favor a los colegios concertados para facilitar la selección
    del alumnado, sobre todo en la ciudad de València donde **la oferta de plazas públicas es tan insuficiente**
    que hay familias que optan por un centro concertado porque alrededor de su barrio es el más próximo
    a su domicilio, aunque no puedan compartir el ideario de ese centro, las tasas que tengan que pagar
    por ser socios del AMPA, etc.


    No nos cansamos de denunciar que **la libertad de elección de centro es un engaño**, se propicia más
    libertad para solicitar centros, pero no para elegir, ya que las plazas escolares no aumentan.


    El distrito único **arruina la planificación educativa** y **rompe con el criterio de proximidad**
    e inserción en el entorno que caracteriza a la enseñanza pública y generará con el tiempo centros
    de diferentes categorías. Pero un primer efecto que ya veremos el curso que viene será el **cierre
    de unidades y líneas escolares**, lo cual repercutirá aún más en la **masificación de las aulas**
    en los otros centros.


    Desde FAPA-València siempre hemos apostado por **la proximidad del domicilio a la escuela** como criterio
    fundamental para la escolarización. El motivo principal es la relación del niño/a con su entorno;
    cuestión que consideramos muy importante para su educación. Esto responde a un concepto de la educación
    por el cual la inserción de la persona en el entorno (el barrio, la calle y el vecindario) es básica
    para su desarrollo integral como persona arraigada en su espacio más próximo.


    FAPA-València ha estado exigiendo medidas para corregir los **desequilibrios en la escolarización**
    que han provocado consecuencias como **la segregación del alumnado** en determinados centros, la masificación
    de unos centros educativos y la falta de alumnado en otros, la distribución desequilibrada del alumnado
    con NEE o los recién llegados.


    Junto a la problemática del distrito único, la federación de padres y madres ha denunciado una vez
    más que los ayuntamientos cedan **suelo público**, que debe ser destinado a servicios públicos de
    todos los ciudadanos, a entidades privadas para construir centros concertados o privados.


    Damos nuestro apoyo a las AMPA de Patraix y Torrent y, como decía un cantante valenciano, **decimos
    no a la cesión del suelo público para centros privados** cuando la gran mayoría de padres y madres
    quieren **escolarizar a sus hijos e hijas en la escuela pública**.


    Los representantes de FAPA-València en las mesas de padres y en el Consejo Escolar Municipal, este
    último órgano de este ayuntamiento, hemos presentado las alegaciones pertinentes a las nuevas normativas
    y procedimientos a los cuales acabamos de hacer referencia y ninguna, ninguna se han aceptado como
    propuesta de modificación. Instamos a esta administración pública y a la Conselleria de Educación
    a **democratizar sus órganos de participación**, que dejen espacios donde la comunidad educativa tenga
    algo que decir que es, en definitiva, la que conoce realmente la realidad y trabaja diariamente en
    la escuela pública.


    Y lógicamente nos solidarizamos con la compañera que ha hablado, del colegio Torrefiel, porque escuelas
    hay muchas alrededor de la ciudad de València.


    Muchas gracias.'
  resum_cas: FAPA-València se opone al nuevo distrito único de escolarización argumentando que debilita
    la enseñanza pública, facilita la selección en colegios concertados y favorece la segregación del
    alumnado.
  resum_val: FAPA-València s'oposa al nou districte únic d'escolarització argumentant que debilita l'ensenyament
