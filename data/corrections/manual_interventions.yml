- id: 2014-01-31-101
  pleno_id: '2014-01-31'
  ordre: 3
  intervinient: '[***]'
  entitat: Asociación de Vecinos de Natzaret
  tipus_entitat: av
  idioma_original: castellano
  reason: 'Acta: ''A continuación interviene Dª ******, en representación de la Asociación de Vecinas
    y Vecinos de Natzaret'' - speaker missed by extraction'
  text_original: 'En el 2009 nace la Plataforma de Afectados por las Hipotecas, que no es más que un lugar
    de encuentro de personas afectadas y activistas que luchan por el derecho a la vivienda, y desde entonces
    ya somos más de 206 plataformas en todo el país.


    ¿Y qué hacemos nosotros? Pues ponernos delante de las casas para intentar detener los desahucios,
    interpelar a las Administraciones públicas presentando mociones en ayuntamientos instando a los gobiernos
    central y autonómico a que tomen medidas. También, nos organizamos ante los bancos para conseguir
    refinanciaciones, daciones en pago, condonaciones de deuda y alquileres sociales.


    En definitiva, nos hemos revelado ante leyes injustas, como así ha determinado también el Tribunal
    de Justicia de la Unión Europea. Es decir, nos negamos a la exclusión social de las personas.


    ¿Y qué nos pasó con la Iniciativa Legislativa Popular? Que, después de tanto trabajo, hemos presentado
    no las 500.000 firmas que nos exigían sino 1.400.000. Y aún así el Gobierno central se ha negado a
    dar una respuesta contundente a este problema, porque la Ley 1/2013 es tan restrictiva que deja sin
    resolver la situación de vulnerabilidad de muchas familias y por otra parte permite seguir viviendo
    en sus casas a personas que las han perdido únicamente hasta el 15 de mayo de 2015, sin proponer en
    el futuro una auténtica alternativa habitacional como puede ser un alquiler social.


    Pedimos que nos escuchen, que tengan una actitud abierta y que dejen de criminalizarnos. Se nos han
    criminalizado ante los escarches, en las concentraciones e incluso nos han puesto denuncias como las
    del Senado.


    Y hoy venimos aquí a presentar esta moción que nace de la Plataforma de Afectados por las Hipotecas
    y que os hemos enviado a todos los grupos. Agradecemos a PSOE, EU y Compromís ponerse a nuestro lado
    y presentarla, y las asociaciones de vecinos que nos han permitido el uso de la palabra. Sin embargo,
    creemos que aún estamos a tiempo de colaborar entre todos para la defensa del derecho humano y constitucional
    de la vivienda. Y, ojo, se confunden y engañan los que hagan de nuestra presencia hoy aquí un ataque
    a una fuerza política o una cobertura para hacer políticas de corto alcance.


    Gracias.'
  date: '2026-10-20'
  finding: E1b-3b6722a83f
