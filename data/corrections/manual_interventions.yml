    Y no quiero salir por la calle con miedo por llevar un hijab. No quiero tener miedo por ser quien soy. Me niego a vivir
    con miedo. Cada día lucho contra eso, por mí, por mi madre, por mi hermano pequeño, por mis vecinas, por mis amigas, por
    todas vosotras.

    Pero no debería ser mi lucha. Esa es vuestra responsabilidad, protegernos y aseguraros de que ninguna persona como yo
    tenga que aprender a resistir solo por existir. Por eso hoy exigimos: Que se reconozca de manera pública el aumento de
    la islamofobia, morofobia y racismo. Que se condene sin ambigüedades cualquier discurso que vincule inmigración con delincuencia.
    Que se desarrollen políticas valientes de inclusión social y convivencia real. Que se proteja a quien vive con miedo.
    Que se defiendan con claridad los derechos humanos.

    Queremos vivir sin miedo. Queremos caminar por nuestras calles sin miradas sospechosas. Estamos aquí, seguiremos aquí
    y no nos callaremos. Desde València decimos: stop morofobia, stop islamofobia, stop racismo. Muchas gracias.'
