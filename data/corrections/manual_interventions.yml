  idioma_original: castellano
  text_original: 'Las familias y los padres y madres del distrito de Patraix llevamos ya 15 años detrás
    del instituto que permitiría a nuestros hijos e hijas disfrutar del mismo derecho que el resto de
    niños y niñas de la ciudad de Valencia: el derecho a tener un centro en condiciones donde cursar sus
    estudios de secundaria, según lo que establece el mapa escolar. Según ese mismo mapa estamos deficitarios
    de tres institutos, que tienen una ubicación clara en el plan general urbanístico del municipio de
    Valencia.


    No se trata de ver en qué tejado está la pelota sino de tomar posición. Por ello venimos a pedirles
    compromisos:


    - Queremos que se posicionen del lado de los derechos de nuestros hijos e hijas y de nuestras familias,
    como representantes nuestros que son, y por ello les pedimos que soliciten a Ciegsa y a la Conselleria
    d’Educació que reviertan la situación. Exigiendo en nuestro nombre no sólo que no se abandone o ralentice
    el proyecto de IES Patraix sino que se recupere y acelere, pues los años de espera ya han sido bastantes.


    - Que el Pleno se pronuncie expresamente a favor de la construcción del IES Patraix y en contra de
    que la salida del primer ciclo de la ESO de nuestros colegios de primaria sea a costa de medidas precarias
    del tipo de más masificación de los centros de la zona, dispersión de nuestros hijos hacia otros institutos
    de otros distritos o la construcción de barracones.


    - Que se comprometan con medidas concretas y que nos mantengan informados de qué pasos dan y en qué
    plazos.


    Claro está que todo esto puede ser sólo una ilusión si ustedes, nuestros representantes, nos dejan
    en la estacada.


    Nosotros que estamos acostumbrados a rendir cuentas a las familias a las que representamos, que nos
    implicamos con sus problemas y que sentimos lo que les pasa a cada uno de ellos como si fuese a nosotros
    mismos, nos hemos tomado la licencia de pensar en exigir lo mismo a nuestros representantes políticos.


    Todavía 4 de los 8 colegios de infantil y primaria de nuestro distrito cuentan con el primer ciclo
    de la enseñanza secundaria en los centros, lo que supone 700 niños y niñas que realizan sus estudios
    de ESO fuera de un instituto (los del CEIP Jesús, el CEIP Santo Ángel de la Guarda, el CEIP Soto Micó
    y el CEIP Tomás de Villarroya), y que pasan a partir de 3º de la ESO al IES Juan de Garay -su centro
    adscrito- éste funciona a doble turno, saliendo el 50% de los niños después de las 9 de la noche,
    y aún así está masificado.


    El año pasado la Conselleria d’Educació ya mostró su interés en sacar el primer ciclo de la ESO de
    estos centros con soluciones inaceptables para familias –aulas prefabricadas en solares o reubicación
    en institutos dispensando a los niños, además de alejándolos de sus lugares de residencia-. Tras mantenerse
    diferentes conversaciones con las comunidades educativas, resolvieron posponer la decisión al curso
    2011-2012. Tememos que quieran sacar adelante el compromiso de sacar el primer ciclo de la ESO de
    nuestros centros a cualquier precio y eso ya será definitivo si nos quedamos sin la alternativa del
    IES Patraix, que era lo previsto para el éxodo.


    Por eso, ya terminando, estamos aquí. Por eso les pedimos esos compromisos y ahora quedamos a la espera
    de escuchar sus respuestas y sus propuestas. Por favor, no nos defrauden.


    Gracias.'
