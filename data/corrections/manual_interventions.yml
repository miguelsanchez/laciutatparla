- id: 2025-04-11-2-003
  pleno_id: 2025-04-11-2
  ordre: 3
  intervinient: Rosario González Rodríguez
  entitat: AV Abastos-Finca Roja
  tipus_entitat: av
  barri_o_zona: Abastos
  punts_ordre_dia: Soterramiento de las vías de Serrería
  idioma_original: castellano
  text_original: Voy a ser breve porque creo que Miguel Sánchez ha hecho una exposición impecable de todo lo que está sucediendo
    en esta ciudad. Entonces, lo de Serrería por supuesto que se tiene que solucionar y de la mejor manera para los vecinos,
    no porque políticamente interese hacerlo en unas fechas o en otras fechas. Y me da lo mismo que sea el Gobierno central
    el que ponga los inconvenientes o los ponga el gobierno de la ciudad. Entonces, yo solamente pido o nuestra asociación
    lo único que reclama es una ciudad mucho más social, mucho más preocupada por el medio ambiente, mucho más preocupada
    por los vecinos. Desde luego, nosotros representamos al túnel de la avenida Pérez Galdós, porque eso es insufrible y los
    vecinos están hartos. Ustedes prometieron que lo iban a cerrar y creo que además, incluso había presupuestos de los fondos
    europeos para utilizarlos en ese trabajo. Y entonces, vamos, mi intervención es dar un poco de voz a esos vecinos. Al
    margen de solidarizarme con los de Serrería que llevan todavía mucho más años reclamándole. Nada más. Muchas gracias.
  temes:
  - urbanisme
  - infraestructures
  - barris
  text_cas: ''
  text_val: Seré breu perquè crec que Miguel Sánchez ha fet una exposició impecable de tot el que està passant en esta ciutat.
    Aleshores, el de Serreria per descomptat que s'ha de solucionar i de la millor manera per als veïns, no perquè políticament
    interesse fer-ho en unes dates o en unes altres. I m'és igual que siga el Govern central el que pose els inconvenients
    o els pose el govern de la ciutat. Aleshores, jo sols demane o la nostra associació l'únic que reclama és una ciutat molt
    més social, molt més preocupada pel medi ambient, molt més preocupada pels veïns. Per descomptat, nosaltres representem
    al túnel de l'avinguda Pérez Galdós, perquè això és insuportable i els veïns estan farts. Vostés van prometre que l'anaven
    a tancar i crec que a més, fins i tot hi havia pressupostos dels fons europeus per a utilitzar-los en eixe treball. I
    aleshores, vaja, la meua intervenció és donar un poc de veu a eixos veïns. Al marge de solidaritzar-me amb els de Serreria
    que porten encara molts més anys reclamant-ho. Res més. Moltes gràcies.
  resum_cas: Reclama una ciudad más social y preocupada por el medio ambiente y los vecinos, apoyando la eliminación del túnel
    de Pérez Galdós y solidarizándose con los vecinos de Serrería.
  resum_val: Reclama una ciutat més social i preocupada pel medi ambient i els veïns, recolzant l'eliminació del túnel de
    Pérez Galdós i solidaritzant-se amb els veïns de Serreria.
  source: manual
- id: 2025-04-11-2-004
  pleno_id: 2025-04-11-2
  ordre: 4
  intervinient: Cristóbal Aguado Sanchis
  entitat: AV la Petxina
  tipus_entitat: av
  barri_o_zona: La Petxina
  punts_ordre_dia: Soterramiento de las vías de Serrería
  idioma_original: valenciano
  text_original: Bon dia, senyora alcaldessa. Vull felicitar-la per defensar els interessos de València amb el soterrament
    de les vies en Serreria. Volem confiar en la intenció del Ministeri per a realitzar-ho, encara que els terminis no semblen
    definits. Esperem que arriben a un consens. Segons fonts ministerials, la tramitació administrativa està pendent per la
    falta de documentació de l'Ajuntament, qüestió que vosté nega. Les dues administracions han de resoldre si els informes
    són suficients i esmenar els possibles requeriments. Entenem que és important la coordinació amb altres infraestructures
    ferroviàries com el futur túnel passant que connectarà l'Estació del Nord amb el Corredor Mediterrani. El Ministeri ha
    d'explicar la prioritat i la coordinació dels projectes per a minimitzar les afeccions al servici durant les obres. Es
    desconeixen raons pressupostàries fins que es redacte el projecte, estimat de 260 milions d'euros. El ministre sembla
    disposat a acordar amb la Generalitat i l'Ajuntament, però haurà d'aclarir la forma de finançament abans d'escometre amb
    un cronograma. El soterrament en Serreria és una demanda històrica i necessària per a l'eliminació de la barrera urbana.
    Les vies dividixen en barris com Penya-roja i Natzaret, i el soterrament ho reunificaria. Millorar la mobilitat, eliminar
    passos a nivells i crear connexions transversals facilitaria el trànsit rodat, dels vianants i ciclistes. Regeneració
    urbana. El soterrament alliberaria sòl per a nous espais verds i equipaments. Reducció de l'impacte acústic i visual.
    Eliminaria el soroll i l'impacte visual de trens i vies, millorant la qualitat de vida. I seguretat, es suprimirien els
    riscos d'accidents, augmentant la seguretat per a conductors i vianants. Ens alegrem que l'Ajuntament aposte per estos
    principis de desenvolupament urbà sostenible planificant una ciutat verda i ecològica. El que no entenem perquè ens sembla
    contradictori és que el major projecte urbanístic que escometrà en esta legislatura no s'apliquen els mateixos criteris.
    Parlem de la supressió del túnel de Pérez Galdós, una altra demanda històrica i necessària per justament les mateixes
    raons. Atenció. Eliminació de la barrera urbana. El túnel és una infraestructura obsoleta que dividix els barris i dificulta
    la seua connexió generant una barrera física i social. Millorar la mobilitat. La creació de noves connexions transversals
    facilitaria el trànsit rodat de vianants i ciclistes. Va ser construït com una ronda per agilitzar el trànsit, però amb
    el creixement de la ciutat s'ha convertit en un eix viari intern, per la qual cosa la seua pacificació és fonamental.
    Regeneració urbana. L'eliminació obriria la possibilitat d'una millor reurbanització de l'avinguda creant espais més amables,
    amb millors zones verdes i major integració. Reducció de l'impacte acústic i visual. El trànsit pel túnel genera contaminació
    acústica de l'aire que empitjora la qualitat de vida de les persones a l'avinguda. I seguretat, es considera un punt negre
    on han ocorregut accidents de trànsit i mantindre'l no elimina este risc. Alcaldessa, el soterrament de Serreria depén
    del Ministeri, però l'eliminació del túnel de Pérez Galdós és la seua responsabilitat directa. Siga conseqüent amb els
    principis que li exigix al Govern central i aplique'ls també en aquests projecte, Suprimisca el túnel, per favor. El projecte
    guanyador incloïa voreres amples, tres fileres d'arbres, carril bici, carril bus i l'eliminació del túnel. Es van concedir
    9,9 milions d'euros de fons Next Generation. Amb el canvi de govern s'han buscat excuses per a no eliminar-lo. S'ha utilitzat
    un estudi de la Universitat Politècnica de València per a justificar la seua conservació, al·legant que les parets no
    podrien suportar el pes d'una llosa de cobriment. Però el projecte original no contemplava esta solució, sinó la demolició
    total del túnel, la protecció del col·lector existent amb una llosa i el cobriment amb terra i grava. A més, el Govern
    central li demana justificar el manteniment dels objectius i de les ajudes europees. Però les respostes del consistori
    són insuficients i inexactes. Afirmen que existix un carril bus exclusiu per al transport públic, quan en realitat este
    serà compartit amb els vehicles que vullguen accedir als barris al llarg dels 720 metres de longitud del túnel, és a dir,
    quasi la meitat de l'avinguda. Asseguren que mantindrà la tercera fila d'arbres en el centre de l'avinguda, una cosa impossible
    en la zona del túnel. Justifiquen la millora de la connectivitat transversal entre els barris només amb les voreres més
    amples, ja que així costa menys temps creuar l'avinguda. És ridícul. L'Ajuntament no descarta eliminar el túnel després
    de l'obra, però un any després no ha fet res. El Ministeri ha advertit que mantindre'l incomplix els objectius de les
    ajudes, es perd el carril bus exclusiu, desapareix la gran part de la fila central d'arbres i es manté la barrera entre
    barris. Això pot suposar la devolució de les ajudes i una greu multa. Alcaldessa, li exigim coherència i acció immediata
    per eliminar-lo abans que finalitze l'obra de l'avinguda. Sol·licitem la continuïtat del projecte actual sense demores,
    però al mateix temps la licitació d'un nou projecte per a la supressió del túnel. I si vol, podem fer un ple per a parlar
    més específicament d'aquest tema. Esperem que seguisquen el mateix criteri urbanístic i que la ciutat puga vore com les
    obres de supressió de les barreres urbanes, tant de Serreria com de Pérez Galdós, com altres, puguen ser una realitat
    el més prompte possible. Moltes gràcies.
  temes:
  - urbanisme
  - infraestructures
  - mobilitat
  - medi_ambient
  - barris
  text_cas: Buenos días, señora alcaldesa. Quiero felicitarla por defender los intereses de València con el soterramiento
    de las vías en Serrería. Queremos confiar en la intención del Ministerio para realizarlo, aunque los plazos no parecen
    definidos. Esperamos que lleguen a un consenso. Según fuentes ministeriales, la tramitación administrativa está pendiente
    por la falta de documentación del Ayuntamiento, cuestión que usted niega. Las dos administraciones deben resolver si los
    informes son suficientes y subsanar los posibles requerimientos. Entendemos que es importante la coordinación con otras
    infraestructuras ferroviarias como el futuro túnel pasante que conectará la Estación del Norte con el Corredor Mediterráneo.
    El Ministerio debe explicar la prioridad y la coordinación de los proyectos para minimizar las afecciones al servicio
    durante las obras. Se desconocen razones presupuestarias hasta que se redacte el proyecto, estimado de 260 millones de
    euros. El ministro parece dispuesto a acordar con la Generalitat y el Ayuntamiento, pero deberá aclarar la forma de financiación
    antes de acometer con un cronograma. El soterramiento en Serrería es una demanda histórica y necesaria para la eliminación
    de la barrera urbana. Las vías dividen barrios como Penya-roja y Nazaret, y el soterramiento los reunificaría. Mejorar
    la movilidad, eliminar pasos a nivel y crear conexiones transversales facilitaría el tránsito rodado, de peatones y ciclistas.
    Regeneración urbana. El soterramiento liberaría suelo para nuevos espacios verdes y equipamientos. Reducción del impacto
    acústico y visual. Eliminaría el ruido y el impacto visual de trenes y vías, mejorando la calidad de vida. Y seguridad,
    se suprimirían los riesgos de accidentes, aumentando la seguridad para conductores y peatones. Nos alegramos de que el
    Ayuntamiento apueste por estos principios de desarrollo urbano sostenible planificando una ciudad verde y ecológica. Lo
    que no entendemos porque nos parece contradictorio es que al mayor proyecto urbanístico que acometerá en esta legislatura
    no se apliquen los mismos criterios. Hablamos de la supresión del túnel de Pérez Galdós, otra demanda histórica y necesaria
    por justamente las mismas razones. Atención. Eliminación de la barrera urbana. El túnel es una infraestructura obsoleta
    que divide los barrios y dificulta su conexión generando una barrera física y social. Mejorar la movilidad. La creación
    de nuevas conexiones transversales facilitaría el tránsito rodado de peatones y ciclistas. Fue construido como una ronda
    para agilizar el tránsito, pero con el crecimiento de la ciudad se ha convertido en un eje viario interno, por lo que
    su pacificación es fundamental. Regeneración urbana. La eliminación abriría la posibilidad de una mejor reurbanización
    de la avenida creando espacios más amables, con mejores zonas verdes y mayor integración. Reducción del impacto acústico
    y visual. El tránsito por el túnel genera contaminación acústica del aire que empeora la calidad de vida de las personas
    en la avenida. Y seguridad, se considera un punto negro donde han ocurrido accidentes de tráfico y mantenerlo no elimina
    este riesgo. Alcaldesa, el soterramiento de Serrería depende del Ministerio, pero la eliminación del túnel de Pérez Galdós
    es su responsabilidad directa. Sea consecuente con los principios que le exige al Gobierno central y aplíquelos también
    en este proyecto. Suprima el túnel, por favor. El proyecto ganador incluía aceras amplias, tres hileras de árboles, carril
    bici, carril bus y la eliminación del túnel. Se concedieron 9,9 millones de euros de fondos Next Generation. Con el cambio
    de gobierno se han buscado excusas para no eliminarlo. Se ha utilizado un estudio de la Universidad Politécnica de València
    para justificar su conservación, alegando que las paredes no podrían soportar el peso de una losa de cubrimiento. Pero
    el proyecto original no contemplaba esta solución, sino la demolición total del túnel, la protección del colector existente
    con una losa y el cubrimiento con tierra y grava. Además, el Gobierno central le pide justificar el mantenimiento de los
    objetivos y de las ayudas europeas. Pero las respuestas del consistorio son insuficientes e inexactas. Afirman que existe
    un carril bus exclusivo para el transporte público, cuando en realidad este será compartido con los vehículos que quieran
    acceder a los barrios a lo largo de los 720 metros de longitud del túnel, es decir, casi la mitad de la avenida. Aseguran
    que mantendrá la tercera fila de árboles en el centro de la avenida, algo imposible en la zona del túnel. Justifican la
    mejora de la conectividad transversal entre los barrios solo con las aceras más amplias, ya que así cuesta menos tiempo
    cruzar la avenida. Es ridículo. El Ayuntamiento no descarta eliminar el túnel después de la obra, pero un año después
    no ha hecho nada. El Ministerio ha advertido que mantenerlo incumple los objetivos de las ayudas, se pierde el carril
    bus exclusivo, desaparece gran parte de la fila central de árboles y se mantiene la barrera entre barrios. Esto puede
    suponer la devolución de las ayudas y una grave multa. Alcaldesa, le exigimos coherencia y acción inmediata para eliminarlo
    antes de que finalice la obra de la avenida. Solicitamos la continuidad del proyecto actual sin demoras, pero al mismo
    tiempo la licitación de un nuevo proyecto para la supresión del túnel. Y si quiere, podemos hacer un pleno para hablar
    más específicamente de este tema. Esperamos que sigan el mismo criterio urbanístico y que la ciudad pueda ver cómo las
    obras de supresión de las barreras urbanas, tanto de Serrería como de Pérez Galdós, como otras, puedan ser una realidad
    lo antes posible. Muchas gracias.
