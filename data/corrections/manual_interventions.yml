- id: 2023-10-24-101
  pleno_id: '2023-10-24'
  ordre: 6
  intervinient: Jorge Eliseo Marín Jiménez
  entitat: Associació de Veïns de Sant Antoni-la Saïdia
  tipus_entitat: av
  idioma_original: castellano
  text_original: 'Venimos hoy aquí lanzando de nuevo un desesperado grito de auxilio para salvar esos
    edificios, testigos de un pasado industrial y huertano de nuestra barriada que la codicia de unas
    empresas especuladoras intenta eliminar y en las que los vecinos y vecinas del barrio soñaban como
    lugares donde localizar los equipamientos y servicios municipales que tanto necesitamos. También queremos
    protección para esas edificaciones, algunas casi centenarias, del entorno de la calle Sagunto que
    recuerdan la fisonomía histórica de nuestro barrio.

    No nos defrauden, volvemos a pedirles, señoras y señores concejales, que tengan la valentía de hacer
    lo necesario para que estas naves, su pavimento, sus azulejerías, su panel cerámico de Nuestra Señora
    de la Cabeza, de 1935, que ostenta la protección como bien de relevancia local, el brazo seco de la
    acequia de Guala, también BRL, no sucumban ante la entrada de las excavadoras. Llevamos dos años y
    casi y medio intensos de lucha vecinal en los que hemos logrado dar a conocer nuestras razones y reivindicaciones,
    uniendo vecinos de distintas formas de pensar en un objetivo común de mejorar nuestro barrio.

    Por todo ello, vemos necesario modificar las calificaciones urbanísticas de las parcelas de la calle
    Guala en dotacionales y luego nos sentaremos a pensar, a negociar sobre el mantenimiento de las naves.
    Se nos han presentado proyectos de mantener las dos naves, de mantener una o de derribar las dos y
    hacer un nuevo edificio. Es pronto para hablar de este tema, pero la lógica dice que si el conjunto
    tiene valores arquitectónicos y del pasado industrial de nuestro barrio y de la ciudad, se debe mantener
    la totalidad de los edificios.

    Muchas gracias por escucharnos, aquí nos tendrán siempre que se traten temas para mejorar nuestro
    barrio y nuestra querida València, con exigencia y compromiso ante las instituciones, pero desde la
    colaboración leal, desde el debate de ideas y con el objetivo de conseguir un mejor bien común de
    nuestros vecinos y vecinas.'
  reason: 'Acta: Mateu shares her turn with Sr. Jorge Eliseo Marín Jiménez; his speech (''Sr. Marín:'')
    was not extracted.'
  date: '2026-10-20'
  finding: E1b-de75d58d88
  text_val: 'Vinc ací **llançant un desesperado crit d''auxili** per a salvar aquells edificis, testimonis
    d''un **passat industrial i de l''horta** de la nostra barriada que la cobdícia d''unes empreses especuladores
    intenta eliminar i en les quals els veïns i veïnes del barri somniaven com a llocs on localitzar els
    **equipaments i serveis municipals** que tant necessitem. També volem **protecció** per a aquelles
    edificacions, algunes **gairebé centenàries**, de l''entorn del carrer Sagunto que recorden la **fisionomia
    històrica** del nostre barri.


    No ens defraudeu, tornem a demanar-vos, senyores i senyors regidors, que tingueu la **valentia** de
    fer allò necessari perquè aquelles naus, el seu paviment, les seues rajoleries, el seu **panell ceràmic
    de la Nostra Senyora de la Cabeza, de 1935**, que ostenta la protecció com a **bé de rellevància local**,
    el **braç sec de la sèquia de Guala**, també BRL, no sucumbeixin davant l''entrada de les excavadores.
    Portem **dos anys i gairebé mig** intensos de **lluita veïnal** en els quals hem aconseguit donar
    a conèixer les nostres raons i reivindicacions, unint **veïns de diferents formes de pensar** en un
    objectiu comú de **millorar el nostre barri**.


    Per tot açò, veiem necessari **modificar les qualificacions urbanístiques** de les parcel·les del
    carrer Guala en dotacionals i després ens asseurem a pensar, a negociar sobre el manteniment de les
    naus. Se''ns han presentat projectes de mantindre les dues naus, de mantindre una o de derrocar les
    dues i fer un edifici nou. És prompte per a parlar d''aquest tema, però la lògica diu que si el conjunt
    té **valors arquitectònics i del passat industrial** del nostre barri i de la ciutat, **s''ha de mantindre
    la totalitat dels edificis**.


    Moltes gràcies per escoltar-nos, ací ens tindreu sempre que es tracten temes per a millorar el nostre
    barri i la nostra estimada València, amb exigència i compromís davant les institucions, però des de
    la col·laboració lleial, des del debat d''idees i amb l''objectiu de conseguir un millor bé comú dels
    nostres veïns i veïnes.'
  resum_cas: La Asociación de Vecinos de Sant Antoni-la Saïdia demanda la protección y conservación de
