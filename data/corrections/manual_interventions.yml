  text_cas: 'Buenos días a todos.

    Soy vecino de Valencia y presidente del Comité de Empresa de RTVV, que siempre hemos tenido **voluntad
    de negociar** y buscar una solución para salvar la empresa. Se aducen razones económicas para cerrar
    RTVV porque dicen que es más cara, no son ciertas. Cerrar RTVV en los Presupuestos de 2014 de la Generalidad
    Valenciana le cuesta más de **130 millones de euros**, mantenerla menos de **100 millones de euros**.
    Las cifras son tan claras que son irrebatibles.


    Voluntad de diálogo la hay. Por primera vez ayer afortunadamente el vicepresidente de la Generalidad
    Valenciana nos recibió y nos escuchó. Es la primera persona que nos escucha durante dos años porque
    otros han hecho paripés, no nos han escuchado y han fingido. No lo digo yo, lo dice una sentencia
    del TSJCV que establece como una de las causas principales por la cual se ha tumbado un **ERO ilegal**
    que tiró a la calle a **952 trabajadores** vulnerando los derechos constitucionales la falta de diálogo
    por parte de la empresa, que tenía como único objetivo un objetivo predeterminado de privatizar y
    tirar trabajadores públicos.


    Esto le ha repercutido a las arcas públicas un grave perjuicio. Nosotros mantenemos la **mano extendida**.
    **RTVV es viable**, solo falta que no se le haga un daño grave al pueblo valenciano después de haberle
    lo hecho y haber torturado durante dos años a los trabajadores de la casa. Porque no solo es el sector
    audiovisual valenciano sino que aquellos que aprendieron nuestra lengua, sabrían que nuestra lengua
    se podía leer cuando tenían más de 10 años, que ni mi abuela hablaba castellano, yo aprendí el castellano
    en la tele y hasta los cuatro años no lo hablaba. Aquellos que somos iguales que los que hablan castellano
    y tienen derecho con Madrid a cambiar su canal y ver su tele, por no cumplir una sentencia judicial
    no pueden castigar al conjunto del pueblo valenciano.


    Y no lo pueden hacer en una ciudad donde tan importante papel ha tenido en la difusión de sus fiestas,
    su cultura y el conocimiento de esta tierra y de este pueblo en el conjunto de todo el territorio
    como ha sido RTVV, que solo en las fallas ha hecho unas fantásticas retransmisiones. Y cuando acabaron
    las últimas, con más de un **30% de audiencia**, arbitrariamente como ha establecido la sentencia
    tiraron a la calle de forma injusta y vulnerando sus derechos constitucionales al **90% de los cámaras
    y trabajadores** que estaban cubriendo las mascletadas.


    Tienen ahora la oportunidad de rectificar, le harán un bien al pueblo. Las razones económicas no existen
    y hay una voluntad manifestada ayer por la Vicepresidencia de la Generalidad de que **RTVV los dos
    próximos años no le cuesta un euro** más de los que la Generalidad tiene presupuestados, solo es una
    cuestión de **voluntad política**. Les pedimos el **mantenimiento de esta empresa**, cerrarla le hace
    mal al conjunto de la ciudadanía.


    Muchas gracias.'
