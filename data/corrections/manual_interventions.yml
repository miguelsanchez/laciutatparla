    el nostre barri això se materialitza en esta proposta urbanística, que hi havia marge per la titularitat
    de les parcel·les per apostar més decididament per un percentatge més gran de vivenda social, de vivenda
    assequible per als ciutadans normals d'esta ciutat, que cada vegada sembla anar més lluny, per a poder
    seguir fent les seues vides. I en concret, hi ha una parcel·la, l’anomenada de la séquia de Rascanya,
    en la que s'ha incrementat espectacularment la densitat d'ocupació i la volumetria i que nosaltres,
    en el termini d’exposició pública anem a manifestar rotundament la nostra oposició a què continuen
    les maniobres especulatives en Campanar i s’aposte més decididament, com dic, per una ciutat i un
    barri més habitable per als veïns normals de la capital, que sí que siga una ciutat verda i habitable.
  reason: Second AV Campanar speaker (Sr. Fidel) introduced in the acta but not extracted.
  date: '2026-10-20'
  finding: E1b-324e6e0e8e
  text_cas: Buen día. Otro de los puntos que quisiéramos remarcar respecto de esta propuesta de aprobación
    del urbanismo de Campanar es que, como el resto de la ciudad, **se está tornando cada vez más inhabitable**,
