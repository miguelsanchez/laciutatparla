- id: 2018-07-26-101
  pleno_id: '2018-07-26'
  ordre: 1
  intervinient: Victor Pons Roger
  entitat: Associació Cultural Penya Taurina el Carpesano
  tipus_entitat: cultural
  idioma_original: castellano
  text_original: 'Buenos días. En primer lugar, me gustaría enseñarles esta fotografía, no sé si se ve
    muy bien. Es la fotografía de un toro cerril que fue embolado el año pasado en Foios, con un alcalde
    de Compromís que dejó embolar en Foios este toro cerril. Este toro cerril tuvo la mala suerte de chocar
    contra el pilón, desnucarse y morir en el acto. Fue un día triste para todos los taurinos. Déjenme
    que les muestre otra fotografía. Esta es la del caballo Hickstead, es el mejor caballo del mundo.
    Es un caballo precioso, muy valioso, el campeón de los saltos. Aquí está en otra imagen tumbado en
    el suelo, le acaba de dar un infarto y ha fallecido en mitad de una competición. Supongo que los prohibicionistas
    de Compromís querrán prohibir la hípica. Menuda barbaridad, ¿no? Subirse encima de un animal, golpearle
    con los talones, golpearle con la fusta, obligarle a girar la cabeza, obligarle a saltar. El proceso
    de la doma debe ser traumático para el caballo, ¿no? La hípica nos ha acompañado durante miles de
    años y es la comunión perfecta entre hombre y animal, pero supongo que ustedes la quieren prohibir.


    Este es Faruk, este es el galgo más rápido de España. Persiguiendo una liebre se chocó contra una
    piedra, se desnucó y se murió. Supongo que ustedes también quieren prohibir que los galgos persigan
    liebres. Porque todas estas fotografías que les he mostrado no son más que accidentes. Los accidentes
    pasan, no son deseables pero ocurren. El toro se desnucó igual que se desnucó Faruk. La verdad es
    que la estadística dice que los accidentes ocurren en els bous al carrer en un 0,29 % de las ocasiones.
    Lesiones de todo tipo, lesiones en la pierna, un pequeño corte en la cabeza. Un 0, 29 % no es una
    gran estadística.


    Debemos de tener en cuenta que estos animales el 5 % de ellos muere a causa de las cornadas que otros
    animales les han hecho porque son animales bien armados, violentos y que a veces se matan entre ellos.
    Por lo tanto, un 0,29 % de lesiones hace que estos festejos sean festejos seguros para los animales
    y que no haya motivo para prohibirlos.


    Déjenme que les diga en qué tres pilares se debe de basar un buen gobernante para ser un buen gobernante
    y se van a dar cuenta lo malos gobernantes que son ustedes. El primero de ellos es la ciencia. Un
    gobernante no puede ser un analfabeto científico, debe de basarse en las estadísticas como el 0,29
    % que le acabo de decir, debe basarse en los estudios científicos que avalan que el toro embolado
    no sufre. El lunes pasado hubo en la Plaza de Toros un simposio con seis veterinarios que demostraban
    sus investigaciones y decían sin lugar a dudas que el toro embolado no sufre. No vi a nadie de Compromís,
    supongo que estaban esperando que les llegue la ciencia infusa o tirar los dados para saber si los
    toros sufren o no. Los veterinarios expertos dicen que no sufren. Por lo tanto, dejen de mentir.


    El segundo pilar en el que se debe basar un buen gobernante es el respeto a la democracia. El respeto
    a la democracia entendiéndola como ideología, como una ideología que sostiene que todas las personas
    tienen los mismos derechos y libertades, que da lo mismo si es pobre o rico, hombre o mujer. O si
    uno vive en Foios donde el sábado pasado se embolaron a tres toros o vive en Carpesa donde el sábado
    pasado no nos dejaron embolar. Ustedes son completamente antidemocráticos y son dictatoriales porque
    están haciendo que vecinos de las pedanías no tengan los mismos derechos que vecinos de Bonrepós o
    de Foios, que son gobernados por alcaldes de Compromís y que tienen más derechos que nosotros.


    El tercer pilar que debe tener un buen gobernante es el respeto a las tradiciones del pueblo que le
    ha votado porque a ustedes les ha votado el pueblo de València, no los rusos o los chinos o los australianos.
    El pueblo de València. A lo mejor al Sr. Ribó le encanta la crema catalana o al Sr. Grezzi le encanta
    los espaguetis y la pizza, pero aquí nos gusta la paella, nos gusta la horchata, nos gusta jugar al
    truc y nos gusta embolar toros. Esa es nuestra tradición y nuestra tradición es nuestra identidad.
    Y si ustedes nos quitan nuestras tradiciones nos están quitando nuestra identidad ser valencianos.
    Un buen gobernante respeta las tradiciones de su pueblo. Ustedes son muy malos gobernantes porque
    no respetan la ciencia, no respetan la democracia y no respetan las tradiciones del pueblo que les
    ha elegido. No nos representan, desde luego que no. Y son un caso perdido. Así que voy a hablar con
    los concejales de Ciudadanos y del PSOE para pedirles que voten a favor de esta moción, que levanten
    esta prohibición y que respeten al alcalde de Borbotó que está allí, que votó a favor. Porque el toro
    se embola en Borbotó, no se embola en la plaza del Ayuntamiento, no se embola en Ruzafa. Se embola
    en las pedanías y en las pedanías ha salido a favor. El PSOE, todo él puede votar a favor. Ramón Vilar
    no está pero pueden ponerse en el ordenador y votar a favor. No hace falta que esté aquí. Así que
    por favor voten a favor de la ciencia, de la democracia, del respeto a las tradiciones y del respeto
    a las pedanías. Muchas gracias.'
