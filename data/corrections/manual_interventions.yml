- id: 2026-05-26-101
  pleno_id: '2026-05-26'
  ordre: 6
  intervinient: José Antonio Barbas Guillem
  entitat: AV Nazaret Unido
  tipus_entitat: av
  idioma_original: castellano
  text_original: 'Hola, buenos días y gracias, señora alcaldesa. Señores concejales.

    Como sabéis, soy José Antonio Barba, vecino de Nazaret, y vuelvo a estar aquí porque mis vecinos siguen
    esperando. El mes pasado vine a hablar de las vías del tren y de 30 años de promesas incumplidas.
    Hoy quiero empezar por algo diferente. Parece que el PAI del Grau va a salir por fin adelante y eso
    para mis vecinos es muchísimo. Cientos de viviendas y un gran Delta Verde que va a conectar el Turia,
    el jardín del Turia con el mar.

    Pero yo quiero llamar la atención sobre el nuevo puente sobre el jardín del Turia que va a unir Nazaret-Moreras
    con el nuevo barrio del Grau. Quizá fuera eso parecer un detalle técnico, pero para un vecino de Nazaret
    eso lo cambia todo. Nazaret está pegada al mar, pegada al puerto, pegada al jardín del Turia. Y sin
    embargo, durante décadas hemos vivido como una isla, sin poder salir por ninguna parte, siempre con
    la sensación de que la ciudad está cerca pero no te deja entrar. Este puente para Nazaret no queda
    tan desconectada en nuestro día a día, al menos en eso va a ser un poco mejor. Por eso este puente
    importa y les pido que pongan un acuerdo para no retrasarlo más.

    Pero no puedo irme sin recordar algo más. Los promotores del PAI han aportado casi 6 millones de euros
    para el soterramiento de las vías de Serrería. Los promotores privados y los vecinos hemos puesto
    millones de euros para ese soterramiento. Y años después, aquí seguimos esperando. Dicen que harán
    un puente provisional sobre las vías para que el barrio pueda funcionar mientras el Ministerio hace
    un puente que tendrá que derribarse el día que llegue el soterramiento del que se llega. El PAI va
    a avanzar por las vías del tren, va a seguir ahí sin el soterramiento y partiendo en dos la zona que
    debería estar unida. No pido más estudios ni más reuniones, pido que el Ministerio cumpla lo prometido.
    El PAI del Grau nos alegra, pero a lo mejor la mejor noticia sería que el día ese, cuando provisionalmente
    se derribe ese puente, esa barrera de hierro desaparezca y nos permita ser de verdad un solo barrio.
    Este es el día en que estamos esperando donde poder unirnos los cuatro barrios como uno solo y ser
    hermanos todos juntos y ser una familia conviviendo juntos.

    Muchas gracias.'
  reason: 'Missed speaker in the acta: ''José Antonio Barbas Guillem – Nazaret Unidos'' (resident of Nazaret)
