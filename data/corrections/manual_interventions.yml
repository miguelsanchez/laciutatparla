    via pública. El que hui és un espai de respir, demà pot ser un focus de saturació invivible.


    A més, **la salut pública és un eix que no és negociable**. La salut urbana no és un concepte abstracte.
    Es mesura en la qualitat de l''aire i en les hores de sueño dels veïns, per exemple. La implantació
    d''estos macrocomplexos turístics comporta **soroll crònic** per la alta rotació i l''oci associat
    que provoquen **insòmni, estrés i hipertensió**. Patologies que a més agraven patologies ja presents,
    generen patologies noves, ja siga de tipus orgànic o de salut mental. Jo soc metge i ho vull tots
    els dies en la meva consulta en el barri de Ruzafa.


    Contaminació. L''augment del tràfic i la creació de parkings privats incrementen les emissions en
    zones ja tensionades.


    Deterioro social. L''expulsió de residents genera **inseguretat residencial** i pèrdua de les xarxes
    d''ajuda veïnal, afectant directament a la salut mental de la població. La ciutat deixa de ser **un
    lloc per a viure** per a convertir-se en **un producte de consum**.


    I es tracta d''**una emergència climàtica i de resiliència**. València és especialment vulnerable,
    com sabem, a ones de calor i episodis meteorològics extrems. La planificació urbana actual ha de prioritzar
    mobilitat sostenible i edificació bioclimàtica.


    La construcció turística intensiva en patis de manzana contradiu tots estos principis i augmenta la
    nostra vulnerabilitat. No podem seguir autoritzant projectes basats en paràmetres de 1988 quan l''escenari
    climàtic de 2026 ens exigeix solucions radicalment distintas.


    ¿I quines són les nostres sol·licituds, senyores i senyors regidors? Este no és un **debat contra
    el turisme**, sinó **sobre quina ciutat volem ser**.


    Per tot, l''exposat sol·licitem a este Ajuntament **una revisió immediata del Pla General d''Ordenació
    Urbanística** amb la incorporació transversal de criteris de turistificació, canvi climàtic i salut
    pública. **La protecció dels patis de manzana**. Prohibir la seua explotació com a allojaments temporals
    o fórmules camuflades com a coworking, coliving, flexliving. **La moratòria de vivendes temporals**,
    el cessament de noves llicències en tota la ciutat fins que el nou marc regulador estiguen vigent
    i amb caràcter retroactiu. I **la participació ciutadana real**. Que les entitats veïnals i experts
    formen part activa d''este procés de canvi.


    **L''interior d''una manzana no és una solar**, és un sistema ambiental compartit, és patrimoni dels
    veïns, és ciutat. I la ciutat, senyores i senyors, pertany als veïns i veïnes de cada barri. Va eixir
    en premsa que València és una de les 20 millors ciutats del món per a viure i el que volem és que
    també ho siga per als veïns.


    Gràcies.'
  resum_cas: La Asociación AFA CEIP Alejandra Soler, representando a más de 29 comunidades de propietarios
    y un millar de vecinos de Russafa, denuncia la turistificación intensiva en patios de manzana como
    una amenaza estructural para la ciudad que afecta a la salud pública, aumenta la contaminación y vulnerabilidad
    climática, solicitando una revisión urgente del Plan General de Ordenación Urbanística y una moratoria
    de viviendas temporales.
