- id: 2018-12-20-103
  pleno_id: '2018-12-20'
  ordre: 7
  intervinient: David Izquierdo Chova
  entitat: Federació Empresarial d'Hostaleria de València (FEHV)
  tipus_entitat: empresa
  idioma_original: castellano
  text_original: 'Buenos días.

    Vamos a intentar explicar a todos los miembros del Pleno nuestra disposición en relación a este punto
    como organización más representativa del sector hostelero en València.


    Miren, desde 2010, momento en el que se inició el expediente de la ZAS del Carmen, hasta hoy, incluidas
    las reuniones de su mesa de trabajo, la Federación de Hostelería ha expresado siempre su rechazo al
    recorte de horarios debido a los graves perjuicios que esta medida puede suponer no solo para las
    actividades de hostelería sino también para el barrio en general.


    Queremos recordar que estos locales tienen un gran arraigo social en el barrio, caracterizado hoy
    por su carácter cultural y patrimonial. Estos locales, a los que se quiere criminalizar, ayudaron
    a cambiar la fisonomía del Carmen en aquellos años de los que nadie quiere acordarse, en los que el
    Carmen era un barrio degradado y caracterizado por ser el epicentro de la prostitución y la drogadicción
    callejera de la ciudad, situación que por cierto hoy se viene dando en calles aledañas.


    Curiosamente, una de las mayores zonas ZAS de toda España, con una superficie de más de 370.000 m2,
    sólo dispone de seis sonómetros para determinar los valores acústicos de toda la zona, lo que nos
    parece un número del todo insuficiente.


    Desde la Federación siempre hemos compartido la necesidad de una aplicación efectiva de las medidas
    cautelares aprobadas ya en 2010, lo que a nuestro entender no se ha producido ya que solo después
    de esta aplicación real de las medidas cautelares es cuando se podrá conocer objetivamente la situación
    acústica del barrio.


    Pero aun así, y con los datos proporcionados por el propio Ayuntamiento de València, actualmente se
    observa una mejoría general de las mediciones acústicas de la zona, lo que permitiría incidir en otras
    medidas menos restrictivas que el propio recorte del horario de las terrazas. Y para colmo, nos encontramos
    con que se amplía en una hora el horario de las tiendas de conveniencia, que sí generan acumulaciones
    multitudinarias en la calle y sí que genera problemas de conciliación con el descanso vecinal.


    Además, a esta declaración definitiva se suman la tramitación del Plan Especial de Protección de Ciutat
    Vella y la adaptación de las terrazas a la nueva ordenanza reguladora.


    Los hosteleros somos los primeros interesados en que la situación acústica del barrio se normalice,
    los primeros. Pero después de 20 años seguimos haciendo lo mismo y el resultado, como vemos hoy en
    ese Pleno, sigue siendo el mismo que hace 20 años.


    El modelo de declaración de zona ZAS para la lucha contra el ruido está desfasado y València necesita
    nuevas fórmulas más innovadoras que permitan la conciliación del ocio con el descanso de los vecinos.


    Por todos estos argumentos, y acabo con esto, solicitamos:

    1. Que no se adopte hoy el acuerdo de declaración definitiva de la ZAS del Carmen.

    2. Que se apliquen de manera efectiva y real las medidas cautelares aprobadas en 2010.

    3. Que además de estas medidas se implementen otras propuestas alternativas que planteamos en nuestras
    alegaciones, como mantener el horario de las tiendas de conveniencia, un plan urgente de lucha contra
    el botellón, el control de apartamentos ilegales o la elaboración de un plan integral de ocio ligado
    a la figura del alcalde de noche que tanto hemos reclamado.

    4. Por último, solicitamos la convocatoria urgente de la mesa de trabajo, recogida en las medidas
    cautelares, para debatir estas propuestas por todos los colectivos implicados.


    Gracias.'
