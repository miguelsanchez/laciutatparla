- id: 2025-04-11-2-005
  pleno_id: 2025-04-11-2
  ordre: 5
  intervinient: José A. Barba
  entitat: AV Nazaret Unido
  tipus_entitat: av
  barri_o_zona: Nazaret
  punts_ordre_dia: Soterramiento de las vías de Serrería
  idioma_original: castellano
  text_original: Buenos días. Muchas gracias, alcaldesa, y al conjunto de la corporación por darnos la posibilidad de tomar
    la palabra en este pleno sobre una cuestión que afecta y preocupa, y mucho, a los vecinos del barrio de Nazaret. Tomamos
    la palabra para alzar la voz desde el barrio de Nazaret, quizá para algunos de ustedes un barrio menor. Para alzar la
    voz y reclamar una vez más lo que consideramos una cuestión de justicia social y urbana, de equidad territorial y sobre
    todo, de dignidad para nuestro barrio, para la ciudad de València, como es el soterramiento de las vías de Serrería. Las
    vías de Serrería constituyen desde hace décadas una cicatriz que atraviesa y divide nuestra ciudad. Para el barrio de
    Nazaret esta barrera ferroviaria ha supuesto un aislamiento crónico, una desconexión física y simbólica del resto de València,
    dificultando el desarrollo, la cohesión y las oportunidades para nuestros vecindarios. Acabar con esta barrera no es un
    capricho, es una necesidad urgente y un proyecto de ciudad que debe abordarse con valentía y visión de futuro. En este
    sentido, desde la Asociación estamos totalmente de acuerdo con los planteamientos que defiende la alcaldesa y su equipo
    de gobierno en el Ayuntamiento de València. Porque hemos escuchado algunas promesas, algunas propuestas y muchas declaraciones,
    pero las cosas deben hacerse bien y no dejar a medias un problema que ha de salir del paso. Esto no es resolver un problema,
    es un agravio. Hay soterramiento de las vías y como hemos venido defendiendo muchas veces, las vías deben ser soterradas
    lo más al sur posible. Teóricamente al menos llega el soterramiento prácticamente hasta la pista del Saler. Solo así garantiza
    la verdadera integración por la ciudad y la calidad de vida del barrio. Es un proyecto que puede seguir siendo una patada
    hacia adelante. No queremos más excusas. Los vecinos y vecinas de Nazaret estamos cansados de promesas que nunca se concretan
    y de retrasos injustificados y de argumentos técnicos que solo parecen aplicarse cuando se trata de València. Exigimos
    al Gobierno de España un compromiso firme, claro y definitivo con esta actuación. No entendemos y no podemos aceptar que
    mientras otras ciudades como Barcelona o municipios de su área metropolitana se llevan a cabo operaciones ferroviarias
    con su soterramiento multimillonario o mientras en el País Vasco se desarrollan proyectos similares, aquí se nos niega
    una actuación como mínimo menos costosa y tan necesaria para los valencianos. Es legítimo que nos sintamos discriminados,
    no hay otra palabra. Para los vecinos de València y en especial los del barrio como es Nazaret tenemos que conformarnos
    con menos. ¿Por qué seguimos siendo tratados como ciudadanos de segunda? Esto no es un proyecto menor, ni localista. Es
    un proyecto de ciudad, de futuro, que afecta a la forma de vida de miles de personas y al modelo de desarrollo que queremos
    en nuestro barrio para la ciudad. Como representante nuestros que son, queremos pedirles que exijan al Gobierno de España
    que deje atrás la ambigüedad, que escuche a la ciudad y a sus barrios, que se siente a trabajar junto al Ayuntamiento
    para avanzar en el soterramiento de las vías de Serrería, aún más cuando el Ayuntamiento ya ha expresado su voluntad de
    cofinanciar la creación e incluso adelantar parte del presupuesto. No pedimos privilegios, pedimos justicia. No queremos
    ser menos y no vamos a permitir ser muchos menos porque nuestro barrio se está jugando mucho. Reclamamos igualdad de trato
    a fin de que la marginación histórica dé una solución estructural de una barrera que llevamos demasiado tiempo sufriendo
    y no pararemos por lograrla. Muchas gracias.
  temes:
  - urbanisme
  - infraestructures
  - mobilitat
  - barris
  text_cas: ''
  text_val: Bon dia. Moltes gràcies, alcaldessa, i al conjunt de la corporació per donar-nos la possibilitat de prendre la
    paraula en este ple sobre una qüestió que afecta i preocupa, i molt, als veïns del barri de Natzaret. Prenem la paraula
    per alçar la veu des del barri de Natzaret, potser per a alguns de vostés un barri menor. Per alçar la veu i reclamar
    una vegada més el que considerem una qüestió de justícia social i urbana, d'equitat territorial i sobretot, de dignitat
    per al nostre barri, per a la ciutat de València, com és el soterrament de les vies de Serreria. Les vies de Serreria
    constituïxen des de fa dècades una cicatriu que travessa i dividix la nostra ciutat. Per al barri de Natzaret esta barrera
    ferroviària ha suposat un aïllament crònic, una desconnexió física i simbòlica de la resta de València, dificultant el
    desenvolupament, la cohesió i les oportunitats per als nostres veïnats. Acabar amb esta barrera no és un caprici, és una
    necessitat urgent i un projecte de ciutat que ha d'abordar-se amb valentia i visió de futur. En este sentit, des de l'Associació
    estem totalment d'acord amb els plantejaments que defén l'alcaldessa i el seu equip de govern a l'Ajuntament de València.
    Perquè hem escoltat algunes promeses, algunes propostes i moltes declaracions, però les coses han de fer-se bé i no deixar
    a mitges un problema que ha d'eixir del pas. Això no és resoldre un problema, és un greuge. Hi ha soterrament de les vies
    i com hem vingut defensant moltes vegades, les vies han de ser soterrades el més al sud possible. Teòricament almenys
    arriba el soterrament pràcticament fins a la pista del Saler. Sols així garantix la veritable integració per la ciutat
    i la qualitat de vida del barri. És un projecte que pot seguir sent una puntada de peu cap endavant. No volem més excuses.
    Els veïns i veïnes de Natzaret estem cansats de promeses que mai es concreten i de retards injustificats i d'arguments
    tècnics que sols semblen aplicar-se quan es tracta de València. Exigim al Govern d'Espanya un compromís ferm, clar i definitiu
    amb esta actuació. No entenem i no podem acceptar que mentre altres ciutats com Barcelona o municipis de la seua àrea
    metropolitana es duen a terme operacions ferroviàries amb el seu soterrament multimilionari o mentre al País Basc es desenvolupen
    projectes similars, ací se'ns nega una actuació com a mínim menys costosa i tan necessària per als valencians. És legítim
    que ens sentim discriminats, no hi ha una altra paraula. Per als veïns de València i especialment els del barri com és
    Natzaret hem de conformar-nos amb menys. Per què continuem sent tractats com a ciutadans de segona? Això no és un projecte
    menor, ni localista. És un projecte de ciutat, de futur, que afecta la forma de vida de milers de persones i al model
    de desenvolupament que volem en el nostre barri per a la ciutat. Com a representants nostres que són, volem demanar-los
    que exigisquen al Govern d'Espanya que deixe arrere l'ambigüitat, que escolte la ciutat i els seus barris, que s'assega
    a treballar junt amb l'Ajuntament per a avançar en el soterrament de les vies de Serreria, encara més quan l'Ajuntament
    ja ha expressat la seua voluntat de cofinançar la creació i fins i tot avançar part del pressupost. No demanem privilegis,
    demanem justícia. No volem ser menys i no anem a permetre ser molt menys perquè el nostre barri s'hi està jugant molt.
    Reclamem igualtat de tracte a fi que la marginació històrica done una solució estructural d'una barrera que portem massa
    temps patint i no pararem per aconseguir-la. Moltes gràcies.
  resum_cas: Exige al Gobierno de España un compromiso firme con el soterramiento de las vías de Serrería, denunciando el
    aislamiento crónico del barrio de Nazaret y reclamando igualdad de trato respecto a otras ciudades.
  resum_val: Exigeix al Govern d'Espanya un compromís ferm amb el soterrament de les vies de Serreria, denunciant l'aïllament
    crònic del barri de Natzaret i reclamant igualtat de tracte respecte a altres ciutats.
  source: manual
