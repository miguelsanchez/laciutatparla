  text_val: 'Bon dia.

    Anem a intentar explicar a tots els membres del Ple la nostra disposició en relació a este punt com
    a organització més representativa del sector de l''hostaleria a València.


    Mireu, des de 2010, moment en el qual es va iniciar l''expedient de la ZAS del Carme, fins hui, incloses
    les reunions de la seua taula de treball, la Federació d''Hostaleria ha expressat sempre el seu rebuig
    a la reducció d''horaris a causa dels greus perjudicis que esta mesura pot suposar no sols per a les
    activitats d''hostaleria sinó també per al barri en general.


    Volem recordar que estos locals tenen un gran arrelament social en el barri, caracteritzat hui pel
    seu caràcter cultural i patrimonial. Estos locals, als quals es vol criminalitzar, van ajudar a canviar
    la fisonomia del Carme en aquells anys dels quals ningú vol recordar-se, en els quals el Carme era
    un barri degradat i caracteritzat per ser l''epicentre de la prostitució i la drogoaddicció al carrer
    de la ciutat, situació que per cert hui es ve donant en carrers adjacents.


    Curiosament, una de les majors zones ZAS de tota Espanya, amb una superfície de més de 370.000 m2,
    sols disposa de sis sonòmetres per a determinar els valors acústics de tota la zona, la qual cosa
    ens pareix un nombre del tot insuficient.


    Des de la Federació sempre hem compartit la necessitat d''una aplicació efectiva de les mesures cautelars
    aprovades ja en 2010, la qual cosa al nostre entendre no s''ha produït ja que sols després d''esta
    aplicació real de les mesures cautelars és quan es podrà conéixer objectivament la situació acústica
    del barri.


    Però encara així, i amb les dades proporcionades per l''propi Ajuntament de València, actualment s''observa
    una millora general de les mesuraments acústiques de la zona, la qual cosa permetria incidir en altres
    mesures menys restrictives que la pròpia reducció de l''horari de les terrasses. I per a rematar,
    ens trobem que s''amplia en una hora l''horari de les botigues de conveniència, que sí que generen
    acumulacions multitudinàries al carrer i sí que generen problemes de conciliació amb el descans veïnal.


    A més, a esta declaració definitiva se sumen la tramitació del Pla Especial de Protecció de Ciutat
    Vella i l''adaptació de les terrasses a la nova ordenança reguladora.


    Els hostalers som els primers interessats en que la situació acústica del barri es normalitze, els
    primers. Però després de 20 anys seguim fent el mateix i el resultat, com veiem hui en eixe Ple, continua
    sent el mateix que fa 20 anys.


    El model de declaració de zona ZAS per a la lluita contra el soroll està desfasat i València necessita
    noves fórmules més innovadores que permeten la conciliació de l''oci amb el descans dels veïns.


    Per tots estos arguments, i acabe amb això, sol·licitem:

    1. Que no s''adopte hui l''acord de declaració definitiva de la ZAS del Carme.

    2. Que s''apliquen de manera efectiva i real les mesures cautelars aprovades en 2010.

    3. Que a més d''estes mesures s''implementen altres propostes alternatives que plantegem en les nostres
    al·legacions, com mantindre l''horari de les botigues de conveniència, un pla urgent de lluita contra
    el botellón, el control d''apartaments il·legals o l''elaboració d''un pla integral d''oci lligat
    a la figura de l''alcalde de nit que tant hem reclamat.

    4. Per últim, sol·licitem la convocatòria urgent de la taula de treball, recollida en les mesures
    cautelars, per a debatre estes propostes per tots els col·lectius implicats.


    Gràcies.'
