- id: 2016-09-20-103
  pleno_id: '2016-09-20'
  ordre: 3
  intervinient: '[***]'
  entitat: Asociación de Vecinos Polo y Peirolón
  tipus_entitat: av
  idioma_original: castellano
  reason: Introduced in the acta as 'Associació de Veïns Polo y Peyrolón. Intervé' but not extracted.
  text_original: 'Buenos días, con el permiso de todos. Tenía aquí yo una pequeña reseña que iba a decir,
    pero resulta que después de venir a este Pleno y, por primera vez, estoy alucinada porque yo he venido
    a escuchar un Pleno que hable del estado de la ciudad, no del pasado de la ciudad y, sobre todo y
    por encima de todo, los insultos me caen fatal, es algo que yo no puedo soportar ni de uno ni del
    otro porque, como dice un refrán, hasta segar todo es hierba, quiere decir que si ahora los actuales
    se encuentran muy limpios de alma y de bolsillo, quizás en el futuro se puede ver lo contrario y entonces,
    ¿qué pasará? Pues espero vivir años porque yo creo que de los que estamos aquí soy de las mayores,
    casi puedo decir de las mayores. Pero como no me gusta pasarme de mis tiempos y soy una persona metódica,
    llevo 20 años en ambas asociaciones y creerlo que he visto de todo. Tú, Sandra, te has recorrido la
    ciudad a pie; yo me la he recorrido a pie, de memoria y en todos los sitios del mundo, ¿estamos? Y
    aparte tengo una memoria, gracias a Dios y que Dios me la conserve perfectamente, memorizo muchísimo,
    no se me olvidan muchas cosas y creo que no se me va a olvidar el Pleno de hoy tampoco. Entonces,
    en mis tres minutos que aún me queda, llevo 1:23, voy a decir mis cosas que yo considero más importantes.
    No quiero leer la letanía porque considero que es tontería porque sé que voy a entregar el papel y
    va a ser caso omiso como las 10 peticiones que he hecho al Sr. alcalde para que me reciba y aún no
    he tenido el placer de que así lo haga; y quiero decirle que me dejó colgada para la entrega de premios
    a toda mi gente mayor de los poetas, personas de 70 a 90 años, y es una cosa que no le voy perdonar
    nunca. Eso que lo tenga bien claro y para ser un alcalde se debe a todos los ciudadanos. Y ahora yo
    digo, vosotros estáis ahí porque estáis con sueldo, nosotros estamos defendiendo los barrios sin un
    puto duro a favor nuestro y tenemos que estar aquí enjaulados como las gallinas cuando ese banco último
    debía de ser, por respeto, para nosotros. Si es la casa del Ayuntamiento y es la casa del pueblo tenemos
    tanto derecho como vosotros que estáis ahí. Y solamente voy a decir esto ya. En mis tres minutos quiero
    decir que por las bases de las nuevas solicitudes, está claro que no quieren darnos ninguna subvención,
    por eso lo han hecho, para reírse de todos nosotros y pretender hacer de ello un examen como para
    entrar en la NASA. Segundo, los servicios de limpieza en las calles, si antes habláis que estaban
    mal, ahora no quiero ni contaros, peor, pero muchísimo peor. Tres, el cambiar los autobuses no ha
    beneficiado a nadie, solo fastidiar, sobre todo a la gente mayor. Y la línea del hospital que ha perjudicado
    a ellos, precisamente que ya lo habían memorizado. Y los parques y jardines, si antes se criticaba
    que estaban mal, ahora la poda brilla por su ausencia de ramas secas. Y bueno y por favor, en las
    Juntas de Distrito, solamente pido una cosa: si es posible que vuelvan a ser como eran donde iban
    las asociaciones en representación de los vecinos y luego se contestaban y no la jaula que hacen ahora
    de tanto hablar para nada. Gracias.'
  date: '2026-10-20'
  finding: E1b-2d871fc28a
  text_val: 'Bon dia, amb el permís de tots. Tenia ací jo una xicoteta ressenya que anava a dir, però
    resulta que després de vindre a este Ple i, per primera vegada, estic al·lucinada perquè jo he vingut
    a escoltar un Ple que parle de l''estat de la ciutat, no del passat de la ciutat i, sobretot i per
    damunt de tot, **els insults em cauen fatal**, és una cosa que jo no puc soportar ni d''un ni de l''altre
    perquè, com diu un refrany, fins a segar tot és herba, vol dir que si ara els actuals es troben molt
    nets d''ànima i de butxaca, potser en el futur es pot veure el contrari i llavors, què passarà? Doncs
    espere viure anys perquè jo crec que dels que estem ací sóc de les majors, quasi puc dir de les majors.


    Però com no m''agrada passar-me dels meus temps i sóc una persona metòdica, **porte 20 anys en les
    dues associacions** i crec que he vist de tot. Tu, Sandra, t''has recorregut la ciutat a peu; jo me
    l''he recorregut a peu, de memòria i en tots els llocs del món, ens entenem? I a més tinc una memòria,
    gràcies a Déu i que Déu me la conserve perfectament, memoritze moltíssim, no se m''obliden moltes
    coses i crec que no se m''oblidarà el Ple d''hui tampoc.


    Doncs, en els meus tres minuts que encara em queden, porte 1:23, vaig a dir les meues coses que considere
    més importants. No vull llegir la lletania perquè considere que és una ximpleria perquè sé que vaig
    a entregar el paper i serà **cas omís com les 10 peticions** que he fet al Sr. alcalde perquè em reba
    i encara no he tingut el plaer que així ho faça; i vull dir-li que em va deixar penjada per a l''entrega
    de premis a tota la meua gent major dels poetes, persones de 70 a 90 anys, i és una cosa que **no
    li perdonaré mai**. Que això ho tinga ben clar i per a ser un alcalde **es deu a tots els ciutadans**.


    I ara jo dic, vosaltres esteu ahí perquè esteu amb sou, nosaltres estem **defensant els barris sense
    un maleït duro** a favor nostre i tenim que estar ací engabiats com les gallines quan eixe banc últim
    devia ser, per respecte, per a nosaltres. Si és la casa de l''Ajuntament i és la casa del poble **tenim
    tant dret com vosaltres** que esteu ahí.


    I només vaig a dir això ja. En els meus tres minuts vull dir que per **les bases de les noves sol·licituds**,
    està clar que **no volen donar-nos cap subvenció**, per això ho han fet, per a riure''s de tots nosaltres
    i pretendre fer-ne un examen com per a entrar a la NASA.


    Segon, **els servicis de neteja als carrers**, si abans dèieu que estaven malament, ara no vull ni
    contar-vos, pitjor, però moltíssim pitjor.


    Tres, **el canvi dels autobusos no ha beneficiat ningú**, només fastidiar, sobretot a la gent major.
    I la línia de l''hospital que els ha perjudicat a ells, precisament que ja s''ho havien memoritzat.


    I **els parcs i jardins**, si abans es criticava que estaven malament, ara la poda brilla per la seua
    absència de branques seques.


    I bé i per favor, en les **Juntes de Districte**, només demane una cosa: si és possible que **tornen
    a ser com eren** on anaven les associacions en representació dels veïns i després es contestaven i
    no la gàbia que fan ara de tant parlar per a res. Gràcies.'
  resum_cas: Vecina de una asociación de vecinos expresa su descontento con la gestión municipal en servicios
    de limpieza, transporte público y parques, reclama respeto hacia las asociaciones en las juntas de
    distrito y lamenta la falta de atención del alcalde a sus peticiones.
  resum_val: Una veïna d'una associació de veïns expressa el seu descontentament amb la gestió municipal
    en serveis de neteja, transport públic i parcs, reclama respecte cap a les associacions en les juntes
    de districte i es lamenta de la falta d'atenció de l'alcalde a les seues peticions.
