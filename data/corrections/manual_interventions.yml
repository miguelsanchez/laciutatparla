  text_val: 'Hola, bons dies i gràcies, senyora alcaldessa. Senyors i senyores regidors.


    Com sabeu, soc José Antonio Barba, veïnat de Nazaret, i torne a estar aquí perquè **els meus veïnats
    continuen esperant**. El mes passat vaig venir a parlar de les vies del tren i de **30 anys de promeses
    incomplides**. Hui quiero empezar per algo diferente. Pareix que el **PAI del Grau va a eixir per
    fi endavant** i esto per als meus veïnats és moltíssim. Centes de vivendes i un **gran Delta Verd**
    que va a connectar el Túria, el jardí del Túria amb la mar.


    Però jo vull cridar l''atenció sobre el **nou pont sobre el jardí del Túria** que va a unir Nazaret-Moreres
    amb el nou barri del Grau. Potser quede esto un detall tècnic, però per a un veïnat de Nazaret esto
    ho cangia tot. Nazaret està pegada a la mar, pegada al port, pegada al jardí del Túria. I no obstant,
    **durant dècades hem viscut com una illa**, sense poder eixir per cap banda, sempre amb la sensació
    que la ciutat està prop però no te deixa entrar. Este pont per a Nazaret no queda tan desconectada
    en el nostre dia a dia, almenys en esto va a ser un poc millor. **Per esto este pont importa** i els
    demane que **posaren un acord per a no retardar-lo més**.


    Però no puc anar-me''n sense recordar algo més. Els promotors del PAI han aportat **quasi 6 milions
    d''euros** per al soterrament de les vies de Serreria. Els promotors privats i els veïnats hem posat
    milions d''euros per a este soterrament. I anys depois, aquí continuem esperant. Diuen que faran un
    pont provisional sobre les vies per a que el barri puga funcionar mentre el Ministeri fa un pont que
    haurà que derrocar el dia que arribe el soterrament del que es llega. El PAI va a avançar per les
    vies del tren, va a continuar ahí sense el soterrament i **partint en dos la zona que hauria d''estar
    unida**. No demane més estudis ni més reunions, **demane que el Ministeri complisca lo promés**. El
    PAI del Grau ens alegra, però potser la millor noticia seria que eixe dia, quan provisionalment es
    derroqui este pont, eixa barrera de ferro desaparegua i **nos permita ser de veres un sol barri**.
    Este és el dia en que estem esperant on poder **unir-nos els quatre barris com un sol** i ser Germans
    tots junts i ser una familia convivint junts.


    Moltes gràcies.'
  resum_cas: Vecino de Nazaret solicita que se garantice la construcción del nuevo puente sobre el jardín
    del Turia para mejorar la conexión del barrio y reclama el cumplimiento del soterramiento de las vías
    de Serrería por parte del Ministerio.
  resum_val: Veïnat de Nazaret sol·licita que es garantisca la construcció del nou pont sobre el jardí
    del Túria per a millorar la connexió del barri i reclama el compliment de l'soterrament de les vies
    de Serreria per part del Ministeri.
