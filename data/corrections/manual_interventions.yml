- id: 2025-04-11-3-100
  pleno_id: 2025-04-11-3
  ordre: 1
  intervinient: Ramón Roberto Expósito Marco
  entitat: Per l'Horta
  tipus_entitat: plataforma
  barri_o_zona: La Torre, Faitanar
  punts_ordre_dia: Reconstrucción DANA
  idioma_original: valenciano
  text_original: 'Bon dia. Sóc Robert Expósito, veí de la Torre-Faitanar i amb molt d''orgull llaurador a l''horta de Faitanar.
    Com molta gent d''aquesta ciutat, vaig vore la meua vida devastada a conseqüència de la dana. I com tots al meu barri,
    vaig perdre amics i veïns que, per desgràcia, no podrem reconstruir les seues vides. Ells mai més tornaran.

    Avui estem ací per parlar de reconstrucció, però des de Faitanar ens preguntem: Reconstrucció de què? D''unes infraestructures
    que han matat als meus veïns?, que han ofegat les nostres vides? Potser vullguen reconstruir una xarxa d''aigua potable
    que a Faitanar no tenim, un clavegueram que tampoc tenim. O potser siga la mobilitat, basada en un metro que sis mesos
    després ens nega l''accés a l''estació. Tots els dies quan anem a treballar ens juguen la vida a l''anar sobre carreteres
    que han solsit, en llocs s''han reduït un metre d''amplària. Estem parlant de carreteres de dos metres i mig. Sí, s''asfaltaren
    després de la dana algunes carreteres que tenien clots, però que no implicaven risc per a la vida de les persones. Això
    sí, eren molt visibles. Què ha de passar perquè això s''arregle?, una altra desgràcia? Ha de morir algú per a donar-li
    solució? Potser la reconstrucció siga escoltar un poc al ciutadà, saber quines són les seues necessitats i saber el que
    està passant sobre el terreny.

    El primer que vàrem intentar reconstruir són les nostres vides. Si hi ha una cosa difícil sobre una horta que a Faitanar
    sis mesos després encara no hem pogut regar. Per si faltava poc, les collites que aconseguírem salvar ens les estan furtant.
    On està la guarderia rural? Fa mesos que no la veem. On està la Policia Local? Tampoc la veem. Els nostres camps estan
    convertint-se en uns abocadors il·legals d''enderrocs, fem i deixalles, i este ajuntament no actua. Al camí vell de Picassent
    junt a la creu de terme hui en dia ja és una escombrera. Duem més de sis anys denunciant-ho i no s''actua. Des de l''horta
    demanem que s''actúe, que es faça alguna cosa, que es treballe. Crec que el càrrecs que ostenten els obliga. Sense esta
    horta esta ciutat no existiria. Cal prendre mesures, posar videovigilància als camins rurals que donen accés a les nostres
    explotacions i a les nostres cases, reparar els camins que impliquen el perill per a la vida de la gent, una presència
    policial continuada, la retirada de les taxes en Mercavalència a les explotacions afectades per la dana. Cal previndre
    la plaga de mosques i mosquits que està gestant-se, perquè d''ací uns mesos serà insuportable. I sobretot, eliminar les
    barreres arquitectòniques que ens varen ofegar.

    Per acabar, només faré dos dos preguntes, senyora Catalá, que m''agradaria que puguera contestar-me. La primera és perquè
    aquest ajuntament, el meu ajuntament, no forma part de la Plataforma pel Soterrament de les Vies que varen ofegar els
    meus veïns. I la segona és perquè aquella fatídica vesprada quan cridàvem desesperats des de Faitanar demanant auxili
    a la Policia Local ens deien: ''Llame usted a la Policía Local de Paiporta''. No sabien ni en quin terme estava Faitanar.
    Amb això finalitzaré.'
