- id: 2018-12-20-102
  pleno_id: '2018-12-20'
  ordre: 6
  intervinient: Antoni Cassola Cortadellas
  entitat: Federació d'Associacions de Veïns i Veïnes de València
  tipus_entitat: av
  idioma_original: castellano
  text_original: 'Gràcies.

    Sr. alcalde, señoras y señores concejales

    Antes de nada, decir que nos congratulamos del regreso del alcalde Joan Ribó tras superar su intervención.
    Y desear también una pronta recuperación a la 1ª tenienta de alcalde, Sandra Gómez.


    Dicho esto, tomamos la palabra para expresar nuestra satisfacción porque hoy se dé cumplimiento a
    la sentencia nº 666/2009 del Juzgado Contencioso Administrativo 4, sentencia en la que se requiere
    al Ayuntamiento de València para que tramite la declaración como zona acústicamente saturada del entorno
    del barrio del Carmen. Y queremos también expresar nuestro total acuerdo con las medidas que contiene.
    Son necesarias, son justas y han sido ampliamente debatidas.


    Pero debemos, en primer lugar, expresar también públicamente nuestro reconocimiento al Servicio de
    Contaminación Acústica por el concienzudo trabajo realizado a lo largo de este tiempo, recogiendo
    año tras año, contra viento y marea, las mediciones acústicas que delataban la existencia de un grave
    problema de salud pública en el entorno del Carmen, pero también analizando estos datos y proponiendo
    soluciones para atajar las fuentes del ruido.


    Es gracias a ellos que hoy podemos debatir y aprobar esta resolución. Estamos seguros que si desde
    otras instancias se hubiera trabajado con el mismo denuedo, posiblemente las mediciones hubieran sido
    otras y las medidas a adoptar también.


    Al igual que hoy el Carmen, antes otros barrios de la ciudad se han visto y se siguen viendo enfrentados
    al mismo problema y hasta ahora siempre han tenido que ser los jueces quienes recordaran a la Administración
    su obligación de regular el terrible impacto que el actual modelo de ocio tiene en la vida cotidiana
    de sus vecinos.


    Es un hecho objetivo que el modelo actual lleva asociada la saturación de locales de ocio y de hostelería
    hasta niveles difícilmente soportables y conciliables con una adecuada calidad de vida. Mientras este
    desequilibrio no se resuelva hay que tomar medidas para favorecer la salud de los ciudadanos que,
    en muchos casos, padecen enfermedades asociadas al ruido y a la falta de descanso, amén de ver el
    mermado el valor de sus propiedades.


    Hay zonas urbanas en las que la cultura del ocio nocturno amenaza con destruir la cultura que define
    a un barrio o a una ciudad, la cultura del convivir. Son zonas en las que la concentración excesiva
    de locales está destruyendo la riqueza del tejido urbano y social. Reportan buenos y fugaces beneficios
    al sector de la hostelería, pero producen graves daños en la salud de los vecinos y en la de la ciudad.
    Generan puestos de trabajo, pero impiden el descanso y, por tanto, el trabajo de los que su jornada
    laboral se ajusta al horario diurno, es decir, a la mayoría.


    Los vecinos que pueden abandonan estas zonas y los que buscan piso las eluden. El resultado es el
    despoblamiento, el empobrecimiento del comercio diurno y de las actividades sociales y culturales
    que enriquecen la vida de un barrio. E inevitablemente aparecen los problemas de convivencia entre
    propietarios de locales y vecinos. Los vecinos que reclamamos nuestro derecho al descanso no estamos
    contra los bares, ni contra la marcha, pues ni todos los bares incumplen las normativas municipales,
    ni la marcha bien encauzada tiene porque desembocar en la contaminación acústica.


    Estamos contra el abuso y el desequilibrio. En el caso del Carmen estamos a favor de un barrio vivo
    y en el que se pueda vivir, estamos por recuperar calles y plazas para hacer ciudad. Y porque apostamos
    por la convivencia exigimos a nuestro Ayuntamiento, como principal responsable, que garantice el cumplimiento
    de la legalidad y que al tiempo promueva un mayor civismo con campañas de sensibilización hechas en
    colaboración con otras entidades, incluso con el gremio de hosteleros. Seguro que están de acuerdo,
    al fin y al cabo ellos tampoco pueden trabajar sin descansar.


    Lo hemos dicho en infinidad de ocasiones y no nos cansaremos de repetirlo: con el actual modelo de
    ocio nocturno las zonas ZAS son la única barrera que permite preservar una calidad de vida para los
    vecinos, si no buena al menos llevadera. Es el único instrumento verdaderamente eficaz para poner
    freno a la degradación y no estamos en absoluto por la labor de derogarlas sin antes haber revisado
    el modelo a fondo.


    Pedimos a la corporación en Pleno que nadie mire para otro lado, que se apoye amplia y mayoritariamente
    este plan de medidas para recuperar el carácter vecinal y residencial del Carmen, hoy seriamente enfermo.
    Las ZAS no deben ser el punto de llegada donde olvidarnos del problema [La presidència li comunica
    que ha esgotat el seu torn d’intervenció]. Al revés, debían ser el punto de partida de un camino que
    todos debemos recorrer juntos. Creemos que esto es posible, pero hacemos falta todos.


    Por favor, señoras y señores concejales, voten a favor de esta moción, demos un respiro al Carmen
    y sigamos trabajando por un modelo de ocio y turismo alternativo.'
