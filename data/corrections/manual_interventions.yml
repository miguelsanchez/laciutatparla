- id: 2025-09-11-028
  pleno_id: '2025-09-11'
  ordre: 28
  intervinient: Pilar Martinez Escot, Sergio Cebral Olcina
  entitat: Asociación Plataforma Orriols en Lucha
  tipus_entitat: plataforma
  barri_o_zona: Orriols
  punts_ordre_dia: Debate sobre el estado de la ciudad
  idioma_original: castellano
  text_original: 'Sra. Martinez: Buenas tardes a todos y todas.

    Señora alcaldesa, señoras y señores concejales, esperamos que hayan disfrutado de sus vacaciones. Decirles que nos ha
    sorprendido la precipitación en la convocatoria del debate sobre el estado de la ciudad. Y como es un tema que nos afecta
    tanto, no hemos querido dejar pasar la oportunidad de manifestar nuestra preocupación. Desgraciadamente, desde Orriols
    no tenemos una visión tan positiva. En Orriols en Lucha nos hemos aferrado a la esperanza. Creemos que es una actitud
    activa que se dirige a la búsqueda de metas específicas con la idea de conseguir un futuro mejor, a pesar de las dificultades
    y asumiendo responsabilidades que nos restan tiempo y disfrute de la vida.

    En contraste, parece que el optimismo de este gobierno va más enfocado a la creencia pasiva de que todo saldrá bien en
    general, sin que necesariamente haya que ejercer alguna acción. Esta creencia puede llevar a la frustración a los ciudadanos
    porque no se cumplen los compromisos adquiridos.

    En la asamblea del miércoles 3 de septiembre, con participación de vecinos, vecinas y asociaciones de Orriols, hicimos
    análisis de la situación del barrio y de los hechos que hemos vivido este verano. Queremos transmitirle la profunda preocupación
    y en muchos casos indignación que sentimos. La impotencia que transmitían los más afectados.

    En algunas zonas del barrio sigue produciéndose ocupación masiva del espacio público, en muchos casos por parte de personas
    incívicas que consumen alcohol y sustancias estupefacientes. Dejan cantidad de basura a su alrededor y no permiten el
    descanso a los vecinos. Hay venta de alcohol hasta altas horas de la madrugada, incluso desde algún domicilio particular.
    Los vecinos llaman repetidas veces a la Policía Local, que por la noche no aparece. Se permite el aparcamiento y la circulación
    en zonas peatonalizadas e incluso encima de las aceras, sin ningún respeto por los peatones y sin que apreciemos actuaciones
    policiales. Hemos observado la presencia de adolescentes y jóvenes sin ningún tipo de control que se dedican a actividades
    ilícitas. Desafortunadamente, en Orriols no contamos con actividades culturales y sociosaludables que puedan interesar
    a esta población, algo muy necesario dadas las características del barrio. La vulnerabilidad y la marginalidad es mucha
    y en nuestra opinión sigue en aumento.

    Sr. Cebral: Buenas tardes a todas y a todos.

    Vemos que no avanzamos en ninguno de nuestros proyectos y por ello se los vamos a recordar. Sabemos que les suenan, pero
    ante la falta de soluciones nuestra repetición. El polideportivo un año después de su cierre sigue igual, cerrado. Esperamos
    que la ansiada reparación de la cubierta llegue pronto. En cuanto a la biblioteca, después de la última reunión que tuvimos
    con usted, señora alcaldesa, se nos prometió una solución que hoy en día ya no es posible. Vemos que la nueva solución
    es la reparación de la alquería. ¿Cuánto tiempo se tarda en reparar una alquería? ¿Se ha comenzado ya con ese plan de
    redacción?

    Los servicios sociales también son un tema candente en Orriols. Están colapsados. Prometieron un centro de servicios sociales
    exclusivo para Orriols, disponible en 2024. Y ahora parece que no existe. Tardará años, si es que llega. Seguimos esperando
    la plantación de 130 árboles, pendiente desde hace años de que llegue un informe. ¿Dónde está ese informe de Patrimonio?
    Cuando se tiene interés por agilizar algo, se agiliza, se tira para adelante, se agilizan todos esos trámites. Parece
    que en este caso no se tiene interés. No tenemos noticias de la remodelación de la plaza de Esteban Dolz. Las calles continúan
    sucias y llenas de trastos. Estamos cansados de decir que tiene que haber intervenciones de otro tipo, además de la limpieza.

    Es necesario educar y concienciar. Las campañas en redes sociales pueden ser útiles, pero creemos que no sirven exclusivamente
    para combatir el incivismo que padecemos en Orriols. Mientras personas problemáticas siguen ocupando viviendas, algunas
    de nuestras buenas familias se les sigue expulsando de sus pisos por el abusivo precio de los alquileres. Eso, señora
    alcaldesa, es clase media y economía familiar. Y en efecto, sin clase media y economía no hay cohesión ni democracia.

    Como llevamos repitiendo desde hace años, nuestro barrio necesita de intervenciones integrales: urbanísticas, sociales,
    culturales. Si de verdad queremos que Orriols sea un barrio habitable a la altura de nuestra ciudad y de las personas
    que lo habitamos, tenemos, tienen que tomárselo en serio. No se puede poner tiritas donde hace falta quirófano. Es por
    todo eso que seguimos reivindicando las mesas interconcejalías como elemento necesario. Los concejales y concejalas están
    al servicio de la ciudadanía y no al revés. Necesitamos que esta herramienta sea útil para avanzar en la resolución de
    los problemas de Orriols. Desde Orriols en Lucha aportamos la colaboración para poder trabajar conjuntamente, pero también
    exigimos seriedad y máxima contundencia en las acciones para la mejora de nuestro barrio. Como todos y todas sabemos,
    los entornos pueden modificar los comportamientos y la vida de las personas.

    Muchas gracias.'
