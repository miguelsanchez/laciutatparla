    **una horta escolar, pionera en la zona**, on l''alumnat participa activament al llarg de tot el curs.


    Es realitzen distintes **activitats extraescolars** esportives, lúdiques i culturals, i escola de
    pares. Este curs hem entrat en el projecte Sport and Trops, participant en la competició provincial
