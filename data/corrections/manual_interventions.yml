  tipus_entitat: cultural
  idioma_original: castellano
  text_original: 'Bueno, agradecer que podamos expresarnos.


    Corroboro todo lo que están comentando con el tema de las cámaras porque entre el COVID, obras y cámaras,
    en este último periodo del año pensamos que va a contribuir a un deterioro del tejido cultural y sus
    eventos culturales previstos para reactivar el centro histórico. Es muy importante que estas Navidades
    se puedan desarrollar actividades culturales y sociales que están previstas por todo tipo de entidades
    y de Cultura Festiva. Reunirse en el Centro Histórico es cada día más difícil y esto afecta a todo
    tipo de relaciones y tejido cultural. El deterioro del tejido cultural y comercial, que ya viene perjudicado
    por las obras y las cámaras, ha supuesto también que cambien de barrio diseñadores, galeristas, artesanos
    y artistas.


    Y solamente mi petición es que reunirse en el centro debería ser un placer y no un problema, y rogar
    que se tenga en cuenta esta petición.


    Gracias.'
  reason: Acta introduces the Sra. ****** en representació de l'Associació Intramurs; not extracted by
    script 05.
