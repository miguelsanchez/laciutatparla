    Els ciutadans estiguérem en contra d''esa instal·lació, independentment de qui ens governaren cada
    quatre anys, aquells que tenen la responsabilitat de prendre esa decisió política. S''envolte en esa
    bandera que tant ens té acostumada, la **bandera de la ciutadania** i en este últim Ple **exiga el
    tancament i el trasllat** d''esta instal·lació ja.


    Gràcies.'
  resum_cas: Vecinos de Patraix reclaman el cierre y traslado inmediato de una subestación eléctrica ubicada
