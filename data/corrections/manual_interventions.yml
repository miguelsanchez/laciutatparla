- id: 2014-11-21-101
  pleno_id: '2014-11-21'
  ordre: 2
  intervinient: '[***]'
  entitat: Asociación Cultural para la Familia
  tipus_entitat: cultural
  idioma_original: castellano
  text_original: 'Muchas gracias. Sra. Alcaldesa, por autorizarnos a poder manifestar lo que a nuestro
    entender podría ser un contrapunto a la intervención que ha hecho el representante de CC.OO. en otro
    ámbito. Nosotros nos referimos al ámbito de esta casa. Tan lejos como ayer celebramos las elecciones
    y los funcionarios eligieron a sus representantes, y en el ejercicio de esa función estamos hoy aquí.


    Creemos que esta moción, en nuestra opinión, no es el mejor momento de presentarla, en el marco de
    unas elecciones. Creemos que tal y como CC.OO. la ha presentado en este Ayuntamiento y en campaña
    al menos genera cierto alarmismo y queremos reivindicar a los funcionarios. A los funcionarios en
    su papel, en su ejercicio, en el acto profesional, desde su responsabilidad, desde la capacidad, desde
    su independencia -no la pondremos nunca en cuestión-.


    El compañero de CC.OO. me da la impresión de que está en otra galaxia. Es decir, ya el EBEP en 2007
    eliminó de los tribunales de selección a los políticos y a los sindicatos, centrándolo exclusivamente
    en los funcionarios, en las personas capaces, en las personas responsables, que de ellos depende el
    futuro trabajo o acceso a la función pública.


    Por ello, creemos que este debate manifestado en términos de moción que impulsa CC.OO. para terminar
    con el enchufismo nos parece alarmista. Cuanto menos no real, no ajustada a la situación de esta casa.
    Yo, si tiene conocimientos de otras administraciones, no voy a discutirlo, pero si se defiende eso
    es porque se tiene causa y si se tiene causa no se tiene que venir al Pleno, se tiene que ir a otro
    sitio.


    Por lo tanto, desde el respeto a que es una materia legislativa que regula la competencia en el marco
    de la Mesa General de Negociación, que en este Ayuntamiento fue negociado, apoyado por CC.OO. y quiero
    reiterar, por el conjunto de los grupos políticos pertenecientes a este Pleno, de lo cual yo me alegro
    enormemente, a un año de finalización del mandato, me parece totalmente extemporáneo, fuera de lugar
    intentar que lo que en la Mesa de Negociación no puedo conseguir lo traslade y utilice a los partidos
    políticos como telón para defender este planteamiento.


    Sres. Concejales, les pediría, por favor, respeto a la negociación colectiva. Este sindicato ha tenido
    que ir a Madrid, al TSJ, al Tribunal Supremo, para que nos reconocieran en esta casa el derecho a
    la negociación, lo cual para mí es un honor. Y por ello me veo en la legitimidad de exigir a este
    Pleno ese respeto a la competencia y a la capacidad de la Mesa General de Negociación.


    Si han entendido nuestro posicionamiento y tienen a bien no debatirlo, porque nuestra voluntad sería
    no debatirlo, si esto se retirara, nosotros entenderíamos que haríamos un buen favor a los funcionarios
    de la casa y a la Mesa General de Negociación.


    Muchas gracias.'
  reason: Acta introduces '******, en representación de la Asociación Cultural para la Familia' as a second
