    L''AMPA del Sector Aéreo formem part de la **Coordinadora d''Educació 3F** a la qual pertanyen també
    altres AMPA de diversos col·legis del barri, l''Associació de Veïns 3 Forques-Vara de Quart, Escola
    Musical 3 Forques, Escola Musical Tradicional i Amesti. En este col·lectiu estem **molt sensibilitzats
    amb la defensa d''una educació pública i de qualitat**, el que significa que **estem en tot el barri
    de Tres Forques units** per a lluitar per ella. Este col·legi és **pedra angular en la cohesió del
