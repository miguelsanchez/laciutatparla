  reason: 'Acta: ''Dª ******, en representación de FAPA-Valencia'' speaks but was not extracted.'
  text_original: 'Molt bon dia a totes i a tots.


    Com a consellera de govern de FAPA-València, com a presidenta de l’AMPA del CEIP Max Aub i com a membre
    d’Escola Valenciana prenc la paraula per a fer algunes aportacions a la moció que hui es presenta.


    Ja al gener de 2013 FAPA-València va presentar a aquest Ajuntament un dossier amb les deficiències
    en infraestructures educatives que evidencien el seu deteriorament i que estan posant en perill la
    seguretat del nostre alumnat. Entre la Conselleria i l’Ajuntament el resultat, com sempre, és que
    els centres estan abandonats per la falta de definició de competències. Senyors governants, no cal
    recordar-los la vergonya que és que caiga un sostre a un col·legi de València, com al CEIP Cervantes,
    o que hi hagen centres plens de barracons, com ara el 103, que a més s’inunden a les primeres pluges,
    com ha passat aquesta mateixa setmana.


    Les peticions de reparacions a les escoles ja no es fan per escrit, només telefònicament. Així, no
    hi ha cap constància als centres ni a l’Ajuntament de les demandes dels centres. El personal que va
    a les escoles ni es presenta a la direcció ni deixa cap part o acta de treball, amb la qual cosa ni
    se sap per a què han anat, ni si han fet el que calia fer. A més, s’envia personal no qualificat a
    desenvolupar feines i sense unes indicacions clares; per exemple, en el manteniment i poda dels jardins
    de les escoles. Per no parlar de les tasques gairebé inexistents dels conserges.


    On estan els centres que necessitem a València? Celebrem la construcció de l’escola de Russafa. Però,
    on està la resta? Al Max Aub estem més de 15 anys esperant l’ampliació del centre. Els terrenys estan
    expropiats i cedits, el projecte d’arquitecte fet i el centre continua amb un menjador saturat, sense
    gimnàs, sense sales d’usos múltiples, en unes instal·lacions envellides que van caiguent. El nostre
    Ajuntament està reclamant a la Conselleria aquestes construccions? Ens sentim abandonats pels nostres
    representants.


    La falta de manteniment ha fet que tot el curs passat el pati d’infantil estigués clausurat per insalubre.
    La pols que ha de respirar els nostres fills i filles està agreujant malalties com asma, dermatitis,
    al·lèrgies... L’Ajuntament és el responsable del manteniment i no té un protocol per al manteniment
    d’aquest tipus de pati de terra. Front a això i per tal que aquest curs es puga utilitzar el pati,
    som els pares i les mares qui hem establert torns de reg diari per poder mantenir-lo en unes condicions
    el més dignes possible. Tot i això, hi ha menuts que han de jugar fora del pati, sense els seus companys,
    perquè les seues malalties empitjoren perillosament (tenim una xiqueta que ha patit fins a quatre
    ingressos a l’hospital). Qui ha de regar el pati? Les famílies? Els mestres, abandonant el seu treball
    amb els xiquets, com va suggerir un tècnic de l’Ajuntament?


    A més, la cessió de sol públic a entitats privades per a construir centres concertats evidencia la
    falta d’aposta per l’escola pública. Donem el nostre suport a les AMPA de Patraix. Demanem que el
    consistori del nostre municipi estiga al nostre costat en la defensa d’una educació pública, de qualitat,
    laica i en valencià.


    Moltes gràcies.'
  date: '2026-10-20'
  finding: E1b-acb8e1c771
  text_cas: 'Muy buen día a todos y a todas.


    Como consejera de gobierno de FAPA-València, como presidenta del AMPA del CEIP Max Aub y como miembro
    de Escola Valenciana tomo la palabra para hacer algunas aportaciones a la moción que hoy se presenta.


    Ya en enero de 2013 FAPA-València presentó a este Ayuntamiento un dosier con las **deficiencias en
    infraestructuras educativas** que evidencian su deterioro y que están poniendo en peligro la seguridad
    de nuestro alumnado. Entre la Consellería y el Ayuntamiento el resultado, como siempre, es que **los
    centros están abandonados** por la falta de definición de competencias. Señores gobernantes, no es
    necesario recordarles la **vergüenza que es que se caiga un techo** en un colegio de Valencia, como
    en el CEIP Cervantes, o que haya **centros llenos de barracones**, como el 103, que además se inundan
    con las primeras lluvias, como ha pasado esta misma semana.


    Las **peticiones de reparaciones en las escuelas** ya no se hacen por escrito, solo telefónicamente.
    Así, no hay constancia alguna en los centros ni en el Ayuntamiento de las demandas de los centros.
    El personal que va a las escuelas ni se presenta a la dirección ni deja parte o acta de trabajo alguna,
    con lo que no se sabe para qué han ido, ni si han hecho lo que había que hacer. Además, **se envía
    personal no cualificado** a desarrollar tareas sin unas indicaciones claras; por ejemplo, en el mantenimiento
    y poda de los jardines de las escuelas. Por no hablar de las **tareas casi inexistentes de los conserjes**.


    ¿Dónde están los **centros que necesitamos en Valencia**? Celebramos la construcción de la escuela
    de Russafa. Pero, ¿dónde está el resto? En el Max Aub llevamos **más de 15 años esperando la ampliación**
    del centro. Los terrenos están expropiados y cedidos, el proyecto del arquitecto hecho y el centro
    sigue con un **comedor saturado, sin gimnasio**, sin salas de usos múltiples, en unas instalaciones
    envejecidas que se van cayendo. ¿Nuestro Ayuntamiento está reclamando a la Consellería estas construcciones?
    **Nos sentimos abandonados** por nuestros representantes.


    La falta de mantenimiento ha hecho que todo el curso pasado **el patio de infantil estuviera clausurado**
    por insalubre. El **polvo que tienen que respirar nuestros hijos** está agravando enfermedades como
    asma, dermatitis, alergias... El Ayuntamiento es responsable del mantenimiento y no tiene un protocolo
    para el mantenimiento de este tipo de patio de tierra. Frente a esto y para que este curso se pueda
    utilizar el patio, somos los padres y las madres quienes hemos establecido turnos de riego diario
    para poder mantenerlo en unas condiciones lo más dignas posible. Aun así, hay menores que tienen que
    jugar fuera del patio, sin sus compañeros, porque sus enfermedades empeoran peligrosamente (tenemos
    una niña que ha sufrido hasta cuatro ingresos en el hospital). ¿Quién tiene que regar el patio? ¿Las
    familias? ¿Los maestros, abandonando su trabajo con los niños, como sugirió un técnico del Ayuntamiento?


    Además, **la cesión de suelo público a entidades privadas** para construir centros concertados evidencia
    la **falta de apuesta por la escuela pública**. Damos nuestro apoyo a las AMPA de Patraix. Pedimos
    que el consistorio de nuestro municipio esté a nuestro lado en la **defensa de una educación pública,
    de calidad, laica y en valenciano**.


    Muchas gracias.'
  resum_cas: FAPA-València denuncia el deterioro grave de infraestructuras educativas en Valencia, falta
    de mantenimiento en centros escolares, ausencia de ampliaciones necesarias como la del CEIP Max Aub
    tras 15 años de espera, y reclama apuesta decidida por educación pública de calidad.
