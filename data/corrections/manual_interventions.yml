- id: 2018-12-20-105
  pleno_id: '2018-12-20'
  ordre: 9
  intervinient: Rafael Mampel Mateu
  entitat: Associació de Veïns i Comerciants de Ciutat Vella
  tipus_entitat: av
  idioma_original: castellano
  text_original: 'És de veïns de Ciutat Vella.

    Buenos días a todos los concejales.

    Sr. alcalde, nos conocemos bastante, o algo.

    Quería simplemente comentar unas cuantas cosas y quiero comenzar echando la vista atrás. Hace 25 años
    Ciutat Vella era un barrio degradado con traficantes, prostitución y robos. Yo he nacido en el barrio,
    en Ciutat Vella. Tengo 52 años y sé muy bien de lo que estoy hablando, y muchos de ustedes también
    lo saben.


    Gracias a la intervención del Plan RIVA se modernizó, se hizo el barrio con calles peatonales, etc.
    Y también no es menos cierto, y esto hay que reconocerlo, que gracias a esos restauradores que con
    su dinero, su patrimonio, invirtieron en el centro histórico y se regeneró este barrio.


    Tenemos claro que tiene que haber unas normas, que tienen que haber unas ordenanzas, nadie lo pone
    en duda. Pero es de ser bien nacido el ser agradecido y a estos señores se les tiene también que considerar.
    Hay muchas otras fórmulas muchas otras maneras de poder atajar el botellón, el que haya gente por
    las calles chillando, hay muchísimas otras fórmulas y no necesariamente el tener que meter ya la zona
    ZAS.


    Pensamos, creemos que los vecinos siguen viviendo en el barrio, los vecinos no se han ido del barrio,
    ni se van del barrio. De hecho es uno de los barrios con más proyección a nivel de que la gente quiere
    venir a vivir. No estoy de acuerdo que los vecinos se vayan. Sí que es cierto que últimamente con
    el tema de los apartamentos turísticos ha habido un repunte de inversiones de gente para hacer apartamentos
    turísticos, eso es cierto.


    Pero no es menos cierto que cualquier piso en Ciutat Vella podemos ver el valor que tiene hoy en día
    y podemos ver el valor que tenía hace 25 años o hace 20 años, nadie quería vivir allí, nadie quería
    ir. Ahora es muy bonito venir y decir: ‘No, yo quiero vivir aquí’. Pero perdona, ¿tú cuando compraste
    el piso no sabías que tienes restaurantes bajo?, ¿no sabes lo que tienes debajo? ¿O es que compras
    el piso al tuntún?, ¿al azar? Tenemos que ser todos conscientes de lo que hacemos.


    Y creo, pienso, que antes de aprobar esta ZAS deberíamos de plantearnos el tener más diálogo con los
    vecinos y más diálogo con los comerciantes. Y en segundo lugar, si realmente quieren aprobarla, si
    realmente queréis hacerla quedan seis meses para elecciones. ¿Por qué complicaros la existencia? Esperad
    a que el gobierno que entre pueda hacerlo. ¿Por qué tenemos que ir con precipitación si quedan seis
    meses? Plantearos eso, plantearos que el próximo gobierno tenga la potestad de admitir la zona ZAS.
    Pero no la aprobéis deprisa y corriendo, habéis tenido tres años para hacerlo y ahora deprisa y corriendo
    lo queréis hacer.


    Creo que se debería de tomar nota de que el centro histórico es un centro vivo, es un centro donde
    la gente quiere vivir, donde quiere estar y por supuesto los valencianos queremos estar en la calle.
    Somos de calle. Todos, no hay nadie de los que hay aquí que no sea de calle. ¿Quién de aquí no ha
    ido a un restaurante a la terraza?, ¿quién? Que levante la mano, que tire la primera piedra. Nadie,
    todos lo queremos.


    Simplemente me gustaría que recapacitasen y que, por favor, por lo menos espérense seis meses. Que
    no va a ningún sitio seis meses, después de haber estado tantos años con el tema de la ZAS.


    Muchas gracias.'
  reason: 'Acta: 5t. Intervé el Sr. Rafael Mampel Mateu, en representació de l’Associació de Veïns i Comerciants
    de Ciutat Vella; missed by extraction.'
  date: '2026-10-20'
  finding: E1b-59cc0c1646
  text_val: 'Es de veïns de Ciutat Vella. Bon dia a tots els regidors. Sr. alcalde, ens coneixem bastant,
    o alguna cosa.


    Volia simplement comentar unes quantes coses i vull començar mirant enrere. **Fa 25 anys Ciutat Vella
    era un barri degradat** amb **traficants, prostitució i robatoris**. Jo he nascut al barri, a Ciutat
    Vella. Tinc 52 anys i sé molt bé del que estic parlant, i molts de vosaltres també ho sabeu.


    **Gràcies al Pla RIVA** es va modernitzar, es va fer el barri amb **carrers per a vianants**, etc.
    I també no és menys cert, i això cal reconéixer-ho, que **gràcies a eixos restauradors** que amb els
    seus diners, el seu patrimoni, van invertir en el centre històric i **es va regenerar este barri**.


    Tenim clar que **han d''haver-hi unes normes**, que han d''haver-hi unes ordenances, ningú ho posa
    en dubte. Però és de ser ben nascut el ser agraït i a estos senyors també se''ls ha de considerar.
    **Hi ha moltes altres fórmules**, moltes altres maneres de poder frenar **el botellón**, que hi haja
    gent pels carrers cridant, hi ha moltíssimes altres fórmules i **no necessàriament el haver de posar
    ja la zona ZAS**.


    Pensem, creiem que **els veïns continuen vivint al barri**, els veïns no se n''han anat del barri,
    ni se''n van del barri. De fet és un dels barris amb **més projecció** a nivell de que la gent vol
    venir a viure. No estic d''acord que els veïns se''n vagen. Sí que és cert que darrerament amb el
    tema dels **apartaments turístics** hi ha hagut un repunt d''inversions de gent per a fer apartaments
    turístics, això és cert.


    Però no és menys cert que qualsevol pis a Ciutat Vella podem veure el valor que té hui en dia i podem
    veure el valor que tenia fa 25 anys o fa 20 anys, ningú volia viure allí, ningú volia anar. Ara és
    molt bonic venir i dir: ''No, jo vull viure ací''. Però perdona, ¿tu quan vas comprar el pis no sabies
    que tens restaurants baix?, ¿no saps el que tens davall? ¿O és que compres el pis a l''atzar? **Hem
    de ser tots conscients** del que fem.


    I crec, pense, que **abans d''aprovar esta ZAS** hauríem de plantejar-nos **tindre més diàleg amb
    els veïns** i **més diàleg amb els comerciants**. I en segon lloc, si realment volen aprovar-la, si
    realment voleu fer-la falten sis mesos per a eleccions. ¿Per què complicar-vos l''existència? **Espereu
    que el govern que entre** puga fer-ho. ¿Per què hem d''anar amb precipitació si falten sis mesos?
    Plantejar-vos això, plantejar-vos que el pròxim govern tinga la potestat d''admetre la zona ZAS. Però
    no l''aproveu **de pressa i corrents**, heu tingut **tres anys** per a fer-ho i ara de pressa i corrents
    ho voleu fer.


    Crec que se hauria de prendre nota de que **el centre històric és un centre viu**, és un centre on
    la gent vol viure, on vol estar i per descomptat els valencians volem estar al carrer. Som de carrer.
    Tots, no hi ha ningú dels que hi ha ací que no siga de carrer. ¿Qui d''ací no ha anat a un restaurant
    a la terrassa?, ¿qui? Que alce la mà, que tire la primera pedra. Ningú, tots ho volem.


    Simplement m''agradaria que recapacitaren i que, per favor, **almenys esperen sis mesos**. Que no
    va a cap lloc sis mesos, després d''haver estat tants anys amb el tema de la ZAS.


    Moltes gràcies.'
  resum_cas: Rafael Mampel Mateu, de la Asociación de Vecinos y Comerciantes de Ciutat Vella, solicita
    más diálogo antes de aprobar la Zona de Actividad Secundaria (ZAS) y sugiere esperar seis meses hasta
    las nuevas elecciones, argumentando que el barrio histórico ha sido regenerado gracias a inversores
    y restauradores que merecen consideración, y que existen otras fórmulas para regular el botellón sin
