- id: 2014-09-26-102
  pleno_id: '2014-09-26'
  ordre: 3
  intervinient: '[***]'
  entitat: Asociación de Vecinos y Amigos de la Malva
  tipus_entitat: av
  idioma_original: valenciano
  reason: 'Acta: ''D. ******, en representación de l’Associació de Veïns Amics de la Malva'' speaks but
    was not extracted.'
  text_original: 'Excel·lentíssim Sr. vicealcalde. Sres. i Srs. regidors.


    En nom de l’Associació de Veïns i Amics de la Malva i també com a representant de la Federació d’Ensenyament
    de CC.OO. del País Valencià al Consell Escolar Municipal em dirigisc a aquest Ple per mostrar el nostre
    recolzament a la moció del Grup Municipal Socialista relativa a les iniciatives en suport a la família
    davant l’inici del curs.


    La moció denuncia la situació de desprotecció social de nombroses famílies a la nostra ciutat a causa
    de l’alta taxa de desocupació, de la retallada en drets laborals i salarials, i de la baixada en la
    inversió en el sistema de protecció social.


    Des de l’Associació de Veïns de la Malva també volem fer palès davant aquest Ple municipal que aquesta
    situació afecta de forma significativa el nostre barri, on a més a més l’aplicació del dur ajust escolar
    amb criteris economicistes de la Conselleria d’Educació pot portar al tancament del CEIP Ballester
    Fandos, on també l’augment de ràtios i la disminució de plantilla del personal docent disminueix la
    qualitat de l’atenció educativa a l’alumnat i on els recursos reduïts de les famílies no poden suplir
    els recursos que l’Administració autonòmica i municipal estan retallant.


    Com a representant de la Federació d’Ensenyament de CC.OO. del País Valencià també vull destacar l’esforç
    que per a les famílies suposarà la implantació a corre-cuita i sense planificació del model pedagògic
    de la LOMCE, especialment en allò que fa referència a l’obligació de canviar de llibres de text en
    un moment en què tota la comunitat educativa està obligada a limitar les seues despeses. Igualment,
    l’ocurrència d’ampliar el nombre d’assignatures amb la reducció de les sessions lectives a 45 minuts
    obligarà les famílies a pagar un augment de les hores d’atenció per part dels monitors i de les monitores
    al migdia o renunciar al servei de menjador.


    Vull destacar, finalment, que les famílies perdrem atenció educativa a causa d’eixa implantació de
    la LOMCE precipitada i sense participació de la comunitat educativa, amb el fals model plurilingüe,
    amb la imposició de proves diagnòstic per seleccionar alumnes i per establir un rànking de centres
    que condicionarà encara més la partida econòmica destinada als reforços educatius.


    Per tots aquestos motius, en nom de l’Associació de Veïns i Amics de la Malva, i de la FE CC.OO. PV,
    donem suport a la petició del Grup Municipal Socialista de què:


    1r. S’establisca una convocatòria de beques municipals per a llibres de text i material escolar, per
    al 100% de les despeses de menjador i per al transport escolar.


    2n. Es realitze una inspecció als centres docents amb més de 20 anys d’antiguitat i es reanude la
    construcció dels centres pendents.


    3r. Es convoque un Consell Escolar Municipal per debatre, amb la presència de grups de l’oposició,
    l’estat de l’educació en la ciutat.


    I, a més a més, instem la Regidoria d’Educació i la corporació municipal a posicionar-se i treballar
    contra el tancament d’escoles públiques, contra les retallades en inversió educativa i contra la implantació
    de la LOMCE.'
  date: '2026-10-20'
  finding: E1b-c592acdbb3
  text_cas: 'Excelentísimo Sr. vicealcalde. Sras. y Srs. concejales.


    En nombre de la Asociación de Vecinos y Amigos de la Malva y también como representante de la Federación
    de Enseñanza de CC.OO. del País Valenciano en el Consejo Escolar Municipal me dirijo a este Pleno
    para mostrar nuestro **apoyo a la moción** del Grupo Municipal Socialista relativa a las iniciativas
    en favor de la familia ante el inicio del curso.


    La moción denuncia **la situación de desprotección social** de numerosas familias en nuestra ciudad
    debido a la **alta tasa de desempleo**, a la **retallada en derechos laborales y salariales**, y a
    la **bajada en la inversión** en el sistema de protección social.


    Desde la Asociación de Vecinos de la Malva también queremos hacer patente ante este Pleno municipal
    que esta situación afecta de forma significativa a nuestro barrio, donde además la aplicación del
    **duro ajuste escolar** con criterios economicistas de la Consejería de Educación puede llevar al
    **cierre del CEIP Ballester Fandos**, donde también el **aumento de ratios** y la **disminución de
    plantilla** del personal docente disminuye la calidad de la atención educativa al alumnado y donde
    los recursos reducidos de las familias no pueden suplir los recursos que la Administración autonómica
    y municipal están recortando.


    Como representante de la Federación de Enseñanza de CC.OO. del País Valenciano también quiero destacar
    el esfuerzo que para las familias supondrá la **implantación a toda prisa** y sin planificación del
    modelo pedagógico de la LOMCE, especialmente en lo que hace referencia a la **obligación de cambiar
    de libros de texto** en un momento en que toda la comunidad educativa está obligada a limitar sus
    gastos. Igualmente, la **ocurrencia de ampliar el número de asignaturas** con la reducción de las
    sesiones lectivas a 45 minutos obligará a las familias a pagar un aumento de las horas de atención
    por parte de los monitores y de las monitoras al mediodía o renunciar al servicio de comedor.


    Quiero destacar, finalmente, que las familias perderemos **atención educativa** a causa de esa **implantación
    de la LOMCE precipitada** y sin participación de la comunidad educativa, con el falso modelo plurilingüe,
    con la imposición de pruebas diagnóstico para seleccionar alumnos y para establecer un ranking de
    centros que condicionará aún más la partida económica destinada a los refuerzos educativos.


    Por todos estos motivos, en nombre de la Asociación de Vecinos y Amigos de la Malva, y de la FE CC.OO.
    PV, apoyamos la petición del Grupo Municipal Socialista de que:


    1º. **Se establezca una convocatoria de becas municipales** para libros de texto y material escolar,
    para el 100% de los gastos de comedor y para el transporte escolar.


    2º. Se realice una inspección en los centros docentes con más de 20 años de antigüedad y se reanude
    la construcción de los centros pendientes.


    3º. Se convoque un **Consejo Escolar Municipal** para debatir, con la presencia de grupos de la oposición,
    el estado de la educación en la ciudad.


    Y, además, instamos a la Concejalía de Educación y a la corporación municipal a **posicionarse contra
    el cierre de escuelas públicas**, contra los **recortes en inversión educativa** y contra la **implantación
    de la LOMCE**.'
  resum_cas: Representante de la Asociación de Vecinos de la Malva y de CC.OO. respalda moción socialista
    sobre apoyo a familias en inicio de curso, denunciando desprotección social, cierre de escuelas públicas
    y retalladas educativas causadas por LOMCE.
