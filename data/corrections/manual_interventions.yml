- id: 2015-04-24-103
  pleno_id: '2015-04-24'
  ordre: 7
  intervinient: '[***]'
  entitat: Federación de Asociaciones de Vecinos de Valencia
  tipus_entitat: av
  idioma_original: castellano
  reason: 'Missed speaker: D. ******, en representación de la Federación de Asociaciones de Vecinos de
    Valencia.'
  text_original: 'Gracias, Sra. Alcaldesa. Sras. y Sres. Concejales.


    En nombre de la Federación de Asociaciones de Vecinos de Valencia intervengo para manifestar nuestro
    apoyo a la moción que presentan los Grupo Socialista, Compromís y EUPV. Desde la Federación a la que
    represento estamos plenamente convencidos que el apoyo a la educación como derecho básico de todas
    las personas debe ser claro y contundente. Entendemos que todas las administraciones públicas, sean
    cuales sean sus competencias, deben estar directamente implicadas en hacer posible que los niños y
    las niñas tengan garantizado su derecho a una educación de calidad. En este sentido, el Ayuntamiento
    de Valencia no puede mostrarse alejado de esta preocupación que todos tenemos. Porque nos preocupa
    que se adopten medidas que atacan el núcleo esencial de la educación pública, su calidad. Estamos
    en contra de que se haya aprobado la aplicación del distrito escolar único sin consenso.


    Nuestra participación en el Consejo Escolar Municipal es cada día más decepcionante. Observamos cómo
    poco a poco se va vaciando de competencias hasta correr el riesgo de convertirse en un espacio donde
    nada importante se decide con la excusa de que el ayuntamiento carece de competencias en educación.


    Los colegios públicos en nuestra ciudad están cada vez más seriamente deteriorados. Destinar un pequeño
    presupuesto para desperfectos no resuelve carencias estructurales tan graves. Mientras que desde el
    Ayuntamiento se señala que no es su competencia, la Generalitat, que las tiene plenas, hace tiempo
    que se olvidó de nuestra ciudad.


    Hace años que no es necesario que el Ayuntamiento ceda suelo porque la Conselleria d’Educació, Cultura
    i Esports no construye colegios públicos en Valencia. Así se mantienen los barracones, que debían
    ser provisionales por definición y que se han convertido desgraciadamente en edificios estables en
    el panorama educativo de nuestra ciudad.


    Por si todo este panorama no fuera bastante negativo, se anuncia un nuevo recorte que nos parece totalmente
    injustificado. Desde la Federación de Vecinos de Valencia nos hemos opuesto a esta medida en el Consejo
    Escolar Municipal.


    Por todo ello, les instamos a que se unan a toda la comunidad educativa y reclamemos juntos a la Conselleria
    d’Educació, Cultura i Esports una planificación educativa consensuada que garantice la calidad educativa
    en toda la ciudad. Vigilen, es su responsabilidad, el estado de conservación de los centros docentes
    de la ciudad y propongan un plan urgente para su rehabilitación. Y exijan que se construyan los centros
    que se precisan en la ciudad y que se eliminen de una vez todos los barracones. Demuestren que les
    importa de verdad la educación de los niños y las niñas de nuestra ciudad apostando por su futuro.


    Muchas gracias.'
  date: '2026-10-20'
  finding: E1b-2da5cef475
  text_val: 'Gràcies, Sra. Alcaldesa. Sres. i Srs. Regidors.


    En nom de la Federació d''Associacions de Veïns de València intervenc per a manifestar el nostre **suport
    a la moció** que presenten els Grups Socialista, Compromís i EUPV. Desde la Federació a la qual represente
    estem plenament convençuts que el **suport a l''educació com a dret bàsic** de totes les persones
    ha de ser clar i contundent. Entenem que totes les administracions públiques, siguen quines siguen
    les seues competències, han d''estar directament implicades en fer possible que els xiquets i les
    xiquetes tinguen **garantit el seu dret a una educació de qualitat**. En aquest sentit, l''Ajuntament
    de València no pot mostrar-se allunyat d''aquesta preocupació que tots tenim. Perquè ens preocupa
    que s''adopten **mesures que ataquen el nucli essencial de l''educació pública, la seua qualitat**.
    Estem en contra que haja estat aprovada l''**aplicació del districte escolar únic sense consens**.


    La nostra participació en el **Consell Escolar Municipal** és cada dia més decepcionant. Observem
    com poc a poc es va **buidant de competències** fins a córrer el risc de convertir-se en un espai
    on res important es decideix amb l''excusa que l''ajuntament manca de competències en educació.


    Els **col·legis públics de la nostra ciutat estan cada vegada més seriament deteriorats**. Destinar
    un xicotet pressupost per a desperfectes no resol **carències estructurals tan greus**. Mentre que
    des de l''Ajuntament es senyala que no és la seua competència, la Generalitat, que les té plenes,
    fa molt que s''ha oblidat de la nostra ciutat.


    Fa anys que no és necessari que l''Ajuntament ceda sòl perquè la Conselleria d''Educació, Cultura
    i Esports no construïx col·legis públics a València. Així es mantenen els **barracons, que deien ser
    provisionals** per definició i que s''han convertit desafortunadament en edificis estables en el panorama
    educatiu de la nostra ciutat.


    Per si tot aquest panorama no fora prou negatiu, s''anuncia un **nou tall** que ens pareix totalment
    injustificat. Des de la Federació de Veïns de València ens hem oposat a aquesta mesura en el Consell
    Escolar Municipal.


    Per tot açò, els insten a que **s''unisquen a tota la comunitat educativa** i reclamem junts a la
    Conselleria d''Educació, Cultura i Esports una **planificació educativa consensuada** que garantisca
    la qualitat educativa a tota la ciutat. Vigilen, és la seua responsabilitat, l''estat de conservació
    dels centres docents de la ciutat i propongen un **pla urgent per a la seua rehabilitació**. I exigin
    que es construïsquen els centres que es necessiten en la ciutat i que s''**eliminen d''una vegada
    tots els barracons**. Demostren que els importa de veritat l''educació dels xiquets i les xiquetes
    de la nostra ciutat apostant pel seu futur.


    Moltes gràcies.'
