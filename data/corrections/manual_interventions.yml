- id: 2014-03-28-101
  pleno_id: '2014-03-28'
  ordre: 2
  intervinient: '[***]'
  entitat: Asociación Amics de la Malva
  tipus_entitat: av
  idioma_original: valenciano
  reason: Missed speaker introduced in the acta as representing the Associació de Veïns Amics de la Malva.
  text_original: 'Sra. alcaldessa. Sres. regidores, Srs. regidors.

    En nom de l’Associació de Veïns Amics de la Malva i també com a participant en el Consell Escolar
    de la Ciutat en nom de CC.OO. vinc aquí a mostrar el suport d’aquestes organitzacions a la moció presentada
    pel Sr. Amadeu en nom d’EUPV respecte a l’assumpte de l’establiment del districte únic i entenem que
    està també unida a l’altra moció també presentada pel tema de l’arranjament escolar.

    Entenem que aquest establiment del districte únic és una agressió contra el dret a l’educació en el
    sentit de què vivim en una ciutat on poden desaparéixer aquest curs 4 col·legis i 24 unitats suprimides,
    quan en este moment tenim també a la ciutat 24 alumnes per aula de mitjana, molt prop del màxim establert
    que són 25 si no comptem amb la salvaguarda de què en cas de necessitat es podria passar a 30.

    Entenem que el model de la Conselleria és per a estalviar diners, amuntonar xiquets sense cap tipus
    de cortapisa i que aquesta seria el compromís de què la gent poguera estar escolaritzada al seu barri.

    El Consell Escolar Municipal de la Ciutat de València ja es va pronunciar contra la supressió d’unitats,
    però sembla que la Conselleria no ha estat capaç de canviar la seua política en aquest sentit.

    Volem aclarir que el districte únic no vol dir major llibertat d’elecció per a les famílies sinó la
    pèrdua del dret a viure en un barri educatiu i en una ciutat sostenible. No és cert que ara puguen
    escollir millor pares i mares. Sempre s’ha pogut escollir, era un criteri de preferència, qui tenia
    preferència per a anar a un cole o a un altre. Els xiquets d’aquesta manera no podran anar a l’escola
    passejant ni podran conviure amb la gent del seu barri.

    Podem estar convertint els centres educatius en un centre comercial de distribuir conceptes i de dispensar
    serveis educatius a canvi de diners. Estem acostant els serveis bàsics als ciutadans o estem fent
    al revés? Potser amb aquest augment de la distància i de la ràtio estem condemnant les famílies amb
    menys recursos a no tindre suficient atenció educativa. És una simple regla de tres, quan més alumnes
    per aula menys atenció rebrà cadascú.

    També demanem participació i consens. Tenim comprovat per molts indicadors educatius que allà on la
    comunitat educativa participa en el disseny dels programes educatius i en la solució dels problemes
    els resultats són millors. En aquest sentit, el Consell Escolar s’ha pronunciat, tal com ho han expressat
    la majoria dels seus membres, sobre la inoportunitat de reduir de 17 a 4 districtes els districtes
    d’escolarització. Així i tot, la Conselleria no ha escoltat aquest pronunciament i ha reduït a un
    districte aquestes zones d’escolarització.

    Des de l’Associació de Veïns Amics de la Malva, com a veí de la zona dels barris marítims i com a
    representant de CC.OO. al Consell Escolar Municipal demanem que l’Ajuntament denuncie la pèrdua d’atenció
    educativa i de qualitat que suposa l’establiment del districte únic, i que contrapose al model mercantilista
    de la Conselleria un projecte de ciutat educativa i de barri educatiu participat per la mateixa ciutadania.

    Gràcies.'
  date: '2026-10-19'
  finding: E1b-2ff3eebafb
  text_cas: 'Sra. alcaldesa. Sres. concejales, Sres. concejales.


    En nombre de la Asociación de Vecinos Amics de la Malva y también como participante en el Consejo
    Escolar de la Ciudad en nombre de CC.OO. vengo aquí a mostrar el **apoyo a la moción** presentada
    por el Sr. Amadeu en nombre de EUPV respecto al asunto del establecimiento del distrito único y entendemos
    que está también unida a la otra moción también presentada por el tema del arreglo escolar.


    Entendemos que **este establecimiento del distrito único es una agresión** contra el derecho a la
    educación en el sentido de que vivimos en una ciudad donde **pueden desaparecer este curso 4 colegios
    y 24 unidades suprimidas**, cuando en este momento tenemos también en la ciudad **24 alumnos por aula
    de media**, muy cerca del máximo establecido que son 25 si no contamos con la salvaguarda de que en
    caso de necesidad se podría pasar a 30.


    Entendemos que **el modelo de la Conselleria es para ahorrar dinero**, amontonar niños sin ningún
    tipo de cortapisa y que este sería el compromiso de que la gente pudiera estar escolarizada en su
    barrio.


    El Consejo Escolar Municipal de la Ciudad de Valencia ya se pronunció contra la supresión de unidades,
    pero parece que la Conselleria no ha sido capaz de cambiar su política en este sentido.


    Queremos aclarar que **el distrito único no significa mayor libertad de elección** para las familias
    sino **la pérdida del derecho a vivir en un barrio educativo** y en una ciudad sostenible. No es cierto
    que ahora puedan elegir mejor padres y madres. Siempre se ha podido elegir, era un criterio de preferencia,
    quien tenía preferencia para ir a un colegio o a otro. **Los niños no podrán ir a la escuela paseando**
    ni podrán convivir con la gente de su barrio.


    Podemos estar convirtiendo los centros educativos en un centro comercial de distribuir conceptos y
    de dispensar servicios educativos a cambio de dinero. ¿Estamos acercando los servicios básicos a los
    ciudadanos o estamos haciendo lo contrario? ¿Quizás con este aumento de la distancia y de la ratio
    estamos condenando a las familias con menos recursos a no tener suficiente atención educativa? **Es
    una simple regla de tres, cuantos más alumnos por aula menos atención** recibirá cada uno.


    También demandamos **participación y consenso**. Tenemos comprobado por muchos indicadores educativos
    que donde la comunidad educativa participa en el diseño de los programas educativos y en la solución
    de los problemas los resultados son mejores. En este sentido, **el Consejo Escolar se ha pronunciado**
    sobre la inoportunidad de reducir de 17 a 4 distritos los distritos de escolarización. Así y todo,
    la Conselleria no ha escuchado este pronunciamiento y **ha reducido a un distrito** estas zonas de
    escolarización.


    Desde la Asociación de Vecinos Amics de la Malva, como vecino de la zona de los barrios marítimos
    y como representante de CC.OO. en el Consejo Escolar Municipal pedimos que **el Ayuntamiento denuncie
    la pérdida de atención educativa** y de calidad que supone el establecimiento del distrito único,
    y que se oponga al **modelo mercantilista de la Conselleria** un **proyecto de ciudad educativa**
    y de **barrio educativo** participado por la misma ciudadanía.


    Gracias.'
  resum_cas: La Asociación Amics de la Malva y CC.OO. denuncian que el establecimiento del distrito único
    de escolarización es una agresión contra el derecho a la educación, que causará la desaparición de
    4 colegios y 24 unidades, aumentará las ratios y afectará especialmente a familias con menos recursos,
    pidiendo un modelo de ciudad educativa participada.
  resum_val: L'Associació Amics de la Malva i CC.OO. denuncien que l'establiment del districte únic d'escolarització
    és una agressió contra el dret a l'educació, que causarà la desaparició de 4 col·legis i 24 unitats,
    augmentarà les ràtios i afectarà especialment a famílies amb menys recursos, demanant un model de
    ciutat educativa participada.
