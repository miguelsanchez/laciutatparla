  text_cas: 'Buenos días.


    Soy [***], presidenta del AMPA del Colegio Lluís de Santàngel, del Saler. Agradezco en nombre de todos
    que nos dejen intervenir en este pleno.


    Precisamente hace un año estuvimos aquí en la sesión ordinaria del 28 de septiembre de 2012 exponiendo
    el mismo problema que expondremos. Antes de reiterar, queremos recordarles que el portavoz del Grupo
    Popular, Sr. Grau, dijo, y cito textualmente: ''He escuchado con atención la intervención de los representantes
    del AMPA y vuelvo a decir que me parecen muy razonables sus quejas y estoy convencido que tanto el
    concejal responsable de Educación como el de Pedanías están por resolver el tema. Y no les quepa la
    menor duda que estarán a su lado para reclamar y buscar una solución a los temas que ustedes han planteado''.
    También añadió: ''Todo nuestro interés en buscarle solución a ese problema que han expuesto y que
    me parece grave y preocupante, lo digo; y nos vamos a volcar en buscarle solución''.


    Pues bien, señores, señoras, señora alcaldesa, **después de un año seguimos igual**. **Esto es un
    suspenso en el colegio** porque no han hecho los deberes como nos prometieron.


    Venimos a reclamar lo siguiente: **vivimos en una zona (pedanías del Sur)** donde hay **un único colegio
    público**, ubicado en la pedanía del Saler. Engloba a niños del Perellonet, el Palmar y la devesa
    del Saler. Por tanto, **nuestros hijos se ven obligados a desplazarse más de 12 km**. Que nuestros
    hijos vayan a este colegio no es un capricho; en 2002 cerraron el colegio del Palmar y en 2010 el
    del Perellonet. Y los responsables de Educación nos aseguraron que **nuestros niños tendrían transporte
    sin condicionarlo** a ningún otro requisito, como la renta, etc.


    La Administración decidió que para ahorrar subvencionaba el comedor para no tener que poner líneas
    de autobús al mediodía. Sin embargo, el año pasado y este, sin justificación, por medio de las órdenes
    y resoluciones correspondientes, se decidió **suprimir el servicio de autobús** para los niños de
    infantil y bachillerato y **condicionar el acceso gratuito al servicio de comedor** para la enseñanza
    obligatoria, es decir, primaria y ESO. Es cierto que este año, de manera provisional, tanto los niños
    de infantil como los de bachillerato están subiendo al autobús; pero los de infantil solo los que
    tengan hermanos en primaria, **discriminando a los que no los tienen**.


    Concretamente, en el Palmar no suben 8 niños; en el Perellonet, 17; en la Devesa, 8; total, **unos
    28 niños sin poder subir al autobús**, sabiendo además que hay plazas libres en los autobuses y no
    se entiende cómo no pueden usarse. Además, **creando otro agravio comparativo** con las pedanías del
    Norte donde sí suben al autobús todos los niños de infantil independientemente de si tienen hermanos
    o no. Nuestra situación se ve agravada por la **deficiencia en los servicios públicos de transporte**
    ya que esta línea regular pasa cada hora y concretamente en el Palmar solo cinco autobuses al día,
    otro problema que no se ha tenido en cuenta.


    **Pagamos nuestros impuestos como todos los ciudadanos de Valencia**, ya que las pedanías del Sur
    somos parte de este municipio; pero eso sí, **con servicios de tercera**. No estamos pidiendo lujos
    ni caprichos **estamos reivindicando que nuestros hijos puedan acceder a una escuela pública** en
    **igualdad de condiciones** que el resto de ciudadanos, teniendo en cuenta las peculiaridades de nuestra
    zona donde actualmente vivimos **más de 4.000 habitantes censados**.


    Esperamos que nuestro Ayuntamiento ponga una solución y no tener que esperar otro año.


    Muchas gracias por su atención.'
  resum_cas: El AMPA del Colegio Lluís de Santàngel del Saler reclama transporte escolar gratuito para
    los alumnos de infantil y bachillerato de las pedanías del Sur, denunciando discriminación y falta
