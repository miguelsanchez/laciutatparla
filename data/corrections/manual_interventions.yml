  intervinient: D. [***]
  entitat: Comité de Empresa de RTVV
  tipus_entitat: sindical
  idioma_original: valenciano
  text_original: 'Bon dia a tots.

    Sóc veí de València i president del Comité d’Empresa de RTVV, que sempre hem tingut voluntat de negociar
    i buscar una solució per a salvar l’empresa. S’adduixen raons econòmiques per a tancar RTVV perquè
    diuen que és més cara, no són certes. Tancar RTVV als Pressupostos de 2014 de la Generalitat Valenciana
    li costen més de 130 milions d’euros, mantindre-la menys de 100 milions d’euros. Les xifres són tan
    clares que són irrebatibles.

    Voluntat de diàleg n’hi ha. Per primera vegada ahir afortunadament el vicepresident de la Generalitat
    Valenciana ens va rebre i ens va escoltar. És la primera persona que ens escolta durant dos anys perquè
    altres han fet paripés, no ens han escoltat i han fingit. No ho dic jo, ho diu una sentència del TSJCV
    que establix com a una de les causes principals per la qual s’ha tombat un ERO il·legal que va tirar
    al carrer a 952 treballadors vulnerant els drets constitucionals la falta de diàleg per part de l’empresa,
    que tenia com a únic objectiu un objectiu predeterminat de privatitzar i tirar treballadors públics.

    Això li ha repercutit a les arques públiques un greu perjuí. Nosaltres mantenim la mà estesa. RTVV
    és viable, només falta que no se li faça un dany greu al poble valencià després d’haver-li’l fet i
    haver torturat durant dos anys als treballadors de la casa. Perquè no només és el sector audiovisual
    valencià sinó que aquells que aprengueren la nostra llengua, saberen que la nostra llengua es podia
    llegir quan tenien més de 10 anys, que ni la meua iaia parlava castellà, jo vaig aprendre el castellà
    en la tele i fins als quatre anys no el parlava. Aquells que som iguals que els qui parlen castellà
    i tenen dret amb Madrid a canviar el seu canal i vore la seua tele, per no complir una sentència judicial
    no poden castigar al conjunt del poble valencià.

    I no ho poden fer en una ciutat on tant important paper ha tingut en la difusió de les seues festes,
    la seua cultura i el coneixement d’esta terra i d’este poble al conjunt de tot el territori com ha
    sigut RTVV, que només en les falles ha fet unes fantàstiques retransmissions. I quan van acabar les
    últimes, amb més d’un 30% d’audiència, arbitràriament com ha establit la sentència van tirar al carrer
    de forma injusta i vulnerant els seus drets constitucionals al 90% dels càmeres i treballadors que
    estaven cobrint les mascletaes.

    Tenen ara l’oportunitat de rectificar, li faran un bé al poble. Les raons econòmiques no existixen
    i hi ha una voluntat manifestada ahir per la Vicepresidència de la Generalitat de què RTVV els dos
    pròxims anys no li costa un euro més dels que la Generalitat té pressupostats, només és una qüestió
    de voluntat política. Els demanem el manteniment d’esta empresa, tancar-la li fa mal al conjunt de
    la ciutadania.

    Moltes gràcies.'
  reason: Acta introduces the president of the RTVV works council as a citizen speaker at request of AV
