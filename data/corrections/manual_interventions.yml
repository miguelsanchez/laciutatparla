- id: 2013-05-31-103
  pleno_id: '2013-05-31'
  ordre: 6
  intervinient: '[***]'
  entitat: Associació de Veïns Grau-Port
  tipus_entitat: av
  idioma_original: castellano
  text_original: 'Sra. Alcaldesa, Sras. y Srs. Concejales.

    Con gran sorpresa, hemos recibido los vecinos del barrio del Grau la noticia de que la cesión de la
    dársena a la ciudad por parte del Puerto, se iba a convertir en un nuevo y de los más bellos barrios
    de la ciudad. Sin que nuestro barrio, el Grao, con más de 700 años de historia compartida con el puerto,
    fuera ni tan siquiera mencionado.

    La famosa deuda que se tiene con los poblados marítimos, tantas veces repetida por ustedes, con motivo
    de los grandes proyectos, sufridos por nosotros: Copa de América, Formula 1, PAI del Grao etc. va
    camino de convertirse una vez más en el olvido y el abandono.

    Tenemos, ya no hay excusas, la última oportunidad de conectar la ciudad y el mar, de forma satisfactoria
    para el conjunto de los ciudadanos. Ya en 1.997 la Sra. Alcaldesa con motivo de la exposición celebrada
    en les drassanes “El port de València i el seu entorn urbà” nos hablaba de sentar las bases para unir
    este conjunto, la fachada marítima, con la ciudad de Valencia. Han pasado 16 años y poco se ha hecho
    de verdad en este sentido.

    Es el momento de que los barrios de Nazaret, El Grao, Cabanyal y Malvarrosa dejen de ser el Bronx
    de la ciudad y por fin se conviertan en el enlace natural del resto de la ciudad con el mar, como
    ha sucedido en otras ciudades marítimas. Esto si crearía riqueza, social y también turística y económica.

    No puede prevalecer una vez más la lógica económica. Tenemos la experiencia de la Copa de América
    que una vez celebrada, y estamos hablando de hace 6 años, convirtió un espacio público de gran valor
    simbólico para los vecinos, en un lugar abandonado y en desuso. Nos dijeron que la ocupación de este
    espacio era efímera, que una vez celebrada la Copa, revertiría de nuevo al menos, a como estaba. Nos
    mintieron y nos han dejado todo este tiempo, sin tan siquiera poder ver el mar. Esta sí que es la
    realidad. Y este es su espíritu democrático.

    Se nos habla del gran potencial económico, turístico y social de la dársena; pero nosotros destacamos
    sobre todo su potencial social. A la hora de hablar del rendimiento, nunca se ponen cifras en euros
    al bienestar, a la calidad de vida de los ciudadanos, etc.

    No entendemos que una minoría, por muy adinerada y lujosa que sea, se adueñe de una parte de la ciudad,
    en menoscabo de la mayoría. No es verdad que eso sea bueno para los ciudadanos, para Valencia y ustedes
    lo saben y lo permiten.

    Queremos participar, junto con todos los demás sectores, en desarrollar el plan de usos de la dársena.
    No entendemos nuestra participación y disfrute como algo pasivo. No queremos que este espacio público
    se convierta sólo en un nuevo centro comercial de ocio y consumo al que podamos ir. Ya hay muchos
    en la ciudad y no va a revalorizar, sino devaluar este espacio.

    Sra. Alcaldesa, por favor, no se olviden de incluir en ese tren turístico que van a licitar, la inclusión
    de un itinerario por los verdaderos barrios marítimos. No lo harán. Volverán a cubrir con toldos nuestro
    barrio, como lo hicieron en la Fórmula 1.

    Gracias por su atención.'
  reason: 'Acta: ''interviene ****** en representación de la Asociación de Vecinos Grau-Port, quien manifiesta
