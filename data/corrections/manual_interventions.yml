  text_val: 'Bon dia. En nom de l''Associació Alanna, gràcies per fer-nos partícips d''este Ple sobre
    l''Estat de la Ciutat. La situació econòmica i social actual ha tingut i té **múltiples conseqüències**;
    una d''elles ha sigut l''**empitjorament de les condicions de vida** de les persones. La porta d''entrada
    al sistema públic de servicis socials continua **col·lapsada per la seua falta d''adaptació** a tal
    increment de demanda. Esta situació és especialment costosa en el cas dels centres municipals de servicis
    socials. Coneixem el vostre esforç en este sentit. La majoria de les persones, davant de la demora
    dels servicis socials públics, es veuen afectades, incrementant-se el seu empobriment i produint-se
    un **debilitament generalitzat de les seues condicions materials d''existència**: precarització residencial,
    alimentació deficient, augment del seu endeutament, pèrdua d''habitatges. I pel que fa a les quanties,
    les **prestacions econòmiques de la renda garantida** establides a la Comunitat Valenciana són **clarament
    insuficients** i no garanteixen el dret a una **subsistència digna**. Massa anys arrossegant esta
    greu situació.


    Les nostres propostes, que li transmetré ara mateix. La **necessitat de coordinació de servicis socials**
    amb altres sistemes fonamentals com ocupació, educació i habitatge, que són **dimensions bàsiques
    per a la inclusió social** i on la falta de polítiques coordinades és evident. Això implica entendre
    els processos d''inclusió de manera més complexa que el simple traspàs de renda o d''ocupabilitat.
    Sabem que heu començat a fer-ho. Des de la xarxa contra la pobresa i l''exclusió social i des de l''associació
    valenciana d''empreses d''inserció, i altres plataformes de les quals formem part, reivindiquem uns
    **servicis socials públics amb una dotació pressupostària i de personal**, estructura organitzativa
    i funcional adequada a l''increment de demanda i als nostres perfils de població, sense oblidar els
    oblidats: **famílies que sobreviuen al carrer**, **minories ètniques**, fent especial èmfasi en l''**ètnia
    gitana**, dones, així com el **suport i recolzament responsable a les entitats socials** que treballem
    al carrer.


    Desenvolupar **polítiques socials i d''ocupació inclusives** que contemplen la **inserció sociolaboral**
    de les persones en situació de pobresa i exclusió com a eix prioritari, tenint especial rellevància
    les dirigides a **dones en situació d''alta vulnerabilitat social**: dones víctimes de violència de
    gènere i dones gitanes, també. Contemplar l''**acompanyament personalitzat** com a clau en l''actuació
    amb les persones més vulnerables. Cal tindre en compte la **diversitat de grups i col·lectius** en
    situació de pobresa i/o exclusió per a respondre adequadament a la diversitat de les necessitats d''inserció
    i inclusió social. També necessitem **donar suport a la creació d''ocupació** mitjançant projectes
    innovadors i sostenibles de l''economia social, i en concret de les empreses d''inserció per a aconseguir
    els objectius socials. **Coordinar estratègies**, línies d''actuació i recursos de les diferents regidories
    que tenen competències en polítiques d''ocupació i de lluita contra la pobresa i/o exclusió.


    Com he de finalitzar, doncs els done les gràcies. I en nom de l''Associació Alanna, gràcies per escoltar-nos
    i per fer que entre tots i totes puguem fer una ciutat socialment responsable, igualitària per a tota
    la població d''esta ciutat. Gràcies.'
