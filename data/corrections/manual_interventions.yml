  idioma_original: valenciano
  text_original: 'President, alcalde, regidors, veïns i aficionats al món del bou, i veïns de València.
    Estic ací hui en representació de totes les penyes de València, sobretot de les pedanies. Amb una
    preocupació molt gran i una preocupació que volem traslladar a tots vostés. Per què? Perquè representem
    a diferents sentiments socials, a diferents formes de pensar políticament. [La presidència demana
    que es retire una samarreta de la llotja]


    Com representem a diverses formes de pensar i de vot, no anem a ficar-nos en contra de ningun partit,
    per suposat. Però sí que anem a transmetre la nostra preocupació perquè este Govern en el seu dia
    va permetre una València plural, oberta, democràtica, amb llibertat d’expressió i sobretot que defenguera
    la cultura, que defenguera l’esport, que defenguera totes les formes socials d’entendre la nostra
    cultura valenciana siga de la banda que siga. I ens il·lusionàrem, ens il·lusionàrem per eixe nou
    govern.


    Però resuta que no va ser aixina, que al final tot és com fa tres anys en el mateix lloc que estem
    ara on fa tres anys ens va prohibir el bou embolat. Dins de la nostra línia d’estendre les mans a
    totes les entitats polítiques el que férem és ficar-nos a treballar perquè entenguem que n’hi ha un
    encant diferent en este Govern, en este Ple respecte als animals. Ens ficàrem a treballar a vore si
    fem alguna cosa malament, a vore si realment n’hi ha eixe maltractament. Començàrem a tindre reunions
    amb la Generalitat Valenciana que de fet és la mateixa administració que tots vostés, Compromís i
    PSOE. Ens ficàrem a treballar de la mà de la Policia Autonòmica que està regida també per tots vostés.


    Ens ficàrem a treballar de la mà de veterinaris, tan necessaris en esta festa. Però veterinaris de
    l’Administració, no privats. Perquè jo puc buscar a un veterinari privat i que diga el que jo vullga.
    No, veterinaris de l’Administració que han dit realment què és el maltractament. En això ens basem
    per a dir que no n’hi ha maltractament, no com tots vostés. A mi m’agradaria que la Sra. Glòria Tello
    em diguera realment en què s’ha basat vosté per a dir que n’hi ha maltractament, en quina activitat
    científica. No perquè és la seua opinió perquè opinions tots tenim les nostres i moltes vegades tenim
    educació i ens les guardem.


    Hem arribat més lluny i de fet hem fet dos viatges. Un el férem a terres de Navarra on ara últimament
    s’havia ficat en entredit també la festa popular i estiguérem parlant amb gent de Bildu, amb regidors
    de Bildu. I sap què ens digueren? Que sí al bou. No s’han negat en ningun moment, ni diuen que n’hi
    ha maltractament. No se’ls va ocórrer tocar el bou. Sí, deixem parlar Sr. Grezzi que jo no dic res
    quan vosté està parlant.


    Hem anat també a Catalunya, una terra tan aprop de tots vostés, on ens hem reunit amb alcaldes d’ERC
    en les Terres de l’Ebre. I saben què ens diuen? Que prohibit tocar el bou embolat. Sí, és el seu entorno,
    val? Prohibit tocar el bou embolat. En conseqüència, cada vegada entenem menys açò.


    Sra. Tello, vosté possiblement tinga un mèrit i siga el d’haver aconseguit en la seua Regidoria be
    Benestar Animal enfrontar a dos parts tan contràries com és el PACMA, que l’altre dia va eixir la
    presidenta dient la nefasta gestió de la seua regidoria i de vosté mateixa, això està en el diari,
    no m’ho invente jo, i la de la gent del bou. O siga, dos parts tan contràries va vosté a aconseguir
    ficar-les d’acord amb la seua nefasta gestió.


    Per tant, el que demanem ací a tots vostés, regidors, persones que tenen la paraula, vosté Consol
    estava l’altre dia en pedanies i va sentir a les més de 200 persones el que clamaven. Clamaven bou
    embolat. Pot agradar més, pot agradar menys, estem d’acord. Si a vostés no els agrada el bou no participen.
    Però vosté va a vore el poble i ací al final l’alcalde, el Sr. Ribó, els regidors diuen i es vanaglorien
    de dir que són la veu del poble. El poble també és taurí, n’hi ha una part del poble que és taurina
    i no una part xicoteta. Per tant, si no volen estar en contra d’eixa part del poble que vostés diuen
    que representen. Si volen estar amb els seus alcaldes, com l’alcalde de Borbotó i tots els alcaldes
    de Compromís de tots els pobles: de Foios, d’Albalat, de Meliana, de Rafelbunyol, de tots els pobles
    que vostés vullguen que estan vostés governant han de donar-nos suport. Si no és aixina, de moment
    ja diguem que no creiem en la classe política, que no creiem en la democràcia. Per tant, el vot de
    hui ha de ser a favor del bou embolat.'
