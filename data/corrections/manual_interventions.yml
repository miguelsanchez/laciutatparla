  intervinient: '[***]'
  entitat: Associació Acció Ecologista-Agró
  tipus_entitat: plataforma
  idioma_original: valenciano
  text_original: 'Bon dia.

    Per a Acció Ecologista Agró és molt important la relació entre patrimoni històric i cultural i mediambiental
    perquè entenem que són valors que poden i deuen conjugar-se de manera harmoniosa. I dins d’aquest
    lligam patrimonial de tots no poden entrar de cap manera les tortures, les privacions de llibertat,
    ni les agressions de cap tipus, ni contra les persones ni contra els animals.

    Per aquest motiu i molts altres estem en contra del maltractament i la tortura als animals perquè
    representa un espectacle impropi d’una societat avançada, moderna i culta a l’Europa del segle XXI.
    Entenem que determinades tradicions no poden tindre cabuda en un món harmoniós, pacífic i civilitzat
    amb el qual somniem i amb el qual tots estem o hauríem d’estar compromesos.

    Per tant, aquestes pràctiques d’abús contra els animals per a nosaltres no són cultura, almenys no
    és la que volem transmetre al món, no és la que volem que hereten els valencians i les valencianes
    del futur. El País Valencià té un immens patrimoni mediambiental i cultural del que ens hem de sentir
    ben orgullosos i que tenim la responsabilitat de protegir i conservar. D’aquest patrimoni immaterial
    destaquen les festes i celebracions tradicionals.

    Tanmateix, hi ha algunes tradicions que haurien d’adaptar-se als nous temps. Es tracta al nostre parer
    d’anacronismes medievals mancats de la sensibilitat que s’espera d’un ser humà evolucionat i eixa
    és la nostra responsabilitat com a espècie. Les tradicions quan esdevenen anacronismes que xoquen
    contra els valors actuals d’humanisme i de progrés tenim l’obligació moral de revisar-les. Per tant,
    apel·lem a la reconversió de les festes en què es maltracta els animals.

    La diversió en unes festes no ha d’implicar en cap cas sofriment i humiliació d’altres sers vius.
    Maltractar un animal per diversió és un acte de barbàrie que denigra el que hi participen, raó per
    la qual ens manifestem públicament en contra de la tortura que representa el bou embolat i en bou
    amb corda.

    Gràcies.'
  reason: 'Acta: chair grants the three minutes to one speaker of Associació Acció Ecologista-Agró; not
    extracted.'
  date: '2026-10-20'
  finding: E1b-c4e30a9505
  text_cas: 'Buenos días.


    Para Acción Ecologista-Agró es muy importante **la relación entre patrimonio histórico y cultural
    y medioambiental** porque entendemos que son valores que pueden y deben conjugarse de manera armoniosa.
    Y dentro de este vínculo patrimonial de todos no pueden entrar de ninguna manera **las torturas, las
    privaciones de libertad**, ni las agresiones de ningún tipo, ni contra las personas ni contra los
    animales.


    Por este motivo y muchos otros **estamos en contra del maltrato y la tortura a los animales** porque
    representa un espectáculo impropio de una sociedad avanzada, moderna y culta en la Europa del siglo
    XXI. Entendemos que **determinadas tradiciones no pueden tener cabida** en un mundo armoniosos, pacífico
    y civilizado con el cual soñamos y con el cual todos estamos o deberíamos estar comprometidos.


    Por tanto, **estas prácticas de abuso contra los animales** para nosotros no son cultura, al menos
    no es la que queremos transmitir al mundo, no es la que queremos que hereden los valencianos y las
    valencianas del futuro. El País Valenciano tiene **un inmenso patrimonio medioambiental y cultural**
    del que hemos de sentir bien orgullosos y que tenemos la responsabilidad de proteger y conservar.
    De este patrimonio inmaterial destacan **las fiestas y celebraciones tradicionales**.


    Sin embargo, hay algunas tradiciones que deberían adaptarse a los nuevos tiempos. Se trata en nuestro
    parecer de **anacronismos medievales** carentes de la sensibilidad que se espera de un ser humano
    evolucionado y esa es nuestra responsabilidad como especie. **Las tradiciones cuando se convierten
    en anacronismos** que chocan contra los valores actuales de humanismo y de progreso tenemos la obligación
    moral de revisarlas. Por tanto, **apelamos a la reconversión de las fiestas** en que se maltrata a
    los animales.


    La diversión en unas fiestas no debe implicar en ningún caso **sufrimiento y humillación de otros
    seres vivos**. Maltratar un animal por diversión es **un acto de barbarie** que degrada a los que
    participan, razón por la cual nos manifestamos públicamente **en contra de la tortura** que representa
    **el bou embolat y el bou amb corda**.


    Gracias.'
  resum_cas: La ONG Acció Ecologista-Agró se opone al maltrato animal en fiestas tradicionales como el
    bou embolat y el bou amb corda, argumentando que estas prácticas son anacronismos medievales incompatibles
