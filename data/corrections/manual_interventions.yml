    un tema educatiu, no és un tema polític**. Per això venim ací on són tots vostès representant-nos
    i el que volem és que ens echeu una mà.


    Com deia la meua companya, de fet **és impossible teletraballar**. Jo amb molta honra també sóc empleada
    pública, no he pogut contribuir a una administració segura perquè no m''ha permés poder teletraballar
    des de casa meua. Però entre altres coses sóc educadora i orientadora laboral, i el que crec és que
    **necessitem alumnat del segle XXI on les seues competències són eminentment digitals**. Tenim un
    sistema, tenim financiacions que s''estan fent des d''ací des dels grups polítics, amb docents que
    han estat en una pandèmia treballant dia i nit cercant recursos educatius que ara resulta que nosaltres
    des de la Devesa el nostre alumnat no pot accedir.


    Aleshores, açò és el que els demanem, que tinguem **alumnes del segle XXI** que no solament han de
    memoritzar sinó que **han de tindre competències digitals** i tot tipus de professionals, que han
    de fer **cursos a distància**, que han de consultar vídeos. Solo arribar ací hui ha sigut una odissea.
    Ahir tardarem **tres hores en mandar la sol·licitud telemàtica** i poder annexar els documents, però
    és que hui hem vingut i ni tant sols hem pogut imprimir el justificant que enviarem ahir.


    Aleshores, els demanem de veritat, no sabem ja ni com ni on, els agraïm moltíssim, moltíssim que nos
    esteu escoltar i volem que **lluiteu per nosaltres amb les telecomunicacions** o amb qui siga per
    a **fer de la Devesa un lloc moltíssim més agradable** del que està sent tod''ara i en el que esteu
    invertint un montó vosté d''esforç i de diners. Moltíssimes gràcies.'
