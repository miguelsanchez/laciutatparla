    xocar contra el pilar, desnucar-se i morir en l''acte. Va ser un dia trist per a tots els taurins.
    Deixen que els mostre una altra fotografia. Esta és la del cavall Hickstead, és el millor cavall del
    món. És un cavall preciós, molt valuós, el campió dels salts. Ací està en una altra imatge tombat
    en el terra, li acaba de donar un infart i ha faltat en mig d''una competició. Suposo que els prohibicionistes
    de Compromís voldran prohibir l''hípica. Quina barbaritat, no? Pujar-se damunt d''un animal, colpejar-lo
    amb els talons, colpejar-lo amb la fuet, obligar-lo a girar el cap, obligar-lo a saltar. El procés
    de la doma deu ser traumàtic per al cavall, no? L''hípica ens ha acompanyat durant milers d''anys
    i és la comunió perfecta entre home i animal, però suposo que vostés la volen prohibir.


    Este és Faruk, este és el llebrer més ràpid d''Espanya. Perseguint una llebre es va xocar contra una
    pedra, es va desnucar i es va morir. Suposo que vostés també volen prohibir que els llebrers perseguisquen
