  reason: 'Missed speaker: D. ******, en representación de la Associació de Veïns, Cultural i de Consumidors
    de Patraix (substation speech).'
  text_original: 'Muy buenos días, Sra. Alcaldesa. Sras. y Sres. Concejales.


    Me van a permitir antes de desarrollar este tema, me cuente o no los segundos, quisiera agradecer
    a este último Pleno, a aquellos concejales del gobierno o de la oposición, a aquellos que no repetirán
    sobre todo y que han utilizado la participación, el diálogo y el consenso, por encima de la prepotencia,
    el autoritarismo y ninguneo.


    Y seguiremos defendiendo la participación frente a la prepotencia y el autoritarismo. De todas formas,
    a los que os vayáis gracias por haber hecho ese papel.


    Hace ya algunos años, Sra. Alcaldesa, una noticia en el periódico contaba que en Patraix iban a colocar
    una subestación eléctrica. Poco más decía, ni tan siquiera el lugar de ubicación. Todo ello fue un
    tórrido mes de agosto, qué casualidad.


    Después de muchos años, los vecinos y vecinas de Patraix sabemos qué es una ST: líneas de alta tensión,
    campos electromagnéticos, licencias mal dadas, explosiones, etc. Muchos años de reivindicación solicitando
    que no nos construyeran una instalación que se encuentra a escasos metros en una zona residencial
    densamente poblada.


    Más de 10 años con una licencia tipo venta de frutas, quiosco…, inocua, es algo que no podemos olvidar.
    No basta la anulación del TSJCV, la anulación del acuerdo municipal que otorgaba la licencia, ni la
    de la Junta de Distrito, ni el compromiso de soterrar estas instalaciones, ni tan siquiera la contemplación
    del traslado al lado del cauce nuevo del Turia.


    ¿No ha habido bastante sufrimiento, ni reivindicación, ni sentencias del TSJCV, ni principio de precaución,
    ni protección de la salud para cerrar esta actividad y trasladarla según el acuerdo de todos los Grupos,
    por encima de Iberdrola, Generalitat y gobierno central? ¿Qué les pasa ahora, Sra. Alcaldesa, para
    actuar con contundencia contra la Generalitat y el Gobierno?, ¿quizá el color político?


    Los ciudadanos estuvimos en contra de esa instalación, independientemente de quienes nos gobernaran
    cada cuatro años, aquellos que tienen la responsabilidad de tomar esa decisión política. Envuélvase
    en esa bandera que tanto nos tiene acostumbrada, la bandera de la ciudadanía y en este último Pleno
    exija el cierre y el traslado de esta instalación ya.


    Gracias.'
  date: '2026-10-20'
  finding: E1b-12c45fca57
  text_val: 'Bon dia, Sra. Alcaldesa. Sres. i Srs. Regidors.


