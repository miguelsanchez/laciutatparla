    de la figura del cap de l''Estat com a possible merecedor dels mencionats honors i distincions**.


    Considerem que una iniciativa com esta, **careix de total justificació o oportunitat i lleialtat a
    la realitat majoritària de la ciutadania**, utilitzant les pròpies institucions del sistema per a
    carregar contra el propi sistema que entre tots ens hem donat. Veiem este fet com **una desafortunada
    ocurrència carregada d''intenció partidista i política unilateral**, fent ús de la seua actual majoria
