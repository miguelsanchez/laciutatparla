    També cal assenyalar que una de les qüestions en què ens hem vist perjudicats tots els veïns del barri
    és que des que es va decidir desviar les rutes d''autobusos que circulaven pel centre i que ha generat
    **un augment del trànsit de fins a nou línies de la EMT pel carrer Colón**, ha incrementat moltíssim
    el trànsit i ha suposat un increment així mateix de **la contaminació en eixa zona**. També considerem
    que el pas de vehicles privats també és necessari i així s''ha posat de manifest fins i tot en l''estudi
    que va encarregar este consistori a una empresa, crec que era de Barcelona, anomenat Diagnosi propositiva
    per a la millora de la mobilitat activa. Així també està contemplat en diferent normativa urbanística
    vigent, tant en el Pla General com, per exemple, en el Pla de Mobilitat Urbana Sostenible.


    Considerem que **és necessari el trànsit privat** perquè a més de pertànyer el carrer Colón al primer
    anell de la ciutat i ser la lògica ronda interior té dos aparcaments públics de molta demanda que
    són l''aparcament de la Seguretat Social i l''aparcament de Mediamarkt, així com altres aparcaments
    com El Corte Inglés en els carrers transversals, que funcionen perfectament per a permetre aparcar
    al centre a molts ciutadans que volen vindre al centre i amb això afavorixen la riquesa de tot el
    barri, existint a més altres 21 aparcaments privats pertanyents a edificis d''habitatges en el mateix
    carrer.


    **La ronda interior és una via circular de sentit únic** que ha de preservar la seua continuïtat,
    però que paradoxalment s''interromp incomprensiblement en un sol punt: els escassos metres que hi
    ha entre Porta de la Mar i el encreuament amb Comte Salvatierra i Cerdán de Tallada. Un únic punt
    que genera una gran confusió al conductor ja que els vehicles que desitgen anar així al carrer Colón
    han d''atravessar per Gravador Esteve, Sorní i seguir per Comte Salvatierra fins al carrer Colón.
    O pitjor encara, desviar-se cap a la Gran Via Marqués del Turia, que en estos últims anys ha patit
    **un augment de 8.000 cotxes diaris**, col·lapsant-se tota la Gran Via en hores punta, ja que **és
    el carrer urbà més transitat de la ciutat, amb 62.000 vehicles diaris**, tan sols per darrere de l''avinguda
    Catalunya i la de Pius XII. No podem tancar els ulls davant **el gravíssim impacte ambiental** que
    això suposa i la Gran Via Marqués del Turia està, efectivament, amb uns nivells d''emissions molt
    importants. I tot això davant les portes de l''entrada en vigor de la nova ordenança baixa d''emissions.


    Nosaltres, **la nostra primera reclamació seria la reobertura al trànsit privat des de Porta de la
    Mar** i se''ns ha justificat el tancament per a evitar incidències amb els autobusos de la EMT que
    passen per Porta de la Mar. Però realment és un element dissuasori de travessar Colón com a carrer
    de pas, que perjudica enormement la Gran Via Marqués del Turia com ja hem explicat. **La nostra segona
    reclamació és l''eliminació d''un dels dos carrils bus-taxi**. És innecessari tindre dos carrils bus-taxi.
    Els que vivim ací ho hem comprovat. Els autobusos sempre van un darrere de l''altre, mai s''avancen.
    I els taxis poden circular darrere dels autobusos. O en cas de necessitat d''avançar-los, poden fer-ho
    ocupant provisionalment els taxis el carril del trànsit privat i no passaria res, com en la resta
    de la ciutat. El segon carril els dic que està permanentment buit, com en la resta de la ciutat. El
    segon carril, com deia, està permanentment buit, mentre hi ha **cues insufribles al carril privat**
    per la presència de tres fatídics punts negres, tots ells girs a l''esquerra, que són Comte Salvatierra,
    Hernán Cortés i Pizarro. No sé si hauran tingut oportunitat de passar per eixos carrers, però és insufrible
    arribar i girar per eixos carrers. **La solució és molt senzilla, eliminar el segon carril bus-taxi**
    i repartir el seu espai entre la resta.


    D''altra banda, agraïm l''oportunitat d''expressar-nos en este ple davant de tots vostés i al Partit
    Popular per comprometre''s a comptar amb nosaltres per a col·laborar en la futura reforma del carrer
    Colón, així com a la resta de partits, posant-nos a la seua disposició per si volgueren fer-nos alguna
    proposta per al futur.


    Moltes gràcies.'
