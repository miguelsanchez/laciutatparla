- id: 2016-09-20-110
  pleno_id: '2016-09-20'
  ordre: 10
  intervinient: '[***]'
  entitat: Associació Alanna
  tipus_entitat: ong
  idioma_original: castellano
  reason: Introduced in the acta as 'Associació Alanna. Intervé' but not extracted.
  text_original: 'Buenos días. En nombre de Asociación Alanna, gracias por hacernos partícipes de este
    Ple sobre l’Estat de la Ciutat. La situación actual económica y social ha tenido y tiene múltiples
    consecuencias; una de ellas ha sido el empeoramiento de las condiciones de vida de las personas. La
    puerta de entrada al sistema público de servicios sociales continúa colapsada por su falta de adaptación
    a tal incremento de demanda. Esta situación es especialmente gravosa en el caso de los centros municipales
    de servicios sociales. Conocemos de vuestro esfuerzo en este sentido. La mayoría de las personas,
    ante las demora de los servicios sociales públicos, se ven afectadas, acrecentándose su empobrecimiento
    y produciéndose un debilitamiento generalizado de sus condiciones materiales de existencia: precarización
    residencial, alimentación deficiente, aumento de su endeudamiento, pérdida de viviendas. Y en cuanto
    a las cuantías, las prestaciones económicas de la renta garantizada establecidas en la Comunidad Valenciana
    son claramente insuficientes y no garantizan al derecho a una subsistencia digna. Demasiados años
    arrastrando esta grave situación. Nuestras propuestas, que le voy a transmitir ahora mismo. La necesidad
    de coordinación de servicios sociales con otros sistemas fundamentales como empleo, educación y vivienda,
    que son dimensiones básicas para la inclusión social y en donde la falta de políticas coordinadas
    es patente. Esto implica entender los procesos de inclusión de manera más compleja que el puro traspaso
    de renta o de empleabilidad. Sabemos que habéis comenzado a hacerlo. Desde la xarxa contra la pobreza
    y la exclusión social y desde la asociación valenciana de empresas de inserción, y otras plataformas
    de las que formamos parte, reivindicamos unos servicios sociales públicos con una dotación presupuestaria
    y de personal, estructura organizativa y funcional adecuada al incremento de demanda y nuestros perfiles
    de población, sin olvidar a los olvidados: familias que sobreviven en la calle, minorías étnicas,
    haciendo especial hincapié en la etnia gitana mujeres, así como el apoyo y respaldo responsable a
    las entidades sociales que trabajamos en la calle. Desarrollar políticas sociales y de empleo inclusivas
    que contemplen la inserción socio-laboral de las personas en situación de pobreza y exclusión como
    eje prioritario, teniendo especial relevancia las dirigidas a mujeres en situación de alta vulnerabilidad
    social: mujeres víctimas de violencia de género y mujeres gitanas, también. Contemplar el acompañamiento
    personalizado como clave en la actuación con las personas más vulnerables. Se ha de tener en cuenta
    la diversidad de grupos y colectivos en situación de pobreza y/o exclusión para responder adecuadamente
    a la diversidad de las necesidades de inserción e inclusión social. También necesitamos apoyar la
    creación de empleo mediante proyectos innovadores y sostenibles de la economía social, y en concreto
    de las empresas de inserción para lograr los objetivos sociales. Coordinar estrategias, líneas de
    actuación y recursos de las distintas concejalías que tienen competencias en políticas de empleo y
    de lucha contra la pobreza y/o exclusión. Como debo finalizar, pues le doy a ustedes las gracias.
    I en nom de la Associació Alanna, gràcies per escoltar-nos i per fer que entre tots i totes puguem
    fer una ciutat socialment responsable, igualitària per a tota la població d’esta ciutat. Gràcies.'
