  text_val: 'Molt bon dia. Sóc Ana Juana Broncano López, veïna de tota la vida de La Torre, i m''agradaria vore en la senyora
    Catalá la cara amable. Fins ara sols l''hem vista en fotos i no s''ha acostat a cap carrer a preguntar als veïns res.
    O siga, realment no s''ha preocupat per l''estat psicològic que estan patint. Són sis mesos, són sis mesos de nefasta
    gestió. I a sobre nosaltres som persones que ja tenim la sensibilitat molt danyada per la senyora Catalá, perquè nosaltres
    el que volem és ajuda, ajuda. I nosaltres el que demanem són recursos. Recursos que els té l''Ajuntament. Nosaltres som
    part de València, no som no part de València. No ens poden tractar tan injustament. I menys a les persones majors que
    seguixen sense poder baixar al carrer, les hem d''atendre. Als xiquets. En fi, el que són els nostres veïns i veïnes que
    ho estan passant molt malament. Vosté no va, no es passeja pel carrer i veu els ulls vidriosos de la gent. Jo sí, perquè
    som veïns. I jo sóc de les menys afectades perquè tinc vivenda, però el que jo no puc tolerar que a un veïnat tan danyat
    se''l seguisca danyant tan injustament. És nefast. I mire''m a la cara. Sap? Pose''m una cara amable. Val? I aleshores
    m''atendrà...

    Molt bé, m''alegre molt. Però si pren nota, que siguen fets.

    Bé, en primer lloc jo vaig a anar per la part cultural. De tota la vida, que sóc de La Torre, hem de creuar cap ací, cap
    allà, per a realitzar les nostres inquietuds. Doncs molt bé, jo com hem estat passant pel pont de la Solidaritat que ha
    sigut una gran alegria per a nosaltres dins del que ens ha passat, la catàstrofe. Però una cosa és una catàstrofe natural
    i una altra cosa és com vostés l''estan gestionant. Val, doncs aleshores com he hagut d''anar molt a San Marcelino veig
    que té un centre cultural on es realitzen moltes activitats i inquietuds. Perquè nosaltres a La Torre també tenim moltes
    inquietuds, però el que no tenim és centres culturals per a la joventut, per als nostres xiquets, per als nostres majors.
    I una biblioteca decent, no un forat com s''està creant ara. Aleshores, un centre cultural és molt necessari per a la
    convivència, per a la sociabilitat, perquè els veïns i veïnes de La Torre compartim espais amables.

    I després, La Torre va en creixement. Amb la qual cosa també seria necessari tindre una escola infantil municipal per
    a ajudar. Bé, perquè n''hi ha d''haver, perquè no en tenim altra, una xicoteta, i La Torre va en creixement. Aleshores,
    necessitem d''eixe espai. I tot el que dic són competències municipals. I després, per un altre costat, per què no tenen
    vostés la decència de posar una piscina municipal? Perquè ja de moment ens hem de buscar la vida com sempre a les localitats
    properes. Fins i tot jo, quan estudiava al Pare Manjón, una professora molt preparada mentalment amb l''esport ens portava
    a la piscina Vedrí, on està l''Alameda que tot allò ho he viscut. I aleshores havíem de passar cap amunt, cap avall. I
    parle que jo tinc 64 anys. També tinc memòria i he viscut moltes coses. I seguix el barri igual, amb moltes necessitats.
    I faça''s càrrec del que és la seua competència municipal.

    I aleshores jo crec que este tipus de gestió vosté que té la responsabilitat, moral ja crec no sé si té vosté moralitat
    perquè si en tinguera ja haguera vetlat pels nostres interessos.

    Respecte''ns vosté a nosaltres. Quan em respecten a mi, jo respectaré.

    Estem ací des de les 11:00 del matí. No han sigut capaços de respectar-nos.

    I jo també a vosté que tinga respecte amb els ciutadans de La Torre, que és vosté la nostra alcaldessa i no s''oblide
    que som de València. Que pareix que siguem un apartheid això ja.

    I després, el de la piscina municipal i tot el que he estat sol·licitant és perquè la convivència familiar, parle de majors,
    xiquets, les famílies que van en creixement, tinguem sociabilitat, tinguem una vida amable. I som part de l''horta i molt
    contents. I tenim una platja de Pinedo al costat, que jo abans em recorde de xicoteta anava caminant amb la meua mare
    i els meus amiguets. Ara no tenim ni opció d''això. Almenys, la piscina municipal és molt important. Perquè fa calor a
    València, veritat? Doncs nosaltres ho passem pitjor que vostés. No hi ha dret. I som de València i volem a València molt.
    Vulga''ns vosté a nosaltres.

    Ja està, ja he acabat.'
  resum_cas: Vecina de La Torre denuncia la nefasta gestión municipal tras la DANA, reclama un centro cultural, escuela infantil
    municipal y piscina municipal para el barrio, y exige que la alcaldesa atienda las necesidades de los ciudadanos.
  resum_val: Veïna de La Torre denuncia la nefasta gestió municipal després de la DANA, reclama un centre cultural, escola
