  idioma_original: castellano
  text_original: "Bon dia. Ante todo quiero dar las gracias por estar aquí en el Ayuntamiento
    de València. Hablo en representación de AEDIVA, también de FOTUR, soy consejo
    de FOTUR. AEDIVA es, para que lo sepan, de pubs y discotecas.\n\nQueríamos decir
    que teníamos ganas de estar aquí y sobre todo que nos dé la oportunidad para el
    tema del carril bus que nos han quitado la intervención de poder estar y sobre
    todo tener esa oportunidad de que nos dé el Sr. Grezzi. Hemos dado registros de
    entradas para poder hablar con él, nos han sido denegados y, bueno, a ver si el
    Sr. Grezzi puede ser capaz de darnos esa oportunidad de hablar.\n\nTambién presentamos
    6.000 firmas sobre el carril bus para que nos dejasen esas plazas de aparcamiento.
    Se ha visto seriamente agravado porque ha sido un 40 % de pérdidas en la restauración
    y en todo el sector de discotecas y pubs. Y no afecta sobre todo a este sector
    sino también afecta al vecino que está en el centro, ese pobre vecino que va a
    coger a las 6 de la mañana el coche y no puede cogerlo porque no tiene esa plaza
    de aparcamiento.\n\nDesde aquí pido a ver si nos puede atender algún día el Sr.
    Grezzi.\n\nEstaba un poquito nervioso, mi primera intervención. Muchas gracias."
