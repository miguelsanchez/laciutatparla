  reason: 'Acta: Dª ****** speaks en representación de la AMPA CP Teodor Llorente; missed by extraction'
  text_original: 'Muchas gracias. Buenos días.


    Simplemente queremos acompañarles en una visita guiada por un edificio de más de 70 años de antigüedad
    destinado a escuela pública, es el colegio Teodor Llorente de Valencia.


    Accedemos por una vieja puerta de madera que bien necesitaría una rehabilitación, bajo un escudo de
    la época franquista que a pesar de la Ley de Memoria Histórica ha sido imposible retirar.


    Después del vestíbulo y del largo pasillo llegamos al distribuidor de acceso al patio, al comedor,
    al salón de actos y a las aulas del primer y segundo piso. Nos damos cuenta de que no hemos visto
    ni un solo extintor de incendios en los más de 30 m recorridos hasta este punto, donde por fin encontramos
    uno. Las luces de emergencia tampoco parecen funcionar.


    Los baños que visitamos son viejos y desaliñados y siempre suele haber alguno inoperativo. El salón
    de actos no tiene salida antipánico a pesar de tener un aforo de más de 300 personas. El almacén del
    comedor es demasiado pequeño. Los sifones de las acequias están al aire, lo que da lugar a la aparición
    periódica de plagas de cucarachas y otros insectos.


    Las aulas del primer y segundo piso tienen un único acceso de entrada y salida, una bonita escalinata
    por la que siempre tropiezan o resbalan los niños al subir y bajar. No queremos imaginar lo que ocurriría
    en caso de incendio. ¿Y si tuviéramos algún alumno discapacitado? Menos mal que la salida al patio
    tiene dos puertas, una de ellas con apertura antipánico pero sabemos que precisamente ésta ha sido
    costeada por el propio colegio con el remanente del comedor –algo menos de 2.000 euros- por falta
    de respuesta del Ayuntamiento de Valencia tras los innumerables intentos que hemos hecho.


    Accedemos al patio que carece de cualquier zona cubierta para protegerse de la lluvia o del fuerte
    sol del verano. Llegamos a las aulas de Infantil, el calor es tal que el propio Ayuntamiento recomendó
    la instalación de aparatos de aire acondicionado que ahora no parece querer costear. En las aulas
    de los otros ciclos el ruido procedente de la calle es insoportable, superando los 75 decibelios en
    horas normales según los datos recogidos por los propios medidores instalados por el Ayuntamiento
    en esta zona ZAS. Hace ya años que alguien tuvo la genial idea de desviar la ruta de autobuses interurbanos
    por la calle Erudito Orellana, precisamente adonde asoman las ventanas de este colegio público.


    En fin, las deficiencias son tantas que nombrar la necesidad clara de una mano de pintura resulta
    casi irrisoria. Lo que queremos es que se nos atienda, que se nos cuide, ya que se trata de la vida
    diaria de muchos niños y niñas valencianos –casi 450- y de la necesidad de recibir una educación de
    calidad en las mejores condiciones. Llevamos más de 10 años peleando para que se nos escuche sin que
    de momento hayamos visto ningún resultado.


    ¿Se imagina este Pleno una desgracia como la del Madrid Arena pero en un colegio público de esta ciudad?
    En sus manos está la posibilidad de evitarlo y la culpabilidad si sucediera.


    Muchas gracias por su atención.'
  date: '2026-10-19'
  finding: E1b-784b8d88c9
  text_val: 'Moltes gràcies. Bon dia.


    Simplement volem acompanyar-los en una **visita guiada** per un edifici de més de 70 anys d''antiguitat
    destinat a escola pública, és el col·legi Teodor Llorente de València.


    Accedim per una **vella porta de fusta** que ben necessitaria una rehabilitació, sota un escut de
    l''época franquista que malgrat la Llei de Memòria Històrica ha sigut impossible retirar.


    Després del vestíbul i del llarg passadís arribem al distribuïdor d''accés al pati, al menjador, al
    saló d''actes i a les aules del primer i segon pis. Ens adonem que **no hem vist ni un sol extintor
    d''incendis** en els més de 30 m recorreguts fins a aquest punt, on finalment en trobem un. **Les
    llums d''emergència tampoc semblen funcionar**.


    Els banyos que visitem són vells i desaliñats i sempre sol haver-hi algun inoperatiu. **El saló d''actes
    no té sortida antipànic** malgrat tindre un aforament de més de 300 persones. L''almacén del menjador
    és massa pequeny. Els sifons de les acèquies estan a l''aire, la qual cosa provoca l''aparició periòdica
    de **plagues de blattes i altres insectes**.


    Les aules del primer i segon pis tenen un **únic accés d''entrada i eixida**, una bonica escalinata
    per la qual sempre els xiquets tropessen o resbalen en pujar i baixar. No volem imaginar el que ocorreria
    en cas d''incendi. ¿I si tinguérem algun alumne discapacitat? Menys mal que la eixida al pati té dos
    portes, una de les quals amb obertura antipànic però sabem que precisament aquesta ha sigut costejada
    pel propi col·legi amb el romanent del menjador –algo menys de 2.000 euros- per falta de resposta
    de l''Ajuntament de València després dels innumerables intents que hem fet.


    Accedim al pati que **manca de qualsevol zona coberta** per a protegir-se de la pluja o del fort sol
    de l''estiu. Arribem a les aules de Infantil, el calor és tal que el propi Ajuntament va recomanar
    la instal·lació d''aparells de climatització que ara no sembla querer costear. En les aules dels altres
    cicles **el soroll procedent del carrer és insoportable**, superant els 75 decibels en hores normals
    segons les dades recollides pels propis mesuradors instal·lats per l''Ajuntament en aquesta zona ZAS.
    Fa ja anys que algú va tindre la genial idea de desviar la ruta d''autobusos interurbans pel carrer
    Erudito Orellana, precisament on s''asomen les finestres d''aquest col·legi públic.


    En fi, les deficiències són tantes que anomenar la necessitat clara d''una mà de pintura resulta quasi
    irrisòria. El que volem és que se''ns atengue, que se''ns cuide, ja que es tracta de la vida diària
    de molts xiquets i xiquetes valencians –quasi 450- i de la **necessitat de rebre una educació de qualitat**
    en les millors condicions. **Portem més de 10 anys peleant** perquè se''ns escolte sense que de moment
    hagem vist cap resultat.


    ¿S''imagina este Ple una **desgràcia com la del Madrid Arena** però en un col·legi públic d''aquesta
    ciutat? En les seves mans està la possibilitat d''evitar-ho i la culpabilitat si ocorrira.


    Moltes gràcies per la seua atenció.'
  resum_cas: El AMPA del colegio Teodor Llorente denuncia graves deficiencias estructurales y de seguridad
    en el edificio de más de 70 años (falta de extintores, luces de emergencia inoperativas, ausencia
    de salidas antipánico, ruido excesivo de 75 decibelios) tras más de una década sin respuesta del Ayuntamiento,
    alertando sobre el riesgo para casi 450 alumnos.
  resum_val: L'AMPA del col·legi Teodor Llorente denúncia greus deficiències estructurals i de seguretat
    en l'edifici de més de 70 anys (manca d'extintors, llums d'emergència inoperatives, absència de sortides
    antipànic, soroll excessiu de 75 decibels) després de més d'una dècada sense resposta de l'Ajuntament,
    alertant sobre el risc per a quasi 450 alumnes.
