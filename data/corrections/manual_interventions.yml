  tipus_entitat: av
  idioma_original: castellano
  reason: Missed speaker introduced as representing the Asociación de Vecinos de Favara.
  text_original: 'Buenas tardes.

    En principio, agradecer el poder hablar a este Ayuntamiento.

    Sra. Alcaldesa, Sres. y Sras. portavoces, concejales y demás miembros de este Ilustre Ayuntamiento
    de Valencia y personas que están escuchando.

    Lo primero es suscribir totalmente las palabras de los compañeros y a continuación paso con mi exposición.

    Algunos, por cuestión de edad, recordamos una escuela pública en la que se formaba para entrar en
    clase mientras se escuchaba una música, que después vimos que no era cordial para todos.

    El tiempo nos hizo ver que allí nació nuestra educación para en este futuro ser mejores ciudadanos
    y con una cierta cultura. Algunos llegamos al instituto y a la universidad, y otros, con trece o catorce
    años, pasaron directamente al mundo laboral. En sus casas faltaba el padre o la madre, quizá los dos.
    Pero lo que desde luego faltaba era la educación y la cultura, que unos gobernantes se empeñaron en
    pensar que era una cuestión de clase. No había dinero para clases de repaso, ni para extraescolares.
    ¿Cómo iba a haberlo si no había para zapatos?

    Represento a los vecinos de Favara, a los vecinos de Patraix y en particular al Colegio Público Santo
    Ángel de la Guarda, de la calle San Vicente, barriada toda ella de trabajadores. Los ciudadanos de
    esa zona venimos a ustedes al igual que nos dirigimos a nuestros padres demandando lo que nos hace
    falta, pues entendemos que sin que nosotros nos pongamos tercos recibiremos de ustedes lo que es mejor,
    lo que en este caso ya tenemos y que la Generalitat nos quiere quitar.

    El Consejo Escolar Municipal de este Ayuntamiento el pasado 13 de enero aprobó por unanimidad rechazar
    las medidas de eliminación del Catálogo de centros docentes de alguna de estas líneas. Como hijos
    de este Ilustre Ayuntamiento no queremos ser ilustres, queremos la educación pública que tenemos,
    una educación sin adoctrinamiento tanto político como religioso, en la defensa de la identidad de
    este pueblo y, por lo tanto, tenemos que rechazar cualquier medida encaminada a su supresión o minoración.

    Estos hijos ‘educativos’ quieren beber y comer de las fuentes de una educación pública, con unos maestros
    y maestras públicas que han pasado unas pruebas de selección para impartirla. No queremos por una
    parte perder unidades y a la larga centros, mientras se aprueban iguales a las pérdidas para la oferta
    privada.

    Sra. Alcaldesa, miembros de este Ayuntamiento en este Pleno, ustedes nos tienen que defender de esta
    grave decisión, de este atropello. Y aún más en estos momentos graves para muchas familias y que yo
    recuerdo de aquella escuela pública aumentaban las ayudas a los comedores, pues en aquellos momentos
    se repartían desayunos y meriendas con la leche, la onza de chocolate y las galletas maría. Y faciliten
    además los libros.

    Adelántense ustedes a esas necesidades, sean padres y madres, nosotros se lo pedimos. Abran la escuela
    pública, mantengan la escuela pública porque los hijos de hoy, los padres de hoy nos acordaremos de
    todos ustedes mañana y el futuro lo tienen en sus manos. El futuro es público, de la escuela pública,
    de la gente. Para que toda la gente en este país tenga igualdad y tenga capacidad para poder en un
    mañana tener un futuro. De ustedes depende.

    Muchas gracias.'
  date: '2026-10-19'
  finding: E1b-9d8cac1065
  text_val: 'Bona tarde.

    En principi, agraïr el poder parlar a aquest Ajuntament.

    Sra. Alcaldessa, Sres. i Sres. portaveus, regidors i demés membres d''aquest Il·lustre Ajuntament
    de València i persones que estan escoltant.

    Lo primer és subscriure totalment les paraules dels companys i a continuació passe amb la meva exposició.

    Alguns, per qüestió d''edat, recordem una **escola pública** en la que es formava per a entrar en
    classe mentre s''escoltava una música, que després varem veure que no era cordial per a tots.

    El temps ens va fer veure que allí va néixer la nostra **educació per a ser millors ciutadans** i
    amb una certa cultura. Alguns varem arribar a l''institut i a la universitat, i altres, amb tretze
    o catorze anys, van passar directament al món laboral. En les seues cases faltava el pare o la mare,
    potser els dos. Però lo que des de luego faltaba era **l''educació i la cultura**, que uns governants
    es van empenyen a pensar que era una qüestió de classe. No hi havia diners per a classes de repàs,
    ni per a extraescolars. ¿Com havia de haberlo si no hi havia per a sabates?

    Represente als veïns de Favara, als veïns de Patraix i en particular al **Col·legi Públic Santo Ángel
    de la Guarda**, del carrer San Vicente, barriada tota ella de treballadors. Els ciutadans de eixa
    zona venim a vostès al igual que ens dirigim als nostres pares demanant lo que ens fa falta, pues
    entenem que sense que nosaltres ens pongem tossuts rebrem de vostès lo que és millor, lo que en este
    cas ja tenim i que la Generalitat ens vol treure.

    El **Consell Escolar Municipal** d''aquest Ajuntament el passat 13 de gener **va aprovar per unanimitat
    rebutjar** les mesures d''eliminació del Catàleg de centres docents d''alguna d''estas línies. Com
    a fills d''aquest Il·lustre Ajuntament no volem ser illustres, volem **l''educació pública que tenim**,
    una educació **sense adoctrinament polític ni religiós**, en la defensa de la identitat d''este poble
    i, per tant, tenim que **rebutjar qualsevol mesura encaminada a la seua supressió o minorament**.

    Estos fills ''educatius'' volen beure i menjar de les fonts d''una educació pública, amb uns mestres
    i mestres públiques que han passat unes proves de selecció per a impartirla. No volem per una part
    **perder unitats i a la llarga centres**, mentre s''aproven iguals a les pèrdues per a l''oferta privada.

    Sra. Alcaldessa, membres d''aquest Ajuntament en este Ple, **vostès ens han de defensar** d''esta
    greu decisió, d''este atropello. I encara més en estos moments greus per a moltes famílies i que jo
    recordo d''aquella escola pública **augmentaven les ajudes als menjadors**, pues en aquells moments
    es repartien desayunos i meriendas amb la llet, l''onça de xocolata i les galetes maría. I faciliten
    a més els llibres.

    Adelanten-se vostès a eses necessitats, siguen pares i mares, nosaltres se li pedem. **Obrin l''escola
    pública, mantinguen l''escola pública** perquè els fills de hui, els pares de hui ens acordarem de
    tots vostès demà i el futur ho tenen en les seues mans. **El futur és públic**, de l''escola pública,
    de la gent. Per que tota la gent en este país tinga igualtat i tinga capacitat per a poder en un demà
    tindre un futur. De vostès depén.

    Moltíssimes gràcies.'
