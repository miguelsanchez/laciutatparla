  text_val: 'Bon dia, gràcies. El meu nom és [***] i tinc l''honor de representar a persones de diferents
    col·lectius socials: Assemblea de Aturats i Precaris de València, Xarxa de Solidaritat Popular, Plataforma
    d''Afectats per les Hipoteques, Iaioflautas, Assemblea d''Aturats d''Orriols i Assemblea del 15M d''Algirós.


    Nosaltres ens reunim davant de la porta principal de la casa del poble d''esta ciutat tots els dilluns,
    d''onze a una, des del mes de setembre, sense importar el temps que faça, amb el nom de **Cadires
    contra la fam** per a demanar **un lloc de treball digne per a tots** que hauria d''estar garantit
    segons la Constitució.


    **La falta de treball és la causa principal de tots els problemes**, com imaginem ja saben. Amb treball
    no hi hauria **un de cada tres xiquets passant fam**. Vostés saben què és passar fam? Vostés saben
    què és que els seus fills passen fam? Per què ho consentixen? Amb treball no hi hauria **tants desnonaments**.
    Vostés saben què és viure al carrer? Vostés saben què ha de dir un pare o una mare a un fill quan
    se l''emporten a viure sota un pont? Per què deixen que passe?


    Amb treball les cases no serien nevers, amb treball es pot pagar a la companyia de l''aigua perquè
    no et tallen **eixa necessitat vital**. Per què no ho eviten? **Vostés poden prendre mesures** perquè
    ningú es quede sense aigua i sense energia, **mesures per a eximir de taxes i impostos** a les persones
    i a les families que no puguen pagar-los. **Vostés poden elaborar un pla d''ocupació pública** que
    gestione directament els servicis públics. Vostés han d''ocupar-se que a totes les persones amb minusvalies
    els arribe la seua ajuda sense més retards.


    Com som conscients que si no es reparteix el treball mai hi haurà treball per a tots i que a este
    sistema li interessa tindre treballadors aturats per a utilitzar-los com a arma llançadissa contra
    els treballadors ocupats, demanem **una renda per a totes les persones desocupades** que siga com
    a mínim **el salari mínim interprofessional**. Una renda amb la qual poder fer front a **les necessitats
    bàsiques** a les quals qualsevol persona ha de tindre accés.


    Senyores, senyors. Hem vingut fins ací perquè creiem que encara els queda una mica de cor. Perquè
    ens negem a acceptar el que la realitat ens diu de vostés i és que els dóna igual el que li passa
    a tants xiquets, a tantes families i a tantes persones aturades que viuen condemnades a la misèria
    i a la por. Demostren al seu poble que s''equivoca qui pensa que vostés només es preocupen dels seus
    culs.


    Moltes gràcies.'
