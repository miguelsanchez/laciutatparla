- id: 2018-12-20-101
  pleno_id: '2018-12-20'
  ordre: 5
  intervinient: Lluís Mira i Borderia
  entitat: Associació de Veïns i Comerciants Amics del Carme
  tipus_entitat: av
  idioma_original: valenciano
  text_original: 'Bon dia.

    Senyores i senyors, podem assegurar-los que les veïnes i els veïns del Carme se sentiran més segurs
    i molt més tranquils després de l’aprovació de la declaració que hui es debatrà. Aquestes mesures
    proposen que el barri mantinga i fins i tot recupere el seu caràcter veïnal, de barri de tota la vida,
    que ara està seriosament amenaçat, entre altres coses, pel creixement imparable del nombre de locals
    d’hostaleria i la sobreocupació de carrers i places per a la seua explotació comercial.


    Quan es va iniciar aquest procediment estava justificada la seua tramitació. El pas del temps no ha
    fet més que reafirmar la seua necessitat per a garantir al veïnat el dret a la intimitat i a la lliure
    mobilitat pels carrers. Si s’haguera sigut més diligent en el compliment de les seues mesures, no
    hauria sigut necessari ratificar-les amb major duresa.


    El barri té un gran valor patrimonial i en ell es donen les celebracions més importants. És un lloc
    amb encant, per a passejar i gaudir. Només per aquestos motius cal la seua protecció i preservació.
    Fins i tot, el propi Ajuntament en els seus informes reconeix que Ciutat Vella es troba al límit de
    convertir-se en un gran centre comercial i no en un lloc per a viure. Què s’ha fet sobre aquest tema
    aquestos anys?


    Tant de bo que els treballs empresos pel Sr. Galiana per a reduir l’excessiva ocupació de la via pública
    hagueren sigut eficaços. Ens preguntem si tots hem fet prou per a evitar arribar a aquesta situació,
    però els informes sonomètrics donen fe que quan es retiren les terrasses els indicadors del soroll
    recuperen els seus valors normals. Ens agrade o no, hi ha una indiscutible relació causa-efecte que
    justifica la ZAS.


    Quan en la plaça del Negret únicament existia el pub del mateix nom, amb la seua mitja dotzena de
    taules, quan no existia la plaça del Tossal i al carrer de la Bosseria encara es respirava un aire
    comercial, les terrasses no contribuïen significativament a la problemàtica del soroll. Però aquesta
    situació ha canviat i molt. El fenomen de les terrasses és ara nociu per la seua proliferació indiscriminada
    i l’extensió del fenomen a nombrosos carrers i places del Carme.


    La ZAS no soluciona tots els problemes, per descomptat, però sens dubte donarà un respir. Ens ajudarà
    a creure que el Carme té encara una oportunitat per a ser un barri amb veïns i xiquets corrent pels
    seus carrers.


    Durant els llargs anys de la seua tramitació han aparegut nous i greus problemes com l’hotelització
    del barri, la dràstica substitució d’habitatges per apartaments turístics i la desaparició dels comerços
    de proximitat, però estem satisfets que per fi la ZAS siga ferma.


    Senyores i senyors regidors, els demanem a tots vostés el vot favorable per a aquesta declaració que
    volem que siga un punt de partida, un punt d’inflexió en la recuperació de Ciutat Vella com un barri
    viu, però també habitable. Un barri on visca gent amb arrelament capaç de conservar-lo, ja que és
    la memòria viva de la ciutat de València.


    Gràcies.'
  reason: 'Acta: 1r. Intervé el Sr. Lluís Mira i Borderia, en representació de l’Associació d’Amics del
    Carme; missed by extraction.'
  date: '2026-10-20'
  finding: E1b-d3e0341fcd
  text_cas: 'Buenos días.


    Señores y señores, podemos asegurarles que los vecinos y las vecinas del Carme **se sentirán más seguros
    y mucho más tranquilos** después de la aprobación de la declaración que hoy se debatirá. Estas medidas
    proponen que el barrio **mantenga e incluso recupere su carácter vecinal**, de barrio de toda la vida,
    que ahora está **seriamente amenazado**, entre otras cosas, por el **crecimiento imparable del número
    de locales de hostelería** y la sobreocupación de calles y plazas para su explotación comercial.


    Cuando se inició este procedimiento estaba justificada su tramitación. El paso del tiempo no ha hecho
    más que reafirmar su necesidad para **garantizar al vecindario el derecho a la intimidad y a la libre
    movilidad** por las calles. Si se hubiera sido más diligente en el cumplimiento de sus medidas, no
    hubiera sido necesario ratificarlas con mayor dureza.


    El barrio tiene un **gran valor patrimonial** y en él se dan las celebraciones más importantes. Es
    un lugar con encanto, para pasear y disfrutar. Solo por estos motivos cabe su protección y preservación.
    Incluso, el propio Ayuntamiento en sus informes reconoce que Ciudad Vieja **se encuentra al límite
    de convertirse en un gran centro comercial** y no en un lugar para vivir. ¿Qué se ha hecho sobre este
    tema estos años?


    Ojalá que los trabajos empeñados por el Sr. Galiana para **reducir la excesiva ocupación del espacio
    público** hubieran sido eficaces. Nos preguntamos si todos hemos hecho lo suficiente para evitar llegar
    a esta situación, pero los **informes sonométricos** dan fe de que cuando se retiran las terrazas
    los indicadores del ruido recuperan sus valores normales. Nos guste o no, hay una **indiscutible relación
    causa-efecto** que justifica la ZAS.


    Cuando en la plaza del Negret únicamente existía el pub del mismo nombre, con su media docena de mesas,
    cuando no existía la plaza del Tossal y en la calle de la Bossería aún se respiraba un aire comercial,
    las terrazas no contribuían significativamente a la problemática del ruido. Pero esta situación ha
    cambiado y mucho. El fenómeno de las terrazas es ahora **nocivo por su proliferación indiscriminada**
    y la extensión del fenómeno a numerosas calles y plazas del Carme.


    La ZAS no soluciona todos los problemas, por supuesto, pero **sin duda dará un respiro**. Nos ayudará
    a creer que el Carme tiene aún una oportunidad para ser **un barrio con vecinos y niños corriendo
    por sus calles**.


    Durante los largos años de su tramitación han aparecido nuevos y graves problemas como **la hotelización
    del barrio**, la drástica sustitución de viviendas por apartamentos turísticos y la desaparición del
    comercio de proximidad, pero estamos satisfechos de que **por fin la ZAS sea firme**.


    Señores y señores concejales, les pedimos a todos ustedes el voto favorable para esta declaración
    que queremos que sea **un punto de partida, un punto de inflexión** en la recuperación de Ciudad Vieja
    como **un barrio vivo, pero también habitable**. Un barrio donde viva gente con arraigo capaz de conservarlo,
    ya que es la memoria viva de la ciudad de Valencia.


    Gracias.'
