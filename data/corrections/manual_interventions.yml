  entitat: Médicos del Mundo
  tipus_entitat: ong
  idioma_original: castellano
  text_original: 'Buenos días. Señora alcaldesa; señoras y señores concejales.


    Muy brevemente. Si la prostitución es un problema de salud social, además de un riesgo para la salud
    de las mujeres que la ejercen, que se ven obligadas a su ejercicio y son 700 según las cifras que
    nosotros en nuestras consultas de atención hemos constatado durante el ejercicio de 2012, ¿qué tipo
    de tratamiento aportaría esta Ordenanza? ¿Sería un tratamiento etiológico?, ¿un tratamiento causal?
    ¿Un tratamiento como funcionan los antibióticos que intentan eliminar la causa del problema? Si esta
    Ordenanza hubiera incluido elementos contra la trata o contra el comercio podríamos considerarlo así.
    ¿Es un tratamiento paliativo?, ¿que elimina el dolor?, ¿que mejora el sufrimiento como lo hace el
    paracetamol para el dolor de cabeza? Tampoco.


    Esta Ordenanza no mitiga el sufrimiento o la vulnerabilidad de las mujeres que se encuentran en el
    ejercicio de la explotación, en el ejercicio de la prostitución. ¿Es un tratamiento quirúrgico? No,
    tampoco. ¿En qué tipo de tratamiento nos estamos moviendo?, ¿qué es lo que estamos viendo? Intuimos,
    pensamos que es un tratamiento exclusivamente estético, un tratamiento que va a funcionar –como decía
    antes mi compañera- alejando a estas mujeres de los centros y haciendo más vulnerables, en más situación
    de riesgo para su salud, con más posibilidades de ser explotadas, de ser agredidas, de ser violentadas
    que la situación en que se encuentran ahora.


    Por tanto, en nuestra opinión, animamos a las fuerzas políticas, animamos a todos ustedes, a que incorporen
    en la fase de alegaciones elementos que hagan que esta Ordenanza tenga una ambición mayor, una ambición
    terapéutica real, una ambición de incorporar elementos que mejoren la capacidad de este colectivo
    de decidir, de ser empleables, de formarse, de abandonar o de continuar en su actividad, de disminuir
    su riesgo de enfermar, de mejorar la coordinación entre instituciones sanitarias, sociales, a incluir
    todo lo que ahora mismo adolece dejando este documento como una mera expresión de intención estética.


    Muchas gracias.'
