  date: '2026-10-19'
  finding: E1b-488a41e0e6
  text_val: 'Sra. Alcaldessa, Sres. i Srs. Regidors.

    Amb gran sorpresa, hem rebut els veïns del barri del Grau la notícia que la cessió de la dàrsena a
    la ciutat per part del Port es convertiria en **un nou i dels més bells barris de la ciutat**. Sense
    que el nostre barri, El Grau, amb **més de 700 anys d''història compartida amb el port**, ni tan sols
    fora mencionat.

    **La famosa deuta que es té amb els poblats marítims**, tantes vegades repetida per vosaltres, amb
    motiu dels grans projectes, soferts per nosaltres: Copa de Amèrica, Fórmula 1, PAI del Grau etc. va
    camí de convertir-se una vegada més en **l''oblit i l''abandó**.

    Tenim, ja no hi ha excuses, **l''última oportunitat de connectar la ciutat i el mar**, de forma satisfactòria
    per al conjunt dels ciutadans. Ja el 1.997 la Sra. Alcaldessa amb motiu de l''exposició celebrada
    a les drassanes "El port de València i el seu entorn urbà" ens parlava de **posar les bases per unir
    aquest conjunt**, la façana marítima, amb la ciutat de València. Han passat 16 anys i poc s''ha fet
    de verdad en aquest sentit.

    És el moment que els barris de **Natzaret, El Grau, Cabanyal i Malvarrosa deixaren de ser el Bronx
    de la ciutat** i finalment es convertisquen en **l''enllaç natural de la resta de la ciutat amb el
    mar**, com ha succeït en altres ciutats marítimes. Açò sí que crearía **riquesa, social i també turística
    i econòmica**.

    **No pot prevaler una vegada més la lògica econòmica**. Tenim l''experiència de la Copa de Amèrica
    que una vegada celebrada, i estem parlant de fa 6 anys, convertí un espai públic de gran valor simbòlic
    per als veïns, en un lloc abandonat i en desús. Ens disseren que l''ocupació d''aquest espai era efímera,
    que una vegada celebrada la Copa, reverteria de nou almenys, com estava. **Ens van mentir** i ens
    han deixat tot aquest temps, sense ni tan sols poder veure el mar. Aquesta sí que és la realitat.
    I aquest és el vostre esperit democràtic.

    Se''ns parla del gran potencial econòmic, turístic i social de la dàrsena; però nosaltres destacarem
    sobretot el seu **potencial social**. A l''hora de parlar del rendiment, mai es posen xifres en euros
    al **benestar, a la qualitat de vida dels ciutadans**, etc.

    **No entenem que una minoria, per molt adinerada i luxosa que siga, s''apropie d''una part de la ciutat**,
    en detriment de la majoria. No és veritat que açò siga bo per als ciutadans, per a València i vosaltres
    ho sabeu i ho permeteu.

    **Volem participar**, junt amb tots els demés sectors, en desenvolupar el pla d''usos de la dàrsena.
    No entenem la nostra participació i gaudi com a quelcom passiu. No volem que **aquest espai públic
    es convertisca només en un nou centre comercial d''oci i consum**. Ja n''hi ha molts en la ciutat
    i no va a revaloritzar, sinó devaloritzar aquest espai.

    Sra. Alcaldessa, per favor, **no us oblideu d''incloure en esse tren turístic que van a llicitar**,
    la inclusió d''un itinerari pels verdaders barris marítims. No ho fareu. Tornaran a cobrir amb toldes
    el nostre barri, com varen fer en la Fórmula 1.

    Gràcies per la vostra atenció.'
  resum_cas: La Asociación de Vecinos del Grau-Port denuncia que el proyecto de desarrollo de la dársena
    del Puerto ignora por completo la historia y la aportación de los barrios marítimos, especialmente
