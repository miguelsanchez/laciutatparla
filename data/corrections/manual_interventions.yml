    per la convivència exigim al nostre Ajuntament, com a principal responsable, que **garantisca el compliment
    de la legalitat** i que al temps promoga un major civisme amb campanyes de sensibilització fetes en
    col·laboració amb altres entitats, inclús amb el gremi de hostalers. Segur que estan d''acord, al
