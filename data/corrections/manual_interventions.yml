  entitat: Asociación Vecinal Pla Del Remei-Gran Via
  tipus_entitat: av
  idioma_original: castellano
  text_original: 'Buenas tardes. Represento a la Asociación de Vecinos Pla del Remei-Gran Vía.


    En relación a la moción presentada de la calle Colón por el Partido Popular y en cuanto a la calle
    Colón creemos desde la asociación que no está funcionando correctamente y ello por diversos motivos.
    Como es sabido, la calle Colón es una de las arterias principales de la ciudad debido a su céntrica
    situación. Está llena de comercios, oficinas, así como viviendas de uso residencial. Esto provoca
    consecuentemente que haya un gran número de viandantes que transitan por la misma y que sea muy elevado
    tanto el paso como el destino de los viandantes. Es el eje comercial urbano más grande de la Comunidad
    Valenciana. Además, hay otros usos públicos que están conviviendo con la calle Colón, cerca de ella,
    como por ejemplo la cercana plaza de Toros, supermercados en calles adyacentes, como Mercadona, Consum,
    entidades bancarias, etc.


    Y nosotros lo que pretendemos es que se pueda lograr la convivencia entre los diferentes usos tanto
    comerciales, oficinas como residenciales. Y para ello es necesario plantear formas de movilidad que
    sean acordes y justas para todos los usuarios, no dejando de lado a unos para favorecer a otros. También
    hay que señalar que una de las cuestiones que nos hemos visto perjudicados todos los vecinos del barrio
    es que desde que se decidió desviar las rutas de autobuses que circulaban por el centro y que ha generado
    un aumento del tránsito de hasta nueve líneas de la EMT por la calle Colón, ha incrementado muchísimo
    el tráfico y ha supuesto un incremento asimismo de la contaminación en esa zona. También consideramos
    que el paso de vehículos privados también es necesario y así también se ha puesto de manifiesto incluso
    en el estudio que encargó este consistorio a una empresa, creo que era de Barcelona, llamado Diagnosi
    propositiva per a la millora de la mobilitat activa. Así también está contemplado en diferente normativa
    urbanística vigente, tanto en el Plan General como, por ejemplo, en el Plan de Movilidad Urbana Sostenible.


    Consideramos que es necesario el tránsito privado porque además de pertenecer la calle Colón al primer
    anillo de la ciudad y ser la lógica ronda interior tiene dos aparcamientos públicos que de elevada
    demanda que son el aparcamiento de la Seguridad Social y el aparcamiento de Mediamarkt, así como otros
    aparcamientos como El Corte Inglés en las calles transversales, que funcionan perfectamente para permitir
    aparcar en el centro a muchos ciudadanos que quieren venir al centro y con ello favorecen la riqueza
    de todo el barrio, existiendo además otros 21 aparcamientos privados pertenecientes a edificios de
    viviendas en la misma calle.


    La ronda interior es una vía circular de un solo sentido que debe preservar su continuidad, pero que
    paradójicamente se interrumpe incomprensiblemente en un solo punto: los escasos metros que hay entre
    Porta de la Mar y el cruce con Conde Salvatierra y Cerdán de Tallada. Un único punto que genera una
    gran confusión al conductor ya que los vehículos que desean así ir a la calle Colón tienen que atravesar
    por Grabador Esteve, Sorní y seguir por Conde Salvatierra hasta la calle Colón. O peor aún, desviarse
    hacia la Gran Vía Marqués del Turia, que en estos últimos años ha sufrido un aumento de 8.000 coches
    diarios, colapsándose toda la Gran Vía en horas punta, ya que es la calle urbana más transitada de
    la ciudad, con 62.000 vehículos diarios, tan solo por detrás de la avenida Cataluña y la de Pío XII.
    No podemos cerrar los ojos ante el gravísimo impacto ambiental que esto supone y la Gran Vía Marqués
    del Turia está, efectivamente, con unos niveles de emisiones muy importantes. Y todo esto ante las
    puertas de la entrada en vigor de la nueva ordenanza baja de emisiones.


    Nosotros, nuestra primera reclamación que haríamos al consistorio sería la reapertura al tráfico privado
    desde Porta de la Mar y se nos ha justificado el cierre para evitar incidencias con los autobuses
    de la EMT que pasan por Porta de la Mar. Pero realmente es un elemento disuasorio de atravesar Colón
    como calle de paso, que perjudica enormemente a la Gran Vía Marqués del Turia como ya hemos explicado.
    Nuestra segunda reclamación es la eliminación de uno de los dos carriles bus-taxi. Es innecesario
    tener dos carriles bus taxi. Los que vivimos ahí lo hemos comprobado. Los autobuses siempre van uno
    detrás de otro, nunca se adelantan. Y los taxis pueden circular detrás de los autobuses. O en caso
    de necesidad de adelantarlos, pueden hacerlo ocupando provisionalmente los taxis el carril del tráfico
    privado y no pasaría nada, como en el resto de la ciudad. El segundo carril les digo que está permanentemente
    vacío, como en el resto de la ciudad. El segundo carril, como decía, está permanentemente vacío, mientras
    hay colas insufribles en el carril privado por la presencia de tres fatídicos puntos negros, todos
    ellos giros a la izquierda, que son Conde Salvatierra, Hernán Cortés y Pizarro. No sé si habrán tenido
    oportunidad de pasar por esas calles, pero es insufrible llegar y girar por esas calles. La solución
    es muy sencilla, eliminar el segundo carril bus-taxi y repartir su espacio entre el resto.


    Por otro lado, agradecemos la oportunidad de expresarnos en este pleno ante todos ustedes y al Partido
    Popular por comprometerse a contar con nosotros para colaborar en la futura reforma de la calle Colón,
    así como al resto de partidos, poniéndonos a su disposición para si quisieran hacernos alguna propuesta
    para el futuro.


    Muchas gracias.'
  reason: Acta introduces the Sra. ****** en representació de l'Associació Veïnal Pla del Remei – Gran
