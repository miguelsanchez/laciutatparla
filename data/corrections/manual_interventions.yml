- id: 2022-10-31-101
  pleno_id: '2022-10-31'
  ordre: 4
  intervinient: '[***]'
  entitat: Associació de Veïns AVEGAS
  tipus_entitat: av
  idioma_original: castellano
  text_original: 'Buenos días.


    Señor Ribó, quiero aprovechar estos minutos que tengo para pedirle un favor. Organice entre los múltiples
    asesores que tiene un equipo que esté en contacto con las asociaciones de vecinos para conocer in
    situ las necesidades de las mismas, con lo cual se evitarían muchos de los problemas que se originan.
    En mi barrio está la calle Xàbia en la cual en su día se plantaron 24 palmeras, las cuales tenían
    que servir para que esta calle fuese un espacio ecológico y agradable. Pero por no poner en su momento
    los aros antirratas, las palmeras fueron ocupadas por las mismas creando muchos problemas a los vecinos
    ya que algunas de ellas trepando por la fachada llegaron a introducirse en varios pisos. El tema fue
    denunciado por el Partido Popular y se publicó en distintos medios de comunicación, quedando resuelto
    el problema de las ratas trepadoras. Ahora seguimos contando con su presencia, al igual que con una
    fuerte plaga de cucarachas, pero sobre el asfalto. Hemos desocupado a los roedores, pero las palmeras
    necesitan una poda urgente pues las ramas tocan el suelo, lo cual es molesto para los peatones y una
    diversión para los gamberros que soportamos todos los largos fines de semana, que utilizan esta zona
    para sus botellones y juergas, terminan arrancando las ramas a las palmeras junto con otras tropelías,
    sin que haya ninguna presencia policial que lo impida o lo sancione. Otro tema que se podría solucionar
    es la recogida de las naranjas de los árboles ornamentales antes de que caigan, pues aparte de la
    suciedad que originan es un peligro para los viandantes y también para los usuarios del carril bici.


    Y por último, pues no hay más tiempo, pedirle que preste más atención a los jardines de Blasco Ibáñez,
    que son los más emblemáticos y los peores dotados de la ciudad ya que no invierten en ellos. Manténganlos
    limpios retirando las miles de hojas muertas que los cubren durante todo el año, afectando también
    a la calzada y aceras colindantes de la zona. En fin, señor Ribó, le he expuesto solo tres demandas,
    pero como usted bien debe de saber son muchas más. y variados los problemas y necesidades de todos
    los barrios. Pero lo más urgente actualmente es eliminar las plagas de ratas, cucarachas y mosquitos
    que invaden la ciudad. Por lo tanto, no les conceda usted el estatus de okupas y extermínelas.


    Muchísimas gracias.'
  reason: Acta introduces the speaker 'en representació de l'Associació de Veïns AVEGAS'; not extracted.
