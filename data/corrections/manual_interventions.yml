  text_val: 'L''AMPA del CEIP Eliseo Vidal vol manifestar la seua **indignació i rebuig** a la **cessió
    de sòl públic** en el districte de Patraix, a pocs metres de les instal·lacions del nostre col·legi.
    De manera general ens oposem també a **qualsevol cessió de sòl públic a la iniciativa privada** quan
    encara no han estat satisfetes les carències, ben conegudes per les autoritats educatives, que el
    sistema públic té en el nostre districte. Ens oposem en el fons de la qüestió perquè açò suposa **un
    canvi radical del model educatiu** que opta pels concerts privats i arrinconada l''educació pública.
    Ens oposem també en les formes perquè **no ens consta que haja habut cap comunicació, reunió o consulta
    prèvia** amb les parts més interessades en solucionar les carències educatives del nostre sector.
    Considerem que açò és **una ofensa i un menyspreu** després de molts anys d''espera i reivindicació
    del **compromís polític de construcció de l''IES Nou Patraix**, institut públic, ja present en el
    mapa escolar de 1996. Esta mesura obliga a matricular als nostres fills **en un centre privat concertat**
    si volem optar a realitzar l''ESO en el nostre entorn.


    Segons les informacions publicades, el nou projecte pretén construir un **centre privat concertat
    amb unes 1300 places**, que abarcarà des de infantil fins a batxillerat. En comparació, el CEIP Eliseo
    Vidal, a punt de complir trenta anys, té adscrit un IES públic fora del seu sector educatiu, allunyat
    del seu entorn (el IES 26 Misericòrdia) per les carències del districte. Recordar, a més, que el **IES
    Juan de Garay està a doble torn** per aquestes carències. A açò hem d''afegir les **necessitats d''inversió
    en actualització i manteniment** d''un col·legi amb diverses dècades d''història, l''**angoixa econòmica
    per la falta de finançament públic**, els deutes acumulats amb l''empresa que gestiona el menjador,
    etc.


    Ant esta situació tan desequilibrada, el **futur de col·legis com el CEIP Eliseo Vidal** pareix inevitablement
    abocat a la seua desaparició, o pitjor encara, a la **marginació d''aquells que no puxen costejar-se
    l''opció privada**. El desequilibri que es va produir entre l''oferta pública i la privada és obvi
    i els pares seran empesos cap a l''opció privada. Açò és, segons la conselleria d''educació, fomentar
    la competència "sana i lleial" entre col·legis i models educatius. Desde el nostre punt de vista açò
    és **obrir el camí a la segregació soci-econòmica de l''alumnat**.


    La situació econòmica de la generalitat no pot servir d''excusa per **hipotecar durant 75 anys els
    nostres terrenys** i amb ells **el nostre dret a una educació pública i de qualitat**. I la situació
    de màxima debilitat dels serveis públics no s''ha d''utilitzar per justificar la seua transformació
    en negocis privats. L''Ajuntament de València està sent còmplice d''este procés ignorant les necessitats
    reals i urgents dels seus veïns. Però este interès per la iniciativa privada no ho estén a la familiar.
    Estudis independents d''associacions de consumidors afirmen que **el cost dels col·legis concertats
    per a les famílies és superior en un 70%** enfront del cost dels col·legis públics. És una hipocresía
    defensar la baixada d''impostos mentre les mesures privatitzadores augmenten les despeses familiars
    ja de per si agreujades per la reducció d''ajudes per a menjador, llibres o transport. Esta és una
    de les raons per les quals els col·legis concertats acaben segregant l''alumnat en funció del nivell
    de renda.


    L''AMPA del CEIP Eliseo Vidal també mostra el seu **rebuig a la mesura del "districte escolar únic"**
    que agrupa en quatre àrees els 19 districtes educatius. Mesura venuda com un **"augment de la llibertat
    d''elecció per als pares"** però que unida a la falta d''inversió en l''escola pública facilita el
    **èxode cap a la concertada**. En poc temps seran els col·legis més demanats els que filtren els alumnes
    que més convinga als seus interessos. Açò va en direcció contraria al **caràcter integrador que ha
    de tindre l''educació pública**. Simultàniament, al agrupar els districtes els desequilibris en l''oferta
    de places en algunes àrees s''han solucionat de manera fictícia. Amb esta mesura ens temem que algunes
    famílies hauran de desplaçar-se encara més lluny del seu entorn i que alguns col·legis veuran reduïda
    la seua oferta i inclús hauran de vore com es tanquen les seues aules.


    Desde l''AMPA del CEIP Eliseo Vidal sol·licitem que **s''anul·le la cessió de sòl públic** d''ús educatiu
    en el districte de Patraix per a la construcció d''un centre educatiu privat i que **s''impulse de
    nou la construcció de l''IES Nou Patraix** planejat i compromés des de fa 17 anys.'
  resum_cas: El AMPA del CEIP Eliseo Vidal rechaza la cesión de suelo público en Patraix para construir
    un centro privado concertado, por considerar que supone un cambio radical del modelo educativo, incumple
