- id: 2014-07-25-101
  pleno_id: '2014-07-25'
  ordre: 2
  intervinient: '[***]'
  entitat: Asociación de Vecinos del Cabanyal-Canyamelar
  tipus_entitat: av
  idioma_original: castellano
  reason: 'Acta: ''A continuación, interviene D. ******, en representación de la Asociación de Vecinos
    del Cabanyal-el Canyamelar'' - speech missed by script 05.'
  text_original: 'Bon dia. Sra. Alcaldesa, Sres. Concejales.


    Difícil nos lo han puesto desde Europa Nostra -de la mano de su presidente, el Sr. [***]- para ahondar
    en la crítica de su PEPRI, pero lo vamos a intentar desde nuestra modesta aportación si el escaso
    tiempo del que disponemos lo permite.


    Sra. Alcaldesa, nos obliga usted a pasar de nuevo por esta situación. Pero en este momento no partimos
    de cero, el punto de partida sobre el que usted dice haber alcanzado un pacto político es que el PEPRI
    que usted aprobó hace 15 años produce el delito de expolio por más que en la memoria justificativa
    de su nueva propuesta su arquitecto redactor se atreva a decir que la Orden Ministerial lo dice de
    forma inargumentada. Si nos deja, en dos hojas vamos a tratar de explicárselo.


    Desde la Asociación de Vecinos del Cabanyal-el Canyamelar entendemos que asumir su encargo tiene que
    ser un trabajo de alto riesgo para un profesional. Algo que explica la Orden Ministerial de forma
    tan evidente no ha querido ser entendido por ustedes: ‘El Plan Especial, lejos de encontrarse presidido
    por la finalidad de protección del conjunto histórico, siempre ha tenido por objetivo fundamental
    otro tipo de fines de carácter diverso, como pueden ser el urbanístico, social o económico, cuya legitimidad
    si bien no se cuestiona lo cierto es que ponen en peligro la conservación de los valores que motivaron
    la protección de dicho conjunto histórico’.


    En la fase de avance ya se llegó a justificar por sus redactores que ‘cuanto mayor era la afección
    de cada alternativa, menor era el número de edificios protegidos. En general, la diferencia entre
    el número de edificios protegidos del PG y el de las propuestas de avance estaba directamente asociado
    a las operaciones de reforma interior del barrio’. Es decir, que si hay que desproteger edificios
    porque resultan incompatibles con la prolongación, se desprotegen y ya se pueden derribar. Eso es
    expolio.


    Con ese criterio se redactó su PEPRI expoliador y los 772 edificios protegidos por el PGOU dejaron
    de ser un obstáculo. 196 de ellos incluida la Lonja, pasaron a ser ignorados con la finalidad del
    derribo, a pesar de que entre ellos había 114 que el propio Plan consideraba que tenían interés arquitectónico.


    Una vez aprobado el PEPRI y habiéndose denunciado su presunta ilegalidad, los técnicos redactores
    se atrevieron de nuevo a argumentar que ‘aquellos inmuebles protegidos que no se incorporaron al nuevo
    Catálogo del PEPRI eran exclusivamente los que se veían afectados por la prolongación de la Av. Blasco
    Ibáñez. Fuera de ese ámbito de afectación se habían catalogado absolutamente todos los inmuebles que
    mantienen un interés arquitectónico’.


    De nuevo esta expoliadora afirmación confirmaba su convencimiento de que la protección del conjunto
    se debía supeditar a otro tipo de fines y que se derribarían los 196 edificios protegidos por resultar
    incompatibles con la reforma interior que supone la prolongación.


    Con esa voracidad destructiva era fácil concluir, como lo hace la Orden ministerial, que: ‘Las determinaciones
    del PEPRI suponen una alteración del conjunto histórico del Cabanyal que desfiguran el mismo hasta
    el punto de hacer perder a éste su propio carácter en beneficio de una determinada opción de trazado
    urbanístico incompatible con la protección del conjunto histórico’.


    En estos momentos nos encontramos con que transcurridos más de cuatro años desde que se aprobó la
    Orden ministerial, en el momento en que por fin usted asume como irremediable la necesidad electoral
    de cumplirla, se descuelga con una nueva propuesta -la segunda en 15 días- con la que dice haber alcanzado
    un pacto político con el que dar por adaptado el PEPRI.


    Una propuesta que insiste en los mismos errores de partida convirtiendo en una caricatura su renovado
    esfuerzo por mantener la trama histórica, entendiéndola como la huella del solar que dejan los edificios
    protegidos una vez son derribados y manteniéndola con ridículos parterres en beneficio del que continua
    siendo su irrenunciable objetivo de la prolongación, tal como usted misma se ha encargado de enfatizar.


    Su empeño es mantener los 48 m entre fachadas, insinuando que está dispuesta a negociar el resto ante
    el Ministerio y todo para que pasen los coches a través del Cabanyal desembocando de mala manera en
    una estrecha disyuntiva ante la Lonja del Pescado; cada vez peor, Sra. Alcaldesa. También a eso se
    le llama espolio y además es una chapuza que usted misma no sabe muy bien en qué quedará.


    Derribar casas protegidas y en su solar levantar parterres es expolio, un objetivo por el que ahora
    se siguen destruyendo 638 edificios, el 25% de los 2.527 que comprende el ámbito del PEPRI. Se derriban
    182 edificios protegidos, el 23% de los 772 que se contemplaban en el PGOU. De los 638 edificios a
    derribar, 108 fueron considerados de interés cultural.


    Sra. Alcaldesa, exactamente el mismo expolio que el anterior. Antes utilizaba un hacha para abrirse
    paso y es cierto que ahora utiliza un cúter, pero su Plan se lo sigue clavando al corazón del Cabanyal.


    Un error de partida que ahora repite, se lo dice Europa Nostra. Una reforma interior incompatible
    con la protección del Cabanyal, que debería haber desaconsejado los profesionales de su entorno, sin
    duda fruto de su obcecación personal. En todo caso, una patata caliente que de nuevo está dispuesta
    a lanzar sobre la mesa de los despachos de la Generalitat Valenciana y el Ministerio de Cultura, y
    que esta vez situará a sus profesionales ahora de forma consciente al borde de la prevaricación a
    la vista de lo establecido por la Orden ministerial y las reiteradas sentencias del Tribunal Supremo.
    Gracias.'
  date: '2026-10-20'
  finding: E1b-aed274ad70
  text_val: 'Bon dia. Sra. Alcaldessa, Srs. Regidors.


    Difícil ens ho han posat des d''Europa Nostra -de la mà del seu president, el Sr. [***]- per a aprofundir
    en la crítica del seu PEPRI, però ho intentarem des de la nostra modesta aportació si el poc temps
    del que disposem ho permet.


    Sra. Alcaldessa, ens obliga vosté a passar de nou per esta situació. Però en este moment no partim
    de zero, el punt de partida sobre el qual vosté diu haver aconseguit un **pacte polític** és que el
    **PEPRI que vosté va aprovar fa 15 anys produïx el delicte d''espoli** per més que en la memòria justificativa
    de la seua nova proposta el seu arquitecte redactor s''atreveix a dir que l''Ordre Ministerial ho
    diu de manera no argumentada. Si ens deixa, en dues fulles intentarem explicar-ho-li.


    Des de l''Associació de Veïns del Cabanyal-el Canyamelar entenem que assumir el seu encàrrec ha de
    ser un treball d''alt risc per a un professional. Una cosa que explica l''Ordre Ministerial de manera
    tan evident no ha volgut ser entesa per vostés: «El Pla Especial, lluny de trobar-se presidit per
    la finalitat de protecció del conjunt històric, sempre ha tingut per objectiu fonamental altres tipus
    de fins de caràcter divers, com poden ser l''urbanístic, social o econòmic, la legitimitat dels quals
    si bé no es qüestiona el cert és que posen en perill la conservació dels valors que van motivar la
    protecció de dit conjunt històric».


    En la fase d''avanç ja es va arribar a justificar pels seus redactors que «com més gran era l''afecció
    de cada alternativa, menor era el nombre d''edificis protegits. En general, la diferència entre el
    nombre d''edificis protegits del PG i el de les propostes d''avanç estava directament associat a les
    operacions de reforma interior del barri». És a dir, que **si cal desprotegir edificis perquè resulten
    incompatibles amb la prolongació, es desprotegeixen i ja es poden derrocar. Això és espoli**.


    Amb eixe criteri es va redactar el seu PEPRI espoliador i els **772 edificis protegits** pel PGOU
    van deixar de ser un obstacle. **196 d''ells inclosa la Llotja**, van passar a ser ignorats amb la
    finalitat del derrocament, malgrat que entre ells hi havia 114 que el propi Pla considerava que tenien
    interés arquitectònic.


    Una vegada aprovat el PEPRI i havent-se denunciat la seua presumpta il·legalitat, els tècnics redactors
    es van atrevir de nou a argumentar que «aquells immobles protegits que no es van incorporar al nou
    Catàleg del PEPRI eren exclusivament els que es veien afectats per la prolongació de l''Av. Blasco
    Ibáñez. Fora d''eixe àmbit d''afecció s''havien catalogat absolutament tots els immobles que mantenen
    un interés arquitectònic».


    De nou esta **afirmació espoliadora** confirmava el seu convenciment que **la protecció del conjunt
    s''havia de supeditar a altres tipus de fins** i que es derrocarien els 196 edificis protegits per
    resultar incompatibles amb la reforma interior que suposa la prolongació.


    Amb eixa voracitat destructiva era fàcil concloure, com ho fa l''Ordre ministerial, que: «Les determinacions
    del PEPRI suposen una **alteració del conjunt històric del Cabanyal** que desfiguren el mateix fins
    al punt de fer-li perdre el seu propi caràcter en benefici d''una determinada opció de traçat urbanístic
    incompatible amb la protecció del conjunt històric».


    En estos moments ens trobem amb que transcorreguts més de quatre anys des que es va aprovar l''Ordre
    ministerial, en el moment en què per fi vosté assumeix com a irremeiable la necessitat electoral de
    complir-la, es descolga amb una nova proposta -la segona en 15 dies- amb la qual diu haver aconseguit
    un pacte polític amb el qual donar per adaptat el PEPRI.


    Una proposta que insistix en els mateixos errors de partida convertint en una caricatura el seu renovat
    esforç per mantindre la trama històrica, entenent-la com la petjada del solar que deixen els edificis
    protegits una vegada són derrocats i mantenint-la amb ridículs parterres en benefici del que continua
    sent el seu irrenunciable objectiu de la prolongació, tal com vosté mateixa s''ha encarregat d''emfatitzar.


    El seu empenyiment és **mantindre els 48 m entre façanes**, insinuant que està disposada a negociar
    la resta davant del Ministeri i tot perquè passen els cotxes a través del Cabanyal desembocant de
    mala manera en una estreta disjuntiva davant de la Llotja del Peix; cada vegada pitjor, Sra. Alcaldessa.
    També a això se li diu espoli i a més és una chapuza que vosté mateixa no sap molt bé en què quedarà.


    **Derrocar cases protegides i en el seu solar alçar parterres és espoli**, un objectiu pel qual ara
    se segueixen destruint **638 edificis, el 25% dels 2.527** que comprén l''àmbit del PEPRI. **Es derroquen
    182 edificis protegits, el 23% dels 772** que es contemplaven en el PGOU. Dels 638 edificis a derrocar,
    108 van ser considerats d''interés cultural.


    Sra. Alcaldessa, exactament el mateix espoli que l''anterior. Abans utilitzava una destral per a obrir-se
    pas i és cert que ara utilitza un cúter, però el seu Pla continua clavant-se-li al cor del Cabanyal.


    Un error de partida que ara repeteix, ho diu Europa Nostra. Una **reforma interior incompatible amb
    la protecció del Cabanyal**, que haurien d''haver desaconsellat els professionals del seu entorn,
    sens dubte fruit de la seua obcecació personal. En tot cas, una pataca calenta que de nou està disposada
    a llançar sobre la taula dels despatxos de la Generalitat Valenciana i del Ministeri de Cultura, i
    que esta vegada situarà als seus professionals ara de manera conscient a la vora de la prevaricació
    a la vista del que estableix l''Ordre ministerial i les reiterades sentències del Tribunal Suprem.
    Gràcies.'
