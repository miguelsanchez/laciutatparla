- id: 2013-05-31-102
  pleno_id: '2013-05-31'
  ordre: 3
  intervinient: '[***]'
  entitat: Asociación de Vecinos de Favara
  tipus_entitat: av
  idioma_original: castellano
  text_original: 'El AMPA del CEIP Eliseo Vidal quiere manifestar su indignación y rechazo a la cesión
    de suelo público en el distrito de Patraix, a escasos metros de las instalaciones de nuestro colegio.
    De manera general nos oponemos también a cualquier cesión de suelo público a la iniciativa privada
    cuando todavía no han sido satisfechas las carencias, bien conocidas por las autoridades educativas,
    que el sistema público tiene en nuestro distrito. Nos oponemos en el fondo de la cuestión porque esto
    supone un cambio radical del modelo educativo que opta por los conciertos privados y arrincona la
    educación pública. Nos oponemos también en las formas porque no nos consta que haya habido ninguna
    comunicación, reunión o consulta previa con las partes más interesadas en solucionar las carencias
    educativas de nuestro sector. Consideramos que esto es una ofensa y un desprecio tras muchos años
    de espera y reivindicación del compromiso político de construcción del IES Nou Patraix, instituto
    público, ya presente en el mapa escolar de 1996. Esta medida obligará a matricular a nuestros hijos
    en un centro privado concertado si queremos optar a realizar la ESO en nuestro entorno.

    Según las informaciones publicadas, el nuevo proyecto pretende construir un centro privado concertado
    con unas 1300 plazas, que abarcará desde infantil hasta bachillerato. En comparación, el CEIP Eliseo
    Vidal, a punto de cumplir treinta años, tiene adscrito un IES público fuera de su sector educativo,
    alejado de su entorno (el IES 26 Misericordia) debido a las carencias del distrito. Recordar, además,
    que el IES Juan de Garay está a doble turno por dichas carencias. A esto debemos añadir las necesidades
    de inversión en actualización y mantenimiento de un colegio con varias décadas de historia, la angustia
    económica por la falta de financiación pública, las deudas acumuladas con la empresa que gestiona
    el comedor, etc.

    Ante esta situación tan desequilibrada, el futuro de colegios como el CEIP Eliseo Vidal parece inevitablemente
    abocado a su desaparición, o peor aún, a la marginación de aquellos que no puedan costearse la opción
    privada. El desequilibrio que se va producir entre la oferta pública y la privada es obvio y los padres
    serán empujados hacia la opción privada. Esto es, según la consejería de educación, fomentar la competencia
    “sana y leal” entre colegios y modelos educativos. Desde nuestro punto de vista esto es abrir el camino
    a la segregación socio-económica del alumnado.

    La situación económica de la generalitat no puede servir de excusa para hipotecar durante 75 años
    nuestros terrenos y con ellos nuestro derecho a una educación pública y de calidad. Y la situación
    de máxima debilidad de los servicios públicos no se debe utilizar para justificar su transformación
    en negocios privados. El Ayuntamiento de Valencia está siendo cómplice de este proceso ignorando las
    necesidades reales y urgentes de sus vecinos. Pero ese interés por la iniciativa privada no lo extiende
    a la familiar. Estudios independientes de asociaciones de consumidores afirman que el coste de los
    colegios concertados para las familias es superior en un 70% frente al coste de los colegios públicos.
    Es una hipocresía defender la bajada de impuestos mientras las medidas privatizadoras aumentan los
    gastos familiares ya de por sí agravados por la reducción de ayudas para comedor, libros o transporte.
    Esta es una de las razones por las que los colegios concertados acaban segregando al alumnado en función
    del nivel de renta.

    El AMPA del CEIP Eliseo Vidal también muestra su rechazo a la medida del “distrito escolar único”
    que agrupa en cuatro áreas los 19 distritos educativos. Medida vendida como un “aumento de la libertad
    de elección para los padres” pero que unida a la falta de inversión en la escuela pública facilita
    el éxodo hacia la concertada. En poco tiempo serán los colegios más demandados los que filtren a los
    alumnos que más convengan a sus intereses. Esto va en dirección contraria al carácter integrador que
    debe tener la educación pública. Simultáneamente, al agrupar los distritos los desequilibrios en la
    oferta de plazas en algunas áreas se habrán solucionado de manera ficticia. Con esta medida nos tememos
    que algunas familias tendrán que desplazarse aún más lejos de su entorno y que algunos colegios verán
    reducida su oferta e incluso tendrán que ver como cierran sus aulas.

    Desde el AMPA del CEIP Eliseo Vidal solicitamos que se anule la cesión de suelo público de uso educativo
    en el distrito de Patraix para la construcción de un centro educativo privado y que se impulse de
    nuevo la construcción del IES Nou Patraix planificado y comprometido desde hace 17 años.'
