- id: 2018-07-26-103
  pleno_id: '2018-07-26'
  ordre: 3
  intervinient: Elisa Alonso Pujadas
  entitat: Associació de Veterinaris Abolicionistes de la Tauromàquia (AVATMA)
  tipus_entitat: ong
  idioma_original: castellano
  text_original: 'Buenos días. Sr. presidente, concejalas, concejales. Mi nombre es Elia Alonso y soy
    médica veterinaria. Como experta en la materia voy a pasar a hablarles de cinco de las libertades
    que deben darse para certificar científicamente el bienestar animal. Fueron publidas en el año 1968
    y están refrendadas a día de hoypor la Organización Mundial de la Sanidad Animal:


    Los animales deben estar libres de hambre y de sed. Los toros utilizados pasan muchas horas sin ver
    cubiertas estas necesidades vitales, las de comer y las de beber. Libres de miedo, temor y angustia,
    libres de incomodidades físicas y térmicas, libres de dolor, lesiones y enfermedad. Los toros usados
    –porque son usados– sufren de forma intensa este tipo de sensaciones negativas, antes, durante y después
    de los festejos. Sensaciones que son capaces de sentir porque la ciencia así lo ha dictaminado. Y
    si necesitan y quieren documentarse, estoy haciendo referencia a la Declaración de Cambridge sobre
    la Conciencia Animal del año 2012.


    Libres para expresar su comportamiento natural. ¿Pero qué comportamiento natural va a expresar un
    toro al que se le ponen en contra de su voluntad, por supuesto, dos bolas de fuego encendidas de las
    que no puede despojarse de ninguna manera, que previamente ha sido previamente arrastrado con cuerdas
    y ha sido empotrado contra un pilón de madera? El fuego es un elemento que provoca pánico en cualquier
    especie animal y que si pudieran huirían despavoridos de ello. Eso sí que es un comportamiento natural,
    la huida. La inmovilización forzada les genera miedo intenso. Las provocaciones constantes para que
    embistan les generan una gran angustia y estrés negativo, agravados por el ejercicio físico que se
    les obliga a realizar y que les produce una evidente hipoxia –falta de oxígeno– y lesiones musculares.
    ¿Se ha preocupado por observar cómo respiran estos animales? ¿Se han preocupado de ver sus expresiones
    faciales? Nosotros sí.


    Ninguna de estas cinco libertades se cumple en los festejos taurinos que se pretenden volver a instaurar
    hoy aquí, lo que indica una evidente ausencia de bienestar animal, y un paso más allá, lo que indica
    un evidente maltrato animal.


    Hablan de garantizar el indiscutible y debido respeto a la integridad y seguridad de los animales
    participantes. El año pasado por estas fechas debatíamos exactamente lo mismo aquí. El año pasado
    por estas fechas se moría el toro que antes ha enseñado aquí la foto en Foios. Estaba íntegro unos
    segundos antes de ser embolado, estaba íntegro unos segundos después de ser embolado, incluso estaba
    íntegro unos segundos antes de morir. Y este es solo uno de tantos ejemplos de lo que sucede en este
    tipo de festejos, muerte por tradición y por diversión.


    Podría explicarles como médico veterinario las importantes alteraciones metabólicas y endocrinas que
    sufren estos animales, sufrimiento que no se ve, pero que científicamente también está demostrado.


    Así que yo, en representación a los más de 500 veterinarios de la asociación AVATMA, les pedimos como
    representantes políticos de una mayoría social que mantengan el acuerdo adoptado en el Pleno de 10
    de julio de 2016 que eliminó de las calles de València el padecimiento físico y emocional de estos
    toros. Por favor, no demos un paso atrás, continuemos evolucionando, la sociedad está preparada, la
    última palabra es la suya. Muchas gracias.'
  reason: Introduced in the acta as third citizen speaker (AVATMA); missing from extraction.
  date: '2026-10-19'
  finding: E1b-1a0b09f567
  text_val: 'Buenos días. Sr. president, concejalss, concejals. El meu nom és Elia Alonso i soc metgessa
    veterinària. Com a experta en la matèria vaig a passar a parlar-vos de **cinc de les llibertats**
    que han de donar-se per certificar científicament el **benestar animal**. Van ser publicades l''any
    1968 i estan refrendades fins hui per l''Organització Mundial de la Sanitat Animal:


    Els animals han d''estar **lliures de fam i de set**. Els toros utilitzats passen moltes hores sense
    veure cobertes aquestes necessitats vitals, les de menjar i les de beure. **Lliures de por, temor
    i angúixia**, **lliures d''incomoditats físiques i tèrmiques**, **lliures de dolor, lesions i malaltia**.
    Els toros utilitzats –perquè són utilitzats– pateixen de forma intensa aquest tipus de sensacions
    negatives, abans, durant i després dels festejos. Sensacions que són capaces de sentir perquè la ciència
    així ho ha dictaminat. I si necessiten i volen documentar-se, estic fent referència a la Declaració
    de Cambridge sobre la Consciència Animal de l''any 2012.


    **Lliures per expressar el seu comportament natural**. Però quin comportament natural va a expressar
    un toro al qual se li posen en contra de la seua voluntat, per supuesto, dues boles de foc enceses
    de les quals no pot desprendre''s de cap manera, que prèviament ha estat arrossegat amb cordes i ha
    estat empotat contra un pilón de fusta? El foc és un element que provoca pànic en qualsevol espècie
    animal i que si pogueren fugiries despavorides d''ella. Això sí que és un comportament natural, la
    fugida. La immobilització forçada els genera por intensa. Les provocacions constants perquè embestisquen
    els generen una gran angúixia i estrés negatiu, agreujats per l''exercici físic que se''ls obliga
    a realitzar i que els produeix una evident **hipòxia –falta d''oxigen– i lesions musculars**. S''ha
    preocupat per observar com respiren aquests animals? S''han preocupat de vore les seues expressions
    facials? Nosaltres sí.


    **Cap d''aquestes cinc llibertats es compleix en els festejos taurins** que es pretenen tornar a instaurar
    hui ací, la qual cosa indica una **evident absència de benestar animal**, i un pas més, la qual cosa
    indica un **evident maltractament animal**.


    Parlen de garantir el respecte indiscutible i degut a la integritat i seguretat dels animals participants.
    L''any passat per aquestes dates debatíem exactament el mateix ací. L''any passat per aquestes dates
    es moria el toro que abans ha ensenyat ací la foto en Foios. Estava íntegre uns segons abans de ser
    embolat, estava íntegre uns segons després de ser embolat, fins i tot estava íntegre uns segons abans
    de morir. I aquest és només un de tants exemples de la qual cosa succeeix en aquest tipus de festejos,
    **mort per tradició i per diversió**.


    Podria explicar-vos com a metgessa veterinària les importants alteracions metabòliques i endocrines
    que pateixen aquests animals, patiment que no es veu, però que científicament també està demostrat.


    Aix que jo, en representació dels més de 500 veterinaris de l''associació AVATMA, vos demanem com
    a representants polítics d''una majoritat social que **mantinguen l''acord adoptat en el Ple de 10
    de juliol de 2016** que va eliminar dels carrers de València el patiment físic i emocional d''aquests
    toros. **Per favor, no fem un pas enrere**, continuem evolucionant, la societat està preparada, l''última
    paraula és la vostra. Moltes gràcies.'
  resum_cas: La veterinaria Elisa Alonso, en representación de AVATMA (asociación de 500+ veterinarios),
    denuncia que los festejos taurinos incumplen las cinco libertades científicas del bienestar animal,
    causando sufrimiento físico y emocional, y solicita mantener el acuerdo del Pleno de 2016 que prohibió
    estas prácticas en Valencia.
  resum_val: La veterinària Elisa Alonso, en representació d'AVATMA (associació de 500+ veterinaris),
