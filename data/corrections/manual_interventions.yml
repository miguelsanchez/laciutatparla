- id: 2016-06-30-103
  pleno_id: '2016-06-30'
  ordre: 9
  intervinient: '[***]'
  entitat: Associació de Veterinaris Abolicionistes de la Tauromàquia (AVATMA)
  tipus_entitat: ong
  idioma_original: castellano
  text_original: 'Buenos días.

    Embolar con fuego al toro o ensogarle es maltrato animal, no es necesario herirle explícitamente.
    Los animales tienen pánico al fuego. ¿Pueden ustedes imaginar lo que sienten al llevarlo sobre la
    cabeza sin poder huir? ¿Se han parado a mirar sus expresiones cuando son inmovilizados? ¿Les han visto
    luchando para escapar? ¿Han observado cómo respiran mientras el festejo avanza? ¿Conocen la pérdida
    de peso por el estrés que sufren en el transporte? ¿Han intentando por un momento ponerse en su lugar?

    Hace unos meses entregamos a los responsables de Bienestar Animal de este Ayuntamiento nuestros informes
    sobre el sufrimiento físico y emocional al que son sometidos estos animales. No voy a insistir en
    lo que argumentamos, pero no les quepa duda de que toda la información que aportan es rigurosamente
    cierta y justifica sin lugar a dudas la decisión de este gobierno municipal que como veterinarios
    aplaudimos.

    No somos los únicos profesionales de la sanidad y el bienestar animal que en Europa nos manifestamos
    contra estas prácticas. Hace dos semanas en Paris la Asociación de Veterinarios Abolicionistas de
    la Tauromaquia y del Maltrato Animal (AVATMA), junto a 2.600 compañeros del Colectivo de Veterinarios
    Franceses Contra la Tauromaquia, hizo público un manifiesto contra los espectáculos taurinos. Esta
    tarde en Lisboa nuestro presidente intervendrá en la presentación de la Asociación de Veterinarios
    Abolicionistas de la Tauromaquia de Portugal. La asociación a la que represento, con 407 miembros
    y 8 años de historia…

    Conciencia. Es desde la ciencia que se está evolucionando éticamente con lo que respecta a la conducta
    de los seres humanos hacia otros seres. La crueldad con estos animales no es justificable porque hoy
    sabemos que estos bovinos tienen circuitos cerebrales similares a los nuestros relacionados con la
    experiencia consciente, con los estados afectivos, con la generación de estados emocionales y con
    la expresión y manifestación de sentimientos. Estos animales sufren y son maltratados, y ya nadie
    lo puede poner en entredicho.

    Gracias.'
  reason: 'Acta: extra one-minute speaker after Agró turn; says he represents the association of abolitionist
    veterinarians (AVATMA); not extracted.'
  date: '2026-10-20'
  finding: E1b-8005dd905d
  text_val: 'Bon dia.


