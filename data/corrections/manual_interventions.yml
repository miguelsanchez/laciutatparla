- id: 2019-09-26-102
  pleno_id: '2019-09-26'
  ordre: 7
  intervinient: '[***]'
  entitat: Federació de Famílies Nombroses de la Comunitat Valenciana
  tipus_entitat: av
  idioma_original: castellano
  text_original: 'En la reunión que tuvimos ayer con el concejal de Hacienda aceptó en principio y espero
    que se incluya el hecho de que las familias numerosas atendiendo a que consumimos más en total pero
    menos per cápita no se nos pasará del tramo 1 que se ha establecido, porque la nueva Ordenanza lo
    que establece como saben todos ustedes es distintos tramos de consumo y el agua es más cara cuanto
    más se consume por unidad de vivienda, no por unidad familiar. Eso era netamente injusto, además que
    le demostramos al Sr. Vilar que era además ilegal, a lo mejor es por eso por lo que se concedió. Pero
    agradecemos el haber atendido esa petición nuestra.


    Decimos que es ilegal porque hay sentencias firmes del Tribunal Supremo en otras ciudades diciendo
    que es ilegal porque no se atiende al principio de consumo individual o de tasas individualizadamente.
    Bien, el art. 9.2 de la Constitución insiste en que hay que tener en cuenta la igualdad de todas las
    personas. Los niños pequeños de las familias numerosas aunque no votan tienen derechos como ciudadanos
    y por tanto tienen que ser tratados fiscalmente en igualdad.


    Los impuestos que atacan a las familias numerosas rompen ese principio y además lo que hacen es atacar
    precisamente a las rentas per cápita más débiles, no a las más ricas. Porque los padres asumimos todos
    los gastos de más ciudadanos que alguien que solo asume los gastos de su propio ingreso. Eso, insisto,
    hay que tenerlo en cuenta y agradecemos que se haya tenido en cuenta para las familias numerosas no
    haciéndoles más cara el agua por más consumo, teniendo siempre en cuenta que efectivamente las familias
    numerosas aportamos además un bien social fundamental que es los ciudadanos. El futuro de la ciudad
    lo estamos aportando más grandemente las familias numerosas que otras familias o que otros ciudadanos.


    Por eso agradecemos que se haya tenido en cuenta y que se haya incluido que las familias numerosas
    no pasen nunca del tramo nº 1.'
  reason: 'Acta: second speaker (Sr. ******) of Federació de Famílies Nombroses at the sewerage point;
    not extracted.'
  date: '2026-10-20'
  finding: E1b-b982388b0a
  text_val: 'En la reunió que vàrem tindre ahir amb el regidor de Hisenda va acceptar en principi i espere
    que es incluïsca el fet que les famílies nombroses atenent que consumim més en total però menys per
    càpita **no se nos passarà del tram 1** que s''ha establert, perquè la nova Ordenança el que estableix
    com saben tots vostès és distints trams de consum i l''aigua és més cara quant més es consumix per
    unitat de vivenda, no per unitat familiar. Això era **netament injust**, a més que li demostrarem
    al Sr. Vilar que era a més **il·legal**, potser és per això per lo que es va concedir. Però **agraïm
    l''haber atès aquesta petició** nostra.


    Diem que és il·legal perquè hi ha **sentències fermes del Tribunal Suprem** en altres ciutats dient
    que és il·legal perquè no s''atiende al **principi de consum individual** o de taxes individualizadament.
    Bé, l''art. 9.2 de la Constitució insisteix en que cal tindre en compte la **igualtat de totes les
    persones**. Els xiquets xicotets de les famílies nombroses encara que no voten **tienen drets com
    a ciutadans** i per tant han de ser tractats fiscalment en igualtat.


    Els **impostos que ataquen a les famílies nombroses** trenquen aquest principi i a més el que fan
    és atacar precisament les **rendes per càpita més dèbils**, no a les més riques. Perquè els pares
    assumim tots els gastos de més ciutadans que alguén que només assumix els gastos del seu propi ingrés.
    Això, insistixc, cal tindre-ho en compte i agraïm que s''haja tindre en compte per a les famílies
    nombroses no fent-los més cara l''aigua per més consum, tenint sempre en compte que efectivament les
    famílies nombroses aportam a més un **bé social fonamental** que és els ciutadans. El futur de la
    ciutat ho estem aportant més grandement les famílies nombroses que altres famílies o que altres ciutadans.


    Per això agraïm que s''haja tindre en compte i que s''haja inclòs que **les famílies nombroses no
    passen mai del tram nº 1**.'
  resum_cas: La Federación de Familias Numerosas solicita que en la nueva ordenanza de tarifas de agua
    no se supere el tramo 1 de consumo para familias numerosas, argumentando que las actuales disposiciones
    son injustas e ilegales según sentencias del Tribunal Supremo, ya que vulneran el principio de igualdad
    al no considerar el consumo individual sino familiar.
  resum_val: La Federació de Famílies Nombroses demana que en la nova ordenança de tarifes d'aigua no
