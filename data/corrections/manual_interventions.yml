  idioma_original: valenciano
  text_original: Bon dia. Un altre dels punts que voldríem remarcar respecte d’esta proposta d'aprovació
    de l'urbanisme de Campanar és que, com la resta de la ciutat, s'està tornant cada vegada més inhabitable,
    per molt que s’omplin ací la boca de l'ambició de ser una Capital Verda Europea. Ho som sobre el paper,
