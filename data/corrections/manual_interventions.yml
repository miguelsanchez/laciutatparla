  entitat: Asociación de Vecinos de Velluters
  tipus_entitat: av
  idioma_original: castellano
  text_original: 'Sra. Alcaldesa, Sres. Concejales, Sras. Concejalas:

    La Asociación el Palleter pone de manifiesto su satisfacción a que se plantee por primera vez en el
    Pleno del Ayuntamiento el debate sobre la prostitución en distintos barrios de Valencia.

    Como es conocido por todos, el barrio de Velluters es uno de los más afectados en la ciudad de Valencia.
    Nosotros, como Asociación de Vecinos, la función que nos corresponde es la de recoger todas las quejas
    y reivindicaciones vecinales y trasladarlas a las administraciones competentes. Estableciendo un orden
    de protestas les puedo asegurar que pone de manifiesto a todos el diagnóstico del barrio, siendo el
    eje principal de la degradación y deterioro de Velluters todo lo que origina el fenómeno de la prostitución.

    Ustedes saben muy bien que la prostitución va siempre vinculada a la droga y a la delincuencia, que
    hablamos de una prostitución manejada, que ejerce sus servicios tanto en habitaciones que utilizan
    a modo de pensiones clandestinas como en la propia calle. Los vecinos no deben aguantar ser abordados
    por prostitutas que se instalan en diferentes calles de Velluters, haciéndose ya extensivo el problema
    al barrio del Mercat y Sant Francesc, a espaldas de este mismo Ayuntamiento.

    Las mujeres no deben soportar ser intimidadas por señores que vienen a solicitar servicios sexuales
    a este barrio. Y sobre todo, los niños que viven en estas calles tienen que ser protegidos de todos
    los episodios desagradables que se dan en esta parte de la ciudad. Irónicamente, la calle más conflictiva
    –la famosa calle Viana, la que permite a algunos considerarlo como El Chino e increpar y amenazar
    a los vecinos que quienes no estén de acuerdo se vayan a vivir a la calle Colón- está a menos de 100
    metros del Colegio Escolapios y de un albergue juvenil.

    Por otra parte, añadir que esta Asociación, tal y como ha manifestado en diferentes ocasiones la Sra.
    Alcaldesa, ha trabajado muy de cerca con las delegaciones de Seguridad Ciudadana y Actividades, procediendo
    así a que este Ayuntamiento revoque licencias a locales que realizaban actividades que no correspondían
    con sus permisos autorizados, ya que la Asociación de Vecinos viene reivindicando durante años la
    recuperación del barrio solicitando la rehabilitación y normalización de éste, y el respeto hacia
    los vecinos. Entendiendo que quien debe asumir estas competencias es el Ayuntamiento.

    Por último, esperamos que todas las fuerzas políticas que están representadas en este Pleno sepan
    diferencias y concretar lo que es el problema de la prostitución y lo que ésta origina a los vecinos
    de Valencia. Y sepan dar el tratamiento que corresponde a cada uno de ellos, con el fin de resolver
    problemas a los ciudadanos, no quedando sólo en un mero debate.

    Gracias.'
