- id: 2016-09-20-109
  pleno_id: '2016-09-20'
  ordre: 9
  intervinient: '[***]'
  entitat: Associació de Veïns i Veïnes de Natzaret
  tipus_entitat: av
  idioma_original: valenciano
  reason: Introduced in the acta as 'Associació de Veïns i Veïnes de Natzaret. Intervé' but not extracted.
  text_original: 'Bon dia, o bona vesprada, a totes i a tots. Amb motiu de la celebració enguany del 40
    aniversari de la nostra associació vam triar el lema Per un barri sense fronteres. Recuperem ciutat,
    i vam demanar un pla integral per a fer realitat un Natzaret sense barreres físiques i socials, de
    manera que la inclusió del nostre barri en la ciutat siga de veres. Pel que fa a les barreres físiques,
    com vostés saben, el 18 de maig de 1986 l’Ajuntament i el Port de València varen signar un conveni
    per a afavorir l’ampliació del port per la platja de Natzaret. Per pal·liar aquest sacrifici es varen
    introduir en l’esmentat document unes compensacions que no es varen complir, excepció feta dels 40.000
    m2 del parc de Marazul rescatat de la destrossa de la platja després de la lluita de la nostra associació
    de veïns. Durant els 24 anys del govern anterior tan sols la lluita del veïnat organitzat va aconseguir
    la reconstrucció, per dues vegades, del balneari Marazul i posada en marxa en 2014, i l’enderrocament
    de la perillosa i contaminant fàbrica d’oli, ara farà tres anys i mig. Però el port es va carregar
    els tallers d’ocupació que vàrem posar en marxa amb el Proyecto JOB Benimar, un proyecto de futuro
    que abre esperanzas, els anys 1991 i 2000. A més a més, en 2004 vàrem patir inundació del barri per
    les obres mal fetes del port durant la construcció de la rotonda que recuperava en Natzaret els terrenys
    cedits per a la Copa América en la dàrsena històrica, tot convertint la desembocadura del llit del
    Túria en la imatge més indigna de la ciutat de València, convertint l’eixida del riu a la mar en una
    mena de claveguera. Per això, demanem un parc de desembocadura, tot recordant que, en el debat electoral
    organitzat per la Plataforma el litoral per al poble el 18 de maig de 2015 a l’Ateneu Marítim del
    Cabanyal, la totalitat dels partits actualment representants en el consistori (PP, Ciudadanos, València
    en Comú, PSPV-PSOE i Compromís) es varen comprometre a fer realitat la recuperació de la desembocadura
    del Túria. Els demanem coherència. A hores d’ara l’Autoritat Portuària i l’Ajuntament tenen un deute
    històric amb Natzaret per l’incompliment del conveni del 86: final del riu, jardí o via verda en el
    solar de la antiga fàbrica d’oli, magatzem de contenidors del carrer d’Algemessí, per la qual cosa
    vam interposar un contenciós administratiu contra els anteriors governants de l’Autoritat Portuària
    i de l’Ajuntament. Hi ha, però, almenys una altra barrera física molt important entre Natzaret i la
    resta de la ciutat: les vies del ferrocarril, un tema absolutament encallat. I pel que fa a les barreres
    socials al nostre barri, els recordem tan sols algunes dades significatives: renda molt baixa i alt
    nivell d’atur; pèrdua i envelliment de la població; baix nivell formatiu (5,8 % d’analfabetisme a
    Natzaret, front a l’1,8 % de la mitjana a tota la ciutat de València); baix percentatge de persones
    amb estudis universitaris davant la mitjana de València que és molt més alta. I per acabar, l’Ajuntament
    està donant resposta a la reivindicació d’un pla integral que posa en marxa una estratègia integral
    participativa per actualitzar les reivindicacions històriques del barri i per a organitzat, orientar
    les inversions municipals a curt, mitja i llarg termini. Per tot això i per a finalitzar, demanen
    un compromís de tots els partits representats a l’Ajuntament de València, a babord i a estribord,
    per a recolzar allò que isca d’eixe pla participatiu i fer realitat la inclusió de Natzaret en la
    ciutat. Moltes gràcies, res més de moment.'
  date: '2026-10-20'
  finding: E1b-0f5e756bd2
  text_cas: 'Buenos días o buenas tardes a todos y a todas. Con motivo de la celebración este año del
    40 aniversario de nuestra asociación elegimos el lema **Por un barrio sin fronteras**. **Recuperamos
    ciudad**, y solicitamos un **plan integral** para hacer realidad un **Natzaret sin barreras físicas
    y sociales**, de manera que la inclusión de nuestro barrio en la ciudad sea de verdad.


    Por lo que respecta a las barreras físicas, como ustedes saben, el 18 de mayo de 1986 el Ayuntamiento
    y el Puerto de Valencia firmaron un convenio para favorecer la ampliación del puerto por la playa
    de Natzaret. Para paliar este sacrificio se introdujeron en el mencionado documento unas **compensaciones
    que no se cumplieron**, con excepción de los 40.000 m2 del parque de Marazul rescatado de la destrucción
    de la playa después de la lucha de nuestra asociación de vecinos. Durante los 24 años del gobierno
    anterior solo la lucha del vecindario organizado consiguió la reconstrucción, en dos ocasiones, del
    balneario Marazul y su puesta en marcha en 2014, y el derribo de la peligrosa y contaminante **fábrica
    de aceite**, hace ahora tres años y medio. Pero el puerto se llevó los **talleres de ocupación** que
    pusimos en marcha con el Proyecto JOB Benimar, un proyecto de futuro que abre esperanzas, en los años
    1991 y 2000.


    Además, en 2004 sufrimos una **inundación del barrio** por las obras mal ejecutadas del puerto durante
    la construcción de la rotonda que recuperaba en Natzaret los terrenos cedidos para la Copa América
    en la dársena histórica, convirtiendo la desembocadura del lecho del Turia en la imagen más indigna
    de la ciudad de Valencia, convirtiendo la salida del río al mar en una especie de alcantarilla. Por
    eso, pedimos un **parque de desembocadura**, recordando que, en el debate electoral organizado por
    la Plataforma el litoral para el pueblo el 18 de mayo de 2015 en el Ateneu Marítim del Cabanyal, la
    totalidad de los partidos actualmente representados en el consistorio (PP, Ciudadanos, Valencia en
    Comú, PSPV-PSOE y Compromís) se comprometieron a **hacer realidad la recuperación de la desembocadura
    del Turia**. Les pedimos coherencia.


    A estas alturas, la Autoridad Portuaria y el Ayuntamiento tienen una **deuda histórica con Natzaret**
    por el incumplimiento del convenio del 86: final del río, jardín o vía verde en el solar de la antigua
    fábrica de aceite, almacén de contenedores de la calle Algemessí, por lo que interpusimos un contencioso
    administrativo contra los anteriores gobernantes de la Autoridad Portuaria y del Ayuntamiento. Hay,
    sin embargo, al menos otra barrera física muy importante entre Natzaret y el resto de la ciudad: **las
    vías del ferrocarril**, un tema absolutamente estancado.


    Y en cuanto a las **barreras sociales** en nuestro barrio, les recordamos solo algunos datos significativos:
    **renta muy baja y alto nivel de desempleo**; **pérdida y envejecimiento de la población**; **bajo
    nivel formativo** (5,8 % de analfabetismo en Natzaret, frente al 1,8 % de la media en toda la ciudad
    de Valencia); **bajo porcentaje de personas con estudios universitarios** ante la media de Valencia
    que es mucho más alta.


    Y para terminar, el Ayuntamiento está dando respuesta a la reivindicación de un **plan integral**
    que pone en marcha una **estrategia integral participativa** para actualizar las reivindicaciones
    históricas del barrio y para orientar las inversiones municipales a corto, medio y largo plazo. Por
    todo ello y para finalizar, pedimos un **compromiso de todos los partidos** representados en el Ayuntamiento
    de Valencia, a babor y a estribor, para apoyar lo que salga de ese plan participativo y hacer realidad
    la inclusión de Natzaret en la ciudad. Muchas gracias, nada más de momento.'
  resum_cas: La Asociación de Vecinos de Natzaret solicita un plan integral para eliminar barreras físicas
    y sociales en el barrio, incluyendo la recuperación de la desembocadura del Turia, compensaciones
    por los daños del puerto y mejora de indicadores socioeconómicos historicamente desfavorables.
  resum_val: L'Associació de Veïns de Natzaret demana un pla integral per a eliminar barreres físiques
    i socials en el barri, incloent la recuperació de la desembocadura del Túria, compensacions pels danys
    del port i millora d'indicadors socioeconòmics històricament desfavorables.
