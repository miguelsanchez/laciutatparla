- id: 2016-09-20-102
  pleno_id: '2016-09-20'
  ordre: 2
  intervinient: '[***]'
  entitat: Federació d'Associacions de Veïns de València
  tipus_entitat: av
  idioma_original: castellano
  reason: Introduced in the acta as 'Federació d’Associacions de Veïns de València. Intervé' but not extracted.
  text_original: Señor alcalde, señoras y señores concejales. Buenos días. La Federación y el movimiento
    vecinal apoyan la realización de un pleno para conocer el estado de la ciudad, aunque consideramos
    precipitada la convocatoria y el plazo tan breve que impide profundizar en los problemas importantes
    y serios de la ciudad, así como el tiempo tan limitado para poder exponerlos. Vamos, no sólo a criticar,
    sino a proponer colaboración. Deseamos un feed-back fluido y continuo con el ayuntamiento y pasamos
    asuntos que consideramos interesantes. Sobre participación creemos que se está haciendo una participación
    ciudadana de Wikipedia, pero la realidad de la participación va mucho más allá de una definición.
    Ha pasado tiempo suficiente para, al menos, haber planteado las líneas de trabajo hacia la descentralización
    de las juntas municipales de distrito y su reglamento. Sin este paso, es imposible que las consultas
    realizadas hasta este momentos tengan el valor que se merece una consulta ciudadana ya que no tienen
    el marco legal adecuado para que lleguen a ser vinculantes, ya que actualmente sólo son consultivas
    y no dejarán de serlo hasta que se modifique el reglamento y el funcionamiento de las juntas. La ciudadanía
    no tiene el hábito de la participación y de la consulta, es cierto, pero no es menos cierto que si
    éstas no son vinculantes, sólo provocan la desmotivación en la implicación en los asuntos municipales.
    Y en temas de movilidad incidimos en la necesidad de que los acuerdos adoptados en las consultas sean
    los ejecutados y no los previamente definidos por la Concejalía. Hablamos de la modificación de las
    líneas de la EMT, algunas positivas y otras que se deberían haber revisado y estudiado, puesto más
    atención en las comisiones de trabajo. Y entendemos que hay que tener sensibilidad con las personas
    y ponerlas en primer lugar, antes que cualquier otra consideración. Existen más de 5.000 firmas en
    el Ayuntamiento y se siguen recogiendo, que piden que se rectifiquen algunas modificaciones que ya
    se han puesto en marcha; por cierto, en un mes que estadísticamente no es indicativo para realizar
    valoraciones. Y para futuras consultas sobre movilidad (carril bici, peatonalización, modificación
    de la EMT) solicitamos un trabajo previo de información y difusión antes de tratarlo en las consultas
    y no continuar el modelo anterior, de hace antaño, de decisiones unilaterales desde el Ayuntamiento.
    Sobre vía pública y seguridad como no se ha trabajado por definir el ocio de nuestra ciudad, nos encontramos
    con graves problemas extensivos a todos los barrios. Las terrazas, masificadas, por no haber escuchado
    a los ciudadanos. No sólo no se ha finalizado la pintura de delimitación de las terrazas pese al tiempo
    transcurrido que consideramos más que suficiente, sino que la ocupación de las aceras se ha incrementado
    en casi todas las zonas de la ciudad. Quisiera decir que si no se toman medidas Valencia tiene microbotellones
    y vamos a pasar a ser una ciudad macrobotellón. Y, posteriormente, en temas de apartamentos turísticos,
    se debe no autorizar esta actividad en zonas residenciales y no modificar el Plan general. Y podríamos
    hablar de educación, de limpieza viaria, de parques y jardines, de todo. Pero creo que hay que dar
    las gracias por la oportunidad de este Pleno y poder hablar.
