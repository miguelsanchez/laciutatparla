    que nosaltres en les nostres consultes d''atenció hem constatat durant l''exercici de 2012, ¿quin
    tipus de tractament aportaria aquesta Ordenança? ¿Seria un **tractament etiològic?**, ¿un **tractament
    causal**? ¿Un tractament com funcionen els antibiòtics que intenten eliminar la causa del problema?
    Si aquesta Ordenança haguera inclòs **elements contra la trata o contra el comerç** podríem considerar-ho
    així. ¿Es un **tractament paliatiU?**, ¿que elimina el dolor?, ¿que millora el sofriment com ho fa
    el paracetamol per al dolor de cap? Tampoc.


    Aquesta Ordenança no mitiga el sofriment o la vulnerabilitat de les dones que es troben en l''exercici
    de l''explotació, en l''exercici de la prostitució. ¿Es un tractament quirúrgic? No, tampoc. ¿En quin
    tipus de tractament ens estem movent?, ¿què és el que estem veient? Intuïm, pensem que és un **tractament
    exclusivament estètic**, un tractament que va a funcionar –com deia abans la meua companya- **allunyant
    aquestes dones dels centres** i fent més vulnerables, en més situació de risc per a la seua salut,
    amb més possibilitats de ser explotades, de ser agredides, de ser violentades que la situació en què
    es troben ara.


    Per tant, en la nostra opinió, **animem les forces polítiques**, les animem a totes vosaltres, a que
    incorporen en la fase d''al·legacions **elements que facen que aquesta Ordenança tenga una ambició
    major**, una **ambició terapèutica real**, una ambició d''incorporar elements que milloren la capacitat
    d''aquest col·lectiu de decidir, de ser ocupables, de formar-se, d''abandonar o de continuar en la
    seua activitat, de disminuir el seu risc d''enfermar, de millorar la coordinació entre institucions
    sanitàries, socials, a incloure tot el que ara mateix adoleïx deixant aquest document com una mera
    expressió d''intenció estètica.


    Molt gràcies.'
  resum_cas: Médicos del Mundo critica la Ordenanza sobre prostitución por considerarla meramente estética
    y paliativa, sin abordar las causas reales de la explotación. Solicita medidas que mejoren la salud,
