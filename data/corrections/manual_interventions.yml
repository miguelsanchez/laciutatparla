- id: 2016-09-20-105
  pleno_id: '2016-09-20'
  ordre: 5
  intervinient: '[***]'
  entitat: Orriols Conviu
  tipus_entitat: ong
  idioma_original: castellano
  reason: Introduced in the acta as 'Associació Orriols Conviu. Intervé' but not extracted.
  text_original: En primer lugar queremos agradecerles la invitación que esta Alcaldía ha hecho a esta
    Asociación Orriols Convive y que, por fin, se tomen en cuenta nuestras aportaciones. Orriols Convive
    es un proyecto de desarrollo comunitario puesto en marcha en el año 2014 y nuestra labor es conocida
    ya por muchos de ustedes porque ya hemos tenido reuniones, al contrario que otro parece ser, con diversas
    concejalías y les hemos expuesto la situación del barrio. Pero han pasado ya 485 días desde las elecciones
    y el rescate de las personas y la mejora de los barrios obreros y periféricos, como el nuestro de
    Orriols, están todavía por llegar. En Orriols tenemos el honor, entre comillas, de ser la segunda
    renta per cápita más baja de Valencia y el de mayor tasa de desempleo. Tenemos un problema de superpoblación
    porque hay 18.000 personas censadas pero, en realidad, viven 35.000. Tenemos también la mayor tasa
    de población migrante con problemas de estigmatización de colectivos. Por no hablar del pequeño comercio
    prácticamente desaparecido en estos momentos que impulsándolo, la verdad, que sería una estupenda
    vía de interrelación cultural. A todas luces, en este momento, los servicios públicos son insuficientes
    y constatamos una ausencia de inversiones reales en el barrio, al margen del parque de la Ermita que
    ya se ha nombrado y el parque de las Ilusiones que salió en los presupuestos participativos. Hemos
    oído que será inaugurado en el año 2017 pero nos gustaría saber cuándo comenzarán realmente las obras.
    El estado del barrio de Orriols sigue siendo muy preocupante por diversos motivos porque hay un grave
    problema de ocupación de viviendas propiedad de diversas entidades bancarias. Hemos oído que se han
    realizado acciones con los diversos bancos, pero nosotros proponemos otras cosas que si nos quieren
    oír se las diremos. Tenemos un problema que hay un determinado colectivo de personas que no quieren
    convivir con nadie, que han ocupado esas viviendas y que generan, la verdad, un clima de miedo e inseguridad
    creciente. Se necesitaría en estos momentos más presencia policial y otro tipo de intervención comunitaria,
    no solamente la presencia policial sino otro tipo de intervención. ¿Por qué, por ejemplo, el Ayuntamiento,
    con esos presupuestos que tiene, no empieza a comprar algunas viviendas de este tipo en el barrio
    y las destina a jóvenes que regeneren el barrio? Destacamos, en este momento, la incapacidad, suponemos
    por falta de personal y de recurso, del Centro Municipal de Servicios Sociales Salvador Allende que
    tiene que atender a más de 20.000 usuarios. ¿Para cuándo una intervención comunitaria en coordinación
    con otras instituciones y recursos? Constatamos también un aumento de la limpieza, eso es verdad,
    pero todavía creemos que es insuficiente. La actividad cultural y de ocio y tiempo libre prácticamente
    no existe porque no hay infraestructuras públicas. Si hay algunas son de pago. En cuanto al empleo
    sería necesario potenciar otra manera de inserción socio-laboral adaptada a la realidad de los barrios
    con cooperativas y vecinos y vecinas en las contratas. Esto lo hemos contemplado ya en algunas ocasiones.
    Sabemos que es difícil. Reclamamos, sobre todo un Plan integral de renovación del barrio, que esto
    sería súper importante, que el Grupo Socialista en el año 2014 ya lo dijo. ¿Para cuándo el Agujero
    de la Vergüenza desaparecerá? Y, sobre todo, con lo que respecta a educación nos gustaría que la concejala
    de educación visitara nuestros colegios públicos que en este momento son unos guetos en los que solamente,
    prácticamente están matriculados personas inmigrantes. Ya, para acabar, les invitamos a nuestra Asamblea
    general que será el día 29 de septiembre a las 17 horas y podrán constatar in situ los problemas reales
    del barrio porque allí la gente habla.
  date: '2026-10-20'
  finding: E1b-80ea6e6297
  text_val: 'En primer lloc volem agraïr-vos la invitació que esta Alcaldia ha fet a esta Associació Orriols
    Conviu i que, **per fi, es tinga en compte les nostres aportacions**. Orriols Conviu és un projecte
    de desenvolupament comunitari posat en marxa en l''any 2014 i la nostra labor és coneguda ja per molts
    de vosaltres perquè ja hem tingut reunions, al contrari que altre pareix ser, amb diverses concejalies
    i els hem exposat la situació del barri. Però **han passat ja 485 dies** des de les eleccions i **el
    rescat de les persones i la millora dels barris obrers i perifèrics**, com el nostre d''Orriols, estan
    todavía per arribar.


    En Orriols tenim l''honor, entre cometes, de ser **la segona renda per cápita més baixa de València**
    i la de **major taxa d''atur**. Tenim **un problema de superpoblació** perquè hi ha 18.000 persones
    censades però, en realitat, viuen 35.000. Tenim també **la major taxa de població migrant** amb problemes
    d''estigmatització de col·lectius. Per no parlar del **petit comerç pràcticament desaparegut** en
    estos moments que impulsant-lo, la veritat, que seria una esplèndida via d''interrelació cultural.


    A totes llums, en este moment, **els serveis públics són insuficients** i constatem **una absència
    d''inversions reals en el barri**, al marge del parc de l''Ermita que ja s''ha nomenat i el parc de
    les Il·lusions que va eixir en els pressupostos participatius. Hem oït que serà inaugurat en l''any
    2017 però ens agradaria saber quan començaran realment les obres.


    L''estat del barri d''Orriols segueix sendo molt preocupant per diversos motius perquè **hi ha un
    greu problema d''ocupació de vivendes** propietat de diverses entitats bancàries. Hem oït que s''han
    realitzat accions amb els diversos bancs, però nosaltres proposem altres coses que si ens volen oír
    se les direm. Tenim un problema que hi ha un determinat col·lectiu de persones que no volen conviure
    amb ningú, que han ocupat eses vivendes i que generen, la veritat, **un clima de por i inseguretat
    creixent**. Es necessitaria en este moment **més presència policial** i altre tipus d''intervenció
    comunitaria, no solament la presència policial sino altre tipus d''intervenció. ¿Per què, per exemple,
    l''Ajuntament, amb estos pressupostos que té, no comença a comprar algunes vivendes d''este tipus
    en el barri i les destina a jóvens que regeneren el barri?


    Destaquem, en este moment, **la incapacitat** del Centre Municipal de Serveis Socials Salvador Allende
    que té que atendre a més de 20.000 usuaris. ¿Per a quan una intervenció comunitaria en coordinació
    amb altres institucions i recursos? Constatem també un augment de la neteja, esto és veritat, però
    todavía creiem que és insuficient.


    **L''activitat cultural i d''oci i temps libre pràcticament no existe** perquè no hi ha infraestructures
    públiques. Si n''hi ha algunes són de pagament. Quant a l''ocupació seria necessari potenciar altra
    manera d''inserció socioeconòmica adaptada a la realitat dels barris amb cooperatives i veïns i veïnes
    en les contrates. Esto ho hem contemplat ja en algunes ocasions. Sabem que és difícil.


    Reclamem, sobre tot **un Pla integral de renovació del barri**, que esto seria súper important, que
    el Grup Socialista en l''any 2014 ja ho va dir. ¿Per a quan **el Forat de la Vergonya desapareixerà**?
    I, sobre tot, amb lo que respecta a educació ens agradaria que la concejala d''educació visitara els
    nostres col·legis públics que en este moment són uns getos en los quals solament, pràcticament estan
    matriculats persones immigrantes.


    Ya, per acabar, os invitem a la nostra Assemblea general que serà el dia 29 de setembre a les 17 hores
    i podran constar in situ els problemes reals del barri perquè allí la gent parla.'
  resum_cas: Asociación de desarrollo comunitario de Orriols reclama inversiones reales, mejora de servicios
    públicos, intervención en ocupación de viviendas y un plan integral de renovación del barrio que ha
    permanecido sin cambios en 485 días tras las elecciones, denunciando la segunda renta per cápita más
    baja de Valencia, mayor desempleo, superpoblación, estigmatización de migrantes y casi desaparición
    del comercio local.
  resum_val: Associació de desenvolupament comunitari d'Orriols reclama inversions reals, millora de serveis
    públics, intervenció en ocupació de vivendes i un pla integral de renovació del barri que ha romàs
    sense canvis en 485 dies després de les eleccions, denunciant la segona renda per cápita més baixa
    de València, major atur, superpoblació, estigmatització de migrants i quasi desaparició del comerç
    local.
