- id: 2015-04-24-102
  pleno_id: '2015-04-24'
  ordre: 6
  intervinient: '[***]'
  entitat: Asociación de Vecinos y Amigos de la Malva
  tipus_entitat: av
  idioma_original: castellano
  reason: 'Missed speaker: Dª ******, en representación de la Asociación de Vecinos y Amigos de la Malva.'
  text_original: 'Buenos días. Sra. Alcaldesa. Sras. y Sres. Concejales del Ayuntamiento de Valencia.


    Todo mi agradecimiento a Amics de la Malva por darme la palabra para defender el derecho a la educación.


    Como representante de CC.OO.PV en el Consejo Escolar Municipal y portavoz de Amics de la Malva expreso
    el apoyo a la moción presentada al Pleno por los Grupos Municipales Socialista, Compromís y EUPV.


    Con respecto al distrito escolar único, no ha existido consenso en su aplicación y ha sido tibia la
    postura del Consejo Escolar Municipal. Desde CC.OO.PV pensamos que en la aplicación de esta medida
    se rompe el principio de proximidad con su entorno y de la inserción de la escuela en el barrio. Consideramos
    además que el Ayuntamiento tiene que garantizar las sustituciones en los colegios municipales y ser
    mucho más beligerante en las becas de comedor.


    Además, la ciudad cuenta con una red de centros públicos que debería estar mejor cuidada, no se ha
    invertido suficientemente en su mantenimiento. Tiene que existir una revisión periódica de los centros
    públicos que garantice la conservación del patrimonio, al mismo tiempo que cubra con dignidad las
    necesidades educativas en los centros de enseñanza.


    Cierto es que la normativa de escolarización, de 22 de marzo de 2013, establecen el calendario y el
    procedimiento de admisión del alumnado en las enseñanzas públicas no universitarias. Esa normativa
    rompe ese principio de proximidad del alumnado en su entorno y dificulta las ayudas al comedor, así
    como la libertad de elección. No se da prioridad a quien menos recursos tiene. Muy al contrario, se
    prioriza a quien no le origina ningún problema el desplazamiento desde su lugar de residencia de sus
    hijas e hijos. Desde CC.OO.PV tenemos una postura crítica y beligerante con la subida de las ratios
    en el aula que colaboran a la reducción de unidades y profesorado.


    La otra resolución, de 14 de febrero de 2014, al modificar el catálogo de unidades de centros docentes
    públicos de educación infantil y primaria, tiene como consecuencia la reducción de la oferta de enseñanza
    pública de esta ciudad en 20 unidades para el alumnado de tres años, lo que dificulta la integración
    y socialización de este alumnado en edades tempranas. Muchas de estas unidades además están localizadas
    en centros con línea de enseñanza en valenciano, sabiendo que su oferta es deficitaria.


    Recuerdo que las comunidades educativas de los centros docentes afectados han expresado en varias
    ocasiones su total oposición a esta medida y que el Consejo Escolar Municipal recogió y rechazó el
    cierre de estas unidades educativas.


    En el mismo sentido, pongo de relieve que la Comisión de Cultura y Educación de este Ayuntamiento,
    con fecha 27 de enero de 2014 aprobó por unanimidad la oposición al cierre de unidades de tres años
    indicadas durante el curso pasado, instando a comunicar a la Conselleria d’Educació, Cultura i Esport
    la oposición de este municipio a las medidas de cierre de unidades infantiles de tres años. En el
    mismo sentido, se han manifestado reiteradamente las asociaciones de madres y padres de las comunidades
    educativas afectadas y la Federación de Asociaciones de Madres y Padres del Alumnado.


    También instamos al Ayuntamiento a poner en marcha los centros municipales construidos a través del
    programa Educa 3, que no han entrado nunca en funcionamiento, para que sean abiertos lo antes posible.


    Por todo ello, hacemos nuestra la moción que presentan al Pleno las concejalas y los concejales de
    los Grupos Municipales Socialista, Compromís y EUPV.'
  date: '2026-10-20'
  finding: E1b-6b5b91fbc6
  text_val: 'Bon dia. Sra. Alcaldessa. Sres. i Sres. regidors de l''Ajuntament de València.


    Tot el meu agraïment a Amics de la Malva per donar-me la paraula per a **defensar el dret a l''educació**.


    Com a representant de CC.OO.PV en el Consell Escolar Municipal i portaveu d''Amics de la Malva expresse
    el **suport a la moció presentada** al Ple pels Grups Municipals Socialista, Compromís i EUPV.


    Respecte al districte escolar únic, **no ha existit consens** en la seua aplicació i ha sigut tèbia
    la postura del Consell Escolar Municipal. Des de CC.OO.PV pensem que en l''aplicació d''esta mesura
    **es trenca el principi de proximitat** amb el seu entorn i de la inserció de l''escola en el barri.
    Considerem a més que l''Ajuntament ha de **garantir les substitucions** en els col·legis municipals
    i ser **molt més bel·ligerant en les beques de menjador**.


    A més, la ciutat compta amb una **xarxa de centres públics** que hauria d''estar millor cuidada, **no
    s''ha invertit suficientment** en el seu manteniment. Ha d''existir una **revisió periòdica dels centres
    públics** que garantisca la conservació del patrimoni, al mateix temps que cobresca amb dignitat les
    necessitats educatives en els centres d''ensenyament.


    És cert que la normativa d''escolarització, de 22 de març de 2013, estableix el calendari i el procediment
    d''admissió de l''alumnat en els ensenyaments públics no universitaris. Esta normativa **trenca eixe
    principi de proximitat** de l''alumnat en el seu entorn i dificulta les ajudes al menjador, així com
    la llibertat d''elecció. **No es dona prioritat a qui menys recursos té**. Molt al contrari, es prioritza
    a qui no li origina cap problema el desplaçament des del seu lloc de residència dels seus fills i
    filles. Des de CC.OO.PV tenim una **postura crítica i bel·ligerant amb la pujada de les ràtios** en
    l''aula que col·laboren a la reducció d''unitats i professorat.


    L''altra resolució, de 14 de febrer de 2014, en modificar el catàleg d''unitats de centres docents
    públics d''educació infantil i primària, **té com a conseqüència la reducció de 20 unitats** per a
    l''alumnat de tres anys, la qual cosa dificulta la integració i socialització d''este alumnat en edats
    primerenques. Moltes d''estes unitats a més estan localitzades en centres amb línia d''ensenyament
    en valencià, sabent que la seua oferta és deficitària.


    Recorde que les comunitats educatives dels centres docents afectats han expressat en diverses ocasions
    la seua **total oposició a esta mesura** i que el Consell Escolar Municipal va recollir i va rebutjar
    el tancament d''estes unitats educatives.


    En el mateix sentit, pose de relleu que la Comissió de Cultura i Educació d''este Ajuntament, amb
    data 27 de gener de 2014 **va aprovar per unanimitat l''oposició** al tancament d''unitats de tres
    anys indicades durant el curs passat, instant a comunicar a la Conselleria d''Educació, Cultura i
    Esport l''oposició d''este municipi a les mesures de tancament d''unitats infantils de tres anys.
    En el mateix sentit, s''han manifestat reiteradament les associacions de mares i pares de les comunitats
    educatives afectades i la Federació d''Associacions de Mares i Pares de l''Alumnat.


    També instem l''Ajuntament a **posar en marxa els centres municipals** construïts a través del programa
    Educa 3, que mai no han entrat en funcionament, perquè siguen oberts el més prompte possible.


    Per tot això, fem nostra la moció que presenten al Ple les regidores i els regidors dels Grups Municipals
    Socialista, Compromís i EUPV.'
  resum_cas: Representante de CC.OO.PV y Amics de la Malva reclama defensa del derecho a la educación
    pública, criticando el distrito escolar único por romper la proximidad del alumnado, la reducción
    de unidades de infantil de tres años y la falta de inversión en centros públicos, e instando a activar
    los centros del programa Educa 3.
