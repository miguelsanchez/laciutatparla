  entitat: Plataforma La Tortura no es Cultura
  tipus_entitat: plataforma
  idioma_original: castellano
  text_original: 'No soy de esta asociación, ha habido un error. Soy [***], presidente de la Plataforma
    La Tortura no es Cultura.

    Solo quería hacer una pequeña reflexión. Creo que hoy es un día que no recordaremos, espero, pero
    dentro de unos años cuando hayan desaparecido estos crueles espectáculos echaremos la vista atrás
    y nos sorprenderá como siquiera hemos debatido sobre suprimir este anacronismo cultural.

    Una sociedad que aspira a eliminar la violencia no puede tenerla institucionalizada. Porque esto es
    violencia de una manera objetiva, la podemos envolver de grana y de oro pero es violencia.

    El Comité de Derechos del Niño de Naciones Unidas, organización poco sospechosa de radical, separatista
    o animalista, exige que donde aún es legal la tauromaquia apartemos a la infancia de la violencia
    física y mental que esta genera.

    Es nuestra responsabilidad decidir qué sociedad dejamos a la siguiente generación y ahora está en
    su mano adaptar la acción de una administración pública al sentir mayoritario de la ciudadanía, porque
    hasta los defensores de este maltrato saben que esto desaparecerá en muy pocos años. El maltrato a
    los animales por diversión será solo un mal recuerdo para todos y todas.

    Señores y señoras concejalas, solo les pido que hoy no voten a favor de la violencia y voten a favor
    del sentir mayoritario de una sociedad que ya ha rechazado sobre la violencia de los más débiles.

    Decidan ustedes cómo quieren ser recordados, los que intentaron perpetuar la violencia o los que contribuyeron
    a eliminarla y a aportar su granito de arena para dejar cuando ya no estemos una sociedad mejor para
    los que nos sucedan.

    Porque como dijo Immanuel Kant, el corazón de un hombre se mide por el trato que le da a los animales.
    Ahora ustedes decidirán y visibilizarán cómo es su propio corazón.

    Gracias.'
