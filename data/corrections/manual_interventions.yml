  punts_ordre_dia: Reconstrucción DANA
  idioma_original: castellano
  text_original: 'Muy buenos días. Soy Ana Juana Broncano López, vecina de toda la vida de La Torre, y me gustaría ver en
    la señora Catalá la cara amable. Hasta ahora solo la hemos visto en fotos y no se ha asomado en ninguna calle a preguntar
    a los vecinos nada. O sea, realmente no se ha preocupado por el estado psicológico que están padeciendo. Son seis meses,
    son seis meses de nefasta gestión. Y encima nosotros somos personas que ya tenemos la sensibilidad muy dañada por la señora
    Catalá, porque nosotros lo que queremos es ayuda, ayuda. Y nosotros lo que pedimos son recursos. Recursos que los tiene
    el Ayuntamiento. Nosotros somos parte de València, no somos no parte de València. No nos pueden tratar tan injustamente.
    Y menos a las personas mayores que siguen sin poder bajar a la calle, las tenemos que atender. A los niños. En fin, lo
    que son nuestros vecinos y vecinas que lo están pasando muy mal. Usted no va, no se pasea por la calle y ve los ojos vidriosos
    de la gente. Yo sí, porque somos vecinos. Y yo soy de las menos afectadas porque tengo vivienda, pero lo que yo no puedo
    tolerar que a una vecindad tan dañada se la siga dañando tan injustamente. Es nefasto. Y míreme a la cara. ¿Sabe? Póngame
    una cara amable. ¿Vale? Y entonces me va a atender...

    Muy bien, me alegro mucho. Pero si toma nota, que sean hechos.

    Bueno, en primer lugar yo voy a ir por la parte cultural. De toda la vida, que soy de La Torre, tenemos que cruzar para
    aquí, para allá, para realizar nuestras inquietudes. Pues muy bien, yo como hemos estado pasando por el puente de la Solidaridad
    que ha sido una gran alegría para nosotros dentro de lo que nos ha pasado, la catástrofe. Pero una cosa es una catástrofe
    natural y otra cosa es cómo ustedes la están gestionando. Vale, pues entonces como he tenido que ir mucho a San Marcelino
    veo que tiene un centro cultural donde se realizan muchas actividades e inquietudes. Porque nosotros en La Torre también
    tenemos muchas inquietudes, pero lo que no tenemos es centros culturales para la juventud, para nuestros niños, para nuestros
    mayores. Y una biblioteca decente, no un cuchitril como se está creando ahora. Entonces, un centro cultural es muy necesario
    para la convivencia, para la sociabilidad, para que los vecinos y vecinas de La Torre compartamos espacios amables.

    Y luego, La Torre va en crecimiento. Con lo cual también sería necesario tener una escuela infantil municipal para ayudar.
    Bueno, porque tiene que haber, porque no tenemos otra, una pequeñita, y La Torre va en crecimiento. Entonces, necesitamos
    de ese espacio. Y todo lo que digo son competencias municipales. Y luego, por otro lado, ¿por qué no tienen ustedes la
    decencia de poner una piscina municipal? Porque ya de momento nos tenemos que buscar la vida como siempre en las localidades
    cercanas. Incluso yo, cuando estudiaba en el Padre Manjón, una profesora muy preparada mentalmente con el deporte nos
    llevaba a la piscina Vedrí, donde está la Alameda que todo ello lo he vivido. Y entonces teníamos que pasar para arriba,
    para abajo. Y hablo que yo tengo 64 años. También tengo memoria y he vivido muchas cosas. Y sigue el barrio igual, con
    muchas necesidades. Y hágase cargo de lo que es su competencia municipal.

    Y entonces yo creo que este tipo de gestión usted que tiene la responsabilidad, moral ya creo no lo sé si tiene usted
    moralidad porque si tuviera ya hubiera velado por nuestros intereses.

    Respétenos usted a nosotros. Cuando me respeten a mí, yo respetaré.

    Estamos aquí desde las 11:00 de la mañana. No han sido capaces de respetarnos.

    Y yo también a usted que tenga respeto con los ciudadanos de La Torre, que es usted nuestra alcaldesa y no se olvide que
    somos de València. Que parece que seamos un apartheid esto ya.

    Y luego, lo de la piscina municipal y todo lo que he estado solicitando es para que la convivencia familiar, hablo de
    mayores, niños, las familias que van en crecimiento, tengamos sociabilidad, tengamos una vida amable. Y somos parte de
    l''horta y muy contentos. Y tenemos una playa de Pinedo al lado, que yo antes me acuerdo de pequeña iba andando con mi
    madre y mis amiguitos. Ahora no tenemos ni opción de eso. Por lo menos, la piscina municipal es muy importante. Porque
    hace calor en València, ¿verdad? Pues nosotros lo pasamos peor que ustedes. No hay derecho. Y somos de València y queremos
    a València mucho. Quiéranos usted a nosotros.

    Ya está, ya he terminado.'
