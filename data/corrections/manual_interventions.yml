    a través dels segles d''esta gran ciutat**, la nostra ciutat, que en la seua heràldica compta amb
    **la doble L per haver sigut dos vegades lleial a la corona**.


    A esta societat valenciana ens agradaria dirigir-nos, que reflecteix una majoria silenciosa i discreta,
    treballadora, com diu el nostre alcalde, que **valora i reconeix el paper de l''actual cap de l''Estat
    i la monarquia parlamentària com a sistema de govern**, els animem desde ací a **alçar la veu, a mostrar
    amb orgull el seu sentimiento monàrquic àmpliament majoritari**, a deixar de mostrar passivitat davant
    dels atacs davant d''una manera de sentir i concebre la representació institucional, i fer arribar
    a aquells que ostenten el poder, vosotres, que **és obligació i responsabilitat és la de governar
    per a tots i no la de malgastar el temps, els diners, la confiança** de tots aquells als quals han
