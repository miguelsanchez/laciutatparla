  idioma_original: valenciano
  text_original: 'Bona vesprada en nom de BDS País Valencià, que som el grup que hem impulsat aquesta
    moció. Molt breument, només unes paraules d’agraïment, de gràcies. Gràcies perquè amb aquesta moció
    demostrem al món que el poble valencià sempre ha sigut un poble digne, un poble solidari i un poble
    que està per la justícia.


    Gràcies per sumar-nos a la normalitat, a ciutats com Barcelona, com Madrid, com Badalona, com Bolonya,
    com Dublín, que recentment han aprovat mocions de condemna a la violència de l’Estat d’apartheid d’Israel.
    Perquè això normal, humà, és voler que es complisquen els Drets Humans, no voler que s''incomplisquen
    com porta Israel fent 70 anys ja. Gràcies per no donar suport al colonialisme, al racisme, a l’apartheid,
    a l’ocupació militar, per no donar suport al cap i a la fi a la mort sinó donar suport a la vida.


    Gràcies perquè tenim memòria i identitat, i sabem que en la nostra memòria també habiten persones
    jueves i persones musulmanes expulsades de Balansiya, de València, entre 1492 i 1609. Però alguns
    elements del nostre passat també són el present del poble palestí. En alguns aspectes, el nostre passat
    és el present del poble palestí. Som les filles i els fills, les nétes i els néts de les que no pogueren
    matar amb les bombes feixistes, eixes bombes que van caure en aquesta ciutat 442 vegades i en aquest
    ajuntament el 28 de maig de 1937, que era seu del parlament republicà. Som les filles i fills, les
    nétes i els néts dels i de les brigadistes, dones, jueus i àrabs, entre d''altres. Som les filles
    i les nétes de les persones que van acollir persones refugiades durant la Guerra Civil i que en una
    gran quantitat es van haver d''exiliar amb la victòria franquista, per això ara volem una València
    ciutat refugi i volem donar suport a milions de persones acollir refugiades i volem donar suport a
    les milions de persones palestines refugiades que tenen dret a tornar a les seues cases, com demana
    el moviment BDS.


    Gràcies també per donar suport a aquesta moció que va a declarar València Espai Lliure d’apartheid
    Israelià i per la qual València també serà coneguda al món per la seua solidaritat i la seua defensa
    dels Drets Humans. Una campanya, la de BDS i Espai Lliure d’apartheid Israelià, que només vol Drets
    Humans i Dret Internacional per al poble palestí, per a Palestina-Israel, i que ha rebut el suport
    de moltes persones i grups jueus i jueves, moltes persones jueves supervivents de l''Holocaust que
    entonen el no en el meu nom i que van demanar per exemple el boicot a Israel a l’agost de 2014, com
    la filòsofa d’origen jueu Judith Butler, Ken Loach, Roger Waters, el cientific Stephen Hawking i tantes
    altres persones que han donat suport al boicot a Israel. Perquè com diu Richard Falk, ex relator de
    les Nacions Unides, el BDS és l’única eina possible a dia de hui per acabar amb l''apartheid israelià.


    Gràcies també perquè hui, huit anys després de que la primera Flotilla de la Llibertat fora atacada
    (i que portava a bord un periodista valencià, David Segarra), i de que 10 persones que portaven ajuda
    humanitària a Gaza foren assassinades per l’exèrcit israelià, València es posa al costat de la justícia,
    la llibertat i la igualtat. Gràcies perquè aquesta moció ens posa del costat d''Ahed Tamimi, empresonada
    injustament pel règim d''apartheid israelià i que vam dur al País Valencià. Gràcies perquè ens posa
    del costat de les persones LGTBI palestines amenaçades per l''exèrcit israelià si no col·laboren amb
    Israel. Gràcies perquè ens posa del costat de la palestina Hanan Hroub, millor mestra del món, i que
    simbolitza lo que els tirans, els racistes i els genocides no volen que es faça ni que se sàpiga:
    la gran aposta del poble palestí per l''educació, 12 universitats públiques. De pobles com Al Araqib,
    un poble que ha estat destruït per l’exercit israelià més de 120 vegades i que ha tornat a ser reconstruït
    cadascuna d’elles. Gràcies també perquè ens posem del costat de les famílies de les més de 60 persones
    l’últim 14 de maig i les més de 110 assassinades per l’exercit israelià a la Franja de Gaza des del
    30 de març d’aquest any. Gràcies també perquè ens posem del costat de cadascun dels més de 2.000 xiquets
    i xiquetes palestines assassinades per Israel.


    Gràcies perquè amb aquesta moció –i acabe ja– només volem que el poble palestí tinga dret a tindre
    drets. La solidaritat és la tendresa dels pobles i com va escriure el poeta palestí Mahmoud Darwish,
    volem mostrar que València, com Palestina, tenim el que fa que valga la pena la vida. I per això fem
    el que fan les i els presoners, fem el que fem les i els aturats: alimente l''esperança.


    Moltes gràcies.'
