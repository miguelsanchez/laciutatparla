  finding: E1b-6a9e7d99df
  text_val: 'Bon dia.


    Senyor Ribó, vull aprofitar aquests minuts que tinc per demanar-li un favor. **Organitze entre els
    múltiples assessors que té un equip que estiga en contacte amb les associacions de veïns** per a conéixer
    in situ les necessitats de les mateixes, amb la qual cosa s''evitarien molts dels problemes que s''originen.
    Al meu barri hi ha el carrer Xàbia, en el qual en el seu dia es van plantar **24 palmeres**, les quals
    havien de servir perquè aquest carrer fóra **un espai ecològic i agradable**. Però per no posar en
    el seu moment els aros antiratolins, **les palmeres van ser ocupades per les mateixes**, creant molts
    problemes als veïns, ja que algunes d''elles, grimpant per la façana, van arribar a introduir-se en
    diversos pisos. El tema va ser denunciat pel Partit Popular i es va publicar en diversos mitjans de
    comunicació, quedant resolt el problema de **les rates grimpadores**. Ara continuem comptant amb la
    seua presència, igual que amb **una forta plaga de cucs**, però sobre l''asfalt. Hem desallotjat els
    rosegadors, però **les palmeres necessiten una poda urgent**, ja que les branques toquen el sòl, cosa
    que és molesta per als vianants i **una diversió per als gamberros** que aguantem tots els llargs
    caps de setmana, que utilitzen aquesta zona per als seus botellons i juerga, acaben arrancant les
    branques de les palmeres juntament amb altres malifetes, sense que hi haja **cap presència policial
    que ho impedisca o ho sancione**. Un altre tema que es podria solucionar és **la recollida de les
    taronges dels arbres ornamentals** abans que caiguen, perquè a part de la brutícia que originen és
    un perill per als viandants i també per als usuaris del carril bici.


    I per últim, com que no hi ha més temps, demanar-li que **prète més atenció als jardins de Blasco
    Ibáñez**, que són **els més emblemàtics i els pitjor dotats de la ciutat**, ja que no inverteixen
    en ells. Mantinguen-los nets retirant **els milers de fulles mortes** que els cobreixen durant tot
    l''any, afectant també la calçada i les voreres col·indants de la zona. En fi, senyor Ribó, li he
    exposat només tres demandes, però com vosté ben deu de saber són moltes més, i variats els problemes
    i necessitats de tots els barris. Però el més urgent actualment és **eliminar les plagues de rates,
    cucs i mosquits** que envaeixen la ciutat. Per tant, no els concedisca vosté l''estatus d''okupes
    i exterminen-los.


    Moltíssimes gràcies.'
