  text_cas: 'Buenos días. Soy Robert Expósito, vecino de La Torre-Faitanar y con mucho orgullo labrador en la huerta de Faitanar.
    Como mucha gente de esta ciudad, vi mi vida devastada a consecuencia de la DANA. Y como todos en mi barrio, perdí amigos
    y vecinos que, por desgracia, no podremos reconstruir sus vidas. Ellos nunca más volverán.

    Hoy estamos aquí para hablar de reconstrucción, pero desde Faitanar nos preguntamos: ¿Reconstrucción de qué? ¿De unas
    infraestructuras que han matado a mis vecinos?, ¿que han ahogado nuestras vidas? Quizás quieran reconstruir una red de
    agua potable que en Faitanar no tenemos, un alcantarillado que tampoco tenemos. O quizás sea la movilidad, basada en un
    metro que seis meses después nos niega el acceso a la estación. Todos los días cuando vamos a trabajar nos jugamos la
    vida al ir sobre carreteras que se han hundido, en sitios se han reducido un metro de anchura. Estamos hablando de carreteras
    de dos metros y medio. Sí, se asfaltaron después de la DANA algunas carreteras que tenían baches, pero que no implicaban
    riesgo para la vida de las personas. Eso sí, eran muy visibles. ¿Qué tiene que pasar para que esto se arregle?, ¿otra
    desgracia? ¿Tiene que morir alguien para darle solución? Quizás la reconstrucción sea escuchar un poco al ciudadano, saber
    cuáles son sus necesidades y saber lo que está pasando sobre el terreno.

    Lo primero que intentamos reconstruir son nuestras vidas. Si hay una cosa difícil sobre una huerta que en Faitanar seis
    meses después aún no hemos podido regar. Por si faltaba poco, las cosechas que conseguimos salvar nos las están robando.
    ¿Dónde está la guardería rural? Hace meses que no la vemos. ¿Dónde está la Policía Local? Tampoco la vemos. Nuestros campos
    se están convirtiendo en unos vertederos ilegales de escombros, basura y residuos, y este ayuntamiento no actúa. En el
    camino viejo de Picassent junto a la cruz de término hoy en día ya es una escombrera. Llevamos más de seis años denunciándolo
    y no se actúa. Desde la huerta pedimos que se actúe, que se haga algo, que se trabaje. Creo que los cargos que ostentan
    les obliga. Sin esta huerta esta ciudad no existiría. Hay que tomar medidas, poner videovigilancia en los caminos rurales
    que dan acceso a nuestras explotaciones y a nuestras casas, reparar los caminos que implican peligro para la vida de la
    gente, una presencia policial continuada, la retirada de las tasas en Mercavalència a las explotaciones afectadas por
    la DANA. Hay que prevenir la plaga de moscas y mosquitos que se está gestando, porque de aquí unos meses será insoportable.
    Y sobre todo, eliminar las barreras arquitectónicas que nos ahogaron.

    Para acabar, solo haré dos preguntas, señora Catalá, que me gustaría que pudiera contestarme. La primera es por qué este
    ayuntamiento, mi ayuntamiento, no forma parte de la Plataforma por el Soterramiento de las Vías que ahogaron a mis vecinos.
    Y la segunda es por qué aquella fatídica tarde cuando llamábamos desesperados desde Faitanar pidiendo auxilio a la Policía
    Local nos decían: ''Llame usted a la Policía Local de Paiporta''. No sabían ni en qué término estaba Faitanar. Con esto
    finalizaré.'
