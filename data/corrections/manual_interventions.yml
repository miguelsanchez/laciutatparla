  text_cas: 'Buenas tardes en nombre de **BDS País Valenciano**, que somos el grupo que hemos impulsado
    esta moción. Muy brevemente, solo unas palabras de agradecimiento, de gracias. Gracias porque con
    esta moción demostramos al mundo que **el pueblo valenciano siempre ha sido un pueblo digno, un pueblo
    solidario y un pueblo que está por la justicia**.


    Gracias por sumarnos a la normalidad, a ciudades como Barcelona, como Madrid, como Badalona, como
    Bolonia, como Dublín, que recientemente han aprobado mociones de condena a **la violencia del Estado
    de apartheid de Israel**. Porque eso normal, humano, es querer que se cumplan los **Derechos Humanos**,
    no querer que se incumplan como lleva Israel haciendo 70 años ya. Gracias por no dar apoyo al **colonialismo,
    al racismo, al apartheid, a la ocupación militar**, por no dar apoyo al fin y al cabo a la muerte
    sino dar apoyo a la vida.


    Gracias porque tenemos **memoria e identidad**, y sabemos que en nuestra memoria también habitan personas
    judías y personas musulmanas expulsadas de Balansiya, de Valencia, entre 1492 y 1609. Pero algunos
    elementos de nuestro pasado también son el presente del pueblo palestí. En algunos aspectos, nuestro
    pasado es el presente del pueblo palestí. Somos las hijas e hijos, las nietas y nietos de las que
    no pudieron matar con las bombas fascistas, esas bombas que cayeron en esta ciudad 442 veces y en
    este ayuntamiento el 28 de mayo de 1937, que era sede del parlamento republicano. Somos las hijas
    e hijos, las nietas y nietos de los y de las brigadistas, mujeres, judíos y árabes, entre otros. Somos
    las hijas y nietas de las personas que acogieron personas refugiadas durante la Guerra Civil y que
    en gran cantidad tuvieron que exiliarse con la victoria franquista, por eso ahora queremos una **Valencia
    ciudad refugio** y queremos dar apoyo a millones de personas acoger refugiadas y queremos dar apoyo
    a los millones de personas palestinas refugiadas que **tienen derecho a volver a sus casas**, como
    demanda el movimiento BDS.


    Gracias también por dar apoyo a esta moción que va a declarar **Valencia Espacio Libre de apartheid
    Israelí** y por la cual Valencia también será conocida en el mundo por su **solidaridad y su defensa
    de los Derechos Humanos**. Una campaña, la de BDS y Espacio Libre de apartheid Israelí, que solo quiere
    **Derechos Humanos y Derecho Internacional** para el pueblo palestí, para Palestina-Israel, y que
    ha recibido el apoyo de muchas personas y grupos judíos y judías, muchas personas judías supervivientes
    del Holocausto que entonan el no en mi nombre y que pidieron por ejemplo el boicot a Israel en agosto
    de 2014, como la filósofa de origen judío Judith Butler, Ken Loach, Roger Waters, el científico Stephen
    Hawking y tantas otras personas que han dado apoyo al **boicot a Israel**. Porque como dice Richard
    Falk, ex relator de las Naciones Unidas, el **BDS es la única herramienta posible** hoy en día para
    acabar con el apartheid israelí.


    Gracias también porque hoy, ocho años después de que la primera Flotilla de la Libertad fuera atacada
    (y que llevaba a bordo un periodista valenciano, David Segarra), y de que 10 personas que llevaban
    ayuda humanitaria a Gaza fueron asesinadas por el ejército israelí, **Valencia se pone del lado de
    la justicia, la libertad y la igualdad**. Gracias porque esta moción nos pone del lado de Ahed Tamimi,
    encarcelada injustamente por el régimen de apartheid israelí y que llevamos al País Valenciano. Gracias
    porque nos pone del lado de las personas LGTBI palestinas amenazadas por el ejército israelí si no
    colaboran con Israel. Gracias porque nos pone del lado de la palestina Hanan Hroub, mejor maestra
    del mundo, y que simboliza lo que los tiranos, los racistas y los genocidas no quieren que se haga
    ni que se sepa: **la gran apuesta del pueblo palestí por la educación**, 12 universidades públicas.
    De pueblos como Al Araqib, un pueblo que ha sido destruido por el ejército israelí más de 120 veces
    y que ha vuelto a ser reconstruido cada una de ellas. Gracias también porque nos ponemos del lado
    de las familias de las más de 60 personas el último 14 de mayo y las más de 110 asesinadas por el
    ejército israelí en la Franja de Gaza desde el 30 de marzo de este año. Gracias también porque nos
    ponemos del lado de cada uno de los más de 2.000 niños y niñas palestinas asesinadas por Israel.


    Gracias porque con esta moción –y termino ya– solo queremos que **el pueblo palestí tenga derecho
    a tener derechos**. **La solidaridad es la ternura de los pueblos** y como escribió el poeta palestí
    Mahmoud Darwish, queremos mostrar que Valencia, como Palestina, tenemos lo que hace que valga la pena
    la vida. Y por eso hacemos lo que hacen los y las presos, hacemos lo que hacemos los y las parados:
    **alimentemos la esperanza**.


    Muchas gracias.'
