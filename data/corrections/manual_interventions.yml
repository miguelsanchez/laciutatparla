  text_original: 'Bon dia.

    En primer lloc, vull agrair sincerament a totes les persones que hui esteu ací, escoltant i debatent
    de manera proactiva. Però les meues paraules van adreçades especialment a aquelles persones que, per
    desgràcia, no es troben ací físicament perquè han abandonat la sala o només estan de cos present,
