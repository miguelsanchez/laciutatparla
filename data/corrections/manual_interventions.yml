  entitat: Associació de Mares i Pares d'Alumnes el Saler
  tipus_entitat: educacio
  idioma_original: castellano
  text_original: Buenas tardes a todos y a todas. Muchísimas gracias por darnos la oportunidad de estar
    aquí y nosotras, como comentaba mi compañera, pertenecemos al IES, al AMPA del Saler, y estamos desde
    septiembre en una lucha con todas las administraciones que sabemos y podemos. Y sobre todo esto es
    un tema educativo, no es un tema político. Por eso venimos aquí donde están ustedes todos representándonos
    y lo que queremos es que nos echen una mano. Como decía mi compañera, de hecho es imposible teletrabajar.
    Yo a mucha honra también soy empleada pública, no he podido contribuir a una administración segura
    porque no me ha permitido poder teletrabajar desde mi casa. Pero entre otras cosas soy educadora y
    orientadora laboral, y lo que creo es que necesitamos alumnado del siglo XXI donde sus competencias
    son eminentemente digitales. Tenemos un sistema, tenemos financiaciones que se están haciendo desde
    aquí desde los grupos políticos, con docentes que han estado en una pandemia trabajando día y noche
    buscando recursos educativos que ahora va y resulta que nosotros desde la Devesa nuestro alumnado
    no puede acceder. Entonces, eso es lo que les pedimos, que tengamos alumnos del siglo XXI que no solamente
    tienen que memorizar sino que tienen que tener competencias digitales y todo tipo de profesionales,
    que tienen que hacer cursos a distancia, que tienen que consultar videos. Solo llegar aquí hoy ha
    sido una odisea. Ayer tardamos tres horas en mandar la solicitud telemática y poder anexar los documentos,
    pero es que hoy hemos venido y ni tan siquiera hemos podido imprimir el justificante que enviamos
    ayer. Entonces, les pedimos de verdad, no sabemos ya ni cómo ni dónde, les agradecemos muchísimo,
    muchísimo que nos estén escuchando y queremos que luchen por nosotros con las telecomunicaciones o
    con quien sea para hacer de la Devesa un lugar muchísimo más agradable del que está siendo todavía
    y en el que están invirtiendo un montón ustedes de esfuerzo y de dinero. Muchísimas gracias.
  reason: Acta shows a second AMPA el Saler speaker ('pertenecemos al IES, al AMPA del Saler') not extracted.
  date: '2026-10-20'
  finding: E1b-b227b7ac05
  text_val: 'Bones tardes a tothom i a totes. Moltíssimes gràcies per donar-nos l''oportunitat d''estar
    ací i nosaltres, com comentava la meua companya, pertanyem a l''IES, a l''AMPA del Saler, i estem
