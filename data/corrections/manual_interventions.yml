- id: 2025-04-11-3-101
  pleno_id: 2025-04-11-3
  ordre: 3
  intervinient: Manuel Folgado Pedrós
  entitat: Associació Cultural i de Consumidors Patraix
  tipus_entitat: cultural
  barri_o_zona: Faitanar, La Torre
  punts_ordre_dia: Reconstrucción DANA
  idioma_original: castellano
  text_original: 'Buenos días, señora alcaldesa, concejales del Ayuntamiento de València. En primer lugar agradecer a la Asociación
    Vecinal de Patraix por poder participar en esta sesión extraordinaria. Y también aprovecho que la última vez que estuve
    aquí comentando, también a la Asociación de La Torre que se me pasó por los nervios, disculpad.

    Me voy a centrar un poquitín en lo que es la zona de Faitanar. Yo soy vecino, soy hijo de agricultores, he sido agricultor
    hasta prácticamente hace 15-20 años y sigo teniendo tierra en la zona de Faitanar. Comentar simplemente que la huerta
    se sigue degradando año tras año, década tras década. Se va viendo parcelas abandonadas, caminos rurales sin espacio para
    circular los peatones, los vehículos, muy mala iluminación, poste de luz y de teléfono a punto de caerse, que ya se comentó
    en el anterior pleno que estuvimos aquí y a fecha de hoy todavía no se ha podido actuar. Entiendo que hay cosas más importantes,
    pero sí que nos gustaría a los vecinos de allí que se fuera gestionando.

    Sobre todo después de la dana, también indicar que las parcelas agrícolas están todavía sin riego, prácticamente son cinco
    meses y medio, lo que es riego de agua de río o de las depuradoras. Sí que es cierto que mantenemos con pocos socios lo
    que son motores de riego que con mucho esfuerzo lo hicieron nuestros abuelos y con ello estamos salvando lo que son los
    cultivos, tanto de hortalizas como de frutales. Comentar también en cuanto un poco a esta ley de protección de la huerta
    que quizás aprieta demasiado. Hoy nos acompaña con nosotros también una vecina que es Amparo. Ella tiene 78 años, todavía
    conduce muy bien. Está la verdad que muy bien ella. Pero tiene un problema ahora con unos vecinos que se han instalado
    allí y ahora no tienen dónde dejar su vehículo, vehículo que todos en la ciudad tenemos parking público, privado, arcén
    donde dejarlo, transporte público donde llegar. Ella no quiere, ella solamente quiere seis, diez metros cuadrados donde
    dejar su coche. ¿No puede dejar unos bolos? Es mi pregunta. A cambio, ella con sus sobrinos, con los nietos, sigue cultivando
    allí. Tiene una parcela de unos 6.000 metros. Y sería un trueque, de seis metros, diez metros cuadrados a cambio de 6.000
    metros. ¿Vale la pena? Creo que sí que vale la pena.

    Obviamente, como ha dicho Roberto, también agricultor, vecino y amigo, sí que es cierto que la presencia policial no existe
    prácticamente, puntualmente. Pero eso nos haría falta también a nosotros, también somos ciudadanos de allí y es difícil
    vivir en lo que es, bueno, vecinos, sin una protección que pase por allí de forma disuasoria. También para nuestras casas
    y sobre todo para las cosechas también. Nos falta un espacio de movilidad entre lo que es La Torre y València Sud. No
    tenemos arcén. Es un peligro eso. Hay momentos que para salir de la carretera a la zona donde está la gasolinera Texaco
    te puedes tirar cinco o diez minutos a las horas punta. No puedes ni acceder con el coche, cruzar la carretera. Imaginaos
    los peatones que tengan que venir desde La Torre a Faitanar a coger el metro. Que por cierto, como ha dicho Roberto, todavía
    seguimos sin arcén. Tenemos que dar toda la vuelta a pie, cerca de 40 minutos andando. Obviamente ahora hace buen tiempo,
    pero tiempo atrás hemos estado con lluvias y por la tarde a las 06:30 era de noche. Todos buscamos creo que es ese bienestar.
    Condiciones básicas como es el agua potable, no tenemos. Luz también. Luz, que a la una de la noche sigamos teniendo luz
    en las calles. Tampoco la tenemos porque son solares. Alcantarillado, tampoco lo tenemos. Esto lo que hace que nuestros
    mayores que han vivido allí vayan yéndose o bien a residencia o a casa de sus hijos. Y los jóvenes no creo que vayamos
    por allí sin estas condiciones mínimas.

    Debemos de integrar estas actividades, además de integrar lo que son actividades dentro de ese marco agrícola. Atraer
    a la población a estos espacios fomentando la agricultura y actividades que puedan convivir sirviendo de esparcimiento
    a la ciudad. Actividades vinculadas con la naturaleza, zonas verdes donde nuestras familias puedan convivir. Crear jardines
    dentro de esos espacios. Hay espacios muy abandonados allí. ¿Por qué no crear zonas verdes donde podamos salir? Hablamos
    de la huerta de la ciudad. Y por qué no de la ciudad a la huerta, disfrutando de estos espacios, incluso donde poder comer
    una paella con la familia, con los amigos, a traer la ciudad a la huerta y no estar reñidos como a veces nos sentimos
    nosotros. Una conversión de esas parcelas abandonadas a zonas verdes. Actividades como algunos restaurantes que hoy en
    día tenemos en medio de la huerta, que tengan su propia cosecha hortícola, que se los obligue de alguna forma y eso es
    kilómetro cero.

    Sí, alcaldesa. Un segundo. Ruego que estudien esa viabilidad real de la huerta adaptada a nuestra sociedad actual, en
    un estado de bienestar y esa forma de acercar la ciudad a la huerta. Y sí que quiero resaltar también la figura que viene
    realizando el Consell Agrari en mantener una cierta preocupación por la huerta de esas vivencias y sobre todo, evitar
    conflictos entre vecinos. Es un buen mediador esta persona y con ello nos ayuda bastante, a parte de todas las gestiones
    que se vienen realizando.

    Gracias.'
