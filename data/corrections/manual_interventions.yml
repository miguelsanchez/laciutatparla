  text_original: 'Hola, buenos días.


    Soy [***] y vengo como representante de la AMPA del CEIP Sector Aéreo, de Valencia.


    La Conselleria de Educación suprimió en este curso 2014-2015 una unidad de infantil de 3 años de las
    dos que tenemos en el CEIP Sector Aéreo. Esperábamos que para el curso 2015-2016 esta unidad fuera
    restablecida, pero se nos comunicó que nuevamente se vuelve a suprimir. Esto implica que en los próximos
    años irá desapareciendo una unidad por curso, afectando también a primaria.


    Nuestro colegio se encuentra situado en la calle Santa Cruz de Tenerife nº 1, al lado del parque del
    Oeste. Dispone de un solar de más de 30.000 m2, donde se encuentra el edificio del colegio, el cual
    cuenta con 18 amplias aulas para educación infantil y primaria con luz natural. La mayoría cuenta
    con cañón proyector, muchas de ellas con PDI y todas ellas con calefacción y aire acondicionado para
    el bienestar de nuestros hijos, dos aulas de informática, dos de inglés, aula de música y audiovisuales
    y biblioteca, amplios patios para educación infantil y primaria, grandes instalaciones deportivas
    -frontón, cancha de tenis, dos campos de fútbol, baloncesto…-, edificio del comedor con cocina propia
    y un huerto escolar, pionero en la zona, donde el alumnado participa activamente a lo largo de todo
    el curso.


    Se realizan distintas actividades extraescolares deportivas, lúdicas y culturales, y escuela de padres.
    Este curso hemos entrado en el proyecto Sport and Trops, participando en la competición provincial
    este pasado fin de semana.


    La AMPA del Sector Aéreo formamos parte de la Coordinadora de Educación 3F a la cual pertenecen también
    otras AMPA de varios colegios del barrio, la Asociación de Vecinos 3 Forques-Vara de Quart, Escuela
    Musical 3 Forques, Escuela Musical Tradicional y Amesti. En este colectivo estamos muy sensibilizados
    con la defensa de una educación pública y de calidad, lo que significa que vamos a estar todo el barrio
    de Tres Forques unidos para luchar por ello. Este colegio es piedra angular en la cohesión del barrio
    por su singularidad, características y equitación del espacio.


    Tenemos un proyecto de escuela abierta y por eso se pudo realizar este pasado sábado en el patio de
    nuestro colegio la I Trobada de la Infancia, la cual fue un éxito. La eliminación de la unidad supondría
    desaprovechar las instalaciones de este centro por ser la base de las relaciones entre nuestro barrio
    y con barrios cercanos.


    El objetivo de esta petición es que el Ayuntamiento de Valencia intermedie en la decisión de Conselleria
    de Educación para que se mantengan las líneas en 1º de Infantil del CEIP Sector Aéreo, de Valencia.


    Muchas gracias por escucharnos.'
  date: '2026-10-20'
