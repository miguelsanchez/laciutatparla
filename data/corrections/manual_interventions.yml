- id: 2026-04-30-102
  pleno_id: '2026-04-30'
  ordre: 7
  intervinient: Vicente José Pizcueta Capuz
  entitat: Asociación de Ocio de Hosteleros de los Barrios de València
  tipus_entitat: empresa
  idioma_original: castellano
  text_original: 'Buenos días.


    El 30 de abril va a quedar para el turismo, la cultura, las pymes del ocio y de la hostelería de València
    como una fecha marcada en rojo en el calendario. Han pasado 30 años y cinco ZAS del Partido Popular
    sin que hayamos aprendido, mejor dicho, sin que el Partido Popular haya aprendido que la lucha contra
    el ruido es algo de la que todos somos corresponsables. Paradójicamente, es el ruido del ocio el único
    ruido que preocupa en la ciudad. Y particularmente el ruido de las pymes, que no existe, que tal y
    como se ha dicho están perfectamente insonorizadas.


    Después de esos 30 años en esta legislatura, teniendo en cuenta modificaciones legislativas que se
    produjeron en la Ordenanza en la anterior legislatura, se obliga al Ayuntamiento para tramitar una
    ZAS a algo fundamental y es a poner en marcha medidas preventivas para luchar contra el ruido y no
    para luchar contra la hostelería. Eso se introdujo en la Ordenanza de Contaminación Acústica en el
    2023, porque lo que no podía ser es que un ayuntamiento al que se le condenara en los tribunales terminara
    arruinando empresas por no ser capaz de diseñar un plan de choque contra el ruido.


    Ese plan de choque se ha puesto en marcha esta legislatura, lo ha financiado el propio Ayuntamiento
    de València. Se han hecho ensayos científicos para valorar las moquetas, las señales luminosas, las
    membranas fonoabsorbentes. Hemos hecho cosas en València que están observando desde el resto de las
    capitales españolas. Se han hecho cursos de formación para controladores de acceso. Se ha implantado
    la figura de la mediación social de los silenciadores, que se han hecho populares. Y que ahora, como
    están pagados por las empresas, porque evidentemente la financiación es privada, van a desaparecer
    de las calles de València. Por supuesto, de Ruzafa.


    Todas esas medidas que se han puesto en marcha por culpa del desastre de la gestión de los festivales,
    en 15 días se saca de un cajón y sin evaluar, algo básico, evaluar el nivel acústico anterior y posterior
    al que se pusieron en marcha unas medidas pioneras en toda Europa, de repente, en 15 días se liquida
    todo este proceso, toda esta ilusión, todo este esfuerzo que han venido haciendo las empresas de Ruzafa
    sabiendo que estamos ante el barrio que es imagen de marca y ejemplo del estilo de vida de València.
    Pues bien, todo eso se dinamita.


    Hoy esperemos que aún Vox, que ha venido diciendo que quieren hacer cosas diferentes y no le preocupan
    tanto las sillas que ocupa, que no ve cobertura a una infamia como pueda ser el torpedear todo un
    trabajo de diálogo, de colaboración público-privada, de estar con los vecinos reunidos con el Ayuntamiento,
    porque fue la propia alcaldesa la que dio pistoletazo de salida a este nuevo modelo de cogobernanza.
    Todos son palabras.


    Pero aquí hay un problema y el problema es que lo vamos a ver el día siguiente que entre en vigor
    esta ZAS. Y lo vamos a ver porque resulta que se obliga a cerrar las discotecas a las 04:30. Aquí
    nadie hace sus deberes. O sea, a las 04:30 una discoteca está a reventar. En un año de mediciones,
    en un año de mediciones solo hay 13 superaciones puntuales de ruido, 13. Son los datos del propio
    Ayuntamiento. Trece superaciones puntuales de ruido a partir de las cuatro de la mañana, que es la
    actividad de las discotecas, trece.


    A partir del día que entre en vigor la ZAS va a haber superaciones todos los días que abran las discotecas,
    porque evidentemente tendrán que trabajar. ¿O es que esto de la ZAS es toda una trampa para arruinar
    empresas, como vimos en Xúquer, en Woody, en Juan Llorens y en el barrio del Carmen? ¿No aprendemos
    nada? Ponemos en marcha un plan de medidas que de verdad estaba dando resultados. Que se está observando
    en Madrid y en Barcelona, nada más y nada menos, sobre cómo hacíamos las cosas en València. Y en 15
    días, en 15 días nadie había oído hablar de la ZAS. Y no creo que el hacer mediciones durante dos
    meses para comprobar si esas decisiones estaban dando resultados hubiera sido valioso.


    Y termino. Vamos a pasar de 13 superaciones acústicas a 110 superaciones acústicas, que las vamos
    a medir nosotros. Desde el primer día las vamos a medir nosotros. Eso quiere decir que los vecinos
    van a sufrir un 800 % más de días de ruido de lo que estaban sufriendo en un barrio ejemplar, de una
    población de nivel medio adulto perfectamente integrada, que realmente hemos podido conseguir resultados
    inimaginables para proteger la imagen turística de València. Y la crisis de los festivales se nos
    ha llevado por delante.


    No me alargo más, pero espero que Vox aún no salve de esto.'
  reason: Introduced as 'Vicente José Pizcueta Capuz (Asociación de Ocio y Hostelería de los Barrios de
    Valencia)' in the ZAS citizen section; speech not extracted.
