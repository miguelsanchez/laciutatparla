  text_cas: ''
  text_val: 'Bon dia, senyora alcaldessa, regidors de l''Ajuntament de València. En primer lloc agrair a l''Associació Veïnal
    de Patraix per poder participar en esta sessió extraordinària. I també aprofite que l''última vegada que vaig estar ací
    comentant, també a l''Associació de La Torre que se''m va passar pels nervis, disculpeu.

    Me centraré un poquet en el que és la zona de Faitanar. Jo sóc veí, sóc fill d''agricultors, he sigut agricultor fins
    pràcticament fa 15-20 anys i seguisc tenint terra a la zona de Faitanar. Comentar simplement que l''horta es seguix degradant
    any rere any, dècada rere dècada. Es van veient parcel·les abandonades, camins rurals sense espai per a circular els vianants,
    els vehicles, molt mala il·luminació, pals de llum i de telèfon a punt de caure, que ja es va comentar en l''anterior
    ple que vam estar ací i a data de hui encara no s''ha pogut actuar.

    Sobretot després de la dana, també indicar que les parcel·les agrícoles estan encara sense reg, pràcticament són cinc
    mesos i mig. Mantenim amb pocs socis el que són motors de reg que amb molt d''esforç ho van fer els nostres avis i amb
    això estem salvant els cultius. Cal estudiar la viabilitat real de l''horta adaptada a la nostra societat actual i acostar
    la ciutat a l''horta.

    Gràcies.'
  resum_cas: Vecino de Faitanar denuncia la degradación de la huerta tras la DANA, la falta de riego, agua potable, alcantarillado,
    iluminación y presencia policial, y pide integrar actividades que acerquen la ciudad a la huerta.
  resum_val: Veí de Faitanar denuncia la degradació de l'horta després de la DANA, la falta de reg, aigua potable, clavegueram,
    il·luminació i presència policial, i demana integrar activitats que acosten la ciutat a l'horta.
  source: manual
- id: 2025-04-11-3-102
  pleno_id: 2025-04-11-3
  ordre: 6
  intervinient: Maria Aniuska Dolz Sánchez
  entitat: AMPA CP Padre Manjón
  tipus_entitat: educacio
  barri_o_zona: La Torre
  punts_ordre_dia: Reconstrucción DANA
  idioma_original: castellano
  text_original: 'Buenos días a todas y a todos. En primer lugar, dar las gracias a todas las asociaciones y entidades que
    nos han cedido su turno de palabra para estar hoy aquí. Personalmente si algo bueno he sacado de esta situación es la
    estrecha relación que tenemos actualmente con muchas de las asociaciones vecinales que nos ayudaron en un primer y siguientes
    momentos, especialmente con mis compañeras más afectadas de Castellar y Forn d''Alcedo, pero haciendo extensible al resto
    de pedanías de Pobles del Sud y el resto de València.

    Cada mes, desde octubre del año pasado nos preguntan cómo se encuentra La Torre, qué necesidades tiene, qué falta por
    arreglar. ¿Se puede hablar de normalidad? No, no se puede hablar de normalidad. Después de casi seis meses, este ayuntamiento
    no ha resuelto las necesidades importantes que hemos transmitido en las reuniones. Habéis hecho cosas, no lo puedo negar.
    Sobre todo en casos particulares. Pero seguimos repitiendo la misma retahíla de carencias en cada encuentro. Más bien
    la situación ya estaba mal antes de la dana y queréis dejar las cosas como estaban. Ya no nos conformamos con eso. Queremos
    La Torre versión 2.0. Esto no es posible si no se realizan inversiones en nuestra pedanía. No podemos depender siempre
    de ayudas externas. Hablo, entre otras cosas, de los famosos EDIL. El propio Ayuntamiento de València debe asumir la parte
    que le corresponde y actuar en consecuencia.

    Hace unas semanas tuvimos tres días de alerta por fuerte temporal. Colegio cerrado, centro de mayores y alcaldías cerrados,
    pendientes del caudal del famoso barranco del Poyo. Todo el mundo con el miedo en el cuerpo. Afortunadamente solo fue
    un susto. Si se llega a repetir la circunstancia del 29 de octubre el mal en La Torre hubiese sido el mismo, desearía
    que sin víctimas mortales esta vez. No se ha hecho nada en todo este tiempo que pueda evitar que vuelva a pasar. Los principales
    agravantes de la situación siguen estando. Por ejemplo, las vías del tren y el nuevo cauce del río. ¿Tenemos que sufrir
    esa incertidumbre cada vez que llueva en alguna parte de València? La salud mental de muchas vecinas y vecinos está al
    límite. ¿Qué seguridad pueden tener que no vuelva a pasar? Necesitamos acciones preventivas desde antes de ayer.

    Las propuestas de las vecinas y vecinos de La Torre las tienen bien descritas en la moción que ha presentado el Grupo
    Compromís y seguramente sean las mismas que tengan en los talleres de participación para la agenda de reconstrucción de
    las pedanías afectadas por la dana que está llevando a cabo este ayuntamiento. Solo pedimos a la hora de decidir se cuente
    con la participación real de todos los implicados: administraciones, vecinas y vecinos, técnicos, expertos, etcétera.

    Por último, les pido un favor. Que cambien la famosa frasecita de: ''El Ayuntamiento de València ha asumido a pulmón''.
    Que con un presupuesto de casi 1.400.000.000 euros sobra ese dramatismo. A pulmón lo que llevan haciendo hace meses las
    personas que viven en plantas bajas dañadas, los daños de pequeños comercios afectados, los inquilinos que apenas pueden
    pagar el alquiler o los vecinos que no pueden hacer frente a la reparación de sus ascensores y garajes a la vez.

    Muchas gracias.'
  temes:
  - dana_emergencies
  - educacio
  - participacio_ciutadana
  - barris
  - infraestructures
  text_cas: ''
  text_val: 'Bon dia a totes i a tots. En primer lloc, donar les gràcies a totes les associacions i entitats que ens han cedit
    el seu torn de paraula per a estar hui ací. Cada mes, des d''octubre de l''any passat ens pregunten com es troba La Torre,
    quines necessitats té, què falta per arreglar. Es pot parlar de normalitat? No, no es pot parlar de normalitat. Després
    de quasi sis mesos, este ajuntament no ha resolt les necessitats importants que hem transmés en les reunions. Volem La
    Torre versió 2.0. Això no és possible si no es realitzen inversions a la nostra pedania. No podem dependre sempre d''ajudes
    externes. El propi Ajuntament de València ha d''assumir la part que li correspon i actuar en conseqüència.

    Fa unes setmanes vam tindre tres dies d''alerta per fort temporal. Col·legi tancat, centre de majors i alcaldies tancats,
    pendents del cabal del famós barranc del Poyo. Tot el món amb la por al cos. No s''ha fet res en tot este temps que puga
    evitar que torne a passar. Necessitem accions preventives des d''abans d''ahir.

    Per últim, els demane un favor. Que canvien la famosa fraseta de: ''L''Ajuntament de València ha assumit a pulmó''. Que
    amb un pressupost de quasi 1.400.000.000 euros sobra eixe dramatisme. A pulmó el que porten fent fa mesos les persones
    que viuen en plantes baixes danyades, els danys de xicotets comerços afectats, els inquilins que a penes poden pagar el
    lloguer o els veïns que no poden fer front a la reparació dels seus ascensors i garatges alhora.

    Moltes gràcies.'
  resum_cas: Representante del AMPA del CP Padre Manjón denuncia que seis meses después de la DANA nada ha cambiado en La
    Torre, exige inversiones reales y acciones preventivas ante futuras riadas.
  resum_val: Representant de l'AMPA del CP Pare Manjón denuncia que sis mesos després de la DANA res ha canviat a La Torre,
    exigeix inversions reals i accions preventives davant futures riuades.
  source: manual
- id: 2025-04-11-3-103
  pleno_id: 2025-04-11-3
  ordre: 7
  intervinient: Mª Isabel Collado Villagrasa
  entitat: Associació Cuidem la Raïosa
  tipus_entitat: av
  barri_o_zona: La Torre
  punts_ordre_dia: Reconstrucción DANA
  idioma_original: castellano
  text_original: 'Buenos días. Gracias por este pleno extraordinario, muy necesario. Bueno, gracias no. Ha sido una obligación,
    desgraciadamente. Quiero comunicarles que ayer vinieron a La Torre para hablarnos del fondo EDIL y nos quedamos muy sorprendidos
    que aún están preparando el EDIL Dana y que se pidió el EDIL València primero. Pero no estamos en el EDIL València. ¿Por
    qué? No lo entendemos muy bien porque somos València. El código postal 46017, València. Pero vivimos pasado el cauce del
    río, que eso por lo visto ha creado una barrera y que poco importa al Ayuntamiento central lo que pase detrás de esa barrera.

    Pues lo que pasó es que una noche vino tanta agua y tanto barro que murieron muchos vecinos. Y los que seguimos en vida
    hemos tenido que luchar con todas nuestras fuerzas contra el barro, contra la inclemencia. Hemos tenido que ir a comprar
    ropa, ropa interior, zapatos a nuestros vecinos que no tenían nada, darles de comer y ayudarlos. Muchos meses. Yo crucé
    el primer día el puente para ir a comprar mangueras, para ir a comprar ropa interior para mis vecinos y estaba la Policía
    ahí en masa. Y yo pregunté: ''¿Pero qué os ocurre?'', ''No tenemos orden, no podemos pasar a ayudar''. Eso fue horroroso.
    A la vuelta sí que no subí nada cargada porque soy una persona mayor y en el puente ayudaron mucha gente joven que ya
    venía a ayudar. Pero la Policía, los Bomberos, etcétera, vinieron a ayudar dos o tres días después. Estábamos completamente
    solos.

    Luego empezaron a venir las ayudas. En la alcaldía se pusieron cosas, pero sin ningún control. Me ofrecí porque yo he
    trabajado toda mi vida en transporte internacional y logística. Fui a hablar con la alcaldía y les dije: ''Va a haber
    abusos. Necesitáis una hoja Excel o un programa''. Y me dijeron que no necesitaban mi ayuda, que quién era yo, que ellos
    tenían estudios. Y me estuve paseando de la parroquia a la alcaldía y de la alcaldía a la parroquia todo un día pidiendo
    que por favor entrelazaran datos y no lo hicieron.

    Entonces, como ayer vinieron del Ayuntamiento a decirnos que van a participar con nosotros qué es lo que queremos. Queremos
    ayuda, no queremos política. No hacemos política en la asociación de vecinos. Pero mucha pena y profunda. Hace falta mucho
    dinero para reconstruir después de una riada y pedimos lo que ya pedíamos hace muchos años: autobús, estación en València
    Sud, viviendas asequibles, un centro cultural y deportivo digno, escuelas infantiles. Y deporte, sobre todo deporte, que
    solamente hay fútbol. Se ha corrido a instalar el fútbol y no hay más deportes en La Torre, y nuestros jóvenes se tienen
    que ir fuera. Tenemos espacio ahora para hacer centro cultural y deportivo. Y es lo que pedimos, que por favor nos hagan
    caso y dejen de hacer política en este pleno. Y ayuden de verdad a la gente.'
  temes:
  - dana_emergencies
  - serveis_socials
  - infraestructures
  - cultura
  - esports
  - barris
  text_cas: ''
  text_val: 'Bon dia. Gràcies per este ple extraordinari, molt necessari. Bé, gràcies no. Ha sigut una obligació, desgraciadament.
    Vull comunicar-los que ahir van vindre a La Torre per a parlar-nos del fons EDIL i ens vam quedar molt sorpresos que encara
    estan preparant l''EDIL Dana i que es va demanar l''EDIL València primer. Però no estem en l''EDIL València. Per què?
    No ho entenem molt bé perquè som València. El codi postal 46017, València. Però vivim passat el llit del riu, que això
    pel que es veu ha creat una barrera i que poc importa a l''Ajuntament central el que passe darrere d''eixa barrera.

    Doncs el que va passar és que una nit va vindre tanta aigua i tant de fang que van morir molts veïns. I els que seguim
    en vida hem hagut de lluitar amb totes les nostres forces contra el fang. Hem hagut d''anar a comprar roba, roba interior,
    sabates als nostres veïns que no tenien res, donar-los de menjar i ajudar-los.

    Volem ajuda, no volem política. Fa falta molts diners per a reconstruir després d''una riuada i demanem el que ja demanem
    fa molts anys: autobús, estació a València Sud, vivendes assequibles, un centre cultural i esportiu digne, escoles infantils.
    I esport, sobretot esport, que sols hi ha futbol. I és el que demanem, que per favor ens facen cas i deixen de fer política
    en este ple. I ajuden de veritat a la gent.'
  resum_cas: Vecina de La Torre denuncia el abandono de las pedanías del sur tras la DANA, la falta de coordinación en la
    gestión de ayudas, y reclama transporte, viviendas asequibles, centro cultural y deportivo.
  resum_val: Veïna de La Torre denuncia l'abandó de les pedanies del sud després de la DANA, la falta de coordinació en la
    gestió d'ajudes, i reclama transport, vivendes assequibles, centre cultural i esportiu.
  source: manual
- id: 2025-04-11-3-104
  pleno_id: 2025-04-11-3
  ordre: 8
  intervinient: Andrés Eduardo Valverde Gil
  entitat: Associació Cuidem la Raïosa
  tipus_entitat: av
  barri_o_zona: La Torre
  punts_ordre_dia: Reconstrucción DANA
  idioma_original: castellano
  text_original: 'Buenos días, señora alcaldesa. Buenos días para todos. Como podrán notar, no soy español, pero he sufrido
    la dana como cada uno de los que habitamos allá. El tema que a mí me duele un poco es el tema de la vivienda. La vivienda
    es algo que literalmente nos está matando y perdón por la palabra, pero es que esta semana estuve viendo un podcast de
    un influencer inmobiliario donde prácticamente está queriendo vender València y resume que las personas que no tenemos
    los recursos salgamos de València. Vale, me ha tocado salir de València. Luego, vayamos a las pedanías del sur. Vale,
    estoy en las pedanías del sur. Pero busco en Idealista y no hay viviendas de 800 euros. Cada vez la vivienda si cogemos
    la media está en 1.600, si cogemos la mediana está en 1.200. No nos vamos a reír con la moda. Ahora el tema es los derechos
    fundamentales y los derechos rectores. Sabemos que el tema de la vivienda es un derecho rector, pero el artículo 47, el
    artículo 43, todos estos se ven afectados porque no se protege a las viviendas y a las familias. Las familias con hijos,
    los jóvenes, las personas de bajos ingresos, los adultos mayores no pueden competir con personas que vienen y pagan 12
    meses de renta, 12 meses de alquiler. No podemos competir. Ahora soy una persona relajada, 6 meses, con posible a 12 meses.
    No sabemos qué va a pasar con nosotros. Seguramente el Ayuntamiento me va a tener que desahuciar porque no tenemos otra
    opción.

    Y termino con esto, en la vivienda social he hecho solicitudes. En EVAH, dos veces. En AUMSA. Y el realojo. ¿Cuál de esos
    cuatro me han servido? Gracias a Dios estoy aquí parado y gracias a una gastroenteritis de mi hija, porque si no hubiese
    ido a mercar a Carrefour a las siete de la tarde y hoy no estuviera aquí reclamando una vivienda, sino que estuviera en
    la lista de los afectados. Culmino, la falta de interés en el tema de la vivienda es complicado porque nos estamos llenando
    de inversión extranjera e inversión nacional. Y todo eso con el tema de la burocracia no podemos competir.

    Muchas gracias.'
  temes:
  - dana_emergencies
  - habitatge
  - barris
  text_cas: ''
  text_val: 'Bon dia, senyora alcaldessa. Bon dia per a tots. Com podran notar, no sóc espanyol, però he patit la dana com
    cadascun dels que habitem allà. El tema que a mi em dol un poc és el tema de l''habitatge. L''habitatge és una cosa que
    literalment ens està matant. Les famílies amb fills, els joves, les persones de baixos ingressos, els adults majors no
    poden competir amb persones que vénen i paguen 12 mesos de renda, 12 mesos de lloguer. No podem competir. Ara sóc una
    persona reallotjada, 6 mesos, amb possible a 12 mesos. No sabem què passarà amb nosaltres.

    En l''habitatge social he fet sol·licituds. En EVAH, dos vegades. En AUMSA. I el reallotjament. Quin d''eixos quatre m''han
    servit? Gràcies a Déu estic ací dret i gràcies a una gastroenteritis de la meua filla, perquè si no haguera anat a comprar
    a Carrefour a les set de la vesprada i hui no estiguera ací reclamant un habitatge, sinó que estiguera en la llista dels
    afectats.

    Moltes gràcies.'
  resum_cas: Vecino migrante de La Torre denuncia la crisis de vivienda agravada por la DANA, la imposibilidad de competir
    en el mercado inmobiliario y la ineficacia de las solicitudes de vivienda social.
  resum_val: Veí migrant de La Torre denuncia la crisi d'habitatge agreujada per la DANA, la impossibilitat de competir al
    mercat immobiliari i la ineficàcia de les sol·licituds d'habitatge social.
  source: manual
- id: 2025-04-11-3-105
  pleno_id: 2025-04-11-3
  ordre: 9
  intervinient: Ikram Boulghoudan
  entitat: Jóvenes hacia la Solidaridad y el Desarrollo
  tipus_entitat: ong
  barri_o_zona: València
  punts_ordre_dia: Reconstrucción DANA
  idioma_original: castellano
  text_original: 'Buenos días. Y aquí estamos. Exigimos justicia, transparencia y un poco de respeto. La clase política debe
    estar a la altura. Basta ya de discursos populistas que alimentan a la extrema derecha. Basta ya de usar a las personas
    migrantes como moneda de cambio para pactos presupuestarios. Y además venimos a exigir algo que debe ser obvio, la regularización
    inmediata y sin excepción para todas las personas afectadas por la dana. Porque hay barreras extraculturales que impiden
    esa protección, como el padrón. Qué alternativa tiene una persona migrante sin contrato escrito ni padrón fijo, aunque
    lleve años trabajando y viviendo aquí. Acompañamos hoy a más de 40 jóvenes en situación administrativa irregular que vivían
    en los municipios más afectados y que hoy no pueden optar la regularización porque tenían contratos verbales. ¿De verdad
    estas personas no son víctimas? ¿De verdad no merecen protección ni reparación? Nosotras sí estuvimos, nos organizamos,
    actuamos. Y por eso hoy decimos alto y claro: Regularización ya, reconocimiento ya, justicia ya. No vamos a permitir que
    sigan señalando a quienes han salvado, sostenido, reconstruido, porque nosotras también somos pueblo. Y el pueblo, todo
    el pueblo tiene derecho a ser defendido. Y por hoy queremos decir con todas las letras: El trabajo de las entidades autoorganizadas
    por personas migrantes merece visibilidad, respeto, recursos, reconocimientos, porque donde el Estado no llegó llegamos
    nosotras y no nos vamos a callar.

    Muchas gracias.'
  temes:
  - dana_emergencies
  - igualtat
  - participacio_ciutadana
  - serveis_socials
  text_cas: ''
  text_val: 'Bon dia. I ací estem. Exigim justícia, transparència i un poc de respecte. La classe política ha d''estar a l''altura.
    Prou ja de discursos populistes que alimenten l''extrema dreta. Prou ja d''usar les persones migrants com a moneda de
    canvi per a pactes pressupostaris. I a més venim a exigir una cosa que hauria de ser òbvia, la regularització immediata
    i sense excepció per a totes les persones afectades per la dana. Acompanyem hui a més de 40 joves en situació administrativa
    irregular que vivien als municipis més afectats i que hui no poden optar a la regularització perquè tenien contractes
    verbals. De veritat estes persones no són víctimes? Nosaltres sí que vam estar, ens vam organitzar, vam actuar. I per
    això hui diem alt i clar: Regularització ja, reconeixement ja, justícia ja. El treball de les entitats autoorganitzades
    per persones migrants mereix visibilitat, respecte, recursos, reconeixements, perquè on l''Estat no va arribar vam arribar
    nosaltres i no ens callarem.

    Moltes gràcies.'
  resum_cas: Exige la regularización inmediata de personas migrantes afectadas por la DANA, denuncia los discursos de odio
    y reivindica el papel de las entidades migrantes en la reconstrucción.
  resum_val: Exigeix la regularització immediata de persones migrants afectades per la DANA, denuncia els discursos d'odi
    i reivindica el paper de les entitats migrants en la reconstrucció.
  source: manual
- id: 2025-04-11-3-106
  pleno_id: 2025-04-11-3
  ordre: 10
  intervinient: Jorge Guillot Artés
  entitat: Asociación Cultural Cruces de Mayo La Torre
  tipus_entitat: cultural
  barri_o_zona: Sociópolis, La Torre
  punts_ordre_dia: Reconstrucción DANA
  idioma_original: castellano
  text_original: 'Buenos días, alcaldesa, miembros del Pleno. Pues bueno, yo puedo ser o debo ser el díscolo de lo que estoy
    oyendo con mis vecinos. Yo vivo en Sociópolis. Y de momento, en los últimos 15 días, 20 días, el Ayuntamiento está trabajando
    mucho. Sobre todo en el tema de limpieza de vehículos, que era una cosa que estábamos demandando por tema de seguridad,
    de contaminación y todo. De momento la zona está quedando bastante limpia. Y a colación de lo que ha dicho el compañero,
    el tema del campo de fútbol de deporte, pues yo encantado. Ser vecino y poder escuchar a esos niños todos los días de
    entrenamiento y sobre todo los domingos, oír esas risas que disfrutan de un deporte, pues yo encantadísimo no de tener
    un campo de fútbol, de tener una piscina y de tener todas las cosas que el Ayuntamiento o que el gobierno en sí pueda
    ofrecernos, no a mi barrio sino a todos los barrios de València, generando en ello una calidad de vivir y de poder disfrutar
    de esta tierra que tenemos.

    El problema que nosotros tenemos realmente pues igual son que los consorcios, vuelvo con el tema del Consorcio, pero yo
    sigo teniendo derramas. A mí el Consorcio no me facilita los pagos rápidos para habilitar ascensores, garajes y todo.
    Seguimos teniendo ese problema. Yo que me pongas un parque más, un parque menos, pues al fin y al cabo yo cuando vivo
    en el piso 19 me gustaría coger un ascensor o poder aparcar los coches directamente y no dejarlos en la calle. El tema
    de seguridad. Pues yo siempre que veo patrullas de Policía, por lo menos en mi zona. Yo hablo siempre de Sociópolis. Pero
    lo que es una zona que puede ser de futuro, que realmente tiene que haber construcción y que el Ayuntamiento, del color
    que sea, de la parte que sea, tiene que apostar que esa zona en breve será un barrio importante de València. Y deberíamos
    todos un poco pues eso, viendo cómo está el caso de que cuesta todo. Pero no solo el barrio de La Torre. Otros barrios
    que también por otras circunstancias están afectados no solo por la dana, sino por otras circunstancias que pueda tener.
    Pues pensar que poco a poco, entre todos, todas las asociaciones, y entre vosotros, todos los políticos, nos echéis una
    mano para que vayamos teniendo un futuro para las generaciones que vienen en breve.

    Muchísimas gracias.'
  temes:
  - dana_emergencies
  - barris
  - infraestructures
  - seguretat
  text_cas: ''
  text_val: 'Bon dia, alcaldessa, membres del Ple. Jo visc a Sociòpolis. I de moment, en els últims 15-20 dies, l''Ajuntament
    està treballant molt. Sobretot en el tema de neteja de vehicles, que era una cosa que estàvem demanant per tema de seguretat,
    de contaminació. De moment la zona està quedant bastant neta. El problema que nosaltres tenim realment és el dels consorcis,
    seguisc tenint derrames. El Consorci no em facilita els pagaments ràpids per a habilitar ascensors, garatges. Seguim tenint
    eixe problema. Jo que em posen un parc més, un parc menys, al cap i a la fi jo quan visc al pis 19 m''agradaria agafar
    un ascensor o poder aparcar els cotxes directament. Sociòpolis és una zona de futur i l''Ajuntament ha d''apostar perquè
    eixa zona serà un barri important de València.

    Moltíssimes gràcies.'
  resum_cas: Vecino de Sociópolis reconoce mejoras recientes en limpieza pero denuncia la lentitud del Consorcio para habilitar
    ascensores y garajes, y pide apostar por el futuro del barrio.
  resum_val: Veí de Sociòpolis reconeix millores recents en neteja però denuncia la lentitud del Consorci per a habilitar
    ascensors i garatges, i demana apostar pel futur del barri.
  source: manual
- id: 2025-04-11-3-107
  pleno_id: 2025-04-11-3
  ordre: 11
  intervinient: Consuelo Riveiro Carro
  entitat: AVV de Sant Marcel·lí
  tipus_entitat: av
  barri_o_zona: Sant Marcel·lí, Sociópolis
  punts_ordre_dia: Reconstrucción DANA
  idioma_original: castellano
  text_original: 'Buenos días. Yo vengo no a pedir sino a exigir, por favor, que queremos un consultorio nuevo, que en Sociópolis
    hay terrenos de la Conselleria de Sanidad para un centro nuevo de salud y que los médicos y enfermeras sean no sean cambiables,
    que sean fijos. Y los médicos que puedan decidir también cuando tienen que mandar a un paciente a un especialista, que
    no tengan que esperar dos años o tres cuando lo llamen, que ya están en el cementerio a lo mejor. Los pacientes sería
    mejor tratados y menos esperas. Y que para que funcionara bien el ministro de Sanidad debía de haber sido médico y después
    director médico. Entonces sabría lo que es la sanidad pública. Pero si ponen a cualquiera de ministro de Sanidad, entonces
    no puede funcionar. Porque yo fui criada en Alemania y nacida, y sé cómo funciona la sanidad. Y es una vergüenza que en
    una ciudad tan bonita que tenemos como es València y La Torre, que nos tienen abandonados porque ustedes solo miran el
    centro de València porque es lo que les da dinero con los turistas. Pero La Torre la tratan como lo último, como si fuéramos
    mierda tirada en el suelo.

    Muchas gracias, eso es todo.'
  temes:
  - dana_emergencies
  - salut
  - barris
  text_cas: ''
  text_val: 'Bon dia. Jo vinc no a demanar sinó a exigir, per favor, que volem un consultori nou, que a Sociòpolis hi ha terrenys
    de la Conselleria de Sanitat per a un centre nou de salut i que els metges i infermeres siguen fixos. I els metges que
    puguen decidir quan han d''enviar un pacient a un especialista, que no hagen d''esperar dos anys o tres. Els pacients
    serien millor tractats i menys esperes. És una vergonya que en una ciutat tan bonica com és València i La Torre, que ens
    tenen abandonats perquè vostés sols miren el centre de València perquè és el que els dona diners amb els turistes. Però
    La Torre la tracten com l''últim.

    Moltes gràcies, això és tot.'
  resum_cas: Vecina de Sant Marcel·lí exige un nuevo centro de salud en Sociópolis con médicos fijos, y denuncia el abandono
    de La Torre frente al centro de la ciudad.
  resum_val: Veïna de Sant Marcel·lí exigeix un nou centre de salut a Sociòpolis amb metges fixos, i denuncia l'abandó de
    La Torre front al centre de la ciutat.
  source: manual
- id: 2025-04-11-3-108
  pleno_id: 2025-04-11-3
  ordre: 12
  intervinient: Piedad Ruiz
  entitat: Cáritas Diocesana
  tipus_entitat: ong
  barri_o_zona: La Torre, Forn d'Alcedo, Castellar-l'Oliveral
  punts_ordre_dia: Reconstrucción DANA
  idioma_original: castellano
  text_original: 'Hola, buenos días. En primer lugar, quisiera agradecer sinceramente la oportunidad que nos brindan para
    poder volver a intervenir en este pleno municipal. Y antes de nada, transmitir mi sorpresa por alguna declaración que
    he oído referente a los primeros días de la dana, estando yo ahí presente, por la falta de coordinación. Simplemente decirle
    a esta persona que no debe conocer lo que es la Ley de Protección de Datos. Sí que había una coordinación absoluta entre
    el ayuntamiento de la pedanía, Servicios Sociales y lo que era la parroquia y actualmente Cáritas.

    Bueno, para Cáritas tiene un profundo significado poder dar testimonio de este trabajo compartido que hemos llevado a
    cabo en estos meses tan difíciles con el Ayuntamiento de València y con el resto de entidades sociales en apoyo de las
    personas afectadas por la dana en las pedanías de La Torre, Horno de Alcedo y Castellar-l''Oliveral. Como organización
    con una larga trayectoria de acompañamiento a personas en situación de vulnerabilidad, especialmente en La Torre donde
    llevamos muchos años trabajando junto a las familias del barrio, conocemos bien una realidad que ha hecho más duro el
    impacto de esta emergencia. Esta cercanía nos ha permitido actuar sobre el terreno con agilidad y conocimiento desde el
    primer momento.

    Quiero expresar públicamente nuestro más sincero agradecimiento al Ayuntamiento de València por su compromiso por haber
    contado desde el primer momento con Cáritas y por haber facilitado una colaboración estrecha, fluida y eficaz. Esta coordinación
    ha sido fundamental para poder dar una respuesta ágil, organizada y sobre todo humana, centrada en las personas que más
    lo necesitan en los momentos más difíciles.

    El nuevo centro social de La Torre va a ser un elemento fundamental. Es una oportunidad de seguir consolidando nuestro
    compromiso de trabajar de manera estructural y continuada en la mejora de las condiciones de la vida de las familias.
    Valoramos muy positivamente la activación de la Mesa de Coordinación Social para las Personas Afectadas por la Dana, impulsada
    por este Ayuntamiento de València. Este espacio en el que participa Cáritas junto a entidades como Cruz Roja, la Red de
    Lucha contra la Pobreza, el Banco de Alimentos, Aldeas Infantiles, el proyecto Babel y los propios Servicios Sociales
    municipales nos permite compartir información, coordinar los recursos disponibles y sobre todo, atender de manera integral
    y personalizada las situaciones de las distintas unidades familiares.

    Y quiero terminar agradeciendo de nuevo al Ayuntamiento que haya contado con nosotros, que haya confiado en nosotros y
    que haya facilitado nuestra labor.

    Muchas gracias.'
  temes:
  - dana_emergencies
  - serveis_socials
  - participacio_ciutadana
  - barris
  text_cas: ''
  text_val: 'Hola, bon dia. En primer lloc, voldria agrair sincerament l''oportunitat que ens brinden per a poder tornar a
    intervindre en este ple municipal. Per a Càritas té un profund significat poder donar testimoni d''este treball compartit
    que hem dut a terme en estos mesos tan difícils amb l''Ajuntament de València i amb la resta d''entitats socials en suport
    de les persones afectades per la dana a les pedanies de La Torre, Forn d''Alcedo i Castellar-l''Oliveral. Volem expresar
    públicament el nostre més sincer agraïment a l''Ajuntament de València pel seu compromís per haver comptat des del primer
    moment amb Càritas i per haver facilitat una col·laboració estreta, fluida i eficaç.

    El nou centre social de La Torre serà un element fonamental. Valorem molt positivament l''activació de la Taula de Coordinació
    Social per a les Persones Afectades per la Dana, impulsada per este Ajuntament de València. Este espai en el qual participa
    Càritas junt amb entitats com Creu Roja, la Xarxa de Lluita contra la Pobresa, el Banc d''Aliments, Aldees Infantils,
    el projecte Babel i els propis Serveis Socials municipals ens permet compartir informació, coordinar els recursos disponibles
    i sobretot, atendre de manera integral les situacions de les distintes unitats familiars.

    Moltes gràcies.'
  resum_cas: Cáritas agradece la coordinación con el Ayuntamiento en la atención a afectados por la DANA, valora la Mesa de
    Coordinación Social y el futuro centro social de La Torre.
  resum_val: Càritas agraïx la coordinació amb l'Ajuntament en l'atenció a afectats per la DANA, valora la Taula de Coordinació
    Social i el futur centre social de La Torre.
  source: manual
- id: 2025-04-11-3-109
  pleno_id: 2025-04-11-3
  ordre: 13
  intervinient: Mariam Andrea Narváez Ayala
  entitat: Asociación Por ti Mujer
  tipus_entitat: ong
  barri_o_zona: Sociópolis, La Torre
  punts_ordre_dia: Reconstrucción DANA
  idioma_original: castellano
  text_original: 'Buenos días. Gracias por este espacio de palabra. Hablo en nombre de la Asociación Por ti Mujer. Somos una
    comunidad diversa, resiliente y sobre todo comprometida con la ciudad y con nuestro trabajo, y con las compañeras a las
    que atendemos. Venimos hoy sobre todo para construir y proponer desde nuestra experiencia y cooperación. Hoy queremos
    hablar de algo que para muchas de nuestras compañeras fue más que un proyecto y hablamos de las huertas urbanas en clave
    de género que están ubicadas en Sociópolis, en la pedanía de La Torre. Este espacio no solo significaba para las compañeras
    un espacio de salud y aprendizaje, sino que también era un espacio para construir comunidad. Era un espacio también de
    dignidad para muchas de nuestras mujeres. Mujeres en situación de vulnerabilidad y de exclusión social. Mujeres que encontraron
    en estas huertas un espacio de pertenencia, de cuidado mutuo y también de autonomía.

    Cuando este espacio dejó de funcionar por la dana no solo se cerraron estas parcelas, sino que se cerró también todo un
    ecosistema social y emocional que ayudaba justamente a sostener estas vidas de las mujeres. Para muchas de ellas la huerta
    era un espacio terapéutico y de recuperación personal, pero también de espacio intercultural y de intercambio intergeneracional.

    En estos momentos, a partir de la crisis generada por la dana, la población migrante ha estado presente desde el día 0,
    trabajando codo a codo y colaborando en la reconstrucción desde abajo. Sin embargo, también hemos sido víctimas de dos
    situaciones bastante complejas. No solo la dana, sino también los discursos de odio que se han generado a raíz de esta
    situación. Pero es que estos bulos no solo afectan nuestra imagen, también afectan nuestras vidas, nuestro acceso a los
    derechos, nuestra seguridad ciudadana y nuestras posibilidades de participación como ciudadanos de pleno derecho.

    Por eso hoy pedimos que se considere la recuperación del programa de las huertas urbanas de Sociópolis como una opción
    concreta de justicia social, de sostenibilidad ambiental y de participación ciudadana real. No solo es cuestión medioambiental,
    es una cuestión de equidad de género, de integración, de interculturalidad y sobre todo de inclusión. Nosotras queremos
    ser parte de ese camino, porque llevamos caminando en la huerta más de diez años y el trabajo de las mujeres que están
    allí día a día ha hecho que las huertas urbanas tengan un reconocimiento no solo nacional sino también a nivel internacional
    como espacios urbanos verdes y de acciones positivas.

    Muchas gracias.'
  temes:
  - dana_emergencies
  - igualtat
  - medi_ambient
  - participacio_ciutadana
  - barris
  text_cas: ''
  text_val: 'Bon dia. Gràcies per este espai de paraula. Parle en nom de l''Associació Per tu Dona. Som una comunitat diversa,
    resilient i sobretot compromesa amb la ciutat. Hui volem parlar de les hortes urbanes en clau de gènere que estan ubicades
    a Sociòpolis, a la pedania de La Torre. Este espai no sols significava per a les companyes un espai de salut i aprenentatge,
    sinó que també era un espai per a construir comunitat. Era un espai de dignitat per a moltes de les nostres dones. Dones
    en situació de vulnerabilitat i d''exclusió social que van trobar en estes hortes un espai de pertinença, de cura mútua
    i d''autonomia.

    Quan este espai va deixar de funcionar per la dana no sols es van tancar estes parcel·les, sinó que es va tancar tot un
    ecosistema social i emocional. Per això hui demanem que es considere la recuperació del programa de les hortes urbanes
    de Sociòpolis com una opció concreta de justícia social, de sostenibilitat ambiental i de participació ciutadana real.

    Moltes gràcies.'
  resum_cas: Pide la recuperación de las huertas urbanas de género en Sociópolis destruidas por la DANA, como espacio de justicia
    social, inclusión e interculturalidad para mujeres migrantes.
  resum_val: Demana la recuperació de les hortes urbanes de gènere a Sociòpolis destruïdes per la DANA, com a espai de justícia
    social, inclusió i interculturalitat per a dones migrants.
  source: manual
- id: 2025-04-11-3-110
  pleno_id: 2025-04-11-3
  ordre: 15
  intervinient: Mª Amparo Puchades Giner
  entitat: AV Castellar-l'Oliveral
  tipus_entitat: av
  barri_o_zona: Castellar-l'Oliveral
  punts_ordre_dia: Reconstrucción DANA - Punto 2
  idioma_original: valenciano
  text_original: 'Bon dia, alcaldessa, regidores, regidors. El passat 20 de desembre poguérem expressar i compartir amb tots
    vostés en este mateix espai, la casa de tots, l''estat de xoc, inquietud i vulnerabilitat instal·lat a les nostres vides,
    commocionades pel gran impacte de la catàstrofe, que moltes eren les preguntes que ens assaltaven cada dia, què funcionà
    i què no funcionà en la prevenció i atenció requerida i urgent. I forem escoltades i ateses amb proximitat per l''alcaldessa.
    I volem creure que per tots vostés.

    Venim mantenint una sèrie de reunions de seguiment on podem expressar necessitats, demandes, amb escolta, respecte i paciència,
    molta paciència per la nostra part. Ens esforcem en aportar solucions, en ser proactives, atenent el més urgent i immediat
    del nostre veïnat, lluny de crispacions, sorolls, exageracions o fanatisme, perquè sabem de la magnitud i complexitat
    que requerix la reconstrucció i restauració dels nostres hàbitats i les nostres vides.

    Però sis mesos després cal un ple extraordinari i forçat que els interpel·la com a governança. No han estat capaços d''integrar-nos
    de primera mà ni en la comissió no permanent, ni en les seues conclusions, ni en processos participatius reals i seriosos.
    No ens sentim tractades com a ciutadanes compromeses, madures i organitzades. No ens han oferit espais on poder fer una
    crítica serena i constructiva que creiem absolutament necessària per no repetir errors i per prendre les solucions adequades.
    Cal una col·laboració estreta i sincera per garantir que les accions i decisions adoptades responguen realment a les necessitats
    i aspiracions de la comunitat.

    I lluny, molt lluny d''això, dia a dia veiem com ens han escalat a càlculs interessats i partidistes. Com podem recuperar
    la confiança, la tranquil·litat i la pau quan l''esfera política ignora o banalitza els efectes del canvi climàtic, de
    la crisi ecosocial i de biodiversitat que afrontem?

    Des dels 14 punts de la proposta d''acord de Castellar-l''Oliveral, exposaré el número 6 per la gran preocupació del veïnat.
    Es tracta de l''eliminació de les barreres artificials al pas de l''aigua front a noves avingudes, com l''avinguda de
    Ruiz i Comes. Cal aprofitar les sis séquies que travessen l''avinguda, tres de rec i tres de desaigüe, per a drenar el
    poble. Les séquies no tenen entrades per l''aigua a l''oest de l''avinguda. El ribàs no pot fer la seua funció tal com
    està i el pont de pantaló tampoc, perquè en el seu dia les infraestructures preexistents i pròpies de l''horta no van
    ser respectades i estan tallades o mal canalitzades. Cal augmentar la permeabilitat del sòl implementant sistemes de drenatge
    sostenible per evitar la retenció de l''aigua, garantir accions de drenatge natural en les intervencions urbanes, eliminar
    barreres i promoure la renaturalització del territori. Punt 7: Reclamar al Consell la recuperació de la Llei 5/2018 de
    l''horta de València. Punt 10: Crear una taula de seguiment amb la participació de les associacions veïnals, grups d''experts
    en adaptació al canvi climàtic i tots els grups polítics. Pla de barri integral complet.

    I ara els demane un compromís a tots vostés, el compromís per la seua part d''atendre i tindre en consideració les evidències
    científiques sobre canvi climàtic i territori en el Mediterrani ibèric. Necessitem, volem i reclamem polítiques d''altura.

    Moltes gràcies.'
  temes:
  - dana_emergencies
  - medi_ambient
  - participacio_ciutadana
  - infraestructures
  - barris
  text_cas: 'Buenos días, alcaldesa, concejalas, concejales. El pasado 20 de diciembre pudimos expresar y compartir con todos
    ustedes en este mismo espacio, la casa de todos, el estado de shock, inquietud y vulnerabilidad instalado en nuestras
    vidas, conmocionadas por el gran impacto de la catástrofe.

    Venimos manteniendo una serie de reuniones de seguimiento donde podemos expresar necesidades, demandas, con escucha, respeto
    y paciencia, mucha paciencia por nuestra parte. Nos esforzamos en aportar soluciones, en ser proactivas, atendiendo lo
    más urgente e inmediato de nuestro vecindario.

    Pero seis meses después hace falta un pleno extraordinario y forzado que les interpela como gobernanza. No han sido capaces
    de integrarnos de primera mano ni en la comisión no permanente, ni en sus conclusiones, ni en procesos participativos
    reales y serios. No nos sentimos tratadas como ciudadanas comprometidas, maduras y organizadas.

    Desde los 14 puntos de la propuesta de acuerdo de Castellar-l''Oliveral, expondré el número 6 por la gran preocupación
    del vecindario. Se trata de la eliminación de las barreras artificiales al paso del agua frente a nuevas avenidas. Hay
    que aprovechar las seis acequias que atraviesan la avenida para drenar el pueblo. Hay que aumentar la permeabilidad del
    suelo implementando sistemas de drenaje sostenible, garantizar acciones de drenaje natural, eliminar barreras y promover
    la renaturalización del territorio. Punto 7: Reclamar al Consell la recuperación de la Ley 5/2018 de la huerta de València.
    Punto 10: Crear una mesa de seguimiento con asociaciones vecinales, expertos en cambio climático y todos los grupos políticos.
    Plan de barrio integral completo.

    Necesitamos, queremos y reclamamos políticas de altura.

    Muchas gracias.'
  text_val: ''
  resum_cas: Representante de Castellar-l'Oliveral critica la falta de participación ciudadana real en la reconstrucción post-DANA
    y propone eliminar barreras al drenaje, recuperar la ley de la huerta y crear una mesa de seguimiento.
  resum_val: Representant de Castellar-l'Oliveral critica la falta de participació ciutadana real en la reconstrucció post-DANA
    i proposa eliminar barreres al drenatge, recuperar la llei de l'horta i crear una taula de seguiment.
  source: manual
- id: 2025-04-11-3-111
  pleno_id: 2025-04-11-3
  ordre: 18
  intervinient: Silvana Gabriela Cabrera Martínez
  entitat: Asociación Intercultural Candombe
  tipus_entitat: ong
  barri_o_zona: València
  punts_ordre_dia: Reconstrucción DANA - Punto 3
  idioma_original: castellano
  text_original: 'Hoy vengo a este pleno a ser el altavoz de la situación que viven miles de personas que siguen siendo invisibilizadas
    por este ayuntamiento. Personas migrantes que antes, durante y después de la dana han sido dejadas atrás, ignoradas por
    unas instituciones más preocupadas por limpiar su imagen que por garantizar derechos y brindar soluciones. La dana dejó
    al descubierto no solo los fallos estructurales en las infraestructuras, sino una verdad aún más grave: el abandono institucional
    hacia las personas migrantes que, según el informe de Oxfam, son entre 28.000 y 41.000 personas las que viven en los municipios
    afectados.

    A pesar de esta realidad concreta, las autoridades no han gestionado ningún plan estatal ni autonómico para ayudar a quienes
    se encuentran en situación administrativa irregular, ni mucho menos ningún plan de reubicación para las familias afectadas.
    Antes y después de la dana, el empadronamiento ha sido un obstáculo burocrático e ideológico. Lo que debería ser un derecho
    y obligación de los ayuntamientos, el acceso al padrón para poder existir a los ojos de la Administración, se convierte
    en una herramienta de exclusión. Sin padrón no hay derechos, no hay acceso a la sanidad, ni a la educación, ni a los servicios
    sociales, ni a las ayudas específicas creadas para subsanar esta emergencia.

    A esto se suma la dificultad para acceder a alquileres dignos, para escolarizar a sus hijos e hijas o para simplemente
    vivir. A día de hoy, miles de personas siguen sin regularizar su situación porque eso para ustedes no es una prioridad.
    Desde las instituciones públicas se estigmatiza a la juventud migrante, se propagan discursos de odio, se maltrata a quienes
    van a realizar un trámite, se hace política desde el miedo. Hablo de trabajadoras del hogar y los cuidados que después
    de haber salvado la vida a sus empleadores fueron despedidas sin ningún tipo de derecho, de las trabajadoras del campo
    y de la construcción. Hablo de personas viviendo en condiciones infrahumanas, de jóvenes detenidos en la calle por la
    estrategia racista de paradas por perfil racial.

    Una vez más, las organizaciones de base fuimos quienes respondimos para brindar atención a las personas migrantes, para
    hacer lo que ustedes no hicieron. Frente a su abandono, el Colectivo Parque Alcosa y Regularización Ya somos quienes hemos
    salido a las calles creando una unidad móvil de atención en las zonas afectadas.

    Es por eso que hoy venimos a exigir que los procesos de reconstrucción de los barrios no se hagan desde una mirada racista
    y colonial. Es urgente que las administraciones públicas asuman su responsabilidad frente a la ausencia de alternativas
    que garanticen el acceso al padrón de las personas migrantes. Que se preocupen políticas públicas con un enfoque antirracista.
    Basta de lavarse las manos con discursos vacíos. Basta de convertir la vida de las personas migrantes en moneda de cambio
    político.

    Regularización ya.'
  temes:
  - dana_emergencies
  - igualtat
  - serveis_socials
  - habitatge
  - participacio_ciutadana
  text_cas: ''
  text_val: 'Hui vinc a este ple a ser l''altaveu de la situació que viuen milers de persones que seguixen sent invisibilitzades
    per este ajuntament. Persones migrants que abans, durant i després de la dana han sigut deixades arrere, ignorades per
    unes institucions més preocupades per netejar la seua imatge que per garantir drets i brindar solucions. La dana va deixar
    al descobert no sols les fallades estructurals en les infraestructures, sinó una veritat encara més greu: l''abandó institucional
    cap a les persones migrants.

    Malgrat esta realitat concreta, les autoritats no han gestionat cap pla estatal ni autonòmic per a ajudar a qui es troben
    en situació administrativa irregular. L''empadronament ha sigut un obstacle burocràtic i ideològic. El que hauria de ser
    un dret i obligació dels ajuntaments es convertix en una eina d''exclusió. Sense padró no hi ha drets.

    Per això hui venim a exigir que els processos de reconstrucció dels barris no es facen des d''una mirada racista i colonial.
    És urgent que les administracions públiques assumisquen la seua responsabilitat. Regularització ja.'
  resum_cas: Denuncia el abandono institucional hacia personas migrantes tras la DANA, el empadronamiento como herramienta
    de exclusión, y exige políticas antirracistas y regularización inmediata.
  resum_val: Denuncia l'abandó institucional cap a persones migrants després de la DANA, l'empadronament com a eina d'exclusió,
    i exigeix polítiques antiracistes i regularització immediata.
  source: manual
- id: 2025-04-11-3-112
  pleno_id: 2025-04-11-3
  ordre: 19
  intervinient: Beatriu Cardona Prats, Joan Domínguez Pavía
  entitat: STA-Intersindical
  tipus_entitat: sindical
  barri_o_zona: Castellar-l'Oliveral, La Torre, Forn d'Alcedo
  punts_ordre_dia: Reconstrucción DANA - Punto 3
  idioma_original: valenciano
  text_original: 'Molt bon dia, membres de la corporació municipal. Intervindrem en eixos 5 minuts que tenim entre els dos,
    Joan Domínguez i jo mateixa, Beatriu Cardona, representant al nostre sindicat i com a membres del Consell Escolar Municipal
    de València en representació del nostre sindicat, que és el majoritari docent. Per suposat, anem a enfocar la nostra intervenció
    al món educatiu i subscrivim les paraules de les entitats veïnals i de persones migrades que han intervingut abans.

    La capacitat de resposta davant la dana que va afectar a València va mostrar molts aspectes millorables, per dir-ho suaument.
    La gestió inicial va estar tràgicament marcada per retards, la qual cosa va limitar la coordinació i l''assignació de
    recursos en els moments crítics. No actuar a l''hora va ser determinant i això va costar vides que no podrem recuperar
    mai. Molts veïns i veïnes, col·lectius locals i organitzacions socials hem denunciat una falta de previsió, de coordinació
    i de resposta eficaç per part de les administracions.

    Tot i que la versió institucionalitzada vol canviar la història, la realitat viscuda a peu de carrer als pobles del sud
    de València, com Castellar-Oliveral, la Torre o Forn d''Alcedo, va ser molt més crua. Per quatre motius. Primer, no es
    va activar a temps cap protocol d''alerta encara que l''episodi de pluges estava anunciat des de feia dies. Dos, les zones
    inundables no tenien cap tipus de prevenció implementada. Tres, bombers, policies i serveis d''emergència van ser enviats
    tard i sense mitjans suficients. Quatre, va haver una manca absoluta d''informació oficial.

    Els dies posteriors a la dana moltes cases i comerços van quedar abandonades a la seua sort, sense ajuda institucional
    immediata. I la neteja i assistència van recaure en gran part en la solidaritat veïnal. De la mateixa forma, els centres
    educatius van vore com era el personal docent i no docent del centre, mestres, conserges, educadores, que acudien a netejar
    el fang i a posar en ordre de forma immediata les instal·lacions. I va ser gràcies a això que els centres afectats pogueren
    reiniciar les seues activitats de seguida.

    Hui per hui, quasi cinc mesos i mig després, hem de seguir denunciant algunes situacions de precarietat a molts nivells
    que estan patint les nostres escoles.

    Hui dia encara no està operatiu el gimnàs del CEIP Forn d''Alcedo. Seguix en les mateixes condicions. En algunes aules
    encara poden apreciar-se humitats. Al CEIP Castellar-l''Oliveral sabem que la Conselleria encara no ha sufragar les despeses
    originades per la gratuïtat en els menús de l''alumnat que va acollir afectat per la dana. Al CEIP Pare Manjón continuen
    esperant resposta respecte a què fer davant les peticions de certificats que s''han perdut arrossegats per les aigües.
    El mobiliari amb el qual s''ha anat reposant tot allò perdut ha arribat amb molta lentitud.

    Per millorar la situació dels centres afectats és fonamental implementar mesures concretes: agilització de tràmits burocràtics,
    transparència i seguiment, prioritzar els centres educatius, inversió en resiliència i participació ciutadana.

    Hui es dona la casualitat que fa 32 anys que va ser assassinat Guillem Agulló. Sempre diem ni oblit ni perdó. I citant
    també a una representant veïnal, diem 20:11, ni oblit ni perdó.'
  temes:
  - dana_emergencies
  - educacio
  - participacio_ciutadana
  - barris
  text_cas: 'Muy buenos días, miembros de la corporación municipal. Intervendremos en esos 5 minutos que tenemos entre los
    dos, Joan Domínguez y yo misma, Beatriu Cardona, representando a nuestro sindicato y como miembros del Consejo Escolar
    Municipal de València en representación de nuestro sindicato, que es el mayoritario docente. Por supuesto, vamos a enfocar
    nuestra intervención al mundo educativo.

    La capacidad de respuesta ante la DANA que afectó a València mostró muchos aspectos mejorables, por decirlo suavemente.
    La gestión inicial estuvo trágicamente marcada por retrasos. No actuar a tiempo fue determinante y eso costó vidas que
    no podremos recuperar nunca. La realidad vivida a pie de calle en los pueblos del sur de València fue mucho más cruda.
    No se activó a tiempo ningún protocolo de alerta. Las zonas inundables no tenían ningún tipo de prevención implementada.
    Bomberos, policías y servicios de emergencia fueron enviados tarde y sin medios suficientes. Hubo una falta absoluta de
    información oficial.

    Los centros educativos vieron cómo era el personal docente y no docente quien acudía a limpiar el barro. Hoy en día aún
    no está operativo el gimnasio del CEIP Forn d''Alcedo. En el CEIP Castellar-l''Oliveral la Conselleria aún no ha sufragado
    los gastos de los menús del alumnado acogido. En el CEIP Padre Manjón continúan esperando respuesta sobre los certificados
    perdidos.

    Es fundamental implementar medidas concretas: agilización de trámites burocráticos, transparencia, priorizar los centros
    educativos, inversión en resiliencia y participación ciudadana.

    Hoy se da la casualidad de que hace 32 años fue asesinado Guillem Agulló. Siempre decimos ni olvido ni perdón. 20:11,
    ni olvido ni perdón.'
  text_val: ''
  resum_cas: El sindicato docente STA-Intersindical denuncia la nefasta gestión de la DANA en los centros educativos de las
    pedanías del sur, con gimnasios inoperativos, mobiliario sin reponer y falta de financiación.
  resum_val: El sindicat docent STA-Intersindical denuncia la nefasta gestió de la DANA als centres educatius de les pedanies
    del sud, amb gimnasos inoperatius, mobiliari sense reposar i falta de finançament.
  source: manual
- id: 2025-04-11-3-113
  pleno_id: 2025-04-11-3
  ordre: 17
  intervinient: Cintia Sancanuto Chardí
  entitat: AV del Palmar
  tipus_entitat: av
  barri_o_zona: El Palmar
  punts_ordre_dia: Reconstrucción DANA - Punto 3
  idioma_original: valenciano
  text_original: 'Gràcies. Me n''alegre per una part que hagen reconduït el debat en un sol punt perquè una de les coses que
    es basa l''administració, en esta i en totes, és el tema de las parcelitas. Este trosset és meu, este és d''un altre.
    Vuelva usted mañana. Açò és en la siguiente ventanilla. Aleshores, tractar-nos a tot el sud com un sol conjunt interdependent
    és una cosa que cal sol·licitar. Interdependent i també com a part de la ciutat.

    En una intervenció anterior han dit que està molt lleig que les entitats ciutadanes fem política. La política és l''activitat
    que fa la ciutadania quan intervé als assumptes públics amb la seua opinió, vot o de qualsevol altra forma. Si, sí que
    fem política. Qualsevol acte públic és política. El que no fem és partidisme. No tenia preparada esta segona intervenció.
    Era una mesura d''autoprotecció que hem dissenyat els pobles perquè no tenim els mateixos drets, no tenim dret a rèplica.
    Vostés ara van a intervindre, van a parlar i no ens anem a poder defendre fins a un altre plenari on ens escolten, i hem
    vist que no tenen massa ganes d''escoltar-nos.

    Una de les coses que demanem és la participació i vaig a dir-los -no ho dic jo, és un terme acadèmic- que la participació
    no és ''le informo'' i ''esto se publicó en el DOG''. La participació no és manipulació. La participació no és fer-se
    una foto amb nosaltres i un maquillatge estètic. Ni tan sols és només informació. La participació comença amb la consulta,
    continua amb la coordinació i el compromís amb eixa consulta. I la participació finalitza amb donar-li a qui ha participat
    la capacitat d''agència per a resoldre els seus problemes, no decidir per altres.

    Voldria comentar temes que han estat molt lletjos. Per exemple, la preciosa campanya ''Qué bien sabe volver al Palmar''
    no ens va saber tant bé, perquè nosaltres vam estar rebent i desviant turismes els mateixos dies de les inundacions, i
    els vam haver de desviar el mateix poble. Turisme estranger desinformat que pretenia arribar a Alginet en bicicleta en
    plena inundació, totalment desinformat, que açò es va corregir i es va traduir en una informació retardada i mal. I des
    de les mateixes agències de turisme, oficines de turisme de l''Ajuntament, regentades per Visit València, quan ja s''havia
    passat tota la inundació i el que reclamava era la recuperació econòmica del sector hostaler, que és molt important al
    meu poble, se''ls estava dient que no vingueren a l''Albufera. Aquella campanya de Qué bien sabe era què agre ens ha sabut
    que l''Ajuntament ens tire a la gent fora.

    Bé, crec que no cal que diga res més. Han estat coses molt lleges, coses de falta de comunicació i d''un profund desconeixement.
    Ja que han demostrat eixe profund desconeixement del nostre territori només demanem això, que ens continuen escoltant
    i que eixa escolta implique un compromís en respectar aquelles coses que pacten amb nosaltres.

    I ara, si alguna persona més del veïnat vol dir alguna cosa en este minut i mig que em queda, pregue que passeu.'
  temes:
  - dana_emergencies
  - participacio_ciutadana
  - economia
  - barris
  text_cas: 'Gracias. Me alegro por una parte de que hayan reconducido el debate en un solo punto porque una de las cosas
    en que se basa la administración, en esta y en todas, es el tema de las parcelitas. Este trocito es mío, este es de otro.
    Vuelva usted mañana. Esto es en la siguiente ventanilla. Entonces, tratarnos a todo el sur como un solo conjunto interdependiente
    es algo que hay que solicitar. Interdependiente y también como parte de la ciudad.

    En una intervención anterior han dicho que está muy feo que las entidades ciudadanas hagamos política. La política es
    la actividad que hace la ciudadanía cuando interviene en los asuntos públicos con su opinión, voto o de cualquier otra
    forma. Sí, sí que hacemos política. Cualquier acto público es política. Lo que no hacemos es partidismo. No tenía preparada
    esta segunda intervención. Era una medida de autoprotección que hemos diseñado los pueblos porque no tenemos los mismos
    derechos, no tenemos derecho a réplica. Ustedes ahora van a intervenir, van a hablar y no nos vamos a poder defender hasta
    otro plenario donde nos escuchen, y hemos visto que no tienen muchas ganas de escucharnos.

    Una de las cosas que pedimos es la participación y voy a decirles -no lo digo yo, es un término académico- que la participación
    no es ''le informo'' y ''esto se publicó en el DOG''. La participación no es manipulación. La participación no es hacerse
    una foto con nosotros y un maquillaje estético. Ni siquiera es solo información. La participación empieza con la consulta,
    continúa con la coordinación y el compromiso con esa consulta. Y la participación finaliza con darle a quien ha participado
    la capacidad de agencia para resolver sus problemas, no decidir por otros.

    Quería comentar temas que han sido muy feos. Por ejemplo, la preciosa campaña ''Qué bien sabe volver al Palmar'' no nos
    supo tan bien, porque nosotros estuvimos recibiendo y desviando turistas los mismos días de las inundaciones, y los tuvimos
    que desviar el mismo pueblo. Turismo extranjero desinformado que pretendía llegar a Alginet en bicicleta en plena inundación.
    Y desde las mismas agencias de turismo, oficinas de turismo del Ayuntamiento, regentadas por Visit València, cuando ya
    se había pasado toda la inundación y lo que reclamaba era la recuperación económica del sector hostelero, que es muy importante
    en mi pueblo, se les estaba diciendo que no vinieran a la Albufera. Aquella campaña de Qué bien sabe era qué amargo nos
    ha sabido que el Ayuntamiento nos eche a la gente fuera.

    Bien, creo que no hace falta que diga nada más. Han sido cosas muy feas, cosas de falta de comunicación y de un profundo
    desconocimiento. Ya que han demostrado ese profundo desconocimiento de nuestro territorio solo pedimos eso, que nos sigan
    escuchando y que esa escucha implique un compromiso en respetar aquellas cosas que pacten con nosotros.'
  text_val: ''
  resum_cas: Segunda intervención de Sancanuto defendiendo que las entidades ciudadanas hacen política legítima, exigiendo
    participación real y denunciando la campaña turística que perjudicó al Palmar tras la DANA.
  resum_val: Segona intervenció de Sancanuto defensant que les entitats ciutadanes fan política legítima, exigint participació
    real i denunciant la campanya turística que va perjudicar el Palmar després de la DANA.
  source: manual
- id: 2025-07-22-002
  pleno_id: '2025-07-22'
  ordre: 2
  intervinient: Miguel Carlos Oliver Trilles, Jose Domingo Estrela Leiva
  entitat: Associació Cultural Falla Av. Malvarrosa-Antoni Pons-Cavite / Societat Marina Auxiliant
  tipus_entitat: cultural
  barri_o_zona: Poblats Marítims, Cabanyal
  punts_ordre_dia: Discursos de odio
  idioma_original: mixt
  text_original: 'Sr. Oliver: Bueno, pues lo primero, señora presidenta, buenas tardes señoras y señores concejales. Un profundo
    respeto a todos ustedes, pues la verdad tienen un trabajo bastante difícil. Quiero darle primero las gracias a la Asociación
    Cultural Falla de la Malvarrosa por darnos esta oportunidad no solo de estar aquí, sino encima de que se nos escuche.
    Porque hace falta que nos escuchen todos. Yo os lo pido por favor, a vosotros y a vosotras.

    Vamos a ver, mi nombre es Miguel Oliver y represento a la Sociedad Marina Auxiliante. Y ustedes dirán, ¿y qué es la Marina
    Auxiliante? Bueno, pues vamos a ver, ya no es lo que es la Marina Auxiliante, sino la gente que compone esa Marina Auxiliante.
    Son cientos de familias valencianas que formamos y hemos formado la columna vertebral de los poblados marítimos.

    Vivimos desde hace décadas bajo la sombra de una profunda inseguridad jurídica. Nuestros hogares, construidos con el esfuerzo
    de incontables horas, el trabajo, el cariño trasmitido a lo largo de generaciones, se asienta sobre un terreno cuya propiedad
    es del Ayuntamiento de València y que ahora puede reclamarlo como suyo. Esta situación sería insostenible si lo reclamaran
    de esta forma. Representaría un ataque directo a la vida, a la historia y a la dignidad de quienes hemos forjado y mantenido
    esta comunidad, que hemos vivido en el Cabanyal, que hemos aguantado todos los embistes.

    Pero claro, ahora tenemos una reciente declaración de caducidad de la concesión del 2018 y la confirmación judicial de
    la propiedad del suelo y del vuelo por parte del Ayuntamiento en abril del 2024. Nos hemos quedado sin nada. Hemos sido
    sistemáticamente ignorados. Nuestras solicitudes de compra del suelo han caído en un silencio administrativo sepulcral.
    Nos hemos enfrentado a bloqueos constantes de permisos de obra y de mantenimiento.

    Somos familias honradas, gente trabajadora. Nuestro apego al lugar es innegable. Y perderlo sería una amputación de nuestra
    propia identidad, de nuestra propia historia. ¿Qué hay de aquellos que con su esfuerzo y su arraigo han contribuido al
    crecimiento y la vitalidad de nuestras ciudades durante décadas? ¿Les expropiamos la vivienda porque ya es del Ayuntamiento?
    ¿Los dejamos sin vivienda?

    Cuando fuimos a entregar las llaves de lo que era la concesión, fuimos a la Concejalía que nos toca que es Patrimonio.
    Y ahí nos encontramos a Juan Manuel Badenas y a la concejala de Responsabilidad Patrimonial, Cecilia Herrero. Ha sido
    un valioso rayo de esperanza porque nos han escuchado, nos han comprendido y encima nos quieren ayudar.

    Esperamos que entre todos se puedan encontrar una solución jurídica definitiva. Confiamos en que la moción que ha propuesto
    en este Pleno pueda otorgar una seguridad jurídica a los vecinos y vecinas. Es hora de que el Ayuntamiento reconozca el
    arraigo de nuestras familias y nos permita consolidar la propiedad del suelo. Ojalá se llegue a un acuerdo que finalmente
    se abra camino para que las familias de la Lonja y otras zonas afectadas que puedan regularizar la propiedad de sus viviendas.
    Y muchísimas gracias por escucharme.

    Sr. Estrela: Bona vesprada a tots i a totes. Crec que em queda molt poc de temps. Vaig a canviar un poc el que anava a
    dir i resumir-ho. Primer, he sentir parlar fa molt poc de temps del tema de la vivenda. Ací del que es tracta ara és que
    40 famílies que viuen en la Llotja de Pescadors que estan vivint més de cent anys. Jo sóc un propietari i ho he heretat
    del meu iaio. Va ser dels primers que varen construir la Llotja de Pescadors. Ara, en quina situació ens trobem? Després
    de la sentència n''hi ha un dubte total de què és el que va a passar. L''Ajuntament encara no ens ha dit res. Per tant,
    el que volem és reprendre una altra vegada les negociacions que teníem obertes per saber en quina situació ens trobem.
    La gent, les famílies tenen molta por i molta incertesa. No és lògic que després d''estar vivint cent anys, no cent anys
    seguits sinó escalonadament, ara es troben en una situació que possiblement els expropien. Expropien a unes famílies que
    han estat pagant impostos, IBI, llum, aigües, en una situació normal de viure. No seria lògic.

    Demanem a l''Ajuntament que als seus ciutadans, que els ha de protegir d''alguna manera, òbriga les negociacions i es
    puga arribar a un acord, que és el que nosaltres demanem. Però ja portem molts anys demanant-ho. És la compra del sòl.
    Estem disposats a pagar-ho, perquè el vol és nostre. És el que construïren els agüelos. Voldríem arribar a un nou consens
    amb l''Ajuntament, però que se''ns òbriga una taula de negociació clara per a poder tractar el tema. Torne a repetir,
    les famílies tenen molta por. És gent humil i és gent major. Si el dia que siga això s''acabara, diguen vostés on van
    a viure, quina vida els espera quan no han fet res realment per a perdre la propietat de la vivenda.

    Moltes gràcies per escoltar-me.'
  temes:
  - habitatge
  - patrimoni
  - barris
  text_cas: 'Sr. Oliver: Bueno, pues lo primero, señora presidenta, buenas tardes señoras y señores concejales. Un profundo
    respeto a todos ustedes, pues la verdad tienen un trabajo bastante difícil. Quiero darle primero las gracias a la Asociación
    Cultural Falla de la Malvarrosa por darnos esta oportunidad no solo de estar aquí, sino encima de que se nos escuche.

    Mi nombre es Miguel Oliver y represento a la Sociedad Marina Auxiliante. Son cientos de familias valencianas que formamos
    y hemos formado la columna vertebral de los poblados marítimos. Vivimos desde hace décadas bajo la sombra de una profunda
    inseguridad jurídica. Nuestros hogares, construidos con el esfuerzo de generaciones, se asientan sobre un terreno cuya
    propiedad es del Ayuntamiento de València. Tenemos una reciente declaración de caducidad de la concesión del 2018 y la
    confirmación judicial de la propiedad del suelo por parte del Ayuntamiento en abril del 2024. Nos hemos quedado sin nada.
    Hemos sido sistemáticamente ignorados. Nuestras solicitudes de compra del suelo han caído en un silencio administrativo
    sepulcral.

    Somos familias honradas, gente trabajadora. Perder nuestros hogares sería una amputación de nuestra propia identidad.
    Esperamos que se pueda encontrar una solución jurídica definitiva. Es hora de que el Ayuntamiento reconozca el arraigo
    de nuestras familias y nos permita consolidar la propiedad. Muchísimas gracias por escucharme.

    Sr. Estrela: Buenas tardes a todos y a todas. Creo que me queda muy poco tiempo. Voy a cambiar un poco lo que iba a decir
    y resumirlo. Aquí de lo que se trata ahora es que 40 familias que viven en la Lonja de Pescadores que llevan viviendo
    más de cien años. Yo soy propietario y lo he heredado de mi abuelo. Fue de los primeros que construyeron la Lonja de Pescadores.
    ¿En qué situación nos encontramos? Después de la sentencia hay una duda total de qué es lo que va a pasar. El Ayuntamiento
    todavía no nos ha dicho nada. Lo que queremos es retomar las negociaciones que teníamos abiertas. Las familias tienen
    mucho miedo e incertidumbre. No es lógico que después de estar viviendo cien años, ahora se encuentren en una situación
    en que posiblemente les expropien. A unas familias que han estado pagando impuestos, IBI, luz, agua, en una situación
    normal de vivir.

    Pedimos al Ayuntamiento que abra las negociaciones y se pueda llegar a un acuerdo. Es la compra del suelo. Estamos dispuestos
    a pagarlo, porque el vuelo es nuestro. Las familias tienen mucho miedo. Es gente humilde y gente mayor. Si el día que
    sea esto se acabara, díganles dónde van a vivir.

    Muchas gracias por escucharme.'
  text_val: 'Sr. Oliver: Bé, doncs el primer de tot, senyora presidenta, bona vesprada senyores i senyors regidors. Un profund
    respecte a tots vostés, la veritat tenen un treball bastant difícil. Vull donar-li primer les gràcies a l''Associació
    Cultural Falla de la Malvarrosa per donar-nos esta oportunitat no sols d''estar ací, sinó a més que se''ns escolte.

    El meu nom és Miguel Oliver i represente la Societat Marina Auxiliant. Són centenars de famílies valencianes que formem
    i hem format la columna vertebral dels poblats marítims. Vivim des de fa dècades sota l''ombra d''una profunda inseguretat
    jurídica. Les nostres llars, construïdes amb l''esforç de generacions, s''assenten sobre un terreny la propietat del qual
    és de l''Ajuntament de València. Tenim una recent declaració de caducitat de la concessió del 2018 i la confirmació judicial
    de la propietat del sòl per part de l''Ajuntament a l''abril del 2024. Ens hem quedat sense res. Hem sigut sistemàticament
    ignorats. Les nostres sol·licituds de compra del sòl han caigut en un silenci administratiu sepulcral.

    Som famílies honrades, gent treballadora. Perdre les nostres llars seria una amputació de la nostra pròpia identitat.
    Esperem que es puga trobar una solució jurídica definitiva. És hora que l''Ajuntament reconega l''arrelament de les nostres
    famílies i ens permeta consolidar la propietat. Moltíssimes gràcies per escoltar-me.

    Sr. Estrela: Bona vesprada a tots i a totes. Crec que em queda molt poc de temps. Vaig a canviar un poc el que anava a
    dir i resumir-ho. Ací del que es tracta ara és que 40 famílies que viuen en la Llotja de Pescadors que estan vivint més
    de cent anys. Jo sóc un propietari i ho he heretat del meu iaio. Va ser dels primers que varen construir la Llotja de
    Pescadors. Ara, en quina situació ens trobem? Després de la sentència n''hi ha un dubte total de què és el que va a passar.
    L''Ajuntament encara no ens ha dit res. El que volem és reprendre les negociacions. Les famílies tenen molta por i molta
    incertesa. No és lògic que després d''estar vivint cent anys ara possiblement els expropien.

    Demanem a l''Ajuntament que òbriga les negociacions i es puga arribar a un acord. És la compra del sòl. Estem disposats
    a pagar-ho, perquè el vol és nostre. Les famílies tenen molta por. És gent humil i gent major. Si el dia que siga això
    s''acabara, diguen vostés on van a viure.

    Moltes gràcies per escoltar-me.'
  resum_cas: Familias de la Lonja de Pescadores piden seguridad jurídica y la compra del suelo donde viven desde hace generaciones,
    tras perder la concesión y la propiedad judicial del vuelo a favor del Ayuntamiento.
  resum_val: Famílies de la Llotja de Pescadors demanen seguretat jurídica i la compra del sòl on viuen des de fa generacions,
    després de perdre la concessió i la propietat judicial del vol a favor de l'Ajuntament.
  source: manual
- id: 2025-07-22-100
  pleno_id: '2025-07-22'
  ordre: 3
  intervinient: Boutaina El Hadri El Gmili, Nadia Tabib Chouitar
  entitat: Jóvenes hacia la Solidaridad y el Desarrollo / Casa Marruecos
  tipus_entitat: ong
  barri_o_zona: València
  punts_ordre_dia: Discursos de odio
  idioma_original: mixt
  text_original: 'Sra. El Hadri: Muchas gracias a todos y a todas, buenas tardes. Vinimos aquí en representación de Casa Marruecos
    y Jovesólides, organizaciones que trabajan por la justicia social, la inclusión y los derechos humanos en nuestra ciudad.
    Un espacio como este, el Pleno del Ayuntamiento de València, es, debería ser, la casa del pueblo. Vinimos aquí, una vez
    más, con respeto, pero con una verdad que no se puede seguir ignorando. Ya hemos estado aquí varias veces. Vinimos cuando
    denunciamos el genocidio en Gaza, volvimos tras los ataques racistas que sufrieron las personas migradas durante la dana.
    Y cada vez lamentablemente salimos con la misma sensación, decepción. Y, sin embargo, seguimos viniendo, porque seguimos
    creyendo en la política.

    Pero lo que está ocurriendo no se puede seguir escondiendo. No es puntual lo que estamos viviendo muchas personas migradas,
    especialmente personas marroquíes y musulmanas magrebíes es grave, muy grave. Y está creciendo y se llama racismo, se
    llama morofobia, se llama islamofobia. Lo que pasó en Torre Pacheco no debería pasar en ningún lugar, pero la verdad es
    que vemos que podía pasar aquí.

    La islamofobia y la morofobia son una realidad y lo más preocupante es que ya no se ocultan. Se expresan abiertamente,
    se difunden en las redes, se repiten en los medios de comunicación y en ocasiones se insinúan desde las instituciones.

    Señores de Vox, dejen de engañar a la sociedad, no somos una amenaza, no somos delincuentes, no somos un riesgo. Somos
    parte de este pueblo, somos ciudadanas, somos personas. Sin las personas migrantes este país y esta ciudad no se sostienen.
    Estamos aquí y no nos vamos a ir. Somos casi el 20 % de la sociedad valenciana.

    Señora alcaldesa, en campaña nos reunimos con usted. Le preguntamos si iba a pactar con la ultraderecha, si iba a protegernos
    de los discursos de odio. Usted dijo que sí, que gobernaría para todas las personas. Hoy, con tristeza lo decimos: no
    nos sentimos protegidas. El discurso tiene consecuencias. Cuando se siembra la sospecha, se está legitimando el miedo,
    el rechazo y la violencia. Si no hay una postura clara, si se sigue tolerando el relato del odio, puede que pase una tragedia.

    Sra. Tabib: Sí, és curtet. Bona vesprada. Jo vaig nàixer ací, sóc valenciana i estic orgullosa. Però també sóc mora i
    orgullosa. I no vull eixir pel carrer amb por per portar un hijab. No vull tindre por per ser qui sóc. Em negue a viure
    amb por. Cada dia lluite contra això, per mi, per la meua mare, pel meu germà menut, per les meues veïnes, per les meues
    amigues, per totes vosaltres.

    Però no hauria de ser la meua lluita. Eixa és la vostra responsabilitat, protegir-nos i assegurar-vos que cap persona
    com jo haja d''aprendre a resistir només per existir. Perquè tindre por per ser un mateix no hauria de formar part de
    créixer en aquesta ciutat. Per això hui exigim: Que es reconega de manera pública l''augment de la islamofòbia, morofòbia
    i racisme a la nostra ciutat. Que es condemne sense ambigüitats qualsevol discurs que vincule immigració amb delinqüència.
    Que es desenvolupen polítiques valentes d''inclusió social i convivència real. Que es protegisca a qui viu amb por i no
    s''atreveix a denunciar. Que es defensen amb claredat els drets humans, no com a consigna sinó com a pràctica institucional.

    Volem viure sense por. Volem caminar pels nostres carrers sense mirades sospitoses. Volem poder parlar, vestir, resar,
    viure, sense haver de justificar la nostra existència. Estem ací, seguirem ací i no ens callarem, perquè el silenci no
    ens protegeix, perquè la por no ens paralitza, perquè la dignitat no es negocia.

    Des de València, amb veu ferma diem: stop morofòbia, stop islamofòbia, stop racisme. Moltes gràcies.'
