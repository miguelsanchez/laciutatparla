- id: 2013-05-31-104
  pleno_id: '2013-05-31'
  ordre: 7
  intervinient: '[***]'
  entitat: Asociación de Vecinos de Natzaret
  tipus_entitat: av
  idioma_original: valenciano
  text_original: 'Sres. i Sras. regidors:

    El mes passat Port i Ajuntament van firmar el conveni de cessió de la dàrsena, i es van donar un termini
    de 6 mesos per formalitzar un acord específic sobre l’ordenació de la frontera portuària amb el nostre
    barri, “tenint en compte allò arreplegat respecte d’esta en el conveni de 19 de maig de 1986”, conveni
    per cert on van pactar sacrificar la platja de Natzaret per al creixement sud del port en contra de
    la postura de la nostra AVV de Natzaret.

    Ara els invitem, als 4 grups municipals, a avaluar el compliment de les mesures acordades, per tal
    de pal.liar l’impacte negatiu sobre el barri, en aquell document.

    La nostra AVV denuncia que 27 anys després, el canal del vell llit del Túria se segueix contaminant,
    en contra d’allò acordat, cada vegada que amenaça pluja d’una certa intensitat. A mès a mès, el final
    del riu queda resolt com una vulgar claveguera subterrània, sense eixida oberta al mar i sense relació
    amb el poliesportiu, que té al costat.

    Denunciem també que el passeig del Levante ID és un pipican a palmeres, que acaba en un perillós desnivell
    junt amb un solar asfaltat que hauria de ser un jardí.

    D’altra banda, en l’antic pàrquing de camions de la fàbrica d’oli al carrer Castell de Pop no s’ha
    construït cap zona verda, tot i que així quedava arreplegat en l’esmentat conveni que va caducar ara
    fa dos anys.

    Finalment, en el parc de Mar Azul aconseguírem salvar 40.000 m2 de platja i convertir-la en un jardí,
    gràcies a la mobilització de la nostra associació de veïns. Però en eixe parc només s’hi fa un manteniment
    parcial i està mal il.luminat. Pel que fa a l’antic baneari Mar Azul, segueix tancat al públic 27
    anys després de la firma d’aquell conveni, d’haverse reconstruït dues vegades i no assemblar-se en
    res a l’original, i d’haver quedat abandonat i sense vigilància fins fa 2 mesos.

    Per això insistim a dir que l’Ajuntament i el Port tenen un deute amb el barri de Natzaret. Ens van
    llevar la platja, ens van empobrir injustament i ben just es van preocupar de complir algun dels compromisos
    adquirits.

    Esperem doncs l’avaluació del conveni de 1.986 per part dels 4 grups municipals. I actuar en consequencia.

    I respecte de la zona sud portuària que limita amb Natzaret, com ja saben molts de vostés, plantegem:

    1) Que els vials del port no s’acosten més al nucli urbà i es mantinguen en els límits de l’anterior
    conveni.

    2) Un passeig de vianants amb carril bici en la frontera amb el port, connectat amb el Jardí del Túria,
    la Marina i el carril bici del Saler.

    3) Zones verdes i equipaments públics posant atenció a la promoció de l’ocupació en el barri.

    4) I finalment recuperar la relació de Natzaret amb el mar.

    Moltes gràcies per la seua atenció. Esperem poder parlar en pròximes ocasions.'
  reason: 'Acta: ''interviene ****** en representación de la Asociación de Vecinos de Natzaret, quien
    manifiesta lo siguiente''; speech missing from extraction.'
  date: '2026-10-19'
  finding: E1b-8110bb1e0d
  text_cas: 'Sras. y Sres. concejales:

    El mes pasado Puerto y Ayuntamiento firmaron el convenio de cesión de la dársena, y se dieron un **plazo
    de 6 meses** para formalizar un acuerdo específico sobre la ordenación de la frontera portuaria con
    nuestro barrio, "teniendo en cuenta lo recogido respecto de esta en el convenio de 19 de mayo de 1986",
    convenio por cierto donde pactaron **sacrificar la playa de Natzaret** para el crecimiento sur del
    puerto en contra de la postura de nuestra AVV de Natzaret.

    Ahora les invitamos, a los 4 grupos municipales, a **evaluar el cumplimiento** de las medidas acordadas,
    con el fin de paliar el impacto negativo sobre el barrio, en aquel documento.


    Nuestra AVV denuncia que **27 años después**, el canal del antiguo cauce del Túria sigue contaminándose,
    en contra de lo acordado, cada vez que amenaza lluvia de una cierta intensidad. Además, el final del
    río queda resuelto como **una vulgar alcantarilla subterránea**, sin salida abierta al mar y sin relación
    con el polideportivo, que tiene al lado.

    Denunciamos también que el **paseo del Levante ID** es un parque para perros entre palmeras, que acaba
    en un **peligroso desnivel** junto con un solar asfaltado que debería ser un jardín.

    Por otra parte, en el antiguo aparcamiento de camiones de la fábrica de aceite en la calle Castell
    de Pop **no se ha construido ninguna zona verde**, aunque así quedaba recogido en el mencionado convenio
    que caducó hace dos años.

    Finalmente, en el parque de Mar Azul conseguimos **salvar 40.000 m2 de playa** y convertirla en un
    jardín, gracias a la movilización de nuestra asociación de vecinos. Pero en ese parque solo se hace
    un **mantenimiento parcial** y está mal iluminado. En cuanto al antiguo balneario Mar Azul, sigue
    **cerrado al público 27 años después** de la firma de aquel convenio, habiéndose reconstruido dos
    veces y no parecerse en nada al original, y habiendo quedado abandonado y sin vigilancia hasta hace
    2 meses.


    Por eso insistimos en decir que **el Ayuntamiento y el Puerto tienen una deuda** con el barrio de
    Natzaret. Nos quitaron la playa, nos empobreceeron injustamente y apenas se preocuparon de cumplir
    algunos de los compromisos adquiridos.

    Esperamos pues la evaluación del convenio de 1.986 por parte de los 4 grupos municipales. Y actuar
    en consecuencia.


    Y respecto a la zona sur portuaria que limita con Natzaret, como ya saben muchos de ustedes, planteamos:

    1) Que los viales del puerto **no se acerquen más al núcleo urbano** y se mantengan en los límites
    del anterior convenio.

    2) Un **paseo de peatones con carril bici** en la frontera con el puerto, conectado con el Jardín
    del Túria, la Marina y el carril bici del Saler.

    3) **Zonas verdes y equipamientos públicos** poniendo atención a la promoción del empleo en el barrio.

    4) Y finalmente **recuperar la relación de Natzaret con el mar**.

    Muchas gracias por su atención. Esperamos poder hablar en próximas ocasiones.'
  resum_cas: La AVV de Natzaret denuncia el incumplimiento de compromisos del convenio de 1986 entre Port
    y Ajuntamiento, reclamando evaluación de medidas, eliminación de contaminación en el cauce del Túria,
    mejora del paseo del Levante ID, creación de zonas verdes, mantenimiento adecuado del parque Mar Azul
    y recuperación de la relación del barrio con el mar.
  resum_val: L'AVV de Natzaret denúncia l'incompliment dels compromisos del conveni de 1986 entre Port
    i Ajuntament, reclamant avaluació de mesures, eliminació de contaminació en el canal del Túria, millora
    del passeig del Levante ID, creació de zones verdes, manteniment adequat del parc Mar Azul i recuperació
    de la relació del barri amb el mar.
