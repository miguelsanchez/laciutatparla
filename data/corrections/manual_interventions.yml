  reason: 'Acta: ''Posteriormente interviene D. ******, en representación de la Asociación de Vecinos
    de Benimaclet'' - speaker missed by extraction'
  text_original: 'Gracias.


    Buenos días, por decir algo.


    Hoy, mientras estamos aquí hablando, 30 familias valencianas están siendo echadas de sus casas. No
    vamos a irnos por las ramas. De todos es conocida la situación de profunda crisis económica en la
    que nos encontramos, una crisis generada tras el estallido de una burbuja inmobiliaria que fue propiciada
    por la avaricia de los bancos y consentida por las autoridades e instituciones encargadas de regular
    estas prácticas.


    El resultado lo estamos padeciendo en la calle. Hay listas de espera para recibir la ayuda de los
    bancos de alimentos. Las personas están viéndose obligadas a recuperar viviendas vacías, como está
    ocurriendo en el barrio de Malilla y en otros asentamientos denominados ilegales, que existen desde
    hace años en nuestra ciudad. La gente está sufriendo. Estamos hablando de una situación de emergencia,
    cada día que pasa 30 familias son echadas de su casa en la Comunidad Valenciana.


    Según datos hechos públicos por el Colegio de Registradores de la Propiedad, durante todo el año 2012
    más de 30.000 familias en España fueron echadas de su única vivienda por no poder hacer frente al
    pago de la hipoteca; 7.000 de estas familias eran valencianas. Hay que recordar que la media de miembros
    que forman una familia en este país es de 3 personas, así que estamos hablando de un problema que
    afecta a más de 20.000 personas cada año sólo en la Comunidad Valenciana.


    Desde el inicio de la crisis en 2007 se han producido en este país más de 500.000 ejecuciones hipotecarias
    de vivienda habitual, lo que significa que al menos 1.500.000 personas han sido echadas a la calle
    en España. Echen cuentas, no es el problema de unos pocos y lejos de solucionarse la situación no
    hace más que empeorar.


    Según el INE, existen más de 500.000 viviendas vacías en la Comunidad Valenciana, más de 200.000 sólo
    en Valencia. De todas ellas, al menos 50.000 son propiedad de bancos y grupos financieros. Estas viviendas,
    fruto del desahucio y la especulación, deben ser puestas a disposición de las familias inmediatamente.


    Estamos hablando de derechos humanos, estamos hablando de un derecho a la vivienda que está recogido
    en nuestra constitución, de una legislación injusta que prioriza los intereses de entidades financieras
    privadas por encima de las necesidades de los ciudadanos y de unas instituciones que están eludiendo
    su responsabilidad sobre la vida y la muerte de las personas que forman esta sociedad.


    Es una vergüenza que las instituciones públicas estén siendo utilizadas como si fuesen el cobrador
    del frac de los bancos, que estén siendo utilizadas contra los derechos y las necesidades de la ciudadanía.
    No se puede coger a la gente y dejarla en la calle sin más, sin que exista tan siquiera un mecanismo
    institucional que las proteja y se ocupe de proporcionarles un techo y garantice su derecho a la vivienda.


    Esperamos desde la Plataforma y desde las Asociaciones de Vecinos que os pongáis manos a la obra para
    solucionar lo antes posible estas situaciones dentro de vuestro ámbito.


    Gracias.'
  date: '2026-10-20'
  finding: E1b-fc3968c259
  text_val: 'Gràcies.


    Bons dies, per dir quelcom.


    Huí, mentre estem ací parlant, **30 famílies valencianes estan sent echadas de les seues cases**.
    No ens vam a anar per les branques. De tots és coneguda la **situació de profunda crisi econòmica**
    en la que ens trobem, una crisi generada després de l''estall d''una **bombolla immobiliària** que
    va ser propiciada per la avaricia dels bancs i consentida per les autoritats i institucions encarregades
    de regular aquestes pràctiques.


    El resultat ho estem patint al carrer. Hi ha **llistes d''espera per rebre ajuda de bancs d''aliments**.
    Les persones estan veient-se obligades a recuperar vivendes buides, com està ocorrent en el barri
    de Malilla i en altres assentaments denominats il·legals, que existixen des de fa anys en la nostra
    ciutat. **La gent està sofrint**. Estem parlant d''una **situació d''emergència**, cada dia que passa
    30 famílies són echadas de la seua casa en la Comunitat Valenciana.


    Segons dades fetes públiques pel Col·legi de Registradors de la Propietat, durant tot l''any 2012
    **més de 30.000 famílies en Espanya van ser echadas** de la seua única vivenda per no poder fer front
    al pagament de la hipoteca; **7.000 d''aquestes famílies eren valencianes**. Cal recordar que la mitjana
    de membres que formen una família en aquest país és de 3 persones, així que estem parlant d''un problema
    que afecta a més de 20.000 persones cada any només en la Comunitat Valenciana.


    Desde l''inici de la crisi en 2007 s''han produït en aquest país **més de 500.000 execucions hipotecàries**,
    el que significa que almenys **1.500.000 persones han estat echadas al carrer en Espanya**. Faça vostés
    els comptes, no és el problema d''uns pocs i lluny de solucionar-se la situació no fa més que empitjorar.


    Segons l''INE, existixen **més de 500.000 vivendes buides** en la Comunitat Valenciana, més de 200.000
    només en València. De totes elles, **almenys 50.000 són propietat de bancs**. Aquestes vivendes, fruit
    del desniment i l''especulació, han de ser posades a disposició de les famílies immediatament.


    Estem parlant de **drets humans**, estem parlant d''un **dret a l''habitatge** que està recollit en
    la nostra constitució, d''una legislació injusta que prioritza els interessos d''entitats financeres
    privades per damunt de les necessitats dels ciutadans i d''unes institucions que estan eludint la
    seua responsabilitat sobre la vida i la mort de les persones que formen aquesta societat.


    És una **vergonya que les institucions públiques** estiguen sent utilitzades com si fusen el cobrador
    dels bancs, que estiguen sent utilitzades contra els drets i les necessitats de la ciutadania. No
    es pot coger a la gent i deixar-la al carrer sense més, sense que existixca tan siquiera un **mecanisme
    institucional que les proteja** i s''ocupe de proporcionar-les un sostre i garantisca el seu dret
    a l''habitatge.


    Esperem des de la Plataforma i des de les Associacions de Veïns que us poseu mans a l''obra per solucionar
    el més prompte possible aquestes situacions dins del vostre àmbit.


    Gràcies.'
  resum_cas: La Asociación de Vecinos de Benimaclet denuncia la crisis de desahucios y falta de vivienda
