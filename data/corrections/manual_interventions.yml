    de la unitat** suposaria desaprofitar les instal·lacions d''este centre per ser la base de les relacions
    entre el nostre barri i amb barris pròxims.


    L''objectiu d''esta petició és que **l''Ajuntament de València intermedie** en la decisió de Conselleria
    d''Educació perquè **es mantinguen les línies en 1º d''Infantil** del CEIP Sector Aéreo, de València.


    Moltes gràcies per escoltar-nos.'
