  tipus_entitat: av
  idioma_original: castellano
  reason: 'Acta: ''Por último interviene Dª ******, en representación de la Asociación de Vecinos Vilanova
    del Grao'' - speaker missed by extraction'
  text_original: 'Buenos días, soy [***].


    Me gustaría que me escuchasen, que no hubiese corrillos.


    Buenos días, y como decía mi compañero, por decir algo.


    Soy responsable de una de tantas y tantas familias desahuciadas desde el inicio de esta mal llamada
    crisis. Les recuerdo que los números son vergonzosos. Mi compañero hablaba del 2012, pero en el primer
    semestre del 2013 unos 35.000 desahucios se llevaron a cabo. Perdí mi puesto de trabajo y casi dos
    años después, en mayo de 2009, mi casa, junto con todos mis ahorros y artículos de valor que vendí
    para poder pagar la hipoteca.


    Por ello, desde ese primer día estoy con la PAH. No quiero que nadie pase por lo que estoy pasando
    yo. La PAH me ha ayudado a no perder la dignidad y es lo que me ha hecho sobrevivir en esta ciudad,
    tan bonita por fuera pero muy podrida por dentro. No hay ningún medio de acceder a una vivienda con
    precios asequibles a personas que como yo o bien somos paradas de larga duración o tenemos unos ingresos
    tan ridículos que no nos alcanza para poder pagar el alquiler y por supuesto el agua, la luz, el gas...,
    cuando son gastos de primera necesidad sin los cuales ninguna persona puede tener una vida digna.


    Estoy convencida que tengo derecho a un techo, así lo dice la Constitución Española en su art. 47:
    ‘Todos los españoles tienen derecho a disfrutar de una vivienda digna y adecuada. Los poderes públicos
    promoverán las condiciones necesarias y establecerán las normas pertinentes, etc.’. Nadie ha sabido
    decirme si el Ayuntamiento de Valencia tiene presente este artículo o está exento de cumplir dichos
    apartados, ¿me lo pueden ustedes decir?


    Estoy cansada de moverme por Servicios Sociales y por los organismos competentes en materia de vivienda,
    tanto municipales como autonómicos, para intentar encontrar un techo para mi hija y para mí; que pueda
    pagar, por supuesto. Y algunos otros en materia de trabajo, ¿les suena el CMIO, Apunt o Valencia Inserta?
    Todos estos inventos del Ayuntamiento para cumplir el expediente y que no resultan para nada operativos.
    Sras. y Sres., para poder pagar tenemos que trabajar. Aunque si en materia de vivienda que hay viviendas
    de sobra no hacen nada, ¿qué van a hacer con la cuestión del trabajo?


    Nos cortan la luz y en la factura siguiente tenemos un sobrecoste además del consumo que no podemos
    pagar. Nos cortan el agua con una sola factura impagada, haya menores o no en la vivienda. Y con la
    segunda se llevan hasta el contador. ¿Dónde está la protección al menor?


    En todo este tiempo no han resuelto nada, las únicas soluciones han venido de la mano de la PAH. Mis
    compañeros y compañeras han sido y siguen siendo mi pilar, mi familia y al paso que vamos será la
    única vía para acceder a una vivienda, en este caso propiedad de los bancos. No es justo, Sras. y
    Sres., que hayan rescatado a estos usureros y no rescaten a las personas. No es justo, Sras. y Sres.,
    que haya tanta vivienda vacía en manos de la banca y tanta gente con la única opción de vivir debajo
    de un puente. No es justo que nos aboquen a tanta miseria mientras aquí debaten y aprueban mociones
    que no cumplen o ni siquiera se aprueban propuestas que no estén dentro de sus maneras de negocio.


    Ahora sólo me queda pedirles un favor, que en realidad es su obligación: actúen, cambien las leyes
    y normativas que les impiden tomar cartas en este asunto, son ustedes quienes pueden. Porque si no
    quieren, ¿serán capaces de mirarnos a la cara a los valencianos y a las valencianas?, ¿serán capaces
    de no aprobar esta moción?


    Desde la PAH tenemos una cosa muy clara, que con esto y más sí se puede.'
  date: '2026-10-20'
  finding: E1b-e22269ff78
  text_val: 'Bon dia, sóc [***].


    Me agradaria que m''escoltaren, que no hi hagués corrillos.


    Bon dia, i com deia el meu company, per dir alguna cosa.


    Sóc **responsable d''una de tantes i tantes famílies desnonades** des de l''inici d''esta malament
    anomenada crisi. Els recorde que **els números són vergonyosos**. El meu company parlava del 2012,
    però en el primer semestre del 2013 **uns 35.000 desnonaments** es van dur a terme. Vaig perdre el
    meu lloc de treball i quasi dos anys després, en maig de 2009, la meua casa, juntament amb tots els
    meus estalvis i articles de valor que vaig vendre per a poder pagar la hipoteca.


    Per això, des d''aquell primer dia estic amb la PAH. **No vull que ningú passe pel que estic passant
    jo**. La PAH m''ha ajudat a no perdre la dignitat i és el que m''ha fet sobreviure en esta ciutat,
    tan bonica per fora però molt podrida per dins. **No hi ha cap mitjà d''accedir a un habitatge amb
    preus assequibles** per a persones que com jo o bé som aturades de llarga duració o tenim uns ingressos
    tan ridículs que no ens arriba per a poder pagar el lloguer i, per descomptat, l''aigua, la llum,
    el gas..., quan són **despeses de primera necessitat** sense les quals cap persona pot tindre una
    vida digna.


    Estic convençuda que **tinc dret a un sostre**, així ho diu la Constitució Espanyola en el seu art.
    47: ''Tots els espanyols tenen dret a gaudir d''un habitatge digne i adequat. Els poders públics promouran
    les condicions necessàries i establiran les normes pertinents, etc.''. Ningú ha sabut dir-me si l''Ajuntament
    de València té present este article o està exempt de complir els dits apartats, ¿me ho poden dir vostés?


    Estic cansada de moure''m per Serveis Socials i pels organismes competents en matèria d''habitatge,
    tant municipals com autonòmics, per a intentar trobar un sostre per a la meua filla i per a mi; que
    pugam pagar, per descomptat. I alguns altres en matèria de treball, ¿els sona el CMIO, Apunt o Valencia
    Inserta? Tots estos invents de l''Ajuntament per a complir l''expedient i que no resulten gens operatius.
    Sres. i Sres., **per a poder pagar hem de treballar**. Encara que si en matèria d''habitatge que hi
    ha habitatges de sobra no fan res, ¿què faran amb la qüestió del treball?


    Ens tallen la llum i en la factura següent tenim un sobrecost a més del consum que no podem pagar.
    **Ens tallen l''aigua amb una sola factura impagada**, hi haja menors o no en l''habitatge. I amb
    la segona s''emporten fins al comptador. ¿On està la protecció al menor?


    En tot este temps **no han resolt res**, les úniques solucions han vingut de la mà de la PAH. Els
    meus companys i companyes han sigut i continuen sent el meu pilar, la meua família i al pas que anem
    serà l''única via per a accedir a un habitatge, en este cas propietat dels bancs. **No és just que
    hagen rescatat estos usurers i no rescaten les persones**. No és just, Sres. i Sres., que hi haja
    tant habitatge buit en mans de la banca i tanta gent amb l''única opció de viure sota un pont. No
    és just que ens aboquen a tanta misèria mentre ací debaten i aproven mocions que no compleixen o ni
    tan sols s''aproven propostes que no estiguen dins de les seues maneres de negoci.


    Ara sols em queda demanar-los un favor, que en realitat és la seua obligació: **actuen, canvien les
    lleis i normatives** que els impedixen prendre cartes en este assumpte, són vostés qui poden. Perquè
    si no volen, ¿seran capaços de mirar-nos a la cara als valencians i a les valencianes?, ¿seran capaços
    de no aprovar esta moció?


    Des de la PAH tenim una cosa molt clara, que **amb això i més sí que es pot**.'
