- id: 2016-09-20-115
  pleno_id: '2016-09-20'
  ordre: 15
  intervinient: '[***]'
  entitat: Associació de Veïns del Cabanyal-el Canyamelar i Plataforma Salvem el Cabanyal
  tipus_entitat: av
  idioma_original: valenciano
  reason: Introduced in the acta as 'Salvem el Cabanyal i l’Associació de Veïns del Cabanyal-el Canyamelar.
    Intervé' but not extracted.
  text_original: 'Bona vesprada. Les organitzacions que signen este escrit son conscients dels esforços
    fets per l’equip de govern de l’Ajuntament de València. Sabem de les dificultats en posar ordre en
    molts aspectes que afecten al Cabanyal-Canyamelar i estem disposats a treballar, dins de les nostres
    possibilitats com a organització social, colze amb colze, en la rehabilitació social i urbanística
    del barri. Salvem el Cabanyal i l’ Associació de Veïns Cabanyal-Canyamelar, com a organització reivindicativa
    que és, no deixarà mai de defensar i lluitar per allò que considerem just i que l’Administració no
    haja complit tal com esperàvem d’ella. A hores d’ara creguem que en l’actuació municipal hi han alguns
    aspectes millorables. Hi ha molts problemes a resoldre, esperem que els anirem solucionant en forma
    i temps adequats. Per exemple, hem de donar velocitat a la redacció i aprovació del nou Pla de Rehabilitació
    del Cabanyal-Canyamelar, perquè és possible que ja anem amb retard a hores d’ara. Cal replantejar
    el destí i urgència d’algunes de les inversions anunciades i altres assumptes. Però hi ha un problema
    que, a hores d’ara, ja no es pot dilatar ni un dia més. Estem parlant de la contaminació acústica
    i tots els problemes que d’ella es deriven. A les zones zero del barri no es respecten els drets fonamentals
    següents: el dret a la intimitat del domicili familiar, el dret a un medi ambient sa, el dret a la
    salut i el dret al descans pel dret al treball. La nostra reivindicació es concreta i directa: estos
    problemes, que no han millorat en absolut, deuen estar resolts abans de començar l’any 2017. No pot
    haver altre termini perquè el que està en joc és la salut de ciutadans i ciutadanes, alguns d’ells
    ja majors. Un assumpte tan greu que no es pot allargar per més temps. Com ja he dit, hi ha altres
    assumptes urgents i dels quals tenim molt a parlar i reivindicar. Ara és indiscutiblement el temps
    dels drets fonamentals al Cabanyal-Canyamelar. Moltes gràcies.'
  date: '2026-10-20'
  finding: E1b-0ac4f67014
  text_cas: 'Buenas tardes. Las organizaciones que firman este escrito son conscientes de los **esfuerzos
    realizados por el equipo de gobierno** del Ayuntamiento de Valencia. Sabemos de las dificultades en
    poner orden en muchos aspectos que afectan al Cabanyal-Canyamelar y estamos dispuestos a trabajar,
    dentro de nuestras posibilidades como organización social, **codo con codo**, en la rehabilitación
    social y urbanística del barrio. Salvem el Cabanyal y la Asociación de Vecinos Cabanyal-Canyamelar,
    como organización reivindicativa que es, **nunca dejará de defender** y luchar por lo que consideramos
    justo y que la Administración no ha cumplido tal como esperábamos de ella.


    A estas alturas creemos que en la actuación municipal **hay algunos aspectos mejorables**. Hay muchos
    problemas a resolver, esperamos que los iremos solucionando en forma y tiempo adecuados. Por ejemplo,
    debemos **dar velocidad a la redacción y aprobación** del nuevo Plan de Rehabilitación del Cabanyal-Canyamelar,
    porque es posible que ya vayamos con retraso a estas alturas. **Hay que replantearse el destino y
    urgencia** de algunas de las inversiones anunciadas y otros asuntos.


    Pero hay un problema que, a estas alturas, **ya no se puede dilatar ni un día más**. Estamos hablando
    de la **contaminación acústica** y todos los problemas que de ella se derivan. En las zonas cero del
    barrio no se respetan los **derechos fundamentales siguientes**: el derecho a la intimidad del domicilio
    familiar, el derecho a un medio ambiente sano, el derecho a la salud y el derecho al descanso por
    derecho al trabajo.


    Nuestra reivindicación es concreta y directa: estos problemas, que no han mejorado en absoluto, **deben
    estar resueltos antes de comenzar el año 2017**. No puede haber otro plazo porque lo que está en juego
    es la **salud de ciudadanos y ciudadanas**, algunos de ellos ya mayores. **Un asunto tan grave** que
    no se puede alargar más tiempo.


    Como ya he dicho, hay otros asuntos urgentes de los cuales tenemos mucho que hablar y reivindicar.
    **Ahora es indiscutiblemente el tiempo de los derechos fundamentales** en el Cabanyal-Canyamelar.
    Muchas gracias.'
  resum_cas: La Asociación de Vecinos del Cabanyal-Canyamelar y Plataforma Salvem el Cabanyal reclama
    soluciones inmediatas a la contaminación acústica y otros problemas de rehabilitación urbanística
    del barrio, alertando sobre la vulneración de derechos fundamentales como la salud y el descanso.
  resum_val: L'Associació de Veïns del Cabanyal-Canyamelar i Plataforma Salvem el Cabanyal reclamen solucions
    immediates a la contaminació acústica i altres problemes de rehabilitació urbanística del barri, alertant
    sobre la vulneració de drets fonamentals com la salut i el descans.
