    durante dos meses para comprobar si esas decisiones estaban dando resultados hubiera sido valioso.


    Y termino. Vamos a pasar de **13 superaciones acústicas a 110 superaciones acústicas**, que las vamos
    a medir nosotros. Desde el primer día las vamos a medir nosotros. Eso quiere decir que **los vecinos
    van a sufrir un 800 % más de días de ruido** de lo que estaban sufriendo en un barrio ejemplar, de
    una población de nivel medio adulto perfectamente integrada, que realmente hemos podido conseguir
    resultados inimaginables para **proteger la imagen turística de València**. Y la crisis de los festivales
    se nos ha llevado por delante.


    No me alargo más, pero espero que Vox aún no salve de esto.'
