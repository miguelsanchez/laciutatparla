    Contra la Tauromàquia**, va fer públic un manifest contra els espectacles taurins. Esta vesprada a
    Lisboa el nostre president intervindrà en la presentació de l''**Associació de Veterinaris Abolicionistes
    de la Tauromàquia de Portugal**. L''associació a la qual represente, **amb 407 membres i 8 anys d''història**…


    **Consciència. És des de la ciència** que s''està evolucionant èticament pel que fa a la conducta
    dels essers humans cap a altres essers. **La crueltat amb estos animals no és justificable** perquè
    hui sabem que estos bovins tenen **circuits cerebrals semblants als nostres** relacionats amb l''experiència
    conscient, amb els estats afectius, amb la generació d''estats emocionals i amb l''expressió i manifestació
    de sentiments. Estos animals pateixen i són maltractats, i ja ningú ho pot posar en dubte.


    Gràcies.'
