  text_val: 'Sra. Martinez: Bona vesprada a tots i totes.

    Senyora alcaldessa, senyores i senyors regidors, esperem que hagen gaudit de les seues vacances. Dir-los que ens ha sorprés
    la precipitació en la convocatòria del debat sobre l''estat de la ciutat. I com és un tema que ens afecta tant, no hem
    volgut deixar passar l''oportunitat de manifestar la nostra preocupació. Desgraciadament, des d''Orriols no tenim una
    visió tan positiva. A Orriols en Lluita ens hem aferrat a l''esperança. Creiem que és una actitud activa que es dirigeix
    a la cerca de metes específiques amb la idea d''aconseguir un futur millor, malgrat les dificultats i assumint responsabilitats
    que ens resten temps i gaudi de la vida.

    En contrast, sembla que l''optimisme d''este govern va més enfocat a la creença passiva que tot eixirà bé en general,
    sense que necessàriament s''haja d''exercir alguna acció. Esta creença pot portar a la frustració als ciutadans perquè
    no es complixen els compromisos adquirits.

    A l''assemblea del dimecres 3 de setembre, amb participació de veïns, veïnes i associacions d''Orriols, vam fer anàlisi
    de la situació del barri i dels fets que hem viscut este estiu. Volem transmetre-li la profunda preocupació i en molts
    casos indignació que sentim. La impotència que transmetien els més afectats.

    En algunes zones del barri continua produint-se ocupació massiva de l''espai públic, en molts casos per part de persones
    incíviques que consumixen alcohol i substàncies estupefaents. Deixen quantitat de fem al seu voltant i no permeten el
    descans als veïns. Hi ha venda d''alcohol fins a altes hores de la matinada, inclús des d''algun domicili particular.
    Els veïns criden repetides vegades a la Policia Local, que de nit no apareix. Es permet l''estacionament i la circulació
    en zones per a vianants i inclús damunt de les voreres, sense cap respecte pels vianants i sense que apreciem actuacions
    policials. Hem observat la presència d''adolescents i joves sense cap tipus de control que es dediquen a activitats il·lícites.
    Desafortunadament, a Orriols no comptem amb activitats culturals i sociosaludables que puguen interessar esta població,
    alguna cosa molt necessària donades les característiques del barri. La vulnerabilitat i la marginalitat és molta i en
    la nostra opinió continua en augment.

    Sr. Cebral: Bona vesprada a totes i a tots.

    Veiem que no avancem en cap dels nostres projectes i per això els els recordarem. Sabem que els sonen, però davant la
    falta de solucions la nostra repetició. El poliesportiu un any després del seu tancament seguix igual, tancat. Esperem
    que l''ansiada reparació de la coberta arribe prompte. Quant a la biblioteca, després de l''última reunió que vam tindre
    amb vosté, senyora alcaldessa, se''ns va prometre una solució que hui en dia ja no és possible. Veiem que la nova solució
    és la reparació de l''alqueria. Quant de temps es tarda a reparar una alqueria? S''ha començat ja amb eixe pla de redacció?

    Els servicis socials també són un tema candent a Orriols. Estan col·lapsats. Van prometre un centre de servicis socials
    exclusiu per a Orriols, disponible en 2024. I ara sembla que no existix. Tardarà anys, si és que arriba. Continuem esperant
    la plantació de 130 arbres, pendent des de fa anys que arribe un informe. On està eixe informe de Patrimoni? Quan es té
    interés per agilitzar alguna cosa, s''agilitza, es tira avant, s''agilitzen tots eixos tràmits. Sembla que en este cas
    no es té interés. No tenim notícies de la remodelació de la plaça d''Esteban Dolz. Els carrers continuen bruts i plens
    de trastos. Estem cansats de dir que ha d''haver-hi intervencions d''un altre tipus, a més de la neteja.

    És necessari educar i conscienciar. Les campanyes en xarxes socials poden ser útils, però creiem que no servixen exclusivament
    per a combatre l''incivisme que patim a Orriols. Mentre persones problemàtiques continuen ocupant habitatges, a algunes
    de les nostres bones famílies se les continua expulsant dels seus pisos pel preu abusiu dels lloguers. Això, senyora alcaldessa,
    és classe mitjana i economia familiar. I en efecte, sense classe mitjana i economia no hi ha cohesió ni democràcia.

    Com portem repetint des de fa anys, el nostre barri necessita intervencions integrals: urbanístiques, socials, culturals.
    Si de veritat volem que Orriols siga un barri habitable a l''altura de la nostra ciutat i de les persones que l''habitem,
    tenen que prendre-s''ho seriosament. No es poden posar tirites on fa falta quiròfan. És per tot això que continuem reivindicant
    les taules interconcejalia com a element necessari. Els regidors i regidores estan al servici de la ciutadania i no al
    revés. Necessitem que esta ferramenta siga útil per a avançar en la resolució dels problemes d''Orriols. Des d''Orriols
    en Lluita aportem la col·laboració per a poder treballar conjuntament, però també exigim serietat i màxima contundència
    en les accions per a la millora del nostre barri. Com tots i totes sabem, els entorns poden modificar els comportaments
    i la vida de les persones.

    Moltes gràcies.'
  resum_cas: Orriols en Lucha denuncia la ocupación masiva del espacio público, el consumo de alcohol y drogas, y la falta
