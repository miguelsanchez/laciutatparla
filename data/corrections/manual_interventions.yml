    ens hem pres la llicència de pensar en exigir el mateix als nostres representants polítics.


    Todavia **4 dels 8 col·legis d''infantil i primària del nostre districte compten amb el primer cicle
    de l''ensenyança secundària** en els centres, el que suposa **700 nens i nenes que realitzen els seus
    estudis d''ESO fora d''un institut** (els del CEIP Jesús, el CEIP Sant Àngel de la Guarda, el CEIP
    Soto Micó i el CEIP Tomás de Villarroya), i que passen a partir de 3r de l''ESO a l''IES Juan de Garay
