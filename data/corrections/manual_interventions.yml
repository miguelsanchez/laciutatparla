  finding: E1b-b0bed1909b
  text_val: 'Moltes gràcies. Sra. Alcaldesa, per autoritzar-nos a poder manifestar el que al nostre entendre
    podria ser un **contrapunt a la intervenció** que ha fet el representant de CC.OO. en un altre àmbit.
    Nosaltres ens referim a l''àmbit d''aquesta casa. Tan lluny com ahir vam celebrar les eleccions i
    els funcionaris van triar els seus representants, i en l''exercici d''aquesta funció som hui ací.


    Creiem que **aquesta moció, al nostre parer, no és el millor moment** de presentar-la, en el marc
    d''unes eleccions. Creiem que tal com CC.OO. l''ha presentada en aquest Ajuntament i en campanya almenys
    **genera cert alarmisme** i volem **reivindicar als funcionaris**. Als funcionaris en el seu paper,
    en el seu exercici, en l''acte professional, des de la seua responsabilitat, des de la capacitat,
    des de la seua independència -no la posarem mai en qüestió-.


    El company de CC.OO. em dóna la impressió que **està en una altra galàxia**. És a dir, ja l''**EBEP
    en 2007 va eliminar** dels tribunals de selecció als polítics i als sindicats, concentrant-ho exclusivament
    en els funcionaris, en les persones capaces, en les persones responsables, que d''ells depén el futur
    treball o accés a la funció pública.


    Per això, creiem que aquest debat manifestat en termes de moció que impulsa CC.OO. per **acabar amb
    l''enchufisme** ens pareix alarmista. Com a mínim no real, no ajustada a la situació d''aquesta casa.
    Jo, si té coneixements d''altres administracions, no ho vull discutir, però si es defensa això és
    perquè es té causa i si es té causa no es té que venir al Ple, es té que anar a un altre lloc.


    Per tant, des del respecte a que és una **matèria legislativa** que regula la competència en el marc
    de la **Mesa General de Negociació**, que en aquest Ajuntament va ser negociada, recolzada per CC.OO.
    i vull reiterar, pel conjunt dels grups polítics pertanyents a aquest Ple, del qual m''alegre enormement,
    a un any de finalització del mandat, em pareix **totalment extemporani, fora de lloc** intentar que
    el que en la Mesa de Negociació no puc aconseguir ho traslade i utilitze als partits polítics com
    a teló per a defensar aquest plantejament.


    Sres. Regidors, els pediria, si us plau, **respecte a la negociació col·lectiva**. Aquest sindicat
    ha tingut que anar a Madrid, al TSJ, al Tribunal Suprem, perquè ens reconegueren en aquesta casa el
    dret a la negociació, el qual per a mi és un honor. I per això em vull en la legitimitat d''exigir
    a aquest Ple aquest respecte a la competència i a la capacitat de la Mesa General de Negociació.


    Si han entès el nostre posicionament i tenen a bé no debatir-ho, perquè la nostra voluntat seria no
    debatir-ho, si això es retirara, nosaltres entendriem que faríem un bon favor als funcionaris de la
    casa i a la Mesa General de Negociació.


    Moltes gràcies.'
