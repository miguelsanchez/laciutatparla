    ¿No ha habut prou **sofriment, ni reivindicació, ni sentències del TSJCV**, ni **principi de precaució,
    ni protecció de la salut** per a tancar esta activitat i trasllada-la segons l''acord de tots els
    Grups, per damunt de Iberdrola, Generalitat i govern central? ¿Què els passa ara, Sra. Alcaldesa,
