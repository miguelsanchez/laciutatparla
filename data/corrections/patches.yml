- iv_id: 2020-10-29-001
  fields:
    idioma_original: castellano
    text_val: 'Bon dia, alcalde. Bon dia a la resta del Ple.


      Soc **Fermín Turia**, representant del **Frente Obrero España**. Si em permet, crec que és **bastant
      vergonyós** que per a interactuar amb el Ple i interactuar amb la corporació local haja de **pujar-me
      a un palco**. I res, remarcar això, que **molt atrezzo però poc contingut**. Per molt que canvien
      el nom de les coses, **les coses continuen sent igual** i **la distància entre els treballadors
      i les institucions** continua sent la mateixa.


      La meua pregunta és en relació a **la seguretat**. La seguretat és molt important. En el **CMSS
      de Patraix**, Joan, del que som veïns és realment on es paga el resultat de les seues polítiques.


      El **27 de juliol d''este any** el meu company, treballador de **REDSA**, va promoure una **elecció
      a representant sindical** en el seu centre de treball, va constituir-hi una **secció sindical**
      i el company, en ser un treballador amb un contracte fix, va ser **despedit de manera improcedent**,
      atacant així la seua **llibertat sindical**. Esta empresa es deia abans **SECOPSA**, era una d''aquestes
      empreses relacionades amb les **trames de la Sra. Gürtel**, ara mateix es diu **FOVASA**.


      Li volia preguntar si vosté es posicionaria **públicament a favor del treballador** i a favor de
      les **llibertats sindicals**. Podrà ser valent en lloc de contra **enemics culturals**, contra la
      **patronal**, contra **empresaris concrets** que atempten contra els drets dels treballadors?


      Moltes gràcies.'
  reason: 'Language rule (C4): idioma_original mixt → castellano; text_val retranslated from text_original
    (claude-haiku-5-5).'
  date: '2026-10-18'
  finding: C4-b4fb1a0b86
