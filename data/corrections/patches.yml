    text_original: 'Muy buenos días, señora alcaldesa, miembros de la corporación y público asistente.


      La cuestión por la que comparezco hoy aquí como representante de las **Comisiones Obreras del Ayuntamiento
      de València**, aunque obviamente venimos con miembros de la Confederación, tiene que ver con la
      **moción presentada por el Grupo Socialista** sobre los **centros educativos públicos**, pero también
      con las **movilizaciones** que a día de hoy se están llevando a cabo, y secundadas masivamente entre
      el personal de los centros públicos de la Conselleria.


      Pero antes de exponer la relación que este asunto tiene con los colegios municipales y aprovechando
      que es un tema educativo municipal y tengo aquí en presencia de las concejalías competentes, quiero
      anunciarles o recordarles que Comisiones Obreras volverá a plantear mañana en la **Mesa General
      de Negociación** el conflicto, situación o como lo queramos llamar, del **Colegio Municipal Fernando
      de los Ríos**. Porque el personal no solamente de este colegio sino del conjunto del Servicio de
      Educación meses, después desde la última reunión que tuvimos sobre el asunto, todavía están en la
      **incertidumbre** de saber realmente cómo se va a llevar todo este asunto y qué efectos van a tener
      sobre su situación.


      Y aparte de ello, la otra concejalía competente como es la de Educación pues ni siquiera se ha reunido
      con los sindicatos, que se lo hemos pedido varias veces por nota interior. Entonces, en fin, esperemos
      que mañana abordando este tema de nuevo podamos por fin darle ciertas certezas al personal afectado
      por este asunto.


      Pero bueno, volviendo al tema que nos ocupa hoy. Es cierto que los **colegios municipales** no están
      incluidos en la **convocatoria de huelga** y la razón principal es porque las **condiciones laborales**
      de nuestras compañeras y compañeros son bastante mejores que las del personal de Conselleria, algo
      que obviamente no ha caído del cielo. Algo que es el fruto de **muchos años de acción sindical**,
      negociación colectiva y trabajo de anteriores compañeras y compañeros. Pero por eso mismo, y como
      representantes del profesorado municipal, queremos mostrar nuestra **solidaridad** con estas personas
      que realizando las mismas funciones en otro ámbito administrativo, padecen unas condiciones bastante
      peores. Y por ello apoyamos también las movilizaciones que han convocado ante el bloqueo de la negociación
      con sus interlocutores. Y todo ello porque, además, las **reivindicaciones** que se hacen en esta
      movilización no se limitan a cuestiones meramente internas o de condiciones laborales que no excedan
      de su ámbito, sino que tienen que ver con la **defensa de un sistema educativo público y de calidad**.
      Y ahí Comisiones Obreras considera necesario defenderlas y apoyarlas en todos los ámbitos, y por
      supuesto en este foro como principal de esta nuestra ciudad.


      Perquè l''**educació és un pilar essencial** de la nostra societat i del nostre estat social i democràtic.
      I el **professorat** és el principal garant del dret fonamental a l''educació i, per tant, té una
      funció clau en la cohesió social, la igualtat d''oportunitats i el futur econòmic i cultural de
      la nostra comunitat. Per esta raó, la professió docent és una de les més valorades per la ciutadania
      i per això mateix hauria de ser objecte d''un especial respecte i consideració per part de qualsevol
      administració pública.


      Doncs bé, en els **darrers anys** el professorat valencià, a banda de la justa millora de les seues
      condicions laborals i retributives, ha manifestat en diverses **reivindicacions** orientades a millorar
      la **qualitat educativa** i l''estabilitat del sistema. Com per exemple la **reducció de les ràtios**
      a les aules, el reforç de recursos humans i materials, la millora de l''atenció a la diversitat,
      la **defensa i millora de l''ensenyament en valencià** o el manteniment del programa **''Auxiliars
      de conversa en llengua estrangera''**. Tot qüestions de molta importància en el futur de l''educació.
      I com poden vostés comprovar aquestes reivindicacions no responen únicament a interessos corporatius
      o d''un col·lectiu concret, com ho és el que es manifesta, sinó que afecten directament a la qualitat
      del servei públic, al benestar de les famílies, al progrés de l''educació i, per tant, al futur
      de la nostra societat. Sincerament, pense que cap partit polític pot estar en desacord amb estes
      qüestions.


      Y por todo ello conviene recordar que como miembros de esta corporación y más allá de sus diferencias,
      de sus lógicas diferencias políticas, representan ustedes no solo a sus a sus votantes sino a **todo
      el pueblo valenciano**. Y puesto que hablamos de **cuestiones que afectan al interés general** de
      la sociedad y a nuestro futuro como pueblo, es por ello que desde las Comisiones Obreras les instamos
      a que se unan a nuestra **defensa de la educación pública** apoyando unánimemente la **moción presentada**
      en este sentido por el Grupo Socialista.


      Muchas gracias.'
    text_val: 'Molt bon dia, senyora alcaldessa, membres de la corporació i públic assistent.


      La qüestió per la qual compareixc hui ací com a representant de les **Comisiones Obreras del Ayuntamiento
      de València**, encara que òbviament venim amb membres de la Confederació, té a veure amb la **moció
      presentada pel Grup Socialista** sobre els **centres educatius públics**, però també amb les **mobilitzacions**
      que a dia d''hui s''estan duent a terme, i secundades massivament entre el personal dels centres
      públics de la Conselleria.


      Però abans d''exposar la relació que este assumpte té amb els col·legis municipals i aprofitant
      que és un tema educatiu municipal i tinc ací presents les regidories competents, vull anunciar-los
      o recordar-los que Comisiones Obreras tornarà a plantejar demà a la **Mesa General de Negociació**
      el conflicte, situació o com ho vulguen anomenar, del **Col·legi Municipal Fernando de los Ríos**.
      Perquè el personal no solament d''este col·legi sinó del conjunt del Servei d''Educació, mesos després
      de l''última reunió que tinguérem sobre l''assumpte, encara estan en la **incertesa** de saber realment
      com es va a dur tot este assumpte i quins efectes tindrà sobre la seua situació.


      I a banda d''això, l''altra regidoria competent com és la d''Educació ni tan sols s''ha reunit amb
      els sindicats, que els ho hem demanat diverses vegades per nota interior. Doncs bé, en fi, esperem
      que demà, abordant este tema de nou, puguem per fi donar-li certes certeses al personal afectat
      per este assumpte.


      Però bé, tornant al tema que ens ocupa hui. És cert que els **col·legis municipals** no estan inclosos
      en la **convocatòria de vaga** i la raó principal és perquè les **condicions laborals** de les nostres
      companyes i companys són bastant millors que les del personal de la Conselleria, cosa que òbviament
      no ha caigut del cel. Això és el fruit de **molts anys d''acció sindical**, negociació col·lectiva
      i treball de les anteriors companyes i companys. Però per això mateix, i com a representants del
      professorat municipal, volem mostrar la nostra **solidaritat** amb estes persones que, realitzant
      les mateixes funcions en un altre àmbit administratiu, patixen unes condicions bastant pitjors.
      I per això donem suport també a les mobilitzacions que han convocat davant del bloqueig de la negociació
      amb els seus interlocutors. I tot això perquè, a més, les **reivindicacions** que es fan en esta
      mobilització no es limiten a qüestions merament internes o de condicions laborals que no excedisquen
      del seu àmbit, sinó que tenen a veure amb la **defensa d''un sistema educatiu públic i de qualitat**.
      I ahí Comisiones Obreras considera necessari defendre-les i donar-les suport en tots els àmbits,
      i per descomptat en este fòrum com a principal de la nostra ciutat.


      Perquè l''**educació és un pilar essencial** de la nostra societat i del nostre estat social i democràtic.
      I el **professorat** és el principal garant del dret fonamental a l''educació i, per tant, té una
      funció clau en la cohesió social, la igualtat d''oportunitats i el futur econòmic i cultural de
      la nostra comunitat. Per esta raó, la professió docent és una de les més valorades per la ciutadania
      i per això mateix hauria de ser objecte d''un especial respecte i consideració per part de qualsevol
      administració pública.


      Doncs bé, en els **darrers anys** el professorat valencià, a banda de la justa millora de les seues
      condicions laborals i retributives, ha manifestat en diverses **reivindicacions** orientades a millorar
      la **qualitat educativa** i l''estabilitat del sistema. Com per exemple la **reducció de les ràtios**
      a les aules, el reforç de recursos humans i materials, la millora de l''atenció a la diversitat,
      la **defensa i millora de l''ensenyament en valencià** o el manteniment del programa **''Auxiliars
      de conversa en llengua estrangera''**. Tot qüestions de molta importància en el futur de l''educació.
      I com poden vostés comprovar aquestes reivindicacions no responen únicament a interessos corporatius
      o d''un col·lectiu concret, com ho és el que es manifesta, sinó que afecten directament a la qualitat
      del servei públic, al benestar de les famílies, al progrés de l''educació i, per tant, al futur
      de la nostra societat. Sincerament, pense que cap partit polític pot estar en desacord amb estes
      qüestions.


      I per tot això convé recordar que com a membres d''esta corporació i més enllà de les seues diferències,
      de les seues lògiques diferències polítiques, representen vostés no sols als seus votants sinó a
      **tot el poble valencià**. I com que parlem de **qüestions que afecten l''interés general** de la
