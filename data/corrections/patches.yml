- iv_id: 2023-11-14-001
  fields:
    text_val: 'Bon dia, alcaldessa. Bon dia, senyories.

      Sóc Diana Jimena Tutistar, vinc en representació de l''**Associació Per Tu, Dona**. Una **associació
      de dones migrants** que naix fa **15 anys a València** amb l''objectiu de donar suport i ajuda a
      **dones migrants, a dones víctimes de violència de gènere** i a totes les dones que es troben en
      **risc d''exclusió social**. Hui ens sumem a **una moció, a un clam social** en favor de la **defensa
      d''una vida lliure de violències** per a totes les dones i totes les xiquetes, independentment de
      la condició social, econòmica, ètnica, religiosa. Volem una **societat més justa i inclusiva**.

      Segons les dades de la Delegació del Govern contra la Violència de Gènere, l''última víctima ha
      sigut una dona colombiana de 39 anys assassinada presumptament pel seu cònjuge a Madrid el passat
      4 de novembre. Amb la confirmació d''este cas, el nombre de **dones assassinades per violència de
      gènere ascendeix a 52 l''any 2023** i **1.237 des de l''any 2003**. D''estes 52 dones, **22 dones
      eren estrangeres, prop del 43 %**. Una xifra que evidencia una **sobrerepresentació de les dones
      estrangeres**, ja que només el 14 % de la població total a Espanya som migrants. Si bé és cert que
      en les estadístiques observem un **major risc de patir violència de gènere** les dones que presenten
      un major grau de vulneració social, el cert és que **la violència cap a les dones afecta a totes
      les dones** només pel fet de ser-ho, independentment del seu estatus social, econòmic o laboral.

      Hui som **estes veus d''estes dones** que estan patint el **maltractament en silenci** mentre les
      seues parelles o exparelles les anul·len emocionalment per a prendre un ple control de les seues
      vides a través de moltes formes que a vegades lamentablement és invisible cara a la societat i a
      les institucions, humiliant-les, fent-les perdre tota la seguretat i confiança en si mateixes, controlant
      els seus propis ingressos, restringint el dret a treballar, restringint el dret a formar-se, tallant-les
      les ales, allunyant-les dels seus suports, de les seues amistats, dels seus familiars, i fins i
      tot, i moltes vegades, causant un **maltractament continuat també en els seus fills i filles**.
      Hui també som les veus de **estes dones que ja no estan**, de totes aquelles a les quals **la violència
      de gènere els ha arrabassat el seu dret a viure**. Hui prenem la veu per a fer eco d''esta **pandèmia
      silenciosa** que s''ha endut per davant la vida de moltíssimes dones. Algunes d''elles ni tan sols
      han tingut l''oportunitat o prou informació o confiança institucional per a denunciar i sol·licitar
      protecció. Altres ni tan sols apareixen en les estadístiques amb les quals comptem. Recordem que
      **prop del 70 % de les dones assassinades enguany no havien interposat una denúncia**.

      La violència contra les dones és una **qüestió d''Estat** i una **prioritat en l''agenda política
      internacional** per a complir els tractats i mesures en matèria d''igualtat, protecció i prevenció
      de violències. Per això, hui demanem a les i als representants polítics d''este Ple el seu **compromís
      institucional** perquè mentre es mantinguen i augmenten estes xifres alarmants, es continue donant
      i es milloren les **accions integrals per a atendre, prevenir i denunciar la violència**, per a
      vetlar per la **protecció i la recuperació integral de les dones supervivents**. És necessari tindre
      una **estratègia continuada, una veritable política vinculant i transversal** que vaja més enllà
      de les voluntats polítiques i que, per descomptat, siga a **llarg termini**.

      Quan estem parlant d''una **problemàtica estructural** no hi ha pegats que ajuden. No oblidem que
      millorar els **mecanismes de prevenció** són salvavides. És l''única manera de **detindre la violència**.
      Actuem abans que això ocorregué. Això requereix un **compromís polític**, aplicar **lleis que fomenten
      la igualtat**, invertir en **associacions que acompanyen les dones**, i abordar les **múltiples
      formes de discriminació** a les quals s''enfronten les dones cada dia. És necessària una **implicació
      ciutadana** i ahí estarem. Vostés, com els nostres representants i representants polítiques, seran
      les encarregades i encarregats de vetllar pel compliment de les mesures de protecció i prevenció.
      Ací estem i ací continuarem.

      Mentre estes crues realitats existisquen, cadascuna de nosaltres alçarem la veu. Caminem juntes
      per una **vida lliure de violència** i el reconeixement i la garantia de tots els nostres drets.

      Moltes gràcies.'
