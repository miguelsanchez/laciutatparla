- iv_id: 2025-11-18-004
  fields:
    text_val: 'Bon dia, alcaldessa. Bon dia, regidores i regidores.

      En relació amb la moció presentada per Compromís, l''Associació de Veïns de la Malva-rosa volem
      manifestar que estem d''acord en esta moció. Respecte al projecte de **baixes emissions** de l''actual
      govern municipal volem manifestar el nostre desacord en com s''estan tractant, pues lamentem que
      totes les al·legacions que en its dia va realitzar l''Associació de Veïns de la Malva-rosa i altres
      associacions no es van tindre en compte i van ser rebutjades. La proposta d''**exclusió en la delimitació**
      de les zones de baixes emissions suposa que **el nostre barri es convertisca en un aparcament**
      de tots els vehicles. Fora del centre de la ciutat, es veuran obligats a buscar aparcaments en totes
      les zones excloses en detriment de la gent que vivim en estos barris. A més, suposa una **discriminació
      el deixar-nos fora**, com si la qualitat de l''aire d''estos barris no importara. **Augmentarà el
      trànsit, la contaminació s''incrementarà** i empitjorarà la seguretat vial.

      Per tant, li demanem al govern municipal que **siga valent** i que tinga en compte a tots els barris
      de la ciutat sense exclusions i buscant el consens. La Malva-rosa actualment ja està **saturada
      de trànsit**. Tenim les cotxeres de l''EMT, les cotxeres del tramvia, el Politècnic, el carrer Enginyer
      Fausto Elio és la eixida d''una part de València cap a la V-21. Tot el trànsit que ve de Serrería,
      avinguda dels Tarongers, de la zona del port, etcètera, l''única eixida és per la Malva-rosa. També
      estem patint el **soroll del trànsit** de vehicles, autobusos i tramvies a primeres hores de la
      matinada, sense comptar amb l''**excés de velocitat** de motos i cotxes en Enginyer Fausto Elio,
      on ja s''han produït **greus accidents**.

      És **necessari i urgent millorar el transport públic** si volem reduir el trànsit de vehicles. Actualment
      estem reivindicant que **es millore la línia 31**. És necessari **incrementar els autobusos** per
      a reduir la freqüència de pas, pues hi ha vegades que se supera els 30 minuts en el cas de la línia
      31. La reivindicació de la línia d''autobusos número 31 és de fa molts anys i ha anat empitjorant
      des que es va acordar per part de l''actual govern municipal ampliar el recorregut fins a l''estació
      de l''AVE Joaquín Sorolla, ja que esta mesura no va suposar al seu torn, que era l''important, ampliar
      de manera significativa el nombre d''autobusos. El resultat actual és que quan eixen de la Patacona
      i arriben a principis de Blasco Ibáñez, i altres vegades abans, ja estan els autobusos plens. És
      una línia que és molt utilitzada pels turistes que agafen l''AVE, en detriment dels veïns que acudeixen
      a l''hospital, a universitats i al centre de València. També és necessari per a millorar l''execució
      -que estem esperant- del **carril bici**, el projecte del qual va ser aprovat en els pressupostos
      participatius del 2023.

      Finalment, ens adherim al comunicat del 13 de novembre de 2025 que va fer la Federació Veïnal fent
      un crida als grups municipals perquè arriben a un acord per a aplicar la zona de baixes emissions.
      Pensen, senyors regidors i regidores, què seria de València si no tingueren el **jardí del Túria,
      pulmó verd** de la ciutat. És el moment de **prendre grans decisions consensuades** de cara al futur.
      I més quan es tracta de millorar el medi ambient en la nostra ciutat.

      Moltes gràcies.'
