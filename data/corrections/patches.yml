      major contingut que el turisme està interessat a visitar per la seua singularitat. Baixe a la plaça
      i pregunte quanta gent ha vingut per el Starbucks i quanta per les barraques. I això genera ingressos,
      que tant els agraden. Encara que de l''impost turístic amb tot este tipus de coses, ara no recaptem
      res. També ens surten pèrdues dels festivals i macroesdeveniments que hi ha en la ciutat. Paguem
      el transport públic, la neteja i la policia als seus interessos privats. Vostè sap quin és l''IAE
      dels botellons? I l''ICIO de les 9.000 vivendes turístiques? Perquè vostés sí que guanyen en termes
      monetaris i econòmics. S''estalvien un dineral de l''IBI, l''IAE i l''ICIO d''un munt de xiringuitos.
