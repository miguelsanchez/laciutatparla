- iv_id: 2021-07-29-1-001
  fields:
    text_val: 'Bon dia. Moltes gràcies.

      Lo primer, agrair a l''Ajuntament de València la possibilitat de poder parlar ací, **defendre i
      representar al sector del taxi**. Lo segon, agrair a l''Ajuntament de València i a l''alcalde Joan
      Ribó, i als grups polítics que donen suport a esta possibilitat de que el **servici públic del taxi
      puga subsistir** davant la difícil situació que tenim damunt, no sols per la pandèmia sinó per **esta
      competència deslleial que portem patint des de fa anys**. I crec que **esta regulació, esta modificació
      de l''ordenança**, doncs va a poder **tornar una mica la justícia de la situació**, que ja dic,
      de l''**intrusisme que du patint el sector**. Està passant en tot Espanya, però hi ha ajuntaments
      que són valents, que aposten per un servici públic en què **les famílies de milers d''autònoms puguen
      portar el sou a casa** i no permetre que **estes multinacionals que en el fons tributen fora d''Espanya**.
      Jo no vaig a entrar en quins partits defensen o qui no perquè crec que al final estem parlant de
      València. Parlem de **valencians i parlem de famílies**. Però el que tenim clar és que **cal defendre
      als autònoms i no a les multinacionals**, que al final se n''emporten els diners fora d''Espanya.
      I **esta modificació d''ordenança ja dic que torna eixe equilibri a la ciutat de València**. Les
      **VTC, les autoritzacions de vehicles de lloguer amb conductor** que és lo més correcte, estan creades
      per a fer servici interurbà i estan utilitzant eixes autoritzacions per a **omplir de vehicles negres
      la ciutat** fent un servici urbà per al qual està creat el taxi. Hi ha sentències del Suprem, sentències
      del Constitucional que ho diuen, però **estes empreses tenen molts diners i són capaços de jugar
      amb la línia de la legalitat i saltar-se la legalitat**. I bé, doncs jo crec que esta modificació
      d''ordenança va a possibilitar que es dediquen a fer per al que estan creades. Sabem que durant
      prou temps, pel dèficit de la inspecció i pel dèficit que tenim de dos persones formades per a anar,
      no poden anar darrere de cada vehicle per a controlar-los. Però ja dic, esta modificació va a permetre
      que siga més fàcil controlar-los i regular-los.

      El taxi ha d''afrontar segurament **modificacions i ha de modernitzar-se**, possiblement en l''aspecte
      de tarifes i en algunes altres coses. Estem lluitant per això. També ens agradaria que l''Ajuntament
      sempre ens done suport, ja dic, en esta millora del sector, la ciutat, el taxi, té esta vocació
      de **servici públic** i crec que les persones que estan ací, tots tenen esta mateixa vocació de
      **defendre i lluitar pels ciutadans de València**. I en el fons estem junts en això. Hem d''intentar
      donar-li el millor servici a la ciutat.

      I bé, doncs lo dit, els agraïsc molt esta modificació i el permetre al sector del taxi hui estar
      ací. Lluitarem i seguirem lluitant contra esta pandèmia que crec que ja està prop d''acabar. Agrair-los
      també **esta ajuda que ha rebut el sector del taxi de l''Ajuntament de València**. I doncs bé, gràcies
      i felicitar també a estes persones, a estos regidors que han sigut pares. I bé, doncs lo dit.'
    resum_cas: El representante de la Federación del Taxi agradece la modificación de la ordenanza municipal
      que regulará la competencia desleal de las VTC, defendiendo el servicio público del taxi como sector
      estratégico para los autónomos y el equilibrio de la ciudad.
