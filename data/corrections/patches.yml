- iv_id: 2022-02-24-002
  fields:
    text_original: 'Hola, **bon dia**.


      Moltes gràcies per haver-nos donat l''oportunitat de venir ací a expressar la nostra postura i escoltar-nos.
      Jo represente a **la societat civil**, en concret a **una associació ecologista**. El nostre posicionament
      respecte a este tema és conegut àmpliament, però sí que volíem aprofundir i aprofitar aquesta oportunitat
      per a traslladar-la en el si d''aquest ple municipal. Es tracta de valorar, entenc, la continuïtat
      o no d''una infraestructura com és **l''hotel Sidi Saler** que està ubicat en ple cor del **Parc
      Natural de l''Albufera**. Nosaltres des d''**Acció Ecologista-Agró** recolzem total i absolutament
      **la demolició**, la retirada d''aquesta infraestructura i **la recuperació ambiental** del sistema
      dunar sobre el qual està directament emplaçat aquest hotel. **El primer front dunar** de la platja
      de la Garrofera.


      Nosaltres ho tenim clar. Pensem que aquesta infraestructura sobra completament en el lloc on està.
      I a més a més, és una icona, una representació de tot el que era **el projecte d''urbanització**
      que va començar i es va desenvolupar **en els anys 60**, i que afortunadament la ciutadania de València
      va aconseguir aturar. Quan nosaltres pensem que abans s''estava parlant de **la Copa Amèrica**,
      este tipus d''esdeveniments que nosaltres no considerem que són el tipus de coses que col·loquen
      a la ciutat de València com a exemple a nivell internacional. Per a nosaltres el tipus d''exemples
      que col·loquen la ciutat de València com a exemple i referent internacional són actuacions com **la
      paralització de la urbanització del Saler** i **la progressiva recuperació** dels espais ambientals
      que s''han fet per part del municipi.


      Quan **en els anys 70** es va prendre **la decisió valenta** i completament encertada del municipi
      de paralitzar eixa urbanització que haguera acabat completament amb aquest enclau i aquest valor
      natural del qual estem gaudint totes les persones de València, i que és un dels majors valors i
      un dels majors atractius per a la ciutat. Quan es va prendre eixa decisió estic segura que moltes
      persones, moltes entitats valoraven que moltes de les infraestructures que hi havia no tenia sentit
      retirar-les perquè ja estaven allí i perquè ja s''estaven fent servir. Però es va prendre eixa decisió
      i va començar **un desmantellament** de totes aquestes infraestructures com ara **el passeig marítim**,
      com ara també **el poliesportiu**, com altres infraestructures, **es va retirar el càmping** i va
      començar **una de les majors restauracions ambientals** i paisatgístiques que s''han fet en tot
      el nostre territori.


      A dia d''avui jo crec que cap de les persones que estem ací pensem que eixa la decisió va ser una
      decisió errada. Estem gaudint de **este sistema litoral**, de totes les dunes, de totes les espècies
      que tenim ahí, eixe important actiu paisatgístic. I pensem que eixe camí que va començar **en els
      anys 70**,que va començar la ciutadania que va arreplegar la ciutat de València s''ha de continuar
      i s''ha de continuar retirant totes les infraestructures que a dia d''avui estan obsoletes i fora
      d''ús, com per exemple **el Sidi Saber**. També pensem que és a més s''han de cometre compatriotes
      actuacions com la recuperació de tota la zona on estava el poliesportiu municipal, que encara queda
      pendent de recuperació paisatgística, **la retirada de la venda de bous** del Saler, la recuperació
      ambiental de la zona on estava el càmping del Saler. Hi ha moltes coses per a fer en la Devesa,
      però hi ha moltes coses que ja s''han fet i que són un exemple a seguir.


      **La recuperació del sistema dunar** de la Garrofera per a nosaltres és essencial no sols per un
      perquè és un **ecosistema fonamental** i totes les espècies protegides que estan allí sinó també
      perquè el sistema dunar és un dels ecosistemes que ens protegixen front a la pèrdua per l''erosió
      generada per **l''ampliació nord del port** de les platges, per la regressió de les platges. Estes
      dunes serveixen d''emmagatzemament de sorra que després tornen a les platges després de les tempestes
      i són fonamentals per a mantenir eixe equilibri de sorra en les platges. El Sidi Saler està impedint
      que la platja de la Garrofera puga desenvolupar de manera apropiada aquesta funció, que va més enllà
      de d''estos valors ambientals que ja de per si són suficients per a considerar la seua recuperació
      ambiental, amb la qual cosa nosaltres crec que la història, la trajectòria d''este espai natural
      i sobretot el context en què estem d''**emergència climàtica**, de **crisi ecològica** i context
      internacional, context nacional en el qual afortunadament ja estem començant... molt bé, de conceptes
      com **renaturalització**, **infraestructura verda**, **serveis ambientals dels ecosistemes**. Tenim
      clar que **este és el camí** a seguir i que no n''hi ha cap altre. La recuperació d''aquest edifici
      per a qualsevol altre ús, encara que siga un ús que no siga hoteler, implicaria unes conseqüències
      també i uns impactes ambientals en tot l''entorn que entenem que l''Albufera no pot assumir.


      Moltes gràcies.'
    text_cas: 'Hola, **buenos días**.


      Muchas gracias por habernos dado la oportunidad de venir aquí a expresar nuestra postura y escucharnos.
      Yo represento a **la sociedad civil**, en concreto a **una asociación ecologista**. Nuestro posicionamiento
      respecto a este tema es conocido ampliamente, pero sí que queríamos profundizar y aprovechar esta
      oportunidad para trasladarla en el seno de este pleno municipal. Se trata de valorar, entiendo,
      la continuidad o no de una infraestructura como es **el hotel Sidi Saler** que está ubicado en pleno
      corazón del **Parque Natural de la Albufera**. Nosotros desde **Acció Ecologista-Agró** apoyamos
      total y absolutamente **la demolición**, la retirada de esta infraestructura y **la recuperación
      ambiental** del sistema dunar sobre el que está directamente emplazado este hotel. **El primer frente
      dunar** de la playa de la Garrofera.


      Nosotros lo tenemos claro. Pensamos que esta infraestructura sobra completamente en el lugar donde
      está. Y además, es un icono, una representación de todo lo que era **el proyecto de urbanización**
      que empezó y se desarrolló **en los años 60**, y que afortunadamente la ciudadanía de València logró
      detener. Cuando nosotros pensamos que antes se estaba hablando de **la Copa América**, este tipo
      de eventos que nosotros no consideramos que sean el tipo de cosas que colocan a la ciudad de València
      como ejemplo a nivel internacional. Para nosotros el tipo de ejemplos que colocan a la ciudad de
      València como ejemplo y referente internacional son actuaciones como **la paralización de la urbanización
      del Saler** y **la progresiva recuperación** de los espacios ambientales que se han hecho por parte
      del municipio.


      Cuando **en los años 70** se tomó **la decisión valiente** y completamente acertada del municipio
      de paralizar esa urbanización que habría acabado completamente con este enclave y este valor natural
      del que estamos disfrutando todas las personas de València, y que es uno de los mayores valores
      y uno de los mayores atractivos para la ciudad. Cuando se tomó esa decisión estoy segura de que
      muchas personas, muchas entidades valoraban que muchas de las infraestructuras que había no tenía
      sentido retirarlas porque ya estaban allí y porque ya se estaban usando. Pero se tomó esa decisión
      y empezó **un desmantelamiento** de todas estas infraestructuras como, por ejemplo, **el paseo marítimo**,
      como también **el polideportivo**, como otras infraestructuras, **se retiró el camping** y empezó
      **una de las mayores restauraciones ambientales** y paisajísticas que se han hecho en todo nuestro
      territorio.


      A día de hoy creo que ninguna de las personas que estamos aquí pensamos que esa decisión fue una
      decisión errada. Estamos disfrutando de **este sistema litoral**, de todas las dunas, de todas las
      especies que tenemos ahí, ese importante activo paisajístico. Y pensamos que ese camino que empezó
      **en los años 70**, que empezó la ciudadanía que recogió la ciudad de València, se debe continuar
      y se deben seguir retirando todas las infraestructuras que a día de hoy están obsoletas y fuera
      de uso, como por ejemplo **el Sidi Saber**. También pensamos que además se deben acometer compatriotas
      actuaciones como la recuperación de toda la zona donde estaba el polideportivo municipal, que aún
      queda pendiente de recuperación paisajística, **la retirada de la venta de toros** del Saler, la
      recuperación ambiental de la zona donde estaba el camping del Saler. Hay muchas cosas por hacer
      en la Devesa, pero hay muchas cosas que ya se han hecho y que son un ejemplo a seguir.


      **La recuperación del sistema dunar** de la Garrofera para nosotros es esencial no solo por un motivo,
      porque es **un ecosistema fundamental** y todas las especies protegidas que están allí, sino también
      porque el sistema dunar es uno de los ecosistemas que nos protegen frente a la pérdida por la erosión
      generada por **la ampliación norte del puerto** de las playas, por la regresión de las playas. Estas
      dunas sirven de almacenamiento de arena que después vuelve a las playas tras las tormentas y son
      fundamentales para mantener ese equilibrio de arena en las playas. El Sidi Saler está impidiendo
      que la playa de la Garrofera pueda desarrollar de manera apropiada esta función, que va más allá
      de estos valores ambientales que de por sí son suficientes para considerar su recuperación ambiental,
      por lo que nosotros creemos que la historia, la trayectoria de este espacio natural y sobre todo
      el contexto en el que estamos de **emergencia climática**, de **crisis ecológica** y contexto internacional,
      contexto nacional en el que afortunadamente ya estamos empezando... muy bien, de conceptos como
      **renaturalización**, **infraestructura verde**, **servicios ambientales de los ecosistemas**. Tenemos
      claro que **este es el camino** a seguir y que no hay ningún otro. La recuperación de este edificio
      para cualquier otro uso, aunque sea un uso que no sea hotelero, implicaría unas consecuencias también
      y unos impactos ambientales en todo el entorno que entendemos que la Albufera no puede asumir.


      Muchas gracias.'
