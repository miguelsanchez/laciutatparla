- iv_id: 2026-06-30-007
  fields:
    text_val: 'Bon dia, senyora alcaldessa. Senyores regidores i senyores regidors.

      Comparec hui en nom de l''Associació Veïnal Cuidem la Raïosa, barri que pertany al Districte Jesús
      i que juntament amb la resta de barris del sud de València sentim que una vegada més **s''està decidint
      sobre el nostre futur sense comptar amb nosaltres**. I això és precisament el que volem denunciar:
      **la falta d''una participació real de la ciutadania** en una decisió que marcarà València durant
      generacions.


      Fa més d''un any, i després de diverses reunions amb l''Ajuntament, se''ns va assegurar que podríem
      participar activament en la definició del model de plataforma viària després del soterrament de
      les vies. **Eixa participació mai no ha arribat**. **L''antic corredor ferroviari no és un espai
      qualsevol, és una oportunitat històrica**. I ho dic amb un coneixement real de la situació.


      Fa 60 anys que vaig vindre a viure a la Raïosa. Tenia llavors 6. I quan tenia 12, vaig veure com
      s''alçava un mur al final del meu carrer, Amparo Iturbi, i s''instal·lava una passarel·la per als
      vianants i es construïa el pont de Georgieta per als cotxes. Ens van separar del barri de Malilla,
      que en aquell moment començava a créixer. Durant dècades, els trens van dividir els nostres barris.
      Teníem més a prop els col·legis i els instituts a l''altra banda de les vies que al nostre costat,
      però anar fins allí era menys accessible, recordem que ni tan sols teníem rampa a la passarel·la.
      Algunes famílies van veure com els seus fills se n''anaven a Malilla, i malgrat estar a uns metres
      de distància, veure els seus néts era una odissea.


      Hui que les vies van a desaparéixer tenim la possibilitat d''**unir els barris, de crear espais
      per a les persones**. No obstant això, **la proposta municipal pretén substituir unes vies del tren
      per una nova barrera de trànsit** que, segons se''ns presenta, introdueix una calçada nova de trànsit
      amb **27.000 cotxes al dia** i crea microjardins separats per asfalt. Incomplint així els seus propis
      criteris d''actuació per al bulevard García Lorca. **Canviar trens per cotxes. Soroll ferroviari
      per soroll del trànsit. Contaminació per més contaminació**.


      I creiem sincerament que **eixe no és el model de ciutat que necessita València en el segle XXI**.
      Ens preguntem quin sentit té **seguir prioritzant el vehicle privat** quan totes les ciutats europees
      avancen justament en la direcció contrària, **avancen prioritzant l''ús del transport públic, de
      la bicicleta i de zones per als vianants sense trànsit**. Esta és la València que volem deixar a
      les nostres generacions futures? Sou vosaltres els que decidiu ací, però en el carrer hi ha una
      generació més jove que s''obri camí en bicicleta. I ho dic perquè veig la meua filla i els seus
      amics com usen la bici de manera habitual.


      No sols parlem d''una zona verda, **s''està decidint ací sobre emergència climàtica, salut pública,
      qualitat de l''aire, zona de baixes emissions**. No podem defendre unes polítiques de reducció del
      trànsit en uns barris mentre es projecta una nova infraestructura per a atraure més vehicles a altres.


      Perquè no sé si ho heu pensat, però quan parleu de donar eixida als cotxes dels habitatges nous
      que es van a construir, en realitat estos habitatges tindran la seua eixida natural pel carrer de
      Sant Vicent i per la carrera Malilla. No obstant això, anem a crear un flux de trànsit intens des
      de Pérez Galdós-Georgieta i des de Péris i Valero, que confluiran en el bulevard García Lorca amb
      eixida, per allà, des d''altres parts de la ciutat. I la manera de sortir de València, des d''ahí
      no és per on mai han circulat cotxes. O és que ens estem oblidant que existeix el carrer de Sant
      Vicent, Carters, Gaspar Aguilar i per l''altre costat Malilla, Joaquín Benlloch i Ausiàs March?
      Treballem eixes vies i decidim si han de tindre dues direccions o una o EMT. Però no traieu dels
      nostres carrers les línies d''autobús. Llegiu les observacions que us aportarem i doneu-li una pensadeta,
      per favor.


      Però a més, existeix una qüestió de **justícia territorial**. **La Raïosa és un dels barris amb
      menys superfície de zones verdes per habitant de tota València**. Mentre altres barris gaudeixen
      des de fa dècades de grans jardins, nosaltres seguim ací esperant. I precisament ara que podem corregir
      eixe desequilibri històric, se''ns proposa dedicar part de l''espai a més calçades per al trànsit.
      **Un gran corredor verd no és un luxe, és una inversió en salut, benestar, convivència i en qualitat
      de vida**. Els arbres reduïxen la temperatura, ja s''ha dit ací, milloren la qualitat de l''aire,
      disminuïxen el soroll i fan les nostres ciutats més habitables. València té la sort de comptar amb
      un dels millors exemples del món, el Jardí del Túria, el nostre orgull. D''ací a uns anys també
      podríem sentir-nos orgullosos d''este corredor verd o podríem lamentar haver perdut una oportunitat
      irrepetible. La decisió està en les seues mans.


      Per això hui no demanem privilegis, **demanem equilibri**. **Demanem que s''escolte a qui vivim
      allí**. **Demanem que abans d''adoptar una decisió definitiva s''obrisca un veritable procés de
      participació ciutadana** per a decidir junts el futur d''este espai. I **demanem que l''antic corredor
      ferroviari deixe definitivament de ser una frontera i es convertisca en un gran eix verd que connecte
      els barris del sud**. Perquè **les ciutats que posen les persones al centre són les ciutats que
      millor funcionen**. I se us recordarà pels jardins que feu, no per les carreteres.


      Moltes gràcies.'
