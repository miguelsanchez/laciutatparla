- iv_id: 2020-10-21-002
  fields:
    text_val: 'Bon dia, alcalde. Bon dia a tots i a totes.


      El **27 de febrer** d''este mateix any vam estar en este Ple demanant canvis, especialment en aquells
      aspectes referits a la **Mobilitat en el centre** de la ciutat, així com a la **transparència, participació
      real, eficiència**, etc. Eren altres temps, difícils, però un escenari molt diferent a l''actual.
      Hui, **21 d''octubre**, cap d''aquelles peticions ha sigut atesa i la situació s''ha tornat **dramàtica**.
      Dramàtica per a tots en termes sanitaris, però per a qui tenim negocis que sostindre i ocupació
      que protegir també ho és en termes econòmics i de manera molt especial i accentuada en el **centre
      de la ciutat**.


      No estem en una nova normalitat sinó en una **nova realitat**. Patim un **descens de les empreses
      autòctones** que són en la seua majoria familiars, tradicionals i singulars. Estes empreses ocupen
      molt per damunt de la mitjana a dones i menors de 35 anys, i proporcionen contractes indefinits
      i de qualitat a més d''un **80 % dels treballadors**.


      Hi ha una **preocupant centrifugació de la despesa** provocada pel **teletreball** que ve per a
      quedar-se en part i que provoca tremends canvis d''hàbit de compra i un **descens acusadíssim del
      consum** en el centre. Les compres en línia creixen, en alguns casos a **tres dígits**, i les persones
      decideixen comprar en les seues zones pròximes d''influència tant per voluntat pròpia com per les
      enormes dificultats d''accedir al centre de **València**. Això ens deixa sense una grandíssima part
      dels nostres clients: els locals no vénen al centre o no volen vindre, els turistes no hi són i
      tota l''àrea metropolitana, que és importantíssima per a nosaltres, es queda en el seu poble o ciutat
      o decideix anar-se''n a un centre comercial, meravellós.


      Alguns sectors, especialment aquells lligats al turisme, les festes, esdeveniments, etc., i que
      tenen un gran pes i alta dotació en el centre estan patint molt. El **60 % dels negocis** del centre
      històric travessen **dificilíssims moments**, sense múscul financer ja i corren un **gravíssim risc
      de tancar** en els pròxims mesos o de manera imminent molts d''ells. El centre es va a quedar en
      un espai anodí, amb activitat concentrada en pocs eixos i amb carrers desertitzats, amb tot el que
      això implica.


      Les **nou línies d''EMT** que van modificar el seu recorregut al seu pas pel centre suposen un **22
      % dels usuaris** i ara el centre històric està més lluny per a ells a causa dels desviaments per
      **Colón**, que van ser no consensuats sinó imposats, així com per l''dubtós èxit de la **nova línia
      C1** -més enllà de la pandèmia, evidentment- que va substituir línies que abans acostaven al centre
      unes **25.000 persones al dia** i que hui n''acosta poc més de **1.000**. Per a intentar pal·liar
      esta situació, almenys en part, els demanem que les línies **70, 71, 11 i 32** entren fins a **Poeta
      Querol**, ja que són les que acosten més públic al centre sense necessitat de transbordament. Necessitem
      clients virtuals, sí, però també els reals que són els que ens fan subsistir. Hem de canviar de
      immediat la sensació real, que per negar-la insistentment no deixa d''existir, que accedir al centre
      és hui molt més difícil que al febrer. Paral·lelament volem fer-los una segona petició i és que,
      per favor, **abaratisquen el cost dels aparcaments**, tant els públics que depenen de vostés com
      els privats mitjançant un conveni pel qual l''Ajuntament assumisca un cost que al final creiem que
      serà una inversió per a dinamitzar el centre.


      Arriba d''ací a poc la **Nadal** i amb això l''esperança a la qual molts de nosaltres ens agafem
      amb força per a veure si aconseguim **mantindre''s a flotació**. Eixe és el nostre objectiu, mantindre''s
      a flotació. Relaxen les seues estrictes imposicions sobre el trànsit en el centre, permeten -almenys
      mentre l''ús del transport públic siga complicat- que l''accessibilitat al mateix siga més fàcil
      i fluida. La compra en línia s''estima que creixerà un **30 % en eixe període**. No permeten que
      el Sr. Amazon se''ns ficara fins a la cuina però els nostres clients tinguen les dificultats que
      tenen per a arribar. Si de veres volem petit comerç necessitem clients que activen el consum i a
      eixos se''ls està posant tot en contra per a arribar.


      Els vaig a fer **tres peticions més**:


      Una es referix a la necessitat de comptar amb un **ampli estudi** que aporte una fotografia actual
      i real de l''**activitat econòmica i dotació comercial** del centre, així com dins de sis mesos,
      com a mínim. Necessitem conéixer els canvis d''hàbits, la distribució de la despesa, una avaluació
      per zones comercials, una valoració dels formats, etc., amb una **coparticipació real** entre vostés
      i nosaltres els comerciants per a arribar a una solució i definir una estratègia vàlida. Dir que
      vostés saben el que ens convé no és la manera, des de luego.


      L''altra petició és que tenim **signat un conveni** amb vostés des de fa anys, des de quan governava
      un altre partit, que s''ha traduït en res, seguix traduint-se en res. Vostés han d''utilitzar el
      nostre potencial per a ajudar-nos a desenvolupar un **ambiciós programa de reconducció**. Activen
      dit conveni, doteu-lo econòmicament o quedarà tot una vegada més en bones paraules.


      La tercera i última petició és que, una vegada aixecat el sostre de despesa i quan decidisquen,
      entenc jo que es van a endeutar, pensen que davant de lo difícil i farragós que resulta llançar
      més convocatòries d''ajudes directes al sector, els demanem que, com s''ha fet amb enorme èxit en
      moltes poblacions, llancen una **campanya seriosa i amb pressupost** -la pólvora mullada servix
      de poc- d''**incentivació al consum** en el petit comerç mitjançant **bons**. És una forma àgil
      i directa d''injectar sang en les nostres venes en forma de compres en els nostres establiments.
      Parlen amb nosaltres perquè els expliquem… Em queda mig minut.


      Per a acabar, els demanaré alguna cosa que sé que els costarà: no convertisquen estes intervencions
      dels diferents col·lectius en un **paripé** en el qual nosaltres parlem, proposem, exigim o protestem,
      i vostés es posen el paraigua i punt. Ens donen quatre palmadetes i endavant. Paguem els impostos
      que sostenen, entre altres coses, els seus sous. Així que, per favor, **canvien d''actitud**, oblidin
      allò de que és que tinc un mandat… i respecten les normes. Nosaltres sabem molt millor que vostés
      el que necessitem.'
    text_original: 'Buenos días, alcalde. Buenos días a todos y a todas.


      El **27 de febrero** de este mismo año estuvimos en este Pleno pidiendo cambios, especialmente en
      aquellos aspectos referidos a la **Movilidad en el centro** de la ciudad, así como a la **transparencia,
      participación real, eficiencia**, etc. Eran otros tiempos, difíciles, pero otro escenario muy distinto
      al actual. Hoy, **21 de octubre**, ninguna de aquellas peticiones ha sido atendida y la situación
      se ha tornado en **dramática**. Dramática para todos en términos sanitarios, pero para quienes tenemos
      negocios que sostener y empleo que proteger también lo es en términos económicos y de forma muy
      especial y acusada en el **centro de la ciudad**.


      No estamos en una nueva normalidad sino en una **nueva realidad**. Sufrimos un **descenso de las
      empresas autóctonas** que son en su mayoría familiares, tradicionales y singulares. Esas empresas
      emplean muy por encima de la media a mujeres y menores de 35 años, y proporcionan contratos indefinidos
      y de calidad a más de un **80 % de los trabajadores**.


      Hay una **preocupante centrifugación del gasto** provocada por el **teletrabajo** que viene para
      quedarse en parte y que provoca tremendos cambios de hábito de compra y un **descenso acusadísimo
      del consumo** en el centro. La compras online crecen, en algunos casos a **triple dígito**, y las
      personas deciden comprar en sus zonas próximas de influencia tanto por voluntad propia como por
      las enormes dificultades de acceder al centro de la ciudad de **València**. Esto nos deja sin una
      grandísima parte de nuestros clientes: los locales no vienen al centro o no quieren venir, los turistas
      no están y toda el área metropolitana, que es importantísima para nosotros, se queda en su pueblo
      o ciudad o decide irse a un centro comercial, maravilloso.


      Algunos sectores, en especial aquellos ligados al turismo, las fiestas, eventos, etc., y que tienen
      un gran peso y alta dotación en el centro están sufriendo mucho. El **60 % de los negocios** del
      centro histórico atraviesan por **dificilísimos momentos**, sin músculo financiero ya y corren un
      **gravísimo riesgo de cerrar** en los próximos meses o de forma inminente muchos de ellos. El centro
      se va a quedar en un espacio anodino, con actividad concentrada en escasos ejes y con calles desertizadas,
      con todo lo que ello implica.


      Las **nueve líneas de EMT** que modificaron su recorrido a su paso por el centro suponen un **22
      % de los usuarios** y ahora el centro histórico está más lejos para ellos debido a los desvíos por
      **Colón**, que fueron no consensuados sino impuestos, así como por el dudoso éxito de la **nueva
      línea C1** -más allá de la pandemia, evidentemente- que sustituyó a líneas que antes acercaban al
      centro unas **25.000 personas al día** y que hoy acerca a poco más de **1.000**. Para intentar paliar
      esta situación, al menos en parte, les pedimos que las líneas **70, 71, 11 y 32** entren hasta **Poeta
      Querol**, pues son las que acercan mayor público al centro sin necesidad de transbordo. Necesitamos
      clientes virtuales, sí, pero también los reales que son los que nos hacen subsistir. Debemos cambiar
      de inmediato la sensación real, que por negarla insistentemente no deja de existir, de que acceder
      al centro es hoy mucho más difícil que en febrero. En paralelo les queremos hacer una segunda petición
      y es que, por favor, **abaraten el coste de los aparcamientos**, tanto los públicos que dependen
      de ustedes como los privados mediante un convenio por el que el Ayuntamiento asuma un coste que
      al final creemos que será una inversión para dinamizar el centro.


      Llega dentro de poco la **Navidad** y con ello la esperanza a la que muchos de nosotros nos agarramos
      con fuerza para ver si logramos **mantenernos a flote**. Ese es nuestro objetivo, mantenernos a
      flote. Relajen sus estrictas imposiciones sobre el tráfico en el centro, permitan -al menos mientras
      el uso del transporte público sea complicado- que la accesibilidad al mismo sea más fácil y fluida.
      La compra online se estima que crecerá un **30 % en ese periodo**. No permitan que el Sr. Amazon
      se nos meta hasta la cocina pero nuestros clientes tengan las dificultades que tienen para llegar.
      Si de verdad queremos pequeño comercio necesitamos clientes que activen el consumo y a esos se les
      está poniendo todo en contra para llegar.


      Les voy a hacer **tres peticiones más**:


      Una se refiere a la necesidad de contar con un **amplio estudio** que aporte una foto actual y real
      de la **actividad económica y dotación comercial** del centro así como dentro de seis meses, como
      mínimo. Necesitamos conocer los cambios de hábitos, la distribución del gasto, una evaluación por
      zonas comerciales, una valoración de los formatos, etc., con una **coparticipación real** entre
      ustedes y nosotros los comerciantes para llegar a una solución y definir una estrategia válida.
      Decir que saben ustedes lo que nos conviene no es la manera, desde luego.


      La otra petición es que tenemos **firmado un convenio** con ustedes desde hace años, desde cuando
      gobernaba otro partido, que se ha traducido en la nada, sigue traduciéndose en la nada. Ustedes
      deben utilizar nuestro potencial para ayudarnos a desarrollar un **ambicioso programa de reconducción**.
      Activen dicho convenio, dótenlo económicamente o quedará todo una vez más en buenas palabras.


      La tercera y última petición es que, una vez levantado el techo de gasto y cuando decidan entiendo
      yo que se van a endeudar, piensen que ante lo difícil y farragoso que resulta lanzar más convocatorias
      de ayudas directas al sector, les pedimos que, como se ha hecho con enorme éxito en muchas poblaciones,
      lancen una **campaña seria y con presupuesto** -la pólvora mojada sirve de poco- de **incentivación
      al consumo** en el pequeño comercio mediante **bonos**. Es una forma ágil y directa de inyectar
      sangre en nuestras venas en forma de compras en nuestros establecimientos. Hablen con nosotros para
      que les expliquemos… Me queda medio minuto.


      Para terminar, les pediré algo que sé que les va a costar: no conviertan estas intervenciones de
      los diferentes colectivos en un **paripé** en el que nosotros hablamos, proponemos, exigimos o protestamos,
      ustedes se ponen el paraguas y punto. Nos dan cuatro palmaditas y para adelante. Pagamos los impuestos
      que sostienen, entre otras cosas, sus sueldos. Así que, por favor, **cambien de actitud**, olviden
      aquello de que es que tengo un mandato… y, respeten las normas. Nosotros sabemos mucho mejor que
      ustedes lo que necesitamos.'
