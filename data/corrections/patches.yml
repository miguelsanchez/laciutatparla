      Què fa el nostre Ajuntament de València davant esta situació? Es queda de braços creuats? L'Ajuntament
      de València no pot ser còmplice d'un genocidi i la **ciutadania valenciana** els demana hui de manera
      clara i contundent que **València s'afegisca** al reclam internacional per a aturar esta massacre.
      Els ministres d'Afers Exteriors de la Unió Europea han convocat un Consell d'Associació amb Israel,
      que debatrà el compliment de les seues obligacions en matèria de drets humans. La **Cort Internacional
      de Justícia** li ha ordenat aturar immediatament la seua ofensiva militar a Gaza. Als Estats Units
      alts funcionaris de l'Administració de Biden estan dimitint en protesta pel suport del seu país
      al genocidi. **Cent quaranta països** ja reconeixen l'Estat palestí, **vint-i-huit països europeus**,
      huit d'ells pertanyen a la Unió Europea. Les capitals del món s'estan omplint de persones que clamen
