- iv_id: 2019-09-26-002
  fields:
    text_val: 'Muchíssimes gràcies, Sr. Alcalde. Regidors.


      En primer lloc, jo crec que estem tots d''acord o almenys porte dos hores ací, des de les 10:15.
      Una altra vegada intervinc ací. En dos no he aconseguit res, a veure si a la tercera ho aconseguim.


      Estem **en contra de la pujada d''impostos** però entenem també que cal posar impostos, això està
      claríssim. El que passa és que nosaltres **des del 2008-2009 portem constantment pujant impostos**,
      portava ací un discurs escrit de les pujades que hem rebut. Fins i tot **en taules i terrasses,
      del 74 %**, l''IBI, el clavegueram, els lloguers que vam haver de suportar amb eixes **pujades tan
      bèsties** que es van fer quan va acabar la Llei d''Arrendaments Urbans, la LAU.


      Llavors, jo crec i entenem els autònoms o els empresaris petits que podríem començar a parlar de
      les **pujades un poc proporcionals**, a veure com les fem, de quina manera les anem a fer i a què
      les anem a dedicar.


      Nosaltres hui un establiment d''hostaleria, sobretot els impostos estan sent més agreujats en la
      zona centre. Un establiment d''hostaleria **de cada 100 euros que recapta, nets després d''impostos
      pot oscil·lar entre un 6 %**, és a dir, 6 euros. **Un establiment que factura 300.000 euros, el
      seu cap junt amb els seus empleats guanya 18.000 euros a l''any**.


      Nosaltres estem suportant un eixam de treballadors autònoms i companys com nosaltres, **treballant
      un eixam d''hores**. Estem intentant proporcionar als nostres treballadors **sous dignes**. Un treballador
      d''hostaleria que siga coherent i pague el que ha de pagar està per damunt dels 1.250 euros. Amb
      estes **pujades d''impostos** ara què li diem. Estem en ple moviment de treball per a veure si pugem.
      Un treballador amb 1.250 euros **no té ni per a respirar** perquè després paga el 21 %.


      Llavors, el que vull dir amb això és que comencem a **treballar amb coherència com es pugen els
      impostos**. Entre tots perquè hi ha uns a favor i altres en contra, però tots estaríem d''acord
      perquè **necessitem més Policia, evidentment**. Però potser haurien de pujar la jubilació, no com
      nosaltres els autònoms als 67 anys. Potser al policia que no passara a segona activitat als 55,
      podria passar a segona activitat als 58 o dedicar-los a altres tasques més raonables. Nosaltres
      necessitem Policia, necessitem escombrar o ajudar o fer campanyes com estem fent els hostelers en
      la zona centre perquè no es tiren papers al terra. Escombrar, posar cendrers o fer tots els treballs
      que ens demanen per a mantindre una ciutat digna i intentar que tinguem més turisme.


      Però el que no es pot consentir és **esta taxa d''increments des del 2014**. S''ha fet una **reducció
      important de taules i cadires** que això, cada taula és [ inaudible] que tenim menys. Per tant,
      és un treball dels treballadors, de la gent que estem aportant i aportant riquesa. A partir d''ara
      crec que el que demanem és que s''aproven els impostos, **totalment d''acord**. Hem de contribuir
      absolutament tots a la millora de la ciutat, a que hi haja **més Policia**, a que hi haja més neteja,
      a que puguem podar, a que hi haja **millors carrils bici**, a que hi haja menys contaminació. Però
      el que és important és **a què ho destinem** i com ho demanem a la gent, i com contribuïm tots,
      absolutament tots. I ahí ens van a tindre al sector de l''hostaleria.


      Per això el que demanem és que **ens asseguem a parlar i a tramitar**, perquè tenim període d''al·legacions,
      com ho podrem fer. Perquè si no seria injust i tots estaríem cometent errors de bulto. Perquè tots,
      absolutament tots els que estan ací, vostés, siguen del signe polític que siguen, estic convençut
      que volen **més policia**, que volen millors condicions per a la ciutat i que volen que vinga més
      turisme. Però el que necessitem és treballar-ho en conjunt i bé.


      Perquè molta gent que està en hostaleria, que està treballant en hostaleria, torne a insistir, **de
      cada 100 euros, 6 després d''impostos**. I són moltes hores, eh? **Moltíssimes hores de gent que
      està 12 i 14 hores**. Jo hui vaig de blanc i blau perquè d''ací me''n vaig a treballar, tan senzill
      com això. I m''he llevat a les 7 del matí i acabaré a les 12 de la nit. Eixa és l''autèntica qüestió.
      I **l''hostaleria hui és un dels principals motors d''esta ciutat**, gràcies a Déu, perquè tenim
      molts llocs de treball i molta gent. Però no sols viu el hostaler, viu el de l''aire condicionat,
      l''electricista, el que li comprem les cullerets, el que reparteix amb el camió la cervesa, el paleter,
      el de la llum, el de l''aigua, el del clavegueram.


      Per tant, cuidarem tot això i **treballarem en conjunt**. I en el període d''al·legacions que puguem
      entre tots veure com ho destinem. I si pot ser **paulatinament les pujades anuals** doncs millor.
      Gràcies, alcalde. **No podem agreujar l''hostaleria ja amb tant**. Un poquet, per favor. A veure
      si tenim sort i tenim un Robin Hood i no al xerife de Nottingham. Algun Robin Hood.


      Gràcies.'
