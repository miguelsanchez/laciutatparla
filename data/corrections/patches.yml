    text_original: Buenos días. Soy **Miguel Sánchez**, **presidente de la Asociación Vecinal La Roqueta**.
      Hoy debatimos sobre **infraestructuras**. Infraestructuras que dividen, que hieren, que separan
      barrios y a quienes los habitan. Infraestructuras y heridas de las que el cap i casal está lleno
      y ahora toca coser. En este caso hablamos del **soterramiento de las vías de Serrería**, en el que
      un nuevo túnel sustituirá un puente, conectará con un **nuevo PAI urbanístico** -que también está
      en cuestión-. Y es una historia que lleva formando parte de una promesa del **Ministerio de Transportes**
      y Movilidad Sostenible actual, que no el de **Rajoy en 2015**. Pero sí hoy estamos hablando de él
      no es porque haya habido avances técnicos ni novedades urbanísticas, sino por **un gesto político**.
      La alcaldesa no fue invitada por el **ministro Óscar Puente** a visitar las obras del canal de acceso,
      otra infraestructura, y respondió públicamente diciendo que quería hablar de este túnel, de Serrería.
      No ha habido otro gran proyecto de infraestructura urbana que haya merecido **un pleno monográfico**
      convocado por usted en este mandato. Y temas ha habido, una rareza. Y es que no deja de ser curioso
      porque cuando se trató de ampliar el puerto ustedes brindaban juntos y hoy con el proyecto que no
      beneficia directamente al puerto ya no hay brindis, solo reproches. Entonces, ¿qué puede haber pasado
      desde entonces? Le puedo dar unas ideas. Uno, una **ZBE de mínimos** que ya no va a ser herramienta
      eficaz para mejorar la salud pública y que a mitad de 2025 sigue siendo un borrador. Dos, un **corredor
      verde** que quiere acabar transformando en una avenida, para el que podríamos estar hoy debatiendo
      y aprobando cambios de planeamiento necesarios para hacer ese parque. Tres, **túneles en Pérez Galdós-Giorgeta**
      o en **Guillén de Castro-Ángel Guimerá** que iban a desaparecer y ahora permanecerán. No tienen
      ni un expediente de contratación abierto. Podríamos estar aprobando la licitación de su proyecto
      de demolición y asignándole presupuesto hoy. Así que motivos hay y todos son temas que dependen
      del mismo ministerio y que podrían ser parte de este pleno monográfico sobre infraestructuras si
      a usted de verdad le preocupase el soterramiento de Serrería. Lo preocupante es que **esta ruptura
      de sintonía institucional** pone en riesgo los proyectos estratégicos para la ciudad. Y si estos
      proyectos se convierten en moneda política quien pierde no es un partido, pierde **València**, pierde
      la ciudadanía. Porque el debate no es simbólico ni personal, el debate es **qué modelo de ciudad**
      estamos construyendo. El túnel que puede servir para coser barrios o para abrir paso a más coches,
      más ruido, más contaminación, más desigualdad. Y nos preocupa que estos soterramientos deriven en
      lo que ya ha presentado la señora alcaldesa, la **prolongación de la Alameda hasta el mar**. Bueno,
      hasta el puerto, que el mar está cada vez más lejos. Igual que pretende aplicar en el canal de acceso
      y el corredor verde, donde se recupera un urbanismo del pasado con el modelo de la **avenida de
      Francia**. **Gustafson**, la diseñadora del Parque Central, nos ha admitido en público, el mismo
      día que se reunió con usted, en dos ocasiones durante esa jornada que ese modelo original ya no
      tiene sentido. Y no fueron solo palabras, lo acaba de demostrar en París. Ha transformado un puente
      en un corredor verde. Allí crean nexos, aquí seguimos diseñando barreras. Así que por eso hablamos
      de **dos modelos de ciudad**. Uno más verde, que defendemos muchos barrios y colectivos aquí presentes.
      Y otro que avanza sin proclamarlo, pero que asfalta en silencio. Así que se lo decimos claro, no
      queremos más asfalto allá donde no lo hay. Queremos más verde. Queremos una ciudad que **resista
      al cambio climático** que deja ya una huella evidente, y se va a hablar de dana hoy también. Y esto
      es que va más allá de Serrería. En la Roqueta llevamos años reclamando la **eliminación del túnel**
      que nos separa del parque del Hospital. Esa barrera que impide pacificar Guillén de Castro y convierte
      Ángel Guimerá en una autopista urbana, impide respirar a Extramurs. Eso es una herida real y pedimos
      que se cierre con visión y con compromiso. Tenemos otro casi inmediato, el **túnel de Pérez Galdós-Giorgeta**.
      Un túnel que tenía un proyecto aprobado para su eliminación, **Arrels**, surgido del concurso de
      ideas de años de movilización vecinal. ¿Y qué ha hecho este gobierno? Desactivarlo. Encargar informes
      para justificar lo que ya habían decidido no hacer que era eliminar el túnel, retrasarlo. Y además,
      en el proceso, enfrentando a vecinos, a barrios, insinuando que mejorar uno era perjudicar al otro.
      Y la última jugada, reformar completamente media avenida y dejar la otra a medias con el túnel que
      inició esa batalla. Callar a unos y desgastar a los demás. Eso no es gobernar, eso es mezquino.
      Todas esas excusas, estos retrasos, estos cambios de versión, a nosotros nos suenan como **excusa
      de mal pagador**. ¿Le suena la frase? Porque se la dijo el señor Puente. El compromiso si fuera
      firme estaría por escrito. Le pedimos que **abra un expediente de contratación** para la eliminación
      de estos túneles. Que haga **acuerdos de pleno**, resoluciones de alcaldía, presupuestos. Un documento
      que tenga vinculación jurídica y nos dé garantías de cumplimiento. Una señal clara para los barrios.
      Porque predicar con el ejemplo es la mejor manera de liderar. Porque lo que está en juego no es
      solo un modelo de ciudad, es el **dinero de todos**. No queremos perder **fondos europeos**, no
      queremos pagar sanciones. Y el Ministerio ya le ha advertido sobre ese túnel. Le pedimos que reconsidere
      su postura, retome el diálogo institucional, vuelva a la sintonía con el Ministerio y con el ministro.
      También para el caso de Pérez Galdós y de otros grandes proyectos que hemos hablado. Y seguro que
      el túnel de Serrería le iría muchísimo mejor. Está en su mano. No acuse a nadie más. Así que muchas
      gracias. Buenos días.
    text_val: Bon dia. Sóc **Miguel Sánchez**, **president de l'Associació Veïnal La Roqueta**. Hui debatem
      sobre **infraestructures**. Infraestructures que dividixen, que ferixen, que separen barris i a
      qui els habita. Infraestructures i ferides de les quals el cap i casal està ple i ara toca cosir.
      En este cas parlem del **soterrament de les vies de Serreria**, en el qual un nou túnel substituirà
      un pont, connectarà amb un **nou PAI urbanístic** -que també està en qüestió-. I és una història
      que porta formant part d'una promesa del **Ministeri de Transports** i Mobilitat Sostenible actual,
      que no el de **Rajoy en 2015**. Però si hui estem parlant d'ell no és perquè haja hagut avanços
      tècnics ni novetats urbanístiques, sinó per **un gest polític**. L'alcaldessa no va ser convidada
      pel **ministre Óscar Puente** a visitar les obres del canal d'accés, una altra infraestructura,
      i va respondre públicament dient que volia parlar d'este túnel, de Serreria. No ha hagut cap altre
      gran projecte d'infraestructura urbana que haja merescut **un ple monogràfic** convocat per vosté
      en este mandat. I temes n'hi ha hagut, una raresa. I és que no deixa de ser curiós perquè quan es
      va tractar d'ampliar el port vostés brindaven junts i hui, amb el projecte que no beneficia directament
      al port, ja no hi ha brindis, només retrets. Llavors, què pot haver passat des d'aleshores? Li puc
      donar unes idees. U, una **ZBE de mínims** que ja no serà una eina eficaç per a millorar la salut
      pública i que a mitjan 2025 continua sent un esborrany. Dos, un **corredor verd** que volen acabar
      transformant en una avinguda, per al qual podríem estar hui debatent i aprovant canvis de planejament
      necessaris per a fer eixe parc. Tres, **túnels en Pérez Galdós-Giorgeta** o en **Guillén de Castro-Ángel
      Guimerà** que anaven a desaparéixer i ara romandran. No tenen ni un expedient de contractació obert.
      Podríem estar aprovant la licitació del seu projecte de demolició i assignant-li pressupost hui.
      Així que motius n'hi ha i tots són temes que depenen del mateix ministeri i que podrien ser part
      d'este ple monogràfic sobre infraestructures si a vosté de veritat li preocupara el soterrament
      de Serreria. El preocupant és que **esta ruptura de sintonia institucional** posa en risc els projectes
      estratègics per a la ciutat. I si estos projectes es converteixen en moneda política qui perd no
      és un partit, perd **València**, perd la ciutadania. Perquè el debat no és simbòlic ni personal,
      el debat és **quin model de ciutat** estem construint. El túnel que pot servir per a cosir barris
      o per a obrir pas a més cotxes, més soroll, més contaminació, més desigualtat. I ens preocupa que
      estos soterraments deriven en el que ja ha presentat la senyora alcaldessa, la **prolongació de
      l'Alameda fins al mar**. Bé, fins al port, que el mar està cada vegada més lluny. Igual que pretén
      aplicar en el canal d'accés i el corredor verd, on es recupera un urbanisme del passat amb el model
      de l'**avinguda de França**. **Gustafson**, la dissenyadora del Parc Central, ens ha admés en públic,
      el mateix dia que es va reunir amb vosté, en dues ocasions durant eixa jornada que eixe model original
      ja no té sentit. I no van ser només paraules, ho acaba de demostrar a París. Ha transformat un pont
      en un corredor verd. Allí creen nexes, ací seguim dissenyant barreres. Així que per això parlem
      de **dos models de ciutat**. Un més verd, que defenem molts barris i col·lectius aquí presents.
      I un altre que avança sense proclamar-ho, però que asfalta en silenci. Així que s'ho diem clar,
      no volem més asfalt allí on no n'hi ha. Volem més verd. Volem una ciutat que **resistisca el canvi
      climàtic** que ja deixa una empremta evident, i es va a parlar de la dana hui també. I això va més
      enllà de Serreria. A la Roqueta portem anys reclamant l'**eliminació del túnel** que ens separa
      del parc de l'Hospital. Eixa barrera que impedeix pacificar Guillén de Castro i convertix Ángel
      Guimerà en una autopista urbana, impedeix respirar a Extramurs. Això és una ferida real i demanem
      que es tanque amb visió i amb compromís. Tenim un altre gairebé immediat, el **túnel de Pérez Galdós-Giorgeta**.
      Un túnel que tenia un projecte aprovat per a la seua eliminació, **Arrels**, sorgit del concurs
      d'idees d'anys de mobilització veïnal. I què ha fet este govern? Desactivar-lo. Encarregar informes
      per a justificar el que ja havien decidit no fer que era eliminar el túnel, retardar-lo. I a més,
      en el procés, enfrontant veïns, barris, insinuant que millorar un era perjudicar l'altre. I l'última
      jugada, reformar completament mitja avinguda i deixar l'altra a mitges amb el túnel que va iniciar
      eixa batalla. Callar a uns i desgastar als altres. Això no és governar, això és mesquí. Totes eixes
      excuses, estos retards, estos canvis de versió, a nosaltres ens sonen a **excusa de mal pagador**.
      Li sona la frase? Perquè la va dir el senyor Puente. El compromís si fora ferm estaria per escrit.
      Li demanem que **obri un expedient de contractació** per a l'eliminació d'estos túnels. Que faça
      **acords de ple**, resolucions d'alcaldia, pressupostos. Un document que tinga vinculació jurídica
      i ens done garanties de compliment. Un senyal clar per als barris. Perquè predicar amb l'exemple
      és la millor manera de liderar. Perquè el que està en joc no és només un model de ciutat, són els
      **diners de tots**. No volem perdre **fons europeus**, no volem pagar sancions. I el Ministeri ja
      li ha advertit sobre eixe túnel. Li demanem que reconsidere la seua postura, reprenga el diàleg
      institucional, torne a la sintonia amb el Ministeri i amb el ministre. També per al cas de Pérez
      Galdós i d'altres grans projectes dels quals hem parlat. I segur que el túnel de Serreria li aniria
      moltíssim millor. Està en la seua mà. No acuse a ningú més. Així que moltes gràcies. Bon dia.
