- iv_id: 2011-07-29-003
  fields:
    text_val: 'Bon dia. Sra. Alcaldessa, Srs. Regidors,


      Voldria en esta primera intervenció d''esta legislatura **felicitar als representants elegits**
      pels ciutadans i ciutadanes en les passades eleccions i que conformen este Ple animant-los a seguir
      treballant per esta ciutat i per tots els seus ciutadans, vinguen d''on vinguen i pensen el que
      pensen, i **acceptar una societat diversa i plural**. Per a això, és necessari **abandonar crispacions
      anteriors** i acostar-se a la realitat ciutadana que algunes vegades alguns assoleixen en prendre
      possessió d''un escó. La via per a arribar a este enteniment i diàleg és **la participació**, que
      fa que a pesar de no estar d''acord amb algunes propostes mai s''arribe a la ruptura, al menysprear
      i al desprecio.


      Una vegada introduïda esta reflexió, desitjaríem veure''ls en esta nova legislatura i en este cas
      en concret amb la mateixa força que han tret i manifestat en múltiples ocasions al Govern Central
      plantejant tota mena de reclamacions; desitjaríem veure una actitud semblant al nou Govern de la
      Comunitat per a **reclamar els deutes amb la nostra ciutat**.


      Un d''estos grans deutes de la Generalitat és **tancar eixa gran ferida** que va provocar la incomprensió
      i el menysprear a les víctimes i familiars de l''**accident del metro del 3 de juliol**. Volem,
      com a associació del districte on es va produir dit accident, **donar suport públicament a cadascuna
      de les propostes** que esta associació de víctimes ha dut durant cinc anys exposant i exigint a
      la Generalitat que complisca els acords i promeses per a aconseguir que **mai més torne a ocórrer
      esta horrible tragèdia**.


      És necessari talent, talent inclús quan ja per fi sembla ser que van a ser rebuts pel Molt Honorable,
      pel nou president de tots els valencians; que escolte i atenga les seues peticions ja que l''anterior
      els veia com un grup de manifestants que calia ignorar, que eren ideològicament contraris, que potser
      era un contubernio ciutadà per a fer-lo dimitir, quan la realitat era que els que viatjaven en eixos
      vagons i les seues famílies segurament votaven qualsevol tendència política.


      Però no va acabar tot això amb la falta de diàleg, sinó que fa poc -i seguint en eixa miopia política-
      la Generalitat va donar una altra volta de rosca perquè **no sols el temps esborre tot indici, tot
      record, de l''major accident de metro d''Europa**; es van ajudar amb una decisió arbitrària esborrant
      el nom de l''estació on va ocórrer. Sense participació, sense sentit, va desaparéixer el nom d''una
      parada de metro molt especial i li van posar el mateix nom que l''estació de l''AVE, Joaquín Sorolla,
      per a confondre les dues parades d''un transport públic de ferrocarril, a més de carregar-se la
      denominació d''un barri històric -com és Jesús- dins del districte de Patraix.


      Este canvi de nom no ha obeït de igual manera als modificats en les mateixes dates. La justificació
      d''este canvi de nom, segons ens van transmetre, era per a adequar-les a la realitat on estaven
      ubicades, denominant-les de manera que es vinculen al lloc en què es troben o d''algun element rellevant.
      Per exemple, la parada de l''hospital va passar a dir-se Safranar, barri on està enclavada dita
      parada de metro, cosa lògica i normal. Este criteri es va aplicar al revés i es va llevar el de
      Jesús per Joaquín Sorolla, nom que es dona a una parada provisional de l''AVE que en un futur desaparéixer
      d''eixe enclavament.


      No sabem quina serà la pròxima idea que se''ls puga ocórrer. Potser desaparega el número 43, de
      43 morts, o 47, de 47 ferits. El que mai hem de consentir, ni vostés que ens representen ni els
      ciutadans, és que **oblidem**. No aconseguiran amb iniciatives il·lògiques com esta esborrar de
      la nostra memòria el que allí va ocórrer i com va ocórrer. Se''l devem a eixes persones que no van
      veure la llum en eixir d''un túnel d''un transport públic. A elles, a les seues famílies i als usuaris
      del metro.


      Per tot això, **instem este Ple que aprove** i es traslade a la Generalitat una declaració on es
      recullen les peticions de l''Associació 3 de Juliol: que **es revertisca l''actitud de rebuig**
      a les víctimes, ferits i a les seues famílies; que **l''estació Joaquín Sorolla del metro es diga
      com abans, Jesús**; i que s''aplique tot allò que la nova tecnologia aporte en matèria de seguretat.
      A nivell municipal, que es facilite la instal·lació d''un monòlit per part de l''Associació de Víctimes.
      Perquè mai més torne a ocórrer esta situació.'
    resum_val: L'Associació de Veïns de Patraix reclama que es reverta el canvi de nom de l'estació de
      metro Jesús per Joaquín Sorolla, sol·licitant a més una declaració de suport a les víctimes de l'accident
      del 3 de juliol i la instal·lació d'un monòlit commemoratiu.
  reason: resum_val has the Spanish word 'conmemorativo'; replaced with Valencian 'commemoratiu'.
  date: '2026-10-20'
  finding: C4-2b662d0d18
- iv_id: 2013-06-28-002
  fields:
    text_val: 'Bon dia. Gràcies.


      Soc [***], president de l''associació Valenciana de Crítics d''Art. Em acompanya [***], presidenta
      de l''Associació d''Artistes Visuals d''Alacant, Castelló i València.


      Intervinc en representació de les associacions de galeristes, artistes, crítics i comissaris d''art
      de la Comunitat Valenciana, amb seu a la ciutat de València i en nom també de la Plataforma Valenciana
      per la Cultura, que inclou a totes i cadascuna de les principals organitzacions professionals i
      empresarials dels distints sectors que integren la cultura valenciana.


      Abans que es produïra fa aproximadament un any **l''increment de l''IVA al 21%**, des del sector
      cultural espanyol i valencià es venia sol·licitant a les distintes composicions governamentals de
      l''Estat espanyol una **reducció de la taxa** llavors vigent amb el propòsit d''equiparar-la a l''establida
      en altres estats de la Unió Europea. Lluny d''atendre''s la demanda de les empreses i els professionals,
      el Govern d''Espanya va determinar elevar la pressió impositiva sobre uns béns que per les seues
      característiques mantenen un delicat equilibri que pot veure''s -i s''ha vist- greument alterat
      i perjudicat.


      Considerem que **aplicar a la cultura un increment de l''IVA al 21%** vulnera l''art. 44 de la Constitució
      Espanyola, ja que lluny de facilitar l''accés de tots a la cultura el que fan els poders públics
      és **elevar-lo a límits infranquejables** per a aquells que per la conjuntura actual veuen ja de
      per si minvada la seua capacitat econòmica. **Aplicar una taxa del 21% de l''IVA** als béns i serveis
      culturals significa fer que **la cultura siga inaccessible** per a una part creixent de la població
      valenciana i espanyola, alhora que es converteix en una mesura que **discrimina negativament l''accés**
      dels individus a la cultura fent que trenque un dels principis rectors de la política social i econòmica
      emparat per la Constitució Espanyola.


      Per una altra banda, **la cultura és al seu torn un motor econòmic** de la societat, a més del sentit
      simbòlic que representa i que ens distingeix com a poble amb l''atribució de signes que afegeixen
      un valor intangible. La nostra activitat cultural té una repercussió directa en el compte de resultats
      de sectors com el turístic, tan rellevant en l''economia valenciana.


      És per això que considerem i sol·licitem que este Ajuntament **es pronuncie de manera inequívoca**
      en el suport al sector de la cultura valenciana, **desenvolupant mesures correctores** que neutralitzen
      la repercussió de l''impost (com succeeix ja en els Ajuntaments de Vitòria i Granada) o establint
      una mediació amb el Govern d''Espanya a propòsit d''equiparar la taxa d''IVA cultural a la dels
      principals estats europeus.


      Els **efectes en destrucció d''ocupació** i **debilitament del teixit professional i empresarial**
      de la cultura valenciana s''han fet evidents en el transcurs d''este any, que afecta a més per la
      pèrdua de competitivitat que representa per a les empreses i professionals de la cultura participar
      en l''entorn del mercat europeu suportant una pressió fiscal que ens situa en desavantatge per ser
      excessivament superior a l''aplicat en la resta de països.


      El sector professional i empresarial de la cultura valenciana us apel·la mitjançant esta intervenció
      perquè contribuïu en funció de la responsabilitat de la vostra acció de govern a atendre esta demanda.


      Gràcies.'
