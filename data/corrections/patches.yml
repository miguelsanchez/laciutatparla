- iv_id: 2015-12-23-001
  fields:
    text_original: 'Excel·lentíssim Sr. alcalde, Sres. i Srs. regidors.


      Des de la **Plataforma Salvel el Cabanyal** i des de l’**Associació de Veïns i Veïnes Cabanyal-Canyamelar**
      ens dirigim a vostés amb motiu de la presentació en aquest ple de l’**Estratègia Integrada de Desenvolupament
      Urbà Sostenible**. Per a nosaltres és un motiu de satisfacció assistir a un ple com aquest que dóna
      resposta a una **reivindicació de les nostres associacions**: abordar les solucions a la situació
      actual del **Cabanyal** tenint en compte l’opinió dels propis veïns.


      Aquest ha sigut un procés que hem viscut en primera persona tots els veïns del Cabanyal que hem
      volgut participar en ell. De vegades no hem estat d’acord i han sigut nombroses les discrepàncies
      sorgides, però hem tingut la possibilitat d’exposar tots els nostres arguments i açò ha sigut molt
      valuós. Vull reconéixer en aquest aspecte el treball realitzat per l’equip **VaCabanyal** per abordar
      amb èxit aquesta tasca, realitzant un treball inclusiu i obert a tots.


      Saben vostés que al Cabanyal la **situació és ben difícil**. La degradació produïda per la política
      de l’anterior equip de govern encara està present al barri i els seus efectes són devastadors per
      a les persones que hi vivim. Per tant, les solucions també han de ser urgents.


      Aquest és el panorama que s’ha trobat l’actual equip de govern i ens consta el seu **compromís amb
      la rehabilitació del barri** que s’inicia amb la derogació de l’anterior PEPRI, els projectes de
      rehabilitació de vivenda i de reurbanització. A més, es pot apreciar la millora de la seguretat
      ciutadana, neteja i salubritat de l’espai públic, la posada en funcionament del **Teatre el Musical**
      i hui la presentació del resultat del projecte participatiu VaCabanyal.


      En aquests **primers sis mesos**, amb les esmentades actuacions, l’actual equip de govern ha contribuït
      a frenar la inèrcia del procés de degradació i a posar les bases d’una possible i desitjada per
      tots **recuperació i rehabilitació del Cabanyal**.


      Sabem que aquests projectes han de ser especialment sensibles amb la **població més vulnerable**.
      Necessitem veure el més prompte possible els efectes d’una **política social seriosa i responsable**
      amb els grups socials més desafavorits, que en algunes ocasions freguen l’exclusió social quan no
      estan totalment immersos en ella.


      Esperem que els resultats del que ara són projectes i convenis comencen a visualitzar-se al barri,
      **aquest any 2016 és determinant**. No es viu només de projectes sinó de realitats i la realitat
      del Cabanyal és molt dura, no és una empresa fàcil però confiem en la seua capacitat i la seua determinació.


      Saben vostés que les nostres organitzacions són **associacions i plataformes ciutadanes** amb un
      fort esperit crític, els hem expressat els nostres desacords quan ha sigut necessari. Però hui hem
      de **felicitar-los per aquest projecte**.


      Moltes gràcies, senyores i senyors.'
    text_cas: 'Excelentísimo Sr. alcalde, Sres. y Sres. concejales.


      Desde la **Plataforma Salvel el Cabanyal** y desde la **Asociación de Vecinos y Vecinas Cabanyal-Canyamelar**
      nos dirigimos a ustedes con motivo de la presentación en este pleno de la **Estrategia Integrada
      de Desarrollo Urbano Sostenible**. Para nosotros es un motivo de satisfacción asistir a un pleno
      como este que da respuesta a una **reivindicación de nuestras asociaciones**: abordar las soluciones
      a la situación actual del **Cabanyal** teniendo en cuenta la opinión de los propios vecinos.


      Este ha sido un proceso que hemos vivido en primera persona todos los vecinos del Cabanyal que hemos
      querido participar en él. A veces no hemos estado de acuerdo y han sido numerosas las discrepancias
      surgidas, pero hemos tenido la posibilidad de exponer todos nuestros argumentos y eso ha sido muy
      valioso. Quiero reconocer en este aspecto el trabajo realizado por el equipo **VaCabanyal** para
      abordar con éxito esta tarea, realizando un trabajo inclusivo y abierto a todos.


      Saben ustedes que en el Cabanyal la **situación es muy difícil**. La degradación producida por la
      política del anterior equipo de gobierno todavía está presente en el barrio y sus efectos son devastadores
      para las personas que vivimos aquí. Por tanto, las soluciones también deben ser urgentes.


      Este es el panorama que se ha encontrado el actual equipo de gobierno y nos consta su **compromiso
      con la rehabilitación del barrio** que se inicia con la derogación del anterior PEPRI, los proyectos
      de rehabilitación de vivienda y de reurbanización. Además, se puede apreciar la mejora de la seguridad
      ciudadana, limpieza y salubridad del espacio público, la puesta en funcionamiento del **Teatro el
      Musical** y hoy la presentación del resultado del proyecto participativo VaCabanyal.


      En estos **primeros seis meses**, con las mencionadas actuaciones, el actual equipo de gobierno
      ha contribuido a frenar la inercia del proceso de degradación y a sentar las bases de una posible
      y deseada por todos **recuperación y rehabilitación del Cabanyal**.


      Sabemos que estos proyectos deben ser especialmente sensibles con la **población más vulnerable**.
      Necesitamos ver lo antes posible los efectos de una **política social seria y responsable** con
      los grupos sociales más desfavorecidos, que en algunas ocasiones rozan la exclusión social cuando
      no están totalmente inmersos en ella.


      Esperamos que los resultados de lo que ahora son proyectos y convenios comiencen a visualizarse
      en el barrio, **este año 2016 es determinante**. No se vive solo de proyectos sino de realidades
      y la realidad del Cabanyal es muy dura, no es una empresa fácil pero confiamos en su capacidad y
      su determinación.


      Saben ustedes que nuestras organizaciones son **asociaciones y plataformas ciudadanas** con un fuerte
      espíritu crítico, les hemos expresado nuestros desacuerdos cuando ha sido necesario. Pero hoy debemos
      **felicitarles por este proyecto**.


      Muchas gracias, señoras y señores.'
