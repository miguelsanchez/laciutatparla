- iv_id: 2016-04-28-001
  fields:
    text_val: 'Bon dia.


      Des del Sporting Benimaclet volem donar les gràcies a esta corporació municipal i a les associacions
      de comerciants i de veïns de Benimaclet per donar la possibilitat de prendre la paraula al club
      del seu barri.


      Voldria ensenyar-los una retallada de premsa, **El Sporting Benimaclet necessita un camp**. La data,
      el 25 de maig de 1998. **Han passat 18 anys** des d''esta retallada i el Sporting Benimaclet continua
      sense camp de futbol.


      Si tota la ciutat té camps d''herba artificial, si un xiquet o xiqueta que juga a futbol o fa qualsevol
      altre esport d''herba de qualsevol districte té dret a fer-ho en herba, **per què a Benimaclet,
      un barri de trenta mil habitants, quasi un poble, no té encara el camp de futbol?**


      Fa uns mesos celebràrem **una festa reivindicativa** a la qual invitàrem tots els partits, tots
      els col·lectius i totes les associacions del barri. En eixa festa celebràvem que **el propietari
      del terreny havia cedit** al nostre club els terrenys de l''antic camp de Les Fonts, on el nostre
      equip ha disputat sempre els partits.


      Els que allí estigueren, els que allí estigueu, van poder comprovar la **terrible situació** en
      què es troba l''antic terreny de joc on hem jugat sempre. Era una estampa eixida de La Barraca:
      ''Uns camps forçosament erms prop d''Alboraia, una taca de misèria, una selva nana, enfarfegada
      i deforme…''. Aquell dia, el barri de Benimaclet, com a moderns Batistes, es posà mans a l''obra
      i el netejà. Recordem tots a Martín, un xiquet de huit anys, en una foto que li va fer Superdeporte,
      rastrellant per a netejar la malesa.


      Afortunadament, el nostre camp de Les Fonts no s''ha convertit en un solar abandonat ni en un abocador
      il·legal, **l''esforç veïnal ho ha evitat**. Allí mantenim les nostres oficines i els nostres records,
      però sobretot mantenim l''esperança que es convertisca en el que volem per a Benimaclet: un espai
      per a ensenyar els nostres valors i posar en el centre de tot als xiquets, xiquetes i joves de Benimaclet.


      Som una escola diferent, **social, popular, democràtica, igualitària i integradora**, amb un programa
      que prima el retorn social sobre tots els altres. **No som una acadèmia de futbol, ni un club d''elit**.
      Som el Sporting Benimaclet, **un equip de barri**. No volem guanyar lligues, solament volem que
      ens ajuden a poder participar-hi.


      Ajuden-nos si creuen en l''esport que nosaltres ensenyem, però sobretot si creuen que **el barri
      de Benimaclet ja ha esperat massa** per a poder gaudir d''un camp de futbol a estes altures del
      segle XXI. **La manca de camp** fa que cada temporada una part gran dels xiquets que hem vist créixer
      en el nostre club hagen d''abandonar-lo. Alguns se''n van a altres equips, uns pocs canvien d''esport,
      però la gran majoria simplement ho deixen.


      Voldria parlar-los de Diego i de Mateo, els conec des que tenien solament quatre anys. Si no ens
      ajuden, d''ací a uns mesos es veuran obligats a deixar el seu equip. No permeten que això succeïsca.


      L''Associació de Comerciants de Benimaclet, de qui prenem la paraula, ens han comentat que tenen
      ganes que torne el seu camp de futbol, que les immediacions s''omplen de xiquets, d''esmorzars,
      de samarretes d''equips visitants… En definitiva, de vida. També estan amb nosaltres associacions
      de veïns, falles i col·lectius del barri que ens han ajudat en la reivindicació.


      Creiem que és una oportunitat única per a seguir sumant suports, per a apostar pel **bon futbol,
      que no és el d''elit sinó el que educa, dona salut i ofereix el companyonisme** com a lliçó de vida.


      Els invite a tots a posar-se tots d''acord i aconseguir una solució per a tots els xiquets, xiquetes
      i joves de Benimaclet. **Els invite a que ens ajuden a aconseguir el nostre camp de futbol.**


      Moltes gràcies.'
