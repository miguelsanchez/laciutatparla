      sus militantes**, no sus votantes. **Las votantes somos las vecinas**. Los partidos no representan
      a las vecinas.

      El Partido Popular son unos señoros. Sí, sí, unos señoros. Además, como halago. O igual me he confundido
      y ha sido un lapsus. Mire, se ve que le quiero tanto y le tengo tanto aprecio que ya le llamo señoro
      Olano. **Los partidos políticos** son unos señores que se han reunido y han decidido que son los
      partidos políticos, pero **no representan a las votantes**, ni siquiera a las suyas. Yo soy vecina
      de un pueblo de **València** y no tengo ni puñetera idea de cuál es la lista electoral. A mí nunca
      ha venido el Partido Popular, siendo el del pueblo, de mi barrio, de mi distrito, de cómo sea, a
      preguntarme mi opinión o decirme qué quiere hacer por mí. Y cuando vivía en otro barrio de València,
      ese partido político tampoco lo hizo nunca. Es más, el otro día me preocupé de preguntárselo a mi
      abuela, que tiene buena memoria histórica. Escolta, iaia, i en la transició algú va vindre a preguntar-te
      alguna cosa? I en la postguerra? No.

      **Los partidos políticos no codeciden**. Aquí decidimos nosotras. Nosotras somos nosotras. No me
      refiero a nosotros, no. Me refiero a nosotras las vecinas. Sí, votando tanto a las asociaciones
      como a los partidos. Nos votan a ambos. Lo que pasa es que **nosotras tenemos 116 asociaciones vecinales**
      trabajando desinteresadamente y **ustedes tienen 17 personas cobrando** por votar lo que se les
      diga. Pero nos votan a ambos, sí. Y así es como se deciden las cosas, dentro de la ley y votando.
      Y eso es lo que se supone que hace **la participación**, definir cuál es el interés general. **València
      se gana a sí misma** con la participación. Mire, gana tanto en términos constitucionales como en
      atractivo turístico, que parece ser lo que le preocupa a ustedes.

      **El asociacionismo vecinal** nos dio el **Jardín del Turia**, donde ustedes querían una autopista.
      **La Devesa**, en lugar de una urbanización privada. Y salvó **la Albufera** de ser un aeródromo.
      València gana porque, oiga, que se genere identidad vinculada al territorio implica que hay mayor
      contenido que el turismo está interesado en visitar por su singularidad. Baje a la plaza y pregunte
