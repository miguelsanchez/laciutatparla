- iv_id: 2025-09-11-032
  fields:
    text_original: '**Excel·lentíssima alcaldessa**, regidores i regidors de l''Ajuntament de València.
      Ciudatans.

      És per a mi un honor dirigir-me a vostés en esta **jornada de participació i reflexió**. Vull aprofitar
      esta ocasió per a posar en valor el **treball realitzat per l''Ajuntament** per atendre demandes
      i necessitats de visitants i habitants, millorant la seua calitat de vida. Com a entitat cultural
      volem destacar la **sensibilitat i defensa de la cultura, tradicions i signes d''identitat**, nostra
      memòria i el llegat present i futur. Sempre ha segut deure d''esta entitat reafirmar allò que mos
      fa poble, allò que mos distingix, sentir-mos part i solidaris en tots els pobles i ciutats d''Espanya.
      Recordem, pobles i gents que tant mos van ajudar en la barrancà. Al mateix temps, reconeixem que
      **la igualtat en la unitat és riquea**.

      En primer lloc, vull detindre''m en una decisió que considerem d''enorme transcendència simbòlica,
      **la restitució de la denominació de la nostra ciutat** en la forma genuïnament valenciana, **Valéncia,
      en accent tancat**, com va ser vigent durant la **II República** i com ha defés en rigor la **Real
      Acadèmia de Cultura Valenciana i Lo Rat Penat**, com avalen estudis de prestigiosos filòlegs com
      Voro López o Abelard Saragossà, filòlegs de la llengua valenciana. Parlem d''un **acte de justícia
      filològica**, d''un acte de respete a la llibertat, tradició i cultura del poble valencià, front
      a la imposició i l''arbitrarietat de l''anterior govern municipal. Nomenada la nostra ciutat en
      la seua fonètica, tal com parla la gent, significa **respetar les nostres rels**, respetar l''autenticitat
      i la llibertat d''un poble que sempre ha sabut nomenar-se a si mateixa. L''Ajuntament, en este gest,
      no solament complix en una reclamació històrica de la societat civil, sinó que també projecta al
      món una imatge fidel de lo que som. Som valencians i som espanyols, orgullosos de la nostra herència
      i de **les nostres dos llengües, el castellà i el valencià**.

      En segon lloc, devem destacar la **recuperació d''una tradició entranyable i solemne**, el tedèum
      de la processó del **Nou d''Octubre**, la nostra festa major, el dia de tots els valencians. Este
      acte afona les seues rels en la història del Regne de València i fon recuperat en **1917** gràcies
      a la valentia i al fervor patriòtic de les Joventuts Ratpenalistes. Hui, més d''un sigle despuix,
      tornem a sentir l''emoció d''escoltar eixes notes, notes que ressonen com a pregària i acció de
      gràcies, **unint lo espiritual en lo cívic**. Fe i amor en la nostra terra, dos dels nostres grans
      valors.

      Igualment, és motiu de satisfacció subratllar la ferma decisió de **mantindre en la plaça de l''Ajuntament
      la figura de Francesc de Vinatea**. Vinatea representa per a les generacions passaes, presents i
      futures la **defensa de les nostres llibertats front a la tirania**. La valentia d''alçar la veu
      en favor d''un poble, alçar la veu per la justícia, inclús davant del poder més absolut. La **llibertat,
      la identitat i la justícia** no són consignes passatgeres, són valors permanents que deuen custodiar-se.
      Ara més que mai, quan s''ataca i es desprecia als valencians com mai des del govern d''Espanya,
      un govern venut i al servici dels interessos del **pancatalanisme separatiste** i que vol enverinar
      la nostra terra.

      Per últim, vull referir-me a una decisió que honra la sensibilitat de l''Ajuntament cap a la cultura
      i a la lliteratura valenciana. La **rotulació d''una plaça en el nom del gran poeta Anfós Ramon
      i García**, el **poeta valencià més llorejat de la història**. En este gest es reconeix la llavor
      de qui des de la paraula i el vers ha engrandit a la llengua valenciana. Gràcies, alcaldessa, per
      oferir a les noves generacions un referent, un model de compromís en la cultura propia, un testimoni
      viu de lo que significa ser valencià en plenitud. Són només quatre exemples, entre atres, del bon
      camí que deuria continuar fent esta ajuntament, encara que queden reivindicacions i projectes pendents.
      En alguns ja estem treballant conjuntament. Recordem que governar no solament és administrar, sinó
      també custodiat i projectar el llegat d''un poble i garantisar el seu futur. Com sempre hem fet
      des de Lo Rat Penat, oferim el nostre respald lleal i constructiu. Recolzarem totes les iniciatives
      que **dignifiquen la llengua valenciana, la història i les tradicions**. I recolzarem les actuacions
      per a **resoldre les necessitats dels nostres ciudatans**.

      Estem convençuts que aixina podrem fer una **València millor**, en major benestar i fidel a si mateixa,
      orgullosa del seu passat i oberta al futur.

      Gràcies alcaldessa, gràcies equip de govern pel vostre treball per València en un any tan complicat.

      **Visca València!**'
    text_cas: '**Excelentísima alcaldesa**, concejales y concejales del Ayuntamiento de València. Ciudadanos.

      Es para mí un honor dirigirme a ustedes en esta **jornada de participación y reflexión**. Quiero
      aprovechar esta ocasión para poner en valor el **trabajo realizado por el Ayuntamiento** para atender
      demandas y necesidades de visitantes y habitantes, mejorando su calidad de vida. Como entidad cultural
      queremos destacar la **sensibilidad y defensa de la cultura, tradiciones y signos de identidad**,
      nuestra memoria y el legado presente y futuro. Siempre ha sido deber de esta entidad reafirmar aquello
      que nos hace pueblo, aquello que nos distingue, sentirnos parte y solidarios en todos los pueblos
      y ciudades de España. Recordemos a pueblos y gentes que tanto nos ayudaron en la barrancada. Al
      mismo tiempo, reconocemos que **la igualdad en la unidad es riqueza**.

      En primer lugar, quiero detenerme en una decisión que consideramos de enorme trascendencia simbólica,
      **la restitución de la denominación de nuestra ciudad** en la forma genuinamente valenciana, **Valéncia,
      en acento cerrado**, como fue vigente durante la **II República** y como ha defendido con rigor
      la **Real Academia de Cultura Valenciana y Lo Rat Penat**, como avalan estudios de prestigiosos
      filólogos como Voro López o Abelard Saragossà, filólogos de la lengua valenciana. Hablamos de un
      **acto de justicia filológica**, de un acto de respeto a la libertad, tradición y cultura del pueblo
      valenciano, frente a la imposición y la arbitrariedad del anterior gobierno municipal. Nombrar nuestra
      ciudad en su fonética, tal como habla la gente, significa **respetar nuestras raíces**, respetar
      la autenticidad y la libertad de un pueblo que siempre ha sabido nombrarse a sí mismo. El Ayuntamiento,
      en este gesto, no solamente cumple con una reclamación histórica de la sociedad civil, sino que
      también proyecta al mundo una imagen fiel de lo que somos. Somos valencianos y somos españoles,
      orgullosos de nuestra herencia y de **nuestras dos lenguas, el castellano y el valenciano**.

      En segundo lugar, debemos destacar la **recuperación de una tradición entrañable y solemne**, el
      tedéum de la procesión del **Nou d''Octubre**, nuestra fiesta mayor, el día de todos los valencianos.
      Este acto hunde sus raíces en la historia del Reino de Valencia y fue recuperado en **1917** gracias
      al valor y al fervor patriótico de las Juventudes Ratpenalistas. Hoy, más de un siglo después, volvemos
      a sentir la emoción de escuchar esas notas, notas que resuenan como plegaria y acción de gracias,
      **uniendo lo espiritual con lo cívico**. Fe y amor en nuestra tierra, dos de nuestros grandes valores.

      Igualmente, es motivo de satisfacción subrayar la firme decisión de **mantener en la plaza del Ayuntamiento
      la figura de Francesc de Vinatea**. Vinatea representa para las generaciones pasadas, presentes
      y futuras la **defensa de nuestras libertades frente a la tiranía**. La valentía de alzar la voz
      en favor de un pueblo, alzar la voz por la justicia, incluso ante el poder más absoluto. La **libertad,
      la identidad y la justicia** no son consignas pasajeras, son valores permanentes que deben custodiarse.
      Ahora más que nunca, cuando se ataca y se desprecia a los valencianos como nunca desde el gobierno
      de España, un gobierno vendido y al servicio de los intereses del **pancatalanismo separatista**
      y que quiere envenenar nuestra tierra.

      Por último, quiero referirme a una decisión que honra la sensibilidad del Ayuntamiento hacia la
      cultura y la literatura valenciana. La **rotulación de una plaza con el nombre del gran poeta Anfós
      Ramon i García**, el **poeta valenciano más laureado de la historia**. En este gesto se reconoce
      la semilla de quien desde la palabra y el verso ha engrandecido la lengua valenciana. Gracias, alcaldesa,
      por ofrecer a las nuevas generaciones un referente, un modelo de compromiso con la cultura propia,
      un testimonio vivo de lo que significa ser valenciano en plenitud. Son solo cuatro ejemplos, entre
      otros, del buen camino que debería seguir haciendo este ayuntamiento, aunque quedan reivindicaciones
      y proyectos pendientes. En algunos ya estamos trabajando conjuntamente. Recordemos que gobernar
      no solamente es administrar, sino también custodiar y proyectar el legado de un pueblo y garantizar
      su futuro. Como siempre hemos hecho desde Lo Rat Penat, ofrecemos nuestro respaldo leal y constructivo.
      Apoyaremos todas las iniciativas que **dignifiquen la lengua valenciana, la historia y las tradiciones**.
      Y apoyaremos las actuaciones para **resolver las necesidades de nuestros ciudadanos**.

      Estamos convencidos de que así podremos hacer una **València mejor**, en mayor bienestar y fiel
      a sí misma, orgullosa de su pasado y abierta al futuro.

      Gracias alcaldesa, gracias equipo de gobierno por vuestro trabajo por València en un año tan complicado.

      **¡Visca València!**'
