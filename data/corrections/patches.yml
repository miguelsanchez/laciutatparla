  fields:
    idioma_original: castellano
    text_cas: ''
    text_val: 'Bon dia a tots. Sr. Ribó, senyors regidors.


      Comente-us que les entitats locals menors **s''inicien per dos procediments**. Un és **a iniciativa
      del veïnat** on a través dels mitjans decideix el Consell. I l''altre és **d''ofici**, Sr. Ribó,
      on la tramitació la fa l''Ajuntament i la resolució la fa l''Ajuntament. Nosaltres el dia 22 de
      febrer vam estar al seu despatx parlant amb vosté i ens va comentar que **anava a actuar d''ofici**,
      motiu pel qual nosaltres, després de ratificar totes les seues bondats a Benimàmet quan va vindre
      a visitar la pedania, doncs li vam dir, ens va explicar que no havíem portat la carta.


      Llavors, jo amb data **17 de juliol del 2017** li vaig portar la carta sol·licitant que actuara
      vosté d''ofici. Una vegada presentem la carta vam reunir ràpidament a l''**Associació de Veïns**
      i als partits polítics informant-los del que havíem fet i dient-los a més que, com vosté ha d''actuar
      d''ofici, en el moment que ho fera nosaltres deixàvem el nostre ser com a Benimàmet Poble i receptors
      serien els partits polítics.


      Amb data de setembre, primera quinzena, jo em reunisc amb el Sr. Llavador, amb la cap territorial
      i una advocada, i li portem **el registre d''entrada 097912** que és la carta que nosaltres fem
      a l''Ajuntament quan presentem el **2001 l''expedient de segregació**, on es deia Assumpte: Segregació.
      Annex, que és una cosa que va unida a una altra cosa de la qual depén i que té totes les seues competències.


      Llavors, tot això em sorprén que ens digan que, per exemple, **el Suprem haja dit no a l''entitat
      local menor (ELM)**. L''ELM, **ni s''ha pronunciat l''Ajuntament, ni s''ha pronunciat la Generalitat,
      ni s''ha pronunciat el TSJ, ni s''ha pronunciat el Suprem**.


      Nosaltres, el dia **13 de novembre** després de parlar amb el Sr. Llavador i presentar-li les signatures
      i estar tot el món d''acord almenys, em va dir: ''Ja li avisarà a vosté l''Ajuntament''. La nostra
      alegria principal va ser veure quan el dia 13 de novembre a Las Provincias i Levante-EMV la Sra.
      Consol Castillo fa unes declaracions en eixos dos periòdics principals dient que **Benimàmet, l''expedient
      està viu**, perquè la pretensió més alta la va tindre el Suprem, però no es va pronunciar sobre
      l''ELM. Per tal motiu, **es va a dirigir a la Generalitat** a veure si comparteix la mateixa opinió
      i **es pot fer Benimàmet Poble com més prompte millor**.


      Nosaltres el 15 vam vindre ací a fer el Ple, es va votar i després pareix ser que allò va ser **una
      declaració d''intencions**. Clar, eixa declaració d''intencions ens porta a que hem d''anar a la
      Generalitat una altra vegada amb els llibres, amb les signatures i amb tot. Ens vam reunir amb el
      Sr. Toni Such i li informem que sí, que nosaltres tenim tota la potestat per acollir-nos a abans
      de la **Llei del 2013, ens correspon la de 1985**. La subdirectora ens diu que no podem de cap manera
      demanar perquè ho ha desmentit el Tribunal Suprem, ha fallat en contra. Jo li dic que no, com porte
      la sentència se la llig.


      Llavors, Sr. Ribó, res més que vull dir-li que **nosaltres estem complits**. Però a més **legalitzats
      i complim amb el marc legal** perquè Benimàmet siga ELM amb el nostre expedient. Si a vosté no li
      pareix prou substancial, nosaltres estaríem conformes a **cedir a IU les nostres signatures** i
      a col·laborar com hem col·laborat sempre amb tot el món.


      Hi ha hagut unes declaracions el diumenge passat que nosaltres no col·laborem amb res. A mi em pareix
      una vergonya quan **portem 22 anys col·laborant** amb els veïns de Benimàmet, sense subvenció, sense
      res.


      Sr. Ribó, jo vull agrair-li ací davant de tots ja que **si estem ací és gràcies a vosté**. Vosté
      ens ha donat suport, ens ha dit que endavant i jo vull ser agraït amb vosté. Li diré una cosa, **seria
      un broche d''or per a nosaltres** que vosté complira i ho posara això com déu mana. Només faré una
      referència a un torero, sé que a vosté no li agraden els toros, a mi sí. Havia un torero que li
      anomanaven Figura i complía tots els… tercios debidament, però a l''hora de matar no havia forma
      de matar al toro. El bou al corral, cada vegada que matava el bou al corral. Ni amb un canó mataven
      el bou i passà de Figura a Figureta. **Jo vull que vosté acabe com déu mana i siga Figura, no Figureta**.
      Figura, Sr. Ribó.'
