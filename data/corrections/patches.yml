- iv_id: 2024-09-16-1-008
  fields:
    text_val: 'Bon dia, senyores i senyors, alcaldessa.

      Atés el poc temps del què disposem, em cenyiré a mencionar algunes de les qüestions fonamentals
      que defensem des del moviment veïnal. La Federació Veïnal de València aglutina prop de **80 associacions
      veïnals de tots els barris** de la ciutat i com a moviment veïnal organitzat de València **reivindiquem
      sempre la participació**, que és la nostra essència. I així ens oferim també cap als nostres governants,
      sempre amb **voluntat de diàleg**, d''escoltar i de ser escoltats, amb propostes i idees per a una
      ciutat millor. Per això, també és tan necessari i urgent el **Reglament de participació que continuem
      esperant**, així com l''**actualització de les juntes de districte** perquè deixen de ser inoperants.

      Volem aprofitar este espai per a tornar a reivindicar **la ciutat que volem**, una ciutat de veïnes
      i veïns oberta al món, però que siga **habitable per a totes i tots**, on els interessos econòmics
      no estiguen per davant de qüestions tan bàsiques com el **dret a l''habitatge**, el medi ambient
      o la pròpia salut. Estem parlant de **racionalitat, de sostenibilitat**, de regulacions i iniciatives
      per a la convivència ciutadana, per a preservar el dret de gaudi de totes i tots en la ciutat, posant
      **límits als excessos** respecte a l''espai públic i a qüestions tan fonamentals i irrenunciables
      com són la salut i l''habitatge.

      Enguany **València és Capital Verda Europea**. Doncs si volem una **ciutat verda sostenible** han
      de desenvolupar-se polítiques amb innovació quant al transport, al desenvolupament urbà, al control
      d''emissions, a la **creació de zones verdes**, entre altres accions, a través de **polítiques responsables**
      que tinguen l''objectiu de reduir els grans impactes ambientals i promoure un estil de vida més
      ecològic i assequible. És coneguda la nostra **oposició a l''ampliació del port**. Les ciutats d''avui
      han de modernitzar les seues infraestructures per a garantir que la ciutat es puga recórrer fàcilment
      **a peu, en bicicleta o en sistema de transports públics ecològics**. Si volem una **València sostenible**
      hem de dissenyar la ciutat per a millorar el seu impacte ambiental mitjançant la planificació i
      la gestió urbana, per a millorar les condicions de vida en cada barri, siga del centre o de la perifèria.
      I per això reivindiquem també **la urgència del soterrament de les vies de Serreria i les del Parc
      Central** per la vertebració de la ciutat, que continua pendent des de fa dècades.

      Reivindiquem també que el **Corredor Verd es faça realitat** tal com s''havia projectat, com un
      espai verd tan necessari per a la ciutat. No ens podem permetre anar cap arrere. La ciutadania exigeix
      una **ciutat amb menys cotxes**, però també amb **més possibilitats de mobilitat sostenible i millor
      transport públic**, també pel que fa a Rodalies i dins del concepte d''**àrea metropolitana**. I
      també reclamem **molta més transparència respecte a dades i participació** pel que fa als nous projectes
      en tot allò que té a veure amb la planificació de la mobilitat de la ciutat.

      D''altra banda, reiterem que **no estem en contra que vinguen turistes**. Tampoc en contra de locals
      d''oci. Però quan parlem de sostenibilitat, quan parlem d''una ciutat verda, quan parlem d''una
      ciutat habitable, estem parlant d''una racionalitat, d''una sostenibilitat que ha d''impulsar la
      **convivència ciutadana**. El **dret a gaudir totes i tots de la ciutat** posant límits als excessos,
      respecte a l''espai públic i a drets fonamentals com són el **dret a accedir a un habitatge digne**
      o alguna cosa tan simple com el dret al descans i a la pròpia salut. **Benvinguda siga la moratòria
      d''apartaments turístics** que tant havíem reclamat, però és primordial que l''equip de govern faça
      un seguiment d''una situació que està sent enormement perjudicial per a la ciutat i també per a
      les veïnes i veïns. No n''hi ha prou. És imprescindible **limitar les inspeccions i sancions reals
      i efectives** amb una regulació eficaç. Hi ha almenys **més de 4.500 apartaments turístics il·legals**
      en la ciutat i **proposem la conversió en lloguer assequible residencial almenys 2.000 d''ells durant
      un any**.

      I per últim, encara que podríem esmentar moltes més qüestions si tinguérem més temps, esperem **la
      prompta incorporació de més efectius policials** i reivindiquem la **necessitat i urgència de la
      policia de barri** caminant pels nostres carrers, amb contacte directe amb les nostres veïnes i
      veïns.

      Moltes gràcies.'
