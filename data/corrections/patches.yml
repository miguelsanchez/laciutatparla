- iv_id: 2024-05-28-006
  fields:
    text_original: Muchas gracias. Estimada alcaldesa, concejales y concejalas. Hoy me presento nuevamente
      ante ustedes, esta vez como portavoz de la **Plataforma València amb Palestina**, un colectivo civil
      respaldado por **más de 700 ciudadanos** y ciudadanas y **114 entidades**, entre las cuales se encuentran
      la comunidad palestina, la Coordinadora Valenciana de ONGD de la Comunidad Valenciana, Comisiones
      Obreras País Valencià, UGT País Valencià, Casa Marruecos y la Coordinadora Feminista, entre otras.
      Nos une la exigencia de un **alto al fuego inmediato** en Palestina, el **fin del genocidio en Gaza**
      y la defensa de la paz y el respeto a los derechos humanos. Hoy **España reconoce a Palestina**
      como Estado junto a Irlanda y Noruega. Eso es un paso importantísimo que por supuesto aplaudimos,
      pero no nos podemos quedar ahí. Hay que poner fin al **régimen del apartheid israelí** y hay que
      exigir la **retirada inmediata del ejército israelí** de los territorios ocupados. Regreso nuevamente
      a este Pleno municipal de València con el respaldo de más de 114 entidades que representan a miles
      de valencianos y valencianas porque seguimos confiando en su capacidad para reflexionar, rectificar
      y sobre todo, actuar. En este Pleno municipal el **Partido Popular y Vox** votaron en contra de
      un alto al fuego, un voto en contra que fue fundamentado a base de informes, noticias que con el
      tiempo se han revelado como **información falsa**. Los **bebés decapitados** atribuidos a Hamás
      resultaron ser manipulaciones destinadas a generar miedo y justificar una violencia irracional y
      desmentida por parte del Estado de Israel. Medios de comunicación de referencia como el **New York
      Times**, **The Guardian**, incluso **Haaretz** ya han rectificado. Sobre el derecho a defenderse
      ayer conversé con dos votantes suyos, señora alcaldesa. Uno de ellos justificaba lo que ocurre en
      Gaza recurriendo al derecho a defenderse por parte del Estado de Israel. Y el otro le respondió
      -insisto, dos votantes suyos, señora alcaldesa-, el otro le respondió imagina que el Estado español
      después de un atentado de ETA hubiese decidido aniquilar a todo el pueblo vasco. No tuve que añadir
      nada más. Pero sí que hoy quiero añadir algo más sobre el derecho a defenderse. Las cifras y el
      incumplimiento sistemático por parte de Israel del Derecho internacional humanitario. Las víctimas
      del derecho a defenderse de Israel, señores y señoras, son bebés, son niños, son madres, son ancianos,
      son periodistas, personal humanitario, médicos, ambulancias, universidades, hospitales. Y eso simplemente
      es ilegal. **Más de 35.000 personas civiles** han sido asesinadas en Gaza. Y eso no es derecho a
      defenderse. Eso no tiene otro nombre, esto es un **genocidio**. Las cifras siguen aumentando cada
      día. Señoras y señores, ¿qué tipo de defensa es esta que aniquila a los más vulnerables? ¿Qué hace
      nuestro Ayuntamiento de València ante esta situación? ¿Se queda de brazos cruzados? El Ayuntamiento
      de València no puede ser cómplice de un genocidio y la **ciudadanía valenciana** les pide hoy de
      manera clara y contundente que **València se sume** al reclamo internacional para detener esta masacre.
      Los ministros de Asuntos Exteriores de la Unión Europea han convocado un Consejo de Asociación con
      Israel, que debatirá el cumplimiento de sus obligaciones en materia de derechos humanos. La **Corte
      Internacional de Justicia** le ha ordenado detener inmediatamente su ofensiva militar en Gaza. En
      Estados Unidos altos funcionarios de la Administración de Biden están dimitiendo en protesta por
      el apoyo de su país al genocidio. **Ciento cuarenta países** ya conocen el Estado palestino, **veintiocho
      países europeos**, ocho de ellos pertenecen a la Unión Europea. Las capitales del mundo se están
      llenando de personas que claman contra el genocidio. Nuestra ciudad, **València**, ha salido a las
      calles de forma masiva y continuada. En los **últimos ocho meses** se han celebrado unas decenas
      de manifestaciones multitudinarias en València. La **juventud en los campus universitarios**, en
      nuestra ciudad, en todo el mundo, están exigiendo un alto al fuego. El silencio ya no es una opción
      viable. Ya no se puede sostener más. ¿A qué esperan ustedes? No podemos quedarnos del lado equivocado
      de la historia. La realidad es innegable. La verdad y la justicia se abren paso de manera inevitable.
      Señores y señoras, es hora de rectificar. No esperen que sea demasiado tarde, que su acción sea
      que parezca una simple reacción de la presión global. Exigimos ya, juntas y juntos, un **alto al
      fuego inmediato** y apoyemos el conocimiento del **Estado palestino** como solución para alcanzar
      la paz de una vez por todas. Que nuestra ciudad, València, sea un ejemplo de justicia y de humanidad.
      València no puede permanecer indiferente. El Ayuntamiento de València no puede permanecer indiferente
      porque València no es indiferente al genocidio. Muchas gracias.
    text_val: Moltes gràcies. Estimada alcaldessa, regidors i regidores. Avui me presente de nou davant
