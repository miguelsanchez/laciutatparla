- iv_id: 2025-01-28-002
  fields:
    text_original: 'Bé, **bon dia**.

      Fa **dos hores** o dos hores i mitja que ha començat el Ple i no voldria oblidar que **demà farà
      tres mesos** que moltes persones i molts veïns nostres van faltar. I per tant, un record per a tots
      ells.

      Bé, el punt que s''ha de parlar ara, la **moció sobre la creació dels comitès de seguiment**, jo
      abans no voldria deixar almenys d''ocupar la meitat del temps que tinc per a denunciar una sèrie
      d’**irregularitats** que, al meu parer i al de qualsevol persona d''este ple, segurament no els
      parega bé. La presidenta de l''associació que jo represente, ací present, que m''acompanya, **rep
      insults** per la tasca que com a presidenta de l''associació fa -i d''igual manera jo com a portaveu-
      per part de membres no del consell de govern, sinó membres secundaris. **Creiem que això és inacceptable.**
      Ni tenim la boca plena de merda, ni som uns mentiders com després s''ha comprovat en moltes de les
      actuacions quan hem tingut contactes en reunions, ni tota la sèrie de coses que fins i tot ahir
      després de la reunió a **La Torre** ens van prosseguir eixos comentaris nefastos.

      Bé, aprofitaré per a, a banda de denunciar açò que pense que caldria una disculpa o una rectificació
      o alguna actuació per eixa part, vinc a explicar una mica qui som i què fem en l''associació perquè
      se''ns està criticant, fins i tot se’ns ha cridat l''atenció per fer tuits. Jo de veres que he revisat
      tots els tuits i no n''hi ha cap tuit que falte al respecte a ningú. D''igual manera que la intervenció
      que jo vaig fer en el Ple ordinari d''ací del **20 de desembre** tampoc he trobat cap falta de respecte.
      He revisat l''acta que s''ha aprovat el punt primer de l''ordre del dia de hui, **594 pàgines**.
      Jo no he vist cap falta de respecte. Però bé, què fem en l''associació? L''associació ens reunim
      **cada dijous de vesprada** en unes **juntes veïnals de caràcter obert**. Quan dic de caràcter obert
      és tot el món i fins i tot els d''ací esteu més que convidats. I el que fem és parlar dels problemes
      que són més immediats, a llarg termini de cara a actuacions. I a partir d''ahí, doncs, decidim naturalment
      participar, perquè l''associació de veïns és l''espai que té el poder és de vindre ací jo en representació
      de tots a parlar, anar a les juntes de districte, anar a les comissions com vam anar la setmana
      passada, etcètera.

      Naturalment, nosaltres el que pretenem és **col·laborar en la gestió** que s''està fent. Jo estic
      seguint amb molta atenció el ple de hui. I el regidor Giner diu ‘derrotado Ribó’, l''altre diu ‘Que
      reclame a su gobierno’. És curiós que el consell de govern d’este ajuntament quan intervé sembla
      que facen oposició. A mi és una cosa que em sobta. No entraré en disquisicions sobre el que s''està,
      els **25 milions** i tal, perquè tots sabem les mancances i de fet, ahir en la reunió es van comprometre
      a certes coses que esperem que que continuen. El que demanem sobretot amb la creació dels comitès
      de seguiment és la **comunicació fluida**. Vos puc ensenyar, per exemple, encara que porte 3 minuts,
      tenim un **grup de treball** que s''està encarregant com podeu vore en este mapa, hem parcel·lat
      tota la zona de **La Torre-Faitanar en sis zones** i voluntaris membres de l''associació, torne
      a dir, de totes les ideologies i de moltes maneres de pensar, gent que vol el millor per al barri
      mirant el cadastre estan anant marcant cada parcel·la què s''ha de fer. N''hi ha parcel·les en què
      s''estan abocant residus, s’està abocant fang i això s''ha de netejar. I naturalment, qui té la
      competència és l''Ajuntament, ja siga una execució subsidiària, ja siga qualsevol dels altres procediments
      que té a la seua disposició.

      Pose açò com a exemple per tractar de defensar el que fem l''associació. El que fem l’associació
      simplement és una faena d’estar en primera mà amb els veïns i de ser d''altaveu i de vincle entre
      l''Ajuntament, els grups parlamentaris i, naturalment, el consell de govern, a fi de millorar la
      vida de tots els que vivim en les zones afectades. Pose açò com a exemple perquè pense que ací s''està
      parlant que es fa tot a ple pulmó. Jo espere anar-me’n molt content hui i també a ple pulmó, i que
      les reunions siguen cada setmana. Jo pense que açò és un tema que ens podem reunir ja, digueu data.
      Ens reunim, vos donem els mapes i comencem a tramitar. Igual com este tema, n''hi ha molts d''altres.

      Jo pense que com intervindre en altres mocions, pense que per a començar amb això va bé.

      Gràcies per l''atenció.'
    text_cas: 'Pues, **buenos días**.

      Hace **dos horas** o dos horas y media que ha empezado el Pleno y no quisiera olvidar que **mañana
      hará tres meses** que muchas personas y muchos vecinos nuestros fallecieron. Y, por tanto, un recuerdo
      para todos ellos.

      Bien, el punto que se debe tratar ahora, la **moción sobre la creación de los comités de seguimiento**,
      yo antes no quisiera dejar de ocupar al menos la mitad del tiempo que tengo para denunciar una serie
      de **irregularidades** que, a mi parecer y al de cualquier persona de este pleno, seguramente no
      les parecerán bien. La presidenta de la asociación que yo represento, aquí presente, que me acompaña,
      **recibe insultos** por la labor que como presidenta de la asociación realiza -y de igual manera
      yo como portavoz- por parte de miembros no del consejo de gobierno, sino miembros secundarios. **Creemos
      que esto es inaceptable.** Ni tenemos la boca llena de mierda, ni somos unos mentirosos como después
      se ha comprobado en muchas de las actuaciones cuando hemos tenido contactos en reuniones, ni toda
      la serie de cosas que incluso ayer después de la reunión en **La Torre** nos siguieron con esos
      comentarios nefastos.

      Bien, aprovecharé para, aparte de denunciar esto que pienso que requeriría una disculpa o una rectificación
      o alguna actuación por esa parte, vengo a explicar un poco quiénes somos y qué hacemos en la asociación
      porque se nos está criticando, incluso se nos ha llamado la atención por hacer tuits. Yo de verdad
      he revisado todos los tuits y no hay ningún tuit que falte al respeto a nadie. Igual que la intervención
      que yo hice en el Pleno ordinario de aquí del **20 de diciembre** tampoco he encontrado ninguna
      falta de respeto. He revisado el acta que se ha aprobado en el punto primero del orden del día de
      hoy, **594 páginas**. Yo no he visto ninguna falta de respeto. Pero bien, ¿qué hacemos en la asociación?
      Nos reunimos **cada jueves por la tarde** en unas **juntas vecinales de carácter abierto**. Cuando
      digo de carácter abierto es todo el mundo e incluso los de aquí estáis más que invitados. Y lo que
      hacemos es hablar de los problemas que son más inmediatos, a largo plazo de cara a actuaciones.
      Y a partir de ahí, pues, decidimos naturalmente participar, porque la asociación de vecinos es el
      espacio que tiene el poder de venir aquí yo en representación de todos a hablar, ir a las juntas
      de distrito, ir a las comisiones como fuimos la semana pasada, etcétera.

      Naturalmente, nosotros lo que pretendemos es **colaborar en la gestión** que se está haciendo. Estoy
      siguiendo con mucha atención el pleno de hoy. Y el concejal Giner dice «derrotado Ribó», el otro
      dice «Que reclame a su gobierno». Es curioso que el consejo de gobierno de este ayuntamiento cuando
      interviene parece que hace oposición. A mí es algo que me sorprende. No entraré en disquisiciones
      sobre lo que se está, los **25 millones** y tal, porque todos sabemos las carencias y de hecho,
      ayer en la reunión se comprometieron a ciertas cosas que esperamos que continúen. Lo que pedimos
      sobre todo con la creación de los comités de seguimiento es la **comunicación fluida**. Os puedo
      enseñar, por ejemplo, aunque llevo 3 minutos, que tenemos un **grupo de trabajo** que se está encargando,
      como podéis ver en este mapa, hemos parcelado toda la zona de **La Torre-Faitanar en seis zonas**
      y voluntarios miembros de la asociación, repito, de todas las ideologías y de muchas maneras de
      pensar, gente que quiere lo mejor para el barrio, mirando el catastro están yendo marcando cada
      parcela qué hay que hacer. Hay parcelas en las que se están vertiendo residuos, se está vertiendo
      barro y esto hay que limpiarlo. Y naturalmente, quien tiene la competencia es el Ayuntamiento, ya
      sea una ejecución subsidiaria, ya sea cualquiera de los otros procedimientos que tiene a su disposición.

      Pongo esto como ejemplo para tratar de defender lo que hacemos la asociación. Lo que hacemos la
      asociación simplemente es un trabajo de estar en primera mano con los vecinos y de ser altavoz y
      vínculo entre el Ayuntamiento, los grupos parlamentarios y, naturalmente, el consejo de gobierno,
      con el fin de mejorar la vida de todos los que vivimos en las zonas afectadas. Pongo esto como ejemplo
      porque pienso que aquí se está hablando de que se hace todo a pleno pulmón. Espero irme muy contento
      hoy y también a pleno pulmón, y que las reuniones sean cada semana. Yo pienso que esto es un tema
      que nos podemos reunir ya, decid fecha. Nos reunimos, os damos los mapas y empezamos a tramitar.
      Igual que este tema, hay muchos otros.

      Yo pienso que como intervenir en otras mociones, pienso que para empezar con esto va bien.

      Gracias por la atención.'
