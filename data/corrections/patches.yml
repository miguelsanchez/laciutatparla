- iv_id: 2020-05-28-002
  fields:
    text_original: 'Buenos días.


      Pese a **la situación actual de alerta sanitaria** hoy no hemos querido desaprovechar la oportunidad
      que nos da este Pleno para asistir. Informamos que los **diferentes colectivos de vecinos** y vecinas
      que nos hemos unido desde la última **exposición pública del PEC** seguimos activos entre nosotros.


      Estamos esperanzados con las **modificaciones efectuadas**. Aunque hemos tenido conocimiento de
      algunas de ellas directamente con alguna reunión con **Urbanismo** y otras directamente por los
      medios de comunicación, nos encontramos a la espera de conocer los detalles del Plan, así como conocer
      la respuesta a las **alegaciones fruto del trabajo** de los grupos vecinales.


      Por ello confiamos en la que en este **nuevo período de exposición** se continúe colaborando y se
      llegue a más acuerdos conjuntamente, pensando en que la forma en que se diseñe ahora el **barrio
      definirá la vida futura** de los vecinos y vecinas. También posibilitará cerrar un **ciclo de incertidumbre
      y abusos urbanísticos** que permita continuar con la regeneración del barrio en su conjunto, de
      **Serrería a la mar** y del **puerto a Tarongers**. Dadas las limitaciones actuales del **estado
      de alarma sanitaria** solicitamos la **ampliación del plazo de exposición pública** para poder organizarnos.


      Para terminar, recordar que aunque me veáis aquí sola vengo en nombre de **varios grupos vecinales**
      que trabajan y trabajarán para conseguir un **barrio mejor, urbanística y socialmente**. No olvidemos
      que no hay ciudad sin ciudadanos. Este es un comunicado conjunto de la **Asociación de Vecinos y
      Vecinas de la Malvarrosa**, de **Zero Incívics**, del **Bloque Portuarios**, de **Equipo Vía Verde
      Cabanyal**, de la **Asociación Vía de las Arenas**, del **Cabanyal Horta** y de **Pavimar**.


      Muchas gracias.'
