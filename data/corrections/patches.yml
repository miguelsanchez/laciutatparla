  fields:
    idioma_original: castellano
    text_original: 'Bona vesprada a totes i a tots. Parlaré en **castellà** perquè ens puguem entendre
      totes al mateix temps.


      Muchas gracias a todas las **33 concejalas**. Digo concejalas por el género. Digo concejalas por
      personas del **Pleno del Ayuntamiento de València** en la legislatura **2019-mayo 2023**. También
      gracias a todos los medios de comunicación, los servicios del Ayuntamiento y la asistencia presencial
      y la no presencial, y a toda Europa, África y América Latina que están en streaming y que están
      viendo este pleno en directo desde su casa a través de su móvil.


      Desde la **Federación Unión Africana España**, hoy es un día muy importante para toda la comunidad
      inmigrante de València y para todas las personas del mundo. Reclamamos desde la Federación Unión
      Africana en España la **declaración de emergencia habitacional** del asentamiento **la antigua fábrica
      de leche El Prado** en la **avenida de Cataluña** de la ciudad. **El año pasado murieron cuatro
      personas** en este asentamiento. Ahora, hay un inmigrante muy enfermo de este asentamiento. La Generalitat
      Valenciana ha dado un piso social al Ayuntamiento de València. Lo único que pedimos es una **declaración
      de emergencia habitacional**. Esta declaración no entiende de color político, se trata de personas.
      No es la propuesta de Ciudadanos, es la propuesta de asociación de inmigrante para inmigrante. Necesitábamos
      un canal y hemos usado el canal de Ciudadanos. No es ponerse ninguna medalla, es una **solidaridad
      humana**. Los **Servicios Sociales del Ayuntamiento de Benimaclet** lo han trabajado **diez años,
      desde 2013**. No se puede seguir trabajando así cuando se trata de vida humana. Hoy se darán en
      directo en todo el mundo los que realmente quieren inmigrantes en la ciudad de València y las personas
      con sus votos no quieren a inmigrantes, y tendrán la responsabilidad de la muerte de una **quinta
      persona inmigrante enferma** y que la historia estará testigo en las hemerotecas de **hoy 23 de
      febrero 2023**, de las concejalas del Ayuntamiento de la legislatura 2019-2023. Votar a una alternativa
      que dice que los servicios sociales de Benimaclet seguirán trabajando, cuando han muerto cuatro
      personas y que está a punto de morir una quinta persona, esto es **violencia**, es votar en contra
      de los inmigrantes de València que están desde su casa escuchándonos y viéndonos, es votar también
      contra la humanidad. Y esto las hemerotecas del mundo lo tendrán.


      Para finalizar, pido la **responsabilidad de cada concejala**, no de grupo o de color político,
      porque realmente la responsabilidad es individual.


      Muchas gracias.'
    text_val: 'Bona vesprada a totes i a tots. Parlaré en **castellà** perquè ens puguem entendre totes
      al mateix temps.


      Moltes gràcies a totes les **33 regidores**. Dic regidores pel gènere. Dic regidores per persones
      del **Ple de l''Ajuntament de València** en la legislatura **2019-maig 2023**. També gràcies a tots
      els mitjans de comunicació, als servicis de l''Ajuntament i a l''assistència presencial i la no
      presencial, i a tota Europa, Àfrica i Amèrica Llatina que estan en streaming i que estan veient
      este ple en directe des de casa seua a través del seu mòbil.


      Des de la **Federació Unió Africana Espanya**, hui és un dia molt important per a tota la comunitat
      immigrant de València i per a totes les persones del món. Reclamem des de la Federació Unió Africana
      a Espanya la **declaració d''emergència habitacional** de l''assentament **l''antiga fàbrica de
      llet El Prado** en la **avenida de Cataluña** de la ciutat. **L''any passat moriren quatre persones**
      en este assentament. Ara hi ha un immigrant molt malalt d''este assentament. La Generalitat Valenciana
      ha donat un pis social a l''Ajuntament de València. L''única cosa que demanem és una **declaració
      d''emergència habitacional**. Esta declaració no entén de color polític, es tracta de persones.
      No és la proposta de Ciutadans, és la proposta de l''associació d''immigrant per a immigrant. Necessitàvem
      un canal i hem usat el canal de Ciutadans. No és posar-se cap medalla, és una **solidaritat humana**.
      Els **Servicios Sociales del Ayuntamiento de Benimaclet** ho han treballat **deu anys, des de 2013**.
      No es pot seguir treballant així quan es tracta de vida humana. Hui es donaran en directe a tot
      el món els que realment volen immigrants en la ciutat de València, i les persones amb els seus vots
      no volen immigrants, i tindran la responsabilitat de la mort d''una **cinquena persona immigrant
      malalta** i que la història serà testimoni en les hemeroteques de **hui 23 de febrer de 2023**,
      de les regidores de l''Ajuntament de la legislatura 2019-2023. Votar una alternativa que diu que
      els servicis socials de Benimaclet seguiran treballant, quan han mort quatre persones i quan està
      a punt de morir una cinquena persona, això és **violència**, és votar en contra dels immigrants
      de València que estan des de casa seua escoltant-nos i veient-nos, és votar també contra la humanitat.
      I això les hemeroteques del món ho tindran.


      Per a finalitzar, demane la **responsabilitat de cada regidora**, no de grup o de color polític,
      perquè realment la responsabilitat és individual.


      Moltes gràcies.'
    text_cas: ''
    resum_cas: Representante de la Federación Unión Africana España reclama la declaración de emergencia
      habitacional del asentamiento de la antigua fábrica El Prado en avenida de Cataluña, donde han muerto
      cuatro personas y hay otro inmigrante muy enfermo, exigiendo responsabilidad individual de los concejales.
    resum_val: Representant de la Federació Unió Africana Espanya reclama la declaració d'emergència habitacional
      de l'assentament de l'antiga fàbrica El Prado en avinguda de Catalunya, on han mort quatre persones
      i n'hi ha un altre molt malalt, exigint responsabilitat individual dels regidors.
