  fields:
    text_val: 'Hola, bon dia.


      Des del Mercat Central volem mostrar públicament **la nostra preocupació** per **la reforma en els
      trajectes de la EMT**. Les **257 empreses** que constitueixen el Mercat Central i tots els comerços
      de l''entorn temem que **amb esta mesura es perjudique greument als nostres negocis**.


      Estem a favor d''**un model de ciutat sostenible** i de **la peatonalització de les places**, però
      no entenem per què **la peatonalització està renyida amb el transport públic**. Defensem **un centre
      històric viu**, amb el **petit comerç, comerç de proximitat, comerç d''artesania**, amb una gastronomia
      de qualitat, un centre per als seus veïns i per als valencians, i no un centre pensat només per
      als visitants i turistes.


      Per tot això, **demanem que es paralitze el projecte de la EMT** que està previst per al dia 23
      de març. Demanem que es faça **una Taula de Mobilitat real**, on es tinguen en compte les necessitats
      i propostes de totes les associacions que engloben el centre històric de València. Que es busque
      el consens entre tots. Serà llavors i només llavors quan es trobarà un projecte amb èxit.


      I jo els pregunte, Partit Socialista, Ramón Vilar, Pilar Bernabé, de veritat és tan difícil **retardar
      la posada en marxa del projecte**? Amb la possibilitat de millorar-lo tenint en compte les propostes
      dels veïns, dels comerciants, en definitiva, de tots els representants que de manera o una altra
      som els que constituïm el centre històric de la ciutat.


      Moltes gràcies.'
    resum_cas: La Asociación de Vendedores del Mercado Central expresa su preocupación por la reforma
      de los trayectos de la EMT, pidiendo que se paralice el proyecto previsto para el 23 de marzo y
      que se cree una Mesa de Movilidad real para buscar consenso entre todos los agentes del centro histórico.
