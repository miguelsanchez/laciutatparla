    text_cas: ''
    text_val: 'Moltes gràcies. Bona vesprada a tots.


      Senyors regidors de l''Ajuntament de València, com a representant del SPPLB-CV i sobretot en l''Ajuntament
      de València vull comentar-los i fer-los una sol·licitud d''**adhesió del Ple a la no modificació
      de la Llei de seguretat ciutadana**, la Llei 4/2015. I si finalment es realitza aquesta modificació
      que siga **amb el consens de les Forces i Cossos de Seguretat** i sobretot que siga amb el **total
      suport i protecció**.


      Miren ustedes, des del SPPLB estem molt preocupats per la **més que probable modificació de la Llei
      de seguretat ciutadana** perquè a pesar de tot el que es va dir allà pel any 2015, ha resultat ser
      un **instrument fonamental en el treball** de les Forces i Cossos de Seguretat.


      Miren ustedes, **a les Forces i Cossos de Seguretat, a la Policia Local al carrer no se''ns respecta**
      i això és una realitat. Saben ustedes com ens reben en els botellons ací en la nostra ciutat? Amb
      **amenaces, amb insults** i en algunes ocasions ens tiren de tot: ampolles, gots, etc.


      I ustedes, els polítics, tots, cadascú en el seu honor, **són en gran part responsables de tot això**.
      I saben per què? Perquè en lloc de **legislar normes que reforcen l''autoritat de la Policia Local**
      fan tot el contrari.


      Saben ustedes que **les agressions a agents s''han incrementat en més d''un 30 per cent** en l''últim
      any? Perquè a Espanya **resistir-se o agredir a un policia costa molt barat**, la majoria dels casos
      amb una simple multa.


      Si permetem **modificar la Llei de seguretat ciutadana** tot el que acabo de dir-los s''incrementarà
      i tindrem **més inseguretat ciutadana**. Tot això se solucionaria en gran part **generant normes
      que incrementen l''autoritat de la policia**.


      La **principal funció de la Policia Local és la prevenció dels delictes**. I saben ustedes quina
      norma ens ampara? La **Llei de seguretat ciutadana**, eixa llei que ara volem modificar.


      Vull aprofitar el poc temps que em queda per demanar-los **el suport d''esta moció**. La identificació
      dels ciutadans passa de ser d''un termini de sis hores a dos hores. I el més perillós de tot, **a
      la persona que identifiquem la hem de tornar al mateix lloc on va ser recollida**.'
