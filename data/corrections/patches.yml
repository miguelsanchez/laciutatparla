- iv_id: 2016-12-01-001
  fields:
    text_original: 'Bon dia. Com són tres minuts, vaig a llegir-ho. Sé que estaria millor el que jo poguera
      esplaiar-me o dir les idees conforme les tenim assumides, però vaig a llegir i acabarem de seguida.
      Bon dia a totes i a tots. Sr. alcalde, senyores regidores i regidors. La Plataforma i l’Associació
      de Veïns/es hem demanat el torn de paraula al Ple de hui per mostrar el nostre **suport als esforços**
      que s’estan fent per a la **recuperació del nostre poble**. Coneixem les dificultats que s’han tingut
      que superar. **Calia aturar la inèrcia de 18 anys** de destrucció per poder començar la rehabilitació.
      Ja és moment de que tot comence a caminar. Agraïm a l’equip de govern i als que amb els seus vots
      estan fent possible que les **inversions per a dotacions socials** i reurbanitzacions arriben al
      **Cabanyal-el Canyamelar**. No obstant, el problema encara no està resolt, queda molta feina per
      fer. Per avançar es imprescindible que segueixen contant amb la **participació ciutadana**. Estem
      disposats a treballar i participar pel millor futur del nostre poble, com creguem que ho estem fent
      fins ara. No tenim temps per a exposar tots els assumptes que ens preocupen. Sols anem a parlar-ne
      de dos: la **seguretat ciutadana** i el **patrimoni municipal**. Respecte a la seguretat ciutadana,
      tenim l’esperança en els compromisos assumits per l’equip de govern després de la reunió de l’11
      d’octubre i en les reunions entre les distintes administracions. Però, de moment, encara continuen
      els problemes que tots coneixem. Es imprescindible que es convoque la reunió de la Comissió que
      es va anunciar el **16 de novembre**, després de la reunió amb la Delegació de Govern. I no sols
      parlem en el nostre nom, de la Plataforma i l’Associació de Veïns. En este moment estem parlant
      en nom de les següents organitzacions: la **Junta Major de la Setmana Santa Marinera**, l’**Agrupació
      de Falles del Marítim**, les associacions de veïns, la **Plataforma Salvem Cabanyal**, que ens hem
      unit i hem fet un grup de treball per a exigir l’eliminació de la venta de droga als nostres carrers.
      I és en nom de totes estes organitzacions que volem recordar que el mateix 16 de novembre presentarem
      escrit conjunt dirigit a Sr. alcalde i al Sr. delegat del Govern demanant-los una reunió per coordinar
      totes les accions que s’hagen de fer per eliminar el **problema de la droga**. El problema és greu.
      La Setmana Santa es va veure obligada a canviar itineraris de processons ja fa anys, en els pitjors
      anys, i les falles van haver de canviar la ubicació de seus casals per problemes amb el veïnat.
      Creguem que ja és el moment d’anar eliminant totes estes coses. Per això, creguem que el problema
      és tan greu i que encara està ahí, que ens posem. És a dir, este grup es posa a disposició de tot
      l’Ajuntament, de la corporació, de l’equip de govern per a avançar. Respecte del patrimoni públic,
      hi ha un **problema greu**. L’Ajuntament és propietari al voltant de **450-500 vivendes**. Estes
      vivendes encara no hi ha un pla que coneixem, un **pla de rehabilitació ni de manteniment**. Davant
      tot açò, desconeguem si n’hi ha algun projecte per a recuperar estes vivendes. Hem dirigit un escrit
      a la Regidoria de Patrimoni Municipal perquè ens contesten les previsions. És un focus principal
      de degradació les vivendes que són propietat municipal. Bo, propietat pública perquè també participa
      la **Generalitat Valenciana**. Ahir es va donar un pas endavant: ‘El Consell obri la via per expropiar
      l’ús de vivendes deshabitades’. És a dir, com l’Ajuntament pensa complir. Hem vingut a donar-los
      les gràcies i a dur-los dos problemes. Un, la seguretat ciutadana, i dos, la reunió amb la Regidoria
      de Patrimoni Municipal. Moltes gràcies.'
    text_cas: 'Buenos días. Como son tres minutos, voy a leerlo. Sé que estaría mejor lo que yo pudiera
      explayarme o decir las ideas según las tenemos asumidas, pero voy a leer y acabaremos enseguida.
      Buenos días a todas y a todos. Sr. alcalde, señoras concejalas y concejales. La Plataforma y la
      Asociación de Vecinos/as hemos pedido el turno de palabra al Pleno de hoy para mostrar nuestro **apoyo
      a los esfuerzos** que se están haciendo para la **recuperación de nuestro pueblo**. Conocemos las
      dificultades que se han tenido que superar. **Había que parar la inercia de 18 años** de destrucción
      para poder empezar la rehabilitación. Ya es momento de que todo empiece a caminar. Agradecemos al
      equipo de gobierno y a los que con sus votos están haciendo posible que las **inversiones para dotaciones
      sociales** y reurbanizaciones lleguen al **Cabanyal-el Canyamelar**. No obstante, el problema aún
      no está resuelto, queda mucho trabajo por hacer. Para avanzar es imprescindible que sigan contando
      con la **participación ciudadana**. Estamos dispuestos a trabajar y participar por el mejor futuro
      de nuestro pueblo, como creemos que lo estamos haciendo hasta ahora. No tenemos tiempo para exponer
      todos los asuntos que nos preocupan. Solo vamos a hablar de dos: la **seguridad ciudadana** y el
      **patrimonio municipal**. Respecto a la seguridad ciudadana, tenemos la esperanza en los compromisos
      asumidos por el equipo de gobierno tras la reunión del 11 de octubre y en las reuniones entre las
      distintas administraciones. Pero, de momento, siguen los problemas que todos conocemos. Es imprescindible
      que se convoque la reunión de la Comisión que se anunció para el **16 de noviembre**, después de
      la reunión con la Delegación del Gobierno. Y no solo hablamos en nuestro nombre, de la Plataforma
      y la Asociación de Vecinos. En este momento estamos hablando en nombre de las siguientes organizaciones:
      la **Junta Mayor de la Semana Santa Marinera**, la **Agrupación de Fallas del Marítim**, las asociaciones
      de vecinos, la **Plataforma Salvem Cabanyal**, que nos hemos unido y hemos hecho un grupo de trabajo
      para exigir la eliminación de la venta de droga en nuestras calles. Y es en nombre de todas estas
      organizaciones que queremos recordar que el mismo 16 de noviembre presentaremos escrito conjunto
      dirigido a Sr. alcalde y al Sr. delegado del Gobierno pidiéndoles una reunión para coordinar todas
      las acciones que haya que hacer para eliminar el **problema de la droga**. El problema es grave.
      La Semana Santa se vio obligada a cambiar itinerarios de procesiones hace ya años, en los peores
      años, y las fallas tuvieron que cambiar la ubicación de sus casales por problemas con el vecindario.
      Creemos que ya es el momento de ir eliminando todas estas cosas. Por eso, creemos que el problema
      es tan grave y que todavía está ahí, que nos ponemos. Es decir, este grupo se pone a disposición
      de todo el Ayuntamiento, de la corporación, del equipo de gobierno para avanzar. Respecto del patrimonio
      público, hay un **problema grave**. El Ayuntamiento es propietario de alrededor de **450-500 viviendas**.
      Estas viviendas todavía no hay un plan que conozcamos, un **plan de rehabilitación ni de mantenimiento**.
      Ante todo esto, desconocemos si hay algún proyecto para recuperar estas viviendas. Hemos dirigido
      un escrito a la Concejalía de Patrimonio Municipal para que nos contesten las previsiones. Es un
      foco principal de degradación las viviendas que son propiedad municipal. Bueno, propiedad pública
      porque también participa la **Generalitat Valenciana**. Ayer se dio un paso adelante: «El Consell
      abre la vía para expropiar el uso de viviendas deshabitadas». Es decir, cómo piensa cumplir el Ayuntamiento.
      Hemos venido a darles las gracias y a traerles dos problemas. Uno, la seguridad ciudadana, y dos,
      la reunión con la Concejalía de Patrimonio Municipal. Muchas gracias.'
