  fields:
    text_val: 'Bon dia, senyora alcaldessa. Senyores regidors i senyores regidores.


      Primer, agrair que ens estiguen escoltant i deixem testimoni del malestar, la zozobra que han causat
      les paraules del regidor. Em cenyiré al text per a no allargar-lo.


      Des del respecte institucional que sempre ha caracteritzat el moviment veïnal, volem fer una reflexió
      serena i constructiva, però també ferma, sobre el que va succeir recentment en este hemicicle, quan
      en un espai com este, que representa la màxima expressió i representació de la democràcia local,
      s''escolten paraules que **posen en dubte la legitimitat de la participació ciutadana**, no podem
      evitar sentir preocupació.


      Depenent de com es diga i de qui ho diga, eixes paraules poden generar inquietud, perquè si es tracta
      d''una equivocació puntual, d''una intervenció desafortunada, fruit del moment, sempre queda la
      possibilitat de rectificar i aleshores estarem davant d''un error conjuntural que a totes les persones
      els pot passar. Potser també davant d''una falta d''empatia i, per descomptat, d''un desconeixement
      mutu del que és el moviment veïnal.


      Però quan estes paraules no es corregeixen, quan no hi ha matisacions ni reflexions posteriors,
      **deixen de ser un error per a convertir-se en una manera d''entendre la democràcia**. O la no democràcia.
      I és ací on el moviment veïnal no pot romandre en silenci.


      Ens preocupa especialment una visió que **qüestiona de manera generalitzada la representació social**
      i, al seu torn, el saber senzill de la gent dels barris. Perquè si algú es reunix amb associacions
      empresarials però considera que no representen als empresaris, si es reunix amb sindicats però pensa
      que no representen als treballadors i, a més, considera que **les associacions veïnals són simplement
      persones que es reunixen però que no representen als seus veïns i veïnes**, aleshores el problema
      no està en les organitzacions, el problema està en la concepció mateixa de la representació democràtica.


      Esta visió ens remet a **models de poder que crèiem superats**, models on veiem una idea d''autoritat
      que no reconeix la intermediació, ni la participació, ni la legitimitat col·lectiva. A una imatge
      que ens recorda temps passats. **Tot per al poble, però sense el poble**. Que representa el poder
      i el saber absolut, aliè a la realitat social, a les vivències de les necessitats de la ciutadania,
      sostingut únicament en si mateix, sense necessitat d''escoltar ni de retre comptes.


      Però **la democràcia en la qual vivim és precisament el contrari**. La democràcia no és només representació
      institucional, com s''ha dit amb encert en totes les intervencions. **És també participació, és
      diàleg, és reconeixement mutu** i és creació de zones d''afecció. I ara eixa zona d''afecció en
      molts llocs s''ha trencat.


      **El moviment veïnal forma part essencial d''esta democràcia des de fa més de 50 anys**. No cal
      recordar els fites històriques. Durant dècades veïns i veïnes han treballat de manera silenciosa
      i voluntària per millorar barris, per defendre serveis públics, per construir comunitat, per fer
      les nostres ciutats espais més habitables, relacionals, més justos i més humans.


      Esta lluita pels valors democràtics no és aliena a este hemicicle. Ben al contrari, esta lluita
      és en gran manera la que ha permés que hui vosaltres us seguen ací en representació de la ciutadania
      amb tota la legitimitat democràtica que us atorguen les urnes. I ho diem amb respecte, amb el respecte
      institucional que vosaltres mereixeu. Però també amb la legítima expectativa que **este respecte
      siga recíproc**.


      Perquè quan es vessen paraules que qüestionen la legitimitat de la participació ciutadana organitzada,
      eixe respecte es ressent.


      Necessitem eixa **articulació de les relacions entre la governança municipal i una part de la societat
      civil organitzada de manera autònoma**, de manera autònoma, en el moviment veïnal. I no es ressenten
      els constructes socials o abstractes, sinó que darrere d''un moviment veïnal hi ha milers de veïns
      i veïnes que han sostingut durant dècades la vida democràtica dels nostres barris.


      **El moviment veïnal mai no ha volgut privilegis**. No cal reconeixement individual. No cal posar
      nom a les persones que durant més de 50 anys han treballat pels seus barris. No cal recompensar
      esta tasca amb medalles ni honors. Basta amb quelcom molt més senzill i alhora molt més important,
      **el respecte**. **El respecte institucional cap a qui ha contribuït a construir la democràcia des
      de baix**.


      El respecte cap a qui creu en la participació com a eina de millora col·lectiva. El respecte cap
      a qui representa des de la proximitat als seus veïns i veïnes. Ens creiem la democràcia, ens creiem
      la participació, ens creiem la representació col·lectiva perquè l''hem defesa, l''hem construïda
      i continuarem exercint-la cada dia en els nostres barris.


      Per això, fem una crida a la responsabilitat institucional d''este Ajuntament per a preservar este
      marc de respecte i d''afecció mútua. Perquè quan s''afeblix este respecte no s''afeblixen només
      les associacions veïnals, **s''afeblix el conjunt del sistema democràtic**.


      Des del moviment veïnal continuarem treballant com sempre ho hem fet amb voluntat.


      Busquem la dignitat de la participació ciutadana i el respecte de la societat civil organitzada,
      perquè **sense participació la democràcia es buida i sense respecte la democràcia es deteriora**.'
