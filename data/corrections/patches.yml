- iv_id: 2017-07-27-001
  fields:
    text_original: 'Bon dia i moltes gràcies a l''**Associació Iniciativa Jove** que ens ha cedit la paraula
      com a **Anima Naturalis**.


      Fa justament **un any** el nostre Govern va ser valent i va donar un pas endavant en **prohibir
      el bou embolat i el bou amb corda**. Amb això vàrem donar un pas cap a la **compassió, el respecte,
      l''empatia i l''evolució**, valors que són essencials per al progrés, la civilització d''un poble.


      Existixen moltíssimes formes de passar-ho bé a les festes d''una població, només hi ha que mirar
      els costums i els festejos de tants pobles de la nostra nació o de nacions veïnes, moltíssimes formes
      que no comporten cap perill per als animals ni per a les persones i estem cansats que ací sempre
      s''haja d''incloure **la violència**. Condemnem qualsevol tipus de violència, ja siga cap als animals
      o cap a les persones les quals també patixen accidents i de vegades molt greus, i fins i tot mortals,
      quan el bou corre desesperat pel dolor i per la por.


      Fa tan sols **tres dies un bou va morir a Foios** víctima de la desesperació que li provocaven les
      boles de foc en les seues banyes, estava encegat i desorientat. Només soltar-lo va escometre contra
      el piló que minuts abans el retenia i ja no va poder tornar a alçar-se. Eixa vesprada el mateix
      bou havia banyegat un fester. **No volem que cap d''aquests accidents tornen a repetir-se mai**.


      Aquests tipus d''espectacles ja no haurien de tindre cabuda al nostre temps. Ningú, ni persona ni
      animal, ha de sofrir per tal que els demés s''ho passen bé. Estic segura que junts podem construir
      unes festes que agraden a tot el món perquè també als pobles i pedanies de València hi ha molta
      gent contrària a aquestes pràctiques, i que també té dret a gaudir d''**unes festes sense crueltat**.


      **Tradició i evolució** són conceptes que poden anar de la mà i l''exemple més proper són les **Illes
      Balears** que han dit no a la mort i al sofriment en les corregudes de bous. Cada dia és més gran
      la part de la població que rebutja la tortura i cada dia més ciutats se sumen al **moviment de respecte
      cap als animals**, cap als que no tenen veu ni vot però sí sentiments.


      Per favor, **no ens quedem ancorats en el passat** i deixem que la ciutat evolucione. Si la humanitat
      ha progressat és perquè totes les tradicions i costums han anat modificant-se i adaptant-se amb
      el temps, i aquesta ho està demanant a crits.


      Perquè quan voteu no esteu votant a favor o en contra d''una simple festa, amb el vostre vot a favor
      del bou embolat o amb corda esteu **condemnant moltes vides d''éssers innocents**, afavorint el
      sofriment i dient sí al maltractament.


      Espere de tot cor que **hui València no done un pas enrere** i en la vostra mà està que es puga
      aconseguir.


      Moltes gràcies.'
    text_cas: 'Buenos días y muchas gracias a la **Asociación Iniciativa Joven** que nos ha cedido la
      palabra como **Anima Naturalis**.


      Hace justamente **un año** nuestro Gobierno fue valiente y dio un paso adelante al **prohibir el
      toro embolado y el toro con cuerda**. Con eso dimos un paso hacia la **compasión, el respeto, la
      empatía y la evolución**, valores que son esenciales para el progreso, la civilización de un pueblo.


      Existen muchísimas formas de pasarlo bien en las fiestas de una población, solo hay que mirar las
      costumbres y los festejos de tantos pueblos de nuestra nación o de naciones vecinas, muchísimas
      formas que no comportan ningún peligro para los animales ni para las personas y estamos cansados
      de que aquí siempre tenga que incluirse **la violencia**. Condenamos cualquier tipo de violencia,
      ya sea hacia los animales o hacia las personas, las cuales también sufren accidentes y a veces muy
      graves, e incluso mortales, cuando el toro corre desesperado por el dolor y por el miedo.


      Hace tan solo **tres días un toro murió en Foios** víctima de la desesperación que le provocaban
      las bolas de fuego en sus astas, estaba cegado y desorientado. Solo soltarlo embistió contra el
      poste que minutos antes lo retenía y ya no pudo volver a levantarse. Esa tarde el mismo toro había
      corneado a un festero. **No queremos que ninguno de estos accidentes vuelva a repetirse jamás**.


      Este tipo de espectáculos ya no deberían tener cabida en nuestro tiempo. Nadie, ni persona ni animal,
      debe sufrir para que los demás se diviertan. Estoy segura de que juntos podemos construir unas fiestas
      que gusten a todo el mundo porque también en los pueblos y pedanías de València hay mucha gente
      contraria a estas prácticas, y que también tiene derecho a disfrutar de **unas fiestas sin crueldad**.


      **Tradición y evolución** son conceptos que pueden ir de la mano y el ejemplo más cercano son las
      **Islas Baleares** que han dicho no a la muerte y al sufrimiento en los correbous. Cada día es mayor
      la parte de la población que rechaza la tortura y cada día más ciudades se suman al **movimiento
      de respeto hacia los animales**, hacia los que no tienen voz ni voto pero sí sentimientos.


      Por favor, **no nos quedemos anclados en el pasado** y dejemos que la ciudad evolucione. Si la humanidad
      ha progresado es porque todas las tradiciones y costumbres han ido modificándose y adaptándose con
      el tiempo, y esta lo está pidiendo a gritos.


      Porque cuando votéis no estáis votando a favor o en contra de una simple fiesta, con vuestro voto
      a favor del toro embolado o con cuerda estáis **condenando muchas vidas de seres inocentes**, favoreciendo
      el sufrimiento y diciendo sí al maltrato.


      Espero de todo corazón que **hoy València no dé un paso atrás** y en vuestra mano está que se pueda
      conseguir.


      Muchas gracias.'
