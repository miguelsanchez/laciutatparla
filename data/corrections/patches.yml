- iv_id: 2023-12-20-003
  fields:
    text_original: 'Hola, buenas tardes. Concejales, alcaldesa. Muchas gracias por invitar a **FAMPA**,
      que la **federación más representativa** de padres de alumno, madre de alumnos, AMPA de **València
      capital**. Somos **631 las AMPA asociadas**. Y al igual que mis compañeros de sindicato, me uno
      a todo lo que reivindican ellos.

      Y nosotros estamos aquí en primer lugar porque **no se nos ha llamado**. Si somos tan representativos,
      que se modifique una ley que nos afecta tan de lleno, porque afecta de pleno a la familia, como
      es **acercar casas de apuestas** o permitir que se vuelvan a acercar casas de apuestas a los centros
      educativos, sobre todo a los instituto. Para nosotros eso no tiene sentido. O sea, no hay una gran
      demanda social, no hay un clamor para que se acerquen las casas de apuestas a los colegios, a las
      escuelas. No entendemos bien a qué viene esa modificación. Puede haber intereses, pero yo creo que
      en un ayuntamiento o en principio toda la administración tiene que estar al servicio del ciudadano,
      en especial de los de menores.

      La pregunta es, bueno, puedo dar datos de lo que significa casas de juego. En función del tiempo
      pues daré alguno o no. Estamos hablando de la ley, la regulación del juego y de prevención de la
      ludopatía de la Comunidad Valenciana, la **Ley 1/2020**. **PP y Vox** registraron un nuevo marco
      jurídico en el que se va a **eliminar la limitación de 850 metros** desde un instituto principalmente
      a una casa de apuestas. ¿Qué hay de malo en que exista esa limitación? ¿Qué problema hay? Yo no
      lo entiendo. De verdad me pregunto: ¿Todas las personas que aquí tengan familia, que tengan un hijo,
      un nieto, una hija en edad escolar, de verdad necesitan una casa de apuestas más cerca?, ¿a menos
      de 850 metros? ¿Para qué? ¿Para que le pille en el camino del instituto a su casa y el ocio sea
      ese?, ¿no sea deporte?, ¿no sea un parque?, ¿no sea la playa? No nos cuadra, sinceramente. Tampoco
      nos cuadra evidentemente que no se nos haya llamado. Somos muy representativo, el **73 % de las
      AMPA** de colegios públicos de València están afiliados a nuestra federación. Yo creo que tenemos
      algo que decir y ya vamos tarde porque esto ya va para adelante.

      Entonces, **València** como ayuntamiento, como municipio, es el **15 % de la población** de la Comunidad
      Valenciana. Este ayuntamiento creo que puede tener la voz suficiente como para que como federación
      de AMPA de la provincia y como federación también del territorio, que llame por teléfono hoy mismo
      al salir de aquí, esta tarde, que se paralice esto. Porque qué sentido tiene. No lo entendemos.
      Yo sé que puede haber empresas que le interese que sea un negocio, pero se pone por delante un **riesgo
      de ludopatía** en jóvenes, en adolescentes, se pone por delante de un negocio o de una multa, me
      da igual. O sea, quiero decir, ¿es que acaso la ludopatía no tiene un coste? Un coste social importantísimo.
      Voy a dar un dato, como diría una ministra. El **22 % de los jugadores** en España es **menor de
      25 años**. **Uno de cada diez adolescentes** entre 18, bueno, adolescente o semiadulto, jóvenes
      entre 18 y 25 que juega se convierte en ludópata, uno de cada diez. Empiezan además, digamos, presencialmente.
      Seguimos sin entenderlo. No sé qué problema hay.

      Yo les pediría una reflexión a todos los concejales y a todas las concejalas. Le pediría una reflexión
      de que si tiene familia, ¿por qué tiene que salir adelante esta ley? ¿Qué problema ocasiona una
      casa de apuestas? O sea, ¿qué mejora, qué ganamos, qué ganamos que la casa de apuestas esté a la
      salida del colegio? ¿Quién gana algo? Alguien, no sé. Aparte del propietario de la casa de apuestas,
      o sea, grandes corporaciones que suelen ser hoteles, no sé quién gana. Y yo creo que las instituciones
      públicas están para luchar por un **ocio alternativo y sano**.

      Entonces, nosotros nos unimos a las mociones que se van a presentar hoy aquí, a lo que han comentado
      los compañeros. Y bueno, voy a recordar una parte del programa electoral del **Partido Popular**
      a las elecciones aquí municipales: **Fomentar un modelo de ocio responsable**. En el punto 5.13.1,
      apartado 21. Yo creo que esta forma de ocio no es responsable. Yo creo que desde el Ayuntamiento
      de València deberíamos, perdón, me alargo, deberíamos llamar a Conselleria y parar eso.

      Muchas gracias.'
    text_val: 'Hola, bona vesprada. Regidors, alcaldessa. Moltes gràcies per invitar a **FAMPA**, que
      és la **federació més representativa** de pares d''alumnes, mare d''alumnes, AMPA de **València
      capital**. Som **631 les AMPA associades**. I igual que els meus companys de sindicat, m''unisc
      a tot el que reivindiquen ells.

      I nosaltres estem ací en primer lloc perquè **no se''ns ha convocat**. Si som tan representatius,
      que es modifique una llei que ens afecta tan de ple, perquè afecta de ple a la família, com és **acostar
      cases d''apostes** o permetre que tornen a acostar-se cases d''apostes als centres educatius, sobretot
      als instituts. Per a nosaltres això no té sentit. O sigui, no hi ha una gran demanda social, no
      hi ha un clam perquè s''acosten les cases d''apostes als col·legis, a les escoles. No entenem bé
      a què ve eixa modificació. Pot haver-hi interessos, però jo crec que en un ajuntament o en principi
      tota l''administració ha d''estar al servei del ciutadà, en especial dels menors.

      La pregunta és, bé, puc donar dades del que significa cases de joc. En funció del temps doncs donaré
      alguna o no. Estem parlant de la llei, la regulació del joc i de prevenció de la ludopatia de la
      Comunitat Valenciana, la **Llei 1/2020**. **PP i Vox** van registrar un nou marc jurídic en el qual
      es va a **eliminar la limitació de 850 metres** des d''un institut principalment a una casa d''apostes.
      Què hi ha de dolent en què existisca eixa limitació? Quin problema hi ha? Jo no ho entenc. De veres
      em pregunte: totes les persones que ací tinguen família, que tinguen un fill, un net, una filla
      en edat escolar, de veres necessiten una casa d''apostes més prop, a menys de 850 metres? Per a
      què? Perquè li pille en el camí de l''institut a casa seua i l''oci siga eixe? No siga esport? No
      siga un parc? No siga la platja? No ens quadra, sincerament. Tampoc ens quadra evidentment que no
      se''ns haja convocat. Som molt representatius, el **73 % de les AMPA** de col·legis públics de València
      estan afiliats a la nostra federació. Jo crec que tenim alguna cosa a dir i ja anem tard perquè
      això ja va cap avant.

      Llavors, **València** com a ajuntament, com a municipi, és el **15 % de la població** de la Comunitat
      Valenciana. Este ajuntament crec que pot tindre la veu suficient perquè com a federació d''AMPA
      de la província i com a federació també del territori, que telefone hui mateix en sortir d''ací,
      esta vesprada, perquè es paralitze això. Perquè quin sentit té. No ho entenem. Jo sé que pot haver-hi
      empreses que els interesse que siga un negoci, però es posa per davant un **risc de ludopatia**
      en joves, en adolescents, es posa per davant d''un negoci o d''una multa, em és igual. O sigui,
      vull dir, és que la ludopatia no té un cost? Un cost social importantíssim. Done una dada, com diria
      una ministra. El **22 % dels jugadors** a Espanya és **menor de 25 anys**. **Un de cada deu adolescents**
      entre 18, bé, adolescent o semiadult, joves entre 18 i 25 que juga es converteix en ludòpata, un
      de cada deu. Comencen a més, diguem-ne, presencialment. Seguim sense entendre-ho. No sé quin problema
      hi ha.

      Jo els demanaria una reflexió a tots els regidors i a totes les regidores. Li demanaria una reflexió
      de si té família, per què ha de traure''s endavant esta llei? Quin problema ocasiona una casa d''apostes?
      O sigui, què millora, què guanyem, què guanyem que la casa d''apostes estiga a la sortida del col·legi?
      Qui guanya alguna cosa? Algú, no sé. A part del propietari de la casa d''apostes, o sigui, grans
      corporacions que solen ser hotels, no sé qui guanya. I jo crec que les institucions públiques són
      per a lluitar per un **oci alternatiu i sà**.

      Llavors, nosaltres ens unim a les mocions que es presentaran hui ací, al que han comentat els companys.
      I bé, vaig a recordar una part del programa electoral del **Partit Popular** a les eleccions ací
      municipals: **Fomentar un model d''oci responsable**. En el punt 5.13.1, apartat 21. Jo crec que
      esta forma d''oci no és responsable. Jo crec que des de l''Ajuntament de València hauríem de, perdó,
      em allargue, hauríem de telefonar a la Conselleria i parar això.

      Moltes gràcies.'
