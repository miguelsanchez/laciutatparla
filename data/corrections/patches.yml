- iv_id: 2025-10-28-001
  fields:
    text_original: 'Bon dia, senyora alcaldessa.

      A mi m''agradaria, abans de començar la meua intervenció, recordar que **demà farà un any** i l''homenatge
      que volem fer des de l''associació a les víctimes de la dana, especialment també a totes les famílies
      que han perdut algun familiar. I dit açò, vaig a parlar d''una cosa que em sembla un poc trivial
      perquè hi ha **problemes molt més grossos**, evidentment. I la meua opinió personal, molt personal,
      és que, i no és una crítica, és una opinió personal, crec que enguany els **pressupostos participatius**
      es podrien haver destinat a ajudar al **barri de la Torre** o a altres municipis. I dit això, ja
      comence amb la meua intervenció. Moltes gràcies.

      En primer lloc, senyora alcaldessa, vull felicitar-la per la realització dels **primers pressupostos
      participatius** del seu mandat. Valorem positivament **innovacions com la possibilitat de votar
      en contra** d''una proposta, la qual cosa enriquix el procés. I em permeten començar amb una reflexió
      sobre el sentit d’estos pressupostos. La seua essència no és simplement repartir partides, sinó
      donar cabuda a aquelles idees que precisament per ser tan **locals i específiques** no formen part
      dels plans generals de l''Administració. És la **visió de qui viu en el barri** la que detecta eixes
      intervencions que poden millorar la nostra qualitat de vida.

      Per això, el **principi de sobirania ciutadana** exercit amb el seu vot ha de ser intocable i, per
      tant, s''ha de preservar l''esperit amb el qual ha sigut concebuda cada proposta. Hi ha molta gent
      que no som tècnics i tal vegada redactem propostes sense un llenguatge tècnic específic i pense
      que s''hauria de conservar eixe esperit.

      Dit açò, hem arribat a un **punt crític** que amenaça esta fi. La **falta de transparència** en
      el cribratge de propostes. Al nostre juí, hem detectat una **certa arbitrarietat** amb la qual s''ha
      aplicat este filtre. Per això considerem urgent que abans de procedir a les votacions finals s''ha
      d’estipular un **període d''al·legacions** perquè les propostes rebutjades puguen ser revisades
      i, si és el cas, readmeses. Observem **situacions contradictòries**, ja que algunes propostes com
      la de la **superilla d''Abastos**, que ha sigut reduïda a un mer pas de zebra, se''ls ha aplicat
      un reajustament extrem per adaptar-les al pressupost.

      Unes altres, en canvi, han sigut directament descartades, sense oferir-los eixa mateixa possibilitat
      de reajustament, al·legant directament que superen el cost. S''ha permès a algunes propostes limitar-se
      a la redacció del projecte tècnic per ajustar-se al pressupost, mentres que unes altres, com les
      presentades per la nostra associació que sol·licitàvem precisament i de manera prèvia sols eixa
      redacció, han sigut rebutjades. Això no és una simple contradicció, és una **discriminació en l''aplicació
      de les normes**. Un criteri desigual no és un criteri just. És essencial que existisquen unes **normes
      més específiques** del procés de selecció i s''apliquen de manera uniforme.

      Però hi ha un cas que mereix menció a part i ens preocupa especialment que és la proposta del **carril
      bici en el passeig de la Petxina**. Es rebutja per ser inviable al contingut en la **moció conjunta
      de criteris d''intervenció urbanística i de mobilitat aprovada el 3 d''octubre del 2025**. Permeteu-me
      que ho diga amb claredat, però o és una casualitat extraordinària o esta **moció es va redactar
      ad hoc** una vegada es coneixia les propostes populars d''ampliar la xarxa de carrils bici amb l’única
      fi de bloquejar-les capriciosament, al·legant que la seua implantació pot suposar una elevada pèrdua
      de places d''estacionament. Això és **canviar les regles del joc** a la meitat del partit. Aplicar
      una normativa nova de manera retroactiva per invalidar la voluntat veïnal no és només injust, sinó
      una pràctica que soscava la credibilitat de tot el procés.

      Per tot això, senyora alcaldessa, les nostres peticions són clares i concretes. L''**obertura immediata
      d''un termini d''al·legacions** per a revisar els rebujos tècnics, l''**aplicació estricta d''uns
      criteris tècnics uniformes** i ben detallats per a les propostes i, molt especialment, la **revisió
      de l''aplicació de la moció del 3 d''octubre** que considerem un veto improcedent de la voluntat
      ciutadana. Senyora alcaldessa, els **pressupostos participatius** no són un tràmit, són una **promesa
      de democràcia directa**. Una promesa que es buida de contingut si no hi ha regles clares, transparència
      en les decisions i sobretot, respecte a la **sobirania del vot veïnal**. Confiem que puguen rectificar
      i prenguen estes mesures per a retornar la credibilitat a un procés que, en essència, ha de pertànyer
      a la ciutadania.

      Moltes gràcies.'
    text_cas: 'Buenos días, señora alcaldesa.

      A mí me gustaría, antes de empezar mi intervención, recordar que **mañana se cumple un año** y el
      homenaje que queremos hacer desde la asociación a las víctimas de la dana, especialmente también
      a todas las familias que han perdido algún familiar. Dicho esto, voy a hablar de algo que me parece
      un poco trivial porque hay **problemas mucho más grandes**, evidentemente. Y mi opinión personal,
      muy personal, es que, y no es una crítica, es una opinión personal, creo que este año los **presupuestos
      participativos** se podrían haber destinado a ayudar al **barrio de la Torre** o a otros municipios.
      Dicho esto, ya empiezo con mi intervención. Muchas gracias.

      En primer lugar, señora alcaldesa, quiero felicitarla por la realización de los **primeros presupuestos
      participativos** de su mandato. Valoramos positivamente **innovaciones como la posibilidad de votar
      en contra** de una propuesta, lo que enriquece el proceso. Y permítanme empezar con una reflexión
      sobre el sentido de estos presupuestos. Su esencia no es simplemente repartir partidas, sino dar
      cabida a aquellas ideas que precisamente por ser tan **locales y específicas** no forman parte de
      los planes generales de la Administración. Es la **visión de quien vive en el barrio** la que detecta
      esas intervenciones que pueden mejorar nuestra calidad de vida.

      Por eso, el **principio de soberanía ciudadana** ejercido con su voto debe ser intocable y, por
      tanto, debe preservarse el espíritu con el que ha sido concebida cada propuesta. Hay mucha gente
      que no somos técnicos y tal vez redactamos propuestas sin un lenguaje técnico específico, y pienso
      que habría que conservar ese espíritu.

      Con esto, hemos llegado a un **punto crítico** que amenaza esta fase. La **falta de transparencia**
      en el cribado de propuestas. A nuestro juicio, hemos detectado una **cierta arbitrariedad** con
      la que se ha aplicado este filtro. Por eso consideramos urgente que, antes de proceder a las votaciones
      finales, se estipule un **período de alegaciones** para que las propuestas rechazadas puedan ser
      revisadas y, en su caso, readmitidas. Observamos **situaciones contradictorias**, ya que algunas
      propuestas como la de la **superilla de Abastos**, que ha sido reducida a un mero paso de cebra,
      se les ha aplicado un reajuste extremo para adaptarlas al presupuesto.

      Otras, en cambio, han sido directamente descartadas, sin ofrecerles esa misma posibilidad de reajuste,
      alegando directamente que superan el coste. Se ha permitido a algunas propuestas limitarse a la
      redacción del proyecto técnico para ajustarse al presupuesto, mientras que otras, como las presentadas
      por nuestra asociación, que solicitábamos precisamente y de forma previa solo esa redacción, han
      sido rechazadas. Esto no es una simple contradicción, es una **discriminación en la aplicación de
      las normas**. Un criterio desigual no es un criterio justo. Es esencial que existan unas **normas
      más específicas** del proceso de selección y se apliquen de manera uniforme.

      Pero hay un caso que merece mención aparte y nos preocupa especialmente, que es la propuesta del
      **carril bici en el paseo de la Petxina**. Se rechaza por ser inviable según el contenido de la
      **moción conjunta de criterios de intervención urbanística y de movilidad aprobada el 3 de octubre
      de 2025**. Permítanme que lo diga con claridad, pero o es una casualidad extraordinaria o esta **moción
      se redactó ad hoc** una vez se conocían las propuestas populares de ampliar la red de carriles bici
      con la única finalidad de bloquearlas caprichosamente, alegando que su implantación puede suponer
      una elevada pérdida de plazas de aparcamiento. Esto es **cambiar las reglas del juego** a mitad
      del partido. Aplicar una normativa nueva de manera retroactiva para invalidar la voluntad vecinal
      no es solo injusto, sino una práctica que socava la credibilidad de todo el proceso.

      Por todo ello, señora alcaldesa, nuestras peticiones son claras y concretas. La **apertura inmediata
      de un plazo de alegaciones** para revisar los informes técnicos, la **aplicación estricta de unos
      criterios técnicos uniformes** y bien detallados para las propuestas y, muy especialmente, la **revisión
      de la aplicación de la moción del 3 de octubre**, que consideramos un veto improcedente de la voluntad
      ciudadana. Señora alcaldesa, los **presupuestos participativos** no son un trámite, son una **promesa
      de democracia directa**. Una promesa que se vacía de contenido si no hay reglas claras, transparencia
      en las decisiones y, sobre todo, respeto a la **soberanía del voto vecinal**. Confiamos en que puedan
      rectificar y tomen estas medidas para devolver la credibilidad a un proceso que, en esencia, debe
      pertenecer a la ciudadanía.

      Muchas gracias.'
