- iv_id: 2026-07-23-004
  fields:
    idioma_original: castellano
    text_val: 'Bon dia a totes i a tots.


      Fa quasi dos anys que estem en contacte amb regidors d''este govern. **Presentant-nos projectes**,
      alguns dels quals continuen sent això, projectes. **Anuncis en premsa que no es materialitzen**.
      **Terminis que no es complixen**, un exemple mateix, el barri de Sant Jordi, una promesa de l''alcaldessa
      en el primer Ple de la DANA. Vaja a parlar amb ells ara a veure què li pareix.


      Però no és tot això el que més ens enfada. **Les obres es poden retardar**; els errors administratius
      es poden entendre; les empreses poden fallar. Sempre es poden donar explicacions, cosa que tampoc
      és que siga el vostre fort. El pitjor és que **encara no s''aclaren les circumstàncies d''aquella
      nit del 29 d''octubre**.


      Estem veient amb estupor com **la premsa destapa, dia a dia, una gestió de la catàstrofe nefasta**
      i plena de contradiccions. **Les recents compareixences judicials de la mateixa alcaldessa** davant
      la jutgessa que investiga la DANA i les revelacions als mitjans, ens demostren que **el relat que
      se''ns va vendre estava molt lluny de la realitat**. Cosa que ja sabíem.


      Una realitat que s''ha negat durant mesos. **Greu descoordinació en les emergències**: sabent tot
      el que passava durant el dia amunt als barrancs, no estar prevenits davant qualsevol circumstància
      ja és un error molt greu. **Auxili tardà i insuficient**: no es va mobilitzar a temps la Policia
      Local per a acudir a prestar auxili als municipis veïns arrasats, mentre els propis bombers voluntaris
      van haver de recórrer improvisadament a les llanxes del Club Nàutic per a intentar entrar a La Torre.
      **Falta d''empatia institucional**: la revelació de certs comentaris en grups de WhatsApp en eixa
      nit només ens provoca indignació, només recordant l''angoixa, la por, persones a punt de morir i
      les que ja no estan, és indignant.


      **Tenim dret a saber** exactament què es va fer, què no es va fer i per què. **Volem saber la veritat**.
      Setembre i octubre estan a la volta de la cantonada. Només vos pregunte si creieu que després de
      les actuacions que heu realitzat en estos quasi 2 anys, **estarem tranquils i a salvo en les Pedanies
      del Sud**. Jo no ho estaré, vos ho assegure. I no em vingueu amb el conte, que és cosa del Govern
      central o de la Generalitat. Això ja no cola.


      Moltes gràcies.'
    ambit: barri
    zones:
    - La Torre
    districtes:
    - Poblats del Sud
    resum_cas: La Asociación de Vecinos La Torre denuncia la mala gestión de la DANA, la falta de transparencia
      sobre lo ocurrido el 29 de octubre, la grave descoordinación en las emergencias y la insuficiente
      seguridad en las pedanías del sur.
