- iv_id: 2014-09-26-001
  fields:
    text_val: 'Bon dia, Sra. Alcaldessa. Bé, veig que està absent-. Srs. Regidors, Sres. Regidores de
      la corporació municipal de l''Ajuntament de València.


      L''AMPA del CEIP Eliseo Vidal us recorda que un any més iniciem el curs escolar amb **la promesa
      incomplida de construcció** en el nostre districte de l''institut de secundària compromès fa ja
      **més de set anys, l''IES Nou Patraix**.


      Este centre compromès continua sent tan necessari o més que fa set anys, tant per **reduir la saturació
      de l''IES Juan de Garay, actualment a doble torn**, com per a evitar els desplaçaments a altres
      districtes a la recerca de centres de secundària adscrits. La situació actual del districte **ataca
      el dret fonamental** que tenim els pares i les mares a l''educació, en no complir amb l''oferta
      educativa mínima necessària, i a la **llibertat d''elecció del centre**.


      Després de tots estos anys perduts, actualment **la crisi econòmica acaba per allunyar encara més**
      la construcció del centre públic. En la nostra Comunitat **la crisi ha posat en evidència els anys
      de malbaratament indecent, corrupció i nefasta gestió** dels recursos públics, encara que excel·lent
      dels privats. Senzillament **no hi ha diners** i si l''educació no va ser una prioritat en els anys
      de falsa abundància, amb diners prestats, menys ho és en estos anys de veritable misèria.


      En este context **apareixen els CIS com a solució** a tots els problemes, encara que per a això
      calga **regalar sòl públic municipal a empreses privades** que mai perdran diners en la seua relació
      amb l''Administració, com ja s''ha demostrat amb hospitals o les autopistes. Curiosament, **l''únic
      CIS proposat a València està a Patraix**, a escassos metres del solar destinat originalment a la
      construcció de l''IES Nou Patraix, públic, i es pot dir que a centímetres del CEIP Eliseo Vidal.
      Almenys això ve a demostrar **el que venim denunciant: la necessitat d''un centre de secundària**
      en el districte.


      No obstant això, el CIS proposat va més enllà de les necessitats reals perquè oferta places d''infantil
      i primària, amb l''únic objectiu de **robar clients als centres públics** de la zona convertint
      l''educació en una competició comercial però desequilibrada per falta d''inversió en manteniment
      i renovació dels centres públics.


      L''AMPA del CEIP Eliseo Vidal, igual que moltes altres associacions, **rebutja este model de gestió
      educativa** sense més referent que la competència entre centres, la privatització i la cessió de
      la gestió de l''educació pública a tercers amb interessos purament econòmics en el millor dels casos
      i en altres amb intencions d''adoctrinament ideològic.


      Per això, sol·licitem **la retirada de la cessió de sòl públic municipal educatiu a empreses privades**,
      que **es construïsca urgentment el centre públic IES Nou Patraix** i que **s''invertisca en les
      instal·lacions dels centres educatius** de la zona i de tota València per a dotar-los de les condicions
      mínimes per a rebre una educació de qualitat.'
