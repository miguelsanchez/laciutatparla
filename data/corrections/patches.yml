      mal que recaudamos los impuestos que buenamente quieran declarar. Oiga, que nos lo aclare la concejal
      de Hacienda, que es colega suyo y lo sabrá.

      Las alturas de los humos que ustedes tienen no son **la altura que queremos las vecinas**. Porque
      cuando un gobierno solo hace lo que le sale de las webs de vino, se limita mucho la altura de miras.
