- iv_id: 2020-12-23-001
  fields:
    text_original: Buenas tardes y gracias a todos por darnos esta oportunidad. Vengo en representación
      de los **450 alumnos** que tenemos en la zona de la **Devesa, punto negro**. Necesito que nos visualicen.
      Primer paso, el **Saler, 653 habitantes**. Segundo paso, la **Devesa, 1.118 empadronados**, aunque
      realmente la comunidad es de 1.700 en invierno y de 5.000 en verano. Tercer paso, el **Palmar**.
      Nuestros hijos sin querer porque no han tenido opción están en un **semipresencial** en estos momentos
      y hemos estado como casi todo el mundo o todo el mundo durante la pandemia recluidos en casa. **No
      tenemos acceso a Internet**, no pueden estudiar, no pueden ejercer su derecho a recibir formación,
      **no tenemos acceso a Aules**. Nos crespa los nervios a todas las familias que convivimos en ese
      lugar aunque somos una sociedad o un núcleo social muy pequeño y muy tranquilo, quizás por el ambiente.
      **No tenemos acceso ni a la educación**, ni al teletrabajo, ni a poder hablar con nuestro médico,
      ni a mantener una conversación con nuestros familiares. Somos un **punto negro**, no un punto blanco,
      un punto negro en estos momentos. Nuestros vecinos del Palmar, nuestros vecinos del Saler por fin
      han conseguido tener la **fibra, ha llegado**. En septiembre pudo llegar a sus viviendas. Durante
      todo el mes de mayo, junio, julio y agosto todos estábamos convencidos de que la fibra nos llegaba
      por igual. **Nosotros somos el punto dos**, para el uno y para el tres ha llegado y el dos ha sido
      excluido. Sinceramente no hay derecho que en una situación como esta donde **Internet es la forma
      de contactar**, donde los futuros médicos, futuros abogados, incluso futuros políticos tienen que
      recibir una formación no la estemos recibiendo. No porque los padres no estemos dotando a nuestros
      hijos de todas las herramientas sino porque el **sistema de telecomunicaciones** no es que sea del
      siglo pasado, es que es del milenio pasado. **Trabajamos con ADSL**. A través la fibra no, a través
      de cobre dos puntos que sinceramente no sé lo que es pero creo que es imposible poder mantener una
      conversación, poder pedir una cita, poder hacer el registro, poder ver el banco. Estamos aquí porque
      **necesitamos su ayuda** porque ustedes son **la administración más cercana** a nosotros, porque
      se lo hemos pedido ya a todo el mundo, a **Conselleria de Educación**, a los ministerios, am Telefónica.
      Y porque realmente lo necesitamos. No les robo más tiempo, les agradezco que me permitan hablar
      y feliz Navidad.
