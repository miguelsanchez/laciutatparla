      el que se suposa que fa la **participació**, definir quin és l''interés general. **València es guanya
      a si mateixa** amb la participació. Mire, guanya tant en termes constitucionals com en atractiu
      turístic, que pareix ser el que li preocupa a vostés.

      **L''associacionisme veïnal** ens va donar el **Jardín del Turia**, on vostés volien una autopista.
