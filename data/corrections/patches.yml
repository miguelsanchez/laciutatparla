  fields:
    text_original: '**Bona vesprada**. Tenia preparat bon dia però s''ha allargat la cosa, pues ho canviem
      a bona vesprada.

      Em diuen **Pepa Ferrero Tomàs**. Sóc néta de **Julio Tomàs Codina**, un llaurador de la **Pobla
      Llarga**, de la comarca de la **Ribera Alta**, que va morir a **Gusen**, un **camp de concentració**
      annex a Mathausen, un **28 de novembre** a les 6 del matí en les dutxes fredes. El meu uelo es va
      d’haver exiliar quan **Franco va guanyar** la guerra gràcies a l''ajuda de la **Itàlia de Mussolini**
      i l''**Alemanya de Hitler**. Va estar internat als camps del sud de França, igual com milers de
      valencians i espanyols, inclòs dones i xiquets i ancians. Després de ser detingut pel règim de Hitler
      a França i deportat a Mathausen, el van traslladar a Gusen, un **camp de no retorn**, i allí va
      morir poc després.

      Així podríem resumir la història d''altres **9.000 espanyols** i més de **650 valencians** que els
      va tocar viure la **Guerra d''Espanya** i després la **II Guerra Mundial**, que va causar més de
      **50 milions de morts** a tot lo món. Mentres Hitler pretenia dominar Europa, a Espanya es van viure
      anys de por i de silenci, silenci per part d''aquells que un dia es van atrevir a tindre un somni,
      el de construir un país més just i més democràtic. Mai, mai no van voler la guerra ni la van voler
      provocar. Per a la meua uela i la meua família la **postguerra i la dictadura** van ser anys d''incertesa
      i de penúries. A la meua germana i a mi ens va costar molts anys saber què havia sigut del nostre
      uelo i gràcies a la perseverància d''un investigador de la Pobla Llarga, **Ximo Vidal**, al qual
      sempre li estarem agraïdes, vàrem trobar a Julio Tomàs Codina. Poc després vam viatjar fins a Gusen,
      en Àustria, amb l''**Amical de Mauthausen**, associació que sempre tindrà la nostra gratitud, en
      els **forns crematoris de Gusen** vàrem poder homenatjar per fi el meu uelo i despedir-lo d''ell
      perquè sàpiga que mai l''oblidarem. No oblidem ni a ells ni als milions de víctimes de la irracionalitat
      i de la perversió humana. **Víctimes de la intolerància, del racisme i de la homofòbia**. Perquè
      l''oblit és el pitjor dels càstigs i oblidar ens convertix en còmplices d''aquell horror.

      Com a descendent d''una víctima del **franquisme i del nazisme** vull donar les gràcies a la **Fundació
      Assemblea de Ciutadans** i Ciutadanes del Mediterrani, que hui em dona l''oportunitat de participar
      en este ple i donar veu a tantes persones indignades amb les paraules del **regidor de Vox**. Este
      representant del govern municipal **blanqueja i normalitza el nazisme** confonent a la ciutadania
      amb una expressió que fa referència al fet de pensar. No es riga, senyor Badenas, perquè açò no
      fa gràcia. De tot, menos gràcia. **Pensar no és delicte** com bé sap qualsevol jurista, però l''**expressió
      pública del pensament** sí que ho és. I tant. La intenció clara de vosté és legitimar i donar una
      aparença de legalitat a allò que és realment **apologia del nazisme** i iniciar [ incitar] a l''**odi**
      sí que està penat. Però vostés es senten orgullosos que els seus seguidors es manifesten públicament
      amb símbols democràtics [sic] i anticonstitucionals. El representant de Vox té els coneixements
      acadèmics suficients per a intentar crear confusió entre els ciutadans, però els coneixements no
      equivalen sempre a saviesa. És cert que amb el pensament no es delinquix, però, com deia el savi,
      cuida els teus pensaments perquè amb ells construïxes els teus actes, cuida els teus actes perquè
      amb ells construïxes la teua vida. No permetrem que el representant de Vox ofenga la nostra intel·ligència
      en allò que és una falta greu de respecte a les víctimes i als **drets humans més elementals**.
      Les necessàries **lleis de memòria democràtica** a Espanya que reconeixen les víctimes de la **Guerra
      Civil i el franquisme** no els agraden, ho sabem. I no els agraden, perquè encara enyoren els temps
      del franquisme, d''una supèrbia ultramuntana que és **classista, elitista i profundament antidemocràtica**.
      Lamentem que polítics d''esta catadura moral ocupen un lloc públic i lamentem que la senyora alcaldessa,
      que a pesar de dir que no compartix estes declaracions, haja sigut ostatge d''un partit el qual
      necessita per a governar. És un preu molt alt el que tens, el que fan pagar als ciutadans.

      A pesar de la involució històrica que vivim, han de saber vostés que les víctimes del nazisme, el
      feixisme i el franquisme no són ni seran víctimes de l''oblit. Així pensem nosaltres. Perquè l''oblit
      serà el pitjor dels càstigs. Com a **societat civil** seguirem honorant-los i recordant-los. I ho
      farem pel camí de la pau, del reconeixement i de la gratitud. Perquè un dia ells van donar la vida
      per la democràcia que hui disfruten tots vostés, vostés també. Aixina pensem nosaltres. I gràcies
      a esta democràcia, vostés poden manifestar-se als carrers sense que un règim dictatorial els coarte
      la llibertat de fer-ho, a pesar de l''exaltació de la violència que fan cada dia i que observem
      amb estupefacció.

      Acabe ja. Per a nosaltres no participem en este joc perquè seguirem apostant per una societat més
      democràtica, més plural i més respectuosa. Quina pena, senyor Badenas, quina pena em fa que n''hi
      haja tanta gent que pense com vosté. Quina pena.

      Eixa és la nostra opinió i el nostre pesar.

      Moltes gràcies.'
    text_cas: '**Buenas tardes**. Tenía preparado buen día, pero la cosa se ha alargado, pues lo cambiamos
      a buenas tardes.

      Me llaman **Pepa Ferrero Tomàs**. Soy nieta de **Julio Tomàs Codina**, un labrador de la **Pobla
      Llarga**, de la comarca de la **Ribera Alta**, que murió en **Gusen**, un **campo de concentración**
      anexo a Mauthausen, un **28 de noviembre** a las 6 de la mañana en las duchas frías. Mi abuelo tuvo
      que exiliarse cuando **Franco ganó** la guerra gracias a la ayuda de la **Italia de Mussolini**
      y la **Alemania de Hitler**. Estuvo internado en los campos del sur de Francia, igual que miles
      de valencianos y españoles, incluidos mujeres, niños y ancianos. Después de ser detenido por el
      régimen de Hitler en Francia y deportado a Mauthausen, lo trasladaron a Gusen, un **campo de no
      retorno**, y allí murió poco después.

      Así podríamos resumir la historia de otros **9.000 españoles** y más de **650 valencianos** a los
      que les tocó vivir la **Guerra de España** y después la **II Guerra Mundial**, que causó más de
      **50 millones de muertos** en todo el mundo. Mientras Hitler pretendía dominar Europa, en España
      se vivieron años de miedo y de silencio, silencio por parte de aquellos que un día se atrevieron
      a tener un sueño, el de construir un país más justo y más democrático. Nunca, nunca quisieron la
      guerra ni la provocaron. Para mi abuelo y mi familia la **posguerra y la dictadura** fueron años
      de incertidumbre y de penurias. A mi hermana y a mí nos costó muchos años saber qué había sido de
      nuestro abuelo y gracias a la perseverancia de un investigador de la Pobla Llarga, **Ximo Vidal**,
      al que siempre le estaremos agradecidas, encontramos a Julio Tomàs Codina. Poco después viajamos
      hasta Gusen, en Austria, con la **Amical de Mauthausen**, asociación que siempre tendrá nuestra
      gratitud, y en los **hornos crematorios de Gusen** pudimos homenajear por fin a mi abuelo y despedirlo
      para que sepa que nunca lo olvidaremos. No olvidamos ni a ellos ni a los millones de víctimas de
      la irracionalidad y de la perversión humana. **Víctimas de la intolerancia, del racismo y de la
      homofobia**. Porque el olvido es el peor de los castigos y olvidar nos convierte en cómplices de
      aquel horror.

      Como descendiente de una víctima del **franquismo y del nazismo** quiero dar las gracias a la **Fundación
      Asamblea de Ciudadanos** y Ciudadanas del Mediterráneo, que hoy me da la oportunidad de participar
      en este pleno y dar voz a tantas personas indignadas con las palabras del **concejal de Vox**. Este
      representante del gobierno municipal **blanquea y normaliza el nazismo** confundiendo a la ciudadanía
      con una expresión que hace referencia al hecho de pensar. No se ría, señor Badenas, porque esto
      no tiene gracia. Para nada, menos gracia. **Pensar no es delito** como bien sabe cualquier jurista,
      pero la **expresión pública del pensamiento** sí que lo es. Y tanto. La intención clara de usted
      es legitimar y dar una apariencia de legalidad a lo que es realmente **apología del nazismo** e
      iniciar [incitar] al **odio** sí que está penado. Pero ustedes se sienten orgullosos de que sus
      seguidores se manifiesten públicamente con símbolos democráticos [sic] y anticonstitucionales. El
      representante de Vox tiene los conocimientos académicos suficientes para intentar crear confusión
      entre los ciudadanos, pero los conocimientos no equivalen siempre a sabiduría. Es cierto que con
      el pensamiento no se delinque, pero, como decía el sabio, cuida tus pensamientos porque con ellos
      construyes tus actos, cuida tus actos porque con ellos construyes tu vida. No permitiremos que el
      representante de Vox ofenda nuestra inteligencia en lo que es una falta grave de respeto a las víctimas
      y a los **derechos humanos más elementales**. Las necesarias **leyes de memoria democrática** en
      España que reconocen a las víctimas de la **Guerra Civil y el franquismo** no les gustan, lo sabemos.
      Y no les gustan, porque todavía añoran los tiempos del franquismo, de una soberbia ultramontana
      que es **clasista, elitista y profundamente antidemocrática**. Lamentamos que políticos de esta
      catadura moral ocupen un cargo público y lamentamos que la señora alcaldesa, que a pesar de decir
      que no comparte estas declaraciones, haya sido rehén de un partido al que necesita para gobernar.
      Es un precio muy alto el que tiene, el que hacen pagar a los ciudadanos.

      A pesar de la involución histórica que vivimos, deben saber ustedes que las víctimas del nazismo,
      el fascismo y el franquismo no son ni serán víctimas del olvido. Así pensamos nosotros. Porque el
      olvido será el peor de los castigos. Como **sociedad civil** seguiremos honrándolos y recordándolos.
      Y lo haremos por el camino de la paz, del reconocimiento y de la gratitud. Porque un día ellos dieron
      la vida por la democracia que hoy disfrutan todos ustedes, ustedes también. Así pensamos nosotros.
      Y gracias a esta democracia, ustedes pueden manifestarse en las calles sin que un régimen dictatorial
      les coarte la libertad de hacerlo, a pesar de la exaltación de la violencia que hacen cada día y
      que observamos con estupefacción.

      Termino ya. Para nosotros no participamos en este juego porque seguiremos apostando por una sociedad
      más democrática, más plural y más respetuosa. Qué pena, señor Badenas, qué pena me da que haya tanta
      gente que piense como usted. Qué pena.

      Esa es nuestra opinión y nuestro pesar.

      Muchas gracias.'
