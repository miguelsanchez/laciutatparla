- iv_id: 2024-09-25-006
  fields:
    intervinient: Beatriu Cardona Prats i Elida Puig Cebolla
    text_original: '**Bon dia** a totes i a tots.

      Alcaldessa, **no fa ni tan sols una setmana** en el Ple del debat sobre **l''estat de la ciutat**,
      **Intersindical Valenciana**, en nom de la **Coordinadora Feminista de València**, denunciàrem els
      **greus retrocessos** que estem patint en matèria d''**igualtat** des de que vosté governa. La intervenció
      va ser **interrompuda** uns minuts perquè el seu segon tinent d''alcalde, **Juanma Badenas**, ens
      va increpar des del seu lloc de privilegi que ostenta gràcies a vosté, alcaldessa. Així i tot, no
      ens va poder fer callar i vam acabar el nostre discurs. Hui de nou tornem a estar ací per a poder
      dir ben fort i ben clar el que pensem, sense **censures**, fent ús de la **llibertat**, amb majúscules,
      que tant pregonen **PP i Vox** i que tan poquet deixen practicar a qui no pensa com vostés.

      Precisament d’açò va la **moció presentada pel Grup Municipal de Compromís** i per això li demanem,
      alcaldessa, que siga **valenta** i que vosté i el seu grup la voten a favor. En ella es relata el
      que va ocórrer per a vergonya de qui ho va permetre i s''exigix la necessària **reparació** per
      complir i fer complir els valors democràtics més elementals. **Aquest ajuntament ha de demanar disculpes**
      immediatament a **València Acull** i a la **Coordinadora Feminista de València**, les dos entitats
      que vam ser increpades pel segon tinent d''alcalde, Juanma Badenas, qui va **vulnerar el dret a
      la llibertat d''expressió** i ens va proferir **amenaces** en un intent inútil d''intimidar-nos.
      És més, alcaldessa, vosté ha d''entendre que ha de **cessar de la seua responsabilitat** de govern
      a persones que actuen com si encara visqueren en cavernes, que tenen comportaments d’**assetjadors**
      de manual, que són **extremistes** i que en les seues files compartixen espais amb **agressors condemnats**.
      Extremistes que utilitzen les xarxes, com la **regidora Herrero**, per llançar els seus missatges
      **racistes i d''odi** en un intent de dinamitar la convivència als nostres barris. Extremistes com
      el **síndic Llanos**, que vol que deixem en desempar a **xiquets i xiquetes** que han vingut a la
      nostra terra fugint de la pobresa o de la guerra.

      I agressors condemnats que pretenen continuar exercint **violència contra les dones**, però des
      de les tribunes, des de les tertúlies o des dels premis literaris. Perquè la goteta ha sigut ja
      quan hem conegut per la premsa que un dels finalistes del **certamen de relats per la igualtat Beatriu
      Civera** era el diputat de Vox **Carlos Flores Juberías**, **condemnat per maltractar** a la seua
      exdona utilitzant **violència psicològica**. Però quina broma és esta? Açò és un **insult** i atempta
      contra la dignitat de totes les dones. Vosté inclosa, alcaldessa. I sobretot, atempta contra la
      dignitat de les **víctimes de violència de gènere**. Si fora conseqüent amb algunes de les coses
      que diu, **declararia la nul·litat de les actes** que han proclamat finalista a este home. El fet
      que un condemnat per **violència masclista** siga considerat per un certamen que hauria de promoure
      el respecte i la dignitat de les dones és una mostra clara de la desconnexió amb la realitat social.
      Amb fets com aquestos confirmem amb consternació que a la **ciutat de València** s''està **institucionalitzant
      el masclisme, el feixisme i el racisme**. I vostés, **PP i Vox**, pretenen esborrar del mapa a qui
      ho denunciem.

      Per la nostra part, **Intersindical Valenciana**, com a integrants dels **moviments socials** de
      la ciutat i del país, no podem, ni volem, ni serem **silenciades** davant de cap intent de censura
      o retrocés. Continuarem **denunciant els abusos** i la injustícia, i exigirem responsabilitats a
      qui des de les institucions pren decisions contràries als **drets humans**. La **democràcia** no
      es predica sinó que s''ha de practicar cada dia i des de tots els àmbits. I amb el **feixisme**,
      alcaldessa, no es col·labora, perquè qui legitima i l’inclou els equips de govern està també contribuint
      al feixisme. **Fa més de 87 anys** l''**aviació italiana**, per ordres del **colpista Franco**,
      va **bombardejar aquest edifici**, impactant en aquesta mateixa **Sala de Plens**. No permeta, alcaldessa,
      que un partit hereu d''aquella ideologia continue al seu equip de govern.

      Amb aquesta força i determinació, la nostra veu no només es farà sentir, sinó que seguirà contribuint
      a transformar el món des de la nostra ciutat, malgrat els obstacles que ens puguem trobar. No tornarem
      a un silenci antic i molt llarg. Les feministes seguim i seguirem al vent del món.'
    text_cas: '**Buenos días** a todas y a todos.

      Alcaldesa, **hace ni una semana** en el Pleno del debate sobre **el estado de la ciudad**, **Intersindical
      Valenciana**, en nombre de la **Coordinadora Feminista de València**, denunciamos los **graves retrocesos**
      que estamos sufriendo en materia de **igualdad** desde que usted gobierna. La intervención fue **interrumpida**
      unos minutos porque su segundo teniente de alcalde, **Juanma Badenas**, nos increpó desde su lugar
      de privilegio que ostenta gracias a usted, alcaldesa. Aun así, no nos pudo hacer callar y terminamos
      nuestro discurso. Hoy de nuevo volvemos a estar aquí para poder decir bien alto y bien claro lo
      que pensamos, sin **censuras**, haciendo uso de la **libertad**, con mayúsculas, que tanto pregonan
      **PP y Vox** y que tan poco dejan practicar a quien no piensa como ustedes.

      Precisamente de eso trata la **moción presentada por el Grupo Municipal de Compromís** y por eso
      le pedimos, alcaldesa, que sea **valiente** y que usted y su grupo la voten a favor. En ella se
      relata lo que ocurrió para vergüenza de quien lo permitió y se exige la necesaria **reparación**
      para cumplir y hacer cumplir los valores democráticos más elementales. **Este ayuntamiento debe
      pedir disculpas** inmediatamente a **València Acull** y a la **Coordinadora Feminista de València**,
      las dos entidades que fuimos increpadas por el segundo teniente de alcalde, Juanma Badenas, quien
      **vulneró el derecho a la libertad de expresión** y nos profirió **amenazas** en un intento inútil
      de intimidarnos. Es más, alcaldesa, usted debe entender que debe **cesar de su responsabilidad**
      de gobierno a personas que actúan como si todavía vivieran en cavernas, que tienen comportamientos
      de **acosadores** de manual, que son **extremistas** y que en sus filas comparten espacios con **agresores
      condenados**. Extremistas que utilizan las redes, como la **concejala Herrero**, para lanzar sus
      mensajes **racistas y de odio** en un intento de dinamitar la convivencia en nuestros barrios. Extremistas
      como el **síndic Llanos**, que quiere que dejemos en desamparo a **niños y niñas** que han venido
      a nuestra tierra huyendo de la pobreza o de la guerra.

      Y agresores condenados que pretenden seguir ejerciendo **violencia contra las mujeres**, pero desde
      las tribunas, desde las tertulias o desde los premios literarios. Porque la gota ha sido ya cuando
      hemos conocido por la prensa que uno de los finalistas del **certamen de relatos por la igualdad
      Beatriu Civera** era el diputado de Vox **Carlos Flores Juberías**, **condenado por maltratar**
      a su exmujer utilizando **violencia psicológica**. ¿Pero qué broma es esta? Esto es un **insulto**
      y atenta contra la dignidad de todas las mujeres. Usted incluida, alcaldesa. Y sobre todo, atenta
      contra la dignidad de las **víctimas de violencia de género**. Si fuera coherente con algunas de
      las cosas que dice, **declararía la nulidad de las actas** que han proclamado finalista a este hombre.
      El hecho de que un condenado por **violencia machista** sea considerado por un certamen que debería
      promover el respeto y la dignidad de las mujeres es una muestra clara de la desconexión con la realidad
      social. Con hechos como estos confirmamos con consternación que en la **ciudad de València** se
      está **institucionalizando el machismo, el fascismo y el racismo**. Y ustedes, **PP y Vox**, pretenden
      borrar del mapa a quienes lo denunciamos.

      Por nuestra parte, **Intersindical Valenciana**, como integrantes de los **movimientos sociales**
      de la ciudad y del país, no podemos, ni queremos, ni seremos **silenciadas** ante ningún intento
      de censura o retroceso. Continuaremos **denunciando los abusos** y la injusticia, y exigiremos responsabilidades
      a quienes desde las instituciones toman decisiones contrarias a los **derechos humanos**. La **democracia**
      no se predica sino que se debe practicar cada día y desde todos los ámbitos. Y con el **fascismo**,
      alcaldesa, no se colabora, porque quien legitima e incluye en los equipos de gobierno está también
      contribuyendo al fascismo. **Hace más de 87 años** la **aviación italiana**, por órdenes del **golpista
      Franco**, **bombardeó este edificio**, impactando en esta misma **Sala de Plenos**. No permita,
      alcaldesa, que un partido heredero de aquella ideología continúe en su equipo de gobierno.

      Con esta fuerza y determinación, nuestra voz no solo se hará oír, sino que seguirá contribuyendo
      a transformar el mundo desde nuestra ciudad, a pesar de los obstáculos que nos podamos encontrar.
      No volveremos a un silencio antiguo y muy largo. Las feministas seguimos y seguiremos al viento
      del mundo.'
  reason: 'Acta: Sra. Cardona and Sra. Puig share the turn; text_original omitted Sra. Puig''s part.'
