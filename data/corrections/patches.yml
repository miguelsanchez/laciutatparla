  fields:
    text_val: 'Bon dia, alcaldessa, regidors.


      La nova compareixença de l''Associació per una Hostaleria dels Barris de València, en el marc del
      debat sobre la **ZAS de Ruzafa** i sobre la presentació del **recurs de reposició** en el qual l''Associació
      Empresarial sol·licitava la **suspensió d''aquestes mesures** fins que es responguera el fons de
      la qüestió, és a dir, fins que s''aborde una resposta a les propostes realitzades per al sector,
      per a les pimes, per als treballadors i també per a una part molt important dels veïns del barri,
      és una oportunitat, una oportunitat derivada de la presentació del recurs de reposició i de l''**obertura
      d''un nou període d''exposició pública**, la qual cosa ens porta dos mesos després de nou ací al
      ple per part de la Regidoria de Millora Climàtica, una obertura d''un període d''exposició pública
      que valorem positivament perquè en definitiva, el que ens permet és continuar aprofundint en un
      debat que necessita una **revisió integral, un canvi de model**.


      Un **canvi de model** que té i que compromet el conjunt dels partits polítics per a aprofundir en
      la reflexió sobre el debat sobre el **soroll que ara mateix té acorralada la ciutat de València**
      i amb molts fronts, per desgràcia, oberts, sense solució i que probablement, si no adoptem decisions
      valentes que ens permeten abordar eixe canvi de model, cada vegada ens complicaran més l''activitat
      econòmica, l''activitat social, l''activitat turística, cultural, quan no, el ridícul més espantós
      com el que du fent durant l''últim mes la ciutat de València a nivell internacional.


      Una reflexió, a més, que té un **suport social molt important**. En tot just deu dies, amb el que
      això suposa en termes de mobilització de la societat civil, un termini molt, molt contingut, -també
      entenem les limitacions del termini per a presentar al·legacions- s''ha trobat amb **dues-centes
      setanta-vuit al·legacions presentades**. De les quals **cent vint són específicament de residents
      del barri de Ruzafa**, la qual cosa ens sembla una xifra notable, clarament insuficient, però en
      deu dies crec que ens legitima en termes de tornar a reiterar la nostra demanda, de tal manera que
      la possibilitat d''analitzar amb profunditat, de plantejar la revisió de les mesures plantejades
      en la ZAS de Ruzafa, no ja només la suspensió, que evidentment el que pretén és guanyar temps per
      a aprofundir en el debat social, polític i mediàtic que està tenint lloc en paral·lel al que són
      les decisions purament polítiques i administratives, i que en definitiva, ens ha de permetre iniciar
      eixa etapa.


      Quines són les claus? Les claus, més enllà del conflicte que es planteja a Ruzafa, tenen que veure
      amb allò de la **defensa de la intimitat, de la qualitat de vida, de la salut** dels ciutadans.
      En efecte, el **soroll, la contaminació acústica**, està sobradament demostrat que tenen una afecció
      sobre la salut, i molts altres factors de contaminació que es produeixen en la gran ciutat, però
      ha arribat el moment de reclamar que **tots som veïns. No hi ha veïns de primera i de segona**.


      Com pot ser que **la principal causa del soroll en totes les societats** o en totes les ciutats
      dels països desenvolupats, com és el trànsit o com són les obres. Sí un soroll que afecta la salut,
      perquè en el moment que se superen els objectius de qualitat acústica afecta la salut dels ciutadans,
      però no obstant això, el **soroll que afecta al 60% de la població, a més de 500.000 valencians**,
      es menysprea del debat, se suprimeix de la decisió.


      Ara mateix un debat que torna a la llum perquè després de 35 anys es farà un **asfaltat fonoabsorbent
      aïllant de la Gran Via, 35 anys després**. Amb la qual cosa el debat sobre el soroll és un debat
      d''una complexitat que els partits polítics han d''assumir en primer lloc i han de liderar. I els
      que estan al govern, evidentment, assumint el lideratge que els correspon i en este cas per part
      del Partit Popular i del suport de VOX.


      En eixe context, l''**històric assetjament permanent** sobre una activitat econòmica social que
      afecta el 5% de la població i que permet que a les activitats que desenvolupen la seua activitat
      reglada se''ls puguen restringir els drets, per a nosaltres és una **cortina de fum** perquè evidentment
      gastar diners, milions d''euros com fa falta en el famós asfalt fonoabsorbent, resulta més car que
      aprovar en els despatxos **zones acústiques saturades, una darrere de l''altra**.


      Per altra banda, resulta necessari reflexionar sobre els **objectius de qualitat acústica**. Per
      què en el 2002, amb el govern del Partit Popular de José María Aznar al Govern de la Nació, s''aprova
      la **Llei del Soroll, la Llei de Contaminació Acústica** que a més és fruit de la transposició de
      les directrius de la Unió Europea i establix uns objectius de qualitat acústica de 50 decibels nocturns,
      de soroll ambiental. Per què de manera arbitrària, puríssimament política i electoralista, es reduïxen
      cinc decibels en el cas de l''Ajuntament de València i de la Generalitat Valenciana en aquells anys.


      Simplement, cal **revisar els criteris**.


      I necessitem que **no fem el ridícul amb els festivals musicals**. No utilitzem permanentment l''excepcionalitat
      per a salvar les verbenes de les Falles, que l''únic que provoquen és l''enfrontament entre els
      col·lectius socials, quan en canvi, estem en un moment d''**unitat, de diàleg**, com no havia tingut
      mai la ciutat de València i particularment Ruzafa.'
