  fields:
    text_original: 'Hola, molt bona tarda.

      Bé, com ja saben, aquest dissabte hem hagut de patir una altra vegada un **tràgic succés**.

      Una **nova víctima mortal humana** després de ser atrapats per un bou a les **festes de la Pobla
      de Farnals**. Segurament, ja ho saben. Cocinero va ferir a dues persones de manera esfereïdora res
      més sortir del calaix, els va envestir contra els barrots d''una casa que estaven dins del recorregut.
      Un d''ells, de **62 anys**, va morir per **quatre ferides per banya de bou**, una d''elles en el
      costat que va afectar el pulmó i el fetge. Saben que el nom de la **Pobla de Farnals va circular
      aquest diumenge per la premsa internacional**? Des de la **CNN del Brasil** fins a un dels periòdics
      anglesos més importants, el **The Independent**, passant per Berita Harin, un important periòdic
      de Malàisia, el Dagsavisen, un dels principals periòdics d''**Oslo, de Noruega**, el Novinky, un
      dels llocs webs de notícies més visitats de la **República Txeca**, i molts més. La Pobla de Farnals
      s’ha donat a conèixer al món per un **tràgic accident**, encara que crec que hauríem de deixar d''anomenar-ho
      accident perquè **cada any moren persones i centenars de persones resulten greument ferides**. De
      fet, els ajuntaments i les penyes taurines, ja ho saben, paguen assegurances per a cobrir aquest
      tipus de conseqüències. És a dir, que **està previst**. I per cert, algú sap quantes persones de
      totes aquestes que acaben greument ferides acaben **paraplègiques per a tota la vida**? No ho saben,
      no ho sabrem mai perquè **no hi ha registres oficials**. Tampoc existeix registre de quants bous
      moren accidentalment, per cert. Així que hi ha molta informació que desconeixem, però amb la que
      tenim hauria de ser suficient per replantejar-nos coses.

      La veritat és que no existeix a Espanya cap cap altra activitat finançada pels ajuntaments que generi
      **milers de persones ferides i fins i tot morts**, com ho fan les **festes taurines**. No existeix
      res igual que se li assembli. Reconeixin, almenys, que és, com a mínim, inquietant. Així que avui
      València té de nou l''oportunitat d''evitar que qualsevol dia aparegui en els mitjans de comunicació
      internacionals no per les Falles o perquè s''hagi convertit en la millor ciutat per viure a nivell
      mundial, sinó perquè una altra persona hagi mort embestida per un bou durant les seves festes. València
      té de nou l''oportunitat de demostrar que vol continuar sent una **ciutat amable i més humana**.
      Diuen que el **primer signe d''humanitat** de la nostra civilització no va ser el foc, ni la pedra
      de moldre o la roda. Diuen que el primer signe de civilització de la humanitat va ser un **fèmur
      fracturat i sanat**. Així que el que ens diferenciava de manera inqüestionable amb la resta d''animals
      va ser aquella **voluntat de cuidar**, la voluntat d''evitar el sofriment, de fer el món una mica
      més amable per tothom, la voluntat d''intentar fer el bé. I treure un animal del cap, ficar-lo en
      un camió, deixar-lo durant hores ficats dins d''un calaix, soltar-lo davant d''una torba de persones,
      la majoria homes, per cert, amb ganes d’emoció i d''adrenalina, amb l''alcohol, amb **molt d''alcohol
      a la sang**, crits, estirades de cua, puntades a peu, llançament d''objectes, de sorra, provocacions,
      per no parlar de quan se li capgira al cap amb cordes per a sotmetre-ho a la voluntat dels participants.
      En el **bou en corda** si el bou envesteix, frenada en sec. Si es queda quiet per esgotament o col·lapsat
      per la por, és estironat i a vegades quasi arrossegat pels carrers. En el **bou embolat**, immobilitzat
      mitjançant la força bruta de 20 homes sense més aspiració en la vida que la de demostrar que són
      capaços de sotmetre un animal espantat.

      Aquests costums solament reflecteixen el més mesquí de la nostra espècie. I clar que va molta gent
      a veure i a gaudir dels bous al carrer, i tant que sí, perquè som capaços del millor, però també
      del pitjor. Perquè el que també ens fa humans és que tenim la possibilitat de fer el bé racionalment
      i de manera premeditada decidim fer el mal. Alguns per ignorància, per pur egoisme, uns altres per
      interessos econòmics i altres per no perdre vots. I aquí és on volia arribar i amb això ja acabo.
      Em permetran que em dirigeixi únicament al **PSPV** perquè el **Partit Popular i Vox** doncs ja
      esteu venuts amb aquest tema, hem vist la pressa que heu tingut per tirar enrere el progrés d''aquesta
      ciutat, així que els demano que donin suport a aquesta **moció de Compromís** perquè **València
      continuï sent una ciutat** que intenta ser cada dia una miqueta millor, més civilitzada, més empàtica
      amb les persones i més respectuosa amb els animals. Em dirigeixo al PSPV perquè és un partit, com
      en el PSOE, on coexisteixen dues ànimes davant d''aquest tema. La progressista, la que vol que els
      costums i tradicions del nostre país evolucionin i deixin de dependre del **maltractament als animals**.
      I la conservadora i la que té por. Por al futur, por a la sensibilitat de les noves generacions,
      por de perdre privilegis o por de perdre el poder dels uns sobre els altres.

      Res més. Amb això ja acabo. Si us plau, no tingueu por, **Partit Socialista**, i no claudiqueu davant
      de la **tirania de la indiferència**.

      Moltes gràcies.'
    text_cas: 'Hola, muy buenas tardes.

      Bueno, como ya saben, este sábado hemos tenido que sufrir otra vez un **trágico suceso**.

      Una **nueva víctima mortal humana** tras ser atrapados por un toro en las **fiestas de la Pobla
      de Farnals**. Seguramente, ya lo saben. Cocinero hirió a dos personas de manera espeluznante nada
      más salir del chiquero, las arrolló contra los barrotes de una casa que estaban dentro del recorrido.
      Uno de ellos, de **62 años**, murió por **cuatro heridas por cornada de toro**, una de ellas en
      el costado que afectó al pulmón y al hígado. ¿Saben que el nombre de la **Pobla de Farnals circuló
      este domingo por la prensa internacional**? Desde la **CNN de Brasil** hasta uno de los periódicos
      ingleses más importantes, el **The Independent**, pasando por Berita Harian, un importante periódico
      de Malasia, el Dagsavisen, uno de los principales periódicos de **Oslo, en Noruega**, el Novinky,
      uno de los sitios web de noticias más visitados de la **República Checa**, y muchos más. La Pobla
      de Farnals se ha dado a conocer al mundo por un **trágico accidente**, aunque creo que deberíamos
      dejar de llamarlo accidente porque **cada año mueren personas y cientos de personas resultan gravemente
      heridas**. De hecho, los ayuntamientos y las peñas taurinas, ya lo saben, pagan seguros para cubrir
      este tipo de consecuencias. Es decir, que **está previsto**. Y por cierto, ¿alguien sabe cuántas
      personas de todas estas que acaban gravemente heridas acaban **paraplégicas de por vida**? No lo
      saben, no lo sabremos nunca porque **no hay registros oficiales**. Tampoco existe registro de cuántos
      toros mueren accidentalmente, por cierto. Así que hay mucha información que desconocemos, pero con
      la que tenemos debería ser suficiente para replantearnos cosas.

      La verdad es que no existe en España ninguna otra actividad financiada por los ayuntamientos que
      genere **miles de personas heridas e incluso muertos**, como lo hacen las **fiestas taurinas**.
      No existe nada igual que se le parezca. Reconozcan, al menos, que es, como mínimo, inquietante.
      Así que hoy València tiene de nuevo la oportunidad de evitar que cualquier día aparezca en los medios
      de comunicación internacionales no por las Fallas o porque se haya convertido en la mejor ciudad
      para vivir a nivel mundial, sino porque otra persona haya muerto embestida por un toro durante sus
      fiestas. València tiene de nuevo la oportunidad de demostrar que quiere seguir siendo una **ciudad
      amable y más humana**. Dicen que la **primera señal de humanidad** de nuestra civilización no fue
      el fuego, ni la piedra de moler o la rueda. Dicen que la primera señal de civilización de la humanidad
      fue un **fémur fracturado y curado**. Así que lo que nos diferenciaba de manera incuestionable del
      resto de animales fue aquella **voluntad de cuidar**, la voluntad de evitar el sufrimiento, de hacer
      el mundo un poco más amable para todos, la voluntad de intentar hacer el bien. Y sacar un animal
      de la cabeza, meterlo en un camión, dejarlo durante horas encerrado en un cajón, soltarlo ante una
      multitud de personas, la mayoría hombres, por cierto, con ganas de emoción y adrenalina, con el
      alcohol, con **mucho alcohol en la sangre**, gritos, tirones de cola, patadas, lanzamiento de objetos,
      de arena, provocaciones, por no hablar de cuando se le atan la cabeza con cuerdas para someterlo
      a la voluntad de los participantes. En el **toro de cuerda**, si el toro embiste, frenada en seco.
      Si se queda quieto por agotamiento o colapsado por el miedo, es arrastrado y a veces casi arrastrado
      por las calles. En el **toro embolado**, inmovilizado mediante la fuerza bruta de 20 hombres sin
      más aspiración en la vida que la de demostrar que son capaces de someter a un animal asustado.

      Estas costumbres solo reflejan lo más mezquino de nuestra especie. Y claro que va mucha gente a
      ver y a disfrutar de los toros en la calle, y tanto que sí, porque somos capaces de lo mejor, pero
      también de lo peor. Porque lo que también nos hace humanos es que tenemos la posibilidad de hacer
      el bien racionalmente y de manera premeditada decidimos hacer el mal. Algunos por ignorancia, por
      puro egoísmo, otros por intereses económicos y otros por no perder votos. Y aquí es donde quería
      llegar y con esto ya termino. Me permitirán que me dirija únicamente al **PSPV** porque el **Partido
      Popular y Vox** pues ya estáis vendidos con este tema, hemos visto la prisa que habéis tenido por
      tirar atrás el progreso de esta ciudad, así que les pido que den apoyo a esta **moción de Compromís**
      para que **València siga siendo una ciudad** que intenta ser cada día un poquito mejor, más civilizada,
      más empática con las personas y más respetuosa con los animales. Me dirijo al PSPV porque es un
      partido, como en el PSOE, donde coexisten dos almas ante este tema. La progresista, la que quiere
      que las costumbres y tradiciones de nuestro país evolucionen y dejen de depender del **maltrato
      a los animales**. Y la conservadora y la que tiene miedo. Miedo al futuro, miedo a la sensibilidad
      de las nuevas generaciones, miedo a perder privilegios o miedo a perder el poder de unos sobre otros.

      Nada más. Con esto ya termino. Por favor, no tengáis miedo, **Partido Socialista**, y no claudiquéis
      ante la **tiranía de la indiferencia**.

      Muchas gracias.'
