- iv_id: 2013-07-26-001
  fields:
    text_val: 'Bon dia, alcaldessa. Sres. i Sra. regidors.


      Hui s''aprova una ordenança **sense consens ni participació** del total d''actors que intervenen
      en un problema greu i de difícil solució. Estudiat el document de contestació a les al·legacions,
      manifestem que **no s''ha recollit cap variació substancial** del borrador publicat el 18 de maig.


      La Federació de València fa anys que treballa **des del consens i la participació** per a erradicar
      en la mesura del possible este greu problema. Com es va manifestar en el ple del 27 d''abril, després
      d''estudiar la proposta d''Ordenança que pretén regular l''exercici de la prostitució en la via
      pública i tant des de la Junta Directiva com del ple de la Comissió Sociosanitària de la Federació
      es va arribar a la conclusió que **l''Ordenança s''orienta exclusivament a una funció punitiva o
      sancionadora** d''esta activitat. Per tant, s''està intervenint exclusivament des de la potestat
      sancionadora que la legislació reconeix a l''Administració local.


      El nou text que presenten continua estant **enfocat des del punt de vista exclusiu de la seguretat**.
      Pel contrari, els aspectes socials, sanitaris, d''exclusió social i explotació són inclosos de forma
      secundària i **continuen sense aportar solucions des de la prevenció i la reinserció**.


      Per tot l''exposat, ens ratifiquem en les al·legacions que es van presentar per part d''esta Federació
      i algunes de les presentades per altres col·lectius i ciutadans, que també han sigut rebutjades:
      **no ha passat pel Consell de Benestar Social** municipal, malgrat haver-ho sol·licitat fins en
      dues ocasions en l''apartat Precs i Preguntes; **no s''ha consultat a la majoria d''entitats socials**,
      que són les que treballen diàriament amb les persones afectades; **no s''ha consultat a afectades
      i afectats**; ni per descomptat amb esta Federació, reconeixent que és un problema que hauria d''haver-se
      tractat de forma integral de cara a solucionar esta greu situació que viu el barri de Velluters,
      entre altres, però amb les eines legals ja existents.


      **La inversió econòmica és insuficient** per a elaborar un bon programa de reinserció social. Se
      segueix contemplant el problema des d''una única perspectiva: **la seguretat ciutadana**, deixant
      de banda múltiples factors que afecten persones explotades sexualment i veïns afectats.


      Hui es va a aprovar esta Ordenança per la majoria dels seus vots, però des de llavors **amb el menor
      suport social** que una Ordenança d''estes característiques hauria de tindre. Considerem necessària
      una reflexió i, ja que la van a aprovar, haurien de plantejar la instauració de **mesures integrals**.


      En la meua intervenció del 27 d''abril passat qui proposa esta Ordenança, el regidor de Seguretat
      Ciutadana, va donar a entendre que **la FAVV havia donat l''esquena** a les seues associacions i
      a un problema social en el que portem treballant anys, abans inclús del problema que va esclatar
      en el barri de Natzaret quan treballàrem conjuntament amb este Ajuntament.


      Per últim, volguérem deixar clar que **amb els que van a donar suport a esta Ordenança la Federació
      no ha mantingut cap tipus de reunió** on poder exposar la nostra postura.


      I com després ja no tenim cap possibilitat de rèplica, li demane al Sr. regidor de Seguretat Ciutadana
      que, per a restar importància a les nostres propostes, no empre com va fer al ple d''abril passat
      arguments tan pobres i incierts com va fer aleshores. Entre altres coses, perquè **la FAVV no necessita
      justificar ni demostrar res** ja que són molts anys de treball ben fet els que ens avalen. I des
      de llavors, sempre, sempre, ha sigut al costat i pel bé de veïns, associacions i ciutadans.


      Moltes gràcies.'
