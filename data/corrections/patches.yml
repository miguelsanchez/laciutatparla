- iv_id: 2024-12-20-002
  fields:
    text_original: 'Hola, buenos días.

      Nosotros, mi compañera y yo, representamos a **las familias de miles de escolares** que con **preocupación
      y firmeza** nos dirigimos hoy a este ayuntamiento para **denunciar la situación** que están viviendo
      nuestros hijos e hijas, las familias y el personal docente a raíz de **la dana** que ha afectado
      gravemente a las pedanías de Castellar-Oliveral, al Forn d’Alcedo, La Torre y también de los municipios
      de l’Horta Sud.

      Desde **FAMPA València** queremos expresar nuestro apoyo a todos los posibles afectados presentes
      en esta sala, políticos, invitados, periodistas, trabajadores y especialmente a las familias y a
      la comunidad educativa de las zonas afectadas. A tan solo apenas **cuatro kilómetros de aquí** ha
      ocurrido **una catástrofe humana** que no podemos ignorar. Es nuestro deber como sociedad actuar
      con rapidez y determinación. La escuela no es un solo espacio académico, sino también es un **entorno
      vivencial, social y psicológico fundamental** para el desarrollo integral de los niños, niñas y
      jóvenes. Tras la **devastadora dana**, la comunidad educativa se enfrenta a un reto complejo: recuperar
      la normalidad de las aulas, sin olvidar la importancia de atender **las necesidades emocionales
      y sociales** del alumnado y el profesorado. Los **adolescentes llevan más de un mes** sin contacto
      con sus amigos y amigas, lo que ha generado **angustia, soledad y desconexión**. Los estudiantes
      de **bachillerato** que se preparan para las pruebas como la **EvAU** se están enfrentando a situaciones
      de estrés y dificultades para concentrarse en entornos marcados por la destrucción y la incertidumbre,
      ya que muchos de ellos están estudiando en casa. Es muy complicado estudiar y planificar un futuro
      cuando el presente es tan inestable. Y cuando digo de casa, si es que le queda la casa en pie. También
      para atender al profesorado que debe de enfrentarse a estas situaciones, aun habiendo vivido también
      situaciones muy complejas.

      **Volver a las aulas será en condiciones de seguridad**. **Las denuncias** que nos llegan a la Federación
      son inaceptables. Niños y niñas que han estado sentados en el suelo durante las clases en centros
      de acogida de la ciudad de València o que no cuentan con los materiales necesarios. Gran parte del
      alumnado reubicado lo ha perdido todo. **No se están llevando a cabo acciones extraordinarias**
      para dotar a los centros de recursos humanos y materiales. Se reubican alumnos sin profesores adicionales,
      ni una detección previa de sus necesidades específicas. **Esta falta de previsión es un grave error**
      que no podemos permitir. Además, debemos denunciar que familias y equipos directivos, como el del
      **CEIP Padre Manjón, de La Torre**, han manifestado que desde el **Ayuntamiento de València** se
      exigió la apertura de los centros escolares, una solicitud que se realizó a pesar de que todavía
      no se cumplían **las condiciones mínimas necesarias** para garantizar la seguridad y el bienestar
      de los estudiantes y del personal. **Los servicios de limpieza no habían finalizado**. No estaba
      disponible todo el mobiliario, ni el material escolar educativo. El servicio de comedor no estaba
      operativo. El patio no era seguro. Y lo más importante, la planta baja donde estudiaba el alumnado
      de Infantil y Primaria seguía sin las condiciones necesarias para ser ocupadas de manera segura.
      No queremos que los centros abran sin garantías de seguridad.

      Este ayuntamiento, el **tercero más grande de España** y gracias a ese fenómeno meteorológico llamado
      **la dana**, que es la que ha hecho fructífera la huerta valenciana, es el **primero de la Comunidad
      Valenciana**, también debe estar afectado, pero no tiene los recursos y la capacidad para liderar
      **una respuesta contundente**. Por todo ello, exigimos que hagan lo que tengan que hacer. **Movilizar
      todos los recursos necesarios** para paliar la situación. Tienen la obligación de cumplir lo que
      no están haciendo la **Generalitat Valenciana** y posteriormente exigirles cuenta.

      Por todo ello, nos gustaría que respondiesen a estas preguntas y dudas: ¿Cuánto se va a destinar
      a **material escolar, a mobiliario y a apoyo psicológico** en los centros de las zonas afectadas?
      ¿Cuánto se asignará a las **familias con hijos e hijas desplazados**? ¿Qué recursos se destinarán
      a los centros educativos que acogen a alumnado de otros municipios? Y por último, ¿qué **refuerzo
      educativo, profesorado, mobiliario o material adicional** se proporcionará a los colegios e institutos?

      Nada más, muchas gracias.'
    text_val: 'Hola, bon dia.

      Nosaltres, la meua companya i jo, representem a **les famílies de milers d''escolars** que amb **preocupació
      i fermesa** ens dirigim hui a este ajuntament per **denunciar la situació** que estan vivint els
      nostres fills i filles, les famílies i el personal docent a causa de **la dana** que ha afectat
      greument les pedanies de Castellar-Oliveral, el Forn d''Alcedo, La Torre i també dels municipis
      de l''Horta Sud.

      Des de **FAMPA València** volem expressar el nostre suport a tots els possibles afectats presents
      en esta sala, polítics, convidats, periodistes, treballadors i especialment a les famílies i a la
      comunitat educativa de les zones afectades. A tan sols **quatre quilòmetres d''ací** ha ocorregut
      **una catàstrofe humana** que no podem ignorar. És el nostre deure com a societat actuar amb rapidesa
      i determinació. L''escola no és només un espai acadèmic, sinó també un **entorn vivencial, social
      i psicològic fonamental** per al desenvolupament integral dels xiquets, xiquetes i joves. Després
      de **la devastadora dana**, la comunitat educativa s''enfronta a un repte complex: recuperar la
      normalitat de les aules, sense oblidar la importància d''atendre **les necessitats emocionals i
      socials** de l''alumnat i del professorat. Els **adolescents porten més d''un mes** sense contacte
      amb els seus amics i amigues, cosa que ha generat **angoixa, solitud i desconnexió**. Els estudiants
      de **batxillerat** que es preparen per a les proves com la **EvAU** s''estan enfrontant a situacions
      d''estrés i dificultats per a concentrar-se en entorns marcats per la destrucció i la incertesa,
      ja que molts d''ells estan estudiant a casa. És molt complicat estudiar i planificar un futur quan
      el present és tan inestable. I quan dic de casa, si és que li queda la casa en peu. També per a
      atendre al professorat que ha d''enfrontar-se a estes situacions, encara que també haja viscut situacions
      molt complexes.

      **Tornar a les aules serà en condicions de seguretat**. **Les denúncies** que ens arriben a la Federació
      són inacceptables. Xiquets i xiquetes que han estat asseguts en el terra durant les classes en centres
      d''acollida de la ciutat de València o que no compten amb els materials necessaris. Gran part de
      l''alumnat reubicat ho ha perdut tot. **No s''estan duent a terme accions extraordinàries** per
      a dotar els centres de recursos humans i materials. Es reubiquen alumnes sense professors addicionals,
      ni una detecció prèvia de les seues necessitats específiques. **Esta falta de previsió és un greu
      error** que no podem permetre. A més, hem de denunciar que famílies i equips directius, com el del
      **CEIP Padre Manjón, de La Torre**, han manifestat que des de l''**Ajuntament de València** es va
      exigir l''obertura dels centres escolars, una sol·licitud que es va fer malgrat que encara no es
      complien **les condicions mínimes necessàries** per a garantir la seguretat i el benestar dels estudiants
      i del personal. **Els servicis de neteja no havien finalitzat**. No estava disponible tot el mobiliari,
      ni el material escolar educatiu. El servici de menjador no estava operatiu. El pati no era segur.
      I el més important, la planta baixa on estudiava l''alumnat d''Infantil i Primària seguia sense
      les condicions necessàries per a ser ocupada de manera segura. No volem que els centres obrisquen
      sense garanties de seguretat.

      Este ajuntament, el **tercer més gran d''Espanya** i gràcies a eixe fenomen meteorològic anomenat
      **la dana**, que és la que ha fet fructífera l''horta valenciana, és el **primer de la Comunitat
      Valenciana**, també ha de estar afectat, però no té els recursos i la capacitat per a liderar **una
      resposta contundent**. Per tot això, exigim que facen el que hagen de fer. **Mobilitzar tots els
      recursos necessaris** per a pal·liar la situació. Tenen l''obligació de complir el que no estan
      fent la **Generalitat Valenciana** i posteriorment exigir-los comptes.

      Per tot això, ens agradaria que respongueren a estes preguntes i dubtes: Quant es destinarà a **material
      escolar, a mobiliari i a suport psicològic** en els centres de les zones afectades? Quant s''assignarà
      a les **famílies amb fills i filles desplaçats**? Quins recursos es destinaran als centres educatius
      que acullen alumnat d''altres municipis? I per últim, quin **reforç educatiu, professorat, mobiliari
      o material addicional** es proporcionarà als col·legis i instituts?

      Res més, moltes gràcies.'
