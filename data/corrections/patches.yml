  fields:
    idioma_original: valenciano
    text_cas: 'Buenos días a todos.

      Señor alcalde, representantes políticos de los ciudadanos de València, señoras y señores.

      Pertenezco a la Sociedad Civil Valenciana, una asociación transversal de carácter cívico, y acudía
      a dar voz a la sociedad civil, aquella que no es política. Por eso, nadie debe buscar en mis palabras
      ningún sesgo partidista sino cívico. Nuestro manifiesto fundacional, el de Sociedad Civil Valenciana,
      habla de **''devolver la voz a la gente, apoyando las causas justas y exigiendo a los poderes transparencia''**.


      Como consideramos que la causa de los vecinos de Penya-roja y los vecinos de Tres d''abril es **una
      causa justa**, hemos solicitado la palabra y agradecemos que nos la concedan. En este tema se mezclan
      diversas cuestiones que bien merecen ser consideradas por ustedes.


      Por un lado, **una protección fallida** de uno de los edificios que constituye **uno de los mejores
      ejemplos de la arquitectura industrial**. Tuvieron que pasar la vergüenza de que un tribunal de
      justicia les llamara al orden, instándoles a la **defensa integral del patrimonio**. Y no hace falta
      que les recuerde que **el patrimonio es de todos**, es la mejor herencia de nuestra civilización.


      Por otro lado, una calificación del suelo de Tabacalera realizada por ustedes como corporación que
      finalmente resultó gravosa para todos los vecinos de València. **La transformación de la clasificación
      del suelo industrial a zona verde** tuvo como consecuencia **un incremento importante del suelo
      que pagamos todos**.


      Por otro lado, **la falta de atención hacia los vecinos** de las zonas anteriormente citadas (Penya-roja
      y Tres d''abril) eliminando las superficies de equipamientos que habían sido objeto de acuerdo entre
      Administración y propietarios manifestado en el plan urbanístico, acuerdo que ustedes ahora deciden
      **romper de manera unilateral**. Esto demuestra **una gestión caótica de lo público**, donde ustedes
      insisten en la defensa solo de una parte de los ciudadanos.


      Entendemos que quieran subsanar sus errores con el mínimo coste para la ciudad, pero no pueden hacerlo
      cargando a los vecinos que ya han cumplido con sus obligaciones económicas. Máxime cuando disponen
      de una gran cantidad de suelo que les permitiría satisfacer los derechos de la constructora afectada.


      Por ello, les rogamos que no se escuden en **triquiñuelas legales** para defender lo indefendible
      porque atenta contra la credibilidad de ustedes y de la institución a la que representan.'
