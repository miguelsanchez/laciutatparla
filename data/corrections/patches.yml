    text_cas: ''
    text_val: 'Vaig a llegir això, però abans vull dir-los que **m''he divertit molt hui** en este Ple.
      No sabia que vostés foren tan divertits, la veritat. És que pense que vindré altres vegades.


      Com poden sentir ahí fora **hi ha una manifestació** dels treballadors de Mercavalència. Bé, vaig
      a llegir ja el paper que porte, en castellà.


      Em presente davant de vostés per a donar veu als **treballadors i treballadores** que formen la
      Secció Sindical de UGT i presten els seus servicis baix la forma de **una falsa cooperativa** en
      Mercavalència.


      En primer lloc, faig menció a la **compareixença interessada, plena de falsedats i mentides** que
      es va produir en el Ple anterior a través d''un soci de la **cooperativa de falsos autònoms**, així
      reconegut per **Inspecció de Treball**, que realitza una labor de pantalla en Mercavalència. Este
      compareixent, este senyor que va parlar, **no representava a ningú** llevat de si mateix i del senyor
      Galiana, per descomptat. **La reacció va ser d''un rebuig unànime** entre la resta dels treballadors.
      Prova d''això són **les 165 signatures** que ací presente. A hui **el nombre d''afiliats** a la
      Secció Sindical gràcies a això està al voltant de **200 persones**, que hui es concentren davant
      d''este Ajuntament per a demanar **alt i clar que volen ser treballadors de ple dret**; estan ahí
      fora, supose que els senten.


      Sense dubte, vostés ja saben el motiu d''esta compareixença: **demanar-los, una vegada més, que
      com a institució acaten la resolució** de l''organisme estatal que és Inspecció de Treball, emparat
      pel principi de veracitat. En esta resolució s''acredita que **Mercavalència, amb el senyor Galiana
      com a president, ha fet ús de la figura del fals autònom** per a aconseguir un compte de resultats
      i una notorietat basada en **el frau**, que la majoria de vostés ha donat suport i que ve de molt
      de temps arrere.


      L''economia submergida a Espanya ascendeix a **168.000 milions d''euros** i provoca una pèrdua de
      recaptació de **26.000 milions d''euros**. A partir d''un estudi sobre les dades de l''Enquesta
      de Població Activa (EPA), es xifra en **225.000 el nombre de falsos autònoms** a Espanya i en **més
      de 592 milions d''euros a l''any el frau** per a les arques de l''Estat. A este frau, gràcies a
      vosté, senyor Galiana, **Mercavalència fa la seua aportació amb prop de 7 milions d''euros**. Esta
      forma d''actuar és la **herència rebuda dels anteriors governs municipals del Partit Popular**.


      Senyors i senyores socialistes, és de suposar que coneixen el **Reial Decret aprovat el 3 d''agost**
      del present pel qual el Govern reforça les actuacions d''Inspecció de Treball i és de suposar que
      coneixen el **Pla Director per un Treball Digne**, elaborat pel Ministeri de Treball. Pla en el
      qual es parla de **treball digne, treball decent**, del reforç contra l''economia irregular, pla
      en el qual s''especifica clarament que **l''ús de falses cooperatives** s''utilitza per a **competir
      deslleialment en el mercat** i amb un clar objectiu fraudulent. Vostés han donat suport a això,
      **250 falsos autònoms a Mercavalència**, no poden sentir-se orgullosos.


      Pel que sembla, quan a Madrid diuen blanc vostés, senyors socialistes, **fan negre**. Estem com
      a sindicat donant els passos necessaris per a demanar explicacions al més alt nivell sobre les seues
      actuacions i demostrar que este Pla Director per un Treball Digne és per a vostés tan sols **paper
      mullat**, a tindre en compte la seua línia d''actuació contrària al que disposa el Govern d''Espanya.
      Senyors de Podem, han demostrat amb la seua actitud cap als treballadors de Mercavalència **el sentit
      de la seua ètica**, algú haurà de respondre per vostés davant de la seua **manifesta incapacitat**
      per a aplicar l''ideari social del qual el seu partit presumeix. **Manifestem el nostre enorme agraïment**
      al Grup Municipal Ciutadans pel seu suport, la seua fermesa, pel seu sentit de la responsabilitat
      cap a la gent que en este moment es manifesta a les portes d''este Ajuntament. Senyors regidors
      i regidores del Grup Municipal Ciutadans, moltes gràcies.


      Per a concloure, manifestar que **el escorxador de Mercavalència** té les instal·lacions adequades,
      una plantilla professional, hi ha un mercat en el qual posicionar-se, només es necessita **una gerència
      amb l''altura necessària** i capacitat de treball per a garantir el futur de l''entitat. **Canviem
      el rumb**, hui tenim l''oportunitat de fer-ho.


      Moltes gràcies.'
