- iv_id: 2025-12-01-1-008
  fields:
    text_val: 'Bon dia. Moltes gràcies.

      De nou prenc la paraula per a fer-los partícipes de la situació en què es troba el nostre barri
      quant a **la neteja del mateix**. Lamentablement **els veïns de La Raiosa estem patint** les conseqüències
      de **la falta d''atenció** per part del govern municipal quant a **la neteja i la recollida d''escombraries**.
      Esta situació **en ocasions ha sigut insostenible**. D''una banda, **afrontem el problema del botellón**,
      especialment en les proximitats de les discoteques que hi ha en la nostra zona. Ens deixen una gran
      quantitat de deixalles i ampolles, restes de gots que acaben embrutant les nostres voreres. Encara
      que com a ciutadans responsables tractem d''informar sobre estes incidències a través de l''aplicació
      de l''Ajuntament, **moltes vegades no rebem la resposta adequada**. En ocasions han passat molts
      dies sense que s''atenguen els nostres missatges. El que és encara més preocupant és que **estos
      residus es troben en les poques àrees de parc** disponibles per als nostres xiquets, creant així
      un risc innecessari.

      A més, hem vist com **el nostre barri s''ha convertit en un abocador** de restes d''obres, estris
      de gran volum, com electrodomèstics vells, obstruint les nostres voreres i dificultant el trànsit
      de les persones. Moltes de les nostres carrers són estretes i això agreuja encara més la situació.
      També observem com es deixen estos estris al voltant dels contenidors, la qual cosa impedeix la
      circulació de vehicles.

      La raó darrere de tot això és evident, **falta de recursos destinats** per part d''esta corporació
      municipal per a conscienciar i sensibilitzar sobre temes ambientals. Si es dedicara encara que siga
      una xicoteta part del pressupost de neteja a **campanyes educatives**, podríem fomentar una major
      responsabilitat compartida en el manteniment d''un entorn net. Estic convençuda que amb **una bona
      educació ambiental**, la neteja de la nostra ciutat podria millorar notablement.

      Però a més, en el barri de la Raiosa **proliferen de manera exagerada els baixos turístics**, generant
      en el nostre barri més residus, més soroll i en conseqüència, problemes de neteja, provocant **la
      desaparició dels comerços tradicionals**. És clar que tots volem que es visite la nostra ciutat,
      però volem que es faça de forma responsable i contribuint a la neteja de la brutícia que generen.
      I això es podria solucionar **aplicant la taxa turística** i d''esta manera minimitzar els impactes
      col·laterals del turisme.

      Ara ens enfrontem a **la imposició d''una taxa municipal** per a la recollida de residus i sembla
      que s''han d''aplicar **poques bonificacions**, malgrat que la llei ho permet. Això ens sembla un
      desencert, **el no ser incentivats per a reciclar**. Hi ha qui ho fem per consciència. Però per
      a aquells que no tenen assumida la necessitat de reciclar, probablement amb una bonificació podrien
      començar a convéncer-se. És ací on **la bonificació en la taxa de residus** es presenta com una
      solució viable en oferir **incentius econòmics** a qui reduïsca, reutilitze i recicle.

      No sols s''alleujarà la càrrega econòmica dels ciutadans de València, sinó que **es fomentarà un
      comportament responsable** cap al medi ambient. Això beneficiarà l''entorn i brindarà una oportunitat
      per a educar la nostra comunitat sobre la importància de cuidar el nostre planeta.

      Esta bonificació pot convertir-se a més com una **eina de suport a les famílies més vulnerables**.
      Pot servir també perquè s''incentive a tots a participar activament en **la recollida selectiva
      i el reciclatge**, disminuint significativament la quantitat de residus que arriben als abocadors
