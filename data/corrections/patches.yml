- iv_id: 2025-09-11-008
  fields:
    text_original: 'Gracias. Buenos días, alcaldesa. Concejalas y concejales. Asistentes. Hola a todos.

      Me llamo **Marcos Pastor** y estoy aquí en representación de la **Asociación Vecinal y Cultural
      Tres Forques**. Es una entidad que lleva **casi 50 años**, no poco, trabajando de forma voluntaria
      con el objetivo de mejorar la vida de los habitantes y personas que trabajan en los barrios de **Tres
      Forques y Vara de Quart**. Estamos encantados de poder estar aquí y participar hoy, y de poder aportar
      propuestas en beneficio de nuestra ciudad. Como antes ha hablado María José, pues apoyar todo lo
      que ella ha dicho, por supuesto, porque nosotros somos un miembro más de esa federación.

      Bien, los barrios de Tres Forques y Vara de Quart agrupan a **más de 20.000 personas**, una cuarentava
      parte de la población de València. Es una población similar a la de ciudades como Alfafar, Picassent,
      Silla, Moncada o Puçol. Es una cantidad importante. En nuestra asociación nos reunimos todas las
      semanas en reuniones abiertas a toda la ciudadanía que quiera participar, como esta reunión de hoy,
      para trabajar por el barrio. Además, a lo largo de la semana cubrimos carencias de la administración
      ofreciendo **servicios especialmente culturales**, que son agradecidos por todo el vecindario. Por
      tanto, como vivimos allí y disfrutamos y padecemos del estado de nuestro barrio, entendemos que
      estamos capacitados para hablar objetivamente de él. Nos gustaría que escucharan atentamente nuestras
      propuestas y que como gestores elegidos por la ciudadanía actuaran en consecuencia.

      ¿Cuál es el estado actual de nuestro barrio en lo que respecta al Ayuntamiento de València? Pues
      bien, en primer lugar, destacar que sufrimos un **déficit enorme de servicios municipales**. No
      tenemos espacios para la juventud, ni para las mujeres, ni espacios adecuados para los mayores,
      ni espacios polideportivos a la altura, ni contenedores culturales. Por no tener, no tenemos ni
      salón de actos en el instituto del barrio, ni frecuencias adecuadas en los medios de transporte
      público, ni universitat popular, ni servicios sociales. Vamos, que es más fácil contar lo que tenemos
      que lo que no tenemos. Y por tanto, pues nos vemos obligados a **reivindicar**. Perdemos claramente
      en comparación con otros barrios, pero también con otros municipios como los que antes he nombrado,
      excepto, claro, las zonas afectadas por la **dana**, a los que desde aquí aprovechamos para enviar
      nuestra solidaridad y nuestro deseo de que lo antes posible tenga restablecido sus servicios públicos.
      Toda esta situación no es justa para las personas que vivimos en Tres Forques y Vara de Quart, y
      vamos a seguir trabajando para conseguir los servicios que se merece la ciudadanía. Ojalá nuestra
      intervención de hoy sirva para mejorar la situación.

      En segundo lugar, **el problemón de la vivienda**, que ya ha comentado antes María José, es general
      para toda la ciudad. Pisos con precios de alquileres y venta disparados, proliferación de pisos
      turísticos, **falta de vivienda social**. Hay que actuar ya. Como sabemos que se ha comentado y
      que además es una de las prioridades del gobierno actual, pues no vamos a profundizar más en este
      tema.

      Y para terminar con el estado actual, una última circunstancia particular del barrio. Estamos situados
      en la **zona suroeste de la ciudad**, cerca de la **V-30**, que está casi siempre atascada como
      sabrán, y rodeados por las entradas de Torrent y la **N-3** por la avenida del Cid, que también
      presentan grandes congestiones de forma habitual, y el Bulevar Sur. Por si esto fuera poco, estamos
      en la **autopista de entrada de los aviones** al aeropuerto de Manises. Además, tenemos dentro de
      nuestra demarcación el todavía **polígono industrial de Vara de Quart**, el más grande de toda la
      ciudad. Poco a poco el polígono industrial se va transformando en un gran centro logístico. Pero
      eso no es lo que queremos, ni tampoco lo que creemos que es lo mejor para la ciudad. Les voy a dar
      un dato sorprendente. **Somos el barrio con la temperatura media más alta** de toda la ciudad y
      tenemos **contaminación ambiental y acústica muy por encima de la media**. No necesitamos más centros
      logísticos, ni empresas como centros de datos que en lugar de mejorar la situación ambiental contribuyan
      a empeorarla. Cuando pedimos que no se amplíe el aeropuerto o que se hagan zonas más verdes para
      contrarrestar el efecto calor que genera en el tráfico y las empresas, o que se mejore la frecuencia
      de transporte público, o que se acuerde entre el Ayuntamiento y el vecindario los futuros usos a
      medio y largo plazo estableciendo un plan conjunto para el polígono es porque creemos que esto es
      justo y necesario, así como urgente.

      ¿Cuál es la respuesta que hemos recibido del gobierno del Ayuntamiento de València? Pues nos hemos
      reunido con la mayoría de las concejalías, con alguna de ellas varias veces. Hay alguna concejalía
      como excepción que no nos coge ni el teléfono, como **Parques y Jardines**. Deben tener clarísimo
      cuáles son las mejores actuaciones para nuestro barrio. A nuestro entender, sin embargo, **la próxima
      actuación importante está paralizada**. Es un parque situado al lado de dos residencias de mayores,
      que es para los abuelitos y abuelitas del barrio, situado en la **calle Josep Sanchis**. Está proyectado
      desde la legislatura pasada, pero no sé si los abuelitos llegarán a verlo al paso que vamos. Desde
      aquí animamos a que así sea. En cuanto a las concejalías con las que nos hemos reunido, no hemos
      sido capaces de generar algún proyecto de barrio o de ciudad de cara al futuro. Y eso que ya han
      pasado más de dos años desde las elecciones. Es una pena para nosotros y para la ciudad, porque
      ya tenemos la experiencia de otras legislaturas de que cuando se generan esos acuerdos todo el mundo
      sale ganando. Nos gustaría que esto cambiara en lo que queda de legislatura.

      Para terminar, ¿cuáles son las propuestas concretas? Voy a ir rápido. La primera, para paliar la
      carencia de servicios municipales en los dos barrios proponemos la transformación del espacio que
      ocupa actualmente nuestra asociación en el futuro **Centro Cívico de Tres Forques**, un nuevo edificio
      donde además de las actividades que ya se realizan puedan caber otros servicios municipales que
      se merece el vecindario. Queremos acordar la construcción de este espacio conjuntamente con el Ayuntamiento.
      **Llevamos pidiendo este centro desde 2012**, nada más y nada menos. En la anterior legislatura
      se sentaron las bases de este proyecto con la aprobación del Ayuntamiento y el respaldo de la Presidencia.
      Con el actual gobierno hemos seguido trabajando en este tema, pero nos encontramos que el proyecto
      no avanza a la velocidad requerida. Deseamos que se priorice y se reactive antes posible. Y en segundo
      lugar, y termino, queremos trabajar conjuntamente con la administración municipal en el diseño y
      ejecución del mayor espacio de oportunidad del barrio y uno de los mayores de la ciudad, el **polígono
      de Vara de Quart**. Queremos que el gobierno local lo vea, porque dudamos de si lo ha hecho hasta
      el momento. Todos estamos de acuerdo en que **no puede haber un polígono industrial en una València
      del siglo XXI**. Sin embargo, no somos capaces de acordar su futuro. Desde la asociación nos enteramos
      por la prensa de nuevas empresas que se van a instalar en la zona y que en lugar de mejorar, empeoran
      la situación.'
    text_val: 'Gràcies. Bon dia, alcaldessa. Regidores i regidores. Assistents. Hola a tots.

      Me dic **Marcos Pastor** i estic ací en representació de l''**Asociación Vecinal y Cultural Tres
      Forques**. És una entitat que porta **quasi 50 anys**, no poc, treballant de manera voluntària amb
      l''objectiu de millorar la vida dels habitants i de les persones que treballen als barris de **Tres
      Forques i Vara de Quart**. Estem encantats de poder estar ací i participar hui, i de poder aportar
      propostes en benefici de la nostra ciutat. Com abans ha parlat María José, doncs suport tot el que
      ha dit ella, per descomptat, perquè nosaltres som un membre més d''eixa federació.

      Bé, els barris de Tres Forques i Vara de Quart agrupen a **més de 20.000 persones**, una quarantena
      part de la població de València. És una població similar a la de ciutats com Alfafar, Picassent,
      Silla, Moncada o Puçol. És una quantitat important. En la nostra associació ens reunim totes les
      setmanes en reunions obertes a tota la ciutadania que vullga participar, com esta reunió d''hui,
      per a treballar pel barri. A més, al llarg de la setmana cobrim carències de l''administració oferint
      **serveis especialment culturals**, que són agraïts per tot el veïnat. Per tant, com vivim allí
      i gaudim i patim de l''estat del nostre barri, entenem que estem capacitats per a parlar objectivament
      d''ell. Ens agradaria que escoltaren atentament les nostres propostes i que, com a gestors elegits
      per la ciutadania, actuaren en conseqüència.

      Quin és l''estat actual del nostre barri pel que fa a l''Ajuntament de València? Doncs bé, en primer
      lloc, cal destacar que patim un **dèficit enorme de serveis municipals**. No tenim espais per a
      la joventut, ni per a les dones, ni espais adequats per a la gent major, ni espais poliesportius
      a l''altura, ni contenidors culturals. Per no tindre, no tenim ni saló d''actes a l''institut del
      barri, ni freqüències adequades als mitjans de transport públic, ni universitat popular, ni serveis
      socials. Vaja, que és més fàcil contar el que tenim que el que no tenim. I per tant, doncs ens veiem
      obligats a **reivindicar**. Perdem clarament en comparació amb altres barris, però també amb altres
      municipis com els que he nomenat abans, excepte, clar, les zones afectades per la **dana**, a les
      quals des d''ací aprofitem per a enviar la nostra solidaritat i el nostre desig que quant abans
      tinguen restablits els seus serveis públics. Tota aquesta situació no és justa per a les persones
      que vivim a Tres Forques i Vara de Quart, i anem a continuar treballant per a aconseguir els serveis
      que es mereix la ciutadania. Ulls que la nostra intervenció d''hui servisca per a millorar la situació.

      En segon lloc, **el problemón de l''habitatge**, que ja ha comentat abans María José, és general
      per a tota la ciutat. Pisos amb preus de lloguer i venda disparats, proliferació de pisos turístics,
      **falta d''habitatge social**. Cal actuar ja. Com sabem que s''ha comentat i que a més és una de
      les prioritats del govern actual, doncs no anem a aprofundir més en este tema.

      I per a acabar amb l''estat actual, una última circumstància particular del barri. Estem situats
      a la **zona sud-oest de la ciutat**, prop de la **V-30**, que està quasi sempre embussada com sabran,
      i rodejats per les entrades de Torrent i la **N-3** per l''avinguda del Cid, que també presenten
      grans congestions de manera habitual, i el Bulevard Sud. Per si això fora poc, estem a la **autopista
      d''entrada dels avions** a l''aeroport de Manises. A més, tenim dins de la nostra demarcació el
      encara **polígon industrial de Vara de Quart**, el més gran de tota la ciutat. Poc a poc el polígon
      industrial es va transformant en un gran centre logístic. Però això no és el que volem, ni tampoc
      el que creiem que és millor per a la ciutat. Els vaig a donar una dada sorprenent. **Som el barri
      amb la temperatura mitjana més alta** de tota la ciutat i tenim **contaminació ambiental i acústica
      molt per damunt de la mitjana**. No necessitem més centres logístics, ni empreses com centres de
      dades que, en lloc de millorar la situació ambiental, contribuïsquen a empitjorar-la. Quan demanem
      que no s''amplie l''aeroport o que es facen zones més verdes per a contrarestar l''efecte calor
      que genera el trànsit i les empreses, o que es millore la freqüència de transport públic, o que
      s''acorde entre l''Ajuntament i el veïnat els futurs usos a mitjà i llarg termini establint un pla
      conjunt per al polígon, és perquè creiem que això és just i necessari, així com urgent.

      Quina és la resposta que hem rebut del govern de l''Ajuntament de València? Doncs ens hem reunit
      amb la majoria de les regidories, amb alguna d''elles diverses vegades. Hi ha alguna regidoria com
      a excepció que ni ens agafa el telèfon, com **Parcs i Jardins**. Han de tindre clarissim quines
      són les millors actuacions per al nostre barri. Segons el nostre parer, però, **la pròxima actuació
      important està paralitzada**. És un parc situat al costat de dues residències de gent major, que
      és per als avis i àvies del barri, situat al **carrer Josep Sanchis**. Està projectat des de la
      legislatura passada, però no sé si els avis arribaran a veure''l al pas que anem. Des d''ací animem
      a que així siga. Quant a les regidories amb les quals ens hem reunit, no hem sigut capaços de generar
      algun projecte de barri o de ciutat de cara al futur. I això que ja han passat més de dos anys des
      de les eleccions. És una pena per a nosaltres i per a la ciutat, perquè ja tenim l''experiència
      d''altres legislatures de que quan es generen eixos acords tothom surt guanyant. Ens agradaria que
      això canviara en el que queda de legislatura.

      Per a acabar, quines són les propostes concretes? Vaig a anar ràpid. La primera, per a pal·liar
      la carència de serveis municipals als dos barris, proposem la transformació de l''espai que ocupa
      actualment la nostra associació en el futur **Centre Cívic de Tres Forques**, un nou edifici on,
      a més de les activitats que ja es realitzen, puguen cabre altres serveis municipals que es mereix
      el veïnat. Volem acordar la construcció d''este espai conjuntament amb l''Ajuntament. **Portem demanant
      este centre des de 2012**, ni més ni menys. En l''anterior legislatura es van sentar les bases d''este
      projecte amb l''aprovació de l''Ajuntament i el suport de la Presidència. Amb l''actual govern hem
      seguit treballant en este tema, però ens trobem que el projecte no avança a la velocitat requerida.
      Desitgem que es prioritze i es reactive quant abans. I en segon lloc, i acabe, volem treballar conjuntament
      amb l''administració municipal en el disseny i execució del major espai d''oportunitat del barri
      i un dels majors de la ciutat, el **polígon de Vara de Quart**. Volem que el govern local ho veja,
      perquè dubtem de si ho ha fet fins ara. Tots estem d''acord que **no pot haver-hi un polígon industrial
      en una València del segle XXI**. No obstant això, no som capaços d''acordar el seu futur. Des de
      l''associació ens assabentem per la premsa de noves empreses que es van a instal·lar a la zona i
      que, en lloc de millorar, empitjoren la situació.'
