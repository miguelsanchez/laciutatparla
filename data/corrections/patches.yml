- iv_id: 2014-10-31-001
  fields:
    text_val: 'Bon dia. Srs. Regidors, Sra. Alcaldessa.


      Soc [***] i me dirigisc a vostès com a afectat, usuari i consumidor. Acudisc a este consistori per
      a sol·licitar que inste a la Generalitat perquè **no recórrega la sentència del copagament**, ni
      sol·licite la suspensió de dita sentència. Sinó tot el contrari, perquè **es paralitze l''aplicació
      del Decret 113/2013**, de 2 d''agost, i es procedisca a la seua **immediata derogació** en les Corts
      Valencianes per **injust, per antisocial** i perquè el TSJ l''ha derogat en la seua recent sentència
      davant la presentació per part del CERMI del contenciós administratiu contra el decret abans al·ludit.


      El meu fill, amb una **discapacitat del 75%** i incapacitat davant el jutge, té una **paga de 537
      euros** i al marge de la quota que sempre va pagar al centre ocupacional com a usuari, sense rebre
      res nou per l''arribada de la Llei de Dependència, ara a més **li retallen 100 euros més** de la
      seua paga, amb la qual cosa es queda en uns 300 euros, una vegada deduït 80 euros de transport,
      sent en estos moments i des de fa quatre anys **el principal sostenidor de la família**.


      **Família de quatre membres** que porten **sis anys amb tots els seus membres en situació d''atur**,
      creant-se una situació cada vegada més insostenible.


      Molts usuaris dels centres no han tingut els recursos ni els mitjans necessaris per a fer front
      a esta situació creada, per la qual cosa alguns s''han sentit **desballestats del seu centre** en
      haver de marxar per no poder afrontar esta situació i altres ho estan afrontant amb recursos propis.
      Senyories, **ja no tenim més temps, ni diners**. Este sector **no és un negoci, són els més desemparats
      del món** i ens necessiten a tots: als familiars, als amics, als cuidadors en general i a vostès
      principalment, els representants de tots els ciutadans, a la Sra. Alcaldessa, en estos moments a
      vostès són els qui més necessiten, més que mai. **Les persones amb discapacitat i/o dependència**
      i les seues famílies directes no haurien de patir esta crisi els primers, perquè esta crisi és a
      este col·lectiu a qui més violentament li afecta.


      Senyories prec que es done trasllat d''este acord a la Conselleria de Benestar Social i als Grups
      Polítics representats en les Corts Valencianes.


      Moltes gràcies.'
