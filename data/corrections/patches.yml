  fields:
    idioma_original: castellano
    text_val: 'Bon dia. Senyor alcalde, senyores i senyors regidors de l''Ajuntament de València:

      Complim **40 anys**, però seguim **reivindicant viure amb dignitat**.


      Continua el **deteriorament urbanístic i social**, augmenta l''atur, augmenten els **pisos expropiats
      pels bancs**, ocupats molts d''ells per indesitjables, persones que no volen viure a Orriols, expulsades
      d''altres barris.


      Se''ns demana **participació activa, compromesa**. Però ens trobem amb que **sis reunions** aprovant
      per unanimitat que no es lleve la **parada de la línia 11** al c/ Pintor Vilar no serveixen per
      a res, fent-nos travessar **sis vies de tramvia i cinc carrils** per a anar a un centre d''especialitats.


      Se''ns demana que ens posem a treballar. Jardí de la plaça Hermanos Bécquer, netejat i jocs comprats
      pels veïns i veïnes; el de Motilla del Palancar, fet i regat per la finca blava; col·legis; instituts;
      clavegueram; parcs; poliesportiu, regalat a un privat que ha posat el seu nom; alqueries rehabilitades,
      etc. **Tot el que hi ha, aconseguit amb la lluita del barri**.


      Se''ns diu que aquesta és **la nostra casa**, però no es molesten ni a contestar-nos a una **petició
      per escrit i registre d''entrada**. L''alcalde Pérez Casado ens deixava el seu saló emblemàtic,
      el **Saló de Cristall**.


      Se''ns demanen propostes, sabem que és difícil, que no hi ha diners. Però i els **jardins programats,
      prometuts i aprovats**? I a qui li preguntem per la nostra reivindicació d''una **residència centre
      de dia per a les persones més majors**?


      A este Govern municipal li sol·licitàvem un **Pla Integral per a Orriols**:

      - **La rehabilitació integral del barri**.

      - **Lloguers socials** per a les famílies i persones individuals que ho necessiten.

      - **Participació en la comissió d''habitatge**.

      - **El reforçament dels Serveis Socials**.

      - **Mesures per a estimular la permanència i revitalització dels comerços** petits i mitjans del
      barri.

      - **Mesures de formació i foment de treball i ocupació**


      Vostés saben què falta a Orriols i ens tindran sempre donant-los suport si no oblden la realitat
      del nostre barri. I ens tindran treballant, **braç a braç**, per a aconseguir que els veïns i veïnes
      d''Orriols **visquem amb dignitat**.'
