    text_original: 'Hola, buenas tardes. Señora alcaldesa, señoras y señores concejales.

      Hablo, como habéis dicho ya, como representante de la **Asociación Vecinal y Cultural de Monteolivete**.
      Es un barrio que nos sentimos un poco **olvidado año tras años** porque en los presupuestos de los
      ayuntamientos no costamos apenas. Un barrio de **20.000 habitantes** que cuenta con el récord de
      ser el mayor de **densidad de población** junto al de Orriols. Pero también cuenta, lamentablemente,
      con el récord de **menos árboles por habitante** junto a Raiosa y La Roqueta. Pero no hace falta
      leer las estadísticas que proporciona el Ayuntamiento, lo sabemos porque lo sufrimos.

      Cada verano que pasa es literalmente insoportable. Un barrio que sufre cada día las consecuencias
      de decisiones que se toman lejos de Monteolivete y no conocen la realidad de la **falta de sombra**,
      de la gran superficie de **asfalto negro recalentado**, de la falta de árboles y parques, y de las
      **aceras en mal estado** donde caminan nuestros mayores, nuestros niños y nuestras familias. **Los
      árboles no son un lujo, son una necesidad**. Regulan la temperatura, reducen el ruido, captan carbónico,
      mejoran la salud mental y física de quienes convivimos con ellos. Son además, espacios de vida.
      Niños que juegan. Personas mayores que descansan. **València es la Capital Verde Europea**, pero
      no en Monteolivete. Solo estamos exigiendo **infraestructuras de verde básica** y conservar la poca
      que tenemos, ya que incluso llevamos años con muchos **alcorques vacíos sin replantar**.

      Pero si hablamos de infraestructuras, este barrio **fue diseñado para los coches, no para las personas**.
      Tenemos **aceras estrechas**, muchas en mal estado y con obstáculos, terrazas de bares que invaden
      las aceras. En algunos tramos cruzarse con un carrito de bebé o con una silla de ruedas es imposible.
      **La accesibilidad brilla por su ausencia**. Esto es un poco indigno. Por eso ya presentamos a la
      **Concejalía de Movilidad y de Urbanismo** un proyecto pormenorizado de recuperación del espacio
      público para el barrio de Monteolivete. Todas las propuestas recogidas en ese documento fueron fruto
      de un **proyecto de participación** en el barrio que duró **varios meses** y en el que también se
      incluyen otras propuestas que atañen a otras concejalías.

      Algunas de las propuestas del barrio de Monteolivete son: **Peatonalización de calles** añadiendo
      bancos y arbolado, creando itinerarios peatonales agradables y espacios verdes para los vecinos
      y vecinas. **Ensanchamiento generalizado de las aceras** del barrio. **Reordenación de las circulaciones**
      del barrio para evitar tráfico oportunista. Para ello también presentamos un plan con el cambio
      de sentido de circulación de algunas calles que disminuiría el tráfico rodado en el barrio. **Recuperación
      de espacios peatonales**. Nuestro barrio no tiene plazas donde los vecinos puedan disfrutar de estos
      espacios de tranquilidad y esparcimiento. Pero a partir de la reordenación que hemos presentado,
      podían tener **tres plazas más** que darían un total de **2.000 metros cuadrados** de espacios peatonales.
      Queremos que el **Colegio de Monteolivete** sea un **entorno escolar seguro**, peatonalizado de
      la calle que rodea al colegio de Monteolivete y la calle Benissa. Solicitamos la **presencia de
      policía de barrio** para una mayor seguridad ciudadana y una respuesta más rápida y eficaz a los
      problemas del barrio, ya que estamos viendo como el barrio se degrada aceleradamente. También ayudaría
      a solucionar el estacionamiento indebido en las pocas zonas peatonales que tenemos. Las motos aparcadas
      en las aceras que obstaculizan el paso, los patinetes circulando por las aceras o el control de
      las zonas de carga y descarga mejorarían el barrio.

      En cuanto a la **limpieza y la gestión de residuos** de nuestras calles cabe señalar que es **manifiestamente
      mejorable**. Tanto las maquinas barredoras como los baldeo de nuestras calles son insuficientes.
      Porque los vecinos y vecinas también tenemos responsabilidad y sería muy importante una **campaña
      de civismo y educación** en este tema. Además, muchos contenedores están rotos o inaccesibles para
      poder tirar la basura dando una sensación de insalubridad. Solicitamos **17 pasos de peatones nuevos**
      en el barrio. Muchos de ellos ya se contemplaban en el **2012**, ya hace más de **13 años**. Ese
      proyecto que acertadamente también contemplaba itinerarios peatonales en los barrios, pero que todavía
      no hemos podido disfrutar. Actualmente, el acceso al **jardín del Turia** desde Monteolivete, el
      espacio más valorado por los valencianos, solo cuenta con **cuatro pasos de peatones** mal distribuidos.
      También resulta sorprendente que los niños tengan que cruzar una **autopista urbana de nueve carriles**
      para poder acceder al **parque de Gulliver**.

      El trato con las diferentes concejalías ha sido siempre muy agradable y correcto, pero tenemos la
      sensación de un **olvido**, de no prestando la suficiente atención a los problemas que les hemos
      ido trasladando en las diferentes reuniones conjuntas. El sentimiento generalizado es que el **presupuesto
      municipal se concentra en el centro** de la ciudad, olvidando los barrios como el de Monteolivete.
      Sabemos que estos cambios no son inmediatos, pero **exigimos voluntad política**. Desde la Asociación
      Vecinal de Monteolivete queremos ser **parte activa de las soluciones**. Conocemos nuestro barrio,
      hablamos con los vecinos y vecinas cada día y estamos dispuestos a colaborar en todo lo necesario
      para mejorar la vida de todos y todas.

      Muchísimas gracias por vuestra atención.'
    text_val: 'Hola, bona vesprada. Senyora alcaldessa, senyores regidors i regidores.

      Parle, com ja heu dit, com a representant de l''**Associació Veïnal i Cultural de Monteolivete**.
      És un barri en què ens sentim una mica **oblidats any rere any** perquè en els pressupostos dels
      ajuntaments no costem gairebé res. Un barri de **20.000 habitants** que té el rècord de ser el de
      major **densitat de població** juntament amb el d''Orriols. Però també té, lamentablement, el rècord
      de **menys arbres per habitant** juntament amb Raiosa i La Roqueta. Però no cal llegir les estadístiques
      que proporciona l''Ajuntament, ho sabem perquè ho patim.

      Cada estiu que passa és literalment insuportable. Un barri que cada dia sofreix les conseqüències
      de decisions que es prenen lluny de Monteolivete i no coneixen la realitat de la **falta d''ombra**,
      de la gran superfície d''**asfalt negre recalentat**, de la falta d''arbres i parcs, i de les **voreres
      en mal estat** on caminen els nostres majors, els nostres xiquets i les nostres famílies. **Els
      arbres no són un luxe, són una necessitat**. Regulen la temperatura, redueixen el soroll, capten
      carboni, milloren la salut mental i física de qui convivim amb ells. A més, són espais de vida.
      Xiquets que juguen. Persones majors que descansen. **València és la Capital Verda Europea**, però
      no a Monteolivete. Només estem exigint **infraestructures de verd bàsic** i conservar el poc que
      tenim, ja que fins i tot du anys amb molts **escocells buits sense replantar**.

      Però si parlem d''infraestructures, aquest barri **va ser dissenyat per als cotxes, no per a les
      persones**. Tenim **voreres estretes**, moltes en mal estat i amb obstacles, terrasses de bars que
      envaeixen les voreres. En alguns trams és impossible creuar-se amb un carrusel de bebè o amb una
      cadira de rodes. **L''accessibilitat brilla per la seua absència**. Això és una mica indigne. Per
      això ja vam presentar a la **Regidoria de Mobilitat i d''Urbanisme** un projecte detallat de recuperació
      de l''espai públic per al barri de Monteolivete. Totes les propostes recollides en aquest document
      van ser fruit d''un **projecte de participació** en el barri que va durar **diversos mesos** i en
      el qual també s''inclouen altres propostes que afecten altres regidories.

      Algunes de les propostes del barri de Monteolivete són: **Vianantilització de carrers** afegint
      bancs i arbrat, creant itineraris per a vianants agradables i espais verds per als veïns i veïnes.
      **Eixamplament generalitzat de les voreres** del barri. **Reordenació de les circulacions** del
      barri per a evitar el trànsit oportunista. Per a això també vam presentar un pla amb el canvi de
      sentit de circulació d''alguns carrers que disminuiria el trànsit rodat en el barri. **Recuperació
      d''espais per a vianants**. El nostre barri no té places on els veïns puguen gaudir d''aquests espais
      de tranquil·litat i esbarjo. Però a partir de la reordenació que hem presentat, podrien tindre **tres
      places més** que donarien un total de **2.000 metres quadrats** d''espais per a vianants. Volem
      que el **Col·legi de Monteolivete** siga un **entorn escolar segur**, vianantitzant el carrer que
      envolta el col·legi de Monteolivete i el carrer Benissa. Sol·licitem la **presència de policia de
      barri** per a una major seguretat ciutadana i una resposta més ràpida i eficaç als problemes del
      barri, ja que estem veient com el barri es degrada acceleradament. També ajudaria a solucionar l''estacionament
      indegut en les poques zones de vianants que tenim. Les motos aparcades a les voreres que obstaculitzen
      el pas, els patinets circulant per les voreres o el control de les zones de càrrega i descàrrega
      millorarien el barri.

      Pel que fa a la **neteja i la gestió de residus** dels nostres carrers cal assenyalar que és **manifestament
      millorable**. Tant les màquines escombradores com el fregat dels nostres carrers són insuficients.
      Perquè els veïns i veïnes també tenim responsabilitat i seria molt important una **campanya de civisme
      i educació** sobre aquest tema. A més, molts contenidors estan trencats o inaccessibles per a poder
      tirar les escombraries, donant una sensació d''insalubritat. Sol·licitem **17 passos de vianants
      nous** en el barri. Molts d''ells ja es contemplaven el **2012**, fa ja més de **13 anys**. Aquell
      projecte que encertadament també contemplava itineraris per a vianants en els barris, però que encara
      no hem pogut gaudir. Actualment, l''accés al **jardí del Túria** des de Monteolivete, l''espai més
      valorat pels valencians, només compta amb **quatre passos de vianants** mal distribuïts. També resulta
      sorprenent que els xiquets hagen de creuar una **autopista urbana de nou carrils** per a poder accedir
      al **parc de Gulliver**.

      El tracte amb les diferents regidories ha sigut sempre molt agradable i correcte, però tenim la
      sensació d''un **oblit**, de no prestar prou atenció als problemes que els hem anat traslladant
      en les diferents reunions conjuntes. El sentiment generalitzat és que el **pressupost municipal
      es concentra en el centre** de la ciutat, oblidant els barris com el de Monteolivete. Sabem que
      aquests canvis no són immediats, però **exigim voluntat política**. Des de l''Associació Veïnal
      de Monteolivete volem ser **part activa de les solucions**. Coneixem el nostre barri, parlem amb
      els veïns i veïnes cada dia i estem disposats a col·laborar en tot el necessari per a millorar la
      vida de tots i totes.

      Moltíssimes gràcies per la vostra atenció.'
