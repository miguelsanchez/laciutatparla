- iv_id: 2018-03-28-001
  fields:
    text_val: 'Bon dia a tots.


      Nosaltres, des del punt de vista empresarial, venim a exposar un poc la nostra millora de les **Falles**,
      el que nosaltres hem vist un poc deficitari, però bé, també hi ha coses molt bones, però especialment
      des del punt de vista empresarial **pubs, cafè-concerts i discoteques**.


      En primer lloc, per exemple, l''única cosa les vermelles, que tenien **permís fins a les 4:00 del
      matí**, el que és els pubs era fins a les 3:30 i l''únic que demanem és que en tindre fins a les
      4:00 del matí les vermelles **la capacitat de negoci dels pubs ha sigut nul·la**. Després també
      **la venda dels lateros** que hi ha hagut pel carrer, ha sigut un poc incontrolada. Està clar que
      a vegades no es pot controlar com deuríem. I també diríem **els llocs d''alcohol** que hi ha al
      carrer amb uns preus que no podem competir, és impossible. Per tant, l''única cosa que demanem és
      **un poc de previsibilitat** també amb **el botellón**, que realment hi ha hagut parcs en Falles
      que han estat plens de xavals bevent. Això ens perjudica a tots els locals, **un poc més de control**.
      No podem entendre **com es prima als xiringuitos ambulants**, davant del **dret preferent que tenen
      els establiments constituïts**. **La permissivitat del botellón** a tota la ciutat ha sigut una
      llaga per al nostre sector.


      També ens agradaria igualment que també podem lloar **la gestió de les mascletades**, ho hem vist
      perfecte, no tot és dolent sinó que hi ha coses positives. I també ens agradaria que **l''any que
      ve existira una taula de treball** en la qual l''empresariat pogués participar i opinar per a les
      pròximes Falles del 2019.


      Res més, moltes gràcies.'
