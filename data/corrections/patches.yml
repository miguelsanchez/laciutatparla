    text_val: 'Bon dia. Moltes gràcies per deixar-nos entrar.

      Primer volia comentar-vos el tema de quina és la foto de partida. La foto de partida és **més del
      50 per cent de la ciutat** està incomplint en **NO2, en gasos contaminants** en la nostra ciutat.
      Els mesuradors ara mateix els tenim en Vivers, en el cementeri, en Balears, en llocs on la mesura
      digam és noble. Què passa? Que en el moment muntàreu Olivereta es va retratar millor quina és la
      qualitat de l''aire de la nostra ciutat. La nostra ciutat ara mateixa està complint un marc normatiu
      que **d''ací a quatre anys** deixarà de complir. **És a dir, a partir de quatre anys** serem una
      **ciutat il·legal**. Més enllà de si la mala qualitat de l''aire mata o no, anem a ser una ciutat
      il·legal en breu perquè hi ha una **directiva nova** que anem a incomplir. I ací està la vostra
      responsabilitat, és a dir, quina és la vostra responsabilitat davant de la **nova normativa** que
      tenim que complir com a ciutat. Anem a deixar que sigam una ciutat il·legal? Inclús els mesuradors
      on estan, que estan en zones nobles, van a donar valors per damunt del llindar que tenim que complir.
      És a dir, hem de posar-nos les piles.

      Afortunadament, he entrat darrere d''estos dos companys que han posat el marc fantàstic, el marc
      teòric i a mi m''ho deixen molt fàcil. Des de **València per l''Aire i Mesura** som més pragmàtics.
      Volem fer **propostes concretes**. Si se perden els diners, s''han perdut. Val? El que volem és
      utilitzar esta espantada de Vox per a fer el que tenim que fer. I nosaltres, la nostra mà està estesa
      per a vosaltres. I el punt d''acord o consens seria **l''estacionament**. És a dir, si posem el
      centre de les polítiques i la regulació de **l''estacionament prioritari per a veïns**, amb nosaltres,
      amb la plataforma València per l''Aire i amb nosaltres tindreu un aliat per a sortejar el que ve,
      donar un primer pas. I no aspirem a ser Milà, no aspirem a ser Goteborg, Estocolm, que els governs
      de dretes estan en un **peatge urbà** i ho han aplicat molt bé. Al final és fiscalitat de com es
      gestiona l''espai urbà. És a dir, l''espai comú que és per a tots no és llibertat de decidir com
      em moc. No, no van per ahí. Ells van per **qui contamina paga**, qui agredeix paga. Qui contamina
      paga. I això es fa amb peatges urbans o amb taxes.

      ¿Quina és la manera d''encaix que veiem nosaltres per a eixir d''este atzucac en el que ens heu
      ficat? Perquè tampoc ens apeteix com a col·lectius socials estar ací cada 15 dies. O sigui, nosaltres
      no som alliberats. Venim ací -ja no ens fa peresa venir també- doncs perquè veiem que és una oportunitat
      ciutat i l''oportunitat ciutat la veiem amb la **regulació d''aparcament prioritari per a veïns**.
      I eixa manera és **desembussar per a després aplicar taxes**. I **qui contamina que pague**. Esta
      és la proposta que us llancem, la primera proposta que us llancem.

      **Bilbao, Madrid i Donostia**, ja ho saben. Ahí no es pot aparcar amb llibertat. Si vas, pagues.
      I no tenen peatges urbans i funcionen. Per què **València i Sevilla** són **les pitjors en gestió
      de l''estacionament**? Som els pitjors d''Espanya. Gràcies a **Sandra Gómez**, en el seu moment
      es va incorporar en les dades de l''estacionament a la ciutat de València, que no tenia un **registre
      d''estacionament** fins fa **quatre o cinc anys**. No teníem un registre d''estacionament de quins
      eren de pagament, quins eren zona blava. No, no n''hi havia. Doncs ara el tenim. Anem a per ell,
      el rescatem i l''apliquem. Però això de llibertat d''aparcament on em done la gana, no. Això no
      estem per la tasca. Llavors, en resum, la primera proposta era eixa.

      La segona és, alcaldessa, anar a **liderar l''Autoritat Metropolitana de Transport**. O sigua, és
      València. A Barcelona ho saben. L''àrea metropolitana està distreta amb molts problemes. La defensa
      del territori i de la mobilitat ha de ser de València. O sigua, buscar un model. I ara que tenim
      també a **Carbonell**, que sap de què va el tema, realment de lideratge perquè si us interessa,
      heu d''agarrar el brau per les banyes. Eixa seria la segona. **Les llançadores no estan funcionant**
      en els polígons. No està funcionant l''Autoritat. Per tant, realment si us interessa el tema, pensem
      que heu vosaltres de liderar-lo.

      La tercera proposta és **la taxa per l''ús intensiu**. És a dir, això de les mercaderies, Amazon,
      la furgoneta de Mercadona s''ha acabat. Estan fent negoci amb el nostre sòl, que és de tots. I **la
      taxa turística**, suma molt. És a dir, ve gent. Ja acabe. I ens deixa la merda, ens deixa la factura
      i pagarem nosaltres per això. O sigui, hi ha faena per fer. Gràcies i perdó.'
    text_original: 'Bon dia. Moltes gràcies per deixar-nos entrar.

      Primer volia comentar-vos el tema de quina és la foto de partida. La foto de partida és **més del
      50 per cent de la ciutat** està incomplint en **NO2, en gasos contaminants** en la nostra ciutat.
      Els mesuradors ara mateix els tenim en Vivers, en el cementeri, en Balears, en llocs on la mesura
      digam és noble. Què passa? Que en el moment muntàreu Olivereta es va retratar millor quina és la
      qualitat de l''aire de la nostra ciutat. La nostra ciutat ara mateixa està complint un marc normatiu
      que **d''ací a quatre anys** deixarà de complir. **És a dir, a partir de quatre anys** serem una
      **ciutat il·legal**. Més enllà de si la mala qualitat de l''aire mata o no, anem a ser una ciutat
      il·legal en breu perquè hi ha una **directiva nova** que anem a incomplir. I ací està la vostra
      responsabilitat, és a dir, quina és la vostra responsabilitat davant de la **nova normativa** que
      tenim que complir com a ciutat. Anem a deixar que sigam una ciutat il·legal? Inclús els mesuradors
      on estan, que estan en zones nobles, van a donar valors per damunt del llindar que tenim que complir.
      És a dir, hem de posar-nos les piles.

      Afortunadament, he entrat darrere d''estos dos companys que han posat el marc fantàstic, el marc
      teòric i a mi m''ho deixen molt fàcil. Des de **València per l''Aire i Mesura** som més pragmàtics.
      Volem fer **propostes concretes**. Si se perden els diners, s''han perdut. Val? El que volem és
      utilizar esta espantada de Vox per a fer el que tenim que fer. I nosaltres, la nostra mà està estesa
      per a vosaltres. I el punt d''acord o consens seria **l''estacionament**. És a dir, si posem el
      centre de les polítiques i la regulació de **l''estacionament prioritari per a veïns**, amb nosaltres,
      amb la plataforma València per l''Aire i amb nosaltres tindreu un aliat per a sortejar el que ve,
      donar un primer pas. I no aspirem a ser Milà, no aspirem a ser Goteborg, Estocolm, que els governs
      de dretes estan en un **peatge urbà** i ho han aplicat molt bé. Al final és fiscalitat de com es
      gestiona l''espai urbà. És a dir, l''espai comú que és per a tots no és libertad de decidir cómo
      me muevo. No, no van per ahí. Ells van per **quien contamina paga**, quien agrede paga. Quien contamina
      paga. Y esto se hace con peajes urbanos o con tasas.

      ¿Cuál es la manera de encaje que vemos nosotros para salir de este atolladero en el que nos habéis
      metido? Porque tampoco nos apetece como colectivos sociales estar aquí cada 15 días. O sea, nosotros
      no somos liberados. Venimos aquí -ya no nos da pereza venir también- pues porque vemos que es una
      oportunidad ciudad y la oportunidad ciudad la vemos con la **regulación de estacionamiento prioritario
      para vecinos**. Y esa manera es **desatascar para luego aplicar tasas**. Y **quien contamina que
      pague**. Esta es la propuesta que os lanzamos, la primera propuesta que os lanzamos.

      **Bilbao, Madrid y Donosti**, ya lo saben. Ahí no se puede aparcar con libertad. Si vas, pagas.
      Y no tienen peajes urbanos y funcionan. ¿Por qué **València y Sevilla** son **las peores en gestión
      del estacionamiento**? Somos los peores de España. Gracias a **Sandra Gómez**, en su momento se
      incorporó en los datos del estacionamiento a la ciudad de València, que no tenía un **registro de
      estacionamiento** hasta hace **cuatro o cinco años**. No teníamos un registro de estacionamiento
      de cuáles eran de pago, cuáles eran zona azul. No, no había. Pues ahora lo tenemos. Vayamos a por
      él, lo rescatamos y lo aplicamos. Pero esto de libertad de aparco donde me sale de las narices,
      no. Esto no estamos por la labor. Entonces, en resumen, la primera propuesta era esa.

      La segunda es, alcaldesa, vamos a **liderar la Autoridad Metropolitana de Transporte**. O sea, es
      València. En Barcelona lo saben. El área metropolitana está distraída con muchos problemas. La defensa
      del territorio y de la movilidad tiene que ser de València. O sea, buscar un modelo. Y ahora que
      tenemos también a **Carbonell**, que sabe de qué va el tema, realmente de liderazgo porque si os
      interesa, tenéis que coger el toro por los cuernos. Esa sería la segunda. **Las lanzaderas no están
      funcionando** en los polígonos. No está funcionando la Autoridad. Entonces, realmente si os interesa
      el tema, pensamos que tenéis vosotros que liderarlo.

      La tercera propuesta es **la tasa al uso intensivo**. Es decir, esto de mercancías, Amazon, furgoneta
      de Mercadona se ha acabado. Están haciendo negocio con nuestro suelo, que es de todos. Y **la tasa
      turística**, suma mucho. Es decir, viene gente. Ya termino. Y nos deja la mierda, nos deja la factura
      y pagamos nosotros por ello. O sea, hay faena per fer. Gracias y disculpa.'
