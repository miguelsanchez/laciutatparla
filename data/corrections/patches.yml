- iv_id: 2012-11-23-001
  fields:
    text_val: 'Me dirigisc a vostés en representació de les més de 300 famílies que portem als nostres
      fills al CEIP 103. Voldria començar recordant que **estos xiquets porten en contenidors des del
      curs 2008-2009** i són xiquets de 3 a 8 anys.


      Els demanem en primer lloc que demanen explicacions a la Conselleria d''Educació de per què no s''ha
      construït el col·legi en el terreny que vostés van cedir per a ús escolar en el 2010, que per què
      han deixat caducar la llicència d''obres. **Els exigim com a contribuents que les demanen** i ens
      expliquen per què es consent que els nostres fills no tinguen un col·legi digne; volem i necessitem
      una explicació.


      Vostés no tenen les instal·lacions en condicions. **Des del 8 de setembre de 2009**, amb registre
      d''entrada en este Ajuntament, portem demanant **una valla en condicions**. Ara estos xiquets estan
      exempts de privacitat i de seguretat. L''última sol·licitud és del 23 d''abril de 2012 i des de
      la Regidoria d''Educació es va parlar amb mi i se''m va instar a una reunió en un termini de **quatre
      setmanes** per a veure les deficiències plantejades: valla, alarma, llum del pati, els embussos
      en les canonades, la neteja dels solars confrontants. I **estes quatre setmanes s''han convertit
      en set mesos** pel moment.


      **La falta d''alarma i seguretat** -i també l''altura de la valla- han propiciat robatoris en el
      centre. **La mala instal·lació de les canonades** fa que els vàters s''embussen, creant **problemes
      d''higiene importants** a més d''olors d''òxid per la humitat. No es netegen els solars que envolten
      el centre, on hi ha caques de gos, ampolles i altres coses. I quan vostés van al col·legi i diuen
      ''de què es queixen si no està tan malament'', una pregunta: **els agradaria que els seus fills
      anaren a estos contenidors?** O vostés treballarien a gust en estos contenidors? Crec que no.


      Ens sembla que **tenim dret a queixar-nos i a exigir** que els nostres fills estiguen en les mateixes
      condicions que la resta. En el 2008-2009 no hi havia crisi. **Ajudeu-nos a exigir a la Conselleria
      dignitat i igualtat** en l''educació dels nostres fills, com així ho ha resolt el Síndic i el Defensor
      del Menor.


      Per últim, ens agradaria saber com se sentirien vostés en la nostra situació, veient com **els polítics
      que ens governen no fan res pels nostres fills**, xiquets que estan a 100 m de la Ciutat de les
      Arts i les Ciències i del circuit de Fórmula 1. **Necessaris són els castells pirotècnics i les
      festes, i també un col·legi.**


      Nosaltres en estos cinc cursos mai hem insultat ni xiulat a ningú, vetllem per l''educació dels
      nostres fills i **exigim el que els pertany: igualtat i dignitat**. **Provisionalitat no és eternitat**
      i vint mesos que ens va dir que els nostres fills estarien ahí no són cinc anys.


      Els porte, perquè vegen que és cert, [mostra fotografies sobre] **la falta de privacitat de la valla**,
      els solars, l''òxid…'
    temes_v2:
      serveis_publics:
      - educacio
    ambit: barri
    resum_cas: 'Representante del Ampa del CEIP 103 denuncia las deficientes condiciones de las instalaciones
      provisionales donde estudian más de 300 niños desde 2008: contenedores sin seguridad ni privacidad,
      valla insuficiente, problemas de saneamiento, falta de limpieza de solares adyacentes, y demora
      en la construcción del colegio prometido en 2010.'
  reason: Fix Spanish spelling of 'saneamiento' in the summary.
  date: '2026-10-21'
  finding: C6-52df543a00
- iv_id: 2013-04-26-001
  fields:
    text_val: 'Bon dia. Me dic [***], soc sòcia de Lambda -col·lectiu de lesbianes, gais, transexuals
      i bisexuals-, dona transexual i ex treballadora del sexe. Estic ací per a donar veu en este ple
      de l''Ajuntament de València a les persones treballadores sexuals, homes i dones, que vostés -el
      Partit Popular i el Partit Socialista- amb esta Ordenança van a denunciar i multar, a criminalitzar
      i marginar, invisibilitzar i excloure.


      Esta Ordenança busca **treure dels espais públics** i dels carrers a les persones obligant-les a
      treballar per a tercers en clubs, saunes de massatge i pisos on sí que seran explotades per les
      màfies. Vostés amb esta Ordenança **realment afavorixen a les xarxes i a les màfies** de tracta
      de blanques.


      La majoria de les persones treballadores del sexe són **immigrants en situació irregular** que necessiten
      un **pla de reinserció laboral real** que les done la possibilitat de treballar a aquelles que vullguen
      abandonar esta activitat. Però també existixen persones treballadores sexuals que exerceixen este
      treball perquè volen i a estes persones cal proporcionar-les **llocs i espais on poder exercir la
      seua professió** amb totes les garanties sanitàries i de seguretat sense molestar ningú.


      Els recorde que **totes les treballadores sexuals són filles, germanes, esposes, mares** i que la
      gran majoria estan sostenint a les seues famílies, més en estos temps de crisi. Per tot això és
      necessari oferir-les **recursos reals com tallers d''ocupació, ajudes per a crear d''empreses**,
      etc, perquè estes persones puguen decidir sobre les seues vides amb autonomia. Continue pensant
      que l''objectiu d''esta Ordenança és aconseguir un **rèdit electoral** davant dels veïns que convivixen
      amb les treballadores sexuals als carrers d''ambdós. Existixen ordenances semblants en altres municipis
      de l''estat, sense aconseguir la retirada de les treballadores sexuals dels carrers sinó empitjorant
      esta situació.


      Finalment, demanaria **valentia i responsabilitat política** als dos partits que han pactat esta
      Ordenança repressiva perquè la retiren i busquen solucions on a través del **coneixement i la comunicació**
      amb les persones treballadores del sexe s''aconseguisca la **convivència i la protecció** d''este
      col·lectiu tan vulnerable. Moltes gràcies.'
