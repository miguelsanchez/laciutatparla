    text_val: 'Bon dia, senyor Ribó, senyor alcalde de València i resta de la corporació municipal. Com
      vosté ha dit, el meu nom és [*], **veí del barri del Tremolar**. I me dirigisc a vostés com a **president
      del Club Apolo de Pinedo** i en nom de l''**Associació de Veïns Afectats del Carril Bici del Tremolar**,
      així com dels usuaris de la principal artèria que comunica Castellar-l''Oliveral amb Pinedo. En
      el seu moment, l''Associació de Veïns de Castellar-l''Oliveral van presentar al·legacions sobre
      el mateix, de les quals **no van rebre resposta**. Tenint coneixement del traçat al seu pas per
      la nostra barriada, que és el nucli més important de la població en una longitud aproximada de 800
      metres i que limita amb el terme d''Alfafar i el terme de València, veiem amb estupor que **el carril
      bici tindrà una amplària de tres metres**, superposant-se en una via pública que té una amplària
      de cinc metres i mig, sent una via de doble sentit per on passa trànsit de maquinària agrícola,
      autobusos cada 20 minuts i trànsit rodat, per la qual cosa, si a això li afegim el metre i mig de
      seguretat de marge que cal donar al carril bici, **només queda un metre per a passar**. **O volen
      o se la peguen**. **Només ens queda un metre**. No s''ha tingut en compte que des del camí del Tremolar
      s''accedeix a cinc carreteres, amb les seues corresponents sèquies: sèquia de l''Or, sèquia del
      Tremolar, sèquia del Vall, sèquia del Petxinar, les quals tenen les seues carreteres que donen pas
      al que és el terme d''Alfafar i pedania de Pinedo, que comporten un total de **1.400 hectàrees d''arrossar**.
      Què comporta això? Doncs **pas quotidià de tractors, maquinària agrícola**. Perquè la recol·lecció
      de l''arròs, si bé és cert que dura tres mesos, actualment són vuit els que es necessiten de llaurança,
      i tot això comporta que eixe pas continu de tractors envaeix les calçades. No s''ha tingut en compte
      que hi ha una **SATA arrossera que emmagatzema 4.000 tones d''arròs**, amb un moviment de **500
      tractors**, més en el mateix tram del camí del Tremolar, en l''època de la recol·lecció de l''arròs
      es posa una bàscula per a recollir **2 milions de quilos**, que entren aproximadament en la mateixa
      zona on va el carril bici **200 tractors en un sentit i en l''altre**. Per tant, **això comporta
      un perill, un perill per als ciclistes i els usuaris**. Així mateix, també hi ha una empresa que
      es diu, o una SATA, **AgroPinedo, que té 80 màquines agrícoles** amb els seus corresponents tractors.
      Els tractors actuals tenen una amplària dels aperos de llaurança de tres metres, la qual cosa és
      compatible amb circular sense permisos especials perquè són suspesos. **El temps de llaurança i
      cultiu de l''arròs comprén els mesos de febrer a octubre**. Tots aquests mitjans agrícoles circulen
      utilitzant majoritàriament este camí perquè estem envoltats del que és el parc natural i no hi ha
      cap altra zona possible per a passar. **És un greu problema i un risc que suposa per als ciclistes**,
      comprenent este tram del carrer Guadiana a la Sèquia de l''Or aproximadament d''uns 800 metres.
      Tot això es pot evitar amb una **solució alternativa i eliminant este tram central de la barriada
      del Tremolar**. **La nostra proposta consisteix a suprimir el carril bici d''aquest tram esmentat**
      i prolongant el carril bici que ve paral·lel a la Sèquia de l''Or i creuant el camí del Tremolar,
      continuant per la Sèquia de l''Or fins al carrer Guadalaviar, girant a la dreta i connectant amb
      la carretera del Tremolar per a enllaçar amb el carril bici nou, direcció passarel·la de Pinedo.
      Així mateix, el carril bici a pocs metres de connectar amb la passarel·la de Pinedo hi ha unes cases
      que tan solament tenen un metre de vorera i un de carril bici. Es podria creuar uns metres abans
      per a evitar el risc que hi ha. A més, en estos últims dies la barriada del Tremolar, en quatre
      dies, han posat **un imprès en la calçada de tres centímetres formant panot**. **Les cases tenen
      aproximadament una mitjana de 120 anys**. Eixes cases, els seus dormitoris estan a escassos tres
      metres d''eixe paviment, que a més eixe paviment segurament enseguida es omplirà de terra, perquè
      el que passa per tractors amb terra dels camps d''arrossar adossats a la maquinària agrícola i això
      serà un fangar. I per últim, concloc: **un directiu allà en l''obra, de direcció d''obra, va dir:
      ''Jo al meu nét no el deixaria circular per este carril bici''**. I per últim, acabe agraint al
      **Grup Municipal del Partit Popular** per haver presentat esta moció, acompanyant-nos en tot moment
      en les reivindicacions des d''un principi. Moltes gràcies. I no recordarà que vostè va estar fa
      tres o quatre anys en la pedania de Pinedo, li vaig posar unes fotos que el que necessitem eren
      voreres per a concloure...'
