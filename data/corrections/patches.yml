  fields:
    text_val: 'Bon dia.

      Des de la nostra Associació València Acull hem decidit participar per a plantejar en este debat
      un tema que ens preocupa molt i que també en els últims temps ens ocupa. Perquè en estos **35 anys
      de treball**, sempre ubicats en el barri d''Orriols, treballant en i per al barri, hem sigut testimonis
      del seu procés de canvi. Hem vist com ha variat la seua composició. **Persones de més de 37 nacionalitats**
      han triat viure en ell. S''han creat nous negocis regentats per persones migrants i el barri té
      un **aspecte multicultural** que abans no tenia. Per això, gran part del nostre treball s''ha centrat
      en la **promoció de les relacions entre veïns i veïnes** des del respecte i la posada en valor de
      la diversitat, avançant en la **convivència de cultures diferents** perquè els problemes en el barri
      no són fruit de la mala convivència. Hem treballat per a afavorir la **integració de les persones
      migrants** oferint assessoria perquè puguen accedir a drets i serveis com el dret a l''educació,
      la salut, l''habitatge, a una ocupació digna i a integrar-se en el barri.

      Però en l''últim temps hem hagut d''atendre diversos casos per **qüestions de discriminació, racisme,
      xenofòbia**, casos que són producte de la propagació dels **delictes d''odi**. Pensaran que este
      tema s''ha d''abordar en altres espais, que és una qüestió de realitzar una faena més ardu de sensibilització.
      I és veritat. Però portem este tema al debat sobre l''estat de la ciutat perquè és una realitat
      que **l''augment dels discursos d''odi** està afectant la convivència en els nostres barris i en
      la nostra ciutat. Per més faena que realitzem el conjunt d''organitzacions i col·lectius d''esta
      ciutat en fomentar la convivència i contribuir a la construcció d''una **cultura de pau**, és difícil
      combatre els discursos que reprodueixen prejudicis i estereotips que tenen com a altaveu les institucions.
      Tots els informes sobre delictes d''odi confirmen un **creixement alarmant d''esta lacra social**
      a tot l''Estat espanyol i majoritàriament es cometen per **racisme i xenofòbia**. Les últimes dades
      les va proporcionar fa un parell de setmanes la Fiscalia General. **Es van incrementar un 300 %
      en 2023** respecte a 2022 i hui es fa públic que per part de la Fiscalia de València es va obrir
      en 2023 **més d''un centenar d''investigacions per odi**, la meitat d''estes per racisme i xenofòbia.
      I anuncia que **les dades de 2024 seran pitjors**.

      Estos són alguns exemples més recents de **missatges d''odi i actituds racistes** promoguts per
      representants institucionals que lesionen la convivència en la nostra ciutat i en la Comunitat i
      que propicien la **violència contra els nostres veïns i veïnes estrangers**. Missatges racistes
      vessats per una regidora de l''Ajuntament de València. Educació, que porta el PP, va permetre discriminar
      a xiquets i xiquetes….'
