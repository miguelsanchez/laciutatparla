- iv_id: 2025-06-26-005
  fields:
    text_original: 'Sóc **Kristal Calvo Leyba**, representant al **Consell Consultiu Trans** i també sóc
      administrativa i estudie educació social. I vull recordar-los ací que fa **77 anys**, bé, anem a
      parlar de **Drets humans**, que es va firmar la **Carta Internacional de Drets Humans** a l''ONU
      i que si algú ho recorda és un conjunt de documents que establixen els drets humans fonamentals
      a nivell mundial. Setanta set anys llargs ja que eixírem d''una guerra mundial i els que quedaren
      van pensar que això no podia o no devia tornar a passar. I veus per on en les que estem en aquestos
      moments. Drets humans estem parlant. Amb les **esmenes pactades entre PP i Vox** a la **Llei de
      mesures fiscals** de la Comunitat Valenciana es modifica la **Llei trans**, una llei d''acompanyament
      que revisa l''articulat d''una altra llei. O siga, els agrada molt tergiversar les coses. Clavar
      coses on no n''hi ha que clavar-les. Ja des del preàmbul del text es manté la intencionalitat de
      **no reconéixer a les persones trans**, ni cap aspecte de les realitats trans. Prenen com a justificació
      el dret dels altres, en molts casos sent els agressors els altres. Però estem donant-los drets a
      altres persones que pensen del que som nosaltres.

      **Article 3.** Vaig a comentar coses que s''estan canviant, que s''han canviat ja en la llei. Pèrdua
      de garanties en la protecció i el compliment. En l''article 3, on deia ‘el dret humà a l''autodeterminació
      de gènere’ s''elimina ‘humà’. Ja no és un dret humà, no és un dret humà. Val. On deia que es garantia
      el dret a ser tractades d''acord amb la seua identitat de gènere es canvia per ‘es promourà’, ja
      no és el garantix. Així és recurrent esmentar l''existència de diferents visions antropològiques
      i valoracions científiques que de vegades poden ser contraposades, sense aportar cap indici de quines
      són. I cite el que s''ha posat en la llei nova. Diu: ‘La no discriminació per motius d''identitat,
      assumpte molt lloable’, ja veus tu, és lloable, ‘no ha de confrontar-se amb altres drets, com ara
      la llibertat d''expressió i divulgació d''idees, la llibertat de dissidència en la recerca científica’.
      **Negacionisme pur i dur.** D''igual forma, són diverses les al·lusions a què les persones trans
      imposen un estil de vida al conjunt de la societat, a més de la possibilitat d''estar propiciant
      discriminacions en sentit contrari. Estem en el carrer espantant al personal.

      I ara anem al Consell Consultiu. **Invisibilització.** I molta gent parlava del borrado, borrado
      de las mujeres. Mujer trans, no binària. Ací, encara que no parega. Val? Que alguns no ho veuen.
      **Article 12, Consell Consultiu Trans.** Es canvia el nom ‘Consell Consultiu Trans’ per ‘Consell
      Consultiu de la Llei 8/2017’. Ara jo sóc la Llei 8/2017. O siga, n''hi ha gent que entrava en la
      càrcer i els ficaven un numeret. Doncs ens estan ficant un número per no ser persones. No som trans,
      som un número. Molt bé. Deixem de ser importants. S''específica que les associacions representades
      s''entendran també aquelles afectades, com les associacions de famílies i les associacions de pares
      en l''àmbit educatiu. És a dir, qualsevol associació de famílies. Això és molt fort. Podran entrar
      en el Consell entitats com el **Fòrum de la Família** i les **associacions catòliques** de mares
      i pares, que ja s''han mostrat contràries als **drets de les persones trans**. Així com a la introducció
      de la diversitat sexual i de gènere en l''àmbit educatiu. I tenint que recordar les seues intervencions
      quan s''estava treballant en la llei. Les associacions fins ara en el Consell Consulttiu Trans col·laborava
      amb la Generalitat en la planificació, disseny, execució i avaluació de les polítiques contemplades
      en la present llei, la qual cosa suposa la intervenció en l''àmbit sanitari, cultural, administratiu
      i esportiu. Però amb aquests canvis es **desnaturalitza el Consell Consultiu**, deixem de ser el
      subjecte.

      **Article 21, Actuacions en l''àmbit educatiu.** I algú més parlarà d''açò. Fent compatibles el
      dret de les persones que es manifesten com a trans amb els drets de totes les persones restants
      de la comunitat educativa en el referit a l''ús d''espais públics, lavabos, dutxes comunes, etcètera.
      Així mateix, es vetllarà pel respecte dels menors que poguessen sentir-se intimidats en privacitat.
      De quins menors parlem? Dels menors trans o de la resta de menors? Quina intimidació prevaldrà?
      Ja n''hi ha intimidacions, però es fica algo perquè algú té por de nosaltres. Som perilloses i ens
      assenyalen.

      Però tot açò, aquest text tracta de **limitar a les persones trans**, perdoneu. I des de Comisions
      volem que s''aplique el **Reial Decret 1026/2024** pel qual desenvolupem el conjunt planificat de
      les mesures per a la **igualtat i no discriminació** de les persones **LGTBI** a les empreses, amb
      **protocols contra l''LGTBIfòbia** que oferisquen protecció i coneixements clars. D''acord? Totes
      les empreses amb **més de 50 persones treballadores** en la seua plantilla tenen l''obligació de
      negociar i acordar aquestes mesures, implementar-les, així com el protocol enfront de l''assetjament
      LGTBIfòbic. Ara més que mai, **al treball sense armaris.**

      Moltes gràcies.'
    text_cas: 'Soy **Kristal Calvo Leyba**, representante en el **Consejo Consultivo Trans** y también
      soy administrativa y estudio educación social. Y quiero recordarles aquí que hace **77 años**, bueno,
      vamos a hablar de **Derechos humanos**, que se firmó la **Carta Internacional de Derechos Humanos**
      en la ONU y que si alguien lo recuerda es un conjunto de documentos que establecen los derechos
      humanos fundamentales a nivel mundial. Setenta y siete años largos desde que salimos de una guerra
      mundial, y los que quedaron pensaron que eso no podía ni debía volver a pasar. Y mira por dónde
      estamos en estos momentos. Estamos hablando de derechos humanos. Con las **enmiendas pactadas entre
      PP y Vox** a la **Ley de medidas fiscales** de la Comunitat Valenciana se modifica la **Ley trans**,
      una ley de acompañamiento que revisa el articulado de otra ley. O sea, les gusta mucho tergiversar
      las cosas. Clavar cosas donde no hay que clavarlas. Ya desde el preámbulo del texto se mantiene
      la intencionalidad de **no reconocer a las personas trans**, ni ningún aspecto de las realidades
      trans. Toman como justificación el derecho de los demás, en muchos casos siendo los agresores los
      demás. Pero les estamos dando derechos a otras personas que piensan lo que somos nosotras.

      **Artículo 3.** Voy a comentar cosas que se están cambiando, que ya se han cambiado en la ley. Pérdida
      de garantías en la protección y el cumplimiento. En el artículo 3, donde decía «el derecho humano
      a la autodeterminación de género» se elimina «humano». Ya no es un derecho humano, no es un derecho
      humano. Vale. Donde decía que se garantizaba el derecho a ser tratadas de acuerdo con su identidad
      de género se cambia por «se promoverá», ya no es el garantiza. Así es recurrente mencionar la existencia
      de diferentes visiones antropológicas y valoraciones científicas que a veces pueden ser contrapuestas,
      sin aportar ningún indicio de cuáles son. Y cito lo que se ha puesto en la ley nueva. Dice: «La
      no discriminación por motivos de identidad, asunto muy loable», ya ves tú, es loable, «no debe confrontarse
      con otros derechos, como la libertad de expresión y divulgación de ideas, la libertad de disidencia
      en la investigación científica». **Negacionismo puro y duro.** Igualmente, son varias las alusiones
      a que las personas trans imponen un estilo de vida al conjunto de la sociedad, además de la posibilidad
      de estar propiciando discriminaciones en sentido contrario. Estamos en la calle asustando al personal.

      Y ahora vamos al Consejo Consultivo. **Invisibilización.** Y mucha gente hablaba del borrado, borrado
      de las mujeres. Mujer trans, no binaria. Aquí, aunque no parezca. ¿Vale? Que algunos no lo ven.
      **Artículo 12, Consejo Consultivo Trans.** Se cambia el nombre «Consejo Consultivo Trans» por «Consejo
      Consultivo de la Ley 8/2017». Ahora yo soy la Ley 8/2017. O sea, había gente que entraba en la cárcel
      y les ponían un numerito. Pues nos están poniendo un número para no ser personas. No somos trans,
      somos un número. Muy bien. Dejamos de ser importantes. Se especifica que las asociaciones representadas
      se entenderán también aquellas afectadas, como las asociaciones de familias y las asociaciones de
      padres en el ámbito educativo. Es decir, cualquier asociación de familias. Esto es muy fuerte. Podrán
      entrar en el Consejo entidades como el **Foro de la Familia** y las **asociaciones católicas** de
      madres y padres, que ya se han mostrado contrarias a los **derechos de las personas trans**. Así
      como a la introducción de la diversidad sexual y de género en el ámbito educativo. Y teniendo que
      recordar sus intervenciones cuando se estaba trabajando en la ley. Las asociaciones hasta ahora
      en el Consejo Consultivo Trans colaboraban con la Generalitat en la planificación, diseño, ejecución
      y evaluación de las políticas contempladas en la presente ley, lo cual supone la intervención en
      el ámbito sanitario, cultural, administrativo y deportivo. Pero con estos cambios se **desnaturaliza
      el Consejo Consultivo**, dejamos de ser el sujeto.

      **Artículo 21, Actuaciones en el ámbito educativo.** Y alguien más hablará de esto. Haciendo compatibles
      el derecho de las personas que se manifiestan como trans con los derechos de todas las demás personas
      de la comunidad educativa en lo referido al uso de espacios públicos, lavabos, duchas comunes, etcétera.
      Asimismo, se velará por el respeto de los menores que pudieran sentirse intimidados en su privacidad.
      ¿De qué menores hablamos? ¿De los menores trans o del resto de menores? ¿Qué intimidación prevalecerá?
      Ya hay intimidaciones, pero se mete algo porque alguien tiene miedo de nosotras. Somos peligrosas
      y nos señalan.

      Pero todo esto, este texto trata de **limitar a las personas trans**, perdonen. Y desde Comisiones
      queremos que se aplique el **Real Decreto 1026/2024** por el que desarrollamos el conjunto planificado
      de las medidas para la **igualdad y no discriminación** de las personas **LGTBI** en las empresas,
      con **protocolos contra la LGTBIfobia** que ofrezcan protección y conocimientos claros. ¿De acuerdo?
      Todas las empresas con **más de 50 personas trabajadoras** en su plantilla tienen la obligación
      de negociar y acordar estas medidas, implementarlas, así como el protocolo frente al acoso LGTBIfóbico.
      Ahora más que nunca, **al trabajo sin armarios.**

      Muchas gracias.'
