      molestar, ferir, o pertorbar la tranquil·litat o l''ànim de ningú. Només bon rotllo. I **en castellà**,
      perquè m''entenguen. A vore, als polítics els he contat tot això, però hi ha una cosa que hem de
      tindre clara i que és bo que la tinguem clara. **Els partits són els seus militants**, no els seus
      votants. Les votants som les veïnes. **Els partits no representen les veïnes**.

      El Partit Popular són uns senyoretes. Sí, sí, uns senyoretes. A més, com a elogi. O igual m''he
      confós i ha sigut un lapsus. Mire, es veu que l''estime tant i li tinc tant d''aprecij que ja li
      diga senyoret Olano. Els partits polítics són uns senyors que s''han reunit i han decidit que són
      els partits polítics, però no representen les votants, ni tan sols les seues. Jo soc veïna d''un
      poble de València i no tinc ni puñetera idea de quina és la llista electoral. A mi mai ha vingut
