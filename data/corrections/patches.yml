- iv_id: 2025-06-26-009
  fields:
    text_original: 'Actúo en nombre y representación de la **Asociación Chrysallis Comunitat Valenciana**
      de Menores y Adolescentes Trans. Estamos aquí no como un ente. Estamos aquí como **madres, padres
      y familias** que formamos parte de esta asociación. Acompañamos a nuestras **hijas, hijos e hijes
      trans**. Venimos a hablar de **sus vidas, no de una ideología**, porque esto no es una ideología,
      no es una opinión. Es su realidad, su dignidad y sus derechos. Dignidad que desde este consistorio
      nos la han querido arrebatar y nos han **cambiado la Ley trans**. Derechos que han sido robados
      entre todos ustedes. Entre ellos también usted, señora Catalá, al votar a favor de los **recortes
      aprobados de la Ley trans** en las Cortes.

      **Vidas que corren peligro.** Ustedes están convirtiendo a nuestros menores que sean atacados por
      las calles de València. Vidas condicionadas al permiso de personas tránsfobas, como las personas
      que han votado el recorte de esta ley. **Vidas de infancias que están en pleno derecho**, que quieren
      y merecen ser felices, y que las instituciones deben proteger y defender, no atacar. Como madres
      nos sentimos **decepcionadas, estafadas y traicionadas** por ustedes. Entre ellas usted, señora
      Catalá. Pensábamos que nos iba a acompañar en el cariño y el cuidado de las personas más vulnerables.
      Han dejado a nuestras hijas e hijos desprotegidos, incluso para disfrutar de los espacios públicos
      que también pagamos las familias trans. Y ahora las familias y las personas que sean tránsfobas
      van a tener el derecho a dar y opinar sobre si nuestros menores pueden estar en esos entornos. Queremos
      que a estos niños y niñas se les defienda y no lo están haciendo.

      Por eso estamos aquí. Queremos decirlo con claridad y sin rodeos, el menosprecio que ustedes hacen
      hacia nuestros hijos nos está convirtiendo en **personas más resilientes y más fuertes**. Los aplausos
      y las caras de satisfacción mientras se recortaban derechos nos dolieron. Sí, nos dolieron como
      madres. Nos dolieron como personas que aman profundamente a sus hijas e hijos. Pero no nos doblegarán,
      ni lo harán. **Nuestros hijos, hijas e hijes seguirán existiendo.** Nosotros seguiremos apoyándoles,
      acompañándoles y amándoles. Y ustedes seguirán ignorantes, sin comprender que **la diversidad enriquece**.
      Que no es un trato de juego político, de cambio de cromos, sino de vidas reales. **Celebrar recortes
      a derechos no es hacer política, es hacer crueldad institucional.** Y queremos que lo sepan bien
      claro. **La Ley trans valenciana salvó y ha salvado vidas.** Ha permitido que nuestres hijes viven
      con autenticidad, con dignidad, con apoyo en sus centros escolares, en sanidad y en la sociedad.
      Y vamos a seguir trabajando para que así sea de nuevo, para que las personas que hacen ilegales
      **terapias de conversión**, como ha sido el caso de algunos sacerdotes, como otras personas, no
      vuelvan a esconder a nuestros niños en armarios. Y mucho menos a aquellos menores que no están acompañados
      por sus familias, que se puedan permitir hacer acompañamientos no adecuados ni sanos para los menores.
      Para que sus socios de bancada se avergüencen cuando reconozcan en la sonrisa de un niño feliz aquello
      que intentaron borrar.

      Por eso pedimos a este pleno, a este ayuntamiento, que **actúe con firmeza y valentía.** Que se
      manifieste públicamente en **defensa de la Ley trans** y **rechace los recortes aprobados.** Que
      exprese su compromiso con los **derechos de la infancia y juventud trans.** Y que garantice que
      los edificios municipales sean seguros para todes. Que demuestre que **València** sigue siendo una
      ciudad orgullosa de su diversidad, una ciudad donde se pueda crecer siendo quien eres. Nuestras
      hijas, hijos e hijes no son una amenaza. Son personas valientes, sensibles, fuertes, felices. Y
      lo único que piden es vivir en paz. ¿Tan difícil es de entender?'
    text_val: 'Actúe en nom i representació de l''**Associació Chrysallis Comunitat Valenciana** de Menors
      i Adolescents Trans. Estem ací no com un ens. Estem ací com **mares, pares i famílies** que formem
      part d''esta associació. Acompanyem a les nostres **filles, fills i filles trans**. Venim a parlar
      de **les seues vides, no d''una ideologia**, perquè açò no és una ideologia, no és una opinió. És
      la seua realitat, la seua dignitat i els seus drets. Dignitat que des d''este consistori ens han
      volgut arrabassar i ens han **canviat la Llei trans**. Drets que han sigut robats entre tots ustedes.
      Entre ells també vosté, senyora Catalá, en votar a favor dels **retalls aprovats de la Llei trans**
      a les Corts.

      **Vides que corren perill.** Ustedes estan convertint als nostres menors que siguen atacats pels
      carrers de València. Vides condicionades al permís de persones tránsfobes, com les persones que
      han votat el retall d''esta llei. **Vides d''infàncies que estan en ple dret**, que volen i mereixen
      ser feliços, i que les institucions han de protegir i defendre, no atacar. Com a mares ens sentim
      **decepcionades, estafades i traïdes** per ustedes. Entre elles vosté, senyora Catalá. Pensàvem
      que ens anava a acompanyar en l''afecte i la cura de les persones més vulnerables. Han deixat a
      les nostres filles i fills desprotegits, inclús per a gaudir dels espais públics que també paguem
      les famílies trans. I ara les famílies i les persones que siguen tránsfobes tindran el dret a donar
      i opinar sobre si els nostres menors poden estar en eixos entorns. Volem que a estos xiquets i xiquetes
      se''ls done defensa i no ho estan fent.

      Per això estem ací. Volem dir-ho amb claredat i sense rodejos, el menyspreu que ustedes fan cap
      als nostres fills ens està convertint en **persones més resilients i més fortes**. Els aplaudiments
      i les cares de satisfacció mentre es retallaven drets ens van doldre. Sí, ens van doldre com a mares.
      Ens van doldre com a persones que estimen profundament a les seues filles i fills. Però no ens doblegaran,
      ni ho faran. **Els nostres fills, filles i filles seguiran existint.** Nosaltres seguirem donant-los
      suport, acompanyant-los i estimant-los. I ustedes seguiran ignorants, sense comprendre que **la
      diversitat enriqueix**. Que no és un tracte de joc polític, de canvi de cromos, sinó de vides reals.
      **Celebrar retalls de drets no és fer política, és fer crueltat institucional.** I volem que ho
      sàpien ben clar. **La Llei trans valenciana va salvar i ha salvat vides.** Ha permés que les nostres
      filles i fills visquen amb autenticitat, amb dignitat, amb suport en els seus centres escolars,
      en la sanitat i en la societat. I continuarem treballant perquè així siga de nou, perquè les persones
      que fan il·legals les **teràpies de conversió**, com ha sigut el cas d''alguns sacerdots, com altres
      persones, no tornen a amagar als nostres xiquets en armaris. I molt menys a aquells menors que no
      estan acompanyats per les seues famílies, que es puguen permetre fer acompanyaments no adequats
      ni sans per als menors. Perquè els seus socis de bancada s''avergonyisquen quan reconeguen en el
      somriure d''un xiquet feliç allò que van intentar esborrar.

      Per això demanem a este ple, a este ajuntament, que **actue amb fermesa i valentia.** Que es manifeste
      públicament en **defensa de la Llei trans** i **rebutge els retalls aprovats.** Que expresse el
      seu compromís amb els **drets de la infància i joventut trans.** I que garantisca que els edificis
      municipals siguen segurs per a tots i totes. Que demostre que **València** continua sent una ciutat
      orgullosa de la seua diversitat, una ciutat on es puga créixer sent qui ets. Les nostres filles,
      fills i filles no són una amenaça. Són persones valentes, sensibles, fortes, felices. I l''única
      cosa que demanen és viure en pau. Tan difícil és d''entendre?'
