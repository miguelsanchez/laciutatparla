      que **las vecinas queramos subir a la EMT** antes que los turistas y no les parece mal que en **El
      Palmar pase un bus cada 50 minutos**. Sí, un autobús cada hora en un barrio de la tercera capital
      española. Pueden estar contentos de tenerla más larga que Barcelona. La espera del autobús, claro.

      Si vostés insistixen en que ací decidixen només els polítics, permeteu-me recordar una cosa elemental.
      **Sense les veïnes no n''hi ha ciutat**, no n''hi ha legitimitat i no n''hi ha democràcia. I per
      això estic ací de nou, per a deixar clar que mentres vostés reclamen el poder, **nosaltres l''exercim**.
      De bon rollet.

      Moltes gràcies.'
