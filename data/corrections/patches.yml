  fields:
    text_val: 'Bon dia. Estic ací hui en representació d''Anima Naturalis.

      Hui vull parlar de qui ha cuidat de veres, fins ara, dels animals dels centres de Benimamet i Natzaret.
      Qui sap d''animals, a Benimamet una associació protectora, a Natzaret el propi Ajuntament. Però
      també darrere, en bona part **voluntàries i voluntaris**, que dediquen el seu temps lliure, perquè
      **no hi havia pressupost per a més**. Menjar, passejos, **atenció diària**. Tot això porta anys
      eixint avant amb un **finançament insuficient**.

      Davant d''esta situació, l''Ajuntament podia reforçar el model o **privatitzar-lo**. Ha triat privatitzar-lo,
      traure la gestió de mans de qui sap d''animals i entregar-la a una empresa privada. **Externalitzar
      un servici així no és un detall administratiu**. Quan la gestió passa a una empresa privada, **el
      benestar dels animals deixa de ser l''objectiu** i es converteix en una partida de despesa. El control
      públic es redueix i les protectores i voluntaris que porten anys en els centres perden el seu paper.

      No estem en contra del privat per principi, sinó d''**externalitzar un servici on posar l''estalvi
      davant de la cura és un error**. Però sobretot, convé parlar de a qui s''ha entregat esta gestió.
      **L''activitat principal de la UTE és el de control de plagues**, no l''acollida d''animals. Un
      centre d''acollida existeix per a mantindre viu a cada animal, cuidar-lo i buscar-li una família.
      **Esta no és l''especialitat d''una empresa de gestió de plagues**. Li estem confiant allò més delicat
      a qui es dedica justament a una altra cosa. I una d''eixes empreses arrossega a més investigacions
      obertes per presumpte maltractament animal en altres ajuntaments de l''Estat. **Hi ha decisions
      que no es poden subcontractar**. Una decisió irreversible com una eutanàsia ha de ser en mans, perdó,
      ha d''estar en mans d''un veterinari municipal sense cap interés econòmic en el resultat.

      Protegir els animals abandonats és una responsabilitat pública. Per això demanem el seu suport a
      eixa moció. **Revertir la privatització** i tornar a una **gestió directa i municipal** al costat
      de les protectores que porten anys sostenint este treball, i **dotar eixos centres dels recursos
      que necessiten** de veres. És el raonable i és el just.

      Gràcies.'
