- iv_id: 2026-02-24-013
  fields:
    text_original: 'Buenos días. Intervengo hoy en nombre de **FAMPA València**, pero también como **mujer
      migrante**, argentina, madre y representante de la comunidad educativa de esta ciudad. Y quiero
      empezar por algo personal, porque lo personal también es político. En una intervención anterior
      en este Ayuntamiento un concejal de Vox decidió burlarse de **mi acento argentino** e imitarlo en
      tono despectivo. No fue una anécdota, fue una forma de **señalar, de marcar quién pertenece** y
      quién no, de intentar reducir un argumento político a una caricatura. Ese gesto resume perfectamente
      la lógica que hoy sustenta esta moción.


      No estamos ante una propuesta técnica, estamos ante **una propuesta ideológica** que vulnera principios
      básicos de nuestro ordenamiento jurídico. **El artículo 14 de la Constitución** Española proclama
      la igualdad ante la ley sin discriminación por razón de nacimiento, origen o cualquier otra condición.
      El artículo 27 reconoce el derecho a la educación y el artículo 10 sitúa la dignidad de la persona
      como fundamento del orden político y la paz social. ¿Es que no creéis en la Constitución? **Hablar
      de prioridad nacional** en el acceso a servicios públicos rompe frontalmente con estos principios.
      **Condicionar derechos básicos a la procedencia** no es constitucionalismo, es exclusión. Asimismo,
      hablar sobre **regularizaciones masivas** que debilitan a los cuerpos de seguridad del Estado mientras
      llamáis a auditar las concesiones de nacionalidades en los últimos años pone en vilo la labor de
      las mismas, que son quienes hacen un trabajo exhaustivo previo a conceder nacionalidades. ¿Dudáis
      de dicho trabajo?


      Desde la comunidad educativa sabemos que **el alumnado no es nacional o extranjero**, es alumnado.
      **Son niñas y niños con derechos**. La Convención sobre los Derechos del Niño, ratificada por este
      Estado, obliga a garantizar esos derechos sin discriminación alguna por el origen de sus familias.
      Se insiste en que la inmigración colapsa la educación, pero **lo que colapsa la educación no es
      la diversidad**, son **los recortes, la falta de planificación** y la insuficiencia de recursos.
      **Señalar a las familias migrantes** es una forma cómoda de desviar responsabilidades políticas.
      Odiáis al inmigrante pobre porque no os vi repudiar al **inmigrante rico** que compraba su residencia
      con las llamadas Golden Visa.


      Se habla de **efecto llamada**, pero el verdadero efecto que genera este tipo de discursos es el
      **efecto señalamiento**, la discriminación y xenofobia. Eso sí deteriora la convivencia. Y lo digo
      con claridad, **las familias migrantes no son una amenaza** para el Estado de bienestar. **Forman
      parte de él**, cotizan, trabajan, emprenden, cuidan y sostienen sectores esenciales de nuestra economía
      que no veo a ustedes en disposición de realizar. También participan en las AMPA, en los consejos
      escolares y en la vida comunitaria. Esta ciudad no es homogénea, nunca lo fue. **València es diversa,
      plural y mestiza**. Así como es la sociedad en mi país, fruto de la inmigración. Porque el pueblo
      español fue migrante por la guerra, el hambre, la desidia. Y ha vuelto a serlo. **Memoria, porque
      un pueblo sin ella** está condenado a repetir su historia.


      **La escuela pública valenciana** ha sido uno de los principales instrumentos de cohesión social.
      Desde FAMPA València defendemos **una educación pública inclusiva**, recursos suficientes para atender
      a todo el alumnado y políticas que fortalezcan la igualdad real. No discursos que la erosionen.
      Porque cuando en este pleno se normaliza la burla por el acento, se legitima la discriminación.
      Cuando se habla de **remigración**, se deshumaniza. Cuando se propone **retirar derechos por origen**,
      se socava el Estado de derecho. Y la democracia no se defiende excluyendo, se defiende garantizando
      derechos.


      Como argentina, elegí vivir aquí. Como madre, educo aquí. Como representante, defiendo aquí la escuela
      pública. Y mi acento no me resta legitimidad. Es prueba de que esta ciudad es más amplia que el
      miedo. **Frente al discurso del señalamiento**, reivindicamos derechos. **Frente a la política del
      miedo**, reivindicamos convivencia. **Frente a la exclusión**, reivindicamos democracia. **Ningún
      ser humano es ilegal**.


      Muchas gracias.'
    text_val: 'Bon dia. Intervinc hui en nom de **FAMPA València**, però també com a **dona migrant**,
      argentina, mare i representant de la comunitat educativa d''esta ciutat. I vull començar per una
      cosa personal, perquè allò personal també és polític. En una intervenció anterior en este Ajuntament
      un regidor de Vox va decidir burlar-se del meu **accent argentí** i imitar-lo en to despectiu. No
      va ser una anècdota, va ser una forma de **assenyalar, de marcar qui pertany** i qui no, d''intentar
      reduir un argument polític a una caricatura. Eixe gest resumeix perfectament la lògica que hui sustenta
      esta moció.


      No estem davant d''una proposta tècnica, estem davant de **una proposta ideològica** que vulnera
      principis bàsics del nostre ordenament jurídic. **L''article 14 de la Constitució** Espanyola proclama
      la igualtat davant la llei sense discriminació per raó de naixement, origen o qualsevol altra condició.
      L''article 27 reconeix el dret a l''educació i l''article 10 situa la dignitat de la persona com
      a fonament de l''orde polític i de la pau social. És que no creieu en la Constitució? **Parlar de
      prioritat nacional** en l''accés a serveis públics trenca frontalment amb estos principis. **Condicionar
      drets bàsics a la procedència** no és constitucionalisme, és exclusió. Així mateix, parlar de **regularitzacions
      massives** que debiliten els cossos de seguretat de l''Estat mentre demaneu auditar les concessions
      de nacionalitats en els últims anys posa en perill la tasca d''estos, que són els que fan un treball
      exhaustiu previ a concedir nacionalitats. Dubteu d''eixe treball?


      Des de la comunitat educativa sabem que **l''alumnat no és nacional o estranger**, és alumnat. **Són
      xiquetes i xiquets amb drets**. La Convenció sobre els Drets de l''Infant, ratificada per este Estat,
      obliga a garantir eixos drets sense discriminació alguna per l''origen de les seues famílies. S''insistix
      que la immigració col·lapsa l''educació, però **el que col·lapsa l''educació no és la diversitat**,
      són **les retallades, la falta de planificació** i la insuficiència de recursos. **Assenyalar les
      famílies migrants** és una forma còmoda de desviar responsabilitats polítiques. Odieu l''immigrant
      pobre perquè no us vaig veure repudiar l''**immigrant ric** que comprava la seua residència amb
      les anomenades Golden Visa.


      Es parla d''**efecte crida**, però el verdader efecte que genera este tipus de discursos és l''**efecte
      assenyalament**, la discriminació i la xenofòbia. Això sí que deteriora la convivència. I ho dic
      amb claredat, **les famílies migrants no són una amenaça** per a l''Estat del benestar. **Formen
      part d''ell**, cotitzen, treballen, emprenen, cuiden i sostenen sectors essencials de la nostra
      economia que no veig a vosaltres disposats a realitzar. També participen en les AMPA, en els consells
      escolars i en la vida comunitària. Esta ciutat no és homogènia, mai no ho va ser. **València és
      diversa, plural i mestissa**. Així com ho és la societat del meu país, fruit de la immigració. Perquè
      el poble espanyol va ser migrant per la guerra, la fam, la desídia. I ha tornat a serho. **Memòria,
      perquè un poble sense ella** està condemnat a repetir la seua història.


      **L''escola pública valenciana** ha sigut un dels principals instruments de cohesió social. Des
      de FAMPA València defensem **una educació pública inclusiva**, recursos suficients per a atendre
      tot l''alumnat i polítiques que enforteixen la igualtat real. No discursos que l''erosionen. Perquè
      quan en este ple es normalitza la burla per l''accent, es legitima la discriminació. Quan es parla
      de **remigració**, es deshumanitza. Quan es proposa **retirar drets per origen**, es soscava l''Estat
      de dret. I la democràcia no es defén excloent, es defén garantint drets.


      Com a argentina, vaig triar viure ací. Com a mare, educo ací. Com a representant, defenc ací l''escola
      pública. I el meu accent no em resta legitimitat. És prova que esta ciutat és més àmplia que la
      por. **Davant del discurs de l''assenyalament**, reivindiquem drets. **Davant de la política de
      la por**, reivindiquem convivència. **Davant de l''exclusió**, reivindiquem democràcia. **Cap ésser
      humà és il·legal**.


      Moltes gràcies.'
