  fields:
    text_val: 'Bon dia.


      COCEMFE València, la **Federació d''Associacions de Persones amb Discapacitat** Física i Orgànica
      de la Província de València du des dels seus inicis, **més de dues dècades**, defensant els **drets
      de les persones amb discapacitat** i denunciant totes aquelles **faltes d''accessibilitat** que
      ens hem anat trobant dia rere dia.


      S''han fet algunes actuacions per a millorar la nostra qualitat de vida i avançar cap a la **integració,
      la normalització, la inclusió**. Entre tots, hem anat aconseguint una **major conscienciació**,
      un major compromís i que la nostra ciutat siga més accessible.


      Malgrat els avanços en accessibilitat a València, l''**existència de barreres en tots els àmbits**
      és una realitat que vulnera els drets i llibertats de les persones amb discapacitat i la seua **igualtat
      d''oportunitats**.


      La **Convenció de l''ONU** sobre els drets de les persones amb discapacitat obliga a provar i promulgar
      **normes d''accessibilitat** i a supervisar-les, identificar i **eliminar els obstacles i barreres**
      a l''accessibilitat, així com a proporcionar els recursos humans i econòmics necessaris a este efecte.


      Ni el cost d''eliminació de barreres ni les mesures d''austeritat poden ser arguments per a evitar
      implantar l''accessibilitat. L''obligació d''establir-la –que també s''aplica a monuments culturals
      i històrics del Patrimoni Nacional– és incondicional per a entitats públiques i privades, tant en
      zones urbanes com rurals, sent la seua carència o denegació un **acte de discriminació per raó de
      discapacitat**.


      Volem:


      L''**aplicació de la Llei General** dels drets de les persones amb discapacitat i la seua inclusió
      social.


      **Accessibilitat universal** en tots els productes, entorns, béns i serveis, perquè totes les persones
      puguen fer ús d''ells, incloses les persones amb discapacitat.


      Una **llei d''infraccions i sancions** que garantisca l''accessibilitat, que vele per l''aplicació
      efectiva d''esta norma i acabe amb la **impune vulneració de drets** de les persones amb discapacitat
      en matèria d''accessibilitat (encara que existeix un règim d''infraccions i sancions inclòs en la
      dita llei, no s''està aplicant per als productes, entorns, béns i serveis els terminis per a ser
      accessibles dels quals ja han expirat).


      Proposem la **posada en marxa d''una estratègia** sobre accessibilitat en la nostra ciutat, que
      contemple una anàlisi profunda de la situació i mesures concretes i eficaces per a avançar cap a
      una **ciutat per a totes les persones i lliure de barreres**.


      L''accessibilitat no sols beneficia les persones amb discapacitat. Un món accessible és un món per
      a totes les persones: còmode, modern i integrador. Quan un entorn, producte, bé o servei pot ser
      utilitzat pel nostre grup social també són més "amistosos" per a la resta de la població i la societat
      en el seu conjunt gaudeix més de les zones que són més còmodes per a totes les persones.


      En definitiva, volem que es garantisquen els nostres **drets, llibertats, vida independent** i la
      nostra participació. **Accessibilitat universal** per a les persones amb i sense discapacitat, per
      a totes les persones.


      Moltes gràcies.'
