- iv_id: 2022-10-21-006
  fields:
    text_val: 'Bon dia, senyor alcalde, regidores.


      Com hui es debat **l''estat de la ciutat**, nosaltres anem a contar-li, senyor Ribó, **quin és l''estat
      de Penya-roja**, que crec que seguirà sent així perquè, segons he sentit, **no va a adjudicar res
      al nostre barri**. Fa dos anys ens reunirem amb el regidor de Jardineria i ens va dir que tots els
      problemes de la jardineria i la neteja municipal es devien a la **contrata de jardineria i neteja
      realitzada el 2015** per un govern anterior. El mateix ens va dir la regidora de Cultura, que tots
      els problemes de la jardineria i la neteja municipal es devien a la contrata de l''any 2015. Este
      contracte es va establir per a quatre anys, però ha estat vigent fins fa un mes, **quasi set anys**,
      i ara s''ha adjudicat a **les mateixes dos mercantils** el desempenyament de les quals havia generat
      queixes entre el veïnat. L''única diferència és que **el contracte actual ara és més car**. El nou
      contracte va a canviar alguna cosa, senyor alcalde? Per què un contracte tan nefast s''ha demorat
      tres anys més? A Penya-roja no notem res de nou. El carrer Illa de Córsega, l''avinguda Balears,
      el carrer 3 d''abril de 1979, el carrer Vicent Raga, el tram central del carrer Eduardo Boscà, tots
      estos trams estan **plens d''alcorques buits o arbres talats**. Els alcorques de Penya-roja **continuen
      plens de mala herba**, les palmeres **continuen sense podar** i l''escassa zona de gespa **continua
      plena de clapes**.


      Com bé li vam dir al regidor de Plagues fa tan sols uns dies, a més de la biodiversitat dels alcorques
      i la sostenibilitat dels arbres talats ara tenim **una nova fauna: les rates**. Rates que segons
      l''alcalde de la Junta de Districte no existien. Les trobem als setos, en els arbres sense podar,
      en els alcorques plens de malesa i **morts pels carrers**.


      Han aconseguit que **tots els barris de València siguen iguals** a conseqüència de la seua gestió,
      perquè tots tenen rates, tots tenen mala herba als seus alcorques i en tots s''assequen i es moren
      arbres a conseqüència de la falta de cures dels serveis municipals que **prefereixen talar abans
      que protegir**. Com va passar també amb els **nou arbres de l''Alameda talats** a l''alba perquè
      entorpia un carril bici que podria haver-se reubicat per l''arcen i possiblement precursora d''una
      altra tala massiva que s''hauria produït si no haguérem alçat la veu dient: **Salvem els arbres
      de l''Alameda, Salvem els arbres de Penya-roja**.


      Entenem que siguem molestos, però **som necessaris per a defendre els drets** dels veïns de Penya-roja.
      En l''última Junta de Districte els va molestar especialment que qüestions que **València poguera
      ser capital verda europea**, una ciutat que té **3.500 alcorques buits** i que **perd massa verda
      any rere any** com a conseqüència de la deficient gestió de jardineria. Vostés es van enfadar molt,
      no tenen més que demostrar que ens equivoquem. L''altre dia ens van notificar que **el jardí 3 d''abril
      costa 3 milions d''euros**. Creiem que és una xifra molt alta, però acceptem-la. Amb 3 milions d''euros
      podríem tindre els millors jardins de València, no? Doncs executen-ho. Posen-ho en **els nous pressupostos
      municipals**. Demostren que aposten per les zones verdes de la nostra ciutat i que construeixen
      un jardí que els veïns porten esperant molts anys, molts. Perquè **obres són amors i no bones raons**.
      Demostren que ens equivoquem. Se''ls estem demanant, **deixen de talar arbres, repoblen els alcorques
      buits i executen les zones verdes**.


      Però no és l''únic problema del nostre barri. A més del **centre de salut** que ja hem comentat
      en diverses ocasions, manquem d''**infraestructures culturals i socials**. Ens van dir que es rehabilitaria
      l''**alqueria del Tenis**, no ho he sentit en esta xarrada que ha donat vostè, una casa de principis
      del segle XX amb ceràmica antiga en la seua façana que es troba en el carrer Astúries. Estem esperant
      encara que s''adjudique el **projecte de l''obra de rehabilitació**. Quan es rehabilitarà? Per a
      la campanya electoral, per exemple? Per cert, parlant de patrimoni, quan faran bé de rellevància
      local **les naus de Cros**? **Un dels exemples més destacats del patrimoni industrial valencià**.
      Perquè sabem que es va portar a la Comissió d''Urbanisme i vostés, els que governen, **van votar
      en contra**. Quan protegiran les naus?


      Bé, doncs acabe dient-li que, Sr. Alcalde, demostre que ens equivoquem, que som uns exagerats, que
      ens queixem sense raó. El que necessita el nostre barri són **inversions**. Sense inversió no hi
      ha pressupost. També volem dir-li que si va, els examinarem, doncs ahí va la nostra nota. **La mateixa
      que la inversió en el nostre barri, zero**.'
