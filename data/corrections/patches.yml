- iv_id: 2024-09-16-1-016
  fields:
    text_val: 'Bon dia, **alcaldessa, regidors i regidores**, entitats presents.

      Des de **FANUCOVA** -**FANUCOVA és Famílies Nombroses de la Comunitat Valenciana**-.

      Bé, en principi recordar que les famílies nombroses de la Comunitat Valenciana i les associacions
      de famílies nombroses som unes associacions molt diverses, perquè de tant en tant se''ns etiqueta
      doncs des de distints aspectes en els quals ens fa un flaco favor, especialment segons a quin tipus
      de famílies nombroses. A la ciutat de **València** som al voltant de **12.500 famílies**, seixanta,
      seixanta-cinc mil ciutadans i ciutadanes. Pensem que aportem molt. Som **un actiu estratègic** perquè
      el que estem fent és aportar capital, sobretot **capital humà** que és el que tenim. Consumim, aportem
      molts serveis socials, no solament dins de les nostres famílies sinó que, vaja, tenim dades que
      la major part de les famílies nombroses tenim membres en distints tipus i molt variats d''associacions
      sense ànim de lucre. Som una part de **la solució a l''hivern demogràfic** que ens ve en un futur,
      un dels grans problemes que tindrem en els pròxims anys i que val la pena apostar per les famílies
      nombroses. I no solament és això, és que és de justícia.

      I valorar, que és al que venim a l''Ajuntament en aquest any. Comencem per les coses positives.
      Nosaltres ens reunim amb els distints grups abans de les eleccions, que és veritat que ens diuen
      que faran moltes coses. I en principi, bé, amb el tema -ho ha comentat abans l''alcaldessa- respecte
      al tema de l''**IBI**, és veritat que ha sigut una cosa que valorem molt, és a dir, que el **90
      per 100** dins de l''IBI que es bonifique a les famílies nombroses de caràcter especial i el **60
      per 100** en les de general, sense tindre en compte que és molt important el tema de renda i el
      tema que la casa siga gran o petita. Lògicament, si som famílies nombroses, les nostres cases han
      de ser, com més nombroses, més grans. I al final arriba un moment en què com la casa és gran, doncs
      llavors ja no podem bonificar-la. Doncs clar, són grans. I és un tema que a més és la primera ciutat
      gran de la Comunitat Valenciana. És veritat que hi ha altres municipis més petits que l''han posat
      en marxa. La posem com a exemple a **Alacant**, a **Castelló**, a **Elx**, a unes quantes més. Sí
      que és veritat que hi ha molts municipis més petits que tenen la mateixa mesura.

      Estem contents perquè s''haja creat la **Regidoria de Família**, que fins ara no hi era. Estem contents
      perquè s''ha celebrat i es tornarà a celebrar el **Dia de la Família**. S''ha celebrat el **Dia
      de la Infància**. Demanem també i creiem que s''ha començat, però encara falta un poquet, l''**adecentament
      de tots els parcs infantils**, de les escoles municipals. I és veritat que també s''ha participat
      en molts dels actes que nosaltres hem organitzat, doncs hem tingut l''assistència bé siga de les
      regidores que en este moment hi ha hagut, de la regidora de Família i de l''alcaldessa.

      Però ens queden bastantes coses també per fer i per aconseguir. Tenim problemes en diversos aspectes.
      El **tema d''habitatge**. Si ja és un problema comprar una casa petita, imagineu-vos una cosa gran,
      quan a més pràcticament ara s''han deixat de construir pisos grans. I d''alguna manera, en fer les
      distintes lleis caldrà també de alguna manera que aconseguir que es facen també alguns pisos grans.
      En el tema del transport també necessitem, encara que ja hi ha una part. És veritat que hi ha molts
      dels aspectes que ens afecten que no solament afecten una administració, sinó que al final la tenen
      que fer en conjunt, bé siga amb la comunitat autònoma o amb l''administració central. Però el **tema
      de transport** també és important. Tenim també una sèrie de **bonificacions** que moltes vegades
      ni tan sols podem aplicar perquè no es poden aplicar a la vegada que la resta, amb la qual cosa
      ens fan triar. O ets jove o ets família nombrosa. Doncs agafa una de les dues, però al final no
      se''ns deixa sumar-les.

      En el tema de les **taxes** també creiem que d''alguna manera hem de millorar. De vegades les taxes
      ens perjudiquen molt. Sembla ser que ve una altra taxa nova a nivell estatal, però que al final
      arribarà a tots els ajuntaments, que és la **taxa de fems**. I al final sempre se''ns diu és que
      vosaltres, les famílies nombroses, feu molta fem. Clar, som molts, però proporcionalment som menys.
      I al final, d''aquests temes, igual que passa en molts ajuntaments amb el tema de l''aigua, com
      consumiu més aigua, el preu de l''aigua és molt més car. Clar, però és que divideix entre quants
      sou.

      Necessitem millores en la **conciliació**. És veritat que enguany és més, la gratuïtat per a de
      0 a 3 doncs ja es dóna per a tot el món. Però ahí necessitem també les famílies nombroses doncs
      que se''ns valore en el tema de **activitats extraescolars**, **bonificacions**, **beques de menjador**.
      També volem que se''ns considere en la justa mesura. I dins de la conciliació també doncs perquè
      d''alguna manera es valore per a les oposicions, els empleats municipals i alguna cosa més.

      Bé, simplement agrair que se''ns permeta participar en actes com este.

      Moltes gràcies.'
    text_original: 'Buenos días, **alcaldesa, concejales y concejalas**, entidades presentes.

      Desde **FANUCOVA** -**FANUCOVA es Familias Numerosas de la Comunidad Valenciana**-.

      Bueno, en principio recordar que las familias numerosas de la Comunidad Valenciana y las asociaciones
      de familias numerosas somos unas asociaciones muy diversas, porque de vez en cuando se nos etiqueta
      pues desde distintos aspectos en los cuales nos hace un flaco favor, especialmente según a qué tipo
      de familias numerosas. En la ciudad de **València** somos alrededor de **12.500 familias**, sesenta,
      sesenta y cinco mil ciudadanos y ciudadanas. Pensamos que aportamos mucho. Somos **un activo estratégico**
      porque lo que estamos haciendo es aportar capital, sobre todo **capital humano** que es el que tenemos.
      Consumimos, aportamos muchos servicios sociales, no solamente dentro de nuestras familias sino que,
      vamos, tenemos datos de que la mayor parte de las familias numerosas tenemos miembros en distintos
      tipos y muy variados de asociaciones sin ánimo de lucro. Somos una parte de **la solución al invierno
      demográfico** que nos viene en un futuro, uno de los grandes problemas que vamos a tener en los
      próximos años y que merece la pena apostar por las familias numerosas. Y no solamente es eso, es
      que es de justicia.

      Y valorar, que es a lo que venimos al Ayuntamiento en este año. Empezamos por las cosas positivas.
      Nosotros nos reunimos con los distintos grupos antes de las elecciones, que es verdad que nos dicen
      que van a hacer muchas cosas. Y en principio, bueno, con el tema -lo ha comentado antes la alcaldesa-
      con respecto al tema del **IBI**, es verdad que ha sido algo que valoramos mucho, es decir, que
      el **90 por 100** dentro del IBI que se bonifique a las familias numerosas de carácter especial
      y el **60 por 100** en las de general, sin tener en cuenta que es muy importante el tema de renta
      y el tema de que la casa sea grande o pequeña. Lógicamente, si somos familias numerosas, nuestras
      casas tienen que ser, mientras más numerosas, más grandes. Y al final llega un momento en el que
      como la casa es grande, pues entonces ya no podemos bonificarla. Pues claro, son grandes. Y es un
      tema que además es la primera ciudad grande de la Comunidad Valenciana. Es verdad que hay otros
      municipios más pequeños que la han puesto en marcha. La ponemos como ejemplo a **Alicante**, a **Castellón**,
      a **Elche**, a otras muchas. Sí es verdad que hay muchos municipios más pequeños que tienen la misma
      medida.

      Estamos contentos por el que se haya creado la **Concejalía de Familia**, que hasta ahora no estaba.
      Estamos contentos porque se ha celebrado y se va a celebrar otra vez el **Día de la Familia**. Se
      ha celebrado el **Día de la Infancia**. Pedimos también y creemos que se ha empezado, pero aún falta
      un poquito, el **adecentamiento de todos los parques infantiles**, de las escuelas municipales.
      Y es verdad que también se ha participado en muchos de los actos que nosotros hemos organizado,
      pues hemos tenido la asistencia bien sea de de las concejalas que en este momento ha habido, de
      la concejala de Familia y de la alcaldesa.

      Pero nos quedan bastantes cosas también por hacer y por conseguir. Tenemos problemas en varios aspectos.
      El **tema de vivienda**. Si ya es un problema comprar una casa pequeña, imaginaros una cosa grande,
      cuando además prácticamente ahora se han dejado de construir pisos grandes. Y de alguna forma, al
      hacer las distintas leyes habrá que también de alguna forma que conseguir que se hagan también algunos
      pisos grandes. En el tema del transporte también necesitamos, aunque ya hay una parte. Es verdad
      que hay muchos de los aspectos que nos afectan que no solamente afecta a una administración, sino
      que al final la tienen que hacer en conjunto, bien sea con la comunidad autónoma o con la administración
      central. Pero el **tema de transporte** también es importante. Tenemos también una serie de **bonificaciones**
      que muchas veces ni siquiera podemos aplicar porque no se pueden aplicar a la vez que el resto,
      con lo cual nos hacen elegir. O eres joven o eres familia numerosa. Pues coge una de las dos, pero
      al final no se nos deja sumarlas.

      En el tema de las **tasas** también creemos que de alguna forma tenemos que mejorar. A veces las
      tasas nos perjudican mucho. Parece ser que viene otra tasa nueva a nivel estatal, pero que al final
      llegará a todos los ayuntamientos, que es la **tasa de basuras**. Y al final siempre se nos dice
      es que vosotros, las familias numerosas, hacéis mucha basura. Claro, somos muchos, pero proporcionalmente
      somos menos. Y al final, de estos temas, igual que pasa en muchos ayuntamientos con el tema del
      agua, como consumís más agua, el precio del agua es mucho más caro. Claro, pero es que divide entre
      cuántos sois.

      Necesitamos mejoras en la **conciliación**. Es verdad que este año es más, la gratuidad para de
      0 a 3 pues ya se da para todo el mundo. Pero ahí necesitamos también las familias numerosas pues
      tener que se nos valore en el tema de **actividades extraescolares**, **bonificaciones**, **becas
      de comedor**. También queremos que se nos considere en la justa medida. Y dentro de la conciliación
      también pues para que de alguna forma se valore para las oposiciones, los empleados municipales
      y alguna cosa más.

      Bueno, simplemente agradecer que se nos permita participar en actos como este.

      Muchas gracias.'
