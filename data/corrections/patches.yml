- iv_id: 2025-12-01-1-007
  fields:
    text_original: 'Hola, bon dia.

      Agraïm a l''**Associació de Veïns i Veïnes de la Torre** per cedir-nos la paraula a una plataforma
      que represente de **moviments socials, veïnals i sindicals** per l''**habitatge del País Valencià**
      i de la ciutat de València.

      Bé, el tema de la **contenció de preus** i de les **polítiques d''habitatge**, com tot el món sap,
      és un tema fonamental. És tan complexe que, si més no, tot el mon té explicacions per a fer el que
      vullga. Per tant, el que demanem abans que res és que per a poder avançar caldria traure fora **estratègies
      de partit espúries** que busquen fonamentalment una rendibilitat pròpia en lloc del benefici col·lectiu.
      I en eixa línia, a nosaltres ens interessa aportar algun punt de vista relacionat amb l’**emergència
      habitacional**.

      Els **preus de lloguer alts** estan relacionats amb diverses coses, amb moltes, però jo només que
      vaig a dir un parell d''elles. La primera, amb els **desnonaments**. Cada vegada que hi ha un desnonament
      hi ha una família que necessita una vivenda i, en el marc de l''argumentari de l''oferta i de la
      demanda, bé, contra més desnonaments n’hi haja, més necessitats de vivenda. Si en el **primer semestre
      del 2025** hi ha aproximadament unes **275 famílies** que han sigut desnonades a la **ciutat de
      València**, moltes d''elles, per cert, fetes perquè tenien una vivenda, no van poder pagar, van
      tindre que fer un dació i després el lloguer que la banca rescatada va fer al fons voltor, ara que
      estos no volen ja renovar-lo, doncs bé, totes eixes famílies necessiten una llar. És veritat també
      que n’hi ha quantitat de desnonaments produïts per impagament ja que moltes famílies, abans de quedar-se
      al carrer o obligades a un procés de **gentrificació galopant**, han tingut que contratar preus
      que en molts casos no poden pagar.

      També està relacionat l''**augment de preus** clarament amb la venda de vivendes. ''Nosaltres estem
      acabant amb el nostre patrimoni o una part d''elles''. No son paraules nostres. Una empresa com
      la **Engels Volker** diu clarament que el **30 per cent dels habitatges** que es compren al **País
      Valencià**, es compren per **capital estranger** i per a especular, això ho diem nosaltres. Bé,
      clar, en la lògica del mercat normalment quan hi ha un tema d''oferta i demanda la conclusió és
      que els problemes venen fonamentalment perquè falten vivendes, falten cases. És a dir, hi ha un
      dèficit que això encarix los preus. Bé, i la recepta normalment és construir, construir més.

      Bé, nosaltres volem fer una sèrie d''observacions i que ens contestem si volem a algunes preguntes.
      La primera, en aquest moment la muntada de preus no és sols d’Espanya, és generalitzada a **tota
      Europa**. N’hi ha a tota Europa una oferta restringida i un desequilibri tan gran com el que nosaltres
      volem argumentar com a causa fonamental? Segona, es diu que fan falta vivendes. Segurament sí, però
      ens preguntem: A on està el superàvit acumulat de **més d''1 milió de vivendes** del **2011 al 2021**
      que es van construir més per damunt de les llars que es necessitaven? Per una altra banda, es diu
      que al construir moltes vivendes comportarà necessàriament la **baixada de preus**. Això, tota la
      gent que tenim ja una certa edat, almenys que hem viscut la **crisi del 2008**, sabem que contra
      més construcció, bé que va produir-se simultàniament l''edificació amb l''alegria de milers de vivendes
      i la muntada sense limit de preus. Per tant, eixes soles no són la raó. També podríem parlar del
      tema del sòl i de com en Espanya es van transformar en ús agrari més que en Europa per a altres
      qüestions. Què dir la importància que té el **parc públic** per a incidir en la regulació de preus.
      Quin parc públic tenim a la ciutat de València? Diguem-ho clarament i a partir d''ell podrem aclarir.

      En fi, creiem que hi han raons extrajudicials. Fonamentalment una **política que entén la vivenda
      com una mercaderia**. I a més, creiem que no hi ha capacitat, valor, valentia per a ficar límits
      quan el que se pretén és simplement tindre més i més beneficis. I senyors i senyores de l''Ajuntament,
      si no fiqueu límits, **la ciutat explotarà**. I explotarà perquè la gent també volem tindre llibertat
      per a tindre una vivenda. També volem tindre llibertat per a tindre una llar. També volem tindre
      una llar per a sacsejats o assetjats en les nostres vivendes per la gent que ens expulsa i impedix
      el gaudi.

      En fi, nosaltres mesures que proposem. El primer de tot, caldria fer un **estudi seriós i real**
      de quines necessitats i quines disponibilitats tenim. Seriós i real per a saber què necessitem.
      Van? I a partir de treballar. Nosaltres pensem que la resposta no és sols de l''Ajuntament, és també
      de la **administració autonòmica** i també de l''**administració estatal**. No podem extendre’ns
      molt perquè no n''hi ha temps, només anem a dir quatre pinzellades i demanem una reunió a l''alcaldessa
      des de **Juntes per l''Habitatge** per a poder plantejar totes estes alternatives amb tranquil·litat.
      Però, si més no, estem per totes les mesures que facen falta. Totes. No anem a votar aquelles en
      contra que ha dit el PSOE o el govern de Madrid o el no sé cuantos, no sé qué. Anem a estudiar quins
      mecanismes poden fer que hi haja projectes de vida que no es trunquen.

      Et comprenc perfectament. Només quinze segons més, per favor. Mireu a finals d''este mes, a finals
      de desembre, el **31 del dotze** s''acaba l’**escut social**. N''hi han unes quantes centenars de
      famílies de l''Ajuntament que es van a quedar al carrer si no es **prorroga l''escut social**. Hauríem
      de demanar la **prorrogació ineludible** d''eixe escut social. Si no, sou responsables, com tots,
      però vosaltres també, del que pot ocórrer. I res més.'
    text_cas: 'Hola, buenos días.

      Agradecemos a la **Asociación de Vecinos y Vecinas de la Torre** por cedernos la palabra a una plataforma
      que represente a **movimientos sociales, vecinales y sindicales** por la **vivienda del País Valencià**
      y de la ciudad de València.

      Bueno, el tema de la **contención de precios** y de las **políticas de vivienda**, como todo el
      mundo sabe, es un tema fundamental. Es tan complejo que, por lo menos, todo el mundo tiene explicaciones
      para hacer lo que quiera. Por lo tanto, lo que pedimos antes que nada es que, para poder avanzar,
      habría que sacar fuera **estrategias de partido espurias** que buscan fundamentalmente una rentabilidad
      propia en lugar del beneficio colectivo. Y en esa línea, a nosotros nos interesa aportar algún punto
      de vista relacionado con la **emergencia habitacional**.

      Los **precios de alquiler altos** están relacionados con varias cosas, con muchas, pero yo solo
      voy a decir un par de ellas. La primera, con los **desahucios**. Cada vez que hay un desahucio hay
      una familia que necesita una vivienda y, en el marco del argumentario de la oferta y de la demanda,
      bueno, cuantos más desahucios haya, más necesidades de vivienda. Si en el **primer semestre de 2025**
      hay aproximadamente unas **275 familias** que han sido desahuciadas en la **ciudad de València**,
      muchas de ellas, por cierto, hechas porque tenían una vivienda, no pudieron pagar, tuvieron que
      hacer una dación y después el alquiler que la banca rescatada hizo al fondo buitre, ahora que estos
      no quieren ya renovarlo, pues bien, todas esas familias necesitan un hogar. Es verdad también que
      hay cantidad de desahucios producidos por impago ya que muchas familias, antes de quedarse en la
      calle o obligadas a un proceso de **gentrificación galopante**, han tenido que contratar precios
      que en muchos casos no pueden pagar.

      También está relacionado el **aumento de precios** claramente con la venta de viviendas. ''Nosotros
      estamos acabando con nuestro patrimonio o una parte de ellas''. No son palabras nuestras. Una empresa
      como la **Engels Volker** dice claramente que el **30 por ciento de las viviendas** que se compran
      en el **País Valencià**, se compran por **capital extranjero** y para especular, eso lo decimos
      nosotros. Bueno, claro, en la lógica del mercado normalmente cuando hay un tema de oferta y demanda
      la conclusión es que los problemas vienen fundamentalmente porque faltan viviendas, faltan casas.
      Es decir, hay un déficit que eso encarece los precios. Bueno, y la receta normalmente es construir,
      construir más.

      Bueno, nosotros queremos hacer una serie de observaciones y que os contestéis si queréis a algunas
      preguntas. La primera, en este momento la subida de precios no es solo de España, es generalizada
      en **toda Europa**. ¿Hay en toda Europa una oferta restringida y un desequilibrio tan grande como
      el que nosotros queremos argumentar como causa fundamental? Segunda, se dice que hacen falta viviendas.
      Seguramente sí, pero nos preguntamos: ¿Dónde está el superávit acumulado de **más de 1 millón de
      viviendas** del **2011 al 2021** que se construyeron de más por encima de los hogares que se necesitaban?
      Por otra parte, se dice que al construir muchas viviendas comportará necesariamente la **bajada
      de precios**. Esto, toda la gente que tenemos ya cierta edad, por lo menos que hemos vivido la **crisis
      del 2008**, sabemos que cuanta más construcción, bueno, que se produjo simultáneamente la edificación
      con la alegría de miles de viviendas y la subida sin límite de precios. Por tanto, esas solas no
      son la razón. También podríamos hablar del tema del suelo y de cómo en España se transformaron en
      uso agrario más que en Europa para otras cuestiones. ¿Qué decir de la importancia que tiene el **parque
      público** para incidir en la regulación de precios? ¿Qué parque público tenemos en la ciudad de
      València? Digámoslo claramente y a partir de él podremos aclarar.

      En fin, creemos que hay razones extrajudiciales. Fundamentalmente una **política que entiende la
      vivienda como una mercancía**. Y además, creemos que no hay capacidad, valor, valentía para poner
      límites cuando lo que se pretende es simplemente tener más y más beneficios. Y señores y señoras
      del Ayuntamiento, si no ponéis límites, **la ciudad explotará**. Y explotará porque la gente también
      queremos tener libertad para tener una vivienda. También queremos tener libertad para tener un hogar.
      También queremos tener un hogar para no ser sacudidos ni acosados en nuestras viviendas por la gente
      que nos expulsa e impide el disfrute.

      En fin, nosotros medidas que proponemos. El primero de todo, habría que hacer un **estudio serio
      y real** de qué necesidades y qué disponibilidades tenemos. Serio y real para saber qué necesitamos.
      ¿Vale? Y a partir de trabajar. Nosotros pensamos que la respuesta no es solo del Ayuntamiento, es
      también de la **administración autonómica** y también de la **administración estatal**. No podemos
      extendernos mucho porque no hay tiempo, solo vamos a decir cuatro pinceladas y pedimos una reunión
      a la alcaldesa desde **Juntes per l''Habitatge** para poder plantear todas estas alternativas con
      tranquilidad. Pero, por lo menos, estamos por todas las medidas que hagan falta. Todas. No vamos
      a votar aquellas en contra que ha dicho el PSOE o el gobierno de Madrid o el no sé cuántos, no sé
      qué. Vamos a estudiar qué mecanismos pueden hacer que haya proyectos de vida que no se truncan.

      Lo entiendo perfectamente. Solo quince segundos más, por favor. Miren, a finales de este mes, a
      finales de diciembre, el **31 de diciembre** se acaba el **escudo social**. Hay unos cuantos cientos
      de familias del Ayuntamiento que se van a quedar en la calle si no se **prorroga el escudo social**.
      Deberíamos pedir la **prórroga ineludible** de ese escudo social. Si no, son responsables, como
      todos, pero ustedes también, de lo que pueda ocurrir. Y nada más.'
