- iv_id: 2019-01-31-001
  fields:
    text_original: 'Hola, bon dia.


      Compareixem hui ací en representació d''aquelles veïnes, col·lectius i associacions del **Cabanyal**
      que han mostrat la seua preocupació i desacord si no en tota la totalitat del **Pla**, sí en alguns
      aspectes essencials d''este per a l’esdevindre del barri. Tot açò basant-se en la informació de
      què es disposava fins al dia de hui.


      En primer lloc, ens agradaria felicitar totes les nostres veïnes per la **paralització final** de
      l''anterior projecte i mostrar el nostre màxim respecte a l''enorme esforç personal i administratiu
      perquè açò s''ha comportat. A pesar d’açò, manifestem que hi ha persones que no se senten identificades
      en este ambiciós nou Pla i que escapa als **valors inicials** de les seues reivindicacions. Ara
      s’està decidint el **futur d''un barri** que és de totes les que l''habitem i hauríem de tindre
      en compte totes les opinions.


      Exposem, en primer lloc, que el **Pla Especial del Cabanyal** no dóna una **solució real d''habitabilitat**
      a totes les persones que residixen en el **Bloc Portuaris**. Entenem que este fet vulnera l’**article
      16** de l''Estatut d''Autonomia de la Comunitat Valenciana que garantix l''accés a una vivenda digna
      als ciutadans valencians. L''article 16 de la Carta dels Drets Socials de la Comunitat Valenciana
      de les persones que patixen marginació, pobresa o exclusió i discriminació social.


      També entraria en contradicció amb la **Llei de Serveis Socials Inclusius** aprovada precisament
      ahir en el parlament valencià ja que per les seues característiques este edifici complix les condicions
      d''espai vulnerable que es descriu en l''article 26. I per tant, segons el seu article 56 s''ha
      de procurar una atenció més eficient, major sinèrgia i aprofitament de les prestacions, els serveis
      socials i els de vivenda, garantint la seua complementarietat, evitant duplicitats i oferint una
      **atenció integral** per a facilitar l''accés a la vivenda i evitar desnonaments de les persones
      i famílies en situació de major vulnerabilitat.


      Segon, que hi ha un **acord de la turistificació** del barri. Considerem que este Pla posa la estora
      roja a la **turistificació**, que deshumanitza l''entorn, les relacions emocionals i, per descomptat,
      també les seues cases, tractades com una forma de guanyar diners. S''expulsa dels barris als que
      els habiten, es construeixen blocs en sèrie sense poètica en el seu lloc i es doblega davant el
      turisme. A pesar de les restriccions enfront de la proliferació de pisos de lloguer turístic, este
      Pla exposa a les seues veïnes a un **canvi de model socioeconòmic** del barri en què viuen sense
      haver experimentat encara les millores en els serveis o l''eficàcia de les mesures adoptades en
      pro de la convivència, considerem açò tot un acte de fe.


      Especialment alarmant és la **concentració turística** reservada per a la zona denominada com **PAI
      de Eugènia Viñes**, amb un **40 % de vivendes** susceptibles de ser llogades a este fi, i que afectaria
      directament al grup de vivendes blocs platja, afectaria urbanística i socialment. Una zona a la
      qual haurem d''afegir, a més, l''impacte que suposarà l''**hotel de quinze plantes** a les seues
      més que presumibles baixos comercials i d''oci.


      Tercer punt, **arquitectura i capitalització del sòl**. Amb l''excusa de blindar arquitectònicament
      el **Cabanyal-Canyameral** s''ha sucumbit davant l''estratègia de la mobiliària de segona línia
      de platja. Este nou Pla no respecta la **trama urbana tradicional** i crea una nova frontera amb
      el mar, amb edificis residencials alineats de nord a sud d’entre tres -més àtic- a cinc altures.
      El sector immobiliari dóna per fet que estos sòls derivaran en vivendes dirigides a compradors de
      nivell alt.


      Quedarà per aclarir quantes vivendes seran destinades realment al **parc públic de vivenda social**
      i quina serà la distribució en el territori, així com quins seran els serveis que plantegen finalment
      per al barri. S''ha de treballar per a la **integració i cohesió social**, no per a perpetuar la
      situació d''aïllament de certs col·lectius.


      En el PEC tampoc s''especifica quines seran, si és que hi ha alguna, les actuacions que es cometran
      per a esmenar l''acció de **dècades d´abandó** de la mal coneguda com a **zona zero**. És important
      remarcar que la disposició triada per a resoldre el conflictiu tram entre l''avinguda del Mediterrani
      i Blocs Portuaris és com a menys poc encertada i mostra el poc interès a mantindré la **identitat
      del barri** en esta altra part de Doctor Lluch creant places ombrívoles que allunyen el sol d´hivern
      dels seus vianants i ho privatitzen.


      Per últim i quart punt, volíem esmentar la **pèrdua d''atenció social** i **espais col·lectius**.
      Sol·licitem que tota planificació urbana en el barri del Cabanyal-Canyameral siga sensible amb els
      projectes ja impresos pels seus veïns i veïnes, que es reconega i es respecte l''**espai verd i
      horta urbana** construït per mitjà del treball diari del col·lectiu **Cabanyal Horta**. I que lluny
      de veure com un entorpiment per al desenvolupament urbanístic-turístic del barri siga un revulsiu
      per a acostar-nos a la idea de Cabanyal que ens mereixem. S''ha de **recuperar la ciutat** per a
      les persones donant prioritat a l''espai públic, creant consciència de comunitat, posant l''arquitectura
      i l''urbanisme al servei de la societat i no del mercat.


      Gràcies.'
    text_cas: 'Hola, buenos días.


      Comparecemos hoy aquí en representación de aquellas vecinas, colectivos y asociaciones del **Cabanyal**
      que han mostrado su preocupación y desacuerdo, si no con la totalidad del **Plan**, sí con algunos
      aspectos esenciales de este para el devenir del barrio. Todo ello basándose en la información de
      la que se disponía hasta el día de hoy.


      En primer lugar, nos gustaría felicitar a todas nuestras vecinas por la **paralización final** del
      anterior proyecto y mostrar nuestro máximo respeto al enorme esfuerzo personal y administrativo
      que ha supuesto. A pesar de esto, manifestamos que hay personas que no se sienten identificadas
      con este ambicioso nuevo Plan y que se aleja de los **valores iniciales** de sus reivindicaciones.
      Ahora se está decidiendo el **futuro de un barrio** que es de todas las que lo habitamos y deberíamos
      tener en cuenta todas las opiniones.


      Exponemos, en primer lugar, que el **Plan Especial del Cabanyal** no da una **solución real de habitabilidad**
      a todas las personas que residen en el **Bloc Portuaris**. Entendemos que este hecho vulnera el
      **artículo 16** del Estatuto de Autonomía de la Comunitat Valenciana, que garantiza el acceso a
      una vivienda digna a los ciudadanos valencianos. El artículo 16 de la Carta de los Derechos Sociales
      de la Comunitat Valenciana de las personas que sufren marginación, pobreza o exclusión y discriminación
      social.


      También entraría en contradicción con la **Ley de Servicios Sociales Inclusivos**, aprobada precisamente
      ayer en el Parlamento valenciano, ya que por sus características este edificio cumple las condiciones
      de espacio vulnerable que se describen en el artículo 26. Y por tanto, según su artículo 56, se
      debe procurar una atención más eficiente, mayor sinergia y aprovechamiento de las prestaciones,
      los servicios sociales y los de vivienda, garantizando su complementariedad, evitando duplicidades
      y ofreciendo una **atención integral** para facilitar el acceso a la vivienda y evitar desahucios
      de las personas y familias en situación de mayor vulnerabilidad.


      Segundo, que existe un **acuerdo de la turistificación** del barrio. Consideramos que este Plan
      extiende la alfombra roja a la **turistificación**, que deshumaniza el entorno, las relaciones emocionales
      y, por supuesto, también sus casas, tratadas como una forma de ganar dinero. Se expulsa de los barrios
      a quienes los habitan, se construyen bloques en serie sin poética en su lugar y se doblega ante
      el turismo. A pesar de las restricciones frente a la proliferación de pisos de alquiler turístico,
      este Plan expone a sus vecinas a un **cambio de modelo socioeconómico** del barrio en el que viven
      sin haber experimentado aún las mejoras en los servicios o la eficacia de las medidas adoptadas
      en pro de la convivencia; consideramos esto todo un acto de fe.


      Especialmente alarmante es la **concentración turística** reservada para la zona denominada como
      **PAI de Eugènia Viñes**, con un **40 % de viviendas** susceptibles de ser alquiladas con este fin,
      lo que afectaría directamente al grupo de viviendas bloques playa, tanto urbanística como socialmente.
      A una zona a la que habrá que añadir, además, el impacto que supondrá el **hotel de quince plantas**
      en sus más que presumibles bajos comerciales y de ocio.


      Tercer punto, **arquitectura y capitalización del suelo**. Con la excusa de blindar arquitectónicamente
      el **Cabanyal-Canyameral** se ha sucumbido ante la estrategia de la inmobiliaria de segunda línea
      de playa. Este nuevo Plan no respeta la **trama urbana tradicional** y crea una nueva frontera con
      el mar, con edificios residenciales alineados de norte a sur de entre tres -más ático- a cinco alturas.
      El sector inmobiliario da por hecho que estos suelos derivarán en viviendas dirigidas a compradores
      de nivel alto.


      Queda por aclarar cuántas viviendas serán destinadas realmente al **parque público de vivienda social**
      y cuál será su distribución en el territorio, así como cuáles serán finalmente los servicios que
      plantean para el barrio. Hay que trabajar por la **integración y cohesión social**, no por perpetuar
      la situación de aislamiento de determinados colectivos.


      En el PEC tampoco se especifica cuáles serán, si es que hay alguna, las actuaciones que se llevarán
      a cabo para subsanar la acción de las **décadas de abandono** de la mal conocida como **zona cero**.
      Es importante remarcar que la disposición elegida para resolver el conflictivo tramo entre la avenida
      del Mediterráneo y Blocs Portuaris es, como mínimo, poco acertada y muestra el poco interés en mantener
      la **identidad del barrio** en esta otra parte de Doctor Lluch, creando plazas sombrías que alejan
      el sol de invierno de sus peatones y las privatizan.


      Por último, y como cuarto punto, queríamos mencionar la **pérdida de atención social** y de **espacios
      colectivos**. Solicitamos que toda planificación urbana en el barrio del Cabanyal-Canyameral sea
      sensible con los proyectos ya impulsados por sus vecinos y vecinas, que se reconozca y se respete
      el **espacio verde y huerta urbana** construido mediante el trabajo diario del colectivo **Cabanyal
      Horta**. Y que, lejos de verse como un obstáculo para el desarrollo urbanístico-turístico del barrio,
      sea un revulsivo para acercarnos a la idea de Cabanyal que nos merecemos. Hay que **recuperar la
      ciudad** para las personas, dando prioridad al espacio público, creando conciencia de comunidad,
      poniendo la arquitectura y el urbanismo al servicio de la sociedad y no del mercado.


      Gracias.'
