- iv_id: 2018-04-26-004
  fields:
    text_original: 'Moltes gràcies. Sr. alcalde, Srs. i Sres. regidores i companys de Benimaclet i Orriols.


      Per fi ha arribat el moment que tots i totes vostés puguen donar el vist-i-plau a l’**Estratègia
      Integral Participativa** també del barri de **Natzaret**. Doncs ja fa més d’un any que es va ultimar
      el **Diagnòstic participat** fruit del treball que durant uns quants mesos es desenvolupà en aquest
      barri per **més d''un centenar de persones** i totes les entitats. Aquesta proposta s’havia d’haver
      aprovat ja fa mesos i temps han tingut les diferents regidories per estudiar-la amb l’atenció i
      el respecte que ens mereixem totes les persones i entitats de Natzaret que hi hem participat, i
      fer-hi les aportacions oportunes. I és que no podem esperar més temps actuacions decidides i globals
      davant una situació sacsejada durant mots anys per la **pobresa de moltes persones**, la **precarietat
      en recursos**, la **inacció urbanística**, etc.


      D’altra banda, el barri de Natzaret experimenta un **moment de forta demanda participativa** com
      ho demostren no sols el treball fet sota l’impuls de la Regidoria de Participació, sinó la creació
      de les **successives comissions** de pobresa zero, d’educació i d’esports i fins i tot la constitució
      d’un consell d’alumnes de totes les escoles de la barriada. Considerem que és deure de l’administració
      pública no sols recolzar i estimular la **participació del veïnat** sinó deixar-se interpel·lar
      per aquest i interactuar decididament amb ell. Impulsar aquesta participació i després retardar-ne
      la incidència, menystenir-ne l’aportació o no incorporar les seues propostes en els programes municipals
      obtindria justament l’efecte contrari: la **inhibició sociopolítica** de la ciutadania i el **raquitisme
      democràtic**.


      El veïnat hem fet els deures: treballar conjuntament per fer el diagnòstic en la seua globalitat
      que ha possibilitat la redacció de la present proposta per tal que les diverses **intervencions
      municipals estiguen coordinades** i responguen a una **actuació integral**. Esperem de tots vostés,
      de totes vostés la mateixa responsabilitat. Desitgem que siga aprovada la proposta per unanimitat
      per a què siga qui siga el Govern del municipi no puga evadir-se de dur-la a terme. I, per descomptat,
      esperem que un cop aprovada vinguen al barri a presentar-la i concretar-ne els compromisos.


      Moltes gràcies.'
    text_cas: 'Muchas gracias. Sr. alcalde, Sres. y Sres. concejales y compañeros de Benimaclet y Orriols.


      Por fin ha llegado el momento de que todos y todas ustedes puedan dar el visto bueno a la **Estrategia
      Integral Participativa** también del barrio de **Natzaret**. Pues ya hace más de un año que se ultimó
      el **Diagnóstico participado** fruto del trabajo que durante unos cuantos meses se desarrolló en
      este barrio por **más de un centenar de personas** y todas las entidades. Esta propuesta se tendría
      que haber aprobado ya hace meses y el tiempo que han tenido las distintas concejalías para estudiarla
      con la atención y el respeto que nos merecemos todas las personas y entidades de Natzaret que hemos
      participado, y hacer las aportaciones oportunas. Y es que no podemos esperar más tiempo actuaciones
      decididas y globales ante una situación sacudida durante muchos años por la **pobreza de muchas
      personas**, la **precariedad en recursos**, la **inacción urbanística**, etc.


      Por otra parte, el barrio de Natzaret experimenta un **momento de fuerte demanda participativa**
      como lo demuestran no solo el trabajo realizado bajo el impulso de la Concejalía de Participación,
      sino la creación de las **sucesivas comisiones** de pobreza cero, de educación y de deportes e incluso
      la constitución de un consejo de alumnos de todas las escuelas de la barriada. Consideramos que
      es deber de la administración pública no solo apoyar y estimular la **participación del vecindario**,
      sino dejarse interpelar por este e interactuar decididamente con él. Impulsar esta participación
      y después retrasar su incidencia, menospreciar su aportación o no incorporar sus propuestas en los
      programas municipales obtendría justamente el efecto contrario: la **inhibición sociopolítica**
      de la ciudadanía y el **raquitismo democrático**.


      El vecindario hemos hecho los deberes: trabajar conjuntamente para hacer el diagnóstico en su globalidad,
      lo que ha posibilitado la redacción de la presente propuesta para que las distintas **intervenciones
      municipales estén coordinadas** y respondan a una **actuación integral**. Esperamos de todos ustedes,
      de todas ustedes la misma responsabilidad. Deseamos que la propuesta sea aprobada por unanimidad
      para que sea quien sea el Gobierno del municipio no pueda eludir llevarla a cabo. Y, por supuesto,
      esperamos que una vez aprobada vengan al barrio a presentarla y concretar sus compromisos.


      Muchas gracias.'
