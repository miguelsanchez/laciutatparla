- iv_id: 2025-01-28-003
  fields:
    text_val: 'Gràcies. Bon dia.


      En primer lloc volia comentar-los que en la nostra pedania ens considerem afortunats perquè el dia
      29 **no hem hagut de lamentar cap víctima mortal**, al contrari que Castellar o La Torre-Faitanar.
      Cap a ells **tota la nostra solidaritat**. No obstant això, com a pedania, **les pèrdues materials
      van ser catastròfiques** tant en el nucli urbà com en les alqueries i en el poc d''horta que encara
      ens queda.


      Els faré una petita introducció. **Les nostres queixes vénen de molt lluny**, des de l''inici de
      les obres del Pla Sud, 1965. Esta gran obra va salvar la capital, és cert, però a nosaltres **ens
      van condemnar**. La nostra pedania va quedar dividida en dos, separada per **un gran monstre que
      és el nou llit del Túria**. L''horta va desaparéixer en gran manera. Les alqueries i la forma de
      vida que teníem. Les promeses que ens van fer també vénen des d''aleshores. «No us preocupeu», van
      dir als nostres majors. «Tindreu un pont per a poder anar al vostre nucli urbà, a la vostra església,
      a la botiga on sempre heu anat». **Mentien**. Ara amb els efectes de la riada hem sigut més conscients
      que mai que **és necessària una passarel·la que ens comunique amb València**. La nostra pedania
      és singular. És veritat que som pocs, però a més **estem atrapats per dues grans vies ràpides**.
      Per qui no ho conega, hi ha la V-30 i la V-31. **Contaminació acústica, ambiental, lumínica**. Però
      a més **tenim l''únic polígon industrial de la ciutat de València**. I em diran, Vara de Quart també.
      No té res a veure amb el nostre polígon. Però a més, este polígon ens regala també **contaminació
      ambiental, lumínica i acústica**. Tots estos factors han ajudat a que els efectes d''esta riada
      hagen sigut pitjors sobre el nostre territori, però a més **ens impedeixen créixer urbanísticament**.
      Creiem que ja és hora que això s''invertisca.


      La nostra sorpresa majúscula ha sigut en veure les inversions previstes que ustedes van publicar
      per a la nostra pedania. Ens donen 3.970.542 euros. Bé. Però no, **no és cert. Un 85 % d''este pressupost
      va per al polígon industrial** d''Forn d''Alcedo i **només un 15 % per a la resta de la pedania**.
      Sembla una burla, però és així. La nostra pedania manca de moltes infraestructures. Bé, tenim una
      zona esportiva d''aproximadament 140 metres quadrats. No és broma, és així. Tampoc tenim camins
      per a vianants que ens connecten amb res. No un tros de camí que ens porta al no-res, no. Alguna
      cosa que ens connecte. Tampoc tenim zones arbrades. Potser és per això que consideren que només
      han de dedicar un 15 % a la reconstrucció, perquè hi ha molt poc. Però mire, els veïns i veïnes
      de Forn d''Alcedo creiem que tenim moltes millores on invertir de veritat 3.970.542 euros.


      Ara sí que considerem que hi ha **una sèrie de reivindicacions irrenunciables**. **Modificació de
      la inversió publicada el 23 de gener**, **creació d''una passarel·la que ens unisca amb el barri
      de Malilla**, **paralització de l''ampliació del polígon industrial** i canvi d''ús del sòl d''industrial
      a sòl residencial, la realització de **drenatges i/o desguassos en el mur de quasi huit metres d''alt**
      que quan van fer el pont sobre la V-31 van construir i han provocat que les cases hagen sigut inundades
      durant esta riada i que per poc ha costat la vida als que hi resideixen.


      Creiem que **és de justícia que se''ns tinga en compte**. Som molt pocs.


      Hui, quan he vingut a este ple que he arribat tard, perquè és veritat, vivim a Forn d''Alcedo i
      **depenem d''autobusos**, disculpen que se m''assega la boca, la persona, el taxista que m''ha portat
      m''ha dit: «A vegades pense que hi ha algú que els té molta mania perquè **no és just el que passa
      amb Forn d''Alcedo**».


      Gràcies a tots i a totes.'
