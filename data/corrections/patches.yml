- iv_id: 2020-10-29-003
  fields:
    text_original: 'Mi nombre es **Liliana Córdova Kaczerginski**. Soy una **mujer vecina de Benimaclet**,
      **judía**, hija y nieta de **represaliados y víctimas de los nazis** durante el genocidio llevado
      a cabo hace 80 años en Europa. **Doce miembros de mi familia** fueron **fusilados por los nazis
      en Lituania en 1941** cuando los escuadrones de la muerte entraron Vilna y debían cavar sus propias
      fosas.


      Hoy hablo en representación de l’Associació de Families d’Alumnes del Colegio Público Pare Català,
      del barrio de Benimaclet, pero también, en nombre de todas las entidades que firmaron el **manifiesto
      contra el odio** a propósito de la marcha fascista que tuvo lugar el pasado 12 de octubre.


      En primer lugar, queremos poner en valor que desde hace años en la ciudad de València, muchas asociaciones
      reivindicamos que **no hay que celebrar el 12 de octubre** sino que hay que tomarlo como una **jornada
      anticolonial y feminista**, por las víctimas del colonialismo y el patriarcado de aquí y de la otra
      parte del océano. Y es lo que también salimos a defender cientos de personas el pasado 12 de octubre
      en Benimaclet mientras que por sus calles desfilaban **poco más de cincuenta neonazis y fascistas**,
      la gran mayoría ni siquiera del barrio.


      Benimaclet, como toda la ciudad de València, ha sido y es una **ciudad mestiza, de encuentro de
      culturas**, religiones, lenguas y nacionalidades, donde su diversidad histórica es una seña de identidad
      que la hace todavía más grande y más abierta al mundo. Por esto mismo salimos a la calle el pasado
      12 de octubre, para **celebrar esa diversidad**, para reivindicarla, para demostrar que el odio
      que pasearon los cincuenta neonazis ese día no representa a esta ciudad ni a sus ciudadanos.


      Sabemos que la organización que convocó aquella marcha fascista es **totalmente irrelevante**, es
      absolutamente marginal y no representa en absoluto a la sociedad valenciana. Tampoco la entidad
      que le ha servido hoy para intervenir en este Pleno. Esta, casualmente, está presidida por una persona
      investigada por los graves sucesos que protagonizaron varios neonazis contra la manifestación valencianista
      del 9 de octubre de 2017. Todos vimos las palizas, los insultos y las amenazas de una pandilla de
      cobardes neonazis que hoy, igual que quien preside esa entidad que pidió hablar hoy, **están a la
      espera de juicio** por tales hechos.


      También sabemos que quien ha tomado la palabra en su nombre premió precisamente a otro individuo
      que participó en aquellos incidentes. Concretamente, a un conocido neonazi que también está investigado
      en la misma causa y al que todo el mundo vio, retransmitido en directo por la televisión, cómo agredía
      a varias personas. Su presencia hoy aquí no es más que un intento por hacerse publicidad y que perdamos
      el tiempo con ustedes.


      Pero mire, tenemos muchas cosas que hacer como para dedicarle más tiempo del necesario y por mucho
      que lo intente la sociedad valenciana no le hace ni caso. Por eso a sus actos no van nunca más de
      **50 personas** y por eso nunca han tenido representación en esta ciudad, ni la tendrá. Nosotros
      no debatimos con nazis ni con fascistas. Nosotros conocemos bien a los nazis y a los fascistas.
      Yo, y mi familia más de lo que quisiera, como ya he explicado antes. Y no voy a debatir con usted
      porque no se lo merece.


      Mientras ustedes desfilaban por las calles de Benimaclet luciendo **banderas nazis y franquistas**,
      insultando a los vecinos que les mostraron su rechazo desde los balcones o **celebrando el asesinato
      de Guillem Agulló**, como puedo demostrárselo en un video que tengo aquí, nosotros **celebrábamos
      la vida** y éramos muchos más, **muchísimos más**. Y lo sabe y no lo soporta. Por eso hoy intenta
      llamar la atención como un niño. Y aquí está, ya tuvo sus minutos de casito y ya se puede ir a su
      chalet. La vida sigue, no llore.


      Nosotros representamos **la vida, la diversidad, la convivencia, la democracia**. Ustedes, con sus
      esvásticas, sus símbolos nazis, sus brazos en alto y su pose matonil, **la más absoluta derrota**.
      Porque fueron derrotados, en la Segunda Guerra Mundial y en Benimaclet, no lo olviden. Porque al
      día siguiente, el barrio siguió su vida normal. Sin ustedes, sin su odio, sin sus esvásticas -ya
      termino-. Un barrio donde cabemos todas y todos, donde nos queremos diferentes e iguales, pero donde
      quien no cabe ni cabrá nunca será el **odio y la intolerancia** que ustedes representan.


      **Visca la lluita antifeixista**.'
    text_val: 'Em dic **Liliana Córdova Kaczerginski**. Sóc una **dona veïna de Benimaclet**, **jueva**,
      filla i néta de **represaliats i víctimes dels nazis** durant el genocidi dut a terme fa 80 anys
      a Europa. **Dotze membres de la meua família** van ser **afusellats pels nazis a Lituània el 1941**
      quan els escamots de la mort van entrar a Vílnius i havien de cavar les seues pròpies fosses.


      Hui parle en representació de l’Associació de Famílies d’Alumnes del Col·legi Públic Pare Català,
      del barri de Benimaclet, però també, en nom de totes les entitats que van signar el **manifest contra
      l''odi** a propòsit de la marxa feixista que va tindre lloc el passat 12 d''octubre.


      En primer lloc, volem posar en valor que des de fa anys a la ciutat de València, moltes associacions
      reivindiquem que **no cal celebrar el 12 d''octubre** sinó que cal prendre''l com una **jornada
      anticolonial i feminista**, per les víctimes del colonialisme i el patriarcat d''ací i de l''altra
      part de l''oceà. I és el que també vam eixir a defendre centenars de persones el passat 12 d''octubre
      a Benimaclet mentre que pels seus carrers desfilaven **poc més de cinquanta neonazis i feixistes**,
      la gran majoria ni tan sols del barri.


      Benimaclet, com tota la ciutat de València, ha sigut i és una **ciutat mestissa, de trobada de cultures**,
      religions, llengües i nacionalitats, on la seua diversitat històrica és una senya d''identitat que
      la fa encara més gran i més oberta al món. Per això mateix vam eixir al carrer el passat 12 d''octubre,
      per **celebrar eixa diversitat**, per reivindicar-la, per demostrar que l''odi que van passejar
      els cinquanta neonazis aquell dia no representa esta ciutat ni els seus ciutadans.


      Sabem que l''organització que va convocar aquella marxa feixista és **totalment irrellevant**, és
      absolutament marginal i no representa en absolut la societat valenciana. Tampoc l''entitat que li
      ha servit hui per intervindre en este Ple. Esta, casualment, està presidida per una persona investigada
      pels greus fets que van protagonitzar diversos neonazis contra la manifestació valencianista del
      9 d''octubre de 2017. Tots vam veure les pallisses, els insults i les amenaces d''una colla de covards
      neonazis que hui, igual que qui presidix eixa entitat que va demanar parlar hui, **estan a l''espera
      de judici** per eixos fets.


      També sabem que qui ha pres la paraula en el seu nom va premiar precisament a un altre individu
      que va participar en aquells incidents. Concretament, a un conegut neonazi que també està investigat
      en la mateixa causa i a qui tot el món va veure, retransmés en directe per la televisió, com agredia
      a diverses persones. La seua presència hui ací no és més que un intent de fer-se publicitat i que
      perdem el temps amb vostés.


      Però mire, tenim moltes coses per fer com per dedicar-li més temps del necessari i per molt que
      ho intente la societat valenciana no li fa ni cas. Per això als seus actes mai no van més de **50
      persones** i per això mai han tingut representació en esta ciutat, ni la tindrà. Nosaltres no debatem
      amb nazis ni amb feixistes. Nosaltres coneixem bé els nazis i els feixistes. Jo, i la meua família
      més del que voldria, com ja he explicat abans. I no vaig a debatre amb vostè perquè no ho mereix.


      Mentre vostés desfilaven pels carrers de Benimaclet lluint **banderes nazis i franquistes**, insultant
      els veïns que els van mostrar el seu rebuig des dels balcons o **celebrant l''assassinat de Guillem
      Agulló**, com puc demostrar-li en un vídeo que tinc ací, nosaltres **celebràvem la vida** i érem
      molts més, **moltíssim més**. I ho sap i no ho suporta. Per això hui intenta cridar l''atenció com
      un xiquet. I ací està, ja va tindre els seus minuts de glòria i ja es pot anar al seu xalet. La
      vida continua, no plore.


      Nosaltres representem **la vida, la diversitat, la convivència, la democràcia**. Vostés, amb les
      seues esvàstiques, els seus símbols nazis, els seus braços en alt i la seua pose matonesca, **la
      més absoluta derrota**. Perquè van ser derrotats, en la Segona Guerra Mundial i a Benimaclet, no
      ho obliden. Perquè l''endemà, el barri va seguir la seua vida normal. Sense vostés, sense el seu
      odi, sense les seues esvàstiques -ja acabe-. Un barri on cabem totes i tots, on ens estimem diferents
      i iguals, però on qui no cap ni cabrà mai serà **l''odi i la intolerància** que vostés representen.


      **Visca la lluita antifeixista**.'
