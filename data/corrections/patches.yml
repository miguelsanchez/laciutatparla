  fields:
    text_original: 'Bon dia, senyora alcaldessa.

      Com bé sap, **l''eliminació del túnel de Pérez Galdós** és una responsabilitat directa de la seua
      gestió. Durant les anteriors legislatures va haver-hi **un fort moviment veïnal** que va exigir
      la seua supressió i una vegada aconseguit eixe objectiu sembla que s''ha fet un pas enrere. Per
      això, continuem exigint la seua eliminació, tal com es va plantejar al **projecte guanyador** per
      a la reforma de l''avinguda. Este projecte incloïa **voreres amples, tres files d''arbres, carril
      bici, carril bus**, l''eliminació del túnel. No obstant això, **amb el canvi de govern** s''han
      buscat excuses per a no eliminar-lo. S''ha utilitzat **un estudi de la Universitat Politècnica**
      per a justificar la seua conservació, al·legant que les parets no podien suportar el pes d’una llosa
      de cobriment. Però el projecte original no contemplava eixa solució, en el seu lloc proposava **la
      demolició total del túnel**, protegir el col·lector existent amb una llosa i cobrir-lo amb terra
      i grava.

      Les respostes del consistori són **insuficients i inexactes** per a justificar el canvi del projecte
      original, deixant el túnel i volent complir amb els objectius de les ajudes europees. Afirmen que
      ja existix un carril exclusiu per a transport públic, quan en realitat este serà compartit amb vehicles
      que vullguen accedir als barris al llarg dels **720 metres del túnel**, és a dir, quasi la meitat
      de l’avinguda. Asseguren que es mantindrà la tercera fila d''arbres en el centre de l''avinguda,
      la qual cosa és impossible en la zona del túnel. Justifiquen la millora de la connectivitat transversal
      entre barris únicament amb voreres més amples, argumentant que així costa menys temps travessar
      l''avinguda sense tindre en compte **l''autèntic problema, la barrera física del túnel**. L''actual
      projecte incomplix els objectius de les ajudes, es perd el carril bus exclusiu, gran part de la
      fila central d''arbres desapareix i es manté la divisió entre barris.

      Hui som ací per **la moció de Compromís** per a restringir el trànsit del túnel de Pérez Galdós
      aprofitant l''inici de les obres de l''avinguda. Proposen una actuació d''**urbanisme tàctic** similar
      a les implementades en les passades legislatures. Podria ser que **el tancament del túnel** amb
      l''inici de les obres demostre que la ciutat està preparada per a transformar aquesta antiga autopista
      urbana i guanyar espai públic de qualitat? O pot ser evidenciarà que l''avinguda es col·lapsarà,
      el caos s''estendrà per les vies alternatives? Senyora alcaldessa, provem-ho. No té res a perdre.
      Si funciona, serà un gran benefici per a la ciutat. Si no, tindrà una prova evident en contra d''aquest
      argument.

      Al menys tenim una proposta perquè el que no sabem és què pensa fer vosté. **Eliminar-lo o mantenir-lo?**
      Exigim concrecions, conéixer quin és el seu plantejament i un compromís ferm. El pitjor que ens
      pot passar és la incertesa, la falta d''informació i que no es vullga assumir la responsabilitat.
      Encara que tancar el túnel durant les obres puga semblar una idea insòlita, sabem que s''han dut
      a terme altres intervencions atrevides en les quals es va eliminar el trànsit per a convertir en
      zona de vianants espais com **la plaça de l''Ajuntament, la del Mercat, la de la Reina o Sant Agustí**.
      En el seu moment van ser criticades, però el temps ha demostrat que eren necessàries i cap administració
      hui en dia revertiria estos canvis.

      Vull posar dos exemples. El primer és **la intervenció al carrer Colón**, on es va reduir l''espai
      per al vehicle privat a favor del transport públic i els vianants. El canvi més radical va ser **la
      restricció de l''accés** des de la Porta de la Mar. Es va tallar la ronda del centre històric, el
      primer anell de la ciutat, i encara que era una mesura molt dràstica, escèptica, el resultat és
      que va fomentar i prioritzar l''ús del transport públic, **va millorar la qualitat de l''aire**,
      va reduir la contaminació acústica, va pacificar el trànsit i va augmentar la seguretat i comoditat
      dels vianants. La prova està en el fet que, després de revertir eixa mesura i permetre de nou l''accés
      des de la Porta de la Mar, el trànsit i els seus perjuís al carrer Colón han tornat a augmentar.

      L''altre exemple que vull ficar és el de **la reforma urbanística de l''avinguda Peris i Valero**,
      realitzada en **2009** pel govern de **Rita Barberà**. Esta remodelació va eliminar un carril de
      circulació en cada sentit, va ampliar les voreres, van crear una mitjana central i va afegir un
      carril bici per a fomentar l''ús de la bicicleta. El resultat final és el mateix que ara exigim
      per a Pérez Galdós. La postura del **Partit Popular** en aquells dies prioritzava la qualitat de
      vida del veïnat, la mobilitat sostenible i l''espai per als vianants i ciclistes, en contraposició
      amb la resistència actual per eliminar el túnel de l''avinguda, que manté i prioritza l''espai per
      a vehicles i la fluïdesa del trànsit motoritzat. Esta aparent contradicció reflecteix que la mateixa
      formació política que va promoure eixes reformes en el seu moment ara mostra reticències a prendre
      mesures similars, la qual cosa resulta incoherent, més encara quan les avingudes guarden una gran
      similitud. Són simètriques, voregen l''Eixample de la ciutat i pertanyen a mateix anell i una té
      continuïtat amb l''altra.

      Fins a la data, l''Ajuntament no ha descartat oficialment eliminar el túnel després de les obres,
      però **un any després** no ha concretat cap pla. **Exigim una resposta clara**. Si tenen intenció
      d''eliminar-lo, que s''establisquen terminis, una planificació i el compromís amb la ciutadania
      perquè puguem saber quan serà una realitat. I si no ho van a fer, diga-ho clar. Per això li sol·licitem
      **coherència i acció immediata** per eliminar el túnel abans que finalitze l''obra de l''avinguda.
      No volem tindre l''avinguda en obres primer per la seua reforma i després per l''eliminació del
      túnel. Volem una gestió eficaç i eficient. Per això demanem que es continue amb el projecte actual
      de la reforma de l''avinguda sense demores, però al mateix temps que es lícite ja un nou projecte
      i que comencen les obres per a **la supressió definitiva del túnel** de Pérez Galdós.

      Moltes gràcies per la seua atenció.'
    text_cas: 'Buenos días, señora alcaldesa.

      Como bien sabe, **la eliminación del túnel de Pérez Galdós** es una responsabilidad directa de su
      gestión. Durante las anteriores legislaturas hubo **un fuerte movimiento vecinal** que exigió su
      supresión y una vez conseguido ese objetivo parece que se ha dado un paso atrás. Por eso, seguimos
      exigiendo su eliminación, tal como se planteó en **el proyecto ganador** para la reforma de la avenida.
      Este proyecto incluía **aceras anchas, tres filas de árboles, carril bici, carril bus**, la eliminación
      del túnel. No obstante, **con el cambio de gobierno** se han buscado excusas para no eliminarlo.
      Se ha utilizado **un estudio de la Universidad Politécnica** para justificar su conservación, alegando
      que las paredes no podían soportar el peso de una losa de cubrimiento. Pero el proyecto original
      no contemplaba esa solución, en su lugar proponía **la demolición total del túnel**, proteger el
      colector existente con una losa y cubrirlo con tierra y grava.

      Las respuestas del consistorio son **insuficientes e inexactas** para justificar el cambio del proyecto
      original, dejando el túnel y queriendo cumplir con los objetivos de las ayudas europeas. Afirman
      que ya existe un carril exclusivo para transporte público, cuando en realidad este será compartido
      con vehículos que quieran acceder a los barrios a lo largo de los **720 metros del túnel**, es decir,
      casi la mitad de la avenida. Aseguran que se mantendrá la tercera fila de árboles en el centro de
      la avenida, lo cual es imposible en la zona del túnel. Justifican la mejora de la conectividad transversal
      entre barrios únicamente con aceras más anchas, argumentando que así cuesta menos tiempo atravesar
      la avenida sin tener en cuenta **el auténtico problema, la barrera física del túnel**. El actual
      proyecto incumple los objetivos de las ayudas, se pierde el carril bus exclusivo, gran parte de
      la fila central de árboles desaparece y se mantiene la división entre barrios.

      Hoy estamos aquí por **la moción de Compromís** para restringir el tráfico del túnel de Pérez Galdós
      aprovechando el inicio de las obras de la avenida. Proponen una actuación de **urbanismo táctico**
      similar a las implementadas en las pasadas legislaturas. ¿Podría ser que **el cierre del túnel**
      con el inicio de las obras demuestre que la ciudad está preparada para transformar esta antigua
      autopista urbana y ganar espacio público de calidad? ¿O puede que evidencie que la avenida se colapsará,
      que el caos se extenderá por las vías alternativas? Señora alcaldesa, probémoslo. No tiene nada
      que perder. Si funciona, será un gran beneficio para la ciudad. Si no, tendrá una prueba evidente
      en contra de este argumento.

      Al menos tenemos una propuesta porque lo que no sabemos es qué piensa hacer usted. **¿Eliminarlo
      o mantenerlo?** Exigimos concreciones, conocer cuál es su planteamiento y un compromiso firme. Lo
      peor que nos puede pasar es la incertidumbre, la falta de información y que no se quiera asumir
      la responsabilidad. Aunque cerrar el túnel durante las obras pueda parecer una idea insólita, sabemos
      que se han llevado a cabo otras intervenciones atrevidas en las que se eliminó el tráfico para convertir
      en zona peatonal espacios como **la plaza del Ayuntamiento, la del Mercado, la de la Reina o Sant
      Agustí**. En su momento fueron criticadas, pero el tiempo ha demostrado que eran necesarias y ninguna
      administración hoy en día revertiría estos cambios.

      Quiero poner dos ejemplos. El primero es **la intervención en la calle Colón**, donde se redujo
      el espacio para el vehículo privado a favor del transporte público y los peatones. El cambio más
      radical fue **la restricción del acceso** desde la Puerta de la Mar. Se cortó la ronda del centro
      histórico, el primer anillo de la ciudad, y aunque era una medida muy drástica, escéptica, el resultado
      es que fomentó y priorizó el uso del transporte público, **mejoró la calidad del aire**, redujo
      la contaminación acústica, pacificó el tráfico y aumentó la seguridad y comodidad de los peatones.
      La prueba está en que, después de revertir esa medida y permitir de nuevo el acceso desde la Puerta
      de la Mar, el tráfico y sus perjuicios en la calle Colón han vuelto a aumentar.

      El otro ejemplo que quiero citar es el de **la reforma urbanística de la avenida Peris i Valero**,
      realizada en **2009** por el gobierno de **Rita Barberà**. Esta remodelación eliminó un carril de
      circulación en cada sentido, amplió las aceras, creó una mediana central y añadió un carril bici
      para fomentar el uso de la bicicleta. El resultado final es el mismo que ahora exigimos para Pérez
      Galdós. La postura del **Partido Popular** en aquellos días priorizaba la calidad de vida del vecindario,
      la movilidad sostenible y el espacio para peatones y ciclistas, en contraposición con la resistencia
      actual a eliminar el túnel de la avenida, que mantiene y prioriza el espacio para vehículos y la
      fluidez del tráfico motorizado. Esta aparente contradicción refleja que la misma formación política
      que promovió esas reformas en su momento ahora muestra reticencias a tomar medidas similares, lo
      cual resulta incoherente, más aún cuando las avenidas guardan una gran similitud. Son simétricas,
      bordean el Ensanche de la ciudad y pertenecen al mismo anillo y una tiene continuidad con la otra.

      Hasta la fecha, el Ayuntamiento no ha descartado oficialmente eliminar el túnel después de las obras,
      pero **un año después** no ha concretado ningún plan. **Exigimos una respuesta clara**. Si tienen
      intención de eliminarlo, que se establezcan plazos, una planificación y el compromiso con la ciudadanía
      para que podamos saber cuándo será una realidad. Y si no lo van a hacer, dígalo claro. Por eso le
      solicitamos **coherencia y acción inmediata** para eliminar el túnel antes de que finalice la obra
      de la avenida. No queremos tener la avenida en obras primero por su reforma y después por la eliminación
      del túnel. Queremos una gestión eficaz y eficiente. Por eso pedimos que se continúe con el proyecto
      actual de la reforma de la avenida sin demoras, pero al mismo tiempo que se licite ya un nuevo proyecto
      y que comiencen las obras para **la supresión definitiva del túnel** de Pérez Galdós.

      Muchas gracias por su atención.'
