- iv_id: 2016-12-22-002
  fields:
    text_val: 'Bon dia, Sr. alcalde, Sres. i Sra. regidores, i públic en general.


      L''Associació de Veïns de Tres Forques i Nou Moles agraïm l''oportunitat d''intervindre en este
      Ple de l''Ajuntament i volem preguntar-li al Sr. alcalde i a la Sra. regidora de Seguretat Ciutadana
      que ens aclarisquen com encara continua **tancat el Parc Oest de Bombers**, sent **tan necessari**
      ja que estem **els set barris del districte** sense un parc que puga respondre a emergències en
      un temps reduït.


      En reunions anteriors amb els bombers ens comunicaren que actualment tindrien un **temps de resposta
      d''uns 15 minuts** des de Campanar, la qual cosa ens sembla **inacceptable davant d''un incendi
      o una emergència greu**. Tinguen present que si per desgràcia succeïra una tragèdia, estant vostés
      avisats d''esta situació només quedaria lamentar-nos i buscar responsabilitats, els demane que evitem
      això.


      Quan l''anterior govern local el va tancar dubtàrem bastant dels motius i protestàrem perquè això
      no succeïra. I vull recordar-lis que **porten en el seu programa electoral la seua reobertura**.
      Bé, doncs creem que **després de quasi dos anys** ja és hora de **complir els programes**. La Sra.
      Sandra Gómez, quan portava Seguretat Ciutadana, en diverses ocasions que ens reunim amb ella es
      va comprometre a estudiar la situació ja que estava previst obrir el Parc Oest quan tancaren el
      del port, però quan va canviar de Regidoria ens quedàrem sense resposta. En unes declaracions al
      periòdic Levante ella mateixa reconeix el que ens deien els bombers, que és **el parc més ràpid**.


      En la reunió que mantinguérem amb l''actual regidora de Seguretat Ciutadana, Sra. Anaïs Menguzzato,
      quedàrem que tenia pendent una contestació sobre l''estudi que havia encarregat als Bombers sobre
      la situació dels parcs de la ciutat. Feu els estudis, feu els simulacres que hàgeu de fer i **poseu
      en valor les persones davant dels diners**, ja que segons la Sra. regidora **amb el pressupost que
      tenia no podia mantindre tots els parcs**.


      Ja sabem que **des de fa anys no es convoquen places de bombers**, però el que ens sembla molt fort
      són les declaracions del cap actual de Bombers el dia 19 a la ràdio. Segons ell no fan falta tants
      parcs, ni tants bombers. No estem parlant d''arreglar un jardí o de fer un pàrquing, estem parlant
      de **un parc de bombers** i de **uns barris amb molta població i moltes persones majors** que estan
      més desprotegits.


      Volem que ho estudien bé i no escatimen diners en això, quan es tracta d''una cosa tan important
      com som els essers humans.


      Moltes gràcies.'
