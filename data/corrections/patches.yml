- iv_id: 2017-07-27-004
  fields:
    text_val: 'Bon dia, Sr. president.

      Voldria fer referència simplement a un **dret de l''OMS** on ens ve a indicar que el **gaudi del
      grau màxim de salut** que es pot aconseguir és **un dels drets fonamentals** de tot ésser humà.

      L''any 2012, amb motiu de la crisi, el Govern del PP a nivell estatal una de les mesures que pren
      com a estalvi és el **retall sanitari** centrant-se en este cas en el **copagament o repagament
      dels medicaments** per a les **persones jubilades i pensionistes**, per a les **persones majors**.

      Volem apostar perquè este Ajuntament **manifeste favorablement en suport a la Generalitat** en el
      sentit del **recurs a la sentència** que s''ha promulgat últimament de recórrer l''ajuda d''aquells
      pensionistes que se''ls estava afavorint. Persones que **mensualment els seus ingressos són insuficients**,
      tenim de l''ordre de **200.000 persones majors a la ciutat**, 900.000 a la Comunitat, el **30 %
      d''elles aproximadament no tenen ingressos suficients** ni tan sols per al manteniment.

      Si recordem, en els anys quan es va començar el tema del copagament o del repagament es va crear
      una certa **alarma social** perquè **hi havia persones malaltes que no podien pagar els seus medicaments**
      i entorn del **15 o del 20 % de les persones no podien cobrir les seues receptes**, no podien complir
      el seu tractament mèdic.

      Simplement dir que crec que esta corporació és molt important que pogués de manera **unànime manifestar
      eixe suport a la Generalitat**, inclús en el sentit d''anar també al Govern de l''Estat perquè això
      pogués facilitar la seua aplicació en tot l''Estat.

      Gràcies.'
    resum_val: El Sr. Soto sol·licita que l'Ajuntament done suport a la Generalitat en un recurs sobre
      copago de medicaments per a pensionistes majors, destacant que milers de persones majors a la ciutat
      no tenen ingressos suficients per a medicaments i manteniment.
  reason: Valencian summary contains Spanish 'tienen' and a non-idiomatic 'aposte per a'
  date: '2026-10-21'
  finding: C6-c58d8d226f
- iv_id: 2017-09-20-005
  fields:
    text_val: 'Bon dia. Gràcies per l''espai que es brinda en aquest debat sobre l''estat de la Ciutat.
      Ací estem de nou, una vegada més, l''AVV i **Plataforma Salvem el Cabanyal-Canyamelar**, per a parlar
      de la situació del nostre barri en nom de la ciutadania la veu de la qual traslladem a este Ple.


      Estem ací, una vegada més, perquè som **organitzacions socials, no partits polítics**. Ni hem dependit,
      ni depenem de cap. El nostre treball ha sigut, és i serà **recollir les demandes socials del barri**
      i reivindicar-les davant de qui governa la ciutat, en això consisteix la **veritable participació
      ciutadana**.


      Esta preocupació pel present no significa que oblidem **qui són els responsables i culpables** de
      la situació del nostre barri. Com se sol dir, ''recordar és fàcil per a qui té memòria; oblidar,
      difícil per a qui té cor''. Nosaltres **tenim memòria i tenim cor**.


      Ara el Cabanyal té un **greu problema social**, un problema de convivència i d''identificació amb
      el seu entorn que uneix tot el barri, vostés ho saben bé. **Cases en ruïna**, moltes de propietat
      pública, **cases sense les condicions mínimes d''habitabilitat**, sense manteniment, solars… Això
      molesta als veïns pròxims. Però la **venda indiscriminada de droga**, l''escàndol continu al carrer
      fins a la matinada, la intimidació als veïns, la degradació ambiental… Això ens afecta a tots: a
      les falles, la Setmana Santa, les societats musicals, els comerciants, el mercat…, a tots.


      Totes les associacions del Cabanyal-el Canyamelar estan unides en la **queixa per la falta d''acció
      social de l''Ajuntament** al barri, els responsables del qual encara no han trobat el moment per
      fer-se un passeig per les zones zero per a parlar amb les persones que viuen, per a preguntar-los
      pels seus problemes. En la seua última visita van preferir evitar la zona 0, potser per això no
      són conscients de **quant és de difícil allí la convivència** i el greu problema social.


      Mireu el que ens relata una veïna que està en el Grup d''Ajuda Mútua, creat específicament per a
      la zona 0: ''Des que vaig tornar de vacances he hagut de cridar totes les nits a la Policia. Portem
      la situació amb resignació, però la meua filla comença l''institut dilluns i no vull pensar què
      faré davant de la impotència de veure-la desesperada per no poder descansar de nit i patir l''assetjament
      que patim gairebé a totes hores. L''únic consol que em queda, si tot isc com espere, és que no em
      menjaré les grans en este mitjà hostil que me está costant la salut''.


      Som conscients que els **problemes de convivència no són fàcils de resoldre**. Una comunitat de
      persones pot contaminar-se amb facilitat, però sana amb molt esforç. No obstant això, també era
      igual o molt més complicat evitar la demolició del barri pel govern anterior i, no obstant això,
      es va aconseguir.


      Sr. alcalde, celebrem l''interés pel Cabanyal. Els veïns participem activament en els projectes
      del barri però volem veure ja realitats, com la **defensa dels drets fonamentals**. **No tot es
      pot confiar a la rehabilitació urbanística**. La realitat social és molt més obstinada i necessita
      **solucions immediates**.


      Des del principi hem ofert **idees i propostes concretes**, a més del suport que podem brindar en
      l''aplicació d''eixes accions i d''altres. Idees per a **coordinar les accions de la Policia Local
      i els servicis socials** perquè veritables mediadors actuen i facen valdre els drets fonamentals
      de tots. Sempre se''ns ha dit que les propostes tenen sentit comú, però mai les hem vist aplicar.


      Seguim ací, senyors polítics. El govern sempre trobarà en els veïns una gran disposició per a treballar
      pel bé comú. Però si socialment continuen treballant al ritme i amb els resultats actuals, continuarem
      fent-los arribar les nostres crítiques i mobilitzant la ciutadania.


      Gràcies.'
