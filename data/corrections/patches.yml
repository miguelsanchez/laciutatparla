- iv_id: 2026-02-24-017
  fields:
    text_original: 'Moltes gràcies, senyora alcaldessa. Senyores, regidores, senyors regidors.


      Fa **aproximadament un any**, l''**Associació de Veïnes i Veïns de Campanar** va venir a este Ple
      per **denunciar la manca de dotacions culturals i esportives** al nostre barri. Algunes d''elles
      estan directament lligades a la **reforma del Pla General de l''àrea 04 de Campanar**. Una reforma
      que va passar d''un **procés de participació i transparència** on vàrem estar informats permanentment
      per l''equip contractat per AUMSA i dirigit per **Vicent Gregori** a una **situació de total obscuritat**
      on vam estar quasi un any sense saber qui era el nou equip redactor i en què consistien les modificacions
      i reformes que s''estaven incloent en la reforma del Pla General.


      Amb la primera informació que ens varen donar allà pel **2024** poguérem comprovar quins canvis
      havien fet. Les veïnes i veïns del **carrer Mossén Rausell** quedaven dintre d''una unitat d''actuació,
      per tant, obligats a tenir que pagar part de la urbanització dels jardins circumdants. Que on teníem
      **una zona verda, la biblioteca i un centre cívic cultural**, ens posaven adossats. On teníem dos
      edificis, **un de 8 plantes i un altre de 4**, aparegueren **un de 8, dos de 12 i un de 15**. I
      **res de les dotacions esportives**, a pesar que a Campanar ens correspon una **compensació pel
      Nou Mestalla**.


      Després del primer procés d''al·legacions desaparegué la unitat d''actuació per als veïns i veïnes
      del carrer Mossén Rausell, amb la qual cosa podrien edificar, podrien tornar a alçar les seues cases
      que van ser enderrocades perquè l''Ajuntament de València presentà un **PAI impossible** que en
      vint anys no ha anar a cap lloc i ha provocat un **deteriorament d''este entorn del barri de Campanar**
      o del poble de Campanar. Però la sorpresa en estes segones al·legacions és que li concedixen als
      seus col·legues de Carrerfour **un edifici de 20 plantes**. Què bé, per a ells clar. I sense cap
      repercussió per al barri. Respecte a la **Universitat Popular**, el més vistós és que la regidora
      de Serveis Socials ja ha posat una placa en la porta dels locals adquirits per a fer la Universitat
      Popular. I a nosaltres ens informen que tindrem la Universitat Popular en el **2027**.


      Senyora alcaldessa, amb el canvi de maceters d''ací de la plaça de l''Ajuntament hagueren pogut
      fer la Universitat Popular de Campanar. A Campanar paguem els impostos com tots, com tots els veïns
      de València. Som corresponsables amb el que fem i amb les nostres obligacions. Pensem que els de
      l''altra banda del riu també som del cap i casal, que ho haurien de tindre en compte.


      Moltes gràcies.'
    text_cas: 'Muchas gracias, señora alcaldesa. Señoras concejalas, señores concejales.


      Hace **aproximadamente un año**, la **Asociación de Vecinas y Vecinos de Campanar** vino a este
      Pleno para **denunciar la falta de dotaciones culturales y deportivas** en nuestro barrio. Algunas
      de ellas están directamente ligadas a la **reforma del Plan General del área 04 de Campanar**. Una
      reforma que pasó de un **proceso de participación y transparencia** donde estuvimos informados permanentemente
      por el equipo contratado por AUMSA y dirigido por **Vicent Gregori** a una **situación de total
      oscuridad** donde estuvimos casi un año sin saber quién era el nuevo equipo redactor y en qué consistían
      las modificaciones y reformas que se estaban incluyendo en la reforma del Plan General.


      Con la primera información que nos dieron allí por el **2024** pudimos comprobar qué cambios habían
      hecho. Los vecinos y vecinas de la **calle Mossén Rausell** quedaban dentro de una unidad de actuación,
      por tanto, obligados a tener que pagar parte de la urbanización de los jardines circundantes. Donde
      teníamos **una zona verde, la biblioteca y un centro cívico cultural**, nos ponían adosados. Donde
      teníamos dos edificios, **uno de 8 plantas y otro de 4**, aparecieron **uno de 8, dos de 12 y uno
      de 15**. Y **nada de las dotaciones deportivas**, a pesar de que a Campanar nos corresponde una
      **compensación por el Nou Mestalla**.


      Después del primer proceso de alegaciones desapareció la unidad de actuación para los vecinos y
      vecinas de la calle Mossén Rausell, con lo cual podrían edificar, podrían volver a levantar sus
      casas que fueron derribadas porque el Ayuntamiento de València presentó un **PAI imposible** que
      en veinte años no ha ido a ninguna parte y ha provocado un **deterioro de este entorno del barrio
      de Campanar** o del pueblo de Campanar. Pero la sorpresa en estas segundas alegaciones es que le
      conceden a sus colegas de Carrefour **un edificio de 20 plantas**. Qué bien, para ellos claro. Y
      sin ninguna repercusión para el barrio. Respecto a la **Universidad Popular**, lo más llamativo
      es que la concejala de Servicios Sociales ya ha puesto una placa en la puerta de los locales adquiridos
      para hacer la Universidad Popular. Y a nosotros nos informan de que tendremos la Universidad Popular
      en el **2027**.


      Señora alcaldesa, con el cambio de macetas de aquí de la plaza del Ayuntamiento hubieran podido
      hacer la Universidad Popular de Campanar. En Campanar pagamos los impuestos como todos, como todos
      los vecinos de València. Somos corresponsables con lo que hacemos y con nuestras obligaciones. Pensamos
      que los de la otra orilla del río también somos del cap i casal, que deberían tenerlo en cuenta.


      Muchas gracias.'
