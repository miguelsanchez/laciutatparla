    text_val: 'Bon dia. Abans de res vull donar les gràcies per estar ací en l''Ajuntament de València.
      Parle en representació d''AEDIVA, també de FOTUR, soc consell de FOTUR. AEDIVA és, perquè ho sàpien,
      de pubs i discoteques.


      Volíem dir que teníem ganes d''estar ací i sobretot que ens done l''oportunitat per al tema del
      carril bus, que ens han llevat la intervenció de poder estar i sobretot tindre eixa oportunitat
      de que ens done el Sr. Grezzi. Hem donat registres d''entrades per a poder parlar amb ell, ens han
      sigut denegats i, bé, a veure si el Sr. Grezzi pot ser capaç de donar-nos eixa oportunitat de parlar.


      També presentem 6.000 firmes sobre el carril bus perquè ens deixen eixes places d''aparcament. S''ha
      vist seriosament agreujat perquè ha sigut un 40 % de pèrdues en la restauració i en tot el sector
      de discoteques i pubs. I no afecta sobretot a este sector sinó que també afecta al veí que està
      en el centre, eixe pobre veí que va a agafar a les 6 del matí el cotxe i no pot agafar-lo perquè
      no té eixa plaça d''aparcament.


      Des d''ací demane a veure si ens pot atendre algun dia el Sr. Grezzi.


      Estava un poquet nerviós, la meua primera intervenció. Moltes gràcies.'
