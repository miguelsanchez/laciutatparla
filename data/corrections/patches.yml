  fields:
    text_original: 'Buenos días.

      Soy **enrique Martín**, pertenezco a la **Asociacion ACOEC** y vengo también en representación de
      la **Coordinadora Valenciana de ONGD**.

      Voy a leer un comunicado de la Coordinadora:

      ''Estimadas señoras y señores concejalas y concejales de la ciudadanía de **València**.

      Es para la **Coordinadora Valenciana de ONGD**, que representa a **91 organizaciones** no gubernamentales
      para el desarrollo, un honor estar hoy aquí en el Pleno para la aprobación de las propuestas de
      **Plan de Cooperación Internacional para el Desarrollo 2019-2022** del Ayuntamiento de València
      y la **Estrategia de Educación para la Ciudadanía Global** en el ámbito no formal en la ciudad de
      València (2018-2021).

      Por primera vez desde hace **23 años**, desde el **año 1995** que empezó a andar la política municipal
      de cooperación al desarrollo, se ha trabajado en un **Plan Municipal de Cooperación al Desarrollo**
      y una primera **Estrategia de Educación** de manera participativa, con un **proceso participativo
      inédito** en el que las ONGD hemos trabajado mucho, escuchando y trabajando codo a codo con los
      agentes de la cooperación, cuyo resultado, además, pone las bases para una futura política municipal
      de calidad, consensuada, de carácter estratégica y a la vez operativa, y con un rumbo bien enfocado.
      Nuestra felicitación por el magnífico trabajo realizado al equipo que lo ha trabajado y a todos
      y a todas que han participado.

      Asimismo, queremos reconocer con esta aprobación cómo la corporación municipal consolida el impulso
      dado a la cooperación para el desarrollo en la ciudad de València, que empezó con la creación en
      **mayo de 2015** de la **Concejalía de Cooperación al Desarrollo y Migración**, de la cual queremos
      reconocer el buen trabajo que están realizando los técnicos y las técnicas municipales, la constitución
      y puesta en funcionamiento del **Consejo Municipal de Cooperación**, y el **aumento significativo
      del presupuesto** de cooperación al desarrollo. En este punto, aunque aún estamos lejos de cumplir
      el compromiso de destinar el **0,7 %** de los presupuestos consolidados del Ayuntamiento a cooperación,
      en estos últimos tres años el presupuesto se ha **multiplicado por cinco** reflejando el compromiso
      con la solidaridad y la lucha contra la pobreza del pueblo valenciano. Esperamos seguir ese camino
      y conseguir el **0,7 % comprometido** en los próximos años, estamos convencidas.

      Por todo ello, desde las organizaciones no gubernamentales queremos hacer un llamamiento a todos
      los grupos y partidos políticos como representantes que son ustedes de la solidaridad de todos los
      vecinos y vecinas de València, para que se aprueben por unanimidad estos instrumentos de la política
      municipal de cooperación al desarrollo que finalmente redundan en mejoras en los derechos y condiciones
      de vida para la ciudadanía tanto de nuestra ciudad, como de las personas de otros municipios en
      el mundo.''

      Muchas gracias.'
    text_val: 'Bon dia.

      Soc **Enrique Martín**, pertanc a l''**Associació ACOEC** i vinc també en representació de la **Coordinadora
      Valenciana d''ONGD**.

      Vaig a llegir un comunicat de la Coordinadora:

      ''Estimades senyores i senyors regidores i regidors de la ciutadania de **València**.

      És per a la **Coordinadora Valenciana d''ONGD**, que representa a **91 organitzacions** no governamentals
      per al desenvolupament, un honor estar hui ací al Ple per a l''aprovació de les propostes de **Pla
      de Cooperació Internacional per al Desenvolupament 2019-2022** de l''Ajuntament de València i de
      l''**Estratègia d''Educació per a la Ciutadania Global** en l''àmbit no formal a la ciutat de València
      (2018-2021).

      Per primera vegada des de fa **23 anys**, des de l''**any 1995** que va començar a caminar la política
      municipal de cooperació al desenvolupament, s''ha treballat en un **Pla Municipal de Cooperació
      al Desenvolupament** i una primera **Estratègia d''Educació** de manera participativa, amb un **procés
      participatiu inèdit** en el qual les ONGD hem treballat molt, escoltant i treballant braç a braç
      amb els agents de la cooperació, el resultat del qual, a més, posa les bases per a una futura política
      municipal de qualitat, consensuada, de caràcter estratègic i alhora operatiu, i amb un rumb ben
      enfocat. La nostra felicitació pel magnífic treball realitzat a l''equip que l''ha treballat i a
      tots i totes les que han participat.

      Així mateix, volem reconéixer amb esta aprovació com la corporació municipal consolida l''impuls
      donat a la cooperació per al desenvolupament a la ciutat de València, que va començar amb la creació,
      al **maig de 2015**, de la **Regidoria de Cooperació al Desenvolupament i Migració**, de la qual
      volem reconéixer el bon treball que estan realitzant els tècnics i les tècniques municipals, la
      constitució i posada en funcionament del **Consell Municipal de Cooperació**, i l''**augment significatiu
      del pressupost** de cooperació al desenvolupament. En este punt, encara que encara estem lluny de
      complir el compromís de destinar el **0,7 %** dels pressupostos consolidats de l''Ajuntament a cooperació,
      en estos últims tres anys el pressupost s''ha **multiplicat per cinc** reflectint el compromís amb
      la solidaritat i la lluita contra la pobresa del poble valencià. Esperem seguir este camí i aconseguir
      el **0,7 % compromés** en els pròxims anys, n''estem convençudes.

      Per tot això, des de les organitzacions no governamentals volem fer una crida a tots els grups i
      partits polítics com a representants que sou vosaltres de la solidaritat de tots els veïns i veïnes
      de València, perquè s''aproven per unanimitat estos instruments de la política municipal de cooperació
      al desenvolupament que finalment reverteixen en millores en els drets i condicions de vida per a
      la ciutadania tant de la nostra ciutat, com de les persones d''altres municipis del món.''

      Moltes gràcies.'
