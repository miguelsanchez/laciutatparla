      es el **ruido del ocio** el único ruido que preocupa en la ciudad. Y particularmente el ruido de
      las pymes, que no existe, que tal y como se ha dicho están perfectamente insonorizadas.


      Después de esos 30 años en esta legislatura, teniendo en cuenta modificaciones legislativas que
      se produjeron en la Ordenanza en la anterior legislatura, se obliga al Ayuntamiento para tramitar
      una ZAS a algo fundamental y es a **poner en marcha medidas preventivas** para luchar contra el
      ruido y no para luchar contra la hostelería. Eso se introdujo en la **Ordenanza de Contaminación
      Acústica** en el **2023**, porque lo que no podía ser es que un ayuntamiento al que se le condenara
      en los tribunales terminara arruinando empresas por no ser capaz de diseñar un **plan de choque
      contra el ruido**.


      Ese **plan de choque** se ha puesto en marcha esta legislatura, lo ha financiado el propio **Ayuntamiento
      de València**. Se han hecho **ensayos científicos** para valorar las moquetas, las señales luminosas,
      las membranas fonoabsorbentes. Hemos hecho cosas en **València** que están observando desde el resto
      de las capitales españolas. Se han hecho **cursos de formación** para controladores de acceso. Se
      ha implantado la figura de la **mediación social de los silenciadores**, que se han hecho populares.
      Y que ahora, como están pagados por las empresas, porque evidentemente la financiación es privada,
