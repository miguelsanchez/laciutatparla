    text_val: Bon dia. Mire, no sé què, no sé quants, **entre tots fem poble**. Així és com acaben els
      bans a les pedanies de València. **Entre tots fem poble**. Però després resulta que nosaltres no
      sabem qui és entre tots. Fixin-se, **el passat 17 de juliol entre tots votàrem a favor del brau
      embolat**, de manera **democràtica i majoritària** es va votar a favor del brau embolat. I després
      vostés, que no creuen en la democràcia, **ho van prohibir**. Perquè els dóna la gana, perquè **no
      respecten les pedanies**. I després cal llegir una entrevista de la senyora Castillo que diu tot
      el que han invertit en les pedanies i tot el que els preocupen, doncs no és així. Jo he vist els
      números. **El Govern anterior del Partit Popular va invertir 265 milions a les pedanies**, una mitjana
      de 11 milions a l'any. **Vostés no arriben ni als 4,5**, o sia, molt menys. Vostés han invertit
      molt menys i els preocupen molt menys les pedanies que al Govern del Partit Popular anterior. El
      que sí que els preocupa molt a vostés és **prohibir les tradicions del poble** i imposar el seu
      criteri. Perquè el senyor Ribó, com a bon dictador, fa del seu gust personal la llei a seguir per
      tots. Que li agraden els titellaires? Piqueu titellaires catalanistes tots els dissabtes a la vesprada
      a la plaça del poble. Que no li agraden els toros? Doncs els prohibeix. Que li encanta la Cavalcada
      de les Reis Majos de gener? Doncs ahí tenim una festa absurda i horterada que a ningú li importa
      ni li interessa tots els gener. Em pregunte per què li agrada tant a vostè la Cavalcada de les Reis
      Majos si no comparteix cap dels tres valors que aquests reis intenten transmetre. Per exemple està
      la llibertat, és que vostè no coneix la llibertat. **La llibertat és poder triar el col·legi** que
      més m'agrade per als meus fills, siga públic o concertat. De fet, és **triar la llengua vehicular
      de l'educació** dels meus fills, que no me l'haja d'imposar vostè o la senyora Oltra. La llibertat
      és poder moure's per la ciutat lliurement, caminant, en bicicleta, en patinet, però també en cotxe,
      com fa vostè amb el cotxe oficial que se'n va al carrer Colón a inaugurar una escultura en cotxe
      oficial i el deixa mal aparcat. Què passa, que està liat i té molta feina. Oi que sí? No pot anar
      en bicicleta? Doncs bé, com vostè, cada vegada que agafe el cotxe oficial pensi que la resta de
      valencians també tenen molta feina i estan liats, i han d'agafar el cotxe. I ja no es pot agafar
      el cotxe, que València és un embús continu, que [inaudible] contaminada. Vol premiar la bicicleta?
      Vol potenciar-la? Potencie-la, que a mi em sembla estupendíssim, però **deixe de posar traves al
      cotxe**. Així que vostè no coneix la llibertat. Tampoc coneix el segon valor de les reis majos de
      gener, la fraternitat. Permeta'm que li explique. El poble valencià és un poble de fraternitat,
      d'unió, de germanor. **El nostre bilingüisme és un senyal d'identitat**. Fa anys, a Canal Nou hi
      havia una sèrie, L'Alqueria Blanca, on tots els personatges parlaven en castellà i en valencià.
      Una sèrie bilingüe de manual. Fa poc, a À Punt Directe, el senyor, el presentador d'allí, Juan Nieto
      Ivars, **es va negar a parlar en castellà**, i això que estava entrevistant una persona que li deia
      que parlara en castellà, que no entenia el valencià. I ell es va negar. Així que jo li dic a vostè
      que agafe la seua amiga Mònica Oltra, que se'n vagen a la direcció d'À Punt i **que el facen dimitir
      i expulsen aquest senyor** de la televisió pública. Perquè **la televisió pública és de tots i València
      és bilingüe**, i la televisió pública ha de parlar en les dues llengües. I per últim, permeta'm
      que li parle de la igualtat, de l'últim valor d'aquests reis. La igualtat és tractar a tots per
      igual. L'any passat una associació de motoristes volia fer una marxa per repartir regals als xiquets
      amb càncer i **vostè ho va prohibir**. Però no li fa fàstic prohibir que es facen regals als xiquets
      malalts? Però no li repugnen les seues prohibicions? És que vostè és un dictador que fa el que li
      dona la gana, que no atén a cap mena de raó. L'alcaldessa de Bonrepòs, per exemple, que és de Compromís,
      del seu mateix partit, permet que hi haja brau embolat, en el poble del costat de Carpesa. I vostè
      ho prohibeix perquè li dona la gana. Li vaig a dir una cosa, i li la vaig a dir en valencià, **en
      la llengua del meu poble**, perquè jo sóc bilingüe com el meu poble. **Mai una prohibició havia
      eliminat una tradició**. Les tradicions desapareixen si no tenen seguidors, però mai una prohibició
      ha eliminat una tradició. **Als pobles de València tornarem a embolar**, vostè passarà, vostè és
      una anècdota, i als pobles de València tornarem a embolar, que li quede ben clar. Tornarem a embolar.
