- iv_id: 2022-02-24-001
  fields:
    text_val: 'Bon dia, senyor alcalde, regidores, regidors, senyora regidora de Personal.


      Hui este hemicicle, com a màxim òrgan de representació política, té la potestat de que **es complisquen
      els acords i compromisos** amb les treballadores i treballadors d''este ajuntament a través d''esta
      moció. No és el lloc idoni per a això, ja ho sabem, pel fet que existeix una taula de negociació.
      Però quan **s''impedeix o es retalla la capacitat de negociar**, com és el que està ocorrent últimament,
      no queda una altra opció que portar-ho ací i que cadascú assumisca la seua responsabilitat i compromís
      perquè els treballadors municipals.


      El Govern arriba a **un acord al juliol de 2020** amb els seus empleats respecte a la compensació
      de la pandèmia. Hui, amb un missatge generalitzat i inequívoc de tornada a la normalitat, **és el
      moment de concedir eixos dies**. El compromís adquirit va ser de **cinc dies per als serveis amb
      caràcter essencial** i de manera presencial van estar prestant les seues funcions en aquells durs
      dies. Cinc dies, sense més. I com així consta en l''acta d''aquella taula. Mesos després, la senyora
      Notario, i a proposta d''alguns sindicats, se li va sol·licitar que estengués l''acord als serveis
      que van incorporar personal durant eixe període de manera variable, responent vostè que ens donaria
      una resposta al respecte. Posteriorment va vindre amb unes taules on es feia entrega gradual d''eixos
      dies, segons els dies concrets que s''hagueren personat en els seus llocs. Una cosa que tots els
      sindicats, i com a proposta de complement a la inicial, veíem encertades i fins i tot va acceptar
      proposta de millora al respecte que li va fer a alguna organització sindical, però sense arribar
      a cap acord concret sobre la mateixa.


      Però pel que fa al personal que va complir el seu horari **no ha de haver-hi cap dubte**. I ací
      és on des dels sindicats entenem que ha d''estar **l''error de comunicació**, ja que no podem entendre-ho
      d''una altra manera, perquè el contrari significaria mala fe per part seua, cosa que òbviament no
      podem ni concebre. Amb les respostes que ha donat en la taula sembla donar a entendre que el personal
      que haja de rebre eixos cinc dies ha d''haver treballat presencialment tots els dies laborables.
      Una cosa que, per cert, no es concreta en l''acord inicial. Però clar, estos dies no poden ser uns
      altres que tots els dies que havien de treballar dins dels seus horaris. Li posaré un exemple. Un
      infermer metge de medicina laboral amb un torn de dilluns a divendres que va treballar tot el seu
      torn en eixes setmanes. Quants dies li va a reconéixer? Cinc dies, oi? Ara un altre. Una bomber
      que en eixe mateix període de treball les guàrdies que li corresponien conforme al seu horari especial
      acordat en taula, igual que l''infermer, va complir amb tot el seu horari acordat. Què li toquen?
      Cinc dies, oi? I a una policia que ha complit tot el seu horari acordat en taula també, què li correspon?
      Cinc, oi? I el mateix és aplicable a tots els serveis que en eixes dates van complir el seu horari
      establit. L''contrari és negar el que ja els va concedir. Tant és així que consultats per personal,
      tots dos serveis de l''Àrea de Protecció de Policia i Bombers, i com així consta en Taula de Bombers,
      la resposta per la delegació va ser: ''El personal que va acudir al servei -per cert, la immensa
      majoria excepte personal de baixa laboral pel fet que es van congelar les llicències- este personal
      va complir amb tot el seu horari establit''. I no solament fins al 9 d''abril del 2020, sinó que
      el seu horari especial es va prolongar fins a finals de maig. I en el cas dels policies de barri
      fins a finals de l''estiu, fins i tot.


      En la Comissió d''Interior de la passada setmana i a proposta en este cas del Grup Popular, secundada
      pels grups Ciutadans i Vox, comissió a la qual ens hagués agradat donar esta exposició, cosa que
      sorprenentment **ens va impedir** quan en altres ocasions no ha hagut cap problema quan s''abordaven
      qüestions de naturalesa laboral, deixant als seus companys de govern del Grup Socialista i fins
      i tot el propi secretari municipal en una difícil situació per a justificar-li. És paradoxal que
      es porte ací **una moció del grup Ciutadans**, a qui li agraïm la mateixa i amb el suport de la
      resta de grups de l''oposició, per a instar que els grups del govern complisquen amb els seus propis
      acords.


      Li demane encarregadament que **s''esmene, rectifique o almenys ens aclarisca** si és possible que
      ens hàgem equivocat a l''hora d''eixa interpretació amb motiu d''eixa ampliació respecte a l''horari
      inicial, a l''acord inicial. Però no s''entête a seguir per un camí que **li desautoritza per a
      continuar arribant a acords** amb representants dels treballadors i treballadores, i que el deixarà
      en un mal lloc amb la plantilla generant **tensió innecessària**. A més, genera una **falta d''ètica
      política** per als seus socis de govern, perquè sense menjar-ho ni beure-ho, i més encara sense
      entendre-ho, genera crispació en els col·lectius fonamentals de la seua Delegació de Protecció Ciutadana.
      No els obliga a votar en contra d''una cosa que no han generat ni provocat i amb la qual hauran
      de lidiar per la seua gestió, senyora Notario. Esmene, aclarisca i rectifique la moció. O faça el
      que considere. Tot menys mantindre''s en eixa posició incongruent. Assumisca la seua responsabilitat
      de la situació. Pense en les i els treballadors que estan ahi fora i que ja li dic que **no renunciaran**
      al que vostè mateixa va acordar. I si, almenys, a diferència de les distintes taules celebrades
      o de la Comissió d''Interior, d''ací eixim amb **una resposta clara** a quins col·lectius o a qui
      o quan se''ls aplica eixos cinc dies que es van acordar ja haurem avançat molt.


      Senyor alcalde, senyora vicealcaldessa, només dir-los que **tan responsable és qui genera la situació**,
      que ja queda clar, com qui la consent.


      Moltes gràcies.'
