- iv_id: 2024-12-20-005
  fields:
    text_original: 'Bé, intentaré ser clar i objectiu, i no ridícul com moltes de les declaracions que
      s''han sentit ací hui. I en segon lloc, encomanar a l''alcaldessa que ens convide un altre dia per
      a parlar de **propostes clares** i estarem encantats de tornar al nostre ajuntament.

      Bé, han passat **52 dies** des que tinguera lloc el **major desastre natural** de la història dels
      valencians. En el cas que ens ocupa, les **tres pedanies** o pobles de la ciutat de València, la
      **Torre-Faitanar**, Forn d''Alcedo i Castellar l''Oliveral. Vinc en representació dels veïns i veïnes
      de la Torre-Faitanar. Si la gestió de l''emergència va ser **desastrosa i negligent** per part de
      la Generalitat Valenciana, la de l''Ajuntament de València no se n''allunya molt. És una idea unànime
      al meu barri. Quina sorpresa, no? Com és que no ens van avisar? Per què no hi havia cap policia
      la vesprada del 29? I a l''endemà? Parlem dels bombers voluntaris? Com ha explicat recentment la
      fiscal **María José Montesinos de Lago**, s’han admés les denúncies per a investigar en una única
      macrocausa els possibles següents delictes: **prevaricació, lesions, homicidis imprudents**, omissió
      del dret de socors i danys imprudents i contra els drets dels treballadors. Estos delictes naixen
      com a conseqüència directa de la no adopció de certes decisions que amb prou objectivitat haurien
      evitat o minvat els fatals resultats. Especialment pel que fa al nombre de víctimes mortals, **223
      oficials** fins al moment, 14 de les quals a la Torre-Faitanar. Aquests fets establixen, doncs,
      una relació causa-efecte amb la consegüent d''atribució de responsabilitat criminal de naturalesa
      objectiva, verificable tan sols en parar atenció al resultat.

      El dia **29 d''octubre**, per tant, hi hagué una desatenció dels deures que tenien les màximes autoritats
      autonòmiques valencianes i, de retruc, les municipals, les de l''Ajuntament de **València** al qual
      pertanyem. Tinc la sensació que no són conscients de les responsabilitats que tenen. Ara, per exemple,
      quan jo parle, mira el telèfon. Que utilitzen les figures de poder que ostenten per a fer de València
      una mena d''escenari turístic i lucrar-se a tota costa i poca cosa més. Cal recordar que la **passivitat
      i la inacció** front als escenaris d''alertes i missatges que diversos organismes aquell dia, com
      l’**AEMET** i la Confederació Hidrogràfica del Xúquer, emetien i el nul dictat de resolucions i
      de decisions que només eren competència en primera instància del senyor Mazón i de la senyora Catalá.
      Dit ras i curt, els responsables no evitaren o almenys no reduïren la magnitud de la catàstrofe
      coneguda per tots els presents. Les responsabilitats polítiques que s''han de demanar tothom les
      coneix. Ja arribarà aquesta via judicial.

      De manera paral·lela a la gestió dels protocols de prevenció i de l''emergència cal preguntar-se
      què s''ha fet fins al moment per tal de pal·liar els efectes. Poca cosa, diria qualsevol persona
      que viu a la Torre. Volem explicacions sobre què s''està duent a terme, què hi ha previst, volem
      **dades clares, objectives i coherents**. Percebem que s''intenta amagar la nefasta gestió mentres
      s’executen projectes a tort i a dret i es repartix el pastís. El principal problema és la **falta
      de comunicació i transparència**. Els veïns ens assabentem de les informacions d''interés a través
      de xarxes socials. no oficials en molts casos, o gràcies a la transmissió entre veïns. **S''ha de
      posar en marxa** un sistema d''informació clar a través dels canals oficials i la creació d''un
      tauler d''anuncis, que crec que té per nom Mupi. **Exigim transparència i comunicació**, estem desinformats.
      Cada persona té una versió diferent. No sabem què s''està fent, en què s''estan gastant amb detall
      els nostres impostos.

      La Torre és un **barri especial**, sens dubte. Vull fer notar que consta de **cinc parts**: el nucli
      urbà, les alqueries de Faitanar, la nova zona urbana de Sociòpolis, el barri de Sant Jordi i el
      nucli a la fi del terme municipal de València conegut com a Camañez. D''entrada, cal considerar
      totes i cadascuna de les persones que viuen en aquestes zones com a iguals, sense distinció. La
      Torre-Faitanar, a més, es caracteritza per tindre un **caràcter insular**. Està enmig del no res,
      envoltada d''autovies, camps i vies de tren, sense cap nucli de població col·lateral al qual no
      s''accedix que a través d''un pont o travessant una carretera. És important de tindre present. Tota
      aquesta morfologia s''ha de considerar l''hora de prendre decisions a curt i llarg termini. És en
      part aquesta morfologia la que ha causat els danys de la barrancada, vull dir, que hagen sigut molt,
      molt greus. A estes cinc parts afectades per la **DANA** cal sumar els **greuges històrics**. Hi
      ha zones amb mancances tan greus com l''enllumenat públic, l''accés a l''aigua corrent o la connexió
      amb transport públic. És per això que demanem la declaració de la Torre-Faitanar i dels altres pobles
      del sud afectats que estan ací també representats com a zones vulnerables, a fi de destinar tots
      els recursos posibles provinents de totes les institucions que tinguen competències. L''abandonament
      no pot continuar, calen **mesures fermes** en tot el barri.

      La possible solució només té dues paraules: **pla integral**. Un pla que estudie cada dia que passa
      les necessitats del barri en tots els sentits possibles: que millore el **transport**, més freqüències
      en les línies de l’EMT, instal·lació d’estacions de Valenbisi. També les **infraestructures**: l''enllumenat,
      l''asfaltat, el clavegueram, la recollida de residus. I també les necessitats d''abastiment, els
      serveis municipals i l''augment de la seguretat, ara per ara inexistent. Hi ha escassetat de contenidors.
      Els autobusos municipals van complets a la segona parada. No tenim un lloc on comprar. Els ascensors
      no funcionen. Hi ha gent gran que encara no ha baixat al carrer. Continuen les muntanyes de cotxes.
      Els semàfors no funcionaven fins ahir. Continuem amb l''enumeració? Crec que no fa falta. Els problemes
      s''acumulen i podria seguir amb un llistat de denúncies i de coses que s''han fet irregularment.
      El que sí que hem tingut, això sí, són llums de Nadal per a donar i per vendre. Bé, en definitiva,
      cal posar en marxa -i acabe- **plans ferms d''inclusió social**, d''atenció a la dependència a la
      salut mental. Cal **recuperar els serveis** que teníem abans del 29 d''octubre i reforçar-los encara
      més. Entre els quals hi ha, per exemple, la biblioteca, la universitat popular, etcètera.

      Siga com siga, la Torre-Faitanar sembla que sempre ha sigut **un barri de segona mà** on tots hem
      tingut alguna vegada la sensació de no pertànyer a València. **Exigim mesures urgents**, claredat
      i transparència, i rebre els recursos propis de pertànyer a una ciutat amb un alt pressupost. Del
      contrari, no sabem què fem pagant impostos d''or per acabar rebent coure. I una idea final, les
      **situacions excepcionals** requerixen solucions excepcionals i serveis públics de qualitat, justícia
      i memòria, no caritat i una gestió basada en la mentida i en l''embolic.

      Gràcies per l''atenció.'
    text_cas: 'Bueno, intentaré ser claro y objetivo, y no ridículo como muchas de las declaraciones que
      se han oído aquí hoy. Y en segundo lugar, encargar a la alcaldesa que nos invite otro día para hablar
      de **propuestas claras** y estaremos encantados de volver a nuestro ayuntamiento.

      Bueno, han pasado **52 días** desde que tuviera lugar el **mayor desastre natural** de la historia
      de los valencianos. En el caso que nos ocupa, las **tres pedanías** o pueblos de la ciudad de València,
      la **Torre-Faitanar**, Forn d''Alcedo y Castellar l''Oliveral. Vengo en representación de los vecinos
      y vecinas de la Torre-Faitanar. Si la gestión de la emergencia fue **desastrosa y negligente** por
      parte de la Generalitat Valenciana, la del Ayuntamiento de València no se aleja mucho. Es una idea
      unánime en mi barrio. ¡Qué sorpresa, no? ¿Cómo es que no nos avisaron? ¿Por qué no había ningún
      policía la tarde del 29? ¿Y al día siguiente? ¿Hablamos de los bomberos voluntarios? Como ha explicado
      recientemente la fiscal **María José Montesinos de Lago**, se han admitido las denuncias para investigar
      en una única macrocausa los posibles siguientes delitos: **prevaricación, lesiones, homicidios imprudentes**,
      omisión del deber de socorro y daños imprudentes y contra los derechos de los trabajadores. Estos
      delitos nacen como consecuencia directa de la no adopción de ciertas decisiones que con suficiente
      objetividad habrían evitado o reducido los fatales resultados. Especialmente en lo que respecta
      al número de víctimas mortales, **223 oficiales** hasta el momento, 14 de las cuales en la Torre-Faitanar.
      Estos hechos establecen, pues, una relación causa-efecto con la consiguiente atribución de responsabilidad
      criminal de naturaleza objetiva, verificable tan solo con prestar atención al resultado.

      El día **29 de octubre**, por tanto, hubo una desatención de los deberes que tenían las máximas
      autoridades autonómicas valencianas y, por añadidura, las municipales, las del Ayuntamiento de **València**
      al que pertenecemos. Tengo la sensación de que no son conscientes de las responsabilidades que tienen.
      Ahora, por ejemplo, cuando yo hablo, mira el teléfono. Que utilizan las figuras de poder que ostentan
      para hacer de València una especie de escenario turístico y lucrarse a toda costa y poco más. Hay
      que recordar que la **pasividad e inacción** frente a los escenarios de alertas y mensajes que varios
      organismos aquel día, como la **AEMET** y la Confederación Hidrográfica del Júcar, emitían y el
      nulo dictado de resoluciones y de decisiones que solo eran competencia en primera instancia del
      señor Mazón y de la señora Catalá. Dicho en pocas palabras, los responsables no evitaron o al menos
      no redujeron la magnitud de la catástrofe conocida por todos los presentes. Las responsabilidades
      políticas que hay que exigir todos las conocen. Ya llegará esa vía judicial.

      De manera paralela a la gestión de los protocolos de prevención y de la emergencia hay que preguntarse
      qué se ha hecho hasta el momento para paliar los efectos. Poca cosa, diría cualquier persona que
      vive en La Torre. Queremos explicaciones sobre qué se está llevando a cabo, qué hay previsto, queremos
      **datos claros, objetivos y coherentes**. Percibimos que se intenta ocultar la nefasta gestión mientras
      se ejecutan proyectos a diestro y siniestro y se reparte el pastel. El principal problema es la
      **falta de comunicación y transparencia**. Los vecinos nos enteramos de las informaciones de interés
      a través de redes sociales, no oficiales en muchos casos, o gracias a la transmisión entre vecinos.
      **Hay que poner en marcha** un sistema de información claro a través de los canales oficiales y
      la creación de un tablón de anuncios, que creo que se llama Mupi. **Exigimos transparencia y comunicación**,
      estamos desinformados. Cada persona tiene una versión distinta. No sabemos qué se está haciendo,
      en qué se están gastando con detalle nuestros impuestos.

      La Torre es un **barrio especial**, sin duda. Quiero hacer notar que consta de **cinco partes**:
      el núcleo urbano, las alquerías de Faitanar, la nueva zona urbana de Sociópolis, el barrio de Sant
      Jordi y el núcleo al final del término municipal de València conocido como Camañez. De entrada,
      hay que considerar a todas y cada una de las personas que viven en estas zonas como iguales, sin
      distinción. La Torre-Faitanar, además, se caracteriza por tener un **carácter insular**. Está en
      medio de la nada, rodeada de autovías, campos y vías de tren, sin ningún núcleo de población colateral
      al que no se accede más que a través de un puente o atravesando una carretera. Es importante tenerlo
      presente. Toda esta morfología debe considerarse a la hora de tomar decisiones a corto y largo plazo.
      Es en parte esta morfología la que ha causado los daños de la barrancada, quiero decir, que hayan
      sido muy, muy graves. A estas cinco partes afectadas por la **DANA** hay que sumar los **agravios
      históricos**. Hay zonas con carencias tan graves como el alumbrado público, el acceso al agua corriente
      o la conexión con el transporte público. Por eso pedimos la declaración de la Torre-Faitanar y de
      los otros pueblos del sur afectados que están aquí también representados como zonas vulnerables,
      a fin de destinar todos los recursos posibles provenientes de todas las instituciones que tengan
      competencias. El abandono no puede continuar, se necesitan **medidas firmes** en todo el barrio.

      La posible solución solo tiene dos palabras: **plan integral**. Un plan que estudie cada día que
      pasa las necesidades del barrio en todos los sentidos posibles: que mejore el **transporte**, más
      frecuencias en las líneas de la EMT, instalación de estaciones de Valenbisi. También las **infraestructuras**:
      el alumbrado, el asfaltado, el alcantarillado, la recogida de residuos. Y también las necesidades
      de abastecimiento, los servicios municipales y el aumento de la seguridad, ahora mismo inexistente.
      Hay escasez de contenedores. Los autobuses municipales van llenos en la segunda parada. No tenemos
      un lugar donde comprar. Los ascensores no funcionan. Hay gente mayor que todavía no ha bajado a
      la calle. Siguen las montañas de coches. Los semáforos no funcionaban hasta ayer. ¿Continúo con
      la enumeración? Creo que no hace falta. Los problemas se acumulan y podría seguir con un listado
      de denuncias y de cosas que se han hecho irregularmente. Lo que sí hemos tenido, eso sí, son luces
      de Navidad para dar y tomar. Bueno, en definitiva, hay que poner en marcha -y termino- **planes
      firmes de inclusión social**, de atención a la dependencia y a la salud mental. Hay que **recuperar
      los servicios** que teníamos antes del 29 de octubre y reforzarlos aún más. Entre los que se encuentran,
      por ejemplo, la biblioteca, la universidad popular, etcétera.

      Sea como sea, la Torre-Faitanar parece que siempre ha sido **un barrio de segunda mano** en el que
      todos hemos tenido alguna vez la sensación de no pertenecer a València. **Exigimos medidas urgentes**,
      claridad y transparencia, y recibir los recursos propios de pertenecer a una ciudad con un alto
      presupuesto. De lo contrario, no sabemos qué hacemos pagando impuestos de oro para acabar recibiendo
      cobre. Y una idea final: las **situaciones excepcionales** requieren soluciones excepcionales y
      servicios públicos de calidad, justicia y memoria, no caridad y una gestión basada en la mentira
      y en el enredo.

      Gracias por su atención.'
