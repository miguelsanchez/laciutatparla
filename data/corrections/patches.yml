    text_cas: ''
    text_val: Bon dia. Primer, vaig a parlar en castellà perquè és la meua **llengua materna** i m'agradaria
      que tothom m'entenguera també. Jo, afortunadament, he aprés a parlar valencià, però per expressar
      certes coses i poder representar a la qual vinc a representar ací em sent més còmode encara en castellà.
      Primer, moltes gràcies a Lucía, a Maite, que contactaren amb nosaltres. Jo vinc per l'**Associació
      Intercultural Candombe**, però perquè no puc vindre pel meu treball que era al **Centre del Carme**.
      I bé, vaig començar. Bon dia, em dic David Calabuig i sóc **extreballador del Centre del Carme**,
      **alberg de baixa exigència per a persones sense llar** de la ciutat de València. Baixa exigència
      dins dels albergs de persones sense llar és **el més baix del més baix**. Les persones que no poden
      anar a Casa Caridad, que no poden anar a Sant Joan de Déu són les que venien a nosaltres, perquè
      per **problemes d'addicció, problemes de malaltia mental** no eren acceptades en cap altre lloc.
      Quan en les notícies llegisc que **tanca el centre amb capacitat per a 11 persones** veig un número.
      És el que va veure molta gent i el que segurament vegen els que han decidit tancar el centre. Per
      a mi no és un número. Hui vinc a parlar en nom de **Fernando, de Kevin, de Yasin, de David, de Juan
      José, de José Juan i de Pedro**. **Les últimes set persones que van dormir la nit del 21 d'abril**
      d'este any al Carme. Malgrat les promeses que **ningú es quedaria al carrer**, tan sols un d'ells
      va rebre una alternativa aquella nit. **Les altres sis van haver de buscar cartons** i procurar-se
      alguna manta per a poder passar la nit a l'ras. Un d'ells, Fernando, es va recordar de l'**article
      47 de la Constitució**. Amb llàgrimes volent escapar dels seus ulls, es preguntava per què eixe
      article no és tan sagrat com altres, per què **el dret a l'habitatge** no importa als que manen.
      Alguns d'ells van buscar la seua sort en algun dels **assentaments de persones sense llar** que
      tant sembla que molesten i que s'empenyen a desmantellar sense donar una solució real. Em diuen
      que la solució és enviar-los al CAST o al CAI perquè els donen allotjament. De veres? Els vaig a
      donar una notícia per si no la saben, **el CAST i el CAI estan desbordats**. Poden anar allí i comprovar-ho.
      No tenen **places d'alberg que oferir**, no les tenen. Des de fa bastant temps. Enviar-los allí
      fent-los creure que els van a oferir alguna cosa em sembla una **crueltat absolutament innecessària**.
      Ens tanquen el centre i ens diuen que és perquè **el local no compleix les condicions de seguretat**.
      Entre explicacions farragoses que no ens arriben directament sinó sempre de manera indirecta, ens
      diuen que fonamental és la **falta d'una eixida d'emergència**. Reclamació que portem fent en altres
      anys perquè ho entenien com un perill. Però de sobte està bé. Després de deu anys, eixe és el motiu.
      Però llavors, si no compleix les condicions, per què ens assabentem ara que **serà obert en moments
      puntuals per emergències, per danes, per onades de calor, onades de fred**? Si no compleix les condicions,
      com pot ser que eixos dos dies sí que es puga obrir? És a dir, un restaurant que no tinguera la
      llicència per problemes de seguretat es podria obrir en Nit de Cap d'Any? Si no les compleix, no
      les compleix. Bé, és que no ho entenc. Sincerament, no ho entenc. S'ha dit també que hi havia una
      **ampliació de places**. Que **Fundación Salud y Comunidad**, que era l'associació en la qual jo
      treballava que gestionava el Centre del Carme, de **titularitat pública**, anava a rebre una major
      dotació econòmica per a poder acollir **30 places al CIBE**, que és un centre d'esta fundació. Me
      veig en l'obligació de contar-los que **al CIBE no es pot donar l'atenció del Carme**. Pel CIBE
      passen cada dia prop de 100 persones durant el dia i ara 30 per la nit. Al Carme érem **dos professionals
      en tot moment per torn per a 11 usuaris**. Realitzàvem gestions administratives, acompanyaments
      mèdics, **suport emocional**. Suport emocional, molt important. Quan hi ha 11 persones i dos persones
      per a atendre-les no es dilueix. **Estem tractant amb persones, no amb números**. Jo entenc que
      econòmicament això no quadrava. Li vaig dir a la representant de l'Ajuntament que va vindre que
      deia que això no era política, **és política**. I que es queixava que Compromís no havia vingut
      en estos anys. A mi el que m'importa és que **posaren els diners** i que estes persones, jo ja tinc
      treball, els meus companys trobaran treball, no és greu pels treballadors, però **estes persones
      s'han quedat al carrer moltes**, com s'estan quedant els dels assentaments. I una altra diferència,
      la **titularitat del CIBE és privada**, la del Carme era pública. I això és una **manera de rentar-se
      les mans** i el que passe deixa de ser problema nostre. Per últim, vaig a acabar ja, però m'agradaria
      recordar-me d'Eduardo Galeano quan va parlar dels **invisibles**. Els puc assegurar a tots i a totes
      que **no són invisibles**. Estic parlant d'**Alí, de Jonji, de Jaime, d'un altre Jaime, de Chelo**.
      **Totes estes persones van morir** i sempre van tindre molt clar que podien tornar, i quan no estaven
      allotjats tornaven a la porta. Això no ho tindran altres centres. Això era el Carme i era una cosa
      molt bonica. Els asseguro que era molt bonic que sentiren persones que no han tingut res, que tinguen
      un lloc on rebre una abraçada. I era una de les coses que més valoraven. Les valoracions que es
      feien no eren l'espai, que l'espai era una porqueria, és veritat, no complia les condicions, però
      el que rebien allí això ho han perdut. I molta gent que s'ha sentit orfa i que ha plorat a la porta
      nostra quan s'ha assabentat que tancàvem. Moltes gràcies.
