- iv_id: 2024-03-27-001
  fields:
    text_original: 'Muchas gracias, alcaldesa.

      Como bien ha dicho, soy **Pablo Bottero**, el nuevo **presidente del Consejo de la Juventud**, nombrado
      hace apenas **48 horas**, aunque llevo dos años trabajando en la Comisión Permanente. Intervengo
      en este Pleno para retomar un tema que consideramos histórico, que es la **inclusión del Consejo
      de la Juventud de València en el Consejo Social de la Ciudad**. En el caso de que haya alguna persona
      que no conozca lo que es el Consejo, representamos a **más de 40 entidades juveniles**, desde grupos
      scouts a entidades políticas, estudiantiles o religiosas. Entre muchas otras, como grupos de deporte,
      ocio, tiempo libre. Pero no somos una asociación más. Somos la **plataforma que la ley reconoce**
      como interlocutora válida entre las administraciones públicas, ustedes, y las personas jóvenes de
      la ciudad.

      Y es por eso que consideramos una **anomalía democrática** que el Consejo de la Juventud de València
      no forme parte de este órgano. Nosotros y nosotras tenemos la **firme voluntad de trabajar** con
      todos ustedes para que esto cambie durante la actual legislatura. Porque hacernos formar parte del
      Consejo Social será un **gesto significativo de compromiso con la juventud** y apoya la acción que
      hacemos desde el Consejo. Porque los problemas de la gente joven son los problemas de toda la ciudad.
      Porque cualquiera de las políticas que ustedes hagan en esta ciudad nos van a afectar. Porque la
      **apatía política** de las personas a las que hoy represento solo se resuelve promoviendo su **participación
      activa** en los asuntos públicos, acercando las instituciones y la toma de decisiones para que las
      vean como propias.

      Y esto es algo que la **legislación vigente establece** claramente como una obligación de los poderes
      públicos. Pero además, no es solo un derecho, sino también una obligación y una necesidad para el
      **desarrollo sostenible** de nuestra ciudad. Necesitamos personas jóvenes que sientan que esto también
      les pertenece, que no es solo algo de las altas esferas. Porque **dar voz y visibilidad** al Consejo
      es dársela a toda la diversidad de jóvenes que representamos y a quienes nos debemos.

      Por último, pedimos a aquellos y aquellas que en su día estuvieron en nuestra posición, y que hoy
      tenéis el privilegio de poder estar aquí en este Pleno defendiendo a toda la ciudadanía, **especial
      consideración** con nuestra propuesta. Por último, ah, no está, a la **nueva concejala** le pedimos
      **colaboración**, una mayor fluidez en la comunicación para lograr de manera conjunta un Consejo
      fuerte y que toda la ciudadanía, y no solo las personas jóvenes, reconozcan.

      Muchas gracias.'
    text_val: 'Moltes gràcies, alcaldessa.

      Com bé ha dit, soc **Pablo Bottero**, el nou **president del Consell de la Joventut**, nomenat fa
      tot just **48 hores**, encara que porte dos anys treballant en la Comissió Permanent. Intervinc
      en este Ple per a reprendre un tema que considerem històric, que és la **inclusió del Consell de
      la Joventut de València en el Consell Social de la Ciutat**. En el cas que hi haja alguna persona
      que no conega què és el Consell, representem a **més de 40 entitats juvenils**, des de grups scouts
      a entitats polítiques, estudiantils o religioses. Entre moltes altres, com grups d''esport, oci,
      temps lliure. Però no som una associació més. Som la **plataforma que la llei reconeix** com a interlocutora
      vàlida entre les administracions públiques, vostés, i les persones joves de la ciutat.

      Y és per això que considerem una **anomalia democràtica** que el Consell de la Joventut de València
      no forme part d''este òrgan. Nosaltres tenim la **ferma voluntat de treballar** amb tots vosaltres
      perquè això canvie durant la legislatura actual. Perquè fer-nos formar part del Consell Social serà
      un **gest significatiu de compromís amb la joventut** i donarà suport a l''acció que fem des del
      Consell. Perquè els problemes de la gent jove són els problemes de tota la ciutat. Perquè qualsevol
      de les polítiques que vosaltres feu en esta ciutat ens afectaran. Perquè la **apatia política**
      de les persones a les que hui represente només es resol promovent la seua **participació activa**
      en els assumptes públics, acostant les institucions i la presa de decisions perquè les vegen com
      a pròpies.

      Y això és una cosa que la **legislació vigent estableix** clarament com una obligació dels poders
      públics. Però a més, no és només un dret, sinó també una obligació i una necessitat per al **desenvolupament
      sostenible** de la nostra ciutat. Necessitem persones joves que sentin que això també els pertany,
      que no és només una cosa de les altes esferes. Perquè **donar veu i visibilitat** al Consell és
      donar-la a tota la diversitat de joves que representem i a qui ens devem.

      Finalment, demanem a aquells i aquelles que en el seu dia van estar en la nostra posició, i que
      hui teniu el privilegi de poder estar ací en este Ple defenent a tota la ciutadania, **especial
      consideració** amb la nostra proposta. Finalment, ah, no està, a la **nova regidora** li demanem
      **col·laboració**, una major fluïdesa en la comunicació per a aconseguir de manera conjunta un Consell
      fort i que tota la ciutadania, i no sols les persones joves, reconeguen.

      Moltes gràcies.'
