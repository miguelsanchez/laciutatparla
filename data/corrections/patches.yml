  fields:
    text_cas: ''
    text_original: 'Moltes gràcies.

      Ilustrísima alcaldesa. Señoras y señores concejales.

      Comparecemos hoy en representación de **más de 29 comunidades de propietarios** y aproximadamente
      un millar de vecinos y vecinas del **barrio de Russafa**. Pero no venimos solo a hablar de un conflicto
      puntual en las calles Puerto Rico, Filipinas, Pintor Gisbert y Cuba. Venimos a trasladar una preocupación
      estructural que comparten miles de familias en toda València, la **turistificación intensiva**,
      la **proliferación de alojamientos en patios de manzana** y el impacto de este modelo en nuestra
      salud y nuestra supervivencia como ciudad.

      El diagnóstico es el de un **planeamiento del siglo pasado**. València ha cambiado profundamente,
      pero nuestro marco urbanístico, el **Plan General de Ordenación Urbanística**, sigue siendo el de
      **1988**. Es un plan diseñado para una realidad que ya no existe. Hoy nos enfrentamos a una **emergencia
      climática** sin precedentes, a una **crisis de vivienda** que expulsa a nuestros jóvenes y a una
      **presión turística** que está canibalizando el tejido residencial. Un ejemplo alarmante es el **macroproyecto
      previsto en el corazón de Russafa** de **34 viviendas turísticas** y 61 plazas de garaje en dos
      sótanos, justo debajo de las viviendas, en el interior de una manzana consolidada. No es una actuación
      aislada, es un síntoma de un modelo que, de consolidarse, transformará irreversiblemente la identidad
      de nuestros barrios. Por ello, pedimos una **revisión integral y urgente** de este planeamiento.

      El **patio de manzana es una infraestructura**, no un solar. Debemos ser claros, es un concepto
      fundamental. El patio de manzanas no es un vacío edificable pendiente de explotación económica sino
      una infraestructura ambiental, al servicio de la ciudad. Estos espacios fueron concebidos en el
      Ensanche valenciano para garantizar la **ventilación cruzada**, la **iluminación natural** y el
      descanso de los vecinos. Son el pulmón interior de nuestras casas. Transformarlos en **núcleos turísticos
      de alta rotación**, con viviendas terraza y eventos genera **ruido constante** y pérdida de privacidad.
      Además, la edificación masiva en estos patios incrementa las **islas de calor** y dificulta el control
      municipal al ser ámbitos no visibles desde la vía pública. Lo que hoy es un espacio de respiro,
      mañana puede ser un foco de saturación invivible.

      Además, la **salud pública** es un eje que no es negociable. La salud urbana no es un concepto abstracto.
      Se mide en la calidad del aire y en las horas de sueño de los vecinos, por ejemplo. La implantación
      de estos macrocomplejos turísticos conlleva **ruido crónico** por la alta rotación y el ocio asociado
      que provocan **insomnio, estrés e hipertensión**. Patologías que además agravan patologías ya presentes,
      generan patologías nuevas, ya sea de índole orgánico o de salud mental. Yo soy médico y lo veo todos
      los días en mi consulta en el barrio de Ruzafa.

      Contaminación. El aumento del tráfico y la creación de parkings privados incrementan las **emisiones
      en zonas ya tensionadas**.

      Deterioro social. La **expulsión de residentes** genera inseguridad residencial y pérdida de las
      redes de apoyo vecinal, afectando directamente a la salud mental de la población. La ciudad deja
      de ser un lugar para vivir para convertirse en un producto de consumo.

      Y se trata de una **emergencia climática y de resiliencia**. València es especialmente vulnerable,
      como sabemos, a **olas de calor** y episodios meteorológicos extremos. La planificación urbana actual
      debe priorizar **movilidad sostenible** y **edificación bioclimática**.

      La construcción turística intensiva en patios de manzana contradice todos estos principios y aumenta
      nuestra vulnerabilidad. No podemos seguir autorizando proyectos basados en parámetros de 1988 cuando
      el escenario climático de **2026** nos exige soluciones radicalmente distintas.

      ¿Y cuáles son nuestras solicitudes, señoras y señores concejales? Este no es un debate contra el
      turismo, sino sobre **qué ciudad queremos ser**.

      Por todo, lo expuesto solicitamos a este Ayuntamiento una **revisión inmediata del Plan General
      de Ordenación Urbanística** con la incorporación transversal de criterios de **turistificación,
      cambio climático y salud pública**. La **protección de los patios de manzana**. **Prohibir su explotación**
      como alojamientos temporales o fórmulas camufladas como coworking, coliving, flexliving. La **moratoria
      de viviendas temporales**, el **cese de nuevas licencias** en toda la ciudad hasta que el nuevo
      marco regulador esté vigente y con carácter retroactivo. Y la **participación ciudadana real**.
      Que las entidades vecinales y expertos formen parte activa de este proceso de cambio.

      El interior de una manzana no es un solar, es un **sistema ambiental compartido**, es patrimonio
      de los vecinos, es ciudad. Y la ciudad, señoras y señores, pertenece a los vecinos y vecinas de
      cada barrio. Salió en prensa que **València es una de las 20 mejores ciudades del mundo para vivir**
      y lo que queremos es que también lo sea para los vecinos.

      Gracias.'
