- iv_id: 2021-03-25-003
  fields:
    text_original: 'Buenos días otra vez y aprovechando que prácticamente se han tocado los mismos temas
      en los dos puntos me gustaría hacer **tres puntualizaciones**. Primera, los **títulos de familia
      numerosa** a día de hoy, esta mañana que ha llegado uno, son del **23 de enero**. Por lo tanto,
      estamos hablando de **menos de dos meses** de renovación y las altas nuevas en una semana y media.
      Estamos en plazo.


      Segundo, matizar por qué el **decreto de monoparentales** va con sí y el de **familia numerosa**
      va con no. Porque la **Ley de Protección a la Familia Numerosa, la 40/2003**, dice que si han pasado
      tres meses la respuesta es negativa y el **Decreto de Monoparentalidad** que hizo el Consell dijeron
      específicamente para que no haya atascos y penalidades que sea afirmativo. Ese es el motivo por
      el que uno es no y otro es sí. Para solventar el problema de las familias numerosas con la Ley 40/2003
      se creó la **prórroga de título** de familia numerosa de tal manera que no perdemos la condición
      de familia numerosa en ningún momento mientras se esté renovando, no se puede hacer para las altas
      nuevas.


      Tercero, por favor, las familias numerosas que cobren **80.000 euros** que me avisen porque ni de
      broma. Normalmente los ingresos medios estamos hablando de las muy ventajosas a lo mejor **1.900-2.300
      euros al mes** y no todas las familias numerosas tienen dos progenitores trabajando. El **45 % de
      las familias numerosas** solo ingresan un sueldo y de ese 45 % el **60 % son familias monoparentales**,
      ostentadas por un único progenitor.


      Precisamente las **familias numerosas somos diversísimas**. Creo que he hablado con todos los aquí
      presentes, con todos los grupos al menos. Creo que no me quedo ninguno. Sí, PSOE no he hablado.
      Explicando una cosa es por progenitores, parentales y otra cosa es por hijos. Las familias numerosas
      lo somos, somos **familias numerosas y monoparentales**, no o. Las necesidades son completamente
      diferentes. Lo que hay que propiciar es una **ley específica de monoparentalidad**, al igual que
      hay una ley específica de familias numerosas. Y esto ya se está tratando a tema nacional, estamos
      enmunicipio.


      Es que me animo, lo siento, quería dejar esos puntos muy claros. Efectivamente, ya hay muchas, me
      he puesto nerviosa, hay muchas cosas que ya se están tocando. El tema del Consell por ejemplo puedo
      decirlo con tantísima exactitud porque **mensualmente nos reunimos** por videoconferencia con **José
      del Amo**, el director general de Diversidad, y precisamente **FANUCOVA** y las asociaciones hemos
      estado **codo a codo** con él y es una cosa de la que nos vanagloriamos porque hemos dejado al margen
      todo tipo, aquí somos todas lo mismo, familias numerosas y vamos a muerte. Entonces, se han bajado
      los tiempos, han llegado nuevos técnicos que están aligerando, hemos propuesto, a propuesta nuestra
      ya no se renueva los de especial cada año sino que se amplía, igual que en la **tarjeta de transporte
      metropolitano** queremos que no sea anual, que sea a vigencia del título de familia numerosa, sería
      también una cosa a tratar por parte de todos.


      Efectivamente, la **vivienda**. La vivienda, el **Decreto de la Generalitat de 2007** dice que las
      familias numerosas tenemos **120 m2** en vivienda y que se ampliarán **20 m2 por cada miembro**.
      Significa que un miembro tiene derecho como mínimo a 20 m2. Lógicamente, una casa de 120 o de 140
      o de 150 m2 no vale lo mismo que un apartamento de 80-90. Entonces, ahí sí pediría a este Pleno
      que acomoden el **criterio de metros cuadrados**. Ya lo hice **hace tres años** cuando discutimos
      lo del IBI y sigo pidiendo lo mismo, **renta per cápita**, renta por metros cuadrados. Porque además
      todos los aquí presentes han dicho lo mismo con diferentes palabras, ahora simplemente es plasmarlo.
      El que todos peleen, peleen pero vayan a una. Que rememos todos en la misma dirección.


      Y que muchísimas gracias por darme y darnos a **FANUCOVA** la oportunidad de volver a hablar en
      este Pleno.'
    text_val: 'Bon dia un''altra vegada i aprofitant que pràcticament s''han tocat els mateixos temes
      en els dos punts, m''agradaria fer **tres puntualitzacions**. Primera, els **títols de família nombrosa**
      a dia d''hui, aquest matí n''ha arribat un, són del **23 de gener**. Per tant, estem parlant de
      **menys de dos mesos** de renovació i les altes noves en una setmana i mitja. Estem en termini.


      Segon, matisar per què el **decret de monoparentals** va amb sí i el de **família nombrosa** va
      amb no. Perquè la **Llei de Protecció a la Família Nombrosa, la 40/2003**, diu que si han passat
      tres mesos la resposta és negativa i el **Decret de Monoparentalitat** que va fer el Consell van
      dir específicament perquè no hi haja embussos i penalitats que siga afirmatiu. Eixe és el motiu
      pel qual l''un és no i l''altre és sí. Per a solucionar el problema de les famílies nombroses amb
      la Llei 40/2003 es va crear la **pròrroga de títol** de família nombrosa de tal manera que no perdem
      la condició de família nombrosa en cap moment mentre s''estiga renovant, no es pot fer per a les
      altes noves.


      Tercer, per favor, les famílies nombroses que cobren **80.000 euros** que m''avisen perquè ni de
      broma. Normalment els ingressos mitjans estem parlant de les molt avantatjoses potser **1.900-2.300
      euros al mes** i no totes les famílies nombroses tenen dos progenitors treballant. El **45 % de
      les famílies nombroses** només ingressen un sou i d''eixe 45 % el **60 % són famílies monoparentals**,
      ostentades per un únic progenitor.


      Precisament les **famílies nombroses som diversíssimes**. Crec que he parlat amb tots els presents
      aquí, amb tots els grups almenys. Crec que no me''n deixe cap. Sí, PSOE no he parlat. Explicant
      una cosa és per progenitors, parentals i una altra cosa és per fills. Les famílies nombroses ho
      som, som **famílies nombroses i monoparentals**, no o. Les necessitats són completament diferents.
      El que cal propiciar és una **llei específica de monoparentalitat**, igual que hi ha una llei específica
      de famílies nombroses. I això ja s''està tractant com a tema nacional, estem en municipi.


      És que m''animo, ho sent, volia deixar eixos punts molt clars. Efectivament, ja n''hi ha moltes,
      m''he posat nerviosa, hi ha moltes coses que ja s''estan tocant. El tema del Consell per exemple
      ho puc dir amb tanta exactitud perquè **mensualment ens reunim** per videoconferència amb **José
      del Amo**, el director general de Diversitat, i precisament **FANUCOVA** i les associacions hem
      estat **braç a braç** amb ell i és una cosa de la qual ens vanagloriem perquè hem deixat al marge
      tot tipus, ací som totes el mateix, famílies nombroses i anem a mort. Llavors, s''han abaixat els
      temps, han arribat nous tècnics que estan aligerint, hem proposat, a proposta nostra ja no es renova
      els d''especial cada any sinó que s''amplia, igual que en la **targeta de transport metropolità**
      volem que no siga anual, que siga a vigència del títol de família nombrosa, seria també una cosa
      a tractar per part de tots.


      Efectivament, l''**habitatge**. L''habitatge, el **Decret de la Generalitat de 2007** diu que les
      famílies nombroses tenim **120 m2** en habitatge i que s''ampliaran **20 m2 per cada membre**. Significa
      que un membre té dret com a mínim a 20 m2. Lògicament, una casa de 120 o de 140 o de 150 m2 no val
      el mateix que un apartament de 80-90. Llavors, ací sí que demanaria a este Ple que acomoden el **criteri
      de metres quadrats**. Ja ho vaig fer **fa tres anys** quan vam discutir el de l''IBI i continue
      demanant el mateix, **renda per càpita**, renda per metres quadrats. Perquè a més tots els presents
      han dit el mateix amb diferents paraules, ara simplement és plasmar-ho. Que tots lluiten, lluiten
      però vagen a una. Que remem tots en la mateixa direcció.


      I moltíssimes gràcies per donar-me i donar-nos a **FANUCOVA** l''oportunitat de tornar a parlar
      en este Ple.'
    resum_val: La representant de FANUCOVA fa tres puntualitzacions sobre els tràmits de famílies nombroses
