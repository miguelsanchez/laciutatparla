    text_cas: ''
    text_val: 'Bon dia a totes.


      Volc solament recordar ràpidament que soc el **vicepresident del Consell Local d''Immigració i Interculturalitat**
      de la ciutat de València.


      En primer lloc, **enhorabona a l''Ajuntament de València 2015-2019** per ser una de les **locomotores
      de les ciutats europees en matèria de polítiques inclusives**. Recordem que este pla ha sigut un
      **estudi diagnòstic dissenyat mitjançant un procés participatiu**. Constituïx una proposta concreta
      i pormenoritzada, ha sigut debatut pels diferents actors socials que han fet possible **un consens
      molt ampli**.


      Podem recordar que, segons Paco Torres, **el 16,7 % del veïnat valencià és d''origen estranger**.
      La població valenciana era en 2016 de 790.201 habitants, són un total de 131.754 estrangers. Este
      nou pla va a **millorar l''acollida i facilitar la inclusió, fomentarà la igualtat i promocionarà
      l''equitat**. Té diverses mesures com ara **la creació d''una taula transversal d''immigració, una
      oficina antidiscriminació**.


      Cal recordar que hi ha ací **una minoria com els manters i les empleades de la llar que viu en clar
      risc d''exclusió**. En eixe aspecte vull aclarir que **els manters no perjudiquen al petit comerç**.
      **El comerç tradicional l''amenaça el comerç electrònic, les grans superfícies com Ikea, Amazon,
      Primark**.


      Un dels principals bulos contra els manters és que **perjudiquen l''economia del comerç tradicional**.
      **Hem d''acabar amb el cercle de l''exclusió**. La escassa transcendència econòmica de **operacions
      de venda al carrer, realitzades normalment per persones de molt precàries mitjanes econòmics, en
      la seua majoria immigrants estrangers**. No revesteixen la gravetat suficient.


      Ningú en el seu sà juí pot pensar que **una persona sense papers que ven en un llençol còpies de
      les samarretes del Real Madrid** pot causar perjudici econòmic. **Són mercats absolutament paral·lels**.


      **Les dinàmiques més potents d''exclusió es deriven del racisme social i institucional. Sobreviure
      no és delicte.**


      El **Pla d''Immigració 2019-2020** aconseguirà la **plena inclusió dels veïns d''origen migrant**
      basada en **la igualtat i no discriminació, el reconeixement de la diversitat**.


      Moltes gràcies.'
