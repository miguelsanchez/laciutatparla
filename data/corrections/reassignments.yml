# Floor-cession re-attributions.
# When an entity yielded their speaking time to another entity,
# Claude attributes the speech to the registered entity. These entries correct that.
#
# entitat / entitat_id: the REGISTERED entity — stays canonical and counts in all
#   aggregates (entity totals, maps, top entities, mandates).
# entitat_cessio (optional): the organisation the speaker actually represented.
#   Display-only mention, never counted. Fields:
#     nom_cas, nom_val  — required, shown as "en nombre de …" / "en nom de …"
#     entitat_id        — optional; when it resolves to a catalog entity the
#                         mention is rendered as a link, otherwise as plain text.

